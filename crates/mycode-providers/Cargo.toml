[package]
name = "mycode-providers"
description = "First-party provider runtime: wire-protocol adapters over an injectable SSE transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot.workspace = true
mycode-core = { path = "../mycode-core" }
mycode-config = { path = "../mycode-config" }
bytes.workspace = true
reqwest = { workspace = true, features = ["json", "form"] }
# The same matcher reqwest's `system-proxy` detection uses; it tells a hop
# whether the environment or OS proxy covers its host. Both are already in
# the dependency graph through reqwest.
http = "1.5.0"
hyper-util = { version = "0.1.21", default-features = false, features = [
    "client-proxy",
    "client-proxy-system",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true

[lints]
workspace = true
