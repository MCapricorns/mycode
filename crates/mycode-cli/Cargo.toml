[package]
name = "mycode-cli"
description = "Terminal frontend for MYCode: same shared backend and product layer as the desktop, rendered with ratatui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mycode-app = { path = "../mycode-app" }
mycode-config = { path = "../mycode-config" }
mycode-core = { path = "../mycode-core" }
mycode-frontend = { path = "../mycode-frontend" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
# Maintained fork with the same API that tracks ratatui 0.30; the dependency
# key stays `tui-textarea` so `use tui_textarea::…` is unchanged.
tui-textarea = { package = "tui-textarea-2", version = "0.13.2" }
base64.workspace = true
# The global allocator (mimalloc) and VC-LTL link live in the leaf crates
# mycode-core / mycode-config so every target in the workspace shares them;
# nothing is declared here on purpose.

[target.'cfg(windows)'.dependencies]
# Clipboard pictures: a device-independent bitmap is decoded and re-encoded as
# PNG, the one format every provider accepts and that keeps alpha.
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "mycode-cli"
path = "src/main.rs"

[lints]
workspace = true
