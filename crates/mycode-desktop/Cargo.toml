[package]
name = "mycode-desktop"
description = "GPUI desktop frontend for MYCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot.workspace = true
# Sync primitives only: the git watcher and status threads hand results to
# the gpui executor through tokio channels, which are runtime-independent.
tokio = { workspace = true, features = ["sync"] }
# Fenced code in TextView renders without syntax colors: the
# `tree-sitter-languages` grammars were dropped to halve the binary. This
# crate does not depend on tree-sitter itself. gpui-kit is the GUI framework
# and stays in this binary only: gpui-base 0.7.1 links the smol runtime as a
# non-optional native dependency (no feature drops it), so the desktop
# binary carries smol beside tokio. Every other workspace crate is tokio-only.
gpui-kit = "0.7.1"
notify = "8.2.0"
chrono.workspace = true
mycode-app = { path = "../mycode-app" }
mycode-config = { path = "../mycode-config" }
mycode-providers = { path = "../mycode-providers" }
mycode-tools = { path = "../mycode-tools" }
# Global allocator: mimalloc's page-aligned segments and per-thread free
# lists cut the steady-state RSS the default Windows allocator grows into
# for a GUI workload (many small, churned strings and elements per frame).
mimalloc = "0.1.52"

[features]
# Headless GPUI layout tests. Off for the normal desktop build.
test-support = ["gpui-kit/test-support"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
] }
# VC-LTL redirects the C runtime onto the OS-builtin msvcrt.dll/ucrtbase.dll,
# so the release binary drops the VCRUNTIME140/ucrt DLL dependency and
# shrinks. A normal dependency (not a build one): its build script exports
# the bundled .lib search path to the final link.
vc-ltl = "5.3.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "mycode-desktop"
path = "src/main.rs"

[lints]
workspace = true
