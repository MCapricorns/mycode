[package]
name = "mycode-desktop"
description = "GPUI desktop frontend for MYCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot.workspace = true
# Sync primitives only: the git watcher and status threads hand results to
# the gpui executor through tokio channels, which are runtime-independent.
tokio = { workspace = true, features = ["sync"] }
# Fenced code is colored by mycode-frontend's lightweight lexer, not
# tree-sitter: the `tree-sitter-languages` grammars were dropped to halve
# the binary. This crate does not depend on tree-sitter itself. gpui-kit is
# the GUI framework
# and stays in this binary only: gpui-base 0.8 links the smol runtime as a
# non-optional native dependency (no feature drops it), so the desktop
# binary carries smol beside tokio. Every other workspace crate is tokio-only.
gpui-kit = "0.8.0"
chrono.workspace = true
base64.workspace = true
# The clipboard hands a Windows screenshot over as a bitmap; providers take
# PNG, so the picture is decoded and re-encoded before it is attached.
image.workspace = true
mycode-app = { path = "../mycode-app" }
mycode-config = { path = "../mycode-config" }
mycode-core = { path = "../mycode-core" }
mycode-frontend = { path = "../mycode-frontend" }
mycode-providers = { path = "../mycode-providers" }
mycode-tools = { path = "../mycode-tools" }
# The global allocator (mimalloc) and VC-LTL link live in the leaf crates
# mycode-core / mycode-config so every target in the workspace shares them;
# nothing is declared here on purpose.

[features]
# Headless GPUI layout tests. Off for the normal desktop build.
test-support = ["gpui-kit/test-support"]

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "mycode-desktop"
path = "src/main.rs"

[lints]
workspace = true
