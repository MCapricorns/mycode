[package]
name = "mycode-desktop"
description = "GPUI desktop frontend for MYCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot.workspace = true
# Sync primitives only; channels are runtime-independent.
tokio = { workspace = true, features = ["sync"] }
# gpui-kit stays in this binary only; it links the smol runtime beside
# tokio. Fenced code is colored by mycode-frontend's lexer, not tree-sitter.
gpui-kit = "0.8.0"
chrono.workspace = true
base64.workspace = true
# Clipboard bitmaps are re-encoded to PNG for providers.
image.workspace = true
mycode-frontend = { path = "../mycode-frontend" }
[features]
# Headless GPUI layout tests. Off for the normal desktop build.
test-support = ["gpui-kit/test-support"]

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "mycode-desktop"
path = "src/main.rs"

[lints]
workspace = true
