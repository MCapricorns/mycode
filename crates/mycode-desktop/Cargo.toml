[package]
name = "mycode-desktop"
description = "GPUI desktop frontend for MYCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Sync primitives only: the git watcher and status threads hand results to
# the gpui executor through tokio channels, which are runtime-independent.
tokio = { workspace = true, features = ["sync"] }
# Fenced code in TextView renders without syntax colors: the
# `tree-sitter-languages` grammars were dropped to halve the binary. This
# crate does not depend on tree-sitter itself. gpui-kit is the GUI framework
# and stays in this binary only: gpui-base 0.7.1 links the smol runtime as a
# non-optional native dependency (no feature drops it), so the desktop
# binary carries smol beside tokio. Every other workspace crate is tokio-only.
gpui-kit = "0.7.1"
notify = "8.2.0"
mycode-app = { path = "../mycode-app" }
mycode-config = { path = "../mycode-config" }
mycode-providers = { path = "../mycode-providers" }
mycode-tools = { path = "../mycode-tools" }

[features]
# Headless GPUI layout tests. Off for the normal desktop build.
test-support = ["gpui-kit/test-support"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "mycode-desktop"
path = "src/main.rs"

[lints]
workspace = true
