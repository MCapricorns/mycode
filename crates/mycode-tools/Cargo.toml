[package]
name = "mycode-tools"
description = "MYCode tool trait, registry, and builtin tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot.workspace = true
mycode-providers = { path = "../mycode-providers" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
# `net` exposes `AsyncFd` for the macOS child-pipe readers.
tokio = { workspace = true, features = ["fs", "io-util", "net", "process"] }
schemars.workspace = true
tokio-util.workspace = true
globset.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
regex.workspace = true
aho-corasick.workspace = true
memchr.workspace = true
jsonschema.workspace = true
blake3.workspace = true
rquickjs.workspace = true
# `catch_unwind` on the code-mode dispatcher future: a panicking tool must
# still settle its cell rather than leave it Running forever.
futures-util = { workspace = true, features = ["std"] }
sha2.workspace = true
uuid.workspace = true

# Process-group kill, no-follow opens, and rustix `fs` (openat2/renameat*/linkat).
[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Win32_Globalization",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
