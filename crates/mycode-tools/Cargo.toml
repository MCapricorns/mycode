[package]
name = "mycode-tools"
description = "MYCode tool trait, registry, and builtin tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mycode-core = { path = "../mycode-core" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
# `net` exposes `tokio::io::unix::AsyncFd`. The macOS spawn path reads the
# child pipes through it. `process` does not enable that module, and reqwest
# only does so when the app crate is in the same build.
tokio = { workspace = true, features = ["fs", "io-util", "net", "process"] }
schemars.workspace = true
tokio-util.workspace = true
globset.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
regex.workspace = true
aho-corasick.workspace = true
memchr.workspace = true
jsonschema.workspace = true
blake3.workspace = true
sha2.workspace = true
uuid.workspace = true
# Grammar crates for the edit tool's `ast` operations. Version requirements
# mirror gpui-component 0.7.1 (the desktop GUI's grammar source), so a
# mycode-desktop build unifies on one locked version per grammar instead of
# compiling each grammar twice. tree-sitter is pinned exactly because it has
# `links = "tree-sitter"` and gpui-component 0.7.1 requires ^0.26.13, so a
# second core version cannot be linked beside it.
tree-sitter = "=0.26.13"
tree-sitter-astro-next = "0.1.1"
tree-sitter-bash = "0.23.3"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.23.2"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3"
tree-sitter-embedded-template = "0.23.0"
tree-sitter-go = "0.23.4"
tree-sitter-graphql = "0.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-jsdoc = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.4.1"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.1"
tree-sitter-php = "0.24.2"
tree-sitter-proto = "0.2.0"
tree-sitter-python = "0.23.6"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.23.4"
tree-sitter-sequel = "0.3.8"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-swift = "0.7.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.1"
tree-sitter-zig = "1.1.2"

# Unix-only: terminate the platform shell's process group, perform
# handle-relative no-follow opens for grep/find, and drive the file IO
# kernel through rustix 1.1.4 `fs` (openat2/openat/renameat*/linkat).
[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Win32_Globalization",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
