[package]
name = "mycode-frontend"
description = "UI-agnostic product layer for the MYCode desktop app: view-model state machine, i18n, git status, launch arguments"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mycode-app = { path = "../mycode-app" }
serde_json.workspace = true
# Sync primitives and executor-agnostic reply futures only.
tokio = { workspace = true, features = ["sync", "time"] }
# Filesystem events that keep the open folder's git status fresh.
notify = "8.2.0"
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization"] }

[lints]
workspace = true
