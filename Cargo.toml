[workspace]
resolver = "3"
members = [
    "crates/mycode-core",
    "crates/mycode-config",
    "crates/mycode-providers",
    "crates/mycode-tools",
    "crates/mycode-agent",
    "crates/mycode-app",
    "crates/mycode-frontend",
    "crates/mycode-desktop",
    "crates/mycode-cli",
]
# mod.rs is legacy module layout; modern foo.rs + foo/ is enforced.
[workspace.lints]
clippy.mod_module_files = "deny"

[workspace.package]
version = "0.12.2"
edition = "2024"
license = "Apache-2.0"

# Single source of truth for shared dependency versions.
# Crates opt in via `dep.workspace = true` and may add features locally.
[workspace.dependencies]
# `rc` serializes `Arc<T>`. Requests share `Arc<Message>` and `Arc<[ToolSpec]>`;
# without it the provider size check cannot encode a request.
serde = { version = "1.0.229", features = ["derive", "rc"] }
# preserve_order: JSON objects keep declaration order in every build; tool
# schemas and settings documents render their fields in a stable order, and
# gpui-pre only carried this feature into builds that linked the desktop UI
# toolkit.
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
base64 = "0.23.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time"] }
schemars = "1.2.2"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
# OS TLS (schannel on Windows, Security.framework on macOS). reqwest's
# default `rustls` feature also builds aws-lc-sys, a second full crypto
# library, on top of the OS stack these product targets already have.
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "native-tls",
    "socks",
    "stream",
    "system-proxy",
] }
bytes = "1.12.1"
tokio-util = "0.7.20"
# `join_all` over borrowed futures; already in the graph through reqwest.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
parking_lot = "0.12.5"
# Global allocator for every binary in the workspace (declared once, in
# mycode-core, so test targets get it too).
mimalloc = "0.1.52"
# MSVC builds link the OS-builtin ucrt/msvcrt instead of a bundled CRT. A
# normal dep of the leaf crates: its build script's link search propagates
# to every test target and the desktop binary.
vc-ltl = "5.3.1"
globset = "0.4.20"
ignore = "0.4.33"
# ripgrep's search core, linked in-process without an external executable.
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
regex = "1.13.1"
aho-corasick = "1.1.5"
memchr = "2.8.3"
jsonschema = { version = "0.58.6", default-features = false }
blake3 = "1.8.7"
libc = "0.2.190"
rustix = "1.1.5"
windows-sys = "0.61.2"
sha2 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = { version = "1.0.28", features = ["serde"] }
# Session grouping follows the user's local calendar, including DST boundaries.
chrono = "0.4.45"

# Disk-conscious dev profile: line tables keep backtraces useful while
# cutting debuginfo from multi-GiB full DWARF to a fraction.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"

# Maximum-performance release binaries: fat LTO across the whole workspace
# and a single codegen unit. Link time grows accordingly; CI release builds
# and local release builds both pay it once.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
