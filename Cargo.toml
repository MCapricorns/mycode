[workspace]
resolver = "3"
# The runtime owns application behavior; the desktop owns GPUI and native windows.
members = ["crates/mycode", "crates/mycode-desktop"]
# mod.rs is legacy module layout; modern foo.rs + foo/ is enforced.
[workspace.lints]
clippy.mod_module_files = "deny"

[workspace.package]
version = "0.12.40"
edition = "2024"
license = "Apache-2.0"

# Single source of truth for shared dependency versions.
[workspace.dependencies]
# `rc` serializes the Arc<T> values requests share.
serde = { version = "1.0.229", features = ["derive", "rc"] }
# preserve_order: stable field order in tool schemas and settings documents.
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
base64 = "0.23.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
schemars = "1.2.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
# OS TLS (schannel on Windows, Security.framework on macOS) instead of a second
# crypto library (aws-lc-sys) on top of the OS stack.
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "native-tls",
    "socks",
    "stream",
    "system-proxy",
] }
bytes = "1.12.1"
tokio-util = "0.7.20"
# `join_all` over borrowed futures; already in the graph through reqwest.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
parking_lot = "0.13.0"
# One allocator for the runtime, desktop binary, and test targets.
mimalloc = "0.1.52"
# MSVC builds link the OS-builtin CRT through the runtime.
vc-ltl = "5.3.1"
globset = "0.4.21"
ignore = "0.4.34"
# ripgrep's search core, linked in-process.
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
regex = "1.13.1"
aho-corasick = "1.1.5"
memchr = "2.8.3"
jsonschema = { version = "0.60.2", default-features = false }
blake3 = "1.8.7"
libc = "0.2.191"
rustix = "1.1.6"
windows-sys = "0.61.2"
sha2 = "0.11.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = { version = "1.0.28", features = ["serde"] }
# Clipboard bitmaps/TIFFs are re-encoded to PNG for providers.
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "png",
    "tiff",
] }
# Session grouping follows the user's local calendar, including DST boundaries.
chrono = "0.4.45"
# Embedded QuickJS runtime, created and used only on each script thread.
rquickjs = "0.14"
# BM25 ranking for the `tool_search` meta tool over the MCP catalog.
bm25 = "2.3.2"

# Disk-conscious dev profile: line tables keep backtraces useful without full DWARF.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"

# Maximum-performance release binaries; link time grows accordingly.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
