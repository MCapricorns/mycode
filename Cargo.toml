[workspace]
resolver = "3"
# Linear chain: core → config → providers → tools → agent → app → frontend → desktop.
# Each crate depends only on its predecessor and re-exports it (`pub use prev::*`),
# keeping every lower-layer API reachable and the allocator link covering all targets.
members = [
    "crates/mycode-core",
    "crates/mycode-config",
    "crates/mycode-providers",
    "crates/mycode-tools",
    "crates/mycode-agent",
    "crates/mycode-app",
    "crates/mycode-frontend",
    "crates/mycode-desktop",
]
# mod.rs is legacy module layout; modern foo.rs + foo/ is enforced.
[workspace.lints]
clippy.mod_module_files = "deny"

[workspace.package]
version = "0.12.29"
edition = "2024"
license = "Apache-2.0"

# Single source of truth for shared dependency versions.
[workspace.dependencies]
# `rc` serializes the Arc<T> values requests share.
serde = { version = "1.0.229", features = ["derive", "rc"] }
# preserve_order: stable field order in tool schemas and settings documents.
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
base64 = "0.23.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "sync", "time"] }
schemars = "1.2.3"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
# OS TLS (schannel on Windows, Security.framework on macOS) instead of a second
# crypto library (aws-lc-sys) on top of the OS stack.
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "native-tls",
    "socks",
    "stream",
    "system-proxy",
] }
bytes = "1.12.1"
tokio-util = "0.7.20"
# `join_all` over borrowed futures; already in the graph through reqwest.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
parking_lot = "0.12.5"
# Global allocator for every binary and test target; declared once in mycode-core.
mimalloc = "0.1.52"
# MSVC builds link the OS-builtin CRT; declared once in mycode-core.
vc-ltl = "5.3.1"
globset = "0.4.20"
ignore = "0.4.33"
# ripgrep's search core, linked in-process.
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
regex = "1.13.1"
aho-corasick = "1.1.5"
memchr = "2.8.3"
jsonschema = { version = "0.59.0", default-features = false }
blake3 = "1.8.7"
libc = "0.2.191"
rustix = "1.1.5"
windows-sys = "0.61.2"
sha2 = "0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = { version = "1.0.28", features = ["serde"] }
# Clipboard bitmaps/TIFFs are re-encoded to PNG for providers.
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "png",
    "tiff",
] }
# Session grouping follows the user's local calendar, including DST boundaries.
chrono = "0.4.45"
# Embedded code-mode scripting engine. `sync` is mandatory: the script runs on
# its own std::thread, so `rhai::Engine` must be Send (wiki/architecture/code-mode-engine.md §1).
rhai = { version = "1.27", features = ["serde", "sync"] }
# BM25 ranking for the `tool_search` meta tool over the MCP catalog.
bm25 = "2.3.2"

# Disk-conscious dev profile: line tables keep backtraces useful without full DWARF.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"

# Maximum-performance release binaries; link time grows accordingly.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
