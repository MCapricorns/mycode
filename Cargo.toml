[workspace]
resolver = "3"
members = [
    "crates/mycode-core",
    "crates/mycode-config",
    "crates/mycode-providers",
    "crates/mycode-tools",
    "crates/mycode-agent",
    "crates/mycode-app",
    "crates/mycode-desktop",
]
# mod.rs is legacy module layout; modern foo.rs + foo/ is enforced.
[workspace.lints]
clippy.mod_module_files = "deny"

[workspace.package]
version = "0.9.26"
edition = "2024"
license = "Apache-2.0"

# Single source of truth for shared dependency versions.
# Crates opt in via `dep.workspace = true` and may add features locally.
[workspace.dependencies]
# `rc` serializes `Arc<T>`. Requests share `Arc<Message>` and `Arc<[ToolSpec]>`;
# without it the provider size check cannot encode a request.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
async-channel = "2"
schemars = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
# OS TLS (schannel on Windows, Security.framework on macOS). reqwest's
# default `rustls` feature also builds aws-lc-sys, a second full crypto
# library, on top of the OS stack these product targets already have.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "native-tls",
    "stream",
    "system-proxy",
] }
futures-util = "0.3"
bytes = "1"
tokio-util = "0.7"
globset = "0.4"
ignore = "0.4"
# ripgrep's search core, linked in-process without an external executable.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
aho-corasick = "1"
memchr = "2"
jsonschema = { version = "0.52", default-features = false }
blake3 = "1"
libc = "0.2"
rustix = "1"
windows-sys = "0.61"
sha2 = "0.11"
getrandom = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = { version = "1", features = ["serde"] }

# Disk-conscious dev profile: line tables keep backtraces useful while
# cutting debuginfo from multi-GiB full DWARF to a fraction.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"

# Maximum-performance release binaries: fat LTO across the whole workspace
# and a single codegen unit. Link time grows accordingly; CI release builds
# and local release builds both pay it once.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
