<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="七个 crate 的分层：依赖只向下">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b95c9"/>
    </marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2238"/>
      <stop offset="1" stop-color="#151a2c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#0d1120"/>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',system-ui,sans-serif">
    <text x="48" y="58" fill="#ffffff" font-size="26" font-weight="700">架构：七个 crate，依赖只向下</text>
    <text x="48" y="88" fill="#8b95c9" font-size="16">上层可以调用下层，下层不知道上层存在。core 和 config 都是叶子，互不依赖。</text>

    <g fill="none" stroke="#8b95c9" stroke-width="2" marker-end="url(#arrow)">
      <path d="M600 192V222"/>
      <path d="M540 294L370 340"/>
      <path d="M660 294L830 340"/>
      <path d="M350 412V448"/>
      <path d="M350 520V574"/>
      <path d="M850 412V574"/>
      <g stroke-opacity="0.45" stroke-dasharray="6 6">
        <path d="M770 412L470 574"/>
        <path d="M430 412L740 574"/>
      </g>
    </g>

    <g>
      <rect x="380" y="120" width="440" height="72" rx="14" fill="url(#card)" stroke="#7c8cff" stroke-opacity="0.7"/>
      <text x="404" y="152" fill="#ffffff" font-size="19" font-weight="700" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">mycode-desktop</text>
      <text x="404" y="178" fill="#aab3e0" font-size="15">GPUI 窗口。纯函数视图模型，只画状态、收集点击</text>

      <rect x="380" y="222" width="440" height="72" rx="14" fill="url(#card)" stroke="#7c8cff" stroke-opacity="0.5"/>
      <text x="404" y="254" fill="#ffffff" font-size="19" font-weight="700" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">mycode-app</text>
      <text x="404" y="280" fill="#aab3e0" font-size="15">应用核：会话、回合、工具宿主、MCP、网页、更新</text>

      <rect x="130" y="340" width="440" height="72" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="154" y="372" fill="#ffffff" font-size="19" font-weight="700" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">mycode-agent</text>
      <text x="154" y="398" fill="#aab3e0" font-size="15">回合循环 + 会话账本（可恢复的提交）</text>

      <rect x="630" y="340" width="440" height="72" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="654" y="372" fill="#ffffff" font-size="19" font-weight="700" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">mycode-providers</text>
      <text x="654" y="398" fill="#aab3e0" font-size="15">三种协议适配、models.dev 目录、OAuth</text>

      <rect x="130" y="448" width="440" height="72" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="154" y="480" fill="#ffffff" font-size="19" font-weight="700" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">mycode-tools</text>
      <text x="154" y="506" fill="#aab3e0" font-size="15">工具 trait、注册表、进程内文件 / 搜索 / shell</text>

      <rect x="130" y="574" width="440" height="72" rx="14" fill="#141a2b" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="154" y="606" fill="#ffffff" font-size="19" font-weight="700" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">mycode-core</text>
      <text x="154" y="632" fill="#aab3e0" font-size="15">消息、事件、工具规格、Provider 端口（叶子）</text>

      <rect x="630" y="574" width="440" height="72" rx="14" fill="#141a2b" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="654" y="606" fill="#ffffff" font-size="19" font-weight="700" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">mycode-config</text>
      <text x="654" y="632" fill="#aab3e0" font-size="15">家目录与严格 JSON 文档，revision CAS（叶子）</text>
    </g>

    <g font-size="14" fill="#8b95c9">
      <line x1="880" y1="140" x2="920" y2="140" stroke="#8b95c9" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="932" y="145">直接依赖</text>
      <line x1="880" y1="170" x2="920" y2="170" stroke="#8b95c9" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="6 6"/>
      <text x="932" y="175">跨列依赖</text>
      <rect x="880" y="190" width="40" height="18" rx="5" fill="#141a2b" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="932" y="205">叶子 crate</text>
    </g>
  </g>
</svg>
