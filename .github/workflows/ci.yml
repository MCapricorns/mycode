# Single workflow for the product:
#
# 1. push/PR quality gate — rustfmt + clippy -D warnings, then the
#    `native_image_launches` exec smoke test, on the native product runners:
#      windows-latest  -> x86_64-pc-windows-msvc
#      windows-11-arm  -> aarch64-pc-windows-msvc
#      ubuntu-latest   -> x86_64-unknown-linux-gnu
#      macos-latest    -> aarch64-apple-darwin
#    Product gates are rustfmt, clippy, and that exec smoke test.
#    windows-latest is x64. Windows ARM64 uses the native windows-11-arm
#    image; it is not a cross-compile from windows-latest. Linux jobs
#    install the GPUI/fontconfig/Wayland/XCB packages in
#    .github/actions/linux-gpui-deps. The Linux core job also runs the
#    release-plan self-test. Ubuntu jobs compile and check only; they do
#    not build or upload a release archive.
#
# 2. release — a push to main whose quality gates passed publishes a new
#    GitHub Release. Pull requests do not publish. The tag is
#    `v<workspace version>` when that tag is free. When the tag already
#    exists, release-plan bumps the patch in Cargo.toml, Cargo.lock, and
#    CHANGELOG.md and tags that new version. The body is the matching
#    CHANGELOG section, not generated commit notes. Archives already
#    uploaded for the previous tag do not skip the release. The version
#    commit is pushed with GITHUB_TOKEN, which does not start another
#    workflow run.
#
# Assets produced per release (Windows x64, Windows ARM64, macOS Apple Silicon):
#   mycode-desktop-<tag>-x86_64-pc-windows-msvc.zip      (+ .sha256)
#   mycode-desktop-<tag>-aarch64-pc-windows-msvc.zip     (+ .sha256)
#   mycode-desktop-<tag>-aarch64-apple-darwin.zip        (+ .sha256)

name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. Pull requests cancel their previous run. Pushes to main
# wait, so a release tag and the binaries uploaded for it stay on one commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: windows-11-arm
            host: aarch64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
          - os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Check release planner
        if: runner.os == 'Linux'
        run: python3 .github/scripts/release_plan.py --self-test

      - name: Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gpui-deps

      # Formats every workspace member, including mycode-desktop.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: >
          cargo clippy -p mycode-core -p mycode-config -p mycode-providers
          -p mycode-tools -p mycode-agent -p mycode-app
          --all-targets --locked -- -D warnings

      - name: exec launches a program
        run: cargo test -p mycode-tools --lib native_image_launches --locked -- --nocapture

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: windows-11-arm
            host: aarch64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
          - os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup component add clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gpui-deps

      - name: cargo clippy
        run: cargo clippy -p mycode-desktop --all-targets --locked -- -D warnings

  release-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, desktop]
    name: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write lets this job push the patch bump. The push uses
    # GITHUB_TOKEN, so it does not start a second workflow run.
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
      sha: ${{ steps.plan.outputs.sha }}
      cleanup_ref: ${{ steps.plan.outputs.cleanup_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Choose a new release tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags origin 'refs/tags/v*' > /tmp/remote-tags.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' > /tmp/release-tags.txt
          # Pass the subject through the environment. A commit subject can
          # contain quotes or command substitutions; the shell must not
          # expand it again on the python command line.
          export MYCODE_RELEASE_SUBJECT MYCODE_RELEASE_SHA MYCODE_RELEASE_DATE
          MYCODE_RELEASE_SUBJECT=$(git log -1 --format=%s)
          MYCODE_RELEASE_SHA="${GITHUB_SHA}"
          MYCODE_RELEASE_DATE=$(date -u +%Y-%m-%d)
          python3 .github/scripts/release_plan.py \
            --apply \
            --remote-tags /tmp/remote-tags.txt \
            --release-tags /tmp/release-tags.txt \
            --plan-env /tmp/release-plan.env \
            --notes-file /tmp/release-notes.md
          # shellcheck disable=SC1091
          source /tmp/release-plan.env
          cleanup_ref=""
          if [[ "${PUBLISH}" == "true" && "${BUMPED}" == "true" ]]; then
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "unexpected version ${VERSION}" >&2
              exit 1
            fi
            if [[ -z "$(git status --porcelain -- Cargo.toml Cargo.lock CHANGELOG.md)" ]]; then
              echo "bump to ${VERSION} did not change version files" >&2
              exit 1
            fi
            export GIT_AUTHOR_NAME="github-actions[bot]"
            export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
            export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
            git add Cargo.toml Cargo.lock CHANGELOG.md
            git commit \
              -m "chore(release): bump to ${VERSION}" \
              -m "Record the version published for this qualified main push."
            if git push origin HEAD:main; then
              cleanup_ref=""
            else
              echo "main did not fast-forward; keeping the version commit on a temporary ref" >&2
              cleanup_ref="ci/release-${VERSION}-${GITHUB_RUN_ID}"
              git push origin "HEAD:refs/heads/${cleanup_ref}"
            fi
          fi
          # Outputs are written only after a required version commit is on
          # some ref. If that push fails, this step stops before publish is set.
          python3 .github/scripts/release_plan.py \
            --emit-output \
            --plan-env /tmp/release-plan.env \
            --notes-file /tmp/release-notes.md \
            --sha "$(git rev-parse HEAD)" \
            --cleanup-ref="${cleanup_ref}" \
            --github-output "${GITHUB_OUTPUT}"

  release-build:
    needs: release-plan
    if: needs.release-plan.result == 'success' && needs.release-plan.outputs.publish == 'true'
    name: release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mycode-desktop
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-plan.outputs.sha }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p mycode-desktop --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ needs.release-plan.outputs.tag }}"
          $stage = "mycode-desktop-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          Copy-Item README.md "$stage/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/" -ErrorAction SilentlyContinue
          $zip = "mycode-desktop-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${{ needs.release-plan.outputs.tag }}"
          stage="mycode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mycode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(shasum -a 256 "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.zip
            *.zip.sha256
          retention-days: 3
          if-no-files-found: error

  release-publish:
    needs: [release-plan, release-build]
    if: needs.release-plan.result == 'success' && needs.release-plan.outputs.publish == 'true' && needs.release-build.result == 'success'
    name: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-plan.outputs.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          head=$(git rev-parse HEAD)
          echo "tag=${{ needs.release-plan.outputs.tag }} workspace=${version} head=${head}"
          test "${{ needs.release-plan.outputs.tag }}" = "v${version}"
          test "${head}" = "${{ needs.release-plan.outputs.sha }}"

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plan.outputs.tag }}
          target_commitish: ${{ needs.release-plan.outputs.sha }}
          body: ${{ needs.release-plan.outputs.notes }}
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Delete temporary release ref
        if: needs.release-plan.outputs.cleanup_ref != ''
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ needs.release-plan.outputs.cleanup_ref }}"
          if [[ ! "${ref}" =~ ^ci/release-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "unexpected cleanup ref: ${ref}" >&2
            exit 1
          fi
          git push origin --delete "${ref}"
