# Pull request builds only.
#
# This workflow is the only one that runs on pull_request. It compiles and
# packages mycode-desktop on the four native runners and stops:
#   windows-latest  -> x86_64-pc-windows-msvc
#   windows-11-arm  -> aarch64-pc-windows-msvc
#   macos-latest    -> aarch64-apple-darwin
#   ubuntu-latest   -> x86_64-unknown-linux-gnu
# windows-latest is x64. Windows ARM64 uses the native windows-11-arm
# image; it is not a cross-compile from windows-latest. The Ubuntu runner
# installs the GPUI system packages, then compiles the Linux x86_64
# product. There is no fmt or clippy job.
#
# The archive name uses v<workspace version> from the checked-out Cargo.toml.
# Assets uploaded for the pull request (not published):
#   mycode-desktop-<tag>-x86_64-pc-windows-msvc.zip      (+ .sha256)
#   mycode-desktop-<tag>-aarch64-pc-windows-msvc.zip     (+ .sha256)
#   mycode-desktop-<tag>-aarch64-apple-darwin.zip        (+ .sha256)
#   mycode-desktop-<tag>-aarch64-apple-darwin.dmg        (+ .sha256)
#   mycode-desktop-<tag>-x86_64-unknown-linux-gnu.zip    (+ .sha256)
#
# Publishing is not in this file. A push to main runs
# .github/workflows/release.yml, which builds these same four targets
# and then tags and creates the GitHub Release.

name: ci

on:
  pull_request:

# One run per ref. A new push cancels the previous pull request run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release-build:
    name: release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mycode-desktop
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mycode-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Resolve package tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected version ${version}" >&2
            exit 1
          fi
          echo "MYCODE_PACKAGE_TAG=v${version}" >> "${GITHUB_ENV}"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libwayland-dev \
            libssl-dev \
            clang \
            libclang-dev \
            zip

      - name: Build release binary
        run: cargo build --release --locked -p mycode-desktop --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:MYCODE_PACKAGE_TAG
          $stage = "mycode-desktop-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          Copy-Item README.md "$stage/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/" -ErrorAction SilentlyContinue
          $zip = "mycode-desktop-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${MYCODE_PACKAGE_TAG}"
          stage="mycode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mycode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(shasum -a 256 "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      # MYCode.app + ad-hoc codesign + hdiutil; writes the .dmg and its
      # .sha256. The zip stays: the in-app updater downloads it. The fat
      # LTO build leaves a multi-GB target/ that fills the runner's disk
      # before hdiutil can write, so the binary moves to /tmp and the
      # build tree plus the cargo registry cache are dropped first.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary="/tmp/mycode-desktop"
          mv "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${binary}"
          rm -rf target ~/.cargo/registry
          df -h /
          scripts/make_dmg.sh \
            --binary "${binary}" \
            --version "${MYCODE_PACKAGE_TAG#v}" \
            --output "mycode-desktop-${MYCODE_PACKAGE_TAG}-${{ matrix.target }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag="${MYCODE_PACKAGE_TAG}"
          stage="mycode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mycode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(sha256sum "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.zip
            *.zip.sha256
            *.dmg
            *.dmg.sha256
          retention-days: 3
          if-no-files-found: error
