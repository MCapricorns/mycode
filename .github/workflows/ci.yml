# One workflow for pull requests and for main.
#
# pull_request (check): Windows only, dev/test profile. Runs
# `cargo test --workspace` and
# `cargo clippy --workspace --all-targets -- -D warnings`
# on windows-latest, with `--locked`. The whole workspace is covered.
# No fat LTO, no `cargo build --release`, no packaging, no tag, no
# GitHub Release, no version bump. Release builds stay on marked main
# pushes so a pull request does not wait on four LTO links.
#
# check-macos: the Windows check never compiles code behind
# `cfg(not(windows))`. Release 0.12.22's release-build job failed there:
# `install.rs` carried a unix PATH installer no non-Windows caller used,
# and `RUSTFLAGS=-Dwarnings` turned the dead code into an error after the
# version bump was already on a temporary ref. `cargo check
# --workspace --all-targets` on macos-latest compiles those paths without
# linking (no fat LTO, a few minutes) and dies on any warning, dead code
# included. It runs for pull requests and main pushes alike.
#
# push to main: the same Windows check plus the macOS check. A push
# publishes only when one of its new commit subjects carries `[release]`
# (merge subjects included; the marker does not have to be on the head
# commit). A push without the marker ends after the checks: no release
# build, no tag, no version bump. The client
# downloads the models.dev catalog
# into its runtime cache, so CI does not refresh a vendored snapshot. Release
# builds use `[profile.release]`
# (fat LTO, one codegen unit) through cargo_release_build.sh and treat
# warnings as errors (`RUSTFLAGS=-Dwarnings`). They do not run tests or
# clippy; the Windows check owns those. A publish waits until the check and all
# three builds succeed. When the workspace version is new, tag that commit and
# publish the archives.
# release-plan chooses `v<workspace version>` when that tag is free. When
# the tag already exists, it bumps the patch in Cargo.toml, Cargo.lock,
# and CHANGELOG.md on a temporary commit and pushes only
# `ci/release-<version>-<run id>`. The three product builds check out that
# commit, so the version compiled into the binaries is the version that
# will be tagged.
#
# Targets:
#   windows-latest  -> x86_64-pc-windows-msvc
#   windows-11-arm  -> aarch64-pc-windows-msvc
#   macos-latest    -> aarch64-apple-darwin
# windows-latest is x64. Windows ARM64 uses the native windows-11-arm
# image; it is not a cross-compile from windows-latest. The product does
# not support Linux, so no job compiles it there. There is no fmt job. cargo build retries crates.io
# DNS and download failures (the macOS release of 797dfde died resolving
# index.crates.io). Compile errors are not retried.
#
# After the Windows check and those three builds succeed and the plan asked
# to publish, release-publish creates the tag and uploads the archives from that
# commit, then advances main. The advance fast-forwards when it can.
# When main moved during the build, the version bump is replayed onto
# current main and pushed without force. The temporary ref is deleted
# after success or failure. The body is that version's CHANGELOG section,
# then the pull requests and fixed issues since the previous tag
# (release_notes.py). Archives
# already uploaded for the previous tag do not skip the release. The
# version ref and the later main update are pushed with GITHUB_TOKEN,
# which does not start another workflow run. release-plan also ignores
# github-actions[bot], so a replayed version bump cannot publish a
# second patch. check runs on windows-latest and compiles and tests the
# workspace. release-plan, release-publish, and release-cleanup run on
# ubuntu-latest and do not compile the product.
#
# Assets produced per release (Windows x64, Windows ARM64, macOS Apple Silicon):
#   mycode-desktop-<tag>-x86_64-pc-windows-msvc.zip      (+ .sha256)
#   mycode-desktop-<tag>-aarch64-pc-windows-msvc.zip     (+ .sha256)
#   mycode-desktop-<tag>-aarch64-apple-darwin.zip        (+ .sha256)
#   mycode-desktop-<tag>-aarch64-apple-darwin.dmg        (+ .sha256)
# Only the desktop app is wrapped into a dmg. It self-updates from the
# `mycode-desktop` asset family.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Pull requests cancel the previous run. Pushes to main wait, so a
# release tag and the binaries uploaded for it stay on one commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    # Dev/test profile only. Pull requests run this job and nothing else.
    # A main push runs it beside the release builds; publish waits for it.
    name: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo test --workspace
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: cargo test --workspace --locked

      - name: cargo clippy --workspace --all-targets
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  check-macos:
    # macOS-only code (cfg(not(windows))) is invisible to the Windows
    # check. No tests and no clippy here: this job exists to compile every
    # target on macOS with warnings denied.
    name: check-macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check --workspace --all-targets
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
          RUSTFLAGS: "-Dwarnings"
        run: cargo check --workspace --all-targets --locked

  release-plan:
    # github-actions[bot] is the GITHUB_TOKEN pusher. Ignore it so the
    # version bump that lands on main cannot plan another patch release.
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'"
    name: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write lets this job push the patch bump to a temporary
    # ref. It does not update main. The push uses GITHUB_TOKEN, so it
    # does not start a second workflow run.
    permissions:
      contents: write
      pull-requests: read
      issues: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
      sha: ${{ steps.plan.outputs.sha }}
      cleanup_ref: ${{ steps.plan.outputs.cleanup_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          # Full history: the marker scan walks the commits this push
          # brings, which starts at github.event.before.
          fetch-depth: 0

      - name: Check release planner
        run: |
          python3 .github/scripts/release_plan.py --self-test
          python3 .github/scripts/advance_main.py --self-test
          python3 .github/scripts/release_notes.py --self-test
          bash .github/scripts/cargo_release_build.sh --self-test

      - name: Choose a new release tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags origin 'refs/tags/v*' > /tmp/remote-tags.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' > /tmp/release-tags.txt
          # Pass the subject through the environment. A commit subject can
          # contain quotes or command substitutions; the shell must not
          # expand it again on the python command line.
          export MYCODE_RELEASE_SUBJECT MYCODE_RELEASE_SHA MYCODE_RELEASE_DATE
          MYCODE_RELEASE_SUBJECT=$(git log -1 --format=%s)
          MYCODE_RELEASE_SHA="${GITHUB_SHA}"
          MYCODE_RELEASE_DATE=$(date -u +%Y-%m-%d)
          # The `[release]` marker may sit on any commit this push brings,
          # merge subjects included; the head is often only "Merge ...".
          before="${{ github.event.before }}"
          if [[ "${before}" =~ ^[0-9a-f]{40}$ ]] && [[ ! "${before}" =~ ^0+$ ]] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git log --format=%s "${before}..${GITHUB_SHA}" > /tmp/push-subjects.txt
          else
            git log --format=%s -n 30 > /tmp/push-subjects.txt
          fi
          python3 .github/scripts/release_plan.py \
            --apply \
            --remote-tags /tmp/remote-tags.txt \
            --release-tags /tmp/release-tags.txt \
            --subjects-file /tmp/push-subjects.txt \
            --plan-env /tmp/release-plan.env \
            --notes-file /tmp/release-notes.md
          # shellcheck disable=SC1091
          source /tmp/release-plan.env
          cleanup_ref=""
          if [[ "${PUBLISH}" == "true" && "${BUMPED}" == "true" ]]; then
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "unexpected version ${VERSION}" >&2
              exit 1
            fi
            if [[ -z "$(git status --porcelain -- Cargo.toml Cargo.lock CHANGELOG.md)" ]]; then
              echo "bump to ${VERSION} did not change version files" >&2
              exit 1
            fi
            export GIT_AUTHOR_NAME="github-actions[bot]"
            export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
            export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
            git add Cargo.toml Cargo.lock CHANGELOG.md
            git commit \
              -m "chore(release): bump to ${VERSION}" \
              -m "Record the version published for this qualified main push."
            # Build this commit before main moves. release-publish tags
            # it after the three platform archives exist, then
            # fast-forwards main or replays the bump onto current main.
            cleanup_ref="ci/release-${VERSION}-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${cleanup_ref}"
          fi
          if [[ "${PUBLISH}" == "true" ]]; then
            # The commit is already on the temporary ref when one was
            # pushed, so generate-notes can see that sha. A failure here
            # deletes that ref and does not set publish.
            if ! python3 .github/scripts/release_notes.py \
              --notes-file /tmp/release-notes.md \
              --remote-tags /tmp/remote-tags.txt \
              --tag "${TAG}" \
              --sha "$(git rev-parse HEAD)"; then
              if [[ -n "${cleanup_ref}" ]]; then
                git push origin --delete "${cleanup_ref}" || true
              fi
              exit 1
            fi
          fi
          # Outputs are written only after a required version commit is on
          # the temporary ref. If that push fails, this step stops before
          # publish is set.
          python3 .github/scripts/release_plan.py \
            --emit-output \
            --plan-env /tmp/release-plan.env \
            --notes-file /tmp/release-notes.md \
            --sha "$(git rev-parse HEAD)" \
            --cleanup-ref="${cleanup_ref}" \
            --github-output "${GITHUB_OUTPUT}"

  release-build:
    # Publishing pushes only: the plan's publish output gates this job,
    # so an unmarked main push stops after the checks.
    needs: release-plan
    if: github.event_name == 'push' && needs.release-plan.result == 'success' && needs.release-plan.outputs.publish == 'true'
    name: release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mycode-desktop
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-plan.outputs.sha }}

      - name: Resolve package tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected version ${version}" >&2
            exit 1
          fi
          echo "MYCODE_PACKAGE_TAG=v${version}" >> "${GITHUB_ENV}"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "60"
          RUSTFLAGS: "-Dwarnings"
        run: |
          bash .github/scripts/cargo_release_build.sh --self-test
          bash .github/scripts/cargo_release_build.sh "${{ matrix.target }}"

      # The asset family is named after the binary's file stem — the same
      # rule the updater derives at runtime — so the desktop and CLI zips
      # never share a name.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:MYCODE_PACKAGE_TAG
          $binary = "${{ matrix.binary }}"
          $stem = [System.IO.Path]::GetFileNameWithoutExtension($binary)
          $stage = "$stem-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$binary" "$stage/"
          Copy-Item README.md "$stage/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/" -ErrorAction SilentlyContinue
          $zip = "$stem-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${MYCODE_PACKAGE_TAG}"
          binary="${{ matrix.binary }}"
          stage="${binary}-${tag}-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${binary}"
          cp "target/${{ matrix.target }}/release/${binary}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="${binary}-${tag}-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(shasum -a 256 "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      # MYCode.app + ad-hoc codesign + hdiutil; writes the .dmg and its
      # .sha256. The zip stays: the in-app updater downloads it.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/make_dmg.sh \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --version "${MYCODE_PACKAGE_TAG#v}" \
            --output "mycode-desktop-${MYCODE_PACKAGE_TAG}-${{ matrix.target }}.dmg"

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            *.zip
            *.zip.sha256
            *.dmg
            *.dmg.sha256
          retention-days: 3
          if-no-files-found: error

  release-publish:
    needs: [release-plan, release-build, check, check-macos]
    if: needs.release-plan.result == 'success' && needs.release-plan.outputs.publish == 'true' && needs.release-build.result == 'success' && needs.check.result == 'success' && needs.check-macos.result == 'success'
    name: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-plan.outputs.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          head=$(git rev-parse HEAD)
          echo "tag=${{ needs.release-plan.outputs.tag }} workspace=${version} head=${head}"
          test "${{ needs.release-plan.outputs.tag }}" = "v${version}"
          test "${head}" = "${{ needs.release-plan.outputs.sha }}"

      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plan.outputs.tag }}
          target_commitish: ${{ needs.release-plan.outputs.sha }}
          body: ${{ needs.release-plan.outputs.notes }}
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Advance main to the built commit
        shell: bash
        run: |
          set -euo pipefail
          # The tag and archives already point at this commit. Fast-forward
          # main when it still can. When main moved during the build, replay
          # the version bump onto current main. Never force-push.
          python3 .github/scripts/advance_main.py \
            --built-sha "${{ needs.release-plan.outputs.sha }}"

  release-cleanup:
    name: release-cleanup
    needs: [release-plan, release-build, release-publish]
    if: always() && needs.release-plan.result == 'success' && needs.release-plan.outputs.cleanup_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Delete temporary release ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ needs.release-plan.outputs.cleanup_ref }}"
          if [[ ! "${ref}" =~ ^ci/release-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "unexpected cleanup ref: ${ref}" >&2
            exit 1
          fi
          if git push origin --delete "${ref}"; then
            echo "deleted ${ref}"
          elif git ls-remote --exit-code --heads origin "${ref}" >/dev/null; then
            echo "failed to delete ${ref}" >&2
            exit 1
          else
            echo "temporary ref ${ref} is already gone"
          fi
