# Single workflow for the product:
#
# 1. push/PR quality gate — rustfmt + clippy -D warnings on the native
#    product runners:
#      windows-latest  -> x86_64-pc-windows-msvc
#      ubuntu-latest   -> x86_64-unknown-linux-gnu
#      macos-latest    -> aarch64-apple-darwin
#    No test suites exist. windows-latest is x64. Linux jobs install the
#    GPUI/fontconfig/Wayland/XCB packages in .github/actions/linux-gpui-deps.
#
# 2. release — a push to main publishes `v<workspace version>` when that
#    GitHub Release is missing any platform archive. The release body is
#    the matching CHANGELOG section, not generated commit notes. A push whose
#    version already has every archive does not build release binaries.
#
# Assets produced per release:
#   mycode-desktop-<tag>-x86_64-pc-windows-msvc.zip      (+ .sha256)
#   mycode-desktop-<tag>-aarch64-apple-darwin.zip        (+ .sha256)
#   mycode-desktop-<tag>-x86_64-unknown-linux-gnu.zip    (+ .sha256)

name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. Pull requests cancel their previous run. Pushes to main
# wait, so a release tag and the binaries uploaded for it stay on one commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
          - os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gpui-deps

      # Formats every workspace member, including mycode-desktop.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: >
          cargo clippy -p mycode-core -p mycode-config -p mycode-providers
          -p mycode-tools -p mycode-agent -p mycode-app
          --all-targets --locked -- -D warnings

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
          - os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup component add clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gpui-deps

      - name: cargo clippy
        run: cargo clippy -p mycode-desktop --all-targets --locked -- -D warnings

  release-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, desktop]
    name: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether this commit needs a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 << 'PY'
          import os, re, subprocess
          from pathlib import Path

          cargo = Path("Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "([^"]+)"', cargo)
          if not match:
              raise SystemExit("Cargo.toml has no workspace version")
          version = match.group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"workspace version is not semver: {version}")
          tag = f"v{version}"
          required = [
              f"mycode-desktop-{tag}-x86_64-pc-windows-msvc.zip",
              f"mycode-desktop-{tag}-x86_64-pc-windows-msvc.zip.sha256",
              f"mycode-desktop-{tag}-aarch64-apple-darwin.zip",
              f"mycode-desktop-{tag}-aarch64-apple-darwin.zip.sha256",
              f"mycode-desktop-{tag}-x86_64-unknown-linux-gnu.zip",
              f"mycode-desktop-{tag}-x86_64-unknown-linux-gnu.zip.sha256",
          ]
          viewed = subprocess.run(
              ["gh", "release", "view", tag, "--json", "assets", "--jq", ".assets[].name"],
              text=True,
              capture_output=True,
          )
          if viewed.returncode != 0 and "not found" not in (viewed.stderr or "").lower():
              raise SystemExit(viewed.stderr.strip() or f"gh release view failed ({viewed.returncode})")
          present = set(viewed.stdout.splitlines()) if viewed.returncode == 0 else set()
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              if viewed.returncode == 0 and all(name in present for name in required):
                  handle.write("publish=false\n")
                  print(f"Release {tag} already has every platform archive.")
                  raise SystemExit(0)
              text = Path("CHANGELOG.md").read_text(encoding="utf-8")
              notes = re.search(
                  rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
                  text,
              )
              body = notes.group(1).strip() if notes else ""
              if not body:
                  raise SystemExit(f"CHANGELOG.md has no notes for {version}")
              delim = "NOTES_" + os.urandom(8).hex()
              handle.write("publish=true\n")
              handle.write(f"notes<<{delim}\n")
              handle.write(body)
              if not body.endswith("\n"):
                  handle.write("\n")
              handle.write(f"{delim}\n")
          print(f"Will publish {tag}.")
          PY

  release-build:
    needs: release-plan
    if: needs.release-plan.outputs.publish == 'true'
    name: release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mycode-desktop
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mycode-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gpui-deps

      - name: Build release binary
        run: cargo build --release --locked -p mycode-desktop --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ needs.release-plan.outputs.tag }}"
          $stage = "mycode-desktop-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          Copy-Item README.md "$stage/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/" -ErrorAction SilentlyContinue
          $zip = "mycode-desktop-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${{ needs.release-plan.outputs.tag }}"
          stage="mycode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mycode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(shasum -a 256 "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag="${{ needs.release-plan.outputs.tag }}"
          stage="mycode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mycode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(sha256sum "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.zip
            *.zip.sha256
          retention-days: 3
          if-no-files-found: error

  release-publish:
    needs: [release-plan, release-build]
    if: needs.release-plan.outputs.publish == 'true' && needs.release-build.result == 'success'
    name: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=${{ needs.release-plan.outputs.tag }} workspace=${version}"
          test "${{ needs.release-plan.outputs.tag }}" = "v${version}"

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.release-plan.outputs.notes }}
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
