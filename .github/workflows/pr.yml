# Pull request builds only.
#
# This workflow is the only one that runs on a pull request, so the Checks
# page lists these three jobs and nothing else. Quality gates and publishing
# stay in ci.yml and run on pushes to main.
#
# Each runner compiles mycode-desktop --release and uploads the same zip and
# .sha256 sidecar as ci.yml's release-build. The archive name uses
# v<workspace version> from the checked-out Cargo.toml. Pull requests do not
# create a tag, a GitHub Release, a Cargo.toml bump, or a ci/release-* ref.
# windows-latest is x64. Windows ARM64 uses the native windows-11-arm image;
# it is not a cross-compile from windows-latest.

name: pr

on:
  pull_request:

# One run per PR ref. A new push cancels the previous build.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  pr-release-build:
    # Same compile and zip steps as ci.yml release-build, using the workspace
    # version already in the checkout. No release-plan, so this job cannot
    # bump Cargo.toml, push a release ref, or create a tag.
    name: pr-release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mycode-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Resolve package tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected version ${version}" >&2
            exit 1
          fi
          echo "MYCODE_PACKAGE_TAG=v${version}" >> "${GITHUB_ENV}"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p mycode-desktop --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:MYCODE_PACKAGE_TAG
          $stage = "mycode-desktop-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          Copy-Item README.md "$stage/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/" -ErrorAction SilentlyContinue
          $zip = "mycode-desktop-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${MYCODE_PACKAGE_TAG}"
          stage="mycode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mycode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(shasum -a 256 "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.zip
            *.zip.sha256
          retention-days: 3
          if-no-files-found: error
