<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MYCode Wiki · 架构图谱</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: light;
  --frame: #F3EDE2; --paper: #FAF6EE; --surface: #FFFCF7; --raised: #F3EDE2;
  --active: #E8E1D6; --ink: #14131B; --muted: #625D58; --border: #E4DDD2;
  --control: #B6ADA2; --accent: #C72E38; --accent-soft: #FAE7E4; --edge: #C5BDB2;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "Cascadia Code", Consolas, ui-monospace, monospace;
  --gap: 16px; --radius: 8px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --frame: #141316; --paper: #1B1A1E; --surface: #1B1A1E; --raised: #242328;
  --active: #353239; --ink: #F3EDE2; --muted: #BEB7AF; --border: #343137;
  --control: #756E78; --accent: #F46A6C; --accent-soft: #382427; --edge: #68616A;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--frame); color: var(--ink); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; }
a { color: inherit; text-underline-offset: 3px; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:disabled { color: var(--muted); cursor: default; opacity: .65; }
::selection { background: var(--accent-soft); color: var(--ink); }
.skip { position: fixed; left: 16px; top: -100px; padding: 10px 16px; background: var(--ink); color: var(--paper); z-index: 100; }
.skip:focus { top: 12px; }
/* Frame arithmetic: 220px navigation + flexible sheet + 8px outer inset.
   Inside the sheet: 24px + flexible graph + 16px + 280px detail + 24px. */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100dvh; }
.sidebar { padding: 25px 16px 20px; display: flex; flex-direction: column; gap: 32px; }
.brand { display: flex; gap: 11px; align-items: center; text-decoration: none; padding: 0 8px; }
.brand img { width: 30px; height: 30px; flex: none; }
.brand strong { font-size: 20px; font-weight: 650; letter-spacing: -.03em; }
.brand span { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; letter-spacing: 0; }
.nav-group { margin: 0 8px 8px; color: var(--muted); font-size: 12px; }
.primary-nav { display: grid; gap: 4px; }
.primary-nav a { display: flex; gap: 10px; align-items: center; min-height: 40px; padding: 8px 12px; border-radius: var(--radius); color: var(--muted); text-decoration: none; }
.primary-nav a[aria-current="page"] { background: var(--active); color: var(--ink); font-weight: 600; }
.primary-nav a:hover { color: var(--ink); background: var(--raised); }
.primary-nav svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; }
.sidebar-note { margin-top: auto; padding: 0 8px; color: var(--muted); font-size: 12px; }
.sidebar-note p { margin: 0 0 8px; }
.sidebar-links { display: flex; gap: 14px; flex-wrap: wrap; }
.sidebar-links a { min-height: 32px; text-decoration: none; }
.workspace { min-width: 0; display: flex; flex-direction: column; padding: 0 8px 8px 0; }
.topbar { min-height: 64px; display: flex; align-items: center; gap: 16px; padding: 8px 24px; }
.breadcrumb { color: var(--muted); white-space: nowrap; font-size: 13px; }
.breadcrumb b { font-weight: 500; color: var(--ink); }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.control { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 5px 12px; border: 1px solid var(--control); border-radius: var(--radius); background: transparent; text-decoration: none; white-space: nowrap; }
.control:hover { background: var(--active); }
#menuToggle { display: none; }
.sheet-main { flex: 1; min-width: 0; background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.page-header { display: flex; align-items: flex-start; gap: var(--gap); margin-bottom: 20px; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.025em; line-height: 1.3; margin: 0 0 7px; }
.page-header p { color: var(--muted); margin: 0; font-size: 14px; }
.view-switch { display: flex; margin-left: auto; border: 1px solid var(--control); border-radius: var(--radius); padding: 3px; flex: none; }
.view-switch button { min-height: 30px; padding: 3px 12px; border: 0; border-radius: 5px; background: transparent; }
.view-switch button[aria-pressed="true"] { background: var(--active); font-weight: 600; }
.explorer-toolbar { display: flex; align-items: center; gap: var(--gap); margin-bottom: 16px; }
.search-box { position: relative; flex: 1; max-width: 520px; }
.search-box svg { position: absolute; left: 13px; top: 13px; width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 1.8; pointer-events: none; }
#search { width: 100%; height: 42px; padding: 8px 42px 8px 38px; border: 1px solid var(--control); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
#search::placeholder { color: var(--muted); }
.shortcut { position: absolute; top: 9px; right: 12px; color: var(--muted); font-size: 14px; }
#searchStatus { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.explorer-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--gap); align-items: start; }
.graph-panel { min-width: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.graph-heading { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.graph-heading h2 { margin: 0; font-size: 14px; font-weight: 600; }
.zoom { display: flex; gap: 4px; margin-left: auto; }
.zoom button { min-height: 32px; min-width: 32px; border: 0; border-radius: 5px; background: var(--raised); padding: 2px 8px; }
.zoom button:hover { background: var(--active); }
#map { overflow: auto; padding: 12px; height: 620px; }
#layer { transform-origin: 0 0; }
#layer svg { display: block; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; opacity: .35; }
.edge.hot { stroke: var(--accent); stroke-width: 1.8; opacity: .8; }
.lane-band { fill: var(--raised); opacity: .6; }
.lane-label { fill: var(--muted); font-size: 13px; }
.node { cursor: pointer; }
.node rect { fill: var(--surface); stroke: var(--control); stroke-width: 1; rx: 6px; }
.node text { fill: var(--ink); font-size: 14px; font-weight: 500; }
.node .dot { fill: var(--muted); }
.node.active rect { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.node.active .dot { fill: var(--accent); }
.node.hot rect, .node:hover rect { stroke: var(--ink); }
.node:focus-visible { outline: none; }
.node:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
.node.dim rect { stroke: var(--border); }
.node.dim text, .node.dim .dot { fill: var(--muted); }
.graph-footer { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
#nodeList { padding: 4px 16px 16px; }
.node-group h3 { font-size: 12px; color: var(--muted); font-weight: 500; margin: 20px 0 4px; }
.node-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; width: 100%; min-height: 44px; gap: 12px; padding: 10px 12px; text-align: left; border: 0; background: transparent; border-radius: 6px; }
.node-row small { color: var(--muted); font-size: 12px; }
.node-row[aria-pressed="true"] { background: var(--active); font-weight: 600; }
.node-row:hover { background: var(--raised); }
.no-results { padding: 20px 0; }
.no-results p { margin: 0 0 12px; }
#detail { min-width: 0; padding: 0 0 0 4px; overflow-wrap: anywhere; position: sticky; top: 24px; }
.detail-type { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
#detail h2 { margin: 0 0 12px; font-size: 20px; line-height: 1.4; font-weight: 650; letter-spacing: -.02em; }
#detail .summary { font-size: 14px; line-height: 1.8; margin: 0; }
.detail-section { margin-top: 24px; }
.detail-section h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.file { display: grid; grid-template-columns: minmax(0, 1fr) auto; width: 100%; padding: 10px 12px; margin: 0 0 6px; gap: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); text-align: left; }
.file:hover { border-color: var(--control); }
.file .name { font-weight: 600; }
.file .dir { grid-column: 1 / -1; font-size: 12px; color: var(--muted); word-break: break-all; }
.file .lines { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
.related { display: flex; flex-wrap: wrap; gap: 6px; }
.related button { border: 0; padding: 7px 10px; border-radius: 5px; background: var(--raised); font-size: 12px; }
.related button:hover { background: var(--active); }
.detail-back { display: none; margin-bottom: 16px; }
.detail-hint { padding: 16px; background: var(--raised); border-radius: var(--radius); color: var(--muted); }
#foot { color: var(--muted); font-size: 12px; margin-top: 20px; }
.doc-layout { display: grid; grid-template-columns: minmax(0, 760px) minmax(160px, 1fr); gap: 40px; }
.document { min-width: 0; font-size: 15px; line-height: 1.8; }
.document h1 { margin-bottom: 20px; }
.document h2 { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 32px 0 12px; scroll-margin-top: 24px; }
.document h3 { font-size: 16px; line-height: 1.5; margin: 24px 0 12px; }
.document p { margin: 0 0 16px; }
.document a { text-decoration-color: var(--control); }
.document a:hover { text-decoration-color: var(--accent); color: var(--accent); }
.document code { font-family: var(--mono); font-size: .88em; background: var(--raised); border-radius: 3px; padding: 2px 4px; overflow-wrap: anywhere; }
.document pre { background: var(--raised); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius); overflow: auto; line-height: 1.7; }
.document pre code { padding: 0; background: transparent; overflow-wrap: normal; }
.document ul { padding-left: 22px; }
.document li { margin: 7px 0; }
.table-scroll { max-width: 100%; overflow: auto; margin: 20px 0; }
.document table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.6; text-align: left; }
.document th { font-weight: 500; color: var(--muted); }
.document td, .document th { padding: 10px 12px 10px 0; vertical-align: top; border-bottom: 1px solid var(--border); }
.document td:first-child { min-width: 140px; }
.doc-aside { min-width: 0; align-self: start; position: sticky; top: 24px; }
.doc-aside p { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.doc-aside a { display: block; font-size: 13px; text-decoration: none; padding: 6px 0; overflow-wrap: anywhere; }
.doc-source { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
#codeView { padding: 0; border: 1px solid #48434A; border-radius: 12px; width: min(1180px, calc(100vw - 48px)); max-width: none; max-height: calc(100dvh - 48px); background: #1B1A1E; color: #F3EDE2; }
#codeView::backdrop { background: rgb(20 19 22 / 65%); }
.code-sheet { display: flex; flex-direction: column; max-height: calc(100dvh - 50px); }
.code-header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #242328; }
.code-header .path { margin: 0; flex: 1 1 360px; font: 13px/1.5 var(--mono); overflow-wrap: anywhere; }
.code-header .meta { color: #BEB7AF; font-size: 12px; font-variant-numeric: tabular-nums; }
.code-header .control { border-color: #756E78; min-height: 32px; }
.code-header .control:hover { background: #353239; }
.scroll { overflow: auto; background: #141316; min-height: 160px; }
.cols { display: flex; min-width: min-content; align-items: flex-start; }
.gutter { position: sticky; left: 0; flex: none; padding: 16px 12px 24px; background: #141316; color: #BEB7AF; text-align: right; user-select: none; }
.code { margin: 0; padding: 16px 20px 24px 12px; white-space: pre; tab-size: 4; color: #F3EDE2; }
.code, .gutter { font: 13px/21px var(--mono); }
.code .ln { min-height: 21px; }
.code .k, .code .a { color: #F46A6C; }
.code .t { color: #E3C7A4; }
.code .s { color: #D4D6BC; }
.code .c { color: #BEB7AF; }
.code .n { color: #F3EDE2; }
@media (min-width: 1700px) { #map { height: 700px; } .explorer-grid { grid-template-columns: minmax(0, 1fr) 320px; } }
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .workspace { padding-left: 8px; }
  #menuToggle { display: inline-flex; }
  .topbar { padding: 8px 16px; }
  body.nav-open .sidebar { display: flex; position: fixed; inset: 64px 8px 8px; z-index: 10; background: var(--frame); border: 1px solid var(--control); border-radius: 12px; padding: 24px; }
  .explorer-grid { grid-template-columns: minmax(0, 1fr) 260px; }
  .doc-layout { grid-template-columns: minmax(0, 1fr); }
  .doc-aside { position: static; }
  .doc-aside p, .doc-aside nav { display: none; }
  .doc-source { border: 0; padding: 0; margin: 0; }
}
@media (max-width: 700px) {
  body { font-size: 14px; }
  .topbar { min-height: 60px; padding: 8px 12px; gap: 8px; }
  .breadcrumb { font-size: 12px; }
  .topbar .control { min-height: 44px; padding: 6px 10px; }
  .top-actions { gap: 4px; }
  #repoLink { display: none; }
  .workspace { padding: 0; }
  .sheet-main { border-radius: 0; border-left: 0; border-right: 0; padding: 20px 16px; }
  h1 { font-size: 24px; }
  .page-header { gap: 8px; margin-bottom: 16px; }
  .page-header p { font-size: 13px; max-width: 30ch; }
  .view-switch button { min-height: 36px; padding: 3px 10px; }
  .explorer-toolbar { flex-wrap: wrap; gap: 8px; }
  .search-box { flex-basis: 100%; max-width: none; }
  #search { height: 44px; }
  .explorer-grid { grid-template-columns: minmax(0, 1fr); }
  #detail { display: none; padding: 0; position: static; }
  body.mobile-detail .explorer-toolbar, body.mobile-detail .graph-panel, body.mobile-detail .view-switch { display: none; }
  body.mobile-detail #detail { display: block; }
  .detail-back { display: inline-flex; min-height: 44px; }
  #map { height: 570px; }
  .zoom button { min-height: 44px; min-width: 44px; }
  .graph-heading { padding: 8px 12px; }
  .node-row { padding: 12px 8px; min-height: 48px; }
  .node-row small { font-size: 12px; }
  .file { min-height: 56px; }
  .related button { min-height: 44px; }
  .doc-layout { gap: 20px; }
  .document { font-size: 14px; }
  .document h2 { font-size: 20px; }
  .document td:first-child { min-width: 110px; }
  #codeView { width: calc(100vw - 16px); max-height: calc(100dvh - 16px); }
  .code-sheet { max-height: calc(100dvh - 18px); }
  .code-header { padding: 12px; }
  .code-header .control { min-height: 44px; }
  .sidebar-links a { min-height: 44px; }
}
@media (prefers-reduced-motion: no-preference) { .control, .node rect { transition: background-color .12s, stroke .12s; } }
@media print { .sidebar, .topbar, .doc-aside, #graphView, #codeView { display: none; } .app, .workspace, .sheet-main { display: block; padding: 0; border: 0; } .doc-layout { display: block; } }
</style>
</head>

<script>
"use strict";
const GRAPH = JSON.parse(document.getElementById("graph-data").textContent);
const FILES = JSON.parse(document.getElementById("file-data").textContent);
const DOCS = JSON.parse(document.getElementById("doc-data").textContent);
const NODES = GRAPH.nodes, LANES = GRAPH.lanes;
const NS = "http://www.w3.org/2000/svg", REPO = "https://github.com/MCapricorns/mycode";
const $ = (id) => document.getElementById(id);
const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (c) => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const byId = new Map(NODES.map((node) => [node.id, node]));
const GROUP_LABELS = { crate: "Crate", module: "模块", flow: "流程", data: "数据" };
const mobile = window.matchMedia("(max-width: 700px)");
let selectedId = null, currentFile = null, currentView = "graph", listMode = window.matchMedia("(max-width: 1100px)").matches;
let zoom = 1, manualZoom = false, fileTrigger = null, restoring = false;
const layer = $("layer"), map = $("map"), detail = $("detail"), search = $("search");
const codeView = $("codeView");

const SLOT = 180, ROW_H = 70, NODE_H = 40, LABEL_W = 94, MARGIN = 16;
const columns = Math.max(...LANES.map((_, lane) => NODES.filter((node) => node.lane === lane).length), 1);
const graphW = MARGIN * 2 + LABEL_W + SLOT * columns, graphH = MARGIN * 2 + ROW_H * LANES.length;
const svg = svgElement("svg", {width: graphW, height: graphH, viewBox: `0 0 ${graphW} ${graphH}`, role: "group", "aria-label": "MYCode 模块关联图"});
const defs = svgElement("defs", {}, svg);
const marker = svgElement("marker", {id: "arrow", viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse"}, defs);
svgElement("path", {d: "M0 0 8 4 0 8Z", fill: "var(--edge)"}, marker);
const positions = new Map();
LANES.forEach((name, lane) => {
  const y = MARGIN + lane * ROW_H;
  svgElement("rect", {class: "lane-band", x: 0, y, width: graphW, height: ROW_H - 6, rx: 6}, svg);
  const label = svgElement("text", {class: "lane-label", x: 12, y: y + 36}, svg);
  label.textContent = name;
  NODES.filter((node) => node.lane === lane).forEach((node, index) => positions.set(node.id, {x: MARGIN + LABEL_W + index * SLOT + SLOT / 2, y: y + 10, w: Math.min(172, Math.max(126, node.label.length * 7.8 + 30))}));
});
const edgeLayer = svgElement("g", {"aria-hidden": "true"}, svg), nodeLayer = svgElement("g", {}, svg);
const edges = [], nodeEls = new Map();
NODES.forEach((node) => (node.links || []).forEach((id) => {
  const from = positions.get(node.id), to = positions.get(id);
  if (!to) return;
  const dir = to.y > from.y ? 1 : -1, sy = from.y + (dir > 0 ? NODE_H : 0), ey = to.y + (dir > 0 ? 0 : NODE_H);

  const path = svgElement("path", {class: "edge", "marker-end": "url(#arrow)", d: `M${from.x},${sy} C${from.x},${sy + dir * bend} ${to.x},${ey - dir * bend} ${to.x},${ey}`}, edgeLayer);

NODES.forEach((node) => {
  const {x, y, w} = positions.get(node.id);

layer.appendChild(svg);
function applyZoom(next) {

}
function fitZoom() { manualZoom = false; applyZoom(Math.min(1, (map.clientWidth - 24) / graphW)); }
$("zoomIn").addEventListener("click", () => { manualZoom = true; applyZoom(zoom + .1); });
$("zoomOut").addEventListener("click", () => { manualZoom = true; applyZoom(zoom - .1); });

function renderList(term = "") {

function fileLineCount(path) { return (FILES[path] || "").replace(/\n$/, "").split("\n").length; }
function select(id, showDetail = false) {
  const node = byId.get(id);

  search.value = "";
  const neighbors = new Set([id, ...(node.links || [])]);
  NODES.forEach((other) => { if ((other.links || []).includes(id)) neighbors.add(other.id); });
  edges.forEach((edge) => edge.path.classList.toggle("hot", edge.from === id || edge.to === id));
  nodeEls.forEach((el, other) => {

  });

function clearSelection() {

function filter() {

const KEYWORDS = /^(as|async|await|break|const|continue|crate|dyn|else|enum|extern|false|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|true|type|unsafe|use|where|while)\b/;

function highlight(text) {
  // Keep source text intact while highlighting comments, strings and Rust tokens.
  const lines = [];
  let line = [];
  let i = 0;
  const push = (cls, chunk) => {
    const parts = chunk.split("\n");
    parts.forEach((part, index) => {
      if (index > 0) {
        lines.push(line);
        line = [];
      }
      if (part) {
        const span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = part;
        line.push(span);
      }
    });
  };

    if (text.startsWith("//", i)) {
      const end = text.indexOf("\n", i);
      const stop = end < 0 ? text.length : end;
      push("c", text.slice(i, stop));
      i = stop;
      continue;
    }
    if (text.startsWith("/*", i)) {
      const end = text.indexOf("*/", i + 2);
      const stop = end < 0 ? text.length : end + 2;
      push("c", text.slice(i, stop));
      i = stop;
      continue;
    }
    const char = text[i];
    if (char === '"') {
      let j = i + 1;
      while (j < text.length && text[j] !== '"') j += text[j] === "\\" ? 2 : 1;
      push("s", text.slice(i, Math.min(j + 1, text.length)));
      i = j + 1;
      continue;
    }
    if (char === "#" && line.length === 0 && (text.startsWith("#[", i) || text.startsWith("#![", i))) {
      const end = text.indexOf("]", i);
      const stop = end < 0 ? i + 1 : end + 1;
      push("a", text.slice(i, stop));
      i = stop;
      continue;
    }
    if (/[0-9]/.test(char) && !/[A-Za-z0-9_]/.test(text[i - 1] || "")) {
      let j = i;
      while (j < text.length && /[0-9_xXa-fA-F.]/.test(text[j])) j += 1;
      push("n", text.slice(i, j));
      i = j;
      continue;
    }
    if (/[A-Za-z_]/.test(char)) {
      let j = i;
      while (j < text.length && /[A-Za-z0-9_]/.test(text[j])) j += 1;
      const word = text.slice(i, j);
      if (KEYWORDS.test(word)) push("k", word);
      else if (/^[A-Z]/.test(word)) push("t", word);
      else push(null, word);
      i = j;
      continue;
    }
    let j = i;
    while (j < text.length && !/[A-Za-z0-9_"#\/]/.test(text[j])) j += 1;
    if (j === i) j += 1;
    push(null, text.slice(i, j));
    i = j;
  }
  lines.push(line);
  if (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
  return lines;
}


function openCode(path, line) {
  if (!(path in FILES)) return;
  fileTrigger = document.activeElement; currentFile = path;
  $("codePath").textContent = path;
  const lines = highlight(FILES[path]);
  const code = document.createDocumentFragment(), gutter = document.createDocumentFragment();

  $("codeMeta").textContent = lines.length.toLocaleString() + " 行";
  $("codeGithub").href = REPO + "/blob/main/" + path + (line ? "#L" + line : "");
  $("codeCopy").textContent = "复制";

function setView(view) {

function updateHash() {

  if (selectedId && currentView === "graph") params.set("n", selectedId);

function readHash() {
