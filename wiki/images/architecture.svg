<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-label="MYCode crate responsibilities"><rect width="1200" height="920" rx="20" fill="#FAF6EE"/><g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="64" font-size="30" font-weight="650" fill="#14131B">MYCode architecture</text><text x="48" y="102" font-size="18" fill="#625D58">Native interface. Shared product state. One tool registry.</text><rect x="48" y="140" width="1104" height="76" rx="8" fill="#F3EDE2"/><text x="72" y="186" font-size="21" font-weight="600" fill="#14131B">mycode-desktop</text><text x="416" y="186" font-size="19" fill="#14131B">GPUI windows, chat and settings</text><rect x="48" y="228" width="1104" height="76" rx="8" fill="#F3EDE2"/><text x="72" y="274" font-size="21" font-weight="600" fill="#14131B">mycode-frontend</text><text x="416" y="274" font-size="19" fill="#14131B">View model, reducer and driver</text><rect x="48" y="316" width="1104" height="76" rx="8" fill="#FAE7E4"/><text x="72" y="362" font-size="21" font-weight="600" fill="#C72E38">mycode-app</text><text x="416" y="362" font-size="19" fill="#14131B">CoreBridge, turns, MCP and subagents</text><rect x="48" y="404" width="1104" height="76" rx="8" fill="#F3EDE2"/><text x="72" y="450" font-size="21" font-weight="600" fill="#14131B">mycode-agent</text><text x="416" y="450" font-size="19" fill="#14131B">Model / tool cycle and session ledger</text><rect x="48" y="492" width="1104" height="76" rx="8" fill="#F3EDE2"/><text x="72" y="538" font-size="21" font-weight="600" fill="#14131B">mycode-tools</text><text x="416" y="538" font-size="19" fill="#14131B">Registry, native tools and Rhai cells</text><rect x="48" y="580" width="1104" height="76" rx="8" fill="#F3EDE2"/><text x="72" y="626" font-size="21" font-weight="600" fill="#14131B">mycode-providers</text><text x="416" y="626" font-size="19" fill="#14131B">OpenAI and Anthropic protocol adapters</text><rect x="48" y="668" width="1104" height="76" rx="8" fill="#F3EDE2"/><text x="72" y="714" font-size="21" font-weight="600" fill="#14131B">mycode-config</text><text x="416" y="714" font-size="19" fill="#14131B">Settings, home and prompt resources</text><rect x="48" y="756" width="1104" height="76" rx="8" fill="#F3EDE2"/><text x="72" y="802" font-size="21" font-weight="600" fill="#14131B">mycode-core</text><text x="416" y="802" font-size="19" fill="#14131B">Shared messages, events and interfaces</text><text x="48" y="884" font-size="16" fill="#625D58">Explore the interactive graph for source files, module relationships and runtime details.</text></g></svg>
