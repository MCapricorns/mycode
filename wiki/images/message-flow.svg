<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="A MYCode turn from input to tools and back to the interface"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#C72E38"/></marker></defs><rect width="1200" height="520" rx="20" fill="#FAF6EE"/><g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="64" font-size="30" font-weight="650" fill="#14131B">A turn, from input to output</text><text x="48" y="102" font-size="18" fill="#625D58">The interface sends actions. The agent runs tools. Events bring the state back.</text><rect x="48" y="150" width="340" height="104" rx="8" fill="#F3EDE2"/><text x="68" y="192" font-size="22" font-weight="600" fill="#14131B">FrontendAction</text><text x="68" y="226" font-size="17" fill="#625D58">Input → reducer → driver</text><rect x="424" y="150" width="340" height="104" rx="8" fill="#F3EDE2"/><text x="444" y="192" font-size="22" font-weight="600" fill="#14131B">CoreBridge</text><text x="444" y="226" font-size="17" fill="#625D58">Assemble turn and registry</text><rect x="800" y="150" width="340" height="104" rx="8" fill="#F3EDE2"/><text x="820" y="192" font-size="22" font-weight="600" fill="#14131B">Agent cycle</text><text x="820" y="226" font-size="17" fill="#625D58">Provider request and stream</text><rect x="48" y="298" width="340" height="104" rx="8" fill="#FAE7E4"/><text x="68" y="340" font-size="22" font-weight="600" fill="#14131B">Code mode</text><text x="68" y="374" font-size="17" fill="#625D58">Rhai call(name, args)</text><rect x="424" y="298" width="340" height="104" rx="8" fill="#F3EDE2"/><text x="444" y="340" font-size="22" font-weight="600" fill="#14131B">Tool result</text><text x="444" y="374" font-size="17" fill="#625D58">Ledger and child progress</text><rect x="800" y="298" width="340" height="104" rx="8" fill="#F3EDE2"/><text x="820" y="340" font-size="22" font-weight="600" fill="#14131B">View model</text><text x="820" y="374" font-size="17" fill="#625D58">Project events → GPUI</text><g fill="none" stroke="#C72E38" stroke-width="2" marker-end="url(#arrow)"><path d="M392 202h28m348 0h28m292 52v26H218v14M392 350h28m348 0h28"/></g><text x="48" y="466" font-size="17" fill="#625D58">Inner progress preserves call_id and phase. Cancellation stops the current turn; completed work stays recorded.</text></g></svg>
