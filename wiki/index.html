<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYCode · 知识图谱</title>
<style>
  :root {
    --bg: #0a0d14;
    --surface: #101521;
    --surface-2: #151b28;
    --surface-3: #1b2231;
    --line: rgba(255, 255, 255, .08);
    --line-strong: rgba(255, 255, 255, .16);
    --text: #e8ebf2;
    --muted: #9aa4b8;
    --dim: #6b7688;
    --crate: #7c8cff;
    --module: #45c8b0;
    --flow: #b48ef0;
    --data: #e3b341;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(900px 420px at 82% -8%, rgba(124, 140, 255, .18), transparent 60%),
      radial-gradient(700px 380px at 4% 0%, rgba(69, 200, 176, .1), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header.top {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 13, 20, .78);
    backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; border-radius: 8px; background: #fff; padding: 4px; }
  .brand strong { font-size: 15px; letter-spacing: .01em; }
  .brand span { color: var(--dim); font-size: 12px; margin-left: 8px; }
  nav.links { display: flex; gap: 16px; margin-left: 10px; }
  nav.links a { color: var(--muted); font-size: 12.5px; text-decoration: none; }
  nav.links a:hover { color: var(--text); }
  #search {
    margin-left: auto;
    width: 260px;
    padding: 8px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    background: rgba(10, 13, 20, .9);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  #search::placeholder { color: var(--dim); }
  #search:focus { outline: none; border-color: var(--crate); box-shadow: 0 0 0 3px rgba(124, 140, 255, .18); }

  main { display: flex; flex: 1; min-height: 0; }
  #map { position: relative; flex: 1; min-width: 0; overflow: auto; padding: 18px 4px 40px 18px; }
  #layer { transform-origin: 0 0; }
  #map svg { display: block; }

  .zoom-wrap { position: sticky; top: 0; height: 0; display: flex; justify-content: flex-end; padding-right: 14px; z-index: 3; }
  .zoom { display: flex; gap: 6px; }
  .zoom button {
    width: 30px; height: 30px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: rgba(16, 21, 33, .92);
    color: var(--muted);
    font: inherit;
    line-height: 1;
    cursor: pointer;
  }
  .zoom button:hover { color: var(--text); border-color: var(--line-strong); }
  .zoom button.fit { width: auto; padding: 0 10px; font-size: 12px; }

  .edge { fill: none; stroke: rgba(255, 255, 255, .1); stroke-width: 1.2; transition: stroke .15s, opacity .15s; }
  .edge.back { stroke-dasharray: 4 5; }
  .edge.hot { stroke: var(--crate); stroke-width: 1.9; }
  .lane-label { fill: var(--dim); font-size: 11.5px; letter-spacing: .12em; }
  .lane-band { fill: rgba(255, 255, 255, .022); }
  .lane-band.alt { fill: rgba(255, 255, 255, .045); }

  .node { cursor: pointer; outline: none; }
  .node rect { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1; rx: 10; transition: fill .15s, stroke .15s; }
  .node text { fill: var(--text); font-size: 12.5px; }
  .node .dot { stroke: none; }
  .node.crate .dot { fill: var(--crate); }
  .node.module .dot { fill: var(--module); }
  .node.flow .dot { fill: var(--flow); }
  .node.data .dot { fill: var(--data); }
  .node:hover rect { fill: var(--surface-3); }
  .node:focus-visible rect { stroke: #fff; }
  .node.hot rect { fill: var(--surface-3); stroke: rgba(255, 255, 255, .3); }
  .node.active rect { fill: #222a3b; stroke: #fff; stroke-width: 1.6; }
  .node.dim { opacity: .3; }
  .node.crate rect { stroke: rgba(124, 140, 255, .55); }
  .node.module rect { stroke: rgba(69, 200, 176, .45); }
  .node.flow rect { stroke: rgba(180, 142, 240, .45); }
  .node.data rect { stroke: rgba(227, 179, 65, .45); }

  aside#detail {
    width: 372px;
    flex: none;
    border-left: 1px solid var(--line);
    background: rgba(16, 21, 33, .72);
    padding: 20px 22px 32px;
    overflow: auto;
  }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .chip.crate { color: var(--crate); border-color: rgba(124, 140, 255, .4); }
  .chip.module { color: var(--module); border-color: rgba(69, 200, 176, .4); }
  .chip.flow { color: var(--flow); border-color: rgba(180, 142, 240, .4); }
  .chip.data { color: var(--data); border-color: rgba(227, 179, 65, .4); }
  #detail h2 { margin: 10px 0 8px; font-size: 19px; font-weight: 650; letter-spacing: .01em; }
  #detail p.summary { margin: 0 0 4px; color: #c8cfdd; }
  .section { margin-top: 22px; }
  .section h3 {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
  }
  .file {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 6px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(21, 27, 40, .7);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .file:hover { border-color: var(--line-strong); background: var(--surface-3); }
  .file .name { font-family: var(--mono); font-size: 12.5px; }
  .file .dir { color: var(--dim); font-size: 11.5px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .lines { margin-left: auto; color: var(--dim); font-size: 11px; flex: none; }
  .related { display: flex; flex-wrap: wrap; gap: 6px; }
  .related button {
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .related button:hover { color: var(--text); border-color: var(--line-strong); }
  .empty { color: var(--dim); }

  #codeView {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: rgba(8, 11, 17, .72);
    backdrop-filter: blur(3px);
    z-index: 20;
  }
  #codeView[hidden] { display: none; }
  .sheet {
    display: flex;
    flex-direction: column;
    margin: 26px auto;
    width: min(1180px, calc(100vw - 48px));
    max-height: calc(100vh - 52px);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
    overflow: hidden;
  }
  .sheet header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(21, 27, 40, .6);
  }
  .sheet .path { font-family: var(--mono); font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .path .dir { color: var(--dim); }
  .sheet .meta { margin-left: auto; color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  .sheet header a, .sheet header button {
    flex: none;
    padding: 5px 11px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .sheet header a:hover, .sheet header button:hover { color: var(--text); }
  .scroll { overflow: auto; flex: 1; background: #0c1017; }
  .cols { display: flex; align-items: flex-start; min-width: min-content; }
  .gutter {
    position: sticky;
    left: 0;
    flex: none;
    padding: 12px 12px 24px;
    border-right: 1px solid var(--line);
    background: #0c1017;
    color: #4d5666;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 20px;
    text-align: right;
    user-select: none;
  }
  .code {
    padding: 12px 22px 24px 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 20px;
    white-space: pre;
    tab-size: 4;
    color: #d7dcea;
  }
  .code .ln { min-height: 20px; }
  .code .k { color: #c792ea; }
  .code .t { color: #7fd3c1; }
  .code .s { color: #a5d6a7; }
  .code .c { color: #5d6a7d; font-style: italic; }
  .code .n { color: #e3b341; }
  .code .a { color: #7c8cff; }

  footer { padding: 7px 22px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; }

  @media (max-width: 900px) {
    aside#detail { width: 300px; }
    nav.links { display: none; }
    #search { width: 150px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

发送、Ctrl/Cmd+G 引导、Ctrl/Cmd+V 附加剪贴板图片、Ctrl/Cmd+K 命令面板、Esc 关最上层。","links":["settings","composer"],"files":["crates/mycode-frontend/src/shortcuts.rs","crates/mycode-desktop/src/ui/settings/shortcuts.rs"]},{"id":"launch","label":"launch","group":"module","lane":1,"summary":"建窗口之前的步骤：--help/--version、更新助手入口、打开家目录、清理自更新残留、结算暂存的更新。","links":["desktop","app","update"],"files":["crates/mycode-frontend/src/launch.rs"]},{"id":"frontend","label":"mycode-frontend","group":"crate","lane":2,"summary":"与界面无关的产品层：视图模型状态机与动作 reducer、中英文本、git 状态、快捷键表、启动参数。界面只渲染这里的状态。","links":["desktop","app","driver","view_model"],"files":["crates/mycode-frontend/src/lib.rs","crates/mycode-frontend/src/stream.rs"]},{"id":"driver","label":"driver","group":"module","lane":3,"summary":"把动作变成核心命令，把回复与流式事件变回动作：会话、回合、设置、模型、更新、导出导入各有一条线。","links":["frontend","app"],"files":["crates/mycode-frontend/src/driver.rs","crates/mycode-frontend/src/driver/pump.rs"]},{"id":"view_model","label":"view_model","group":"module","lane":3,"summary":"WorkspaceState 加 FrontendAction reducer：同一份状态决定侧栏、对话、菜单和设置页显示什么。","links":["frontend","driver"],"files":["crates/mycode-frontend/src/view_model.rs","crates/mycode-frontend/src/view_model/state.rs","crates/mycode-frontend/src/view_model/reduce.rs"]},{"id":"app","label":"mycode-app","group":"crate","lane":4,"summary":"应用核：一条独立线程跑 CoreBridge，收命令回回复，并向界面推事件流。回合装配、压缩、子代理、MCP、设置持久化、自更新都在这里。","links":["frontend","agent","providers","tools","config","update","mcp"],"files":["crates/mycode-app/src/lib.rs","crates/mycode-app/src/dispatch.rs"]},{"id":"update","label":"自更新","group":"flow","lane":5,"summary":"查最新 Release → 取 mycode-desktop-v* 压缩包和 .sha256 → 校验 → 解包到暂存 → 落盘为 <home>/update 的待装包。退出或重启时由平台助手换掉正在运行的二进制。","links":["app","launch","desktop"],"files":["crates/mycode-app/src/updates.rs","crates/mycode-app/src/updates/apply.rs"]},{"id":"mcp","label":"MCP","group":"module","lane":3,"summary":"stdio 与 Streamable HTTP 两种通道，最多 64 台服务器，magpie Library 的 mcp.json 一并合并。工具少而 schema 小的服务直接注册成普通工具 ","links":["agent","core","mcp"],"files":["crates/mycode-tools/src/lib.rs","crates/mycode-tools/src/tool.rs","crates/mycode-tools/src/registry.rs"]},{"id":"core","label":"mycode-core","group":"crate","lane":7,"summary":"共享类型：消息、事件、工具规格、图片与附件的上限、Provider 端口、全局分配器。它不认识界面也不认识网络。","links":["providers","tools","config","attachments"],"files":["crates/mycode-core/src/lib.rs","crates/mycode-core/src/message.rs"]},{"id":"config","label":"mycode-config","group":"crate","lane":7,"summary":"家目录与设置：严格 JSON 的设置、密钥、界面状态；写坏的文档备份成 *.broken-*，能救的字段留下。","links":["core","home","settings"],"files":["crates/mycode-config/src/lib.rs","crates/mycode-config/src/settings.rs","crates/mycode-config/src/home.rs"]},{"id":"home","label":"~/.mycode","group":"data","lane":8,"summary":"settings.json（网关、MCP、外观、代理）、AGENTS.md、mcp.json、skills/、secrets.json、ui.json、sessions.db、sessions/、agents/、agent-worktrees/、scratch/、bin/、update/。","links":["config","sessions"],"files":["crates/mycode-config/src/home.rs"]},{"id":"send","label":"一条消息","group":"flow","lane":4,"summary":"先写进账本 → 装配回合 → 工具结果随到随提交 → 回复结束发 ChatDone。取消只停止当前回合，已收到的思考、正文和完成的工具调用都保留。","links":["composer","driver","agent","sessions"],"files":["crates/mycode-app/src/turn.rs","crates/mycode-app/src/turn/pump.rs","crates/mycode-agent/src/turn.rs"]}]}</script>
<script type="application/json" id="file-data">{"crates/mycode-desktop/src/main.rs":"//! MYCode desktop application entry point.\n//\n// Release builds run windowed: no console flashes on Windows. Debug builds\n// keep the console so eprintln diagnostics stay visible.\n#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]\n\nuse std::borrow::Cow;\n\nuse mycode_desktop::workspace;\n\n// The global allocator lives in mycode-core's crate root: a bin target's\n// own `#[global_allocator]` here would collide with it.\n\n/// Kit icons plus the embedded application mark used in the title bar.\nstruct BrandAssets;\n\nimpl gpui_kit::AssetSource for BrandAssets {\n    fn load(&self, path: &str) -> gpui_kit::Result<Option<Cow<'static, [u8]>>> {\n        if path == \"brand/icon.ico\" {\n            return Ok(Some(Cow::Borrowed(include_bytes!(\"../assets/icon.ico\"))));\n        }\n        gpui_kit::assets::AllAssets.load(path)\n    }\n\n    fn list(&self, path: &str) -> gpui_kit::Result<Vec<gpui_kit::SharedString>> {\n        gpui_kit::assets::AllAssets.list(path)\n    }\n}\n\nfn emit_early_text(text: &str) {\n    #[cfg(windows)]\n    {\n        write_parent_console(text);\n    }\n    #[cfg(not(windows))]\n    {\n        print!(\"{text}\");\n        let _ = std::io::Write::flush(&mut std::io::stdout());\n    }\n}\n\n/// Attaches the parent console and writes `text` there.\n///\n/// A `windows_subsystem = \"windows\"` binary starts with no stdout. `println!`\n/// would not reach the terminal that launched `--version` or `--help`.\n#[cfg(windows)]\nfn write_parent_console(text: &str) {\n    use windows_sys::Win32::Storage::FileSystem::WriteFile;\n    use windows_sys::Win32::System::Console::{\n        ATTACH_PARENT_PROCESS, AttachConsole, GetStdHandle, STD_OUTPUT_HANDLE,\n    };\n\n    // SAFETY: AttachConsole borrows no pointers. ATTACH_PARENT_PROCESS asks\n    // for the console of the process that started this one. Failure leaves\n    // the process without a console; the WriteFile path then falls back.\n    unsafe {\n        AttachConsole(ATTACH_PARENT_PROCESS);\n    }\n    // SAFETY: STD_OUTPUT_HANDLE is the documented constant. The returned\n    // handle is borrowed from the process and is not closed here.\n    let handle = unsafe { GetStdHandle(STD_OUTPUT_HANDLE) };\n    let invalid = handle.is_null() || (handle as isize) == -1;\n    if invalid {\n        print!(\"{text}\");\n        return;\n    }\n    let bytes = text.as_bytes();\n    let mut written = 0_u32;\n    // SAFETY: `bytes` is readable for this length and `written` is a live\n    // u32. A null OVERLAPPED means a synchronous write.\n    let wrote = unsafe {\n        WriteFile(\n            handle,\n            bytes.as_ptr().cast(),\n            u32::try_from(bytes.len()).unwrap_or(u32::MAX),\n            &raw mut written,\n            std::ptr::null_mut(),\n        )\n    };\n    if wrote == 0 {\n        print!(\"{text}\");\n    }\n}\n\nfn install_surface_panic_hook() {\n    let previous = std::panic::take_hook();\n    std::panic::set_hook(Box::new(move |info| {\n        let message = info\n            .payload()\n            .downcast_ref::<&str>()\n            .copied()\n            .map(str::to_owned)\n            .or_else(|| info.payload().downcast_ref::<String>().cloned())\n            .unwrap_or_else(|| info.to_string());\n        if let Some(notice) = mycode_frontend::launch::surface_failure_message(&message) {\n            eprintln!(\"{notice}\");\n            std::process::exit(1);\n        }\n        previous(info);\n    }));\n}\n\nfn main() {\n    let args: Vec<String> = std::env::args().skip(1).collect();\n    // The self-update helper entry is shared with every `mycode*` binary.\n    if let Some(code) = mycode_frontend::launch::apply_update_from_args(&args) {\n        std::process::exit(code);\n    }\n    if let Some(action) = mycode_frontend::launch::early_action(&args) {\n        let text = match action {\n            mycode_frontend::launch::EarlyAction::Version => {\n                format!(\n                    \"{}\\n\",\n                    mycode_frontend::launch::version_line(\"mycode-desktop\")\n                )\n            }\n            mycode_frontend::launch::EarlyAction::Help => {\n                mycode_frontend::launch::help_text(\"mycode-desktop\")\n            }\n            mycode_frontend::launch::EarlyAction::Unknown(flag) => {\n                emit_early_text(&format!(\n                    \"mycode: unknown option {flag}\\n\\n{}\",\n                    mycode_frontend::launch::help_text(\"mycode-desktop\")\n                ));\n                std::process::exit(1);\n            }\n        };\n        // Release builds are windowed, so stdout is not a console until the\n        // parent console is attached. Debug builds already have one.\n        emit_early_text(&text);\n        std::process::exit(0);\n    }\n    install_surface_panic_hook();\n    let home = match mycode_frontend::launch::home() {\n        Ok(home) => home,\n        Err(error) => {\n            eprintln!(\"mycode home unavailable: {error}\");\n            std::process::exit(1);\n        }\n    };\n    // One desktop per home, claimed before the launch steps clear update\n    // files a running desktop may be using. The lock lives until exit.\n    let _instance = match mycode_desktop::instance::claim(&home) {\n        mycode_desktop::instance::Claim::Run(lock) => lock,\n        mycode_desktop::instance::Claim::Running => {\n            eprintln!(\n                \"mycode: MYCode is already running for {}\",\n                home.root().display()\n            );\n            std::process::exit(0);\n        }\n    };\n    let mycode_frontend::launch::Launch { home, update } =\n        mycode_frontend::launch::settle(home, true);\n    // A pending payload a previous session staged but never swapped — a\n    // crash or a lost helper — re-arms here and this launch exits into it:\n    // the process that comes back up is the new version. A payload that\n    // already landed is reported once, so the swap is never silent.\n    let applied_update = match update {\n        mycode_frontend::PendingUpdate::Armed(_) => return,\n        mycode_frontend::PendingUpdate::Applied(version) => Some(version),\n        mycode_frontend::PendingUpdate::None => None,\n    };\n    // Relocate a downloaded binary into the install dir: the installed copy\n    // is spawned with the source path, this process exits, and the new copy\n    // deletes the download and writes the desktop shortcut.\n    match mycode_frontend::install::ensure_desktop_installed(&home) {\n        mycode_frontend::install::DesktopInstall::Exit => std::process::exit(0),\n        mycode_frontend::install::DesktopInstall::Run {\n            cleanup: Some(source),\n        } => {\n            std::thread::spawn(move || mycode_frontend::install::cleanup_installed_source(source));\n        }\n        mycode_frontend::install::DesktopInstall::Run { cleanup: None } => {}\n    }\n    gpui_kit::application()\n        .with_assets(BrandAssets)\n        .run(move |cx| {\n            gpui_kit::init(cx);\n            workspace::open_window(home, applied_update, cx);\n        });\n}\n","crates/mycode-desktop/src/lib.rs":"//! GPUI desktop frontend for MYCode.\n//!\n//! The application core lives in `mycode-app` (a [`mycode_frontend::CoreBridge`]\n//! thread owns sessions and turns); the shared product layer in\n//! `mycode-frontend`. This crate owns windows and chrome; it never runs a\n//! model turn or a tool itself.\npub mod instance;\npub mod ui;\npub mod workspace;\n\npub use mycode_frontend::{git_status, i18n, launch, view_model};\n\npub(crate) use mycode_frontend::unix_now;\n","crates/mycode-desktop/src/instance.rs":"//! One desktop per home.\n//!\n//! The session store keeps one writer per process. Two desktops on one home\n//! could open the same chat, and each would cut the JSONL bytes the other\n//! committed off as a torn tail on its next append. The desktop is the only\n//! writer of stored sessions, so it alone holds an exclusive lock on\n//! `<home>/mycode-desktop.instance` for its whole life. The OS releases the\n//! lock however the process ends, so a crash never leaves the home locked.\n//!\n//! A second launch raises the running window (Windows) and exits. A launch\n//! that races a desktop on its way out — the installed copy a download hands\n//! off to, or the relaunch an update swap starts — waits for it to leave.\n\nuse std::fs::{File, OpenOptions, TryLockError};\nuse std::time::{Duration, Instant};\n\nuse mycode_frontend::HomeLayout;\n\n/// Lock file in the home root, beside `mycode-desktop.shortcut`.\nconst LOCK_FILE: &str = \"mycode-desktop.instance\";\n/// How long a launch waits for a desktop that is exiting. Its shutdown\n/// joins the core thread, which first ends running turns and MCP servers.\nconst EXIT_GRACE: Duration = Duration::from_secs(10);\n/// Pause between lock attempts while waiting.\nconst RETRY_EVERY: Duration = Duration::from_millis(100);\n\n/// Exclusive ownership of one home, released on drop or process exit.\n#[derive(Debug)]\npub struct InstanceLock {\n    _file: File,\n}\n\n/// What [`claim`] decided for this launch.\n#[derive(Debug)]\npub enum Claim {\n    /// Start the desktop. `None` when the lock file could not be opened or\n    /// locked for any reason other than another owner: refusing to open\n    /// would be worse than running unguarded.\n    Run(Option<InstanceLock>),\n    /// Another desktop owns this home; its window was raised if it had one.\n    Running,\n}\n\n/// Claims `home` for this desktop process.\n///\n/// Call it before the launch steps: they clear update files that a running\n/// desktop may still be using.\n#[must_use]\npub fn claim(home: &HomeLayout) -> Claim {\n    claim_within(home, EXIT_GRACE, raise_running_window)\n}\n\nfn claim_within(home: &HomeLayout, grace: Duration, raise: impl Fn() -> bool) -> Claim {\n    let Some(file) = open_lock_file(home) else {\n        return Claim::Run(None);\n    };\n    let deadline = Instant::now() + grace;\n    loop {\n        match file.try_lock() {\n            Ok(()) => return Claim::Run(Some(InstanceLock { _file: file })),\n            Err(TryLockError::Error(_)) => return Claim::Run(None),\n            Err(TryLockError::WouldBlock) => {}\n        }\n        // A live owner has a window to raise. One still starting opens it\n        // during the wait; one leaving has already closed it.\n        if raise() || Instant::now() >= deadline {\n            return Claim::Running;\n        }\n        std::thread::sleep(RETRY_EVERY);\n    }\n}\n\nfn open_lock_file(home: &HomeLayout) -> Option<File> {\n    let path = home.owned_join(LOCK_FILE).ok()?;\n    // A first launch finds no home yet. The config layer tightens the\n    // root's permissions when it first opens it, as it does for the root\n    // the session index creates.\n    std::fs::create_dir_all(home.root()).ok()?;\n    let mut options = OpenOptions::new();\n    options.read(true).write(true).create(true).truncate(false);\n    #[cfg(unix)]\n    {\n        use std::os::unix::fs::OpenOptionsExt as _;\n        options.mode(0o600);\n    }\n    options.open(path).ok()\n}\n\n/// Restores and focuses the main window of another running desktop.\n/// `false` when none is open: that desktop is still starting or leaving.\n#[cfg(windows)]\nfn raise_running_window() -> bool {\n    use windows_sys::Win32::Foundation::{HWND, LPARAM};\n    use windows_sys::Win32::UI::WindowsAndMessaging::{\n        EnumWindows, GW_OWNER, GetWindow, GetWindowThreadProcessId, IsIconic, IsWindowVisible,\n        SW_RESTORE, SetForegroundWindow, ShowWindow,\n    };\n    use windows_sys::core::BOOL;\n\n    struct Search {\n        own_pid: u32,\n        found: HWND,\n    }\n\n    unsafe extern \"system\" fn visit(window: HWND, data: LPARAM) -> BOOL {\n        // SAFETY: `data` is the `Search` handed to EnumWindows below, which\n        // outlives the enumeration and is not touched elsewhere meanwhile.\n        let search = unsafe { &mut *(data as *mut Search) };\n        // SAFETY: `window` is a top-level handle EnumWindows just produced;\n        // these calls take no pointers.\n        let main_window =\n            unsafe { IsWindowVisible(window) != 0 && GetWindow(window, GW_OWNER).is_null() };\n        if !main_window {\n            return 1;\n        }\n        let mut pid = 0_u32;\n        // SAFETY: `pid` is a live u32 the call writes.\n        unsafe { GetWindowThreadProcessId(window, &raw mut pid) };\n        if pid == 0 || pid == search.own_pid || !is_desktop_process(pid) {\n            return 1;\n        }\n        search.found = window;\n        0\n    }\n\n    let mut search = Search {\n        own_pid: std::process::id(),\n        found: std::ptr::null_mut(),\n    };\n    // SAFETY: `visit` has the WNDENUMPROC signature and only dereferences\n    // `search`, which lives across this synchronous call.\n    unsafe { EnumWindows(Some(visit), (&raw mut search) as LPARAM) };\n    if search.found.is_null() {\n        return false;\n    }\n    // SAFETY: window-state calls on a handle EnumWindows produced; a window\n    // that closed meanwhile makes them fail without effect.\n    unsafe {\n        if IsIconic(search.found) != 0 {\n            ShowWindow(search.found, SW_RESTORE);\n        }\n        SetForegroundWindow(search.found);\n    }\n    true\n}\n\n/// Whether `pid` runs a MYCode desktop binary (`mycode-desktop*.exe`): the\n/// installed copy, or a download started before it was installed.\n#[cfg(windows)]\nfn is_desktop_process(pid: u32) -> bool {\n    use windows_sys::Win32::Foundation::CloseHandle;\n    use windows_sys::Win32::System::Threading::{\n        OpenProcess, PROCESS_NAME_WIN32, PROCESS_QUERY_LIMITED_INFORMATION,\n        QueryFullProcessImageNameW,\n    };\n\n    // SAFETY: no pointers; a null handle means the process is gone or\n    // denies the query.\n    let process = unsafe { OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, 0, pid) };\n    if process.is_null() {\n        return false;\n    }\n    let mut buffer = [0_u16; 1024];\n    let mut len = buffer.len() as u32;\n    // SAFETY: `buffer` holds `len` u16s; the call writes at most that many\n    // and stores the written length in `len`.\n    let queried = unsafe {\n        QueryFullProcessImageNameW(\n            process,\n            PROCESS_NAME_WIN32,\n            buffer.as_mut_ptr(),\n            &raw mut len,\n        )\n    };\n    // SAFETY: `process` is live and closed exactly once.\n    unsafe { CloseHandle(process) };\n    if queried == 0 {\n        return false;\n    }\n    let path = String::from_utf16_lossy(&buffer[..(len as usize).min(buffer.len())]);\n    let name = path\n        .rsplit('\\\\')\n        .next()\n        .unwrap_or_default()\n        .to_ascii_lowercase();\n    name.starts_with(\"mycode-desktop\") && name.ends_with(\".exe\")\n}\n\n/// macOS hands a Finder or Dock launch to the running app itself; a binary\n/// started from a terminal has no window of its own to raise.\n#[cfg(not(windows))]\nfn raise_running_window() -> bool {\n    false\n}\n\n#[cfg(test)]\nmod tests {\n    use std::time::Duration;\n\n    use mycode_frontend::HomeLayout;\n\n    use super::{Claim, claim_within};\n\n    fn scratch(label: &str) -> (std::path::PathBuf, HomeLayout) {\n        let root = std::env::temp_dir().join(format!(\n            \"mycode-instance-{label}-{}-{}\",\n            std::process::id(),\n            crate::unix_now().as_nanos()\n        ));\n        let home = HomeLayout::from_root(&root).expect(\"home\");\n        (root, home)\n    }\n\n    #[test]\n    fn a_second_desktop_reports_the_running_one() {\n        let (root, home) = scratch(\"second\");\n        let Claim::Run(Some(first)) = claim_within(&home, Duration::ZERO, || false) else {\n            panic!(\"the first claim must own a fresh home\");\n        };\n        assert!(matches!(\n            claim_within(&home, Duration::from_millis(250), || false),\n            Claim::Running\n        ));\n        // A raised window ends the wait at once.\n        let started = std::time::Instant::now();\n        assert!(matches!(\n            claim_within(&home, Duration::from_secs(30), || true),\n            Claim::Running\n        ));\n        assert!(started.elapsed() < Duration::from_secs(5));\n        drop(first);\n        assert!(matches!(\n            claim_within(&home, Duration::ZERO, || false),\n            Claim::Run(Some(_))\n        ));\n        let _ = std::fs::remove_dir_all(root);\n    }\n\n    #[test]\n    fn a_launch_takes_over_from_a_desktop_that_exits_within_the_grace() {\n        let (root, home) = scratch(\"handoff\");\n        let Claim::Run(Some(leaving)) = claim_within(&home, Duration::ZERO, || false) else {\n            panic!(\"the first claim must own a fresh home\");\n        };\n        let exit = std::thread::spawn(move || {\n            std::thread::sleep(Duration::from_millis(300));\n            drop(leaving);\n        });\n        assert!(matches!(\n            claim_within(&home, Duration::from_secs(10), || false),\n            Claim::Run(Some(_))\n        ));\n        exit.join().expect(\"exit thread\");\n        let _ = std::fs::remove_dir_all(root);\n    }\n}\n","crates/mycode-desktop/src/workspace.rs":"//! The workspace window view: title bar, sessions sidebar, chat column,\n//! right inspector, and the full-page settings view.\nuse std::collections::{HashSet, VecDeque};\nuse std::time::{Duration, Instant};\n\nuse gpui_kit::component::Root;\nuse gpui_kit::component::command::CommandState;\nuse gpui_kit::component::input::{InputEvent, InputState, TextareaState};\nuse gpui_kit::component::theme::{Theme, ThemeMode};\nuse gpui_kit::{App, AppContext as _, Context, Entity, Pixels, Window, WindowBounds};\nuse mycode_frontend::BridgeEvent;\nuse mycode_frontend::HomeLayout;\nuse mycode_frontend::driver::{Effect, FrontendDriver};\nuse mycode_frontend::stream;\n\nuse crate::ui::McpForm;\nuse crate::view_model::{FrontendAction, MainView, WorkspaceState};\n\nmod appearance;\nmod attachments;\nmod clipboard;\nmod composer_send;\nmod conversation;\nmod history;\nmod menus;\nmod model_menu;\nmod palette;\nmod projects;\nmod settings_editor;\nmod toasts;\nmod updates_data;\n\npub(crate) use toasts::{Toast, ToastKind};\n\n/// Seconds a confirmed close stays armed before the next request asks again.\nconst CLOSE_CONFIRM_WINDOW: Duration = Duration::from_secs(6);\n\n/// Whether a close request quits now: always when idle, and while a turn\n/// runs only when the armed confirm is still inside its window. Kept as a\n/// pure helper so the rule is testable without a window.\nfn close_allowed(busy: bool, armed: Option<Instant>, now: Instant) -> bool {\n    !busy || armed.is_some_and(|armed| now.duration_since(armed) < CLOSE_CONFIRM_WINDOW)\n}\n\nmod window;\n\nuse window::{client_window_options, startup_geometry, strip_dwm_border};\n/// Opens the main window over one owned home. `applied_update` is the\n/// version a self-update just installed; it is announced with a toast.\n///\n/// # Panics\n///\n/// Panics when the window cannot open; the process has no useful headless\n/// fallback by design.\npub fn open_window(home: HomeLayout, applied_update: Option<String>, cx: &mut App) {\n    cx.bind_keys([gpui_kit::KeyBinding::new(\n        \"secondary-k\",\n        crate::ui::ToggleCommandPalette,\n        None,\n    )]);\n    // The driver owns the core bridge, the view model, and every product\n    // decision. Its wake callback hands a thread-safe sender to the gpui\n    // pump, which drains replies, timers, and events on the main thread.\n    let (wake_tx, wake_rx) = tokio::sync::mpsc::unbounded_channel();\n    let mut driver = FrontendDriver::start(home.clone(), move || {\n        let _ = wake_tx.send(());\n    });\n    // The changes panel and the diff panel show it.\n    driver.watch_git();\n    if let Some(version) = applied_update {\n        driver.note_update_applied(version);\n    }\n    // Open as a regular window at the persisted (or default) bounds: the\n    // maximize-on-open workaround for gpui's stale-scale sizing is retired\n    // by user request (DPI edge cases accepted); the user can maximize\n    // manually.\n    let saved_size = mycode_frontend::read_ui_state(&home)\n        .ok()\n        .and_then(|state| state.window_size);\n    let (bounds, min_size) = startup_geometry(cx, saved_size);\n    let options = client_window_options(bounds, min_size);\n    cx.open_window(options, |window, cx| {\n        // Platform blur behind translucent chrome. GPUI has no per-element\n        // backdrop filter; macOS and Windows implement this appearance, and a\n        // system without blur simply composites the translucent fills.\n        window.set_background_appearance(gpui_kit::WindowBackgroundAppearance::Blurred);\n        strip_dwm_border(window);\n        // Start in dark mode until the saved appearance arrives, then sync\n        // the Desk colors into Base.\n        Theme::change(ThemeMode::Dark, Some(window), cx);\n        crate::ui::desk::apply(Theme::global_mut(cx));\n        crate::ui::syntax::sync_base(cx);\n        let workspace = Workspace::new(driver, wake_rx, window, cx);\n        window.on_window_should_close(cx, {\n            let workspace = workspace.clone();\n            move |window, cx| {\n                workspace.update(cx, |workspace, cx| workspace.on_close_request(window, cx))\n            }\n        });\n        cx.new(|cx| Root::new(workspace, window, cx))\n    })\n    .expect(\"open the MYCode window\");\n}\n\n/// Scroll position captured before older entries are prepended.\nstruct ScrollHold {\n    offset_y: Pixels,\n    content_height: Pixels,\n}\n\n/// Scroll position captured before a theme change. Applied the next time the\n/// conversation column is painted, including when that paint is a later view.\nstruct AppearanceScroll {\n    pinned: bool,\n    offset_y: Pixels,\n}\n\npub struct Workspace {\n    /// Shared product driver: the view model, the bridge, replies, timers,\n    /// and every UI-agnostic decision. GPUI keeps only window state and\n    /// the effects it alone can perform.\n    driver: FrontendDriver,\n    /// Whether the Magpie settings page's model list is expanded. Collapsed\n    /// by default; the summary row keeps the count and the current name.\n    pub(crate) magpie_models_open: bool,\n    /// Pictures and code files waiting to ride the next prompt.\n    pub(crate) attachments: mycode_frontend::Attachments,\n    /// Root focus so key events (Escape) reach the workspace node even when\n    /// no input holds focus.\n    focus_handle: gpui_kit::FocusHandle,\n    composer: Entity<TextareaState>,\n    /// Whether the composer placeholder is the in-turn queue hint.\n    pub(crate) composer_busy: bool,\n    proxy_input: Option<Entity<InputState>>,\n    /// The proxy field shows the stored URL on its next render.\n    proxy_sync_pending: bool,\n    mcp_form: Option<Entity<McpForm>>,\n\n    mcp_json_input: Option<Entity<TextareaState>>,\n    /// Search box inside the model step of the shared picker.\n    model_picker_input: Option<Entity<InputState>>,\n    /// Top-bar filter for the settings navigation.\n    settings_search_input: Option<Entity<InputState>>,\n    /// Sidebar filter over session titles already loaded from the index.\n    session_filter_input: Option<Entity<InputState>>,\n    /// Search field and keyboard state for the global command palette.\n    command_palette: Option<Entity<CommandState>>,\n    /// The next frame should focus the palette search field.\n    palette_focus_pending: bool,\n    /// The next frame should focus the workspace node. Set when settings\n    /// opens, because the previously focused composer is no longer mounted.\n    settings_focus_pending: bool,\n    /// The next model-step render should clear and focus the search box.\n    picker_focus_pending: bool,\n    ask_inputs: Vec<Entity<InputState>>,\n    /// Keyboard selection and scroll handles for the composer pickers.\n    menu_navigation: menus::MenuNavigation,\n    /// Composer text + focus request handed down by `Effect::ComposerSet`;\n    /// the composer paint consumes it.\n    pending_composer_set: Option<(String, bool)>,\n    /// `Effect::RestoreFocus`: the next paint focuses the composer (chat)\n    /// or the workspace root.\n    focus_restore_pending: bool,\n    /// The once-a-second repaint that keeps live subagent runtimes counting\n    /// between progress events. `true` while that timer loop exists.\n    job_tick_running: bool,\n    toasts: Vec<Toast>,\n    next_toast_id: u64,\n    /// In-app folder browser. `None` while the picker is closed.\n    pub(crate) project_picker: Option<crate::ui::project_picker::ProjectPicker>,\n    /// Only the explicit chat-folder chip may rebind an existing conversation.\n    picker_chat_session: Option<String>,\n    /// Keeps the conversation column glued to the newest entry while a turn\n    /// streams; without it new content grows below the fold.\n    conversation_scroll: gpui_kit::ScrollHandle,\n    /// The subagent window's body. It follows the newest step the same way\n    /// the conversation follows its tail.\n    subagent_scroll: gpui_kit::ScrollHandle,\n    /// Captured when older entries are prepended. The chat column applies it\n    /// in the same frame, after layout and before the scroller positions its\n    /// children. gpui's offset grows more negative toward the bottom, so the\n    /// correction subtracts the content-height growth.\n    scroll_hold: Option<ScrollHold>,\n    /// Restored on the next conversation paint after a theme change.\n    appearance_scroll: Option<AppearanceScroll>,\n    /// Tool rows the transcript is showing in full. Empty means one-line summaries.\n    expanded_tools: HashSet<String>,\n    /// Consecutive tool runs the transcript has expanded. Keyed by the run's\n    /// first call event id.\n    expanded_tool_batches: HashSet<String>,\n    /// Compaction summary cards the transcript is showing in full.\n    expanded_summaries: HashSet<String>,\n    /// A window-close request armed the confirm at this instant. A second\n    /// request inside [`CLOSE_CONFIRM_WINDOW`] quits; a later one asks again.\n    close_armed: Option<Instant>,\n    /// Row-delete key clicked once and waiting for the confirming click.\n    /// Session, provider, MCP-server, and folder-root rows all share it.\n    armed_delete: Option<String>,\n    /// Last interface font size applied to the window. Empty until the first frame.\n    applied_font_size: String,\n    /// Language last written into input placeholders. `u8::MAX` until the\n    /// first frame, so a settings load that flips the language refreshes them.\n    applied_language: u8,\n    /// Ask rows whose free-text field should be cleared on the next paint —\n    /// `Effect::AskTextCleared` fires without a window, so the input's own\n    /// render performs the reset.\n    ask_text_cleared: HashSet<usize>,\n}\n\nimpl Workspace {\n    /// Builds the workspace and issues the initial core loads.\n    pub fn new(\n        driver: FrontendDriver,\n        wake_rx: tokio::sync::mpsc::UnboundedReceiver<()>,\n        window: &mut Window,\n        cx: &mut App,\n    ) -> Entity<Self> {\n        let composer = cx.new(|cx| {\n            TextareaState::new(window, cx)\n                .placeholder(crate::ui::composer_placeholder(false))\n                .soft_wrap(true)\n                // Three fixed rows: pasting a wall of text scrolls inside\n                // the field instead of growing the composer card.\n                .auto_grow(3, 3)\n                .submit_on_enter(true)\n        });\n        let focus_handle = cx.focus_handle();\n        focus_handle.focus(window, cx);\n        let workspace = cx.new(|_| Self {\n            driver,\n            magpie_models_open: false,\n            attachments: mycode_frontend::Attachments::default(),\n            focus_handle,\n            composer,\n            composer_busy: false,\n            proxy_input: None,\n            proxy_sync_pending: false,\n            mcp_form: None,\n\n            mcp_json_input: None,\n            model_picker_input: None,\n            settings_search_input: None,\n            session_filter_input: None,\n            command_palette: None,\n            palette_focus_pending: false,\n            settings_focus_pending: false,\n            picker_focus_pending: false,\n            ask_inputs: Vec::new(),\n            menu_navigation: menus::MenuNavigation::default(),\n            pending_composer_set: None,\n            focus_restore_pending: false,\n            job_tick_running: false,\n            toasts: Vec::new(),\n            next_toast_id: 0,\n            project_picker: None,\n            picker_chat_session: None,\n            conversation_scroll: gpui_kit::ScrollHandle::new(),\n            subagent_scroll: gpui_kit::ScrollHandle::new(),\n            scroll_hold: None,\n            appearance_scroll: None,\n            expanded_tools: HashSet::new(),\n            expanded_tool_batches: HashSet::new(),\n            expanded_summaries: HashSet::new(),\n            close_armed: None,\n            armed_delete: None,\n            applied_font_size: String::new(),\n            applied_language: u8::MAX,\n            ask_text_cleared: HashSet::new(),\n        });\n        workspace.update(cx, |workspace, cx| {\n            let filter = cx.new(|cx| {\n                InputState::new(window, cx)\n                    .placeholder(crate::i18n::t(\"Search sessions\", \"搜索会话\"))\n            });\n            cx.subscribe_in(&filter, window, |workspace, entity, event, _, cx| {\n                if matches!(event, InputEvent::Change) {\n                    let text = entity.read(cx).value().to_string();\n                    workspace.apply_action(FrontendAction::SessionFilterChanged(text), cx);\n                }\n            })\n            .detach();\n            workspace.session_filter_input = Some(filter);\n            let composer = workspace.composer.clone();\n            cx.subscribe_in(&composer, window, |workspace, _, event, window, cx| {\n                workspace.on_composer_event(event, window, cx);\n            })\n            .detach();\n            workspace.spawn_driver_pump(wake_rx, cx);\n            {\n                let mut effects = Vec::new();\n                workspace.driver.bootstrap(&mut effects);\n                workspace.apply_effects(effects, cx);\n            }\n            // Deferred startup work (catalog refresh, update check) starts\n            // once the first frame painted; the catalog document itself\n            // loads lazily in `ensure_catalog`.\n            cx.on_next_frame(window, |workspace, _window, _cx| {\n                workspace.driver.ui_ready();\n            });\n            cx.observe_window_bounds(window, |workspace, window, cx| {\n                workspace.on_window_resized(window, cx);\n            })\n            .detach();\n        });\n        workspace\n    }\n\n    /// Parks until the driver wakes, then paints streaming deltas a frame at\n    /// a time.\n    ///\n    /// A whole turn can already be queued when this task wakes. Applying it\n    /// before the next await paints only the finished message. Each slice\n    /// stops before `ChatDone` and before the character budget, then waits\n    /// one frame so the bubble can grow.\n    fn spawn_driver_pump(\n        &self,\n        mut wake_rx: tokio::sync::mpsc::UnboundedReceiver<()>,\n        cx: &mut Context<Self>,\n    ) {\n        cx.spawn(async move |this, cx| {\n            let mut buffer: VecDeque<BridgeEvent> = VecDeque::new();\n            let mut not_before = Instant::now();\n            'outer: while wake_rx.recv().await.is_some() {\n                loop {\n                    if this\n                        .update(cx, |workspace, cx| workspace.drain_driver(&mut buffer, cx))\n                        .is_err()\n                    {\n                        return;\n                    }\n                    if buffer.is_empty() {\n                        continue 'outer;\n                    }\n                    if buffer.front().is_some_and(stream::is_stream_delta)\n                        && let Some(wait) = not_before.checked_duration_since(Instant::now())\n                        && !wait.is_zero()\n                    {\n                        cx.background_executor().timer(wait).await;\n                        continue;\n                    }\n                    let (slice, rest) = stream::split_stream_frame(std::mem::take(&mut buffer));\n                    buffer = rest;\n                    let mut streamed = false;\n                    for event in slice {\n                        streamed |= stream::is_stream_delta(&event);\n                        if this\n                            .update(cx, |workspace, cx| workspace.on_driver_event(event, cx))\n                            .is_err()\n                        {\n                            return;\n                        }\n                    }\n                    if streamed {\n                        not_before = Instant::now() + stream::STREAM_FRAME;\n                    }\n                    if !buffer.is_empty() {\n                        let now = Instant::now();\n                        let wait = not_before\n                            .checked_duration_since(now)\n                            .filter(|wait| !wait.is_zero())\n                            .unwrap_or(stream::STREAM_FRAME);\n                        cx.background_executor().timer(wait).await;\n                    }\n                }\n            }\n        })\n        .detach();\n    }\n\n    /// Replies, timers, and freshly arrived core events move to the main\n    /// thread here; each driver side effect is then performed by the window.\n    fn drain_driver(&mut self, buffer: &mut VecDeque<BridgeEvent>, cx: &mut Context<Self>) {\n        self.driver_do(\n            |driver, effects| {\n                driver.poll(effects);\n                while let Some(event) = driver.next_event() {\n                    buffer.push_back(event);\n                }\n            },\n            cx,\n        );\n    }\n\n    /// One core event through the driver; its effects land right away.\n    fn on_driver_event(&mut self, event: BridgeEvent, cx: &mut Context<Self>) {\n        self.driver_do(|driver, effects| driver.on_event(event, effects), cx);\n    }\n\n    /// Performs the work the driver delegated to this frontend.\n    fn apply_effects(&mut self, effects: Vec<Effect>, cx: &mut Context<Self>) {\n        for effect in effects {\n            match effect {\n                Effect::Toast { kind, text } => {\n                    let kind = match kind {\n                        mycode_frontend::driver::ToastKind::Info => ToastKind::Info,\n                        mycode_frontend::driver::ToastKind::Warning => ToastKind::Warning,\n                        mycode_frontend::driver::ToastKind::Error => ToastKind::Error,\n                    };\n                    self.push_toast(text, kind, cx);\n                }\n                Effect::ComposerSet { text, focus } => {\n                    self.pending_composer_set = Some((text, focus));\n                    cx.notify();\n                }\n                Effect::AttachmentsRestored(attachments) => {\n                    self.on_attachments_restored(attachments, cx);\n                }\n                Effect::AskTextCleared { index } => {\n                    self.ask_text_cleared.insert(index);\n                }\n                Effect::AskReset => {\n                    self.ask_inputs.clear();\n                }\n                Effect::AppearanceTheme(theme) => {\n                    self.capture_appearance_scroll();\n                    self.paint_appearance(&theme, cx);\n                }\n                Effect::FontSizeChanged => {\n                    self.applied_font_size.clear();\n                }\n                Effect::LanguageChanged => {\n                    self.applied_language = u8::MAX;\n                }\n                Effect::OlderPagePrepended { .. } => {\n                    self.capture_scroll_hold();\n                }\n                Effect::ScrollToTail => {\n                    if self.vm().view == MainView::Chat {\n                        self.conversation_scroll.scroll_to_bottom();\n                    }\n                }\n                Effect::ScrollAnchorInvalidated => {\n                    self.scroll_hold = None;\n                    self.driver.note_scroll_hold(false);\n                }\n                Effect::SyncProxyField => {\n                    self.proxy_sync_pending = true;\n                }\n                Effect::RestoreFocus => {\n                    self.focus_restore_pending = true;\n                }\n                Effect::Quit => {\n                    cx.quit();\n                }\n            }\n        }\n    }\n\n    pub(crate) fn git(&self) -> &crate::git_status::GitSnapshot {\n        self.driver.git()\n    }\n\n    pub(crate) fn git_diff_path(&self) -> Option<&str> {\n        self.driver.git_diff_path()\n    }\n\n    pub(crate) fn git_diff(&self) -> &str {\n        self.driver.git_diff()\n    }\n\n    /// The selected file's diff is open in its own panel, separate from the\n    /// changes list.\n    pub(crate) fn git_diff_panel_open(&self) -> bool {\n        self.driver.git_diff_open()\n    }\n\n    /// Opens one dirty path in the dedicated diff panel.\n    ///\n    /// The changes list (inspector preview or the review-all drawer) only\n    /// names files. The diff itself is a separate panel so the patch is\n    /// readable. Clicking a file always opens that panel, including when\n    /// the full changes drawer is already open.\n    pub(crate) fn on_select_git_file(&mut self, path: &str, cx: &mut Context<Self>) {\n        self.driver.select_git_file(path);\n        cx.notify();\n    }\n\n    /// Closes the dedicated file-diff panel. The changes list stays as it was.\n    pub(crate) fn on_close_git_diff_panel(&mut self, cx: &mut Context<Self>) {\n        self.driver.close_git_diff();\n        cx.notify();\n    }\n\n    fn on_composer_event(\n        &mut self,\n        event: &InputEvent,\n        window: &mut Window,\n        cx: &mut Context<Self>,\n    ) {\n        match event {\n            InputEvent::Change => {\n                let text = self.composer.read(cx).value().to_string();\n                self.apply_action(FrontendAction::ComposerChanged(text), cx);\n            }\n            InputEvent::PressEnter {\n                shift: false,\n                secondary,\n            } => {\n                let draft = self.composer.read(cx).value().to_string();\n                if self.accept_open_mention(window, cx) {\n                    return;\n                }\n                // Ctrl+Enter on a busy turn stops it and sends right after;\n                // a plain Enter steers it into the running turn (`submit`).\n                let sending = self.vm().sending || self.vm().compacting;\n                if *secondary && sending {\n                    if !self.attachments.is_empty() {\n                        // A send-now is text only; the chips wait for the\n                        // next normal send instead of riding this one.\n                        self.push_toast(\n                            crate::i18n::t(\n                                \"Attachments wait for the next send.\",\n                                \"附件等下一次发送再带上。\",\n                            ),\n                            ToastKind::Info,\n                            cx,\n                        );\n                    }\n                    self.driver_do(|d, fx| d.interrupt_send(&draft, fx), cx);\n                } else {\n                    // Enter takes the same path as the send arrow so the\n                    // waiting attachments ride this message.\n                    self.on_send(window, cx);\n                }\n            }\n            InputEvent::PressEnter { .. } | InputEvent::Focus | InputEvent::Blur => {}\n        }\n    }\n\n    /// Every state transition enters here so the GPUI-only bookkeeping —\n    /// menu selection, scroll-follow, subagent follow — runs beside the\n    /// shared reducer inside the driver.\n    pub(crate) fn apply_action(&mut self, action: FrontendAction, cx: &mut Context<Self>) {\n        self.reset_menu_navigation(&action);\n        self.driver_do(|d, fx| d.act(action, fx), cx);\n    }\n\n    /// Runs one driver interaction and performs the effects it returns.\n    ///\n    /// Replies and streamed events land here too, not only user actions, so\n    /// the scroll and selection bookkeeping is done around every driver\n    /// call: the driver's tail-follow decision reads the position the user\n    /// is looking at, and an open subagent window keeps following its log.\n    pub(crate) fn driver_do(\n        &mut self,\n        run: impl FnOnce(&mut FrontendDriver, &mut Vec<Effect>),\n        cx: &mut Context<Self>,\n    ) {\n        self.driver_take(run, cx);\n    }\n\n    /// [`Self::driver_do`] for a driver call that hands a value back, such as\n    /// a submit returning attachments the send did not take.\n    pub(crate) fn driver_take<T>(\n        &mut self,\n        run: impl FnOnce(&mut FrontendDriver, &mut Vec<Effect>) -> T,\n        cx: &mut Context<Self>,\n    ) -> T {\n        // Decide from the scroll position before this update. New text has\n        // not been laid out yet, so the handle still describes the frame the\n        // user is looking at.\n        self.driver\n            .set_conversation_at_tail(self.conversation_follows_tail());\n        self.driver.note_scroll_hold(self.scroll_hold.is_some());\n        let subagent_before = self.subagent_window_mark();\n        let menus_before = self.menu_navigation_mark();\n        let mut effects = Vec::new();\n        let value = run(&mut self.driver, &mut effects);\n        self.apply_effects(effects, cx);\n        self.reset_menu_navigation_after(menus_before);\n        self.follow_subagent_window(subagent_before);\n        self.ensure_job_tick(cx);\n        cx.notify();\n        value\n    }\n\n    /// While a turn or a subagent runs, repaint once a second so each\n    /// elapsed-time label keeps counting between progress events. The loop\n    /// retires itself as soon as nothing live is left.\n    fn ensure_job_tick(&mut self, cx: &mut Context<Self>) {\n        let idle = self.vm().live_jobs.is_empty() && !self.vm().sending;\n        if self.job_tick_running || idle {\n            return;\n        }\n        self.job_tick_running = true;\n        cx.spawn(async move |this, cx| {\n            loop {\n                cx.background_executor().timer(Duration::from_secs(1)).await;\n                // Clear the flag in the same update that finds nothing\n                // live, so a job starting right after still gets a tick.\n                let running = this\n                    .update(cx, |workspace, cx| {\n                        let idle = workspace.vm().live_jobs.is_empty() && !workspace.vm().sending;\n                        if idle {\n                            workspace.job_tick_running = false;\n                            false\n                        } else {\n                            cx.notify();\n                            true\n                        }\n                    })\n                    .unwrap_or(false);\n                if !running {\n                    break;\n                }\n            }\n        })\n        .detach();\n    }\n\n    /// The sidebar title filter, created with the workspace.\n    pub(crate) fn session_filter_input(&self) -> Option<Entity<InputState>> {\n        self.session_filter_input.clone()\n    }\n\n    // ---- thin nav / toggle dispatchers ----\n\n    pub(crate) fn on_show_settings_section(\n        &mut self,\n        section: crate::view_model::SettingsSection,\n        cx: &mut Context<Self>,\n    ) {\n        self.apply_action(FrontendAction::ShowSettingsSection(section), cx);\n        if section == crate::view_model::SettingsSection::Skills {\n            self.driver_do(|d, fx| d.refresh_skills(fx), cx);\n        }\n        if section == crate::view_model::SettingsSection::Agents {\n            self.driver.invalidate_agent_roles();\n        }\n    }\n\n    /// Resolves delegation roles when settings is showing them.\n    pub(crate) fn ensure_agent_roles(&mut self) {\n        self.driver.ensure_agent_roles();\n    }\n\n    /// Role catalog last resolved for settings. Built-ins only before the\n    /// first settings paint.\n    pub(crate) fn agent_roles(&self) -> std::sync::Arc<mycode_frontend::RoleCatalog> {\n        self.driver.agent_roles()\n    }\n\n    /// Switches the Models settings sub-page.\n    pub(crate) fn on_show_models_subview(\n        &mut self,\n        view: crate::view_model::ModelsSubview,\n        cx: &mut Context<Self>,\n    ) {\n        self.apply_action(FrontendAction::ShowModelsSubview(view), cx);\n    }\n\n    /// Switches the MCP settings sub-page.\n    pub(crate) fn on_show_mcp_subview(\n        &mut self,\n        view: crate::view_model::McpSubview,\n        cx: &mut Context<Self>,\n    ) {\n        self.apply_action(FrontendAction::ShowMcpSubview(view), cx);\n    }\n\n    pub(crate) fn on_toggle_mcp_transport_menu(&mut self, open: bool, cx: &mut Context<Self>) {\n        self.apply_action(FrontendAction::McpTransportMenuToggled(open), cx);\n    }\n\n    /// Picks the custom MCP form's transport.\n    pub(crate) fn on_select_mcp_transport(&mut self, transport: &str, cx: &mut Context<Self>) {\n        if let Some(form) = self.mcp_form.clone() {\n            form.update(cx, |form, _| form.transport = transport.to_owned());\n        }\n        self.apply_action(FrontendAction::McpTransportMenuToggled(false), cx);\n    }\n\n    pub(crate) fn on_open_session(&mut self, session_id: &str, cx: &mut Context<Self>) {\n        self.driver_do(|d, fx| d.open_session(session_id, fx), cx);\n    }\n\n    /// Switches the main area between chat and settings.\n    pub(crate) fn on_show_main_view(&mut self, view: MainView, cx: &mut Context<Self>) {\n        let entering_settings = view == MainView::Settings && self.vm().view != MainView::Settings;\n        self.driver_do(|d, fx| d.show_main_view(view, fx), cx);\n        if entering_settings {\n            self.settings_focus_pending = true;\n        }\n    }\n\n    /// Whether this frame should focus the workspace node so Settings Escape\n    /// reaches the root key listener.\n    pub(crate) fn take_settings_focus(&mut self) -> bool {\n        let pending = self.settings_focus_pending && self.vm().view == MainView::Settings;\n        self.settings_focus_pending = false;\n        pending\n    }\n\n    /// Focus the driver asked for after a switch the render could not see.\n    pub(crate) fn take_focus_restore(&mut self) -> bool {\n        std::mem::take(&mut self.focus_restore_pending)\n    }\n\n    /// Opens, closes, or pins the inspector. Does not touch the session.\n    /// The pair is persisted so a resident panel survives a restart.\n    pub(crate) fn on_set_inspector(&mut self, open: bool, pinned: bool, cx: &mut Context<Self>) {\n        self.apply_action(FrontendAction::InspectorChanged { open, pinned }, cx);\n        self.persist_ui_state();\n    }\n\n    /// Whether a tool row is showing its result body.\n    pub(crate) fn tool_row_open(&self, id: &str) -> bool {\n        self.expanded_tools.contains(id)\n    }\n\n    /// Toggles one tool row between a one-line summary and its result body.\n    pub(crate) fn on_toggle_tool_row(&mut self, id: &str, cx: &mut Context<Self>) {\n        let pinned = self.conversation_follows_tail();\n        if !self.expanded_tools.remove(id) {\n            self.expanded_tools.insert(id.to_owned());\n        }\n        self.keep_tail_pinned(pinned, cx);\n    }\n\n    /// Expanding a row at the tail grows the content below the viewport,\n    /// which reads as \"the reader scrolled up\" and stops the tail follow.\n    /// A reader who was following keeps following.\n    fn keep_tail_pinned(&mut self, pinned: bool, cx: &mut Context<Self>) {\n        if pinned && self.vm().view == MainView::Chat {\n            self.conversation_scroll.scroll_to_bottom();\n        }\n        cx.notify();\n    }\n\n    /// Whether a collapsed run of tool calls is open.\n    pub(crate) fn tool_batch_open(&self, id: &str) -> bool {\n        self.expanded_tool_batches.contains(id)\n    }\n\n    /// Toggles a one-line tool-run summary.\n    pub(crate) fn on_toggle_tool_batch(&mut self, id: &str, cx: &mut Context<Self>) {\n        let pinned = self.conversation_follows_tail();\n        if !self.expanded_tool_batches.remove(id) {\n            self.expanded_tool_batches.insert(id.to_owned());\n        }\n        self.keep_tail_pinned(pinned, cx);\n    }\n\n    /// Whether a compaction summary card shows its text.\n    pub(crate) fn summary_open(&self, id: &str) -> bool {\n        self.expanded_summaries.contains(id)\n    }\n\n    /// Toggles a compaction summary card between its header and its text.\n    pub(crate) fn on_toggle_summary(&mut self, id: &str, cx: &mut Context<Self>) {\n        let pinned = self.conversation_follows_tail();\n        if !self.expanded_summaries.remove(id) {\n            self.expanded_summaries.insert(id.to_owned());\n        }\n        self.keep_tail_pinned(pinned, cx);\n    }\n\n    /// Whether a thinking trace shows its full text. One global switch —\n    /// recorded and live traces alike — persisted in `ui.json`.\n    pub(crate) fn thinking_open(&self) -> bool {\n        !self.vm().thinking_collapsed\n    }\n\n    /// Flips the global thinking-trace switch. Every trace follows it, so\n    /// a collapsed trace never reopens alone; the switch itself decides.\n    pub(crate) fn on_toggle_thinking(&mut self, cx: &mut Context<Self>) {\n        let pinned = self.conversation_follows_tail();\n        self.driver_do(|driver, fx| driver.toggle_thinking_collapsed(fx), cx);\n        self.keep_tail_pinned(pinned, cx);\n    }\n\n    /// The settings page's thinking-display switch. `collapsed` is the new\n    /// global state, persisted with the durable UI state.\n    pub(crate) fn on_set_thinking_collapsed(&mut self, collapsed: bool, cx: &mut Context<Self>) {\n        self.driver_do(\n            |driver, fx| driver.set_thinking_collapsed(collapsed, fx),\n            cx,\n        );\n    }\n\n    /// A window-close request (the caption ×, Alt+F4, the taskbar button).\n    /// Idle, it quits at once. While a turn or compaction runs, the first\n    /// one arms a timed confirm and stays open, and the second inside\n    /// [`CLOSE_CONFIRM_WINDOW`] quits. Programmatic quits never see this.\n    pub(crate) fn on_close_request(\n        &mut self,\n        _window: &mut Window,\n        cx: &mut Context<Self>,\n    ) -> bool {\n        let busy = self.vm().sending || self.vm().compacting;\n        if close_allowed(busy, self.close_armed, Instant::now()) {\n            self.close_armed = None;\n            return true;\n        }\n        self.close_armed = Some(Instant::now());\n        // Warning outlives the armed window: an Info toast expires a\n        // second early, leaving a quit armed with no hint on screen.\n        self.push_toast(\n            crate::i18n::t(\n                \"A task is running. Click × again to quit\",\n                \"任务运行中，再点一次 × 退出\",\n            ),\n            ToastKind::Warning,\n            cx,\n        );\n        false\n    }\n\n    /// Persists the durable UI state projection (last project, selections,\n    /// inspector, window size, …) through the shared layer.\n    fn persist_ui_state(&mut self) {\n        self.driver.persist_ui_state();\n    }\n\n    // ---- accessors for the render layer ----\n\n    pub(crate) fn vm(&self) -> &WorkspaceState {\n        self.driver.vm()\n    }\n\n    pub(crate) fn focus_handle(&self) -> &gpui_kit::FocusHandle {\n        &self.focus_handle\n    }\n\n    pub(crate) fn composer(&self) -> &Entity<TextareaState> {\n        &self.composer\n    }\n\n    /// The composer replacement a `ComposerSet` effect requested, with its\n    /// focus flag; consumed by the next composer paint.\n    pub(crate) fn take_composer_set(&mut self) -> Option<(String, bool)> {\n        self.pending_composer_set.take()\n    }\n\n    /// The question row the ask card is showing.\n    pub(crate) fn ask_index(&self) -> usize {\n        self.driver.ask_index()\n    }\n}\n\n/// Renders the whole window; split across the `ui` submodule.\nimpl Workspace {\n    /// Persists a resized window's settled size. The driver debounces; only\n    /// the last generation wins the write.\n    fn on_window_resized(&mut self, window: &Window, _cx: &mut Context<Self>) {\n        let bounds = match window.window_bounds() {\n            // `Maximized` still reports the restorable windowed bounds, which\n            // is exactly the size to restore on the next launch.\n            WindowBounds::Windowed(bounds) | WindowBounds::Maximized(bounds) => bounds,\n            WindowBounds::Fullscreen(_) => return,\n        };\n        self.driver\n            .note_window_resized(bounds.size.width.into(), bounds.size.height.into());\n    }\n\n    pub(crate) fn render_root(\n        &mut self,\n        window: &mut Window,\n        cx: &mut Context<Self>,\n    ) -> impl gpui_kit::IntoElement {\n        self.driver.ensure_catalog();\n        crate::ui::render_root(self, window, cx)\n    }\n}\n\nimpl gpui_kit::Render for Workspace {\n    fn render(\n        &mut self,\n        window: &mut Window,\n        cx: &mut Context<Self>,\n    ) -> impl gpui_kit::IntoElement {\n        self.render_root(window, cx)\n    }\n}\n\n#[cfg(test)]\nmod tests;\n","crates/mycode-desktop/src/workspace/window.rs":"//! Window geometry: the preferred opening size, the fit to the primary\n//! display, and the client-area chrome the window asks for.\n\nuse gpui_kit::{App, Bounds, Pixels, WindowBounds, px, size};\n\n/// Preferred first-window size. The origin is computed from the primary\n/// display so the window opens in the middle of the usable area, and smaller\n/// screens shrink the request rather than clipping it.\npub(super) const WINDOW_SIZE: gpui_kit::Size<Pixels> = size(px(1440.), px(900.));\n\n/// Smallest edge the window accepts, and the floor a smaller screen may\n/// shrink the default down to. It holds the fixed sidebar, one readable chat\n/// column, and a docked Details panel; the user can drag the window smaller\n/// than the opening size, down to this.\npub(super) const WINDOW_FLOOR: gpui_kit::Size<Pixels> = size(px(960.), px(600.));\n\n/// Opening bounds plus the minimum size for the main window.\n///\n/// The default size is fitted to the primary display's usable area. A\n/// persisted windowed size wins over the default and may be smaller — the\n/// user's own resize is honored down to [`WINDOW_FLOOR`].\npub(super) fn startup_geometry(\n    cx: &App,\n    saved: Option<mycode_frontend::WindowSize>,\n) -> (Bounds<Pixels>, gpui_kit::Size<Pixels>) {\n    let saved = saved.map(|saved| size(px(saved.width as f32), px(saved.height as f32)));\n    let Some(display) = cx.primary_display() else {\n        let (window, min) = fit_window(None, saved);\n        let origin = gpui_kit::point(px(80.), px(48.));\n        return (\n            Bounds {\n                origin,\n                size: window,\n            },\n            min,\n        );\n    };\n    let screen = display.visible_bounds();\n    let (window, min) = fit_window(Some(screen.size), saved);\n    (Bounds::centered_at(screen.center(), window), min)\n}\n\n/// Window size and minimum size for a usable screen area. Pure so the sizing\n/// rules are testable without a display.\npub(super) fn fit_window(\n    screen: Option<gpui_kit::Size<Pixels>>,\n    saved: Option<gpui_kit::Size<Pixels>>,\n) -> (gpui_kit::Size<Pixels>, gpui_kit::Size<Pixels>) {\n    let fit = |desired: gpui_kit::Size<Pixels>| match screen {\n        Some(screen) => size(\n            fit_edge(screen.width, desired.width, WINDOW_FLOOR.width),\n            fit_edge(screen.height, desired.height, WINDOW_FLOOR.height),\n        ),\n        None => desired,\n    };\n    let min = fit(WINDOW_FLOOR);\n    let window = saved.map_or_else(\n        || fit(WINDOW_SIZE),\n        |saved| {\n            let fitted = fit(saved);\n            size(fitted.width.max(min.width), fitted.height.max(min.height))\n        },\n    );\n    (window, min)\n}\n\nfn fit_edge(available: Pixels, desired: Pixels, floor: Pixels) -> Pixels {\n    let room = (available - px(64.)).max(floor.min(available));\n    desired.min(room)\n}\n\n/// Position the native macOS controls inside the custom 40px title bar.\npub(super) const TRAFFIC_LIGHTS: gpui_kit::Point<Pixels> = gpui_kit::point(px(16.), px(14.));\n\n/// Window options for the app-drawn chrome.\n///\n/// The system title bar stays hidden on every desktop:\n/// - Windows: `appears_transparent` extends the client area over the caption.\n///   Min, max, and close still go through `WindowControlArea`.\n/// - macOS: `appears_transparent` and `app_owns_titlebar_drag` drop the system\n///   title bar and its drag/double-click. Native traffic lights stay visible.\npub(super) fn client_window_options(\n    bounds: Bounds<Pixels>,\n    min_size: gpui_kit::Size<Pixels>,\n) -> gpui_kit::WindowOptions {\n    let mut options = gpui_kit::component::TitleBar::window_options();\n    options.window_bounds = Some(WindowBounds::Windowed(bounds));\n    options.window_min_size = Some(min_size);\n    options.app_owns_titlebar_drag = true;\n    let titlebar = options\n        .titlebar\n        .get_or_insert_with(gpui_kit::component::TitleBar::title_bar_options);\n    titlebar.title = Some(\"MYCode\".into());\n    titlebar.appears_transparent = true;\n    titlebar.traffic_light_position = Some(TRAFFIC_LIGHTS);\n    options\n}\n\n/// Removes the 1px DWM border Windows 11 draws around borderless windows.\n///\n/// `appears_transparent` already drops the caption; without this call DWM\n/// still strokes a system-colored edge. `DWMWA_COLOR_NONE` suppresses it.\n/// Older Windows versions lack the attribute and simply return an error.\n#[cfg(windows)]\npub(super) fn strip_dwm_border(window: &gpui_kit::Window) {\n    use raw_window_handle::{HasWindowHandle, RawWindowHandle};\n    const DWMWA_BORDER_COLOR: u32 = 34;\n    const DWMWA_COLOR_NONE: u32 = 0xFF_FF_FF_FE;\n    let Ok(handle) = HasWindowHandle::window_handle(window) else {\n        return;\n    };\n    let RawWindowHandle::Win32(handle) = handle.as_raw() else {\n        return;\n    };\n    let hwnd = handle.hwnd.get() as windows_sys::Win32::Foundation::HWND;\n    unsafe {\n        windows_sys::Win32::Graphics::Dwm::DwmSetWindowAttribute(\n            hwnd,\n            DWMWA_BORDER_COLOR as _,\n            &DWMWA_COLOR_NONE as *const u32 as *const core::ffi::c_void,\n            size_of::<u32>() as u32,\n        );\n    }\n}\n\n#[cfg(not(windows))]\npub(super) fn strip_dwm_border(_: &gpui_kit::Window) {}\n","crates/mycode-desktop/src/ui/chat/composer.rs":"//! The composer bar: a floating rounded card at the bottom of the conversation column.\n//!\n//! Model, reasoning, and folder sit as pill chips inside the bar, alongside a\n//! `⌘K` / `Ctrl+K` hint; typing `@` references a project file. While a turn\n//! is running the round action is Stop: it ends the whole turn, every\n//! subagent, and any tool still running. A draft sent with Enter (or Ctrl+G)\n//! steers the running turn: it reaches the model before its next step\n//! without stopping anything, and waits in a strip above the composer until\n//! the agent reads it. The arrow beside Stop steers too, and Ctrl+Enter\n//! stops the turn and sends the draft right after. Each running scout or\n//! artisan is cancelled from its own `agent` row in the transcript.\nuse gpui_kit::assets::IconName;\nuse gpui_kit::component::Icon;\nuse gpui_kit::component::input::Textarea;\nuse gpui_kit::component::progress::ProgressCircle;\nuse gpui_kit::component::tooltip::Tooltip;\nuse gpui_kit::component::{ActiveTheme as _, Sizable as _};\nuse gpui_kit::prelude::FluentBuilder as _;\nuse gpui_kit::{\n    BoxShadow, Context, Focusable as _, InteractiveElement, IntoElement, ParentElement,\n    SharedString, StatefulInteractiveElement, Styled, Window, div, hsla, px,\n};\n\nuse crate::i18n::t;\nuse crate::ui::command_palette::shortcut_label;\nuse crate::ui::{desk::Desk, ellipsis, project_label, skin};\nuse crate::view_model::WorkspaceState;\nuse crate::view_model::{selected_model_supports_reasoning, selected_reasoning_level};\nuse crate::workspace::Workspace;\n\n/// Resting composer hint. The product name does not belong in the field.\nconst COMPOSER_PLACEHOLDER: (&str, &str) = (\"Ask the agent\", \"向代理提问\");\nconst STEER_PLACEHOLDER: (&str, &str) = (\n    \"Enter steers the running turn; Ctrl+Enter interrupts\",\n    \"回车引导 · Ctrl+Enter 打断发送\",\n);\n\n/// Placeholder for the composer. While a turn is running, typed text steers\n/// (Enter or Ctrl+G); Ctrl+Enter stops the turn and sends it right after.\n#[must_use]\npub(crate) fn composer_placeholder(sending: bool) -> &'static str {\n    let (english, chinese) = if sending {\n        STEER_PLACEHOLDER\n    } else {\n        COMPOSER_PLACEHOLDER\n    };\n    t(english, chinese)\n}\n\n/// Centered composer measure. Narrower than the chat pane; prose and tool\n/// cards stay full width and left-aligned.\npub(super) const COMPOSER_MAX_PX: f32 = 760.;\n\n/// Bottom composer: a floating rounded card with soft elevation, pill chips for\n/// folder, model, and thinking, and a circular send/stop action. The field soft-wraps inside a fixed three-row box and\n/// scrolls once the draft is longer.\npub(super) fn render_composer(\n    workspace: &mut Workspace,\n    window: &mut Window,\n    cx: &mut Context<Workspace>,\n) -> impl IntoElement {\n    let composer = workspace.composer().clone();\n    let paste_target = cx.entity();\n    if let Some((text, focus)) = workspace.take_composer_set() {\n        composer.update(cx, |state, cx| state.set_value(text, window, cx));\n        if focus {\n            composer.read(cx).focus_handle(cx).focus(window, cx);\n        }\n    }\n    let model_label: SharedString = model_button_label(workspace.vm()).into();\n    let thinking_label: SharedString = thinking_button_label(workspace.vm()).into();\n    // A long `Provider · Model` keeps its model end: the chip clips from the\n    // left, so \"…DeepSeek V4.1 Flash\" stays readable, and the picker lists\n    // the full name. No hover tooltip here: it covered the thinking chip\n    // beside it without saying more than the picker already does.\n    let show_thinking = selected_model_supports_reasoning(workspace.vm());\n    // A manual compact is not a turn, but it locks the composer the same\n    // way: Enter waits, Ctrl+Enter stops it and sends the draft.\n    let sending = workspace.vm().sending || workspace.vm().compacting;\n    let has_draft = !workspace.vm().composer_draft.trim().is_empty();\n    let has_attachments = !workspace.attachments.is_empty();\n    // A draft or a dropped attachment alone enables the arrow:\n    // `submit_from_welcome` answers a missing folder with a toast instead of\n    // leaving a dead button.\n    let can_send = has_draft || has_attachments;\n    let steer_panel = (!workspace.vm().pending_steers.is_empty())\n        .then(|| render_pending_steers(&workspace.vm().pending_steers, cx).into_any_element());\n    let compacting = workspace.vm().compacting;\n    let has_pending_ask = workspace.vm().pending_ask.is_some();\n    if workspace.composer_busy != sending {\n        workspace.composer_busy = sending;\n        let placeholder = composer_placeholder(sending);\n        composer.update(cx, |state, cx| {\n            state.set_placeholder(placeholder, window, cx);\n        });\n    }\n    let thinking_chip = show_thinking.then(|| {\n        let menu = workspace\n            .vm()\n            .reasoning_menu_open\n            .then(|| super::menus::render_thinking_menu(workspace, window, cx));\n        div()\n            .relative()\n            .child(composer_pill_chip(\n                ComposerChip {\n                    id: \"thinking\",\n                    icon: None,\n                    label: thinking_label.clone(),\n                    tooltip: None,\n                    clip_start: false,\n                    open: workspace.vm().reasoning_menu_open,\n                    max_w: px(116.),\n                },\n                |workspace, _window, cx| {\n                    let open = !workspace.vm().reasoning_menu_open;\n                    workspace.on_toggle_reasoning_menu(open, cx);\n                },\n                cx,\n            ))\n            .children(menu)\n            .into_any_element()\n    });\n    let model_chip = {\n        let menu = workspace\n            .vm()\n            .model_menu_open\n            .then(|| super::menus::render_model_menu(workspace, window, cx));\n        div()\n            .relative()\n            .child(composer_pill_chip(\n                ComposerChip {\n                    id: \"model\",\n                    icon: None,\n                    label: model_label,\n                    tooltip: None,\n                    clip_start: true,\n                    open: workspace.vm().model_menu_open,\n                    max_w: px(240.),\n                },\n                |workspace, window, cx| {\n                    let open = !workspace.vm().model_menu_open;\n                    workspace.on_toggle_model_menu(open, windo
