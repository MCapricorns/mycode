loaded.\n        expected_revision: mycode_agent::AuthorityRevision,\n        /// The complete replacement settings.\n        settings: mycode_agent::AppSettings,\n    },\n    /// Store or clear one provider API key in the secret store.\n    SaveProviderKey {\n        /// Provider identity from settings.\n        provider_id: String,\n        /// The key; empty clears the stored entry.\n        api_key: String,\n    },\n    /// Run one model turn over stored history and stream the reply. The\n    /// turn reads the branch's durable head itself, so a snapshot that is\n    /// behind cannot fail it.\n    ChatTurn {\n        /// Target session.\n        session: SessionId,\n        /// Target branch.\n        branch: BranchId,\n        /// Provider identity from settings.\n        provider_id: String,\n        /// Model id offered by that provider.\n        model: String,\n        /// Reasoning effort for this session. `None` leaves the provider\n        /// default. Global settings are not consulted, so one session's\n        /// pick cannot fail the others.\n        reasoning: Option<String>,\n    },\n    /// Summarize the open session now. The next turn sends the checkpoint.\n    CompactSession {\n        /// Target session.\n        session: SessionId,\n        /// Target branch.\n        branch: BranchId,\n        /// Head the UI observed.\n        expected_head: HeadStamp,\n        /// Provider identity from settings.\n        provider_id: String,\n        /// Model id that writes the summary.\n        model: String,\n    },\n    /// Generate the session's sidebar title from its first user message.\n    ///\n    /// Runs as a background task beside the real turn; the finished title is\n    /// stored in the index and arrives as [`BridgeEvent::SessionTitle`]. The\n    /// reply only acknowledges that the task was accepted.\n    SummarizeTitle {\n        /// Target session.\n        session: SessionId,\n        /// Provider identity from settings.\n        provider_id: String,\n        /// Model id offered by that provider.\n        model: String,\n        /// The first user message the title should describe.\n        seed: String,\n    },\n    /// Inject text into the running turn without cancelling it or its subagents.\n    ///\n    /// The core pushes into that session's steer inbox and replies at once.\n    /// A missing inbox means the turn already ended; the desktop then queues\n    /// the text so it is not lost.\n    Steer {\n        /// Session identity spelling.\n        session_id: String,\n        /// Composer text. Blank text is ignored by the inbox.\n        text: String,\n    },\n    /// Abort the in-flight turn of one session (Escape in the chat).\n    CancelChat {\n        /// Session identity spelling.\n        session_id: String,\n    },\n    /// Stop one running subagent without ending the parent turn.\n    CancelSubagent {\n        /// Session identity spelling.\n        session_id: String,\n        /// Provider call id of the `agent` tool.\n        call_id: String,\n    },\n    /// List project files matching the composer's `@` fragment.\n    SearchProjectFiles {\n        /// Session whose bound project is searched.\n        session_id: String,\n        /// Case-insensitive substring filter; empty lists the first files.\n        query: String,\n    },\n    /// List tools exposed by one enabled MCP server.\n    McpListTools {\n        /// The server row to probe. The whole row travels, not just its id,\n        /// so the settings form can test a binding before it is saved.\n        server: Box<mycode_agent::McpServerSettings>,\n    },\n    /// Load one page of committed events older than `before`.\n    ///\n    /// `before` is the oldest event the UI already shows. The head must\n    /// still match; a moved branch fails closed instead of splicing a page\n    /// from a different snapshot.\n    LoadOlder {\n        /// Session identity spelling.\n        session: SessionId,\n        /// Branch identity spelling.\n        branch: BranchId,\n        /// Head the UI observed.\n        expected_head: HeadStamp,\n        /// Oldest event already on screen.\n        before: String,\n    },\n    /// Rewind the branch to just before one user message (recall), with an\n    /// optional edited text to prefill. Workspace files are not restored\n    /// or deleted.\n    RecallMessage {\n        /// Session identity spelling.\n        session: SessionId,\n        /// Branch identity spelling.\n        branch: BranchId,\n        /// Head the UI observed; a stale head fails the rewind with the same\n        /// moved-on error a stale `SendMessage` gets.\n        expected_head: HeadStamp,\n        /// Event to rewind to (the entry before the recalled message).\n        to_event: String,\n        /// Edited text to prefill for re-sending.\n        edit: Option<String>,\n    },\n    /// Deletes one session's durable data (ledger, and any leftover file\n    /// snapshots from older versions).\n    DeleteSession {\n        /// Session identity spelling.\n        session_id: String,\n    },\n    /// Removes one directory from the remembered projects list.\n    RemoveRecent {\n        /// The project directory to forget.\n        project: String,\n    },\n    /// Write one product-data export bundle to a user-chosen file.\n    ExportData {\n        /// Destination file chosen in a save dialog.\n        path: PathBuf,\n    },\n    /// Apply one product-data export bundle from a user-chosen file.\n    ImportData {\n        /// Bundle file chosen in an open dialog.\n        path: PathBuf,\n        /// The user confirmed a bundle that changes MCP server commands.\n        /// Without it such an import fails with [`IMPORT_NEEDS_MCP_CONFIRM`].\n        confirm_mcp_commands: bool,\n    },\n    /// List discovered prompt resources for the session workspace.\n    ListResources {\n        /// Session identity spelling (selects the workspace directory).\n        session_id: String,\n    },\n    /// Deliver the user's answers to the pending ask of one session.\n    AskAnswer {\n        /// Session identity spelling.\n        session_id: String,\n        /// One answer per asked question, in order; empty string skips.\n        answers: Vec<String>,\n    },\n    /// Dismiss a pending ask without answering. The model sees a failed\n    /// tool call. This does not cancel the turn.\n    AskDismiss {\n        /// Session identity spelling.\n        session_id: String,\n    },\n    /// Resolve the gateway's current model list from memory.\n    GetCatalog,\n    /// Re-read the gateway's model list (`GET /v1/models`).\n    RefreshCatalog,\n    /// Load the durable UI state document.\n    LoadUiState,\n    /// Persist the durable UI state document.\n    SaveUiState {\n        /// The replacement state.\n        state: UiState,\n    },\n    /// Bind one project directory to a session for tool runs.\n    SetProjectDir {\n        /// Session identity spelling.\n        session_id: String,\n        /// Existing directory; `None` reverts to the shared scratch directory.\n        path: Option<String>,\n    },\n    /// The frontend is ready for deferred startup work. The catalog refresh\n    /// and the update check start here, so the network and TLS stack never\n    /// races the first UI paint.\n    UiReady,\n    /// Query GitHub for a newer release of the running binary family.\n    CheckUpdate,\n    /// Download and verify one update offer into a staging directory.\n    DownloadUpdate {\n        /// The offer to download.\n        offer: UpdateOffer,\n    },\n    /// Fetch the fixed probe URL on the route `proxy` picks, so the user\n    /// can see whether the proxy is in effect. `proxy` is the settings\n    /// value on screen, so an edit not yet saved is what gets tested.\n    TestProxy {\n        /// Stored-form proxy value (empty follows the system).\n        proxy: String,\n    },\n}\n\n/// Why the next prompt may miss the provider cache.\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum CacheDisruption {\n    /// A compaction summary replaced the head of the prompt.\n    Compaction,\n    /// A steer was appended inside the running turn.\n    Steer,\n}\n\n/// A streaming event from an active model turn.\n#[derive(Debug, Clone)]\npub enum BridgeEvent {\n    /// Incremental assistant text.\n    ChatText {\n        /// Session identity spelling.\n        session_id: String,\n        /// Text fragment.\n        delta: String,\n    },\n    /// Incremental assistant reasoning.\n    ChatThinking {\n        /// Session identity spelling.\n        session_id: String,\n        /// Reasoning fragment.\n        delta: String,\n    },\n    /// One intermediate assistant step was committed mid-turn.\n    ///\n    /// A turn that calls tools produces several assistant messages: each one\n    /// requests tools, reads their results, and continues. Every step is\n    /// committed as it arrives so the transcript and the ledger keep the\n    /// model's actual order; only the closing step arrives as\n    /// [`BridgeEvent::ChatDone`].\n    AssistantStep {\n        /// Session identity spelling.\n        session_id: String,\n        /// Committed assistant entry projection.\n        entry: ConversationEntry,\n    },\n    /// The turn finished and its closing assistant message was committed.\n    ChatDone {\n        /// Session identity spelling.\n        session_id: String,\n        /// New branch head spelling.\n        head: String,\n        /// Committed assistant entry projection.\n        entry: ConversationEntry,\n    },\n    /// In-progress token counts for the open turn. Not a ledger write.\n    UsageSnapshot {\n        /// Session identity spelling.\n        session_id: String,\n        /// Model id the turn is running on.\n        model: String,\n        /// Fresh (non-cache-read) input tokens summed so far this turn.\n        /// Derived from `prompt_tokens` minus the cache read, so an\n        /// OpenAI-style count that includes the cached context does not\n        /// bill every re-sent round as new input.\n        input: u64,\n        /// Latest prompt size, not the sum of tool rounds.\n        context: u64,\n        /// Cache-read tokens on that latest prompt.\n        context_cache: u64,\n        /// Output tokens summed so far this turn.\n        output: u64,\n        /// Prompt tokens served from the provider cache, when reported.\n        cache: Option<u64>,\n        /// Model requests (response cycles) the sums cover. A turn that\n        /// calls tools sends one request per round, so the sums cover\n        /// every round while `context` stays one prompt.\n        requests: u32,\n        /// Elapsed milliseconds since the turn started.\n        elapsed_ms: u64,\n    },\n    /// The agent asked the user structured questions.\n    AskRequested {\n        /// Session identity spelling.\n        session_id: String,\n        /// Questions the user should answer, including multi-select.\n        questions: Vec<crate::protocol::AskPrompt>,\n    },\n    /// The model is still writing an `agent` call. Sent when the call opens\n    /// and again whenever its role or description becomes readable, so each\n    /// subagent shows up as soon as the model starts its brief. The matching\n    /// [`BridgeEvent::ToolStarted`] (same `provider_call_id`) replaces it.\n    ToolPreparing {\n        /// Session identity spelling.\n        session_id: String,\n        /// Provider-assigned call id; the later `ToolStarted` carries it too.\n        provider_call_id: String,\n        /// Tool name.\n        name: String,\n        /// Role and description so far, as `ToolStarted` would label them.\n        target: String,\n    },\n    /// A tool call started executing.\n    ToolStarted {\n        /// Session identity spelling.\n        session_id: String,\n        /// Ledger call identity. Transcript rows and results pair on it, and\n        /// it is the same id a mid-turn reopen replays — so a live row, its\n        /// replayed copy, and its result always match.\n        call_id: String,\n        /// Provider-assigned call id. `CancelSubagent` resolves against it.\n        provider_call_id: String,\n        /// Tool name.\n        name: String,\n        /// Path, query, or command. Empty when the call has no target.\n        target: String,\n    },\n    /// Incremental tool progress (including subagent steps).\n    ToolProgress {\n        /// Session identity spelling.\n        session_id: String,\n        /// Ledger call identity while the call is open.\n        call_id: String,\n        /// Provider-assigned call id. A job first seen through progress (a\n        /// reopen after switching sessions) needs it for `CancelSubagent`.\n        provider_call_id: String,\n        /// Tool name when known; empty for a nested progress line.\n        name: String,\n        /// One-line progress.\n        message: String,\n    },\n    /// A tool call finished; its result is committed to the ledger.\n    ToolCompleted {\n        /// Session identity spelling.\n        session_id: String,\n        /// Committed tool-result entry projection.\n        entry: ConversationEntry,\n    },\n    /// The turn failed. Earlier steps in the same turn may already be committed.\n    ChatFailed {\n        /// Session identity spelling.\n        session_id: String,\n        /// Rendered failure for the banner. [`protocol::CHAT_CANCELLED`] is a\n        /// quiet cancel: the desktop clears the turn and may send the queue.\n        message: String,\n        /// Ledger head after this turn's writes. Empty means the UI must\n        /// leave `conversation.head` unchanged.\n        head: String,\n    },\n    /// Steers that reached the turn after its last model request. They were\n    /// never sent; the UI queues them as follow-ups.\n    SteersReturned {\n        /// Session identity spelling.\n        session_id: String,\n        /// Steer texts in arrival order.\n        texts: Vec<String>,\n    },\n    /// A steer was written into the ledger while the turn kept running.\n    SteerCommitted {\n        /// Session identity spelling.\n        session_id: String,\n        /// Branch head after the steer message.\n        head: String,\n        /// Transcript row for the steered user message.\n        entry: ConversationEntry,\n    },\n    /// A generated session title was stored in the index. Frontend session\n    /// rows patch their `title` field in place.\n    SessionTitle {\n        /// Session identity spelling.\n        session_id: String,\n        /// The stored title.\n        title: String,\n    },\n    /// The gateway's model list changed after a refresh.\n    CatalogUpdated {\n        /// Provider count in the refreshed catalog.\n        providers: usize,\n        /// Unix seconds of the successful fetch.\n        fetched_at: u64,\n    },\n    /// A newer release of the running binary family is available.\n    UpdateAvailable {\n        /// The resolved release offer.\n        offer: UpdateOffer,\n    },\n    /// The automatic update check failed. The UI toasts `message`.\n    UpdateCheckFailed {\n        /// Short failure text. Not drawn as a full-width error in About.\n        message: String,\n    },\n    /// The next provider request follows a rewrite of the cached prefix.\n    ///\n    /// Sent before that request's [`BridgeEvent::UsageSnapshot`], including\n    /// when a mid-turn compaction defers its transcript card until the turn\n    /// commits. The desktop compares the next prompt's cache hit with the\n    /// one already on the meter.\n    PromptCacheWatch {\n        /// Session identity spelling.\n        session_id: String,\n        /// What rewrote the prefix.\n        cause: CacheDisruption,\n    },\n    /// The running turn started (`active`) or finished summarizing its\n    /// history for an automatic compaction. A summary can take minutes, and\n    /// without this the turn looked stuck on the model. Manual `/compact`\n    /// reports through its own command reply instead.\n    ContextCompacting {\n        /// Session identity spelling.\n        session_id: String,\n        active: bool,\n    },\n    /// A compaction summary was written and should appear in the transcript.\n    /// Manual `/compact` and automatic compaction both emit this. The text\n    /// is the display copy; the model request still uses the checkpoint.\n    SummaryShown {\n        /// Session identity spelling.\n        session_id: String,\n        /// Transcript row for the summary.\n        entry: ConversationEntry,\n    },\n    /// `/compact` finished. `ok` is false when the session could not be opened,\n    /// a claimed summary was not written, or the provider could not run.\n    /// `empty` and `covered` stay `ok`.\n    CompactFinished {\n        /// Session identity spelling.\n        session_id: String,\n        /// `compacted`, `covered`, `empty`, or a rendered failure.\n        message: String,\n        /// Whether the command completed without a provider error.\n        ok: bool,\n        /// The durable head after the attempt: a written summary card\n        /// advanced it, every other outcome leaves it at the expected\n        /// head. The UI adopts it so the next `/compact` does not trip\n        /// the moved-head check on its own summary row.\n        head: String,\n    },\n}\n\n/// Settings the UI can edit, plus documents reset while they were loaded.\n#[derive(Debug)]\npub struct SettingsSnapshot {\n    /// The settings document.\n    pub settings: mycode_agent::AppSettings,\n    /// Revision to send back with the next save.\n    pub revision: mycode_agent::AuthorityRevision,\n    /// Provider ids that already have a stored key.\n    pub provider_keys: Vec<String>,\n    /// MCP server ids that already have a stored key.\n    pub mcp_keys: Vec<String>,\n    /// Product documents backed up and replaced with defaults on this load.\n    pub repairs: Vec<mycode_agent::DocumentRepair>,\n}\n\n/// A reply from the core thread, already projected for the view-model.\n#[derive(Debug)]\npub enum BridgeReply {\n    /// Session list result.\n    Sessions(Result<Vec<SessionSummary>, String>),\n    /// Create result (session ids).\n    Created(Result<SessionSummary, String>),\n    /// Open result (conversation projection).\n    Conversation(Result<ActiveConversation, String>),\n    /// One older page of the open branch.\n    Older(Result<OlderTranscript, String>),\n    /// Send result (new head plus committed entry). The session id rides\n    /// the reply even on failure, so the workspace can drop a send that\n    /// raced a session switch instead of applying it to the conversation\n    /// then open.\n    Sent {\n        /// Session the message targeted.\n        session: String,\n        /// The message text. The composer was cleared when the send went\n        /// out, so a failed send hands the text back instead of losing it.\n        text: String,\n        /// New head plus committed entry, or why the send failed.\n        outcome: Result<(String, ConversationEntry), String>,\n    },\n    /// Settings load result.\n    Settings(Result<SettingsSnapshot, String>),\n    /// Settings save result: the new revision.\n    SettingsSaved(Result<mycode_agent::AuthorityRevision, String>),\n    /// Provider key save result: refreshed key-id lists (providers, MCP).\n    ProviderKeySaved(Result<(Vec<String>, Vec<String>), String>),\n    /// Chat turn acceptance; streaming continues over the event channel.\n    ChatStarted(Result<(), String>),\n    /// Chat cancel acceptance. The turn ends with [`BridgeEvent::ChatFailed`]\n    /// whose message is [`protocol::CHAT_CANCELLED`] and whose head is the\n    /// ledger head after the partial was written.\n    ChatCancelled(Result<(), String>),\n    /// Steer acceptance. `Err` means no live inbox (the turn already ended).\n    Steered(Result<(), String>),\n    /// One subagent cancel was delivered. The parent turn keeps running.\n    SubagentCancelled(Result<(), String>),\n    /// File matches for the composer's `@` mention.\n    ProjectFiles(Result<Vec<String>, String>),\n    /// MCP tools listing for one server. The server id rides the reply even\n    /// on failure, so the settings page can attribute the error to its row.\n    McpTools {\n        /// Server identity the probe ran against.\n        server_id: String,\n        /// Listed tool names, or why the probe failed.\n        outcome: Result<Vec<String>, String>,\n    },\n    /// Recall result: truncated conversation plus edited text. Workspace\n    /// files are unchanged.\n    Recalled(Result<(Box<ActiveConversation>, Option<String>), String>),\n    /// Delete outcome.\n    SessionDeleted(Result<(), String>),\n    /// Export outcome.\n    Exported(Result<crate::export::ExportSummary, String>),\n    /// Import outcome.\n    Imported(Result<crate::export::ImportSummary, String>),\n    /// Resource list: (name, absolute path) pairs.\n    Resources(Result<Vec<(String, String)>, String>),\n    /// The user's answers were delivered to the waiting tool.\n    AskAnswered(Result<(), String>),\n    /// Provider catalog document with its freshness metadata.\n    Catalog(Result<CatalogInfo, String>),\n    /// Durable UI state load result, plus documents reset earlier in startup.\n    UiState(Result<(UiState, Vec<mycode_agent::DocumentRepair>), String>),\n    /// UI state persist result.\n    UiStateSaved(Result<(), String>),\n    /// Project directory bind result.\n    ProjectSet(Result<(), String>),\n    /// First-frame acknowledgement; deferred startup work has been queued.\n    UiReady(Result<(), String>),\n    /// Update check result; `Ok(None)` means the app is current.\n    UpdateChecked(Result<Option<UpdateOffer>, String>),\n    /// Download-and-verify result.\n    UpdateDownloaded(Result<PreparedUpdate, String>),\n    /// Proxy test result. `Err` means the value on screen is not a proxy\n    /// setting at all; a failed request still yields a report.\n    ProxyTested(Result<ProxyTestReport, String>),\n    /// Title-summarization acceptance; the result rides the event channel as\n    /// [`BridgeEvent::SessionTitle`].\n    TitleSummarized(Result<(), String>),\n}\n\n/// The resolved provider catalog shared with the UI.\n#[derive(Clone, Debug)]\npub struct CatalogInfo {\n    /// The catalog document.\n    pub document: Arc<CatalogDocument>,\n    /// Unix seconds of the successful gateway read; 0 before the first.\n    pub fetched_at: u64,\n}\n\n/// Unbounded sender for [`BridgeEvent`]s.\n///\n/// `send` returns immediately and wakes the task parked on the paired\n/// [`BridgeEventRx`]. A closed receiver is ignored; the core keeps running\n/// after the UI is gone.\npub(crate) type BridgeEventTx = tokio::sync::mpsc::UnboundedSender<BridgeEvent>;\n\n/// Receiving end of the bridge event stream.\n///\n/// Waiting on the receiver parks until the core sends or every sender is\n/// dropped. Events already queued can be drained in the same wake, so one\n/// wake applies a whole burst.\npub type BridgeEventRx = tokio::sync::mpsc::UnboundedReceiver<BridgeEvent>;\n\n/// Handle to the core thread.\npub struct CoreBridge {\n    command_tx: Option<tokio::sync::mpsc::UnboundedSender<WithReply>>,\n    worker: Option<JoinHandle<()>>,\n}\n\nimpl CoreBridge {\n    /// Starts the core thread over one owned home.\n    ///\n    /// Returns the bridge handle together with the receiving end of the\n    /// streaming event channel. Sending wakes the receiver and never waits\n    /// on it.\n    #[must_use]\n    pub fn start(home: HomeLayout) -> (Self, BridgeEventRx) {\n        let (command_tx, command_rx) = tokio::sync::mpsc::unbounded_channel();\n        let (event_tx, event_rx) = tokio::sync::mpsc::unbounded_channel();\n        let worker = std::thread::Builder::new()\n            .name(\"mycode-core\".into())\n            .spawn(move || dispatch::run_core(home, command_rx, event_tx))\n            .expect(\"core bridge thread\");\n        (\n            Self {\n                command_tx: Some(command_tx),\n                worker: Some(worker),\n            },\n            event_rx,\n        )\n    }\n\n    /// Enqueues one command immediately and returns its reply future.\n    ///\n    /// Dropping the returned future cancels only the wait, not the accepted\n    /// durable core effect. The future holds no command sender, so keeping an\n    /// unpolled reply cannot keep [`CoreBridge::shutdown`] waiting.\n    /// A stopped bridge returns the error variant for the original command.\n    pub fn request(\n        &self,\n        command: BridgeCommand,\n    ) -> impl Future<Output = BridgeReply> + Send + 'static {\n        let (reply_tx, reply_rx) = oneshot::channel();\n        let failure = dispatch::error_reply(\n            &command,\n            if self.command_tx.is_some() {\n                \"core thread stopped\"\n            } else {\n                \"core bridge stopped\"\n            },\n        );\n        let queued = self\n            .command_tx\n            .as_ref()\n            .is_some_and(|sender| sender.send(command.with_reply(reply_tx)).is_ok());\n        async move {\n            if !queued {\n                return failure;\n            }\n            reply_rx.await.unwrap_or(failure)\n        }\n    }\n\n    /// Stops the core thread and waits for it to finish.\n    pub fn shutdown(&mut self) {\n        // Dropping the sender closes the command loop; SessionService\n        // shutdown runs inside the thread before it exits.\n        self.command_tx.take();\n        if let Some(worker) = self.worker.take() {\n            let _ = worker.join();\n        }\n    }\n}\n\nimpl BridgeCommand {\n    fn with_reply(self, reply: oneshot::Sender<BridgeReply>) -> WithReply {\n        WithReply {\n            command: self,\n            reply,\n        }\n    }\n}\n\nstruct WithReply {\n    command: BridgeCommand,\n    reply: oneshot::Sender<BridgeReply>,\n}\n","crates/mycode-app/src/dispatch.rs":"//! The bridge command loop: receives [`crate::BridgeCommand`]s on the core\n//! runtime, dispatches each to its owning module, and replies.\n\nuse std::sync::Arc;\n\nuse mycode_agent::{HomeLayout, read_ui_state, replace_ui_state, update_ui_state};\n\nuse crate::ledger::{\n    delete_session, forget_session_bindings, inspect_summaries, load_older, open_conversation,\n    recall_message, render_error, send_message_with,\n};\nuse crate::mcp_tools::mcp_list_tools;\nuse crate::search::search_project_files;\nuse crate::settings_io::{load_settings, render_config_error, save_provider_key, save_settings};\nuse crate::state::{\n    CoreState, UPDATE_USER_AGENT, catalog_info, refresh_catalog, set_project_dir,\n    spawn_catalog_refresh, spawn_update_check,\n};\nuse crate::tool_hosts::{deliver_ask_answer, dismiss_ask};\nuse crate::turn::{chat_turn, manual_compact};\nuse crate::{BridgeCommand, BridgeReply, WithReply, protocol::SessionSummary};\n\npub(crate) fn run_core(\n    home: HomeLayout,\n    mut commands: tokio::sync::mpsc::UnboundedReceiver<WithReply>,\n    events: crate::BridgeEventTx,\n) {\n    let runtime = match tokio::runtime::Builder::new_current_thread()\n        .enable_all()\n        // Cap the blocking pool: the default ceiling of 512 threads would\n        // let a pathological burst (runaway file IO, stalled TLS calls) grow\n        // process memory by hundreds of stacks. Real concurrency here is a\n        // handful of config and catalog tasks.\n        .max_blocking_threads(32)\n        .build()\n    {\n        Ok(runtime) => runtime,\n        Err(_) => {\n            // Fail every pending request and stop; the UI surfaces the loss.\n            while let Some(with_reply) = commands.blocking_recv() {\n                let _ = with_reply\n                    .reply\n                    .send(error_reply(&with_reply.command, \"core runtime unavailable\"));\n            }\n            return;\n        }\n    };\n    runtime.block_on(async move {\n        // The state lives behind one Arc: `SessionService` clones share the\n        // actor and fence, and only the last drop retires the publication,\n        // so per-turn tasks may hold clones freely.\n        // Subagent worktree leases from a crashed process are recovered\n        // before any new turn can run; the git subprocess calls are blocking,\n        // so they run off the core thread.\n        let recovery_home = home.clone();\n        let _ = tokio::task::spawn_blocking(move || {\n            crate::subagent::recover_agent_worktrees(&recovery_home)\n        })\n        .await;\n        // `SessionService::new` spawns the actor on this runtime. Calling it\n        // from `spawn_blocking` has no reactor and cannot start the worker.\n        let state = CoreState::new(home.clone(), Vec::new());\n        let state = Arc::new(state);\n        // The catalog refresh and update check stay queued until the desktop\n        // reports its first frame (`UiReady`): reqwest + Schannel pull in\n        // several megabytes and the refresh does not belong on the critical\n        // startup path.\n        let mut ui_ready = false;\n        let mut requests = tokio::task::JoinSet::<()>::new();\n        loop {\n            let with_reply = tokio::select! {\n                command = commands.recv() => match command {\n                    Some(command) => command,\n                    None => break,\n                },\n                Some(outcome) = requests.join_next(), if !requests.is_empty() => {\n                    if let Err(error) = outcome {\n                        eprintln!(\"core command task failed: {error}\");\n                    }\n                    continue;\n                }\n            };\n            match with_reply.command {\n                BridgeCommand::ChatTurn {\n                    session,\n                    branch,\n                    provider_id,\n                    model,\n                    reasoning,\n                } => {\n                    // One live turn per session: a second turn would replace\n                    // the cancel token without stopping the first, and both\n                    // pumps would append to the same branch. Only the turn token\n                    // is cancelled: subagents are children of that token and\n                    // stop with it. Sweeping the subagent map here also\n                    // stopped children the user meant to steer.\n                    cancel_turn(&state, session.as_str());\n                    let task = chat_turn(\n                        state.clone(),\n                        events.clone(),\n                        session,\n                        branch,\n                        provider_id,\n                        model,\n                        reasoning,\n                    );\n                    tokio::spawn(task);\n                    let _ = with_reply.reply.send(BridgeReply::ChatStarted(Ok(())));\n                }\n                BridgeCommand::CompactSession {\n                    session,\n                    branch,\n                    expected_head,\n                    provider_id,\n                    model,\n                } => {\n                    cancel_turn(&state, session.as_str());\n                    let task = manual_compact(\n                        state.clone(),\n                        events.clone(),\n                        session,\n                        branch,\n                        expected_head,\n                        provider_id,\n                        model,\n                    );\n                    tokio::spawn(task);\n                    let _ = with_reply.reply.send(BridgeReply::ChatStarted(Ok(())));\n                }\n                BridgeCommand::CancelSubagent {\n                    session_id,\n                    call_id,\n                } => {\n                    // A short synchronous map edit, like `Steer`; no task needed.\n                    let key = format!(\"{session_id}:{call_id}\");\n                    let token = state.subagent_cancels.lock().remove(&key);\n                    let outcome = match token {\n                        Some(token) => {\n                            token.cancel();\n                            Ok(())\n                        }\n                        None => Err(\"that subagent is not running\".to_owned()),\n                    };\n                    let _ = with_reply\n                        .reply\n                        .send(BridgeReply::SubagentCancelled(outcome));\n                }\n                BridgeCommand::SummarizeTitle {\n                    session,\n                    provider_id,\n                    model,\n                    seed,\n                } => {\n                    // Title work is a background nicety beside the real turn:\n                    // no turn cancel, no ledger writes, no queue position.\n                    let task = crate::title::summarize_title(\n                        state.clone(),\n                        events.clone(),\n                        session,\n                        provider_id,\n                        model,\n                        seed,\n                    );\n                    tokio::spawn(task);\n                    let _ = with_reply.reply.send(BridgeReply::TitleSummarized(Ok(())));\n                }\n                BridgeCommand::Steer { session_id, text } => {\n                    let inboxes = state.steer_inboxes.lock();\n                    let outcome = match inboxes.get(&session_id) {\n                        Some(inbox) => {\n                            inbox.push(text);\n                            Ok(())\n                        }\n                        None => Err(\"no turn is running for this session\".to_owned()),\n                    };\n                    drop(inboxes);\n                    let _ = with_reply.reply.send(BridgeReply::Steered(outcome));\n                }\n                BridgeCommand::CancelChat { session_id } => {\n                    let token = state.turn_cancels.lock().get(&session_id).cloned();\n                    let outcome = match token {\n                        Some(token) => {\n                            token.cancel();\n                            Ok(())\n                        }\n                        None => Err(\"no turn is running for this session\".to_owned()),\n                    };\n                    let _ = with_reply.reply.send(BridgeReply::ChatCancelled(outcome));\n                }\n                BridgeCommand::RefreshCatalog => {\n                    let task_state = state.clone();\n                    let task_events = events.clone();\n                    let reply = with_reply.reply;\n                    tokio::spawn(async move {\n                        let outcome = refresh_catalog(&task_state, &task_events, true).await;\n                        let _ = reply.send(outcome);\n                    });\n                }\n                BridgeCommand::UiReady => {\n                    if !ui_ready {\n                        ui_ready = true;\n                        spawn_catalog_refresh(state.clone(), events.clone());\n                        spawn_update_check(state.clone(), events.clone());\n                    }\n                    let _ = with_reply.reply.send(BridgeReply::UiReady(Ok(())));\n                }\n                BridgeCommand::CheckUpdate => {\n                    let reply = with_reply.reply;\n                    tokio::spawn(async move {\n                        let _ = reply.send(BridgeReply::UpdateChecked(\n                            crate::updates::latest_release(UPDATE_USER_AGENT).await,\n                        ));\n                    });\n                }\n                BridgeCommand::TestProxy { proxy } => {\n                    let reply = with_reply.reply;\n                    tokio::spawn(async move {\n                        let outcome = match mycode_agent::ProxyPreference::parse(&proxy) {\n                            Some(preference) => Ok(mycode_agent::test_proxy(&preference).await),\n                            None => {\n                                Err(\"not a proxy URL: http, https, socks5, or socks5h\".to_owned())\n                            }\n                        };\n                        let _ = reply.send(BridgeReply::ProxyTested(outcome));\n                    });\n                }\n                BridgeCommand::DownloadUpdate { offer } => {\n                    let reply = with_reply.reply;\n                    let task_state = state.clone();\n                    let task_events = events.clone();\n                    tokio::spawn(async move {\n                        let outcome =\n                            crate::updates::download_update(UPDATE_USER_AGENT, &offer).await;\n                        let outcome = match outcome {\n                            Err(error) => Err(error),\n                            // Dev-tree runs never persist a pending payload:\n                            // a binary under `target/` must not self-swap.\n                            Ok(prepared) if crate::install::install_skipped() => Ok(prepared),\n                            Ok(prepared) => {\n                                let home = task_state.home.clone();\n                                let staged = prepared.clone();\n                                let persisted = tokio::task::spawn_blocking(move || {\n                                    crate::updates::persist_pending_update(&home, &staged)\n                                })\n                                .await;\n                                match persisted {\n                                    Ok(Ok(persisted)) => Ok(persisted),\n                                    // A failed durable copy still yields the\n                                    // verified temp stage; a crash then loses\n                                    // the swap, matching a non-persisted stage.\n                                    Ok(Err(_)) | Err(_) => Ok(prepared),\n                                }\n                            }\n                        };\n                        let staged = outcome.is_ok();\n                        let _ = reply.send(BridgeReply::UpdateDownloaded(outcome));\n                        if staged {\n                            // A staged update may change how the gateway is\n                            // reached; read its model list again once.\n                            let _ = refresh_catalog(&task_state, &task_events, true).await;\n                        }\n                    });\n                }\n                command => {\n                    // Handlers perform storage and config I/O; running them\n                    // inline would serialize the command loop behind every\n                    // await and every synchronous file operation.\n                    let task_state = state.clone();\n                    let reply = with_reply.reply;\n                    requests.spawn(async move {\n                        let outcome = handle(&task_state, command).await;\n                        let _ = reply.send(outcome);\n                    });\n                }\n            }\n        }\n        // Accepted storage/config requests must finish before the shared\n        // service retires. Runtime drop would otherwise abort queued writes\n        // merely because the frontend stopped waiting for their replies.\n        while let Some(outcome) = requests.join_next().await {\n            if let Err(error) = outcome {\n                eprintln!(\"core command task failed: {error}\");\n            }\n        }\n        state.service.clone().shutdown().await;\n    });\n}\n\nfn push_unique_repair(\n    repairs: &mut Vec<mycode_agent::DocumentRepair>,\n    repair: mycode_agent::DocumentRepair,\n) {\n    if repairs.iter().any(|existing| existing.path == repair.path) {\n        return;\n    }\n    repairs.push(repair);\n}\n\npub(crate) fn error_reply(command: &BridgeCommand, message: &str) -> BridgeReply {\n    let message = message.to_owned();\n    match command {\n        BridgeCommand::ListSessions => BridgeReply::Sessions(Err(message)),\n        BridgeCommand::CreateSession { .. } => BridgeReply::Created(Err(message)),\n        BridgeCommand::OpenSession(_) => BridgeReply::Conversation(Err(message)),\n        BridgeCommand::LoadOlder { .. } => BridgeReply::Older(Err(message)),\n        BridgeCommand::SendMessage { session, text, .. } => BridgeReply::Sent {\n            session: session.to_string(),\n            text: text.clone(),\n            outcome: Err(message),\n        },\n        BridgeCommand::LoadSettings => BridgeReply::Settings(Err(message)),\n        BridgeCommand::SaveSettings { .. } => BridgeReply::SettingsSaved(Err(message)),\n        BridgeCommand::SaveProviderKey { .. } => BridgeReply::ProviderKeySaved(Err(message)),\n        BridgeCommand::ChatTurn { .. } | BridgeCommand::CompactSession { .. } => {\n            BridgeReply::ChatStarted(Err(message))\n        }\n        BridgeCommand::SearchProjectFiles { .. } => BridgeReply::ProjectFiles(Err(message)),\n        BridgeCommand::McpListTools { server } => BridgeReply::McpTools {\n            server_id: server.id.clone(),\n            outcome: Err(message),\n        },\n        BridgeCommand::RecallMessage { .. } => BridgeReply::Recalled(Err(message)),\n        BridgeCommand::DeleteSession { .. } => BridgeReply::SessionDeleted(Err(message)),\n        BridgeCommand::RemoveRecent { .. } => BridgeReply::UiStateSaved(Err(message)),\n        BridgeCommand::ExportData { .. } => BridgeReply::Exported(Err(message)),\n        BridgeCommand::ImportData { .. } => BridgeReply::Imported(Err(message)),\n        BridgeCommand::ListResources { .. } => BridgeReply::Resources(Err(message)),\n        BridgeCommand::AskAnswer { .. } | BridgeCommand::AskDismiss { .. } => {\n            BridgeReply::AskAnswered(Err(message))\n        }\n        BridgeCommand::GetCatalog | BridgeCommand::RefreshCatalog => {\n            BridgeReply::Catalog(Err(message))\n        }\n        BridgeCommand::LoadUiState => BridgeReply::UiState(Err(message)),\n        BridgeCommand::SaveUiState { .. } => BridgeReply::UiStateSaved(Err(message)),\n        BridgeCommand::SetProjectDir { .. } => BridgeReply::ProjectSet(Err(message)),\n        BridgeCommand::UiReady => BridgeReply::UiReady(Err(message)),\n        BridgeCommand::CheckUpdate => BridgeReply::UpdateChecked(Err(message)),\n        BridgeCommand::DownloadUpdate { .. } => BridgeReply::UpdateDownloaded(Err(message)),\n        BridgeCommand::TestProxy { .. } => BridgeReply::ProxyTested(Err(message)),\n        BridgeCommand::CancelChat { .. } => BridgeReply::ChatCancelled(Err(message)),\n        BridgeCommand::CancelSubagent { .. } => BridgeReply::SubagentCancelled(Err(message)),\n        BridgeCommand::Steer { .. } => BridgeReply::Steered(Err(message)),\n        BridgeCommand::SummarizeTitle { .. } => BridgeReply::TitleSummarized(Err(message)),\n    }\n}\n\n/// Runs one synchronous storage/config step off the core runtime thread.\n/// File locks, staged writes, and directory walks must never run inline:\n/// the bridge runtime is single-threaded, so any blocking syscall freezes\n/// every queued command and in-flight turn.\nasync fn blocking<T: Send + 'static>(\n    step: impl FnOnce() -> Result<T, String> + Send + 'static,\n) -> Result<T, String> {\n    tokio::task::spawn_blocking(step)\n        .await\n        .map_err(|error| format!(\"background task failed: {error}\"))?\n}\n\n/// Cancels and removes one session's live turn token.\n///\n/// Subagent tokens that are children of this token stop with it. The\n/// subagent map is left alone so a follow-up turn does not cancel work\n/// the user is steering.\nfn cancel_turn(state: &CoreState, session_id: &str) {\n    let mut turns = state.turn_cancels.lock();\n    if let Some(token) = turns.remove(session_id) {\n        token.cancel();\n    }\n}\n\n/// Cancels one session's live turn and every subagent it started.\n///\n/// Subagent registry keys are `{session_id}:{call_id}`, so the prefix match\n/// stops exactly that session's background work without touching others.\n/// Session deletion uses this. A new chat turn uses [`cancel_turn`] only.\nfn cancel_session_work(state: &CoreState, session_id: &str) {\n    cancel_turn(state, session_id);\n    let mut subagents = state.subagent_cancels.lock();\n    let prefix = format!(\"{session_id}:\");\n    subagents.retain(|key, token| {\n        if key.starts_with(&prefix) {\n            token.cancel();\n            false\n        } else {\n            true\n        }\n    });\n}\n\nasync fn handle(state: &CoreState, command: BridgeCommand) -> BridgeReply {\n    match command {\n        BridgeCommand::ListSessions => BridgeReply::Sessions(\n            inspect_summaries(state.home.clone())\n                .await\n                .map_err(render_error),\n        ),\n        BridgeCommand::CreateSession { project } => {\n            match state.service.create(project.as_deref()).await {\n                Ok(created) => BridgeReply::Created(Ok(SessionSummary {\n                    session_id: created.session_id.as_str().to_owned(),\n                    root_branch_id: created.branch_id.as_str().to_owned(),\n                    title: String::new(),\n                    updated_at_ms: u64::try_from(crate::unix_now().as_millis())\n                        .ok()\n                        .filter(|&ms| ms > 0),\n                    event_count: 0,\n                    active: true,\n                    corrupt: false,\n                })),\n                Err(error) => BridgeReply::Created(Err(render_error(error))),\n            }\n        }\n        BridgeCommand::OpenSession(session) => BridgeReply::Conversation(\n            open_conversation(&state.service, &session)\n                .await\n                .map(|mut conversation| {\n                    // A reopen can land while the session's turn or\n                    // `/compact` is still in flight; the registry only holds\n                    // live work, and drops it before the work reports its end.\n                    let live = state.live_work(session.as_str());\n                    conversation.running = live == Some(crate::state::WorkKind::Turn);\n                    conversation.compacting = live == Some(crate::state::WorkKind::Compaction);\n                    conversation\n                })\n                .map_err(render_error),\n        ),\n        BridgeCommand::LoadOlder {\n            session,\n            branch,\n            expected_head,\n            before,\n        } => BridgeReply::Older(\n            load_older(&state.service, &session, &branch, &expected_head, &before).await,\n        ),\n        BridgeCommand::SendMessage {\n            session,\n            branch,\n            expected_head,\n            text,\n            attachments,\n        } => {\n            let outcome = send_message_with(\n                &state.service,\n                &session,\n                &branch,\n                &expected_head,\n                &text,\n                &attachments,\n            )\n            .await\n            .map_err(render_error);\n            BridgeReply::Sent {\n                session: session.to_string(),\n                text,\n                outcome,\n            }\n        }\n        BridgeCommand::LoadSettings => {\n            let home = state.home.clone();\n            let pending = state.startup_repairs_snapshot();\n            BridgeReply::Settings(\n                blocking(move || load_settings(&home))\n                    .await\n                    .map(|mut loaded| {\n                        for repair in pending {\n                            push_unique_repair(&mut loaded.repairs, repair);\n                        }\n                        crate::SettingsSnapshot {\n                            settings: loaded.settings,\n                            revision: loaded.revision,\n                            provider_keys: loaded.provider_keys,\n                            mcp_keys: loaded.mcp_keys,\n                            repairs: loaded.repairs,\n                        }\n                    }),\n            )\n        }\n        BridgeCommand::SaveSettings {\n            expected_revision,\n            settings,\n        } => {\n            let home = state.home.clone();\n            BridgeReply::SettingsSaved(\n                blocking(move || save_settings(&home, expected_revision, &settings)).await,\n            )\n        }\n        BridgeCommand::SaveProviderKey {\n            provider_id,\n            api_key,\n        } => {\n            let home = state.home.clone();\n            BridgeReply::ProviderKeySaved(\n                blocking(move || save_provider_key(&home, &provider_id, &api_key)).await,\n            )\n        }\n        BridgeCommand::ChatTurn { .. } | BridgeCommand::CompactSession { .. } => {\n            BridgeReply::ChatStarted(Err(\"chat turns run as concurrent tasks\".to_owned()))\n        }\n        BridgeCommand::CancelChat { .. } => {\n            BridgeReply::ChatCancelled(Err(\"chat cancels run as concurrent tasks\".to_owned()))\n        }\n        BridgeCommand::Steer { .. } => {\n            BridgeReply::Steered(Err(\"steers are applied on the core thread\".to_owned()))\n        }\n        BridgeCommand::SummarizeTitle { .. } => {\n            BridgeReply::TitleSummarized(Err(\"title summaries run as concurrent tasks\".to_owned()))\n        }\n        BridgeCommand::CancelSubagent { .. } => BridgeReply::SubagentCancelled(Err(\n            \"subagent cancels run as concurrent tasks\".to_owned(),\n        )),\n        BridgeCommand::SearchProjectFiles { session_id, query } => {\n            let root = state.project_dir(&session_id);\n            BridgeReply::ProjectFiles(\n                blocking(move || Ok(search_project_files(&root, &query))).await,\n            )\n        }\n        BridgeCommand::McpListTools { server } => BridgeReply::McpTools {\n            server_id: server.id.clone(),\n            outcome: mcp_list_tools(&state.home, &server).await,\n        },\n        BridgeCommand::RecallMessage {\n            session,\n            branch,\n            expected_head,\n            to_event,\n            edit,\n        } => {\n            // `handle` already runs as its own task; an inner spawn only\n            // added a JoinError layer the match below then unwrapped.\n            match recall_message(\n                &state.home,\n                &state.service,\n                &session,\n                &branch,\n                &expected_head,\n                &to_event,\n            )\n            .await\n            {\n                Ok(conversation) => BridgeReply::Recalled(Ok((Box::new(conversation), edit))),\n                Err(message) => BridgeReply::Recalled(Err(message)),\n            }\n        }\n        BridgeCommand::DeleteSession { session_id } => {\n            // Stop the session's live work first, then evict the actor's\n            // cached ledger: a turn that survives the delete would append\n            // into a session the index no longer names. The eviction is\n            // best-effort — a dead actor cannot resurrect anything either —\n            // so the durable delete always runs.\n            cancel_session_work(state, &session_id);\n            state.forget_token_scale(&session_id);\n            if let Some(id) = mycode_agent::session::SessionId::parse(&session_id) {\n                let _ = state.service.forget(&id).await;\n            }\n            let home = state.home.clone();\n            let forgotten = session_id.clone();\n            let deleted = blocking(move || {\n                delete_session(&home, &forgotten)?;\n                forget_session_bindings(&home, &forgotten)\n            })\n            .await;\n            // Drop the in-memory project binding only after the directory is\n            // gone. Leaving it made tool cwd and file search keep using a\n            // session the user had already deleted.\n            if deleted.is_ok() {\n                state.projects.lock().remove(session_id.as_str());\n            }\n            BridgeReply::SessionDeleted(deleted)\n        }\n        BridgeCommand::RemoveRecent { project } => {\n            let home = state.home.clone();\n            BridgeReply::UiStateSaved(\n                blocking(move || {\n                    // Repair first; the locked edit rejects a damaged file.\n                    read_ui_state(&home).map_err(|error| render_config_error(&error))?;\n                    update_ui_state(&home, |ui_state| ui_state.remove_recent(&project))\n                        .map_err(|error| render_config_error(&error))\n                })\n                .await,\n            )\n        }\n        BridgeCommand::ExportData { path } => {\n            let home = state.home.clone();\n            let outcome = blocking(move || crate::export::export_to_file(&home, &path)).await;\n            BridgeReply::Exported(outcome)\n        }\n        BridgeCommand::ImportData {\n            path,\n            confirm_mcp_commands,\n        } => {\n            let home = state.home.clone();\n            let outcome = blocking(move || {\n                crate::export::import_from_file(&home, &path, confirm_mcp_commands)\n            })\n            .await;\n            BridgeReply::Imported(outcome)\n        }\n        BridgeCommand::ListResources { session_id } => {\n            let home = state.home.clone();\n            let workspace = state.project_dir(&session_id);\n            BridgeReply::Resources(\n                blocking(move || {\n                    let files = mycode_agent::discover_resources(&home, &workspace);\n                    Ok(files\n                        .iter()\n                        .map(|file| {\n                            (\n                                file.name.clone(),\n                                file.path.as_os_str().to_string_lossy().into_owned(),\n                            )\n                        })\n                        .collect())\n                })\n                .await,\n            )\n        }\n        BridgeCommand::AskAnswer {\n            session_id,\n            answers,\n        } => BridgeReply::AskAnswered(deliver_ask_answer(&session_id, answers)),\n        BridgeCommand::AskDismiss { session_id } => {\n            BridgeReply::AskAnswered(dismiss_ask(&session_id))\n        }\n        BridgeCommand::GetCatalog => BridgeReply::Catalog(Ok(catalog_info(state))),\n        BridgeCommand::LoadUiState => {\n            let home = state.home.clone();\n            let pending = state.startup_repairs_snapshot();\n            BridgeReply::UiState(\n                blocking(move || {\n                    let (ui_state, repair) = mycode_agent::read_ui_state_with_repair(&home)\n                        .map_err(|error| render_config_error(&error))?;\n                    let mut repairs = pending;\n                    if let Some(repair) = repair {\n                        push_unique_repair(&mut repairs, repair);\n                    }\n                    Ok((ui_state, repairs))\n                })\n                .await,\n            )\n        }\n        BridgeCommand::SaveUiState { state: ui_state } => {\n            let home = state.home.clone();\n            // Held across the write: snapshots replace the whole document,\n            // so they must land in dispatch order.\n            let _ordered = state.ui_state_writes.lock().await;\n            BridgeReply::UiStateSaved(\n                blocking(move || {\n                    replace_ui_state(&home, &ui_state).map_err(|error| render_config_error(&error))\n                })\n                .await,\n            )\n        }\n        BridgeCommand::SetProjectDir { session_id, path } => {\n            BridgeReply::ProjectSet(set_project_dir(state, &session_id, path.as_deref()))\n        }\n        BridgeCommand::RefreshCatalog => {\n            BridgeReply::Catalog(Err(\"this request runs as a concurrent task\".to_owned()))\n        }\n        BridgeCommand::UiReady => BridgeReply::UiReady(Err(\n            \"the UI-ready signal is handled on the command loop\".to_owned(),\n        )),\n        BridgeCommand::CheckUpdate => {\n            BridgeReply::UpdateChecked(Err(\"this request runs as a concurrent task\".to_owned()))\n        }\n        BridgeCommand::DownloadUpdate { .. } => {\n            BridgeReply::UpdateDownloaded(Err(\"downloads run as concurrent tasks\".to_owned()))\n        }\n        BridgeCommand::TestProxy { .. } => {\n            BridgeReply::ProxyTested(Err(\"this request runs as a concurrent task\".to_owned()))\n        }\n    }\n}\n","crates/mycode-app/src/updates.rs":"//! GitHub-release based self-update for the MYCode desktop.\n//!\n//! The checker resolves the latest published release, picks the release\n//! asset matching the running platform — published names are\n//! `mycode-desktop-v<version>-<target>.zip` — and compares semantic\n//! versions. The\n//! installer downloads the asset plus its `.sha256` sidecar, verifies the\n//! digest, extracts the new binary, and persists it as the durable pending\n//! payload under `<home>/update/`. Staging arms the platform swap right\n//! away: macOS hands it to a detached shell script that replaces the binary\n//! in place, and Windows copies the running executable into a detached\n//! helper that waits for this process to leave — exit by any route\n//! (quit, crash, kill) lands the update, so the next launch is the new\n//! version. A launch that still finds a live pending payload re-arms it,\n//! which covers swaps lost to a reboot or a dead helper. The install\n//! buttons arm the same swap with `--relaunch` (or the script equivalent)\n//! and quit, so a click restarts straight into the new version. Asset\n//! names and staging conventions are produced by the release jobs in\n//! `.github/workflows/ci.yml`. Pull requests run only the check job, with\n//! no packaging or publish. A push to main builds the archives and publishes\n//! when the release plan says to.\n\npub(crate) mod apply;\nuse std::io::{Read as _, Write as _};\nuse std::path::{Path, PathBuf};\n#[cfg(not(windows))]\nuse std::process::Command;\n\nuse serde::Deserialize;\nuse sha2::Digest as _;\n\n/// GitHub API endpoint resolving the latest published release.\npub const LATEST_RELEASE_API: &str =\n    \"https://api.github.com/repos/MCapricorns/mycode/releases/latest\";\n\n/// Every update download lives under this repository's release files. The\n/// API answer names the URL, so it is checked before anything is fetched.\nconst RELEASE_DOWNLOAD_PREFIX: &str = \"https://github.com/MCapricorns/mycode/releases/download/\";\n\n/// Maximum accepted update asset size: 512 MiB.\npub const MAX_ASSET_BYTES: u64 = 512 * 1024 * 1024;\n/// Maximum accepted checksum sidecar size.\nconst MAX_CHECKSUM_BYTES: u64 = 64 * 1024;\n/// Binary size guard for the extracted payload.\nconst MAX_BINARY_BYTES: u64 = 512 * 1024 * 1024;\n\n/// The running application version (workspace version).\n#[must_use]\npub fn current_version() -> &'static str {\n    env!(\"CARGO_PKG_VERSION\")\n}\n\n/// Release asset suffix for one target, empty when that target is unpublished.\n///\n/// Published archives are Windows x64, Windows ARM64, and macOS Apple\n/// Silicon. Intel macOS, Windows x86, Linux, and every other target resolve\n/// no asset and stay on their installed version.\nfn asset_suffix_for(os: &str, arch: &str) -> &'static str {\n    match (os, arch) {\n        (\"windows\", \"x86_64\") => \"-x86_64-pc-windows-msvc.zip\",\n        (\"windows\", \"aarch64\") => \"-aarch64-pc-windows-msvc.zip\",\n        (\"macos\", \"aarch64\") => \"-aarch64-apple-darwin.zip\",\n        _ => \"\",\n    }\n}\n\n/// Release asset family, named after the only published executable stem.\n/// A renamed binary still updates from this family instead of asking the\n/// release for an asset that never exists.\npub const ASSET_FAMILY: &str = \"mycode-desktop\";\n\n/// Release-asset prefix: published names look like\n/// `mycode-desktop-v0.12.21-x86_64-pc-windows-msvc.zip`.\nconst ASSET_PREFIX: &str = \"mycode-desktop-v\";\n\n/// One installable update offer.\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct UpdateOffer {\n    /// New version (no `v` prefix).\n    pub version: String,\n    /// Release page URL for humans.\n    pub notes_url: String,\n    /// Asset download URL.\n    pub asset_url: String,\n    /// Checksum sidecar URL.\n    pub checksum_url: String,\n}\n\n/// A downloaded and verified update, staged for the swap.\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct PreparedUpdate {\n    /// New version (no `v` prefix), for \"newer than me\" checks and prompts.\n    pub version: String,\n    /// Staged new binary, ready to replace the running executable.\n    pub new_binary: PathBuf,\n    /// Directory holding the staged binary and helper files. A temporary\n    /// download stage is swept at startup; a persisted payload lives under\n    /// `<home>/update`.\n    pub stage_dir: PathBuf,\n    /// SHA-256 of `new_binary`. The swap refuses to run when the file differs.\n    pub binary_sha256: String,\n}\n\n#[derive(Deserialize)]\nstruct ReleaseJson {\n    #[serde(rename = \"tagName\", alias = \"tag_name\")]\n    tag_name: String,\n    #[serde(rename = \"htmlUrl\", alias = \"html_url\")]\n    html_url: String,\n    #[serde(default)]\n    assets: Vec<AssetJson>,\n}\n\n#[derive(Deserialize)]\nstruct AssetJson {\n    name: String,\n    #[serde(rename = \"browserDownloadUrl\", alias = \"browser_download_url\")]\n    browser_download_url: String,\n}\n\n/// Resolves the latest installable release for this target.\n///\n/// `Ok(None)` means there is nothing to install: the app is current, the\n/// target has no published archive, GitHub returned 404, or the tag is\n/// not a newer semver version. The version gate runs before the asset\n/// lookup, so an up-to-date app stays quiet even when the current release\n/// is missing its zip. A newer release whose zip is missing is `Err`, not\n/// `None`, so a broken release job is visible instead of silently ignored.\n///\n/// # Errors\n///\n/// Returns the transport, parse, or HTTP failure message. An unparsable\n/// tag is `Ok(None)`, not an error.\npub async fn latest_release(user_agent: &str) -> Result<Option<UpdateOffer>, String> {\n    let response = mycode_agent::send_pinned(mycode_agent::PinnedRequest {\n        method: reqwest::Method::GET,\n        url: LATEST_RELEASE_API.to_owned(),\n        headers: vec![(\n            \"accept\".to_owned(),\n            \"application/vnd.github+json\".to_owned(),\n        )],\n        body: None,\n        mode: mycode_agent::PinMode::PublicHttps,\n        timeout: Some(std::time::Duration::from_secs(30)),\n        read_timeout: None,\n        user_agent: Some(user_agent.to_owned()),\n        follow_redirects: true,\n        cancel: tokio_util::sync::CancellationToken::new(),\n    })\n    .await\n    .map_err(|error| format!(\"update check failed: {}\", brief_error(&error)))?;\n    if classify_release_status(response.status())?.is_none() {\n        return Ok(None);\n    }\n    let release: ReleaseJson = response.json().await.map_err(|error| {\n        format!(\n            \"update response malformed: {}\",\n            brief_error(&error.to_string())\n        )\n    })?;\n    if !is_newer(&release.tag_name, current_version()) {\n        return Ok(None);\n    }\n    resolve_asset(&release.tag_name, &release.html_url, &release.assets)\n}\n\n/// First line of a transport error, bounded, so reqwest's full error chain\n/// (URL, TLS, and retry diagnostics) cannot stretch a toast across the screen.\npub fn brief_error(message: &str) -> String {\n    let first = message.lines().next().unwrap_or(message);\n    let mut chars = first.chars();\n    let mut brief = String::new();\n    for char in chars.by_ref().take(160) {\n        brief.push(char);\n    }\n    if chars.next().is_some() {\n        brief.push('\\u{2026}');\n    }\n    brief\n}\n\n/// Classifies one fetched release-check status: `Ok(None)` short-circuits as\n/// \"no release published\" (404), `Ok(Some(()))` proceeds to parse the body,\n/// and every other status is a surfaced failure. Reporting a server error,\n/// auth failure, or rate limit as \"current\" would silently hide a broken\n/// updater.\nfn classify_release_status(status: reqwest::StatusCode) -> Result<Option<()>, String> {\n    if status == reqwest::StatusCode::NOT_FOUND {\n        return Ok(None);\n    }\n    if !status.is_success() {\n        return Err(format!(\"update check failed: HTTP {status}\"));\n    }\n    Ok(Some(()))\n}\n\nfn resolve_asset(\n    tag: &str,\n    notes_url: &str,\n    assets: &[AssetJson],\n) -> Result<Option<UpdateOffer>, String> {\n    resolve_asset_for(\n        std::env::consts::OS,\n        std::env::consts::ARCH,\n        tag,\n        notes_url,\n        assets,\n    )\n}\n\n/// `Ok(None)` is an unsupported target (no published archive). A supported\n/// target with no matching file is an error, so a supported platform is not\n/// reported as already up to date when its zip is missing from the release.\nfn resolve_asset_for(\n    os: &str,\n    arch: &str,\n    tag: &str,\n    notes_url: &str,\n    assets: &[AssetJson],\n) -> Result<Option<UpdateOffer>, String> {\n    let suffix = asset_suffix_for(os, arch);\n    if suffix.is_empty() {\n        return Ok(None);\n    }\n    // The `.sha256` sidecar shares the prefix and must not be selected.\n    let asset = assets.iter().find(|asset| {\n        asset.name.starts_with(ASSET_PREFIX)\n            && asset.name.ends_with(suffix)\n            && !asset.name.ends_with(\".sha256\")\n    });\n    let Some(asset) = asset else {\n        return Err(format!(\n            \"update check failed: release has no {ASSET_PREFIX}*{suffix} asset\"\n        ));\n    };\n    if !is_release_download(&asset.browser_download_url) {\n        return Err(\"update check failed: asset is not a MYCode release download\".to_owned());\n    }\n    let version = tag.trim_start_matches('v').to_owned();\n    Ok(Some(UpdateOffer {\n        version,\n        notes_url: notes_url.to_owned(),\n        asset_url: asset.browser_download_url.clone(),\n        checksum_url: format!(\"{}.sha256\", asset.browser_download_url),\n    }))\n}\n\n/// A plain file under [`RELEASE_DOWNLOAD_PREFIX`]: no query, fragment, or\n/// dot segment that could point the download somewhere else.\nfn is_release_download(url: &str) -> bool {\n    url.strip_prefix(RELEASE_DOWNLOAD_PREFIX)\n        .is_some_and(|rest| {\n            !rest.is_empty()\n                && !rest.contains(['?', '#', '\\\\', '%'])\n                && rest\n                    .split('/')\n                    .all(|part| !part.is_empty() && part != \".\" && part != \"..\")\n        })\n}\n\n/// Whether `tag` is strictly newer than `current` (both `vX.Y.Z` or `X.Y.Z`).\n#[must_use]\npub fn is_newer(tag: &str, current: &str) -> bool {\n    let (Ok(tag), Ok(current)) = (\n        semver::Version::parse(tag.trim_start_matches('v')),\n        semver::Version::parse(current.trim_start_matches('v')),\n    ) else {\n        return false;\n    };\n    tag > current\n}\n\n/// Downloads the update asset, verifies its published SHA-256 digest, and\n/// extracts the new binary into a fresh staging directory.\n///\n/// # Errors\n///\n/// Returns a failure message; the running installation is untouched.\n///\n/// The bridge core runs on a single-threaded runtime, so every multi-hundred-\n/// megabyte synchronous stage (checksum, zip extraction, hashing) runs on\n/// the blocking pool; only the HTTP streams stay on the async thread.\npub async fn download_update(\n    user_agent: &str,\n    offer: &UpdateOffer,\n) -> Result<PreparedUpdate, String> {\n    let stage_dir = std::env::temp_dir().join(format!(\n        \"mycode-update-{}-{}\",\n        std::process::id(),\n        offer.version.replace('.', \"-\")\n    ));\n    let stage_reset = stage_dir.clone();\n    tokio::task::spawn_blocking(move || -> Result<(), String> {\n        if stage_reset.exists() {\n            std::fs::remove_dir_all(&stage_reset)\n                .map_err(|error| format!(\"stage reset: {error}\"))?;\n        }\n        std::fs::create_dir_all(&stage_reset).map_err(|error| format!(\"stage create: {error}\"))\n    })\n    .await\n    .map_err(|error| format!(\"stage task: {error}\"))??;\n\n    let asset_path = stage_dir.join(\"update.asset\");\n    fetch_to_file(user_agent, &offer.asset_url, &asset_path, MAX_ASSET_BYTES).await?;\n\n    let checksum_path = stage_dir.join(\"update.sha256\");\n    fetch_to_file(\n        user_agent,\n        &offer.checksum_url,\n        &checksum_path,\n        MAX_CHECKSUM_BYTES,\n    )\n    .await?;\n\n    let verify_stage_dir = stage_dir.clone();\n    let verify_stage = tokio::task::spawn_blocking(move || -> Result<(PathBuf, String), String> {\n        verify_checksum(&asset_path, &checksum_path)?;\n        let binary_path = extract_binary(&asset_path, &verify_stage_dir)?;\n        let binary_sha256 = file_sha256(&binary_path)?;\n        let _ = std::fs::remove_file(&asset_path);\n        let _ = std::fs::remove_file(&checksum_path);\n        Ok((binary_path, binary_sha256))\n    });\n    let (new_binary, binary_sha256) = verify_stage\n        .await\n        .map_err(|error| format!(\"verify task: {error}\"))??;\n    Ok(PreparedUpdate {\n        version: offer.version.clone(),\n        new_binary,\n        stage_dir,\n        binary_sha256,\n    })\n}\n\n/// Idle ceiling while waiting for response headers and between body\n/// chunks of an update download. The download itself is streaming: a\n/// total request timeout would cap a multi-hundred-megabyte asset at one\n/// fixed wall clock and fail every link slower than that.\nconst DOWNLOAD_IDLE: std::time::Duration = std::time::Duration::from_secs(30);\n\nasync fn fetch_to_file(\n    user_agent: &str,\n    url: &str,\n    destination: &Path,\n    maximum: u64,\n) -> Result<(), String> {\n    let mut response = mycode_agent::send_pinned(mycode_agent::PinnedRequest {\n        method: reqwest::Method::GET,\n        url: url.to_owned(),\n        headers: Vec::new(),\n        body: None,\n        mode: mycode_agent::PinMode::PublicHttps,\n        timeout: None,\n        read_timeout: Some(DOWNLOAD_IDLE),\n        user_agent: Some(user_agent.to_owned()),\n        follow_redirects: true,\n        cancel: tokio_util::sync::CancellationToken::new(),\n    })\n    .await\n    .map_err(|error| format!(\"download failed: {}\", brief_error(&error)))?;\n    if !response.status().is_success() {\n        return Err(format!(\"download returned {}\", response.status()));\n    }\n    // Disk writes happen on a blocking-pool task fed by a bounded channel,\n    // so a fast network never parks the async thread inside write(2) and a\n    // slow disk applies backpressure instead of buffering the asset.\n    let (tx, mut rx) = tokio::sync::mpsc::channel::<bytes::Bytes>(32);\n    let writer_destination = destination.to_path_buf();\n    let writer = tokio::task::spawn_blocking(move || -> Result<(), String> {\n        let file = std::fs::File::create(&writer_destination)\n            .map_err(|error| format!(\"stage: {error}\"))?;\n        let mut writer = std::io::BufWriter::new(file);\n        while let Some(chunk) = rx.blocking_recv() {\n            writer\n                .write_all(&chunk)\n                .map_err(|error| format!(\"stage write failed: {error}\"))?;\n        }\n        writer\n            .flush()\n            .map_err(|error| format!(\"stage write failed: {error}\"))\n    });\n    let mut downloaded: u64 = 0;\n    loop {\n        // `chunk` is cancel-safe, so the idle ceiling only fires on a\n        // connection that stopped delivering bytes.\n        let chunk = match tokio::time::timeout(DOWNLOAD_IDLE, response.chunk()).await {\n            Ok(Ok(Some(chunk))) => chunk,\n            Ok(Ok(None)) => break,\n            Ok(Err(error)) => return Err(format!(\"download stream failed: {error}\")),\n            Err(_) => return Err(\"download stalled: no data arrived in time\".to_owned()),\n        };\n        downloaded += chunk.len() as u64;\n        if downloaded > maximum {\n            return Err(\"download exceeded its size bound\".to_owned());\n        }\n        if tx.send(chunk).await.is_err() {\n            // The writer task already failed; its result carries the reason.\n            break;\n        }\n    }\n    drop(tx);\n    writer\n        .await\n        .map_err(|error| format!(\"stage task: {error}\"))?\n}\n\nfn verify_checksum(asset: &Path, checksum_file: &Path) -> Result<(), String> {\n    let mut sidecar = String::new();\n    std::fs::File::open(checksum_file)\n        .and_then(|mut file| file.read_to_string(&mut sidecar))\n        .map_err(|error| format!(\"checksum sidecar: {error}\"))?;\n    let expected = sidecar\n        .split_whitespace()\n        .next()\n        .unwrap_or_default()\n        .to_ascii_lowercase();\n    if expected.len() != 64 || !expected.bytes().all(|byte| byte.is_ascii_hexdigit()) {\n        return Err(\"checksum sidecar malformed\".to_owned());\n    }\n    let actual = file_sha256(asset)?;\n    if !actual.eq_ignore_ascii_case(&expected) {\n        return Err(\"downloaded update failed its checksum verification\".to_owned());\n    }\n    Ok(())\n}\n\nfn extract_binary(asset: &Path, stage_dir: &Path) -> Result<PathBuf, String> {\n    let file = std::fs::File::open(asset).map_err(|error| format!(\"asset open: {error}\"))?;\n    let mut archive = zip::ZipArchive::new(file).map_err(|error| format!(\"asset open: {error}\"))?;\n    let mut entry_name: Option<String> = None;\n    for index in 0..archive.len() {\n        let entry = archive\n            .by_index(index)\n            .map_err(|error| format!(\"asset entry: {error}\"))?;\n        let name = entry\n            .name()\n            .map_err(|error| format!(\"asset entry: {error}\"))?\n            .into_owned();\n        if entry.is_dir() {\n            continue;\n        }\n        let base = name.split('/').next_back().unwrap_or(&name);\n        let executable = name.ends_with(\".exe\") || base == ASSET_FAMILY;\n        if !executable {\n            continue;\n        }\n        let mut parts = std::path::Path::new(&name).components();\n        // A drive prefix (`C:x.exe`) would make the staged path absolute on\n        // Windows, so a colon is refused along with `..` and roots.\n        let malicious = name.contains(['\\\\', ':'])\n            || parts.any(|component| {\n                matches!(\n                    component,\n                    std::path::Component::ParentDir\n                        | std::path::Component::RootDir\n                        | std::path::Component::Prefix(_)\n                )\n            });\n        if malicious {\n            return Err(\"archive entry path is unsafe\".to_owned());\n        }\n        if entry.size() > MAX_BINARY_BYTES {\n            return Err(\"archive entry oversized\".to_owned());\n        }\n        entry_name = Some(name);\n        break;\n    }\n    let Some(entry_name) = entry_name else {\n        return Err(\"archive has no application binary\".to_owned());\n    };\n    let base_name = entry_name\n        .split('/')\n        .next_back()\n        .unwrap_or(ASSET_FAMILY)\n        .to_owned();\n    let binary_path = stage_dir.join(&base_name);\n    let mut entry = archive\n        .by_name(&entry_name)\n        .map_err(|error| format!(\"asset entry: {error}\"))?;\n    let mut out =\n        std::fs::File::create(&binary_path).map_err(|error| format!(\"stage binary: {error}\"))?;\n    // Chunked copy: a lying zip header could declare a small `size()` and\n    // still decompress more bytes, so the guard is enforced on what is\n    // actually written.\n    let mut buffer = vec![0u8; 64 * 1024];\n    let mut written: u64 = 0;\n    loop {\n        let read = entry\n            .read(&mut buffer)\n            .map_err(|error| format!(\"stage binary: {error}\"))?;\n        if read == 0 {\n            break;\n        }\n        written += read as u64;\n        if written > MAX_BINARY_BYTES {\n            return Err(\"archive entry oversized\".to_owned());\n        }\n        out.write_all(&buffer[..read])\n            .map_err(|error| format!(\"stage binary: {error}\"))?;\n    }\n    #[cfg(unix)]\n    {\n        use std::os::unix::fs::PermissionsExt as _;\n        std::fs::set_permissions(&binary_path, std::fs::Permissions::from_mode(0o755))\n            .map_err(|error| format!(\"stage binary: {error}\"))?;\n    }\n    Ok(binary_path)\n}\n\n/// Arms the platform swap and returns. The caller may exit right away (an\n/// install click) or keep running (a staged download): on Windows the\n/// detached helper waits for this process to leave, on Unix the script\n/// replaces the binary in place immediately — either way the next launch\n/// is the new version, no matter how this process ends.\n///\n/// `relaunch` starts the target again after a verified replace: an install\n/// click passes `true`, a staged download armed for the next exit passes\n/// `false`.\n///\n/// Windows launches a copy of this executable with [`apply::APPLY_UPDATE_ARG`].\n/// macOS launches an `update-*.sh` script.\n///\n/// # Errors\n///\n/// Returns a failure message when the staged payload is corrupt and the\n/// target does not already carry it, or when the helper cannot start.\npub fn arm_staged_update(prepared: &PreparedUpdate, relaunch: bool) -> Result<(), String> {\n    let current = std::env::current_exe().map_err(|error| format!(\"current exe: {error}\"))?;\n    let current = current.canonicalize().unwrap_or(current);\n    // A sibling helper may already have landed the swap, and a winner may\n    // already have consumed the staged file, so a missing staged file is\n    // fine whenever the target itself already hashes to the expected digest.\n    let applied = target_matches(&current, &prepared.binary_sha256);\n    if !applied {\n        let staged = file_sha256(&prepared.new_binary)\n            .map_err(|_| \"staged update binary is unreadable\".to_owned())?;\n        if !staged.eq_ignore_ascii_case(&prepared.binary_sha256) {\n            return Err(\"staged update binary failed its sha256 check\".to_owned());\n        }\n    }\n    #[cfg(windows)]\n    {\n        apply::spawn_windows_helper(\n            &prepared.stage_dir,\n            &current,\n            &prepared.new_binary,\n            &prepared.binary_sha256,\n            relaunch,\n        )?;\n    }\n    #[cfg(not(windows))]\n    {\n        let script_path = prepared.stage_dir.join(format!(\n            \"update-{}-{}.sh\",\n            std::process::id(),\n            crate::unix_now().as_nanos()\n        ));\n        let script = unix_script(\n            &prepared.new_binary,\n            &current,\n            &prepared.binary_sha256,\n            relaunch,\n        );\n        std::fs::write(&script_path, script).map_err(|error| format!(\"updater script: {error}\"))?;\n        Command::new(\"/bin/sh\")\n            .arg(&script_path)\n            .spawn()\n            .map_err(|error| format!(\"updater spawn: {error}\"))?;\n    }\n    Ok(())\n}\n\n/// Whether `target` already hashes to `expected` — the swap is done.\nfn target_matches(target: &Path, expected: &str) -> bool {\n    file_sha256(target).is_ok_and(|hash| hash.eq_ignore_ascii_case(expected))\n}\n\n/// Durable directory for a staged update that must survive this process:\n/// `<home>/update/`. A payload here outlives crashes and reboots, so a\n/// later launch can
