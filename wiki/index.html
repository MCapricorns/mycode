not be copied aside.\npub fn read_app_settings(home: &crate::HomeLayout) -> Result<AppSettings, ConfigError> {\n    Ok(read_app_settings_with_repair(home)?.0)\n}\n\n/// Reads `settings.json`, repairing a damaged document.\n///\n/// The second value is set when the previous bytes were copied to a\n/// `settings.json.broken-*` file and the original path was replaced. A valid\n/// document does not report a repair.\n///\n/// # Errors\n///\n/// Returns [`ConfigError`] for owned-path security or when the backup or the\n/// replacement cannot be published.\npub fn read_app_settings_with_repair(\n    home: &crate::HomeLayout,\n) -> Result<(AppSettings, Option<crate::DocumentRepair>), ConfigError> {\n    let loaded = crate::document_repair::load_or_reset(\n        home,\n        SETTINGS_PATH,\n        MAX_AUTHORITY_DOCUMENT_BYTES,\n        |bytes| Ok(decode_settings(bytes)?.settings),\n        AppSettings::default,\n        salvage_app_settings,\n        |settings| publish_settings(home, settings),\n    )?;\n    Ok((loaded.value, loaded.repair))\n}\n\nfn publish_settings(home: &crate::HomeLayout, settings: &AppSettings) -> Result<(), ConfigError> {\n    settings.validate()?;\n    let bytes = encode_settings(AuthorityRevision::ABSENT.checked_next()?, settings)?;\n    locked_update_owned_file(home, SETTINGS_PATH, MAX_AUTHORITY_DOCUMENT_BYTES, |_| {\n        Ok(bytes)\n    })\n}\n\n/// Replaces `settings.json` under revision compare-and-swap.\n///\n/// A missing document has logical revision zero. The replacement is fully\n/// validated before publication.\n///\n/// # Errors\n///\n/// Returns [`ConfigErrorKind::RevisionConflict`] for a stale expectation and\n/// [`ConfigError`] for validation or transaction failures.\npub fn replace_app_settings(\n    home: &crate::HomeLayout,\n    expected_revision: AuthorityRevision,\n    settings: &AppSettings,\n) -> Result<AuthorityRevision, ConfigError> {\n    settings.validate()?;\n    let mut published_revision = None;\n    locked_update_owned_file(\n        home,\n        SETTINGS_PATH,\n        MAX_AUTHORITY_DOCUMENT_BYTES,\n        |current| {\n            let current_revision = match current {\n                Some(bytes) => parse_document_header(bytes)?,\n                None => AuthorityRevision::ABSENT,\n            };\n            if current_revision != expected_revision {\n                return Err(ConfigError::new(ConfigErrorKind::RevisionConflict));\n            }\n            let revision = current_revision.checked_next()?;\n            let bytes = encode_settings(revision, settings)?;\n            if bytes.len() > MAX_AUTHORITY_DOCUMENT_BYTES {\n                return Err(ConfigError::new(ConfigErrorKind::Oversized));\n            }\n            published_revision = Some(revision);\n            Ok(bytes)\n        },\n    )?;\n    published_revision.ok_or_else(|| ConfigError::new(ConfigErrorKind::Serialization))\n}\n\nfn encode_settings(\n    revision: AuthorityRevision,\n    settings: &AppSettings,\n) -> Result<Vec<u8>, ConfigError> {\n    let document = SerializedSettings {\n        format_version: SETTINGS_FORMAT_VERSION,\n        kind: SETTINGS_KIND,\n        revision: revision.get(),\n        settings,\n    };\n    let mut bytes = serde_json::to_vec_pretty(&document)\n        .map_err(|_| ConfigError::new(ConfigErrorKind::Serialization))?;\n    bytes.push(b'\\n');\n    Ok(bytes)\n}\n\n#[derive(Serialize)]\n#[serde(rename_all = \"camelCase\")]\nstruct SerializedSettings<'a> {\n    format_version: u32,\n    kind: &'static str,\n    revision: u64,\n    #[serde(flatten)]\n    settings: &'a AppSettings,\n}\n\n/// Envelope plus the settings fields captured as a map.\n///\n/// `deny_unknown_fields` on [`AppSettings`] is silently ignored when the\n/// struct is deserialized through `#[serde(flatten)]`, so the envelope keeps\n/// the settings keys in a map and [`AppSettings`] decodes from that value,\n/// where an unknown key is rejected again instead of being silently dropped.\n#[derive(Deserialize)]\n#[serde(rename_all = \"camelCase\")]\nstruct DeserializedSettings {\n    format_version: u32,\n    kind: String,\n    revision: u64,\n    #[serde(flatten)]\n    fields: serde_json::Map<String, serde_json::Value>,\n}\n\n/// A decoded and validated settings document.\nstruct ParsedSettings {\n    settings: AppSettings,\n    revision: AuthorityRevision,\n}\n\nfn parse_document_header(bytes: &[u8]) -> Result<AuthorityRevision, ConfigError> {\n    Ok(decode_settings(bytes)?.revision)\n}\n\nfn decode_settings(bytes: &[u8]) -> Result<ParsedSettings, ConfigError> {\n    let rejection = || {\n        ConfigError::authority_rejection()\n            .with_detail(\"settings.json: unknown field, wrong type, or malformed JSON\".to_owned())\n    };\n    let document =\n        serde_json::from_slice::<DeserializedSettings>(bytes).map_err(|_| rejection())?;\n    if document.format_version != SETTINGS_FORMAT_VERSION || document.kind != SETTINGS_KIND {\n        return Err(ConfigError::authority_rejection()\n            .with_detail(\"settings.json: formatVersion or kind does not match this build\"));\n    }\n    let revision = AuthorityRevision::new(document.revision)?;\n    let settings =\n        serde_json::from_value::<AppSettings>(serde_json::Value::Object(document.fields))\n            .map_err(|_| rejection())?;\n    // No in-place upgrade. A document that does not validate is rejected\n    // and the caller resets the file, keeping what still decodes.\n    settings.validate()?;\n    Ok(ParsedSettings { settings, revision })\n}\n\n/// Extracts the still-valid sections of a document the strict read rejected,\n/// so a reset does not make the user re-enter healthy configuration.\n///\n/// Every family decodes and validates on its own: one bad member (a removed\n/// key, a malformed entry) drops only its own section. `None` when the bytes\n/// are not a JSON object or the result still fails validation.\n#[must_use]\npub fn salvage_app_settings(document: &serde_json::Value) -> Option<AppSettings> {\n    let object = document.as_object()?;\n    let valid = |probe: &AppSettings| probe.validate().is_ok();\n    let mut settings = AppSettings::default();\n    if let Some(proxy) = crate::document_repair::salvage_field::<String>(object, \"proxy\") {\n        crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n            probe.proxy = proxy;\n        });\n    }\n    if let Some(appearance) = object\n        .get(\"appearance\")\n        .and_then(serde_json::Value::as_object)\n    {\n        // Field-level salvage: a bad theme drops only the theme, not a\n        // healthy language or font size sitting beside it.\n        if let Some(theme) = crate::document_repair::salvage_field::<String>(appearance, \"theme\") {\n            crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n                probe.appearance.theme = theme;\n            });\n        }\n        if let Some(language) =\n            crate::document_repair::salvage_field::<String>(appearance, \"language\")\n        {\n            crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n                probe.appearance.language = language;\n            });\n        }\n        if let Some(font_size) =\n            crate::document_repair::salvage_field::<String>(appearance, \"fontSize\")\n        {\n            crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n                probe.appearance.font_size = font_size;\n            });\n        }\n    }\n    if let Some(reasoning) =\n        crate::document_repair::salvage_field::<Option<String>>(object, \"reasoningEffort\")\n    {\n        crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n            probe.reasoning_effort = reasoning;\n        });\n    }\n    if let Some(magpie) = crate::document_repair::salvage_field::<MagpieSettings>(object, \"magpie\")\n    {\n        crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n            probe.magpie = magpie;\n        });\n    }\n    for server in crate::document_repair::salvage_list::<McpServerSettings>(object, \"mcpServers\") {\n        if settings.mcp_servers.len() >= MAX_MCP_SERVERS {\n            break;\n        }\n        if settings.mcp_servers.iter().any(|held| held.id == server.id) {\n            continue;\n        }\n        crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n            probe.mcp_servers.push(server);\n        });\n    }\n    // Role routes name configured provider ids, so subagents salvage only\n    // against the providers already adopted above.\n    if let Some(subagents) = object\n        .get(\"subagents\")\n        .and_then(serde_json::Value::as_object)\n    {\n        for role in crate::document_repair::salvage_list::<SubagentRoleSettings>(subagents, \"roles\")\n        {\n            crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n                probe.subagents.roles.push(role);\n            });\n        }\n    }\n    if let Some(skills) = object.get(\"skills\").and_then(serde_json::Value::as_object) {\n        for slug in crate::document_repair::salvage_list::<String>(skills, \"disabled\") {\n            if settings.skills.disabled.len() >= MAX_DISABLED_SKILLS {\n                break;\n            }\n            crate::document_repair::salvage_adopt(&mut settings, valid, |probe| {\n                probe.skills.disabled.push(slug);\n            });\n        }\n    }\n    valid(&settings).then_some(settings)\n}\n\npub(crate) fn bounded_text(value: &str, max: usize) -> Result<(), ConfigError> {\n    if value.len() <= max && !value.contains(['\\0', '\\r', '\\n']) {\n        Ok(())\n    } else {\n        Err(ConfigError::authority_rejection())\n    }\n}\n\nfn is_portable_id(value: &str) -> bool {\n    crate::home::is_valid_portable_id(value)\n}\n\npub(crate) fn is_https_url(value: &str) -> bool {\n    if bounded_text(value, MAX_URL_BYTES).is_err() {\n        return false;\n    }\n    let Some(rest) = value.strip_prefix(\"https://\") else {\n        return false;\n    };\n    let host = rest.split('/').next().unwrap_or_default();\n    // Graphic ASCII already excludes whitespace, NUL, and other controls.\n    !host.is_empty() && host.bytes().all(|byte| byte.is_ascii_graphic())\n}\n\n/// Whether `value` is an `http://` URL on this machine.\n///\n/// magpie's gateway listens on loopback only, and its agent plugin writes\n/// `http://127.0.0.1:<port>/v1`. Nothing else may use plain http.\npub(crate) fn is_local_http_url(value: &str) -> bool {\n    if bounded_text(value, MAX_URL_BYTES).is_err() {\n        return false;\n    }\n    let Some(rest) = value.strip_prefix(\"http://\") else {\n        return false;\n    };\n    let authority = rest\n        .split(['/', '?', '#'])\n        .next()\n        .unwrap_or_default()\n        .trim_end_matches('/');\n    let (host, port) = if let Some(rest) = authority.strip_prefix('[') {\n        let Some((host, port)) = rest.split_once(']') else {\n            return false;\n        };\n        (format!(\"[{host}]\"), port.strip_prefix(':'))\n    } else if let Some((host, port)) = authority.rsplit_once(':') {\n        (host.to_owned(), Some(port))\n    } else {\n        (authority.to_owned(), None)\n    };\n    let host_ok = matches!(host.as_str(), \"127.0.0.1\" | \"localhost\" | \"[::1]\");\n    let port_ok = port.is_none_or(|port| {\n        !port.is_empty() && port.len() <= 5 && port.bytes().all(|byte| byte.is_ascii_digit())\n    });\n    host_ok && port_ok\n}\n\n/// Whether `value` can name one gateway model (`provider/model`).\npub(crate) fn is_portable_model_id(value: &str) -> bool {\n    !value.is_empty()\n        && value.len() <= 512\n        && !value\n            .chars()\n            .any(|ch| ch.is_control() || ch.is_whitespace())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{AppSettings, decode_settings, encode_settings, salvage_app_settings};\n    use crate::authority::AuthorityRevision;\n\n    #[test]\n    fn unknown_settings_field_is_rejected_not_ignored() {\n        // `deny_unknown_fields` is inert under `#[serde(flatten)]`, so a\n        // misspelled field must still be rejected by the map-based decode.\n        let bytes = br#\"{\n            \"formatVersion\": 1,\n            \"kind\": \"mycode-app-settings\",\n            \"revision\": 1,\n            \"appearance\": { \"theme\": \"dark\", \"language\": \"auto\" },\n            \"appearances\": { \"theme\": \"light\" }\n        }\"#;\n        let error = decode_settings(bytes)\n            .err()\n            .expect(\"unknown field is document damage\");\n        assert_eq!(error.kind(), crate::ConfigErrorKind::AuthorityValidation);\n        assert!(\n            error.summary().contains(\"unknown field\"),\n            \"{}\",\n            error.summary()\n        );\n\n        let nested = br#\"{\n            \"formatVersion\": 1,\n            \"kind\": \"mycode-app-settings\",\n            \"revision\": 1,\n            \"appearance\": { \"theme\": \"dark\", \"language\": \"auto\", \"humeur\": \"x\" }\n        }\"#;\n        let error = decode_settings(nested)\n            .err()\n            .expect(\"nested unknown field is rejected\");\n        assert_eq!(error.kind(), crate::ConfigErrorKind::AuthorityValidation);\n\n        // Keys from older documents are equally unknown: there is no\n        // per-field compatibility shim anymore.\n        for document in [\n            &br#\"{\"formatVersion\":1,\"kind\":\"mycode-app-settings\",\"revision\":1,\"usage\":{\"enabled\":true}}\"#[..],\n            &br#\"{\"formatVersion\":1,\"kind\":\"mycode-app-settings\",\"revision\":1,\"tools\":{\"shell\":{\"kind\":\"pwsh\",\"program\":\"C:\\\\pwsh.exe\"},\"osSandbox\":true}}\"#[..],\n            &br#\"{\"formatVersion\":1,\"kind\":\"mycode-app-settings\",\"revision\":1,\"userAgent\":\"custom-agent\"}\"#[..],\n            &br#\"{\"formatVersion\":1,\"kind\":\"mycode-app-settings\",\"revision\":1,\"appearance\":{\"theme\":\"dark\",\"palette\":\"ocean\"}}\"#[..],\n            &br#\"{\"formatVersion\":1,\"kind\":\"mycode-app-settings\",\"revision\":1,\"appearance\":{\"theme\":\"dark\",\"fontFamily\":\"Comic Sans\"}}\"#[..],\n            &br#\"{\"formatVersion\":1,\"kind\":\"mycode-app-settings\",\"revision\":1,\"subagents\":{\"maxConcurrent\":2}}\"#[..],\n        ] {\n            let error = decode_settings(document)\n                .err()\n                .expect(\"a removed field is document damage\");\n            assert_eq!(error.kind(), crate::ConfigErrorKind::AuthorityValidation);\n        }\n    }\n\n    #[test]\n    fn salvage_keeps_the_healthy_sections_of_a_damaged_document() {\n        let document: serde_json::Value = serde_json::from_slice(\n            br#\"{\n            \"formatVersion\": 1,\n            \"kind\": \"mycode-app-settings\",\n            \"revision\": 6,\n            \"appearance\": { \"theme\": \"nope\", \"language\": \"zh\" },\n            \"userAgent\": \"custom-agent\",\n            \"usage\": { \"enabled\": true },\n            \"web\": { \"backends\": [\n                { \"id\": \"exa\", \"kind\": \"exa\", \"endpoint\": \"https://api.exa.ai\", \"enabled\": true }\n            ]},\n            \"magpie\": {\n                \"enabled\": true,\n                \"baseUrl\": \"http://127.0.0.1:3425/v1\",\n                \"apiKey\": \"magpie-mycode\",\n                \"model\": \"deepseek/deepseek-chat\"\n            },\n            \"subagents\": {\n                \"maxConcurrent\": 4,\n                \"roles\": [\n                    { \"role\": \"scout\", \"enabled\": true, \"provider\": \"magpie\", \"model\": \"gpt-4o\" },\n                    { \"role\": \"artisan\", \"enabled\": true, \"provider\": \"missing\", \"model\": \"x\" }\n                ]\n            },\n            \"skills\": {\n                \"extra\": true,\n                \"disabled\": [\"review\", \"\", \"review\"]\n            }\n        }\"#,\n        )\n        .expect(\"fixture json\");\n        let settings = salvage_app_settings(&document).expect(\"salvage succeeds\");\n        // The invalid theme fell back to the default; its language survived.\n        assert_eq!(settings.appearance.theme, \"dark\");\n        assert_eq!(settings.appearance.language, \"zh\");\n        // A repair keeps magpie's binding and drops the retired web family.\n        assert!(settings.magpie.enabled);\n        assert_eq!(settings.magpie.model, \"deepseek/deepseek-chat\");\n        // Healthy subagent role routes and disabled skills survive retired\n        // sibling keys and bad entries.\n        assert_eq!(settings.subagents.roles.len(), 1);\n        assert_eq!(settings.subagents.roles[0].role, \"scout\");\n        assert_eq!(settings.skills.disabled, [\"review\"]);\n        // Removed keys are simply not read by the salvage.\n        let encoded = serde_json::to_string(&settings).expect(\"encode\");\n        for removed in [\n            \"userAgent\",\n            \"usage\",\n            \"tools\",\n            \"palette\",\n            \"fontFamily\",\n            \"web\",\n        ] {\n            assert!(!encoded.contains(removed), \"{encoded}\");\n        }\n    }\n\n    #[test]\n    fn salvage_returns_none_for_a_non_object_document() {\n        assert!(salvage_app_settings(&serde_json::json!([1, 2])).is_none());\n        assert!(salvage_app_settings(&serde_json::json!(\"text\")).is_none());\n        assert!(salvage_app_settings(&serde_json::json!({})).is_some());\n    }\n\n    #[test]\n    fn appearance_without_font_size_defaults_to_medium() {\n        let bytes = br#\"{\n            \"formatVersion\": 1,\n            \"kind\": \"mycode-app-settings\",\n            \"revision\": 2,\n            \"appearance\": { \"theme\": \"dark\", \"language\": \"zh\" }\n        }\"#;\n        let parsed = decode_settings(bytes).expect(\"settings without fontSize\");\n        assert_eq!(parsed.settings.appearance.font_size, \"m\");\n        assert_eq!(parsed.settings.effective_font_size(), \"m\");\n        assert_eq!(parsed.settings.appearance.language, \"zh\");\n    }\n\n    #[test]\n    fn font_size_round_trips_through_the_settings_document() {\n        let mut settings = AppSettings::default();\n        settings.appearance.font_size = \"xl\".to_owned();\n        assert!(settings.validate().is_ok());\n        let revision = AuthorityRevision::new(4).expect(\"revision\");\n        let bytes = encode_settings(revision, &settings).expect(\"encode\");\n        let parsed = decode_settings(&bytes).expect(\"decode\");\n        assert_eq!(parsed.settings.appearance.font_size, \"xl\");\n        assert_eq!(parsed.settings.effective_font_size(), \"xl\");\n        assert!(bytes.windows(10).any(|window| window == br#\"\"fontSize\"\"#));\n\n        settings.appearance.font_size = \"huge\".to_owned();\n        let error = settings.validate().expect_err(\"unknown size\");\n        assert!(error.summary().contains(\"fontSize\"), \"{}\", error.summary());\n    }\n\n    #[test]\n    fn appearance_round_trips_through_read_and_replace() {\n        let parent = std::env::temp_dir().join(format!(\n            \"mycode-appearance-{}-{}\",\n            std::process::id(),\n            crate::unix_now().as_nanos()\n        ));\n        std::fs::create_dir_all(&parent).expect(\"temp parent\");\n        let guard = TempDir(parent);\n        let root = guard.0.join(\"home\");\n        std::fs::create_dir(&root).expect(\"home\");\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            std::fs::set_permissions(&root, std::fs::Permissions::from_mode(0o700))\n                .expect(\"private home\");\n        }\n        let home = crate::HomeLayout::from_root(&root).expect(\"layout\");\n\n        let mut settings = AppSettings::default();\n        settings.appearance.font_size = \"l\".to_owned();\n        let revision =\n            super::replace_app_settings(&home, crate::AuthorityRevision::ABSENT, &settings)\n                .expect(\"publish\");\n\n        let loaded = super::read_app_settings(&home).expect(\"read\");\n        assert_eq!(loaded.appearance.font_size, \"l\");\n        settings.appearance.theme = \"light\".to_owned();\n        assert!(settings.validate().is_ok());\n        assert_eq!(settings.effective_theme(), \"light\");\n        settings.appearance.theme = \"sepia\".to_owned();\n        let error = settings.validate().expect_err(\"unknown theme\");\n        assert!(\n            error.summary().contains(\"appearance.theme\"),\n            \"{}\",\n            error.summary()\n        );\n        settings.appearance.theme = \"dark\".to_owned();\n\n        assert_eq!(loaded.effective_font_size(), \"l\");\n\n        let bytes = std::fs::read(home.root().join(\"settings.json\")).expect(\"settings.json\");\n        let text = String::from_utf8(bytes).expect(\"utf-8\");\n        assert!(!text.contains(\"palette\"), \"{text}\");\n        assert!(text.contains(\"\\\"fontSize\\\": \\\"l\\\"\"), \"{text}\");\n        assert!(!text.contains(\"fontFamily\"), \"{text}\");\n\n        settings.appearance.font_size = \"m\".to_owned();\n        super::replace_app_settings(&home, revision, &settings).expect(\"publish medium\");\n        let restored = super::read_app_settings(&home).expect(\"read medium\");\n        assert_eq!(restored.appearance.font_size, \"m\");\n    }\n\n    #[test]\n    fn a_malformed_settings_document_is_reset_and_healthy_fields_survive() {\n        let parent = std::env::temp_dir().join(format!(\n            \"mycode-settings-comma-{}-{}\",\n            std::process::id(),\n            crate::unix_now().as_nanos()\n        ));\n        std::fs::create_dir_all(&parent).expect(\"temp parent\");\n        let guard = TempDir(parent);\n        let root = guard.0.join(\"home\");\n        std::fs::create_dir(&root).expect(\"home\");\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            std::fs::set_permissions(&root, std::fs::Permissions::from_mode(0o700))\n                .expect(\"private home\");\n        }\n        let home = crate::HomeLayout::from_root(&root).expect(\"layout\");\n        // Valid JSON carrying a removed field: the strict read rejects the\n        // file, the bytes move aside, and the repair keeps what still\n        // decodes and validates.\n        let body = br#\"{\n            \"formatVersion\": 1,\n            \"kind\": \"mycode-app-settings\",\n            \"revision\": 9,\n            \"appearance\": { \"theme\": \"light\", \"language\": \"zh\" },\n            \"tools\": { \"shell\": { \"kind\": \"pwsh\" } }\n        }\"#;\n        // The fixture goes through the secure transaction: a plain fs::write\n        // file inherits the temp directory's DACL and the Windows read path\n        // rejects it before the revision check this test exercises.\n        crate::write_owned_test_bytes(&home, \"settings.json\", body).expect(\"write\");\n        let (settings, repair) = super::read_app_settings_with_repair(&home).expect(\"read resets\");\n        assert_eq!(settings.appearance.theme, \"light\");\n        assert_eq!(settings.appearance.language, \"zh\");\n        let repair = repair.expect(\"repair reported\");\n        let backup = std::fs::read(home.root().join(&repair.backup)).expect(\"backup\");\n        assert!(\n            backup.windows(5).any(|window| window == b\"tools\"),\n            \"{backup:?}\"\n        );\n        // The republished document is canonical and parses cleanly.\n        assert!(super::read_app_settings(&home).is_ok());\n    }\n\n    struct TempDir(std::path::PathBuf);\n\n    impl Drop for TempDir {\n        fn drop(&mut self) {\n            let _ = std::fs::remove_dir_all(&self.0);\n        }\n    }\n}\n","crates/mycode-config/src/home.rs":"//! Defines the relocatable, lexical MYCode home layout.\n//!\n//! [`HomeLayout`] resolves an absolute owned root from explicit or process\n//! environment values. Resolution and path construction perform no filesystem\n//! I/O, never canonicalize or follow links, and do not depend on the current\n//! directory.\n\nuse std::ffi::{OsStr, OsString};\nuse std::path::{Component, Path, PathBuf};\n\nuse crate::{ConfigError, ConfigErrorKind};\n\n/// Names the environment variable that relocates the entire owned home tree.\nconst MYCODE_HOME_ENV: &str = \"MYCODE_HOME\";\n\n/// Names the lowercase product directory under a user home.\npub(crate) const MYCODE_DIR_NAME: &str = \".mycode\";\n/// Durable session ledgers and compaction checkpoints.\npub const SESSIONS_DIR: &str = \"sessions\";\n/// Tool working directory when no project folder is bound.\npub const SCRATCH_DIR: &str = \"scratch\";\n\n/// Project folder name for sessions that have no project.\npub const NO_PROJECT_DIR: &str = \"no-project\";\n/// Longest project folder name before it is shortened and hashed.\nconst MAX_PROJECT_KEY_CHARS: usize = 96;\n\n/// Folder name that groups one project's sessions under `sessions/`.\n///\n/// The project path is spelled with every character other than ASCII\n/// letters, digits, `-`, and `_` turned into `-`, so `D:\\work\\app` becomes\n/// `D--work-app`. A name longer than [`MAX_PROJECT_KEY_CHARS`] keeps its\n/// tail (the most specific part) behind a hash of the whole path.\n#[must_use]\npub fn project_dir_key(project: Option<&str>) -> String {\n    let Some(project) = project\n        .map(|path| path.trim().trim_end_matches(['/', '\\\\']))\n        .filter(|path| !path.is_empty())\n    else {\n        return NO_PROJECT_DIR.to_owned();\n    };\n    let key: String = project\n        .chars()\n        .map(|ch| {\n            if ch.is_ascii_alphanumeric() || ch == '-' || ch == '_' {\n                ch\n            } else {\n                '-'\n            }\n        })\n        .collect();\n    if key.len() <= MAX_PROJECT_KEY_CHARS {\n        return key;\n    }\n    use std::hash::{Hash, Hasher};\n    let mut hasher = std::collections::hash_map::DefaultHasher::new();\n    project.hash(&mut hasher);\n    let tail = &key[key.len() - (MAX_PROJECT_KEY_CHARS - 9)..];\n    format!(\"{:08x}-{tail}\", hasher.finish() as u32)\n}\n\n/// Relative owned path of a new session directory:\n/// `sessions/<project key>/<session id>`.\n///\n/// # Errors\n///\n/// Returns [`ConfigErrorKind::AuthorityValidation`] when `session_id` is not\n/// one safe path component.\npub fn new_session_dir(project: Option<&str>, session_id: &str) -> Result<String, ConfigError> {\n    if !is_safe_path_component(OsStr::new(session_id)) {\n        return Err(ConfigError::authority_rejection());\n    }\n    Ok(format!(\n        \"{SESSIONS_DIR}/{}/{session_id}\",\n        project_dir_key(project)\n    ))\n}\n\n/// Finds the directory of an existing session: the one project folder under\n/// `sessions/` that holds a `<session id>` directory. The folder is never\n/// derived from the session's current project, since a chat can move to\n/// another folder after it was created; the directory stays where it began.\n///\n/// # Errors\n///\n/// Returns [`ConfigErrorKind::AuthorityValidation`] for an unsafe id and\n/// [`ConfigErrorKind::Io`] when `sessions/` cannot be listed.\npub fn locate_session_dir(\n    home: &HomeLayout,\n    session_id: &str,\n) -> Result<Option<String>, ConfigError> {\n    if !is_safe_path_component(OsStr::new(session_id)) {\n        return Err(ConfigError::authority_rejection());\n    }\n    let root = home.owned_join(SESSIONS_DIR)?;\n    let entries = match std::fs::read_dir(&root) {\n        Ok(entries) => entries,\n        Err(error) if error.kind() == std::io::ErrorKind::NotFound => return Ok(None),\n        Err(_) => return Err(ConfigError::for_path(ConfigErrorKind::Io, &root)),\n    };\n    for entry in entries.flatten() {\n        if !entry.file_type().is_ok_and(|kind| kind.is_dir()) {\n            continue;\n        }\n        let name = entry.file_name();\n        let Some(project) = name.to_str().filter(|_| is_safe_path_component(&name)) else {\n            continue;\n        };\n        let found = std::fs::symlink_metadata(entry.path().join(session_id))\n            .is_ok_and(|meta| meta.is_dir());\n        if found {\n            return Ok(Some(format!(\"{SESSIONS_DIR}/{project}/{session_id}\")));\n        }\n    }\n    Ok(None)\n}\n\n/// Relative owned path of one file inside an existing session directory;\n/// `None` when the session has no directory.\n///\n/// # Errors\n///\n/// As [`locate_session_dir`], plus [`ConfigErrorKind::AuthorityValidation`]\n/// when `file` is not one safe path component.\npub(crate) fn session_file(\n    home: &HomeLayout,\n    session_id: &str,\n    file: &str,\n) -> Result<Option<String>, ConfigError> {\n    if !is_safe_path_component(OsStr::new(file)) {\n        return Err(ConfigError::authority_rejection());\n    }\n    Ok(locate_session_dir(home, session_id)?.map(|dir| format!(\"{dir}/{file}\")))\n}\n\n/// Contains caller-supplied values used to resolve the owned home.\n#[derive(Debug, Clone, Default)]\npub struct HomeEnv {\n    /// Overrides the entire owned home when nonempty.\n    pub mycode_home: Option<OsString>,\n    /// Supplies the user home when the override is empty or absent.\n    pub home: Option<OsString>,\n    /// Supplies the Windows-only fallback when `HOME` is empty or absent.\n    ///\n    /// Non-Windows resolution never consumes this value.\n    pub user_profile: Option<OsString>,\n}\n\nimpl HomeEnv {\n    /// Reads home-resolution values from the current process.\n    #[must_use]\n    pub fn from_process() -> Self {\n        Self {\n            mycode_home: std::env::var_os(MYCODE_HOME_ENV),\n            home: std::env::var_os(\"HOME\"),\n            user_profile: {\n                #[cfg(windows)]\n                {\n                    std::env::var_os(\"USERPROFILE\")\n                }\n                #[cfg(not(windows))]\n                {\n                    None\n                }\n            },\n        }\n    }\n}\n\n/// Constructs paths in one relocatable MYCode home.\n///\n/// Every returned path is rooted below [`Self::root`]. The lowercase `.mycode`\n/// directory is appended only when resolution uses a user home; `MYCODE_HOME`\n/// replaces the root entirely. Path accessor methods construct paths without\n/// creating or opening any filesystem object.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct HomeLayout {\n    root: PathBuf,\n}\n\nimpl HomeLayout {\n    /// Resolves the owned home from explicit environment values.\n    ///\n    /// Empty values are ignored. A nonempty `MYCODE_HOME` completely replaces\n    /// all fallback values. Otherwise `HOME` is used, with `USERPROFILE` as a\n    /// Windows-only fallback. An invalid higher-priority value fails closed.\n    /// Resolution remains lexical even when the selected path is absent,\n    /// inaccessible, or names a link.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`ConfigErrorKind::InvalidHome`] when the selected value is not\n    /// an absolute, normalized, well-formed owned home.\n    pub fn from_env(env: HomeEnv) -> Result<Self, ConfigError> {\n        if let Some(root) = nonempty(env.mycode_home) {\n            return Self::from_root(root);\n        }\n\n        let user_home = nonempty(env.home);\n        #[cfg(windows)]\n        let user_home = user_home.or_else(|| nonempty(env.user_profile));\n\n        let Some(user_home) = user_home else {\n            return Err(ConfigError::new(ConfigErrorKind::InvalidHome));\n        };\n        let user_home = match normalize_absolute_root(PathBuf::from(user_home)) {\n            Ok(path) => path,\n            Err(path) => return Err(invalid_home_path(&path)),\n        };\n        let root = user_home.join(MYCODE_DIR_NAME);\n        Ok(Self { root })\n    }\n\n    /// Creates a layout from an already-resolved owned root.\n    ///\n    /// This operation is purely lexical and does not canonicalize or follow\n    /// links. The stored path is absolute and separator-normalized.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`ConfigErrorKind::InvalidHome`] when `root` is relative, is a\n    /// filesystem, drive, or share root, has no normal component, contains a\n    /// parent component, or has an unsafe platform root or component.\n    pub fn from_root(root: impl Into<PathBuf>) -> Result<Self, ConfigError> {\n        match normalize_absolute_root(root.into()) {\n            Ok(root)\n                if root\n                    .components()\n                    .any(|component| matches!(component, Component::Normal(_))) =>\n            {\n                Ok(Self { root })\n            }\n            Ok(root) | Err(root) => Err(invalid_home_path(&root)),\n        }\n    }\n\n    /// Returns the owned home root.\n    #[must_use]\n    pub fn root(&self) -> &Path {\n        &self.root\n    }\n\n    /// Joins a controlled relative path below the owned root.\n    ///\n    /// Every component must be portable across supported platforms. Empty\n    /// components, absolute paths, prefixes, traversal, and unsafe Windows\n    /// aliases are rejected.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`ConfigErrorKind::PathEscape`] when any component is unsafe.\n    pub fn owned_join(&self, relative: impl AsRef<Path>) -> Result<PathBuf, ConfigError> {\n        let Some(relative) = relative.as_ref().to_str() else {\n            return Err(ConfigError::new(ConfigErrorKind::PathEscape));\n        };\n        if relative.is_empty() {\n            return Err(ConfigError::new(ConfigErrorKind::PathEscape));\n        }\n\n        let mut joined = self.root.clone();\n        for component in relative.split(['/', '\\\\']) {\n            validate_path_component(OsStr::new(component))?;\n            joined.push(component);\n        }\n        Ok(joined)\n    }\n}\n\nfn nonempty(value: Option<OsString>) -> Option<OsString> {\n    value.filter(|value| !value.is_empty())\n}\n\nfn invalid_home_path(path: &Path) -> ConfigError {\n    ConfigError::for_path(ConfigErrorKind::InvalidHome, path)\n}\n\nfn normalize_absolute_root(root: PathBuf) -> Result<PathBuf, PathBuf> {\n    if !root.is_absolute() || has_parent(&root) || !has_well_formed_platform_root(&root) {\n        return Err(root);\n    }\n    Ok(root.components().collect())\n}\n\nfn has_parent(path: &Path) -> bool {\n    path.components()\n        .any(|component| matches!(component, Component::ParentDir))\n}\n\nfn has_well_formed_platform_root(path: &Path) -> bool {\n    #[cfg(windows)]\n    {\n        windows_drive_unc_or_verbatim_root(path)\n    }\n    #[cfg(not(windows))]\n    {\n        matches!(path.components().next(), Some(Component::RootDir))\n    }\n}\n\n#[cfg(windows)]\nfn windows_drive_unc_or_verbatim_root(path: &Path) -> bool {\n    use std::path::Prefix;\n\n    let mut components = path.components();\n    let Some(Component::Prefix(prefix)) = components.next() else {\n        return false;\n    };\n    if !matches!(components.next(), Some(Component::RootDir)) {\n        return false;\n    }\n\n    let prefix_is_safe = match prefix.kind() {\n        Prefix::Disk(_) | Prefix::VerbatimDisk(_) => true,\n        Prefix::UNC(server, share) | Prefix::VerbatimUNC(server, share) => {\n            is_safe_path_component(server) && is_safe_path_component(share)\n        }\n        Prefix::Verbatim(_) | Prefix::DeviceNS(_) => false,\n    };\n    prefix_is_safe\n        && components.all(|component| match component {\n            Component::Normal(name) => is_safe_path_component(name),\n            Component::CurDir\n            | Component::ParentDir\n            | Component::RootDir\n            | Component::Prefix(_) => false,\n        })\n}\n\npub(crate) fn is_valid_portable_id(value: &str) -> bool {\n    let bytes = value.as_bytes();\n    let Some((&first, rest)) = bytes.split_first() else {\n        return false;\n    };\n    bytes.len() <= 128\n        && first.is_ascii_lowercase()\n        && rest\n            .iter()\n            .all(|byte| byte.is_ascii_lowercase() || byte.is_ascii_digit() || b\"._-\".contains(byte))\n        && bytes\n            .last()\n            .is_some_and(|byte| byte.is_ascii_alphanumeric())\n        && is_safe_path_component(OsStr::new(value))\n}\n\n/// Reports whether a value is a usable subagent role name.\n///\n/// Role names reach the filesystem as `<name>.md` and the model as the `agent`\n/// tool argument, so they use the portable-id grammar with a shorter bound\n/// that keeps routing lines single-line.\n#[must_use]\npub(crate) fn is_portable_role_name(value: &str) -> bool {\n    value.len() <= 64 && is_valid_portable_id(value)\n}\n\npub(crate) fn validate_path_component(name: &OsStr) -> Result<(), ConfigError> {\n    if !is_safe_path_component(name) {\n        return Err(ConfigError::new(ConfigErrorKind::PathEscape));\n    }\n    Ok(())\n}\n\nfn is_safe_path_component(name: &OsStr) -> bool {\n    if name.is_empty() || name == \".\" || name == \"..\" {\n        return false;\n    }\n    let Some(text) = name.to_str() else {\n        return false;\n    };\n    !text.contains(['/', '\\\\', '\\0', ':', '*', '?', '\"', '<', '>', '|'])\n        && !text.chars().any(char::is_control)\n        && !text.ends_with('.')\n        && !text.ends_with(' ')\n        && !is_windows_device_name(text)\n}\n\nfn is_windows_device_name(name: &str) -> bool {\n    // Windows strips trailing dots and spaces before reserved-device matching.\n    let stripped = name.trim_end_matches([' ', '.']);\n    if stripped.is_empty() {\n        return false;\n    }\n    let basename = stripped.split('.').next().unwrap_or(stripped);\n    [\"con\", \"prn\", \"aux\", \"nul\", \"conin$\", \"conout$\", \"clock$\"]\n        .iter()\n        .any(|reserved| basename.eq_ignore_ascii_case(reserved))\n        || is_com_or_lpt_device(basename)\n}\n\nfn is_com_or_lpt_device(basename: &str) -> bool {\n    let Some((prefix, unit)) = split_ascii_prefix(basename, 3) else {\n        return false;\n    };\n    (prefix.eq_ignore_ascii_case(\"com\") || prefix.eq_ignore_ascii_case(\"lpt\"))\n        && matches_dos_device_unit(unit)\n}\n\nfn split_ascii_prefix(value: &str, prefix_len: usize) -> Option<(&str, &str)> {\n    (value.len() >= prefix_len && value.is_char_boundary(prefix_len))\n        .then(|| value.split_at(prefix_len))\n}\n\nfn matches_dos_device_unit(unit: &str) -> bool {\n    matches!(unit, \"1\" | \"2\" | \"3\" | \"4\" | \"5\" | \"6\" | \"7\" | \"8\" | \"9\")\n        || unit == \"\\u{00B9}\"\n        || unit == \"\\u{00B2}\"\n        || unit == \"\\u{00B3}\"\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{NO_PROJECT_DIR, new_session_dir, project_dir_key};\n\n    #[test]\n    fn a_project_folder_name_spells_its_path() {\n        assert_eq!(project_dir_key(Some(r\"D:\\my_pro\\MCode\")), \"D--my_pro-MCode\");\n        assert_eq!(project_dir_key(Some(\"/home/me/app/\")), \"-home-me-app\");\n        assert_eq!(project_dir_key(Some(\"  \")), NO_PROJECT_DIR);\n        assert_eq!(project_dir_key(None), NO_PROJECT_DIR);\n        let deep = format!(\"/{}\", \"segment/\".repeat(40));\n        let key = project_dir_key(Some(&deep));\n        assert!(key.len() <= super::MAX_PROJECT_KEY_CHARS, \"{key}\");\n        assert!(key.ends_with(\"-segment-segment\"), \"{key}\");\n        assert_ne!(key, project_dir_key(Some(&format!(\"/x{deep}\"))));\n        assert_eq!(\n            new_session_dir(Some(\"/srv/app\"), \"sess-1\").expect(\"dir\"),\n            \"sessions/-srv-app/sess-1\"\n        );\n        assert!(new_session_dir(None, \"../escape\").is_err());\n    }\n}\n","crates/mycode-app/src/turn.rs":"//! One model turn: provider resolution, the tool registry, and per-turn\n//! setup. The submodules hold the turn's cancel and steer controls, the\n//! ledger pump, `/compact` and the summary cards, and the system prompt.\n\nmod compact;\nmod control;\nmod prompt;\nmod pump;\n#[cfg(test)]\nmod tests;\n\nuse std::path::PathBuf;\nuse std::sync::Arc;\n\nuse mycode_agent::Message;\nuse mycode_agent::ToolRegistry;\nuse mycode_agent::session::{BranchId, HeadStamp, SessionId};\nuse mycode_agent::{Agent, AgentConfig, HookRunner};\nuse mycode_agent::{AppSettings, ProviderSettings};\nuse mycode_agent::{ReqwestTransport, ResolvedProvider, SseTransport, WireProvider};\n\nuse crate::BridgeEvent;\nuse crate::ledger::{HeadWriter, branch_head, head_spelling, ledger_history, render_error};\nuse crate::protocol::CHAT_CANCELLED;\nuse crate::state::{CoreState, model_context_window, model_output_limit};\nuse crate::tool_hosts::BridgeAskChannel;\n\npub(crate) use self::compact::manual_compact;\nuse self::compact::{DeferredSummaries, publish_visible_summary};\nuse self::control::TurnControl;\nuse self::prompt::session_system_prompt;\npub(crate) use self::prompt::{\n    os_user_home, push_scratch_note, push_workspace_skills, split_scratch_root,\n    workspace_extra_roots,\n};\n\n/// One model turn: resolve the provider, stream the reply into the event\n/// channel, and commit the assistant message to the session ledger.\n///\n/// The turn's cancel token and steer inbox are published before the returned\n/// future is first polled. Setup (credentials, MCP connect, pre-turn\n/// compaction) can take a long time, and a cancel or a second turn for the\n/// same session must reach this one during it.\n#[allow(clippy::too_many_arguments)]\npub(crate) fn chat_turn(\n    state: Arc<CoreState>,\n    events: crate::BridgeEventTx,\n    session: SessionId,\n    branch: BranchId,\n    provider_id: String,\n    model: String,\n    reasoning: Option<String>,\n) -> impl std::future::Future<Output = ()> + Send + 'static {\n    let session_id = session.as_str().to_owned();\n    let mut control = TurnControl::register(&state, &session_id);\n    async move {\n        let cwd = state.project_dir(&session_id);\n        let (head_session, head_branch) = (session.clone(), branch.clone());\n        let outcome = run_chat_turn(\n            &state,\n            &events,\n            &session_id,\n            session,\n            branch,\n            &provider_id,\n            &model,\n            reasoning.as_deref(),\n            cwd,\n            &control,\n        )\n        .await;\n        let _ = end_turn(\n            &state,\n            &events,\n            &session_id,\n            &head_session,\n            &head_branch,\n            &mut control,\n            outcome,\n        )\n        .await;\n    }\n}\n\n/// Reports how a turn ended: its terminal event, then any steer the agent\n/// never sent. Both go out after [`TurnControl::retire`], so a session the\n/// UI reopens on hearing the end no longer lists this turn as running.\n///\n/// `outcome` is the terminal the pump returned, or why the turn failed\n/// before the pump ran. Returns `outcome` without the event, for tests.\nasync fn end_turn(\n    state: &CoreState,\n    events: &crate::BridgeEventTx,\n    session_id: &str,\n    session: &SessionId,\n    branch: &BranchId,\n    control: &mut TurnControl,\n    outcome: Result<BridgeEvent, String>,\n) -> Result<(), String> {\n    let (terminal, reported) = match outcome {\n        Ok(terminal) => (terminal, Ok(())),\n        Err(message) => {\n            // A cancel that lands during setup surfaces as setup failing;\n            // report it as the quiet cancel the desktop expects.\n            let shown = if control.cancel.is_cancelled() {\n                CHAT_CANCELLED.to_owned()\n            } else {\n                message.clone()\n            };\n            // Setup can already have written: a pre-turn compaction card\n            // lands before a cancel is noticed. Report the durable head so\n            // the UI's next history page, recall, or `/compact` does not\n            // fail the moved-head check against its own summary row.\n            let head = branch_head(&state.service, session, branch)\n                .await\n                .map(|head| head_spelling(&head))\n                .unwrap_or_default();\n            let terminal = BridgeEvent::ChatFailed {\n                session_id: session_id.to_owned(),\n                message: shown,\n                head,\n            };\n            (terminal, Err(message))\n        }\n    };\n    // A steer accepted after the agent's last drain was never sent.\n    // Hand it back instead of dropping it with the inbox.\n    let texts = control.retire();\n    let _ = events.send(terminal);\n    if !texts.is_empty() {\n        let _ = events.send(BridgeEvent::SteersReturned {\n            session_id: session_id.to_owned(),\n            texts,\n        });\n    }\n    reported\n}\n\n/// Reads the magpie binding and the provider row one turn runs on.\n///\n/// The row's model list is the gateway's published list, so a session pin\n/// and the model magpie picked both resolve through the same check.\npub(crate) async fn turn_credentials(\n    state: &CoreState,\n    provider_id: &str,\n) -> Result<(AppSettings, ProviderSettings, String), String> {\n    if provider_id != mycode_agent::MAGPIE_PROVIDER_ID {\n        return Err(format!(\n            \"provider '{provider_id}' is not the magpie gateway\"\n        ));\n    }\n    let settings = crate::magpie::load_settings(&state.home).await?;\n    let provider = crate::magpie::provider_row(&settings.magpie, &state.models())\n        .ok_or_else(|| \"magpie is not connected: pick a model in magpie first\".to_owned())?;\n    let key = settings.magpie.api_key.clone();\n    Ok((settings, provider, key))\n}\n#[allow(clippy::too_many_arguments)]\nasync fn run_chat_turn(\n    state: &CoreState,\n    events: &crate::BridgeEventTx,\n    session_id: &str,\n    session: SessionId,\n    branch: BranchId,\n    provider_id: &str,\n    model: &str,\n    reasoning: Option<&str>,\n    cwd: PathBuf,\n    control: &TurnControl,\n) -> Result<BridgeEvent, String> {\n    let (settings, provider, bearer) = control\n        .unless_cancelled(turn_credentials(state, provider_id))\n        .await??;\n    control.check()?;\n    let resolved = ResolvedProvider::resolve(\n        &provider,\n        model,\n        &bearer,\n        &crate::user_agent::default_user_agent(),\n    )\n    .map_err(|error| format!(\"provider setup failed: {error}\"))?;\n    let transport: Arc<dyn SseTransport> = Arc::new(\n        ReqwestTransport::new().map_err(|error| format!(\"HTTP transport unavailable: {error}\"))?,\n    );\n    run_chat_turn_on(\n        state, events, session_id, session, branch, model, reasoning, cwd, resolved, settings,\n        provider, transport, control,\n    )\n    .await\n}\n\n/// Runs one prepared turn on `transport` and returns its terminal event\n/// unsent; [`end_turn`] reports it. Tests pass a scripted transport;\n/// production uses [`ReqwestTransport`].\n#[allow(clippy::too_many_arguments)]\nasync fn run_chat_turn_on(\n    state: &CoreState,\n    events: &crate::BridgeEventTx,\n    session_id: &str,\n    session: SessionId,\n    branch: BranchId,\n    model: &str,\n    reasoning: Option<&str>,\n    cwd: PathBuf,\n    resolved: ResolvedProvider,\n    settings: AppSettings,\n    provider: ProviderSettings,\n    transport: Arc<dyn SseTransport>,\n    control: &TurnControl,\n) -> Result<BridgeEvent, String> {\n    let home = &state.home;\n    let wire = WireProvider::new(resolved.clone(), transport);\n\n    // The tool working directory is the bound project (created on demand).\n    let cwd_for_mkdir = cwd.clone();\n    tokio::task::spawn_blocking(move || std::fs::create_dir_all(&cwd_for_mkdir))\n        .await\n        .map_err(|error| format!(\"workspace dir task: {error}\"))?\n        .map_err(|error| format!(\"workspace dir: {error}\"))?;\n    // Replay history is rebuilt from the ledger's typed events: display\n    // entries flatten tool traffic into text, which breaks the\n    // tool_use/tool_result pairing providers validate.\n    // Follow the durable tip when the desktop snapshot is behind. A stale\n    // expected head otherwise surfaces as \"the session moved on\". A missing\n    // session or branch fails here instead of waiting until the first write.\n    let expected_head = control\n        .unless_cancelled(branch_head(&state.service, &session, &branch))\n        .await?\n        .map_err(render_error)?;\n    let history = control\n        .unless_cancelled(ledger_history(\n            &state.service,\n            &session,\n            &branch,\n            &expected_head,\n        ))\n        .await?\n        .map_err(render_error)?;\n    // The prompt is the latest user message. A trailing assistant or tool\n    // result (an interrupted turn, or a write that landed after the user\n    // message) would fail the turn and leave the session unable to send, so\n    // those suffix messages stay in the ledger and are omitted from this\n    // request. Checked before MCP connects.\n    let (history, prompt) = split_latest_user(history)?;\n    let usage_model = model.to_owned();\n    let head_stamp_text = head_spelling(&expected_head);\n    let writer = HeadWriter::new(\n        state.service.clone(),\n        session.clone(),\n        branch.clone(),\n        expected_head,\n    );\n    // MCP servers connect here (spawn + handshake + tools/list): awaited on\n    // the spawned turn task, so command processing never blocks. A server\n    // that fails to connect is skipped, never a failed turn. Stdio servers\n    // are spawned kill-on-drop, so a cancel may abandon a slow handshake.\n    let (mcp_tools, mcp_warning) = control\n        .unless_cancelled(crate::mcp_tools::connect_mcp_tools(\n            home,\n            &settings,\n            &state.mcp_pool,\n            Some(&cwd),\n        ))\n        .await?;\n    // Keep role discovery and workspace extra-root reads off the single\n    // core runtime thread.\n    let (role_catalog, extra_roots) = {\n        let home = home.clone();\n        let cwd = cwd.clone();\n        tokio::task::spawn_blocking(move || {\n            (\n                mycode_agent::discover_roles(&home, Some(&cwd)),\n                workspace_extra_roots(&home, &cwd),\n            )\n        })\n        .await\n        .map_err(|error| format!(\"workspace setup task: {error}\"))?\n    };\n    let registry = Arc::new({\n        let registry = ToolRegistry::new();\n        mycode_agent::register_builtins(&registry);\n        // ask_user rides the same registry; its channel forwards questions\n        // to the UI over the event channel and waits on the shared router.\n        let channel: Arc<dyn mycode_agent::builtin::AskChannel> = Arc::new(BridgeAskChannel {\n            session_id: session_id.to_owned(),\n            events: events.clone(),\n        });\n        registry.register(Arc::new(mycode_agent::builtin::AskTool::new(channel)));\n        // `agent` delegates scoped work to a catalog role; slots, isolation,\n        // and per-role model routes live in the host.\n        if crate::subagent::any_role_enabled(&role_catalog, &settings.subagents) {\n            registry.register(Arc::new(mycode_agent::builtin::AgentTool::new(Arc::new(\n                crate::subagent::BridgeAgentHost::new(\n                    resolved.clone(),\n                    home.clone(),\n                    cwd.clone(),\n                    &settings,\n                    session_id.to_owned(),\n                    state.subagent_cancels.clone(),\n                    state.mcp_pool.clone(),\n                )\n                .with_context(\n                    Arc::clone(&state.catalog),\n                    provider.clone(),\n                    model.to_owned(),\n                ),\n            ))));\n        }\n        registry\n    });\n    let mcp_catalog = crate::mcp_tools::register_mcp_tools(&registry, mcp_tools, mcp_warning);\n\n    // Owned for the compaction hook and the cancel registration.\n    let session_id = session_id.to_owned();\n\n    let context_window = model_context_window(state, &provider, model);\n    let user_home = os_user_home();\n    let read_roots = mycode_agent::skill_read_roots(user_home.as_deref(), Some(home.root()));\n    let directive = crate::subagent::delegation_directive(&role_catalog, &settings.subagents);\n    let mcp_note = mcp_catalog.as_ref().map(|catalog| catalog.prompt_note());\n    let system_prompt = {\n        let home = home.clone();\n        let cwd = cwd.clone();\n        let registry = Arc::clone(&registry);\n        let extra_roots = extra_roots.clone();\n        let user_home = user_home.clone();\n        let skill_settings = settings.skills.clone();\n        tokio::task::spawn_blocking(move || {\n            session_system_prompt(\n                &home,\n                &cwd,\n                &registry,\n                mcp_note.as_deref(),\n                &extra_roots,\n                &directive,\n                user_home.as_deref(),\n                &skill_settings,\n            )\n        })\n        .await\n        .map_err(|error| format!(\"system prompt task: {error}\"))?\n    };\n    let overhead_tokens = crate::compaction::estimate_prefix_tokens(\n        std::slice::from_ref(&system_prompt),\n        &registry.specs(),\n    );\n    let calibration = crate::compaction::Calibration::new(state.token_scale(&session_id));\n    // Codex-style checkpoint: 90% of the usable window, a tail sized to the\n    // window. This pre-turn pass publishes its transcript card immediately. The\n    // before-request hook later in this function does not append a ledger\n    // row; its card is published after the turn's tool results and final\n    // reply commit, so a mid-turn summary cannot split a tool call from its\n    // result.\n    let compact_scope = crate::compaction::CompactScope {\n        wire: &wire,\n        model,\n        checkpoint: Some(crate::compaction::CheckpointSlot {\n            home,\n            session_id: &session_id,\n            branch_id: branch.as_str(),\n            head: &head_stamp_text,\n        }),\n        context_window,\n        overhead_tokens,\n        // Nothing of this turn is measured yet; the scale is the one the\n        // session's last turn measured.\n        measure: crate::compaction::Measure {\n            scale: calibration.scale(),\n            tokens: None,\n        },\n        // No agent bus yet; nothing else of this turn is on the wire.\n        on_summarize: Some(&|active| {\n            let _ = events.send(BridgeEvent::ContextCompacting {\n                session_id: session_id.clone(),\n                active,\n            });\n        }),\n        cancel: &control.cancel,\n    };\n    let compacted = crate::compaction::compact_history(\n        &compact_scope,\n        history,\n        crate::compaction::CompactMode::Auto,\n    )\n    .await;\n    // A written checkpoint is already on disk, so its card is published\n    // before the post-compaction cancel check.\n    if let Some(summary) = compacted.summary.as_deref() {\n        let _ = publish_visible_summary(&writer, events, &session_id, summary, true).await;\n    }\n    control.check()?;\n    let history = compacted.messages;\n\n    // Grok Build call pattern: a short index, then the model loads the\n    // body or schema itself. Full skill text and MCP schemas stay off this\n    // prompt. Skill order and extra-root order are sorted so two turns share\n    // a byte-identical prefix. The prompt was built above so compaction can\n    // count it.\n\n    let turn_started = std::time::Instant::now();\n    let (agent_tx, agent_rx) = tokio::sync::broadcast::channel(256);\n    let deferred = DeferredSummaries::default();\n    // Built in a block so no clone of the agent bus outlives the hooks: a\n    // cancel inside the first request's hook ends the prompt without\n    // TurnEnded, and the pump then stops only when the bus closes.\n    let hooks = {\n        let compactor = crate::compaction::RequestCompactor {\n            wire: wire.clone(),\n            model: model.to_owned(),\n            checkpoint: Some(crate::compaction::CheckpointKey {\n                home: home.clone(),\n                session_id: session_id.clone(),\n                branch_id: branch.as_str().to_owned(),\n                head: head_stamp_text.clone(),\n            }),\n            context_window,\n            calibration: calibration.clone(),\n            on_summarize: Some({\n                let bus = agent_tx.clone();\n                Arc::new(move |active| {\n                    let _ = bus.send(mycode_agent::events::AgentEvent::Compacting(active));\n                })\n            }),\n            cancel: control.cancel.clone(),\n        };\n        let deferred = deferred.clone();\n        let bus = agent_tx.clone();\n        // Stash only. A ledger append here sits between this turn's tool\n        // calls and their results. Bus order: the previous response is\n        // already queued, and this request's deltas come after. The pump\n        // turns CacheDisrupted into PromptCacheWatch, so the warning\n        // attaches to the prompt that actually lost the prefix.\n        let compact_request = move |mode: crate::compaction::CompactMode| {\n            let compactor = compactor.clone();\n            let deferred = deferred.clone();\n            let bus = bus.clone();\n            move |mut request: mycode_agent::Request| {\n                let compactor = compactor.clone();\n                let deferred = deferred.clone();\n                let bus = bus.clone();\n                async move {\n                    let summary = compactor.compact(&mut request, mode).await;\n                    let summarized = summary.is_some();\n                    if deferred.stash(summary).await {\n                        let _ = bus.send(mycode_agent::events::AgentEvent::CacheDisrupted);\n                    }\n                    (request, summarized)\n                }\n            }\n        };\n        let before_request = compact_request(crate::compaction::CompactMode::Auto);\n        let on_overflow = compact_request(crate::compaction::CompactMode::Overflow);\n        HookRunner::default()\n            .with_before_request(move |request| {\n                let compacted = before_request(request);\n                async move { compacted.await.0 }\n            })\n            .with_context_overflow(move |request| {\n                let compacted = on_overflow(request);\n                async move {\n                    let (request, summarized) = compacted.await;\n                    summarized.then_some(request)\n                }\n            })\n    };\n    let mut config = AgentConfig::new()\n        .with_system_prompt(system_prompt)\n        .with_prompt_cache_key(Some(session_id.clone()))\n        .with_max_output_tokens(model_output_limit(state, &provider, model));\n    if let Some(token) = reasoning {\n        if let Some(level) = mycode_agent::ReasoningLevel::parse(token) {\n            config = config.with_reasoning(level);\n        } else if mycode_agent::is_valid_effort_token(token) {\n            config = config.with_reasoning_token(Some(token.to_owned()));\n        }\n    }\n    let mut agent = Agent::new(config);\n\n    // The ledger pump owns the branch head for the rest of the turn. The\n    // clone shares that head, for the summary filed after the pump drains.\n    let final_head = writer.clone();\n    let pump = tokio::spawn(\n        pump::LedgerPump {\n            events: events.clone(),\n            writer,\n            session_id: session_id.clone(),\n            deferred,\n            cancel: control.cancel.clone(),\n            usage_model,\n            started: turn_started,\n        }\n        .run(agent_rx),\n    );\n\n    agent.seed_history(history);\n    let env = mycode_agent::TurnEnv::new(&wire, &registry, &hooks)\n        .with_cancel(control.cancel.clone())\n        .with_events(agent_tx)\n        .with_cwd(cwd)\n        .with_extra_roots(extra_roots)\n        .with_read_roots(read_roots)\n        .with_steer(Some(Arc::clone(&control.steer)));\n    let prompt_message = Message::User(prompt);\n    let outcome = agent.prompt(prompt_message, &env).await;\n    state.remember_token_scale(&session_id, calibration.scale());\n    // Close the agent bus (the env and the hook each hold a sender) so a\n    // turn that never started reaches the pump as a closed stream instead of\n    // leaving it parked forever.\n    drop(env);\n    drop(hooks);\n    // Drain the pump before returning. An agent error already became the\n    // pump's ChatFailed; returning Err here would report a second one.\n    match pump.await {\n        Ok(terminal) => {\n            // The ledger is complete only once the pump drained, and the\n            // summary is filed before the turn reports its end: the next\n            // turn starts from what this one stored.\n            persist_hook_summary(\n                state,\n                &session,\n                &branch,\n                &final_head.stamp().await,\n                &session_id,\n                model,\n                agent.state().messages(),\n            )\n            .await;\n            Ok(terminal)\n        }\n        Err(error) => {\n            outcome.map_err(|error| format!(\"turn failed: {error}\"))?;\n            Err(format!(\"the turn pump stopped: {error}\"))\n        }\n    }\n}\n\n/// Stores a summary the request hook produced mid-turn, checked against\n/// the ledger at the pump's final `head`; see\n/// [`crate::compaction::persist_turn_summary`]. Best effort, like every\n/// compaction step: a failure keeps the older checkpoint.\nasync fn persist_hook_summary(\n    state: &CoreState,\n    session: &SessionId,\n    branch: &BranchId,\n    head: &HeadStamp,\n    session_id: &str,\n    model: &str,\n    memory: &[Arc<Message>],\n) {\n    // Every turn of a compacted session opens with the stored summary;\n    // only a newer one is worth replaying the ledger for.\n    let unstored = {\n        let home = state.home.clone();\n        let (session_id, branch_id) = (session_id.to_owned(), branch.as_str().to_owned());\n        let first = memory.first().cloned();\n        tokio::task::spawn_blocking(move || {\n            crate::compaction::opens_with_unstored_summary(\n                &home,\n                &session_id,\n                &branch_id,\n                first.as_deref(),\n            )\n        })\n        .await\n        .unwrap_or(false)\n    };\n    if !unstored {\n        return;\n    }\n    let Ok(ledger) = ledger_history(&state.service, session, branch, head).await else {\n        return;\n    };\n    let home = state.home.clone();\n    let memory = memory.to_vec();\n    let (session_id, branch_id, head, model) = (\n        session_id.to_owned(),\n        branch.as_str().to_owned(),\n        head_spelling(head),\n        model.to_owned(),\n    );\n    let _ = tokio::task::spawn_blocking(move || {\n        let target = crate::compaction::TurnCheckpoint {\n            session_id: &session_id,\n            branch_id: &branch_id,\n            head: &head,\n            model: &model,\n        };\n        crate::compaction::persist_turn_summary(&home, &target, &ledger, &memory)\n    })\n    .await;\n}\n\n/// Splits the latest non-empty user message off as the prompt.\n///\n/// Messages after it are dropped from this request only. An error here would\n/// stick: the next send would load the same tail and fail again.\nfn split_latest_user(\n    history: Vec<Arc<Message>>,\n) -> Result<(Vec<Arc<Message>>, mycode_agent::UserMessage), String> {\n    let Some(index) = history.iter().rposition(\n        |message| matches!(message.as_ref(), Message::User(user) if user_has_content(user)),\n    ) else {\n        return Err(\"the turn has no user message to answer\".to_owned());\n    };\n    let mut prior = history;\n    // The split-off tail owns the prompt, so an unshared message moves out\n    // without a copy.\n    let prompt = prior.split_off(index).swap_remove(0);\n    let Message::User(prompt) = Arc::unwrap_or_clone(prompt) else {\n        return Err(\"the turn has no user message to answer\".to_owned());\n    };\n    Ok((prior, prompt))\n}\n\n/// Whether this message asks for an answer. A picture counts on its own: an\n/// attachments-only prompt has an empty text block but something to look at,\n/// and treating it as empty made the model answer the previous prompt again.\nfn user_has_content(user: &mycode_agent::UserMessage) -> bool {\n    user.content.iter().any(|block| match block {\n        mycode_agent::ContentBlock::Text(text) => !text.text.trim().is_empty(),\n        mycode_agent::ContentBlock::Image(_) => true,\n        _ => false,\n    })\n}\n\n#[cfg(test)]\nmod selection_tests {\n    use mycode_agent::{BinaryData, ContentBlock, TextBlock, UserMessage};\n\n    use super::user_has_content;\n\n    #[test]\n    fn an_attachments_only_message_is_a_prompt() {\n        let images_only = UserMessage {\n            content: vec![\n                ContentBlock::Text(TextBlock::new(\"\")),\n                ContentBlock::Image(BinaryData {\n                    data: \"aGVsbG8=\".to_owned(),\n                    mime_type: \"image/png\".to_owned(),\n                }),\n            ],\n        };\n        assert!(user_has_content(&images_only));\n        assert!(!user_has_content(&UserMessage::text(\"\")));\n        assert!(!user_has_content(&UserMessage::text(\"  \\n \")));\n        assert!(user_has_content(&UserMessage::text(\"hello\")));\n    }\n}\n","crates/mycode-app/src/turn/pump.rs":"//! The ledger pump: folds the agent's event bus into ledger writes and\n//! bridge events. It owns the branch head for the life of the turn: tool\n//! calls and results commit as they happen, tool-requesting steps commit\n//! when they arrive, and the closing text reply commits at turn end.\n\nuse std::sync::Arc;\n\nuse mycode_agent::events::{AgentEvent, MessageDelta, TurnOutcome};\nuse mycode_agent::session::EventKind;\nuse mycode_agent::{AssistantMessage, ContentBlock, Message, UserMessage};\nuse tokio::sync::broadcast::{self, error::RecvError};\nuse tokio::sync::mpsc;\nuse tokio_util::sync::CancellationToken;\n\nuse crate::BridgeEvent;\nuse crate::ledger::{HeadWriter, render_error};\nuse crate::projection::{project_assistant_message, project_tool_result_message};\nuse crate::protocol::{CHAT_CANCELLED, ConversationEntry, EntryKind};\n\nuse super::compact::{DeferredSummaries, watch_prompt_cache};\n\n/// Everything the pump needs besides the agent bus.\npub(super) struct LedgerPump {\n    pub(super) events: crate::BridgeEventTx,\n    pub(super) writer: HeadWriter,\n    pub(super) session_id: String,\n    /// Summaries the request hook produced mid-turn; published after the\n    /// closing reply so a card cannot split a tool call from its result.\n    pub(super) deferred: DeferredSummaries,\n    pub(super) cancel: CancellationToken,\n    /// Model id the usage meter names.\n    pub(super) usage_model: String,\n    pub(super) started: std::time::Instant,\n}\n\nimpl LedgerPump {\n    /// Runs until the turn ends and returns its one terminal event\n    /// (`ChatDone` or `ChatFailed`). The turn task sends it once the turn's\n    /// controls are unpublished, so the desktop that hears it never reopens\n    /// the session onto a turn the core still lists as running.\n    pub(super) async fn run(self, agent_rx: broadcast::Receiver<AgentEvent>) -> BridgeEvent {\n        let mut agent_rx = relay(agent_rx);\n        // A text-only reply is held until the turn ends or a steer commits\n        // it: a later step or a steer may still follow it.\n        let mut pending_assistant: Option<Arc<Message>> = None;\n        let mut last_step: Option<ConversationEntry> = None;\n        let mut turn_usage = TurnUsage::default();\n        // The opening user message is already in the ledger. Later user\n        // messages are steers injected into this same turn.\n        let mut saw_opening_user = false;\n        // `agent` calls the model is still writing, by provider call id.\n        let mut preparing = PreparingCalls::default();\n        loop {\n            let event = match agent_rx.recv().await {\n                Some(Ok(event)) => event,\n                Some(Err(RecvError::Lagged(_))) => {\n                    return self.fail(\"agent event stream lagged\").await;\n                }\n                Some(Err(RecvError::Closed)) | None => {\n                    // Every terminal event returns below, so a closed bus\n                    // means the agent stopped before its turn started: a\n                    // cancel during the first request's hook ends the\n                    // prompt without TurnStarted or TurnEnded. The desktop\n                    // still needs one terminal to leave the sending state.\n                    let message = if self.cancel.is_cancelled() {\n                        CHAT_CANCELLED\n                    } else {\n                        \"the turn ended before it started\"\n                    };\n                    return self.fail(message).await;\n                }\n            };\n            match event {\n                AgentEvent::MessageDelta(MessageDelta::TextDelta(delta)) => {\n                    self.send(BridgeEvent::ChatText {\n                        session_id: self.session_id.clone(),\n                        delta,\n                    });\n                }\n                AgentEvent::MessageDelta(MessageDelta::ThinkingDelta(delta)) => {\n                    self.send(BridgeEvent::ChatThinking {\n                        session_id: self.session_id.clone(),\n                        delta,\n                    });\n                }\n                AgentEvent::MessageDelta(MessageDelta::ToolCallStarted { id, name }) => {\n                    if let Some(target) = preparing.open(&id, &name) {\n                        self.send_preparing(id, name, target);\n                    }\n                }\n                AgentEvent::MessageDelta(MessageDelta::ToolCallDelta { id, partial_json }) => {\n                    if let Some(target) = preparing.extend(&id, &partial_json) {\n                        self.send_preparing(id, AGENT_TOOL.to_owned(), target);\n                    }\n                }\n                AgentEvent::TurnStarted => {}\n                AgentEvent::ToolStarted {\n                    call_id,\n                    name,\n                    target,\n                } => {\n                    let provider_call_id = call_id.to_string();\n                    preparing.close(&provider_call_id);\n                    // The ToolCall event must commit before its result; the\n                    // ledger's ordering check rejects results for calls that\n                    // were never opened.\n                    let identity = match self\n                        .writer\n                        .open_call(&provider_call_id, &name, &target)\n                        .await\n                    {\n                        Ok(identity) => identity,\n                        Err(error) => return self.fail(render_error(error)).await,\n                    };\n                    self.send(BridgeEvent::ToolStarted {\n                        session_id: self.session_id.clone(),\n                        call_id: identity.as_str().to_owned(),\n                        provider_call_id,\n                        name,\n                        target,\n                    });\n                }\n                AgentEvent::ToolProgress { call_id, message } => {\n                    // Progress rides the transcript's ledger identity so the\n                    // live job it updates matches its rows. A provider id the\n                    // open-call map no longer holds is a straggler from a call\n                    // that already closed — forwarding it would resurrect a\n                    // finished job under an id no result can drop.\n                    let provider_call_id = call_id.to_string();\n                    let Some(identity) = self.writer.call_identity(&provider_call_id).await else {\n                        continue;\n                    };\n                    self.send(BridgeEvent::ToolProgress {\n                        session_id: self.session_id.clone(),\n                        call_id: identity,\n                        provider_call_id,\n                        name: String::new(),\n                        message,\n                    });\n                }\n                AgentEvent::ToolCompleted { call_id, result } => {\n                    let Message::ToolResult(tool_result) = result.as_ref() else {\n                        continue;\n                    };\n                    let Ok(payload) = serde_json::to_vec(tool_result) else {\n                        return self.fail(\"tool result could not be encoded\").await;\n                    };\n                    match self.writer.close_call(call_id.as_str(), &payload).await {\n                        Ok((event_id, identity)) => {\n                            let mut entry = project_tool_result_message(&event_id, tool_result);\n                            // The payload's tool_call_id is the provider id;\n                            // live rows pair on the ledger identity the way\n                            // replayed rows do.\n                            entry.call_id = Some(identity);\n                            self.send(BridgeEvent::ToolCompleted {\n                                session_id: self.session_id.clone(),\n                                entry,\n                            });\n                        }\n                        Err(error) => return self.fail(render_error(error)).await,\n                    }\n                }\n                AgentEvent::MessageAdded(message) => match message.as_ref() {\n                    Message::User(user) => {\n                        if !saw_opening_user {\n                            saw_opening_user = true;\n                            continue;\n                        }\n                        let text = plain_user_text(user);\n                        if text.trim().is_empty() {\n                            continue;\n                        }\n                        if let Err(failure) =\n                            self.commit_steer(text, pending_assistant.take()).await\n                        {\n                            return self.fail(failure).await;\n                        }\n                    }\n                    Message::Assistant(assistant) => {\n                        // Usage is reported per response cycle, so it has to\n                        // be summed here: reading it off the closing message\n                        // alone would bill a ten-step turn as one.\n                        if let Some(usage) = assistant.usage.as_ref() {\n                            turn_usage.fold(usage);\n                            self.send_usage(&turn_usage);\n                        }\n                        // A step that requests tools is not the end of the\n                        // turn. Commit it now so the ledger and the transcript\n                        // keep the model's real order instead of collapsing\n                        // the turn into its last message.\n                        let is_step = assistant\n                            .blocks\n                            .iter()\n                            .any(|block| matches!(block, ContentBlock::ToolCall(_)));\n                        if !is_step {\n                            pending_assistant = Some(message);\n                            continue;\n                        }\n                        match self.commit_assistant(assistant).await {\n                            Ok(entry) => {\n                                last_step = Some(entry.clone());\n                                self.send(BridgeEvent::AssistantStep {\n                                    session_id: self.session_id.clone(),\n                                    entry,\n                                });\n                            }\n                            Err(failure) => return self.fail(failure).await,\n                        }\n                    }\n                    Message::ToolResult(_) => {}\n                },\n                AgentEvent::CacheDisrupted => {\n                    watch_prompt_cache(\n                        &self.events,\n                        &self.session_id,\n                        crate::CacheDisruption::Compaction,\n                    );\n                }\n                AgentEvent::Compacting(active) => {\n                    self.send(BridgeEvent::ContextCompacting {\n                        session_id: self.session_id.clone(),\n                        active,\n                    });\n                }\n                AgentEvent::TurnEnded(TurnOutcome::Aborted) => {\n                    // A cancel keeps the partial. Write it when it has not\n                    // already been committed as a tool step, then fail\n                    // quietly so the desktop can send the queue. Never\n                    // ChatDone: that would look like a finished turn.\n                    let message = match self.commit_held_step(pending_assistant.take()).await {\n                        Ok(()) => CHAT_CANCELLED.to_owned(),\n                        Err(failure) => failure,\n                    };\n                    // A checkpoint written mid-turn is already what the next\n                    // request sends; its card must not vanish with the turn.\n                    self.publish_deferred().await;\n                    return self.fail(message).await;\n                }\n                AgentEvent::TurnEnded(_) => {\n                    let closing = match pending_assistant.take() {\n                        Some(held) => match held.as_ref() {\n                            Message::Assistant(assistant) => {\n                                self.commit_assistant(assistant).await.map(Some)\n                            }\n                            _ => Ok(None),\n                        },\n                        // A failed stream that already committed a tool step\n                        // (or any earlier step) is done. Reporting \"no\n                        // assistant message\" would clear a live bubble whose\n                        // step was the whole turn.\n                        None => Ok(last_step.take()),\n                    };\n                    return match closing {\n                        Ok(Some(entry)) => self.finish(entry).await,\n                        Ok(None) => {\n                            self.publish_deferred().await;\n                            self.fail(\"the turn ended without an assistant message\")\n                                .await\n                        }\n                        Err(failure) => {\n                            self.publish_deferred().await;\n                            self.fail(failure).await\n                        }\n                    };\n                }\n                AgentEvent::Error(error) => {\n                    // Best effort: the error is the report either way.\n                    let _ = self.commit_held_step(pending_assistant.take()).await;\n                    self.publish_deferred().await;\n                    return self.fail(format!(\"agent error: {error}\")).await;\n                }\n            }\n        }\n    }\n\n    fn send(&self, event: BridgeEvent) {\n        let _ = self.events.send(event);\n    }\n\n    fn send_preparing(&self, provider_call_id: String, name: String, target: String) {\n        self.send(BridgeEvent::ToolPreparing {\n            session_id: self.session_id.clone(),\n            provider_call_id,\n            name,\n            target,\n        });\n    }\n\n    /// Ends the turn as failed. The agent is cancelled too: a pump that\n
