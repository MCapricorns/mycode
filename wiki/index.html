            )\n            .send()\n            .await\n            .map_err(|error| {\n                format!(\n                    \"magpie gateway is not answering at {}: {error}\",\n                    self.base_url\n                )\n            })?;\n        let status = response.status();\n        if !status.is_success() {\n            return Err(format!(\"magpie /v1/models answered {status}\"));\n        }\n        let bytes = response\n            .bytes()\n            .await\n            .map_err(|error| format!(\"magpie /v1/models body: {error}\"))?;\n        if bytes.len() > MAX_MODELS_BYTES {\n            return Err(\"magpie /v1/models is larger than 4 MiB\".to_owned());\n        }\n        let provider = mycode_agent::catalog::magpie::provider_from_models(&bytes, &self.base_url)?;\n        Ok(FetchedModels {\n            provider,\n            fetched_at: mycode_app_time(),\n        })\n    }\n}\n\n/// Reads `settings.json` off the core thread.\npub(crate) async fn load_settings(\n    home: &mycode_agent::HomeLayout,\n) -> Result<mycode_agent::AppSettings, String> {\n    let read_home = home.clone();\n    tokio::task::spawn_blocking(move || {\n        mycode_agent::read_app_settings(&read_home)\n            .map_err(|error| crate::settings_io::render_config_error(&error))\n    })\n    .await\n    .map_err(|error| format!(\"settings task failed: {error}\"))?\n}\n\nfn mycode_app_time() -> u64 {\n    std::time::SystemTime::now()\n        .duration_since(std::time::UNIX_EPOCH)\n        .map(|elapsed| elapsed.as_secs())\n        .unwrap_or(0)\n}\n\n/// The provider row every turn resolves against.\n///\n/// The gateway list wins; with no list yet (offline), the selected model is\n/// still offered so the request fails with the gateway's own connection\n/// error instead of \"model not offered\".\npub(crate) fn provider_row(\n    magpie: &MagpieSettings,\n    catalog: &CatalogDocument,\n) -> Option<ProviderSettings> {\n    if !magpie.is_active() {\n        return None;\n    }\n    let mut models: Vec<String> = catalog\n        .provider(MAGPIE_PROVIDER_ID)\n        .map(|provider| {\n            provider\n                .models\n                .iter()\n                .map(|model| model.id.clone())\n                .collect()\n        })\n        .unwrap_or_default();\n    if !models.iter().any(|model| model == &magpie.model) {\n        models.insert(0, magpie.model.clone());\n    }\n    Some(ProviderSettings::magpie(\n        magpie.endpoint_base(),\n        models,\n        magpie.hidden_models.clone(),\n    ))\n}\n","crates/mycode-config/src/settings/magpie.rs":"//! magpie gateway settings.\n//!\n//! magpie (`https://usemagpie.ai`) runs a local OpenAI-compatible gateway and\n//! writes this section through its agent plugin. The section is the only\n//! place the app reads the gateway address, its key, and the model magpie\n//! picked for MCode; model metadata comes from the gateway's `/v1/models`.\n\nuse serde::{Deserialize, Serialize};\n\nuse super::{\n    AppSettings, MAX_FIELD_BYTES, MAX_HIDDEN_MODELS_PER_PROVIDER, bounded_text, is_https_url,\n    is_local_http_url, is_portable_model_id,\n};\nuse crate::ConfigError;\n\n/// Provider id the gateway is exposed under in the model picker.\npub const MAGPIE_PROVIDER_ID: &str = \"magpie\";\n/// Display name shown for the gateway provider.\npub const MAGPIE_PROVIDER_NAME: &str = \"Magpie\";\n/// Gateway address used when the agent plugin did not write one.\npub const DEFAULT_MAGPIE_BASE_URL: &str = \"http://127.0.0.1:3425/v1\";\n/// Key prefix magpie hands the app; any key is accepted on this machine.\npub const MAGPIE_KEY_PREFIX: &str = \"magpie-\";\n\n/// The local magpie gateway binding.\n///\n/// `enabled`, `baseUrl`, `apiKey`, and `model` are written by magpie's\n/// `mycode.agent.js`; the app never edits them from the settings UI.\n#[derive(Clone, Debug, Default, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields, default)]\npub struct MagpieSettings {\n    /// Whether the gateway is offered as a provider.\n    pub enabled: bool,\n    /// OpenAI-compatible base URL, ending in `/v1`.\n    #[serde(skip_serializing_if = \"String::is_empty\")]\n    pub base_url: String,\n    /// Bearer key magpie issued to the app (`magpie-mycode`).\n    #[serde(skip_serializing_if = \"String::is_empty\")]\n    pub api_key: String,\n    /// Model magpie picked, as the gateway names it (`provider/model`).\n    #[serde(skip_serializing_if = \"String::is_empty\")]\n    pub model: String,\n    /// Models kept out of the picker while the gateway still lists them.\n    #[serde(default, skip_serializing_if = \"Vec::is_empty\")]\n    pub hidden_models: Vec<String>,\n}\n\nimpl MagpieSettings {\n    /// Whether the section is absent from `settings.json` as written.\n    #[must_use]\n    pub fn is_default(&self) -> bool {\n        *self == Self::default()\n    }\n    /// The base URL with any trailing slash removed.\n    #[must_use]\n    pub fn endpoint_base(&self) -> &str {\n        self.base_url.trim_end_matches('/')\n    }\n\n    /// Whether a usable binding was written.\n    #[must_use]\n    pub fn is_active(&self) -> bool {\n        self.enabled && !self.endpoint_base().is_empty() && !self.model.is_empty()\n    }\n}\n\nimpl AppSettings {\n    /// Validates the magpie binding: address grammar, key shape, and the\n    /// selected model id.\n    pub(super) fn validate_magpie(&self) -> Result<(), ConfigError> {\n        let invalid =\n            |detail: &str| ConfigError::authority_rejection().with_detail(detail.to_owned());\n        let magpie = &self.magpie;\n        if magpie.base_url.is_empty() {\n            if magpie.enabled {\n                return Err(invalid(\n                    \"magpie.baseUrl: required when the gateway is enabled\",\n                ));\n            }\n            return Ok(());\n        }\n        if !is_local_http_url(&magpie.base_url) && !is_https_url(&magpie.base_url) {\n            return Err(invalid(\n                \"magpie.baseUrl: must be an https:// URL or a loopback http:// gateway\",\n            ));\n        }\n        bounded_text(&magpie.api_key, MAX_FIELD_BYTES)\n            .map_err(|_| invalid(\"magpie.apiKey: too long or contains line breaks or NUL\"))?;\n        if magpie.enabled && magpie.api_key.is_empty() {\n            return Err(invalid(\n                \"magpie.apiKey: required when the gateway is enabled\",\n            ));\n        }\n        if !magpie.model.is_empty() && !is_portable_model_id(&magpie.model) {\n            return Err(invalid(\n                \"magpie.model: must be a provider/model id without line breaks or NUL\",\n            ));\n        }\n        if magpie.enabled && magpie.model.is_empty() {\n            return Err(invalid(\n                \"magpie.model: required when the gateway is enabled\",\n            ));\n        }\n        if magpie.hidden_models.len() > MAX_HIDDEN_MODELS_PER_PROVIDER {\n            return Err(invalid(&format!(\n                \"magpie.hiddenModels: at most {MAX_HIDDEN_MODELS_PER_PROVIDER} entries\"\n            )));\n        }\n        for model in &magpie.hidden_models {\n            bounded_text(model, MAX_FIELD_BYTES).map_err(|_| {\n                invalid(\"magpie.hiddenModels: an id is too long or contains line breaks or NUL\")\n            })?;\n        }\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{AppSettings, MagpieSettings, is_local_http_url};\n\n    fn settings(magpie: MagpieSettings) -> AppSettings {\n        AppSettings {\n            magpie,\n            ..AppSettings::default()\n        }\n    }\n\n    fn active() -> MagpieSettings {\n        MagpieSettings {\n            enabled: true,\n            base_url: \"http://127.0.0.1:3425/v1\".to_owned(),\n            api_key: \"magpie-mycode\".to_owned(),\n            model: \"deepseek/deepseek-chat\".to_owned(),\n            hidden_models: Vec::new(),\n        }\n    }\n\n    #[test]\n    fn loopback_http_gateways_are_accepted_and_public_http_is_not() {\n        assert!(is_local_http_url(\"http://127.0.0.1:3425/v1\"));\n        assert!(is_local_http_url(\"http://localhost:3425\"));\n        assert!(is_local_http_url(\"http://[::1]:3425/v1\"));\n        assert!(!is_local_http_url(\"http://192.168.1.5:3425\"));\n        assert!(!is_local_http_url(\"https://127.0.0.1:3425\"));\n        assert!(!is_local_http_url(\"http://127.0.0.1:not-a-port\"));\n        assert!(settings(active()).validate_magpie().is_ok());\n    }\n\n    #[test]\n    fn an_enabled_binding_needs_an_address_key_and_model() {\n        let mut magpie = active();\n        magpie.api_key.clear();\n        assert!(\n            settings(magpie)\n                .validate_magpie()\n                .expect_err(\"empty key is rejected\")\n                .summary()\n                .contains(\"apiKey\")\n        );\n        let mut magpie = active();\n        magpie.model.clear();\n        assert!(\n            settings(magpie)\n                .validate_magpie()\n                .expect_err(\"empty model is rejected\")\n                .summary()\n                .contains(\"model\")\n        );\n    }\n\n    #[test]\n    fn a_disabled_binding_with_no_fields_is_valid() {\n        assert!(\n            settings(MagpieSettings::default())\n                .validate_magpie()\n                .is_ok()\n        );\n    }\n}\n","crates/mycode-providers/src/catalog/magpie.rs":"//! Parses magpie's `GET /v1/models` answer into the one provider row.\n//!\n//! The gateway lists every model the user turned on in magpie under\n//! `provider/model`, with the metadata the picker needs: display name,\n//! context and output limits, reasoning levels, and whether it takes images.\n\nuse serde_json::Value;\n\nuse super::{\n    CatalogDocument, CatalogModel, CatalogProvider, KIND_OPENAI_COMPLETIONS,\n    MAX_MODELS_PER_PROVIDER, clean_text, normalize_provider,\n};\n\n/// Provider id every magpie model is reached under.\npub const PROVIDER_ID: &str = \"magpie\";\n/// Display name of the gateway row.\npub const PROVIDER_NAME: &str = \"Magpie\";\n\n/// Builds the provider row from one `/v1/models` document.\n///\n/// # Errors\n///\n/// Returns a one-line reason when the body is not the gateway's list shape.\npub fn provider_from_models(body: &[u8], base_url: &str) -> Result<CatalogProvider, String> {\n    let value: Value =\n        serde_json::from_slice(body).map_err(|_| \"magpie /v1/models is not JSON\".to_owned())?;\n    let items = value\n        .get(\"data\")\n        .and_then(Value::as_array)\n        .or_else(|| value.as_array())\n        .ok_or_else(|| \"magpie /v1/models has no data list\".to_owned())?;\n    let mut models = Vec::new();\n    for item in items.iter().take(MAX_MODELS_PER_PROVIDER * 4) {\n        if let Some(model) = model_from(item) {\n            models.push(model);\n        }\n    }\n    if models.is_empty() {\n        return Err(\"magpie lists no models; pick one in magpie first\".to_owned());\n    }\n    let provider = CatalogProvider {\n        id: PROVIDER_ID.to_owned(),\n        name: PROVIDER_NAME.to_owned(),\n        kind: KIND_OPENAI_COMPLETIONS.to_owned(),\n        base_url: base_url.to_owned(),\n        models,\n    };\n    normalize_provider(provider).ok_or_else(|| \"magpie listed no usable models\".to_owned())\n}\n\n/// The whole catalog document: one provider row, no vendors of its own.\n#[must_use]\npub fn document_from_provider(provider: CatalogProvider) -> CatalogDocument {\n    CatalogDocument {\n        providers: vec![provider],\n    }\n}\n\nfn model_from(item: &Value) -> Option<CatalogModel> {\n    let id = clean_text(item.get(\"id\").and_then(Value::as_str)?)?;\n    let name = item\n        .get(\"display_name\")\n        .or_else(|| item.get(\"name\"))\n        .and_then(Value::as_str)\n        .and_then(clean_text)\n        .unwrap_or_else(|| id.clone());\n    let mut efforts = Vec::new();\n    if let Some(levels) = item.get(\"reasoning_levels\").and_then(Value::as_array) {\n        for level in levels {\n            if let Some(level) = level.as_str().and_then(clean_text) {\n                push_effort(&mut efforts, &level);\n            }\n        }\n    }\n    if let Some(levels) = item\n        .get(\"supported_reasoning_levels\")\n        .and_then(Value::as_array)\n    {\n        for level in levels {\n            let effort = level\n                .get(\"effort\")\n                .and_then(Value::as_str)\n                .or_else(|| level.as_str());\n            if let Some(effort) = effort.and_then(clean_text) {\n                push_effort(&mut efforts, &effort);\n            }\n        }\n    }\n    let reasoning = item\n        .get(\"reasoning\")\n        .and_then(Value::as_bool)\n        .unwrap_or(!efforts.is_empty());\n    let takes_images = item\n        .get(\"modalities\")\n        .and_then(|modalities| modalities.get(\"input\"))\n        .and_then(Value::as_array)\n        .is_some_and(|inputs| inputs.iter().any(|input| input.as_str() == Some(\"image\")));\n    Some(CatalogModel {\n        id,\n        name,\n        reasoning,\n        reasoning_toggle: false,\n        reasoning_efforts: efforts,\n        tool_call: true,\n        attachment: takes_images,\n        context: item\n            .get(\"context_window\")\n            .and_then(Value::as_u64)\n            .unwrap_or(0),\n        output: item\n            .get(\"max_output_tokens\")\n            .and_then(Value::as_u64)\n            .unwrap_or(0),\n        cost_in: None,\n        cost_out: None,\n    })\n}\n\n/// Keeps one effort token, lowercased, without duplicates or junk.\nfn push_effort(efforts: &mut Vec<String>, effort: &str) {\n    let effort = effort.trim().to_ascii_lowercase();\n    if effort.is_empty() || effort == \"default\" || effort.len() > 32 {\n        return;\n    }\n    if !efforts.iter().any(|held| held == &effort) && efforts.len() < 16 {\n        efforts.push(effort);\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{PROVIDER_ID, provider_from_models};\n\n    #[test]\n    fn the_gateway_list_becomes_one_provider_row() {\n        let body = br#\"{\"object\":\"list\",\"data\":[\n            {\"id\":\"deepseek/deepseek-chat\",\"display_name\":\"DeepSeek Chat\",\"owned_by\":\"deepseek\",\n             \"context_window\":128000,\"max_output_tokens\":32000,\n             \"modalities\":{\"input\":[\"text\"]}},\n            {\"id\":\"claude/claude-opus-5\",\"display_name\":\"Claude Opus 5\",\"owned_by\":\"claude\",\n             \"reasoning\":true,\"reasoning_levels\":[\"low\",\"high\",\"max\"],\n             \"supported_reasoning_levels\":[{\"effort\":\"low\"},{\"effort\":\"high\"}],\n             \"context_window\":1000000,\"max_output_tokens\":128000,\n             \"modalities\":{\"input\":[\"text\",\"image\"]}}\n        ]}\"#;\n        let provider = provider_from_models(body, \"http://127.0.0.1:3425/v1\").expect(\"provider\");\n        assert_eq!(provider.id, PROVIDER_ID);\n        assert_eq!(provider.models.len(), 2);\n        let opus = provider\n            .models\n            .iter()\n            .find(|model| model.id == \"claude/claude-opus-5\")\n            .expect(\"opus\");\n        assert_eq!(opus.name, \"Claude Opus 5\");\n        assert_eq!(opus.context, 1_000_000);\n        assert_eq!(opus.output, 128_000);\n        assert!(opus.reasoning);\n        assert!(opus.attachment);\n        assert_eq!(opus.reasoning_levels(), [\"low\", \"high\", \"max\"]);\n        let chat = provider\n            .models\n            .iter()\n            .find(|model| model.id == \"deepseek/deepseek-chat\")\n            .expect(\"chat\");\n        assert!(!chat.reasoning);\n        assert!(!chat.attachment);\n        assert!(chat.reasoning_levels().is_empty());\n    }\n\n    #[test]\n    fn an_empty_or_unknown_list_is_an_error() {\n        assert!(provider_from_models(br#\"{\"data\":[]}\"#, \"http://localhost:1\").is_err());\n        assert!(provider_from_models(b\"not json\", \"http://localhost:1\").is_err());\n    }\n}\n","crates/mycode-tools/src/lib.rs":"//! `mycode-tools` — the `Tool` trait, registry, and builtin tools.\n//!\n//! One JSON Schema per tool (schemars) serves both the LLM tool spec and\n//! runtime argument validation; [`ToolRegistry`] is last-wins per name.\n//! Trusted builtins (read/write/edit/shell/grep/find) provide the minimal\n//! recovery surface and spawn no external search binaries.\n\npub mod builtin;\npub mod ctx;\nmod invoke;\npub mod registry;\npub mod roots;\npub mod stream;\npub mod tool;\n\n// Chain re-export: successors see every lower layer through this crate only.\npub use mycode_providers::*;\n\npub use builtin::fs_io::{FileAccess, PreparedFile, prepare_file_async};\npub use builtin::fs_search::{PreparedSearch, SearchAccess, prepare_search_async_with_access};\npub use builtin::shell::{\n    DetectedShell, ShellKind, active_shell, detect_default_shell, render_environment_block,\n    resolved_shell, script_shell_line,\n};\npub use builtin::{ShellTool, register_builtins};\npub use ctx::ToolCtx;\npub use invoke::prepare_tool_ctx;\npub use registry::ToolRegistry;\npub use roots::{anchor_tool_path, os_scratch_root};\npub use stream::{ToolProgress, ToolStream, ToolStreamItem, ToolStreamReceiver};\npub use tool::{Tool, ToolDyn, ToolError, ToolResult};\n\n/// Windows stdio child resumed from `PROCESS_INFORMATION.hThread`.\n#[cfg(windows)]\npub use builtin::process::WindowsStdioProcess;\npub use builtin::process::first_program_on_path;\n","crates/mycode-tools/src/tool.rs":"//! The `Tool` trait. Builtin tools implement it; `ToolDyn` erases the\n//! associated argument type for storage in the\n//! [`ToolRegistry`](crate::registry::ToolRegistry). See `wiki/index.html`.\n//!\n//! Single-source schema: `schemars` derives one JSON Schema per tool's\n//! `Args`, used both for the LLM tool spec (`ToolSpec::params_schema`) and\n//! for runtime argument validation in [`ToolDyn::execute_dyn`].\n\nuse std::any::TypeId;\nuse std::collections::HashMap;\nuse std::future::Future;\nuse std::pin::Pin;\nuse std::sync::{Arc, LazyLock};\n\nuse parking_lot::RwLock;\n\nuse schemars::JsonSchema;\nuse serde::de::DeserializeOwned;\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\n\nuse mycode_providers::message::{ContentBlock, TextBlock};\nuse mycode_providers::tool::ToolSpec;\n\nuse crate::builtin::fs_io::FileAccess;\nuse crate::builtin::fs_search::SearchAccess;\nuse crate::ctx::ToolCtx;\nuse crate::stream::ToolStream;\n\n/// The outcome of a tool execution as seen by the model and the UI.\n///\n/// Mirrors `ToolResultMessage` in `mycode-core`: `content` goes back to the\n/// LLM, `details` is UI-only (structured diffs, byte counts, …) and never\n/// enters model context.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ToolResult {\n    /// Content visible to the model.\n    pub content: Vec<ContentBlock>,\n    /// A tool-level failure reported *as data* (non-zero exit, failed\n    /// match, …). Distinct from `Err(ToolError)`, which signals the\n    /// dispatcher should synthesize an error result.\n    pub is_error: bool,\n    /// Structured information for the UI layer only; not sent to the LLM.\n    pub details: Option<Value>,\n}\n\nimpl ToolResult {\n    /// A successful result with a single text block.\n    pub fn text(content: impl Into<String>) -> Self {\n        Self {\n            content: vec![ContentBlock::Text(TextBlock::new(content))],\n            is_error: false,\n            details: None,\n        }\n    }\n\n    /// A result whose content reports a failure (`is_error: true`).\n    pub fn error(message: impl Into<String>) -> Self {\n        Self {\n            content: vec![ContentBlock::Text(TextBlock::new(message))],\n            is_error: true,\n            details: None,\n        }\n    }\n\n    /// Attach UI-only details (builder style).\n    pub fn with_details(mut self, details: Value) -> Self {\n        self.details = Some(details);\n        self\n    }\n}\n\n/// Appended to every user-interrupt error. The cancelled result is\n/// committed to the session ledger and replays verbatim on the next turn,\n/// so this note is what tells the model the interrupt did not roll back\n/// tool calls that already completed.\npub const INTERRUPTED_NOTE: &str =\n    \"; interrupted by user — completed tool calls were applied and are not rolled back\";\n\n/// Failure modes of a tool invocation. The dispatcher (agent loop)\n/// converts these into `is_error` tool results for the model rather than\n/// crashing the loop. See `wiki/index.html`.\n#[derive(Debug, Clone, PartialEq, thiserror::Error)]\npub enum ToolError {\n    /// Arguments failed schema validation or are semantically invalid.\n    #[error(\"invalid arguments: {0}\")]\n    InvalidArgs(String),\n    /// The tool ran but failed (missing file, I/O error, …).\n    #[error(\"{0}\")]\n    Execution(String),\n    /// The tool implementation panicked.\n    #[error(\"plugin trap: {0}\")]\n    PluginTrap(String),\n}\n\nimpl From<std::io::Error> for ToolError {\n    fn from(err: std::io::Error) -> Self {\n        Self::Execution(err.to_string())\n    }\n}\n\n/// A tool with typed arguments. Builtin tools and Rust-side plugins\n/// implement this; the blanket [`ToolDyn`] impl type-erases it.\n///\n/// `execute` returns an `impl Future` pinned by trait, so implementers\n/// write plain `async fn`; `Args` must additionally be `Send` because the\n/// future captures the arguments and the object-safe [`ToolDyn`] boxes it.\npub trait Tool: Send + Sync + 'static {\n    /// Typed, schema-derived arguments. The schemars-generated schema is\n    /// the single source for both the tool spec and runtime validation.\n    type Args: DeserializeOwned + JsonSchema + Send;\n    /// Typed output payload, reserved for renderer integration.\n    type Output: Serialize;\n\n    /// Unique tool name (registry key; last registration wins).\n    fn name(&self) -> &str;\n    /// What the tool does, sent to the model in the tool spec.\n    fn description(&self) -> &str;\n    /// Optional usage hint injected into the system prompt (pi's\n    /// `promptSnippet`). `None` by default.\n    fn prompt_snippet(&self) -> Option<&str> {\n        None\n    }\n\n    /// JSON Schema sent to the model. The default is the schemars schema of\n    /// [`Self::Args`]. The shell tool replaces parameter descriptions so they\n    /// match the one interpreter the model is allowed to use.\n    fn params_schema(&self) -> Value {\n        args_schema::<Self::Args>()\n    }\n\n    /// Extra identity for the compiled-schema cache when `params_schema`\n    /// varies between instances of one type and name. The default of an\n    /// empty string says the schema is fixed; the shell tool returns its\n    /// resolved kind (`Pwsh` and `WindowsPowerShell` share the tool name\n    /// `powershell` but not the parameter docs).\n    fn schema_key(&self) -> String {\n        String::new()\n    }\n\n    /// Access mode for a retained local search root.\n    ///\n    /// Built-in `grep` returns content access and `find` metadata access.\n    /// Plugin overrides stay off by default and are not forced through\n    /// filesystem preflight.\n    fn search_access(&self) -> Option<SearchAccess> {\n        None\n    }\n\n    /// Whether dispatch should bind a local search root first.\n    fn requires_search_preflight(&self) -> bool {\n        self.search_access().is_some()\n    }\n\n    /// Access mode for a retained local file capability.\n    ///\n    /// Built-in `read` and `edit` return existing-content access and `write`\n    /// returns existing-or-missing access. Plugin overrides stay off by\n    /// default and are not forced through filesystem preflight.\n    fn file_access(&self) -> Option<FileAccess> {\n        None\n    }\n\n    /// Whether the tool only reads through the prepared file capability.\n    ///\n    /// Read-only content tools anchor absolute paths against\n    /// host-published read roots outside the workspace (the skills\n    /// catalog), which keeps their keys relative to that root.\n    fn reads_only(&self) -> bool {\n        false\n    }\n\n    /// Whether dispatch should bind a local file capability first.\n    fn requires_file_preflight(&self) -> bool {\n        self.file_access().is_some()\n    }\n\n    /// Whether calls to this tool may run at the same time as other calls\n    /// that are also parallel-safe.\n    ///\n    /// True only for tools that change nothing: content reads and searches\n    /// by default, plus tools that opt in. Anything that writes, spawns a\n    /// process, or asks the user runs alone, in the model's order.\n    fn parallel_safe(&self) -> bool {\n        self.reads_only() || self.search_access().is_some()\n    }\n\n    /// Rewrites model-emitted arguments into the schema shape before validation.\n    ///\n    /// The default leaves arguments unchanged. `ask_user` uses this so XML\n    /// tool-call shapes (stringified JSON, choice lists, and `multiple`\n    /// aliases) pass the same schema as a native JSON call.\n    fn prepare_args(&self, args: Value) -> Value {\n        args\n    }\n\n    /// Execute the tool. Tools may stream progress through `out`; the returned\n    /// result is the terminal outcome claimed by the dispatcher.\n    fn execute<'a>(\n        &'a self,\n        args: Self::Args,\n        ctx: &'a ToolCtx,\n        out: &'a mut ToolStream,\n    ) -> impl Future<Output = Result<ToolResult, ToolError>> + Send + 'a;\n}\n\n/// Object-safe, type-erased view of a [`Tool`] for registry storage and\n/// dispatch with raw-JSON arguments.\n///\n/// `execute_dyn` returns a boxed future so the trait stays object-safe;\n/// implementers write `Box::pin(async move { … })`.\npub trait ToolDyn: Send + Sync {\n    /// The tool spec (name, description, JSON Schema of arguments) as\n    /// sent to LLM providers.\n    fn spec(&self) -> ToolSpec;\n    /// Returns the optional compact usage hint through type erasure.\n    fn prompt_snippet_dyn(&self) -> Option<&str> {\n        None\n    }\n    /// Access mode for a retained local search root.\n    fn search_access(&self) -> Option<SearchAccess> {\n        None\n    }\n    /// Whether dispatch should bind a local search root first.\n    fn requires_search_preflight(&self) -> bool {\n        self.search_access().is_some()\n    }\n    /// Access mode for a retained local file capability.\n    fn file_access(&self) -> Option<FileAccess> {\n        None\n    }\n    /// Whether the tool only reads the prepared file.\n    fn reads_only(&self) -> bool {\n        false\n    }\n    /// Whether dispatch should bind a local file capability first.\n    fn requires_file_preflight(&self) -> bool {\n        self.file_access().is_some()\n    }\n    /// Whether calls may run alongside other parallel-safe calls.\n    fn parallel_safe(&self) -> bool {\n        false\n    }\n    /// Whether this one call may run alongside other parallel-safe calls.\n    /// A tool that routes to another tool decides from `args`; every other\n    /// tool answers [`ToolDyn::parallel_safe`].\n    fn parallel_safe_call(&self, args: &Value) -> bool {\n        let _ = args;\n        self.parallel_safe()\n    }\n    /// Validate `args` against the tool's schema (`Self::spec().params_schema`),\n    /// deserialize, and execute. Wrong-shaped arguments fail with\n    /// [`ToolError::InvalidArgs`].\n    fn execute_dyn<'a>(\n        &'a self,\n        args: Value,\n        ctx: &'a ToolCtx,\n        out: &'a mut ToolStream,\n    ) -> Pin<Box<dyn Future<Output = Result<ToolResult, ToolError>> + Send + 'a>>;\n}\n\n/// Generate the JSON Schema of `A`'s arguments (schemars single source).\n///\n/// Providers reject a root schema that is `true` or carries a draft\n/// `$schema` or `$id`. Boolean `true` becomes an object schema. A root\n/// object with no `type`, `oneOf`, `anyOf`, or `allOf` is marked\n/// `type: object` (`$ref` cannot survive inlining). Any other root shape is\n/// left as schemars emitted it, after `$schema` and `$id` are removed.\npub(crate) fn args_schema<A: JsonSchema>() -> Value {\n    let mut value = serde_json::to_value(schemars::schema_for!(A))\n        .expect(\"schemars schemas always serialize to JSON\");\n    normalize_tool_schema(&mut value);\n    value\n}\n\nfn normalize_tool_schema(value: &mut Value) {\n    if value.as_bool() == Some(true) {\n        *value = serde_json::json!({\"type\": \"object\", \"additionalProperties\": true});\n        return;\n    }\n    if let Some(object) = value.as_object_mut() {\n        object.remove(\"$schema\");\n        object.remove(\"$id\");\n    }\n    // Same expansion the wire adapters apply, so a builtin spec and the\n    // request body agree. See `mycode_providers::inline_schema_refs`.\n    mycode_providers::inline_schema_refs(value);\n    if let Some(object) = value.as_object_mut() {\n        object.remove(\"$schema\");\n        if !object.contains_key(\"type\")\n            && !object.contains_key(\"oneOf\")\n            && !object.contains_key(\"anyOf\")\n            && !object.contains_key(\"allOf\")\n        {\n            object.insert(\"type\".to_owned(), Value::String(\"object\".to_owned()));\n        }\n    }\n}\n\n/// A normalized argument schema and its compiled validator.\nstruct ArgsCheck {\n    schema: Value,\n    validator: jsonschema::Validator,\n}\n\nimpl ArgsCheck {\n    fn compile(schema: &Value) -> Result<Self, ToolError> {\n        let mut schema = schema.clone();\n        normalize_tool_schema(&mut schema);\n        let validator = jsonschema::validator_for(&schema).map_err(|err| {\n            ToolError::Execution(format!(\"failed to compile argument schema: {err}\"))\n        })?;\n        Ok(Self { schema, validator })\n    }\n\n    fn validate(&self, args: &Value) -> Result<(), ToolError> {\n        let errors: Vec<String> = self\n            .validator\n            .iter_errors(args)\n            .map(|err| render_schema_error(&err, &self.schema))\n            .collect();\n        if errors.is_empty() {\n            Ok(())\n        } else {\n            Err(ToolError::InvalidArgs(errors.join(\"; \")))\n        }\n    }\n}\n\n/// Compiled argument checks of [`Tool`] implementors, keyed by type, name,\n/// and the schema's identity. A tool whose `params_schema` varies beyond the\n/// name (the shell tool: `Pwsh` and `WindowsPowerShell` both register as\n/// `powershell` but carry kind-specific parameter docs) must include that\n/// variation in `schema_key`, or two instances would silently share one\n/// compiled schema. Each schema is generated and compiled once per process\n/// instead of on every call.\nstatic ARGS_CHECKS: LazyLock<RwLock<ArgsChecks>> = LazyLock::new(Default::default);\n\ntype ArgsChecks = HashMap<(TypeId, String, String), Arc<ArgsCheck>>;\n\nfn args_check<T: Tool>(tool: &T) -> Result<Arc<ArgsCheck>, ToolError> {\n    let key = (\n        TypeId::of::<T>(),\n        tool.name().to_owned(),\n        tool.schema_key().to_owned(),\n    );\n    if let Some(check) = ARGS_CHECKS.read().get(&key) {\n        return Ok(Arc::clone(check));\n    }\n    // Compiled outside the lock; a racing caller's copy is identical.\n    let check = Arc::new(ArgsCheck::compile(&tool.params_schema())?);\n    Ok(Arc::clone(ARGS_CHECKS.write().entry(key).or_insert(check)))\n}\n\n/// Validate raw `args` against an arbitrary JSON Schema value.\n#[cfg(test)]\npub(crate) fn validate_args_with_schema(schema: &Value, args: &Value) -> Result<(), ToolError> {\n    ArgsCheck::compile(schema)?.validate(args)\n}\n\n/// One validation failure rendered for the model. The stock Display of a\n/// `oneOf`/`anyOf` failure embeds the entire offending value — with edit\n/// operations that is hundreds of bytes of multiline source text — so it\n/// is replaced by the allowed `type` variants, or by \"missing field `type`\"\n/// when every branch's complaint agrees the tag is absent.\n///\n/// Public for hosts that validate against a server-declared schema\n/// themselves (MCP tools) and want one message style everywhere.\npub fn render_schema_error(err: &jsonschema::ValidationError<'_>, schema: &Value) -> String {\n    let path = err.instance_path().to_string();\n    let path = if path.is_empty() { \"/\" } else { &path };\n    match err.kind() {\n        jsonschema::error::ValidationErrorKind::OneOfNotValid { context }\n        | jsonschema::error::ValidationErrorKind::AnyOf { context } => {\n            let variants = tag_variants(schema, err);\n            let missing_tag = !context.is_empty()\n                && context.iter().all(|arm| {\n                    arm.iter().any(|sub| {\n                        matches!(\n                            sub.kind(),\n                            jsonschema::error::ValidationErrorKind::Required { property }\n                                if property.as_str() == Some(\"type\")\n                        )\n                    })\n                });\n            if missing_tag {\n                if variants.is_empty() {\n                    format!(\"value at {path} is missing required field `type`\")\n                } else {\n                    format!(\n                        \"value at {path} is missing required field `type` (expected one of: {})\",\n                        variants.join(\", \")\n                    )\n                }\n            } else if variants.is_empty() {\n                let detail = context\n                    .iter()\n                    .flatten()\n                    .next()\n                    .map(|sub| format!(\": {}\", truncate_error(&sub.to_string())))\n                    .unwrap_or_default();\n                format!(\"value at {path} does not match any allowed shape{detail}\")\n            } else {\n                format!(\n                    \"value at {path} does not match any allowed shape (expected one of: {})\",\n                    variants.join(\", \")\n                )\n            }\n        }\n        _ => format!(\"{} (at {path})\", truncate_error(&err.to_string())),\n    }\n}\n\n/// `const`/`enum` tag values of a `oneOf`/`anyOf` arm list, resolved\n/// through `err.schema_path` (which points at the failing keyword).\nfn tag_variants(schema: &Value, err: &jsonschema::ValidationError<'_>) -> Vec<String> {\n    let Some(arms) = schema\n        .pointer(&err.schema_path().to_string())\n        .and_then(Value::as_array)\n    else {\n        return Vec::new();\n    };\n    arms.iter()\n        .filter_map(|arm| {\n            arm.pointer(\"/properties/type/const\")\n                .and_then(Value::as_str)\n                .or_else(|| {\n                    arm.pointer(\"/properties/type/enum/0\")\n                        .and_then(Value::as_str)\n                })\n                .map(str::to_owned)\n        })\n        .collect()\n}\n\n/// Kinds like `enum`/`const`/`pattern` embed the whole instance in their\n/// Display; cap each rendered error so a multi-kilobyte argument cannot\n/// drown the actual complaint.\nfn truncate_error(message: &str) -> String {\n    const MAX_ERROR_BYTES: usize = 320;\n    if message.len() <= MAX_ERROR_BYTES {\n        message.to_owned()\n    } else {\n        let mut end = MAX_ERROR_BYTES;\n        while !message.is_char_boundary(end) {\n            end -= 1;\n        }\n        format!(\"{}…\", &message[..end])\n    }\n}\n\n/// Validate raw `args` against the schemars-generated schema of `A`.\n#[cfg(test)]\npub(crate) fn validate_args<A: JsonSchema>(args: &Value) -> Result<(), ToolError> {\n    validate_args_with_schema(&args_schema::<A>(), args)\n}\n\n/// Blanket type erasure: every [`Tool`] is a [`ToolDyn`]. Deserializes\n/// `Value → Args` after validating it against `self.params_schema()`,\n/// so wrong-shaped arguments are rejected with\n/// [`ToolError::InvalidArgs`] before the tool runs.\nimpl<T: Tool> ToolDyn for T {\n    fn spec(&self) -> ToolSpec {\n        let mut params_schema = self.params_schema();\n        normalize_tool_schema(&mut params_schema);\n        ToolSpec {\n            name: self.name().to_owned(),\n            description: self.description().to_owned(),\n            params_schema,\n        }\n    }\n\n    fn prompt_snippet_dyn(&self) -> Option<&str> {\n        Tool::prompt_snippet(self)\n    }\n\n    fn search_access(&self) -> Option<SearchAccess> {\n        Tool::search_access(self)\n    }\n\n    fn requires_search_preflight(&self) -> bool {\n        Tool::requires_search_preflight(self)\n    }\n\n    fn file_access(&self) -> Option<FileAccess> {\n        Tool::file_access(self)\n    }\n\n    fn reads_only(&self) -> bool {\n        Tool::reads_only(self)\n    }\n\n    fn requires_file_preflight(&self) -> bool {\n        Tool::requires_file_preflight(self)\n    }\n\n    fn parallel_safe(&self) -> bool {\n        Tool::parallel_safe(self)\n    }\n\n    fn execute_dyn<'a>(\n        &'a self,\n        args: Value,\n        ctx: &'a ToolCtx,\n        out: &'a mut ToolStream,\n    ) -> Pin<Box<dyn Future<Output = Result<ToolResult, ToolError>> + Send + 'a>> {\n        Box::pin(async move {\n            let mut args = self.prepare_args(normalize_tool_args(args));\n            let check = args_check(self)?;\n            repair_args(&mut args, &check.schema);\n            check.validate(&args)?;\n            let typed = serde_json::from_value(args)\n                .map_err(|err| ToolError::InvalidArgs(err.to_string()))?;\n            self.execute(typed, ctx, out).await\n        })\n    }\n}\n\nmod args;\n\npub use args::{normalize_tool_args, repair_args};\n\n#[cfg(test)]\nmod tests;\n","crates/mycode-tools/src/registry.rs":"//! `ToolRegistry` — name-keyed store of type-erased tools. See `wiki/index.html`.\n//!\n//! Registration is **last-wins** per name: a later registration replaces an\n//! earlier tool under the same name. Specs are\n//! served sorted by tool name so provider requests serialize\n//! deterministically.\n\nuse parking_lot::{RwLock, RwLockReadGuard, RwLockWriteGuard};\nuse std::collections::BTreeMap;\nuse std::sync::Arc;\n\nuse mycode_providers::tool::ToolSpec;\n\nuse crate::tool::ToolDyn;\n\nstruct RegistryInner {\n    tools: BTreeMap<String, Arc<dyn ToolDyn>>,\n    /// Built under the same lock as `tools`, so a registration cannot\n    /// publish a spec list that no longer matches the map.\n    specs: Option<Arc<[ToolSpec]>>,\n}\n\n/// Thread-safe registry of tools, keyed by name.\npub struct ToolRegistry {\n    inner: RwLock<RegistryInner>,\n}\n\nimpl ToolRegistry {\n    pub fn new() -> Self {\n        Self {\n            inner: RwLock::new(RegistryInner {\n                tools: BTreeMap::new(),\n                specs: None,\n            }),\n        }\n    }\n\n    /// Register a tool. If a tool with the same name is already\n    /// registered, the new one replaces it (last-wins — plugins may\n    /// override builtins).\n    pub fn register(&self, tool: Arc<dyn ToolDyn>) {\n        let name = tool.spec().name;\n        let mut inner = self.write();\n        inner.tools.insert(name, tool);\n        inner.specs = None;\n    }\n\n    pub fn get(&self, name: &str) -> Option<Arc<dyn ToolDyn>> {\n        self.read().tools.get(name).cloned()\n    }\n\n    /// Specs of all registered tools, sorted by tool name for stable\n    /// provider serialization.\n    pub fn specs(&self) -> Arc<[ToolSpec]> {\n        if let Some(cached) = self.read().specs.clone() {\n            return cached;\n        }\n        let mut inner = self.write();\n        if let Some(cached) = inner.specs.clone() {\n            return cached;\n        }\n        let built: Arc<[ToolSpec]> = inner.tools.values().map(|tool| tool.spec()).collect();\n        inner.specs = Some(Arc::clone(&built));\n        built\n    }\n\n    /// Names and optional prompt snippets of all registered tools, sorted by name.\n    pub fn prompt_entries(&self) -> Vec<(String, Option<String>)> {\n        self.read()\n            .tools\n            .iter()\n            .map(|(name, tool)| {\n                (\n                    name.clone(),\n                    tool.prompt_snippet_dyn().map(ToOwned::to_owned),\n                )\n            })\n            .collect()\n    }\n\n    /// Names of all registered tools, sorted.\n    pub fn names(&self) -> Vec<String> {\n        self.read().tools.keys().cloned().collect()\n    }\n\n    pub fn len(&self) -> usize {\n        self.read().tools.len()\n    }\n\n    pub fn is_empty(&self) -> bool {\n        self.read().tools.is_empty()\n    }\n\n    fn read(&self) -> RwLockReadGuard<'_, RegistryInner> {\n        self.inner.read()\n    }\n\n    fn write(&self) -> RwLockWriteGuard<'_, RegistryInner> {\n        self.inner.write()\n    }\n}\n\nimpl Default for ToolRegistry {\n    fn default() -> Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::ToolRegistry;\n\n    #[test]\n    fn specs_stay_sorted_and_byte_identical() {\n        let registry = ToolRegistry::new();\n        crate::builtin::register_builtins(&registry);\n        let specs = registry.specs();\n        let names: Vec<_> = specs.iter().map(|spec| spec.name.as_str()).collect();\n        let mut sorted = names.clone();\n        sorted.sort_unstable();\n        assert_eq!(names, sorted);\n        let first = serde_json::to_string(&*specs).unwrap();\n        let second = serde_json::to_string(&*registry.specs()).unwrap();\n        assert_eq!(first, second);\n    }\n}\n","crates/mycode-core/src/lib.rs":"//! `mycode-core` — the shared vocabulary every other crate speaks.\n//!\n//! Conversation data (messages, content blocks, usage, events, ids, tool\n//! specs) plus the provider port ([`provider`]): request, error, and bounded\n//! stream contracts only. Leaf crate: no MYCode dependencies.\n\npub mod attachments;\npub mod error;\npub mod events;\npub mod ids;\npub mod message;\npub mod provider;\npub mod tool;\n\n/// Global allocator for every binary that links this leaf crate (the whole\n/// chain does). A second `#[global_allocator]` in the graph is a compile\n/// error, which is the intended guard.\n#[global_allocator]\nstatic GLOBAL: mimalloc::MiMalloc = mimalloc::MiMalloc;\n\npub use attachments::{\n    AttachError, Attachments, IMAGE_MEDIA_TYPES, ImageAttachment, MAX_ATTACHED_FILES,\n    MAX_ATTACHED_IMAGES, MAX_FILE_BYTES, MAX_FILES_BYTES, MAX_IMAGE_BASE64_BYTES, MAX_IMAGE_BYTES,\n    MAX_MESSAGE_IMAGE_BASE64_BYTES, StoredUserMessage, TextAttachment, image_media_type,\n};\npub use error::MycodeError;\npub use events::{AgentEvent, MessageDelta, TurnOutcome};\npub use ids::CallId;\npub use message::{\n    AssistantMessage, BinaryData, ContentBlock, INTERRUPTED_RESPONSE_PREFIX, Message,\n    SharedMessage, StopReason, TextBlock, ThinkingBlock, ToolCall, ToolResultMessage,\n    USER_INTERRUPT_DETAIL, Usage, UserMessage, interrupted_response_text, pair_tool_results,\n    strip_user_interruption, tool_label, tool_target,\n};\n#[doc(inline)]\npub use provider::{\n    EventStream, EventStreamSender, JsonBoundError, MAX_REQUEST_ENCODED_BYTES, Provider,\n    ProviderError, ProviderErrorKind, ReasoningLevel, Request, StreamEvent,\n    check_encoded_json_bound, encoded_json_len,\n};\npub use tool::{ToolSpec, inline_schema_refs};\n\n/// Returns the wall-clock duration since the Unix epoch, saturating at zero\n/// when the system clock predates the epoch.\n#[must_use]\npub fn unix_now() -> std::time::Duration {\n    std::time::SystemTime::now()\n        .duration_since(std::time::UNIX_EPOCH)\n        .unwrap_or_default()\n}\n","crates/mycode-core/src/message.rs":"//! Message model: the shared conversation values exchanged by the user, the\n//! model, and tools.\n//!\n//! Serde uses the default externally-tagged representation. Wire encoding\n//! belongs to `mycode-providers`; durable session encoding belongs to\n//! `mycode-agent`. See `wiki/index.html`.\n\nuse std::sync::Arc;\n\nuse serde::{Deserialize, Deserializer, Serialize, Serializer};\n\n/// One history entry shared by the agent, the provider request, and live\n/// events. Cloning bumps a refcount instead of copying tool output.\npub type SharedMessage = Arc<Message>;\n\n/// One entry in a conversation history.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub enum Message {\n    /// A message authored by the user (prompts).\n    User(UserMessage),\n    /// A message produced by the model.\n    Assistant(AssistantMessage),\n    /// The result of executing a tool call.\n    ToolResult(ToolResultMessage),\n}\n\n/// A user-authored message.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct UserMessage {\n    pub content: Vec<ContentBlock>,\n}\n\nimpl UserMessage {\n    /// Builds a plain-text user message.\n    pub fn text(text: impl Into<String>) -> Self {\n        Self {\n            content: vec![ContentBlock::Text(TextBlock::new(text))],\n        }\n    }\n}\n\n/// A model-produced message: ordered content blocks plus turn metadata.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct AssistantMessage {\n    pub blocks: Vec<ContentBlock>,\n    /// Token usage as reported by the provider, when available.\n    pub usage: Option<Usage>,\n    pub stop_reason: StopReason,\n}\n\nimpl AssistantMessage {\n    /// Concatenated text of all text content blocks.\n    #[must_use]\n    pub fn text(&self) -> String {\n        self.blocks\n            .iter()\n            .filter_map(|block| match block {\n                ContentBlock::Text(text) => Some(text.text.as_str()),\n                _ => None,\n            })\n            .collect()\n    }\n}\n\n/// A single unit of message content.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub enum ContentBlock {\n    /// Plain text.\n    Text(TextBlock),\n    /// Model reasoning (\"thinking\") content.\n    Thinking(ThinkingBlock),\n    /// A request to invoke a tool.\n    ToolCall(ToolCall),\n    /// Binary payload (currently only used for images).\n    Image(BinaryData),\n}\n\n/// Plain text content.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct TextBlock {\n    /// The text itself.\n    pub text: String,\n}\n\nimpl TextBlock {\n    /// Creates plain text.\n    pub fn new(text: impl Into<String>) -> Self {\n        Self { text: text.into() }\n    }\n}\n\nimpl From<String> for TextBlock {\n    fn from(text: String) -> Self {\n        Self::new(text)\n    }\n}\n\nimpl Serialize for TextBlock {\n    fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n    where\n        S: Serializer,\n    {\n        self.text.serialize(serializer)\n    }\n}\n\nimpl<'de> Deserialize<'de> for TextBlock {\n    fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>\n    where\n        D: Deserializer<'de>,\n    {\n        String::deserialize(deserializer).map(Self::new)\n    }\n}\n\n/// Human-visible model reasoning or summary text.\n///\n/// The optional `signature` carries provider reasoning-integrity fields (e.g.\n/// Anthropic thinking signatures). Adapters must preserve it verbatim across\n/// round-trips, including signature-only blocks whose `text` is empty.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct ThinkingBlock {\n    /// The reasoning text.\n    pub text: String,\n    /// Provider reasoning-integrity signature, when present.\n    #[serde(default, skip_serializing_if = \"Option::is_none\")]\n    pub signature: Option<String>,\n    /// Vendor replay blob for the next request on the same wire.\n    ///\n    /// MiniMax stores either `{\"reasoning_details\":[...]}` (the original\n    /// array, replayed verbatim) or `{\"reasoning_content\":true}` when `text`\n    /// itself is `reasoning_content`. Anthropic stores\n    /// `{\"redacted_thinking\":\"<data>\"}` for an encrypted block that has no\n    /// text. Absent on older turns and on providers that do not use this\n    /// field. Anthropic signatures stay on `signature`.\n    #[serde(default, skip_serializing_if = \"Option::is_none\")]\n    pub replay: Option<String>,\n}\n\nimpl ThinkingBlock {\n    /// Creates reasoning text without a signature.\n    pub fn new(text: impl Into<String>) -> Self {\n        Self {\n            text: text.into(),\n            signature: None,\n            replay: None,\n        }\n    }\n\n    /// Attaches a provider signature.\n    #[must_use]\n    pub fn with_signature(mut self, signature: impl Into<String>) -> Self {\n        self.signature = Some(signature.into());\n        self\n    }\n\n    /// Attaches a vendor replay blob (Chat Completions reasoning details,\n    /// Anthropic redacted thinking). An empty blob is ignored.\n    #[must_use]\n    pub fn with_replay(mut self, replay: impl Into<String>) -> Self {\n        let replay = replay.into();\n        self.replay = (!replay.is_empty()).then_some(replay);\n        self\n    }\n}\n\n/// A tool invocation requested by the model.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct ToolCall {\n    /// Provider-assigned call id (opaque string; matched by\n    /// [`ToolResultMessage::tool_call_id`]).\n    ///\n    /// The value is not a packed encoding. Adapters must not split or parse it\n    /// to recover other identifiers.\n    pub id: String,\n    /// Name of the tool to invoke.\n    pub name: String,\n    /// Arguments as raw JSON; validated against the tool's schema at dispatch\n    /// time (`mycode-tools`).\n    pub arguments: serde_json::Value,\n}\n\nimpl ToolCall {\n    /// Short target shown next to the tool name: a path, query, or command.\n    #[must_use]\n    pub fn target(&self) -> String {\n        tool_target(&self.name, &self.arguments)\n    }\n\n    /// Creates a tool call with an opaque provider-assigned id.\n    pub fn new(\n        id: impl Into<String>,\n        name: impl Into<String>,\n        arguments: serde_json::Value,\n    ) -> Self {\n        Self {\n            id: id.into(),\n            name: name.into(),\n            arguments,\n        }\n    }\n}\n\n/// One-line target for a tool call, taken from the arguments the model sent.\n///\n/// The UI shows this beside the tool name so a `read` is a path, not a black box.\n#[must_use]\npub fn tool_target(name: &str, arguments: &serde_json::Value) -> String {\n    let text = |key: &str| {\n        arguments\n            .get(key)\n            .and_then(serde_json::Value::as_str)\n            .unwrap_or(\"\")\n            .trim()\n            .to_owned()\n    };\n    let joined = match name {\n        \"read\" => {\n            let path = text(\"path\");\n            let offset = arguments.get(\"offset\").and_then(serde_json::Value::as_u64);\n            let limit = arguments.get(\"limit\").and_then(serde_json::Value::as_u64);\n            match (offset, limit) {\n                (Some(start), Some(limit)) => format!(\"{path} L{start}+{limit}\"),\n                (Some(start), None) => format!(\"{path} L{start}\"),\n                (None, Some(limit)) => format!(\"{path} +{limit}\"),\n                (None, None) => path,\n            }\n        }\n        \"write\" | \"edit\" => text(\"path\"),\n        \"grep\" | \"find\" => join_target(&text(\"pattern\"), &text(\"path\")),\n        \"shell\" | \"powershell\" | \"bash\" | \"zsh\" | \"sh\" | \"cmd\" => {\n            if text(\"mode\") == \"program\" {\n                let args = arguments\n                    .get(\"args\")\n                    .and_then(serde_json::Value::as_array)\n                    .map(|items| {\n                        items\n                            .iter()\n                            .filter_map(serde_json::Value::as_str)\n                            .collect::<Vec<_>>()\n                            .join(\" \")\n                    })\n                    .unwrap_or_default();\n                join_target(&text(\"program\"), &args)\n            } else {\n                text(\"command\")\n            }\n        }\n        // Retired tools. The arms stay so old session ledgers replay with the\n        // description the model originally sent.\n        \"web_search\" => text(\"query\"),\n        \"fetch_content\" => arguments\n            .get(\"urls\")\n            .and_then(serde_json::Value::as_array)\n            .and_then(|items| items.first())\n            .and_then(serde_json::Value::as_str)\n            .unwrap_or(\"\")\n            .trim()\n            .to_owned(),\n        \"search_tool\" | \"use_tool\" => text(\"name\"),\n        \"agent\" => join_target(&text(\"agent\"), &text(\"description\")),\n        \"run_code\" => text(\"description\"),\n        _ => text(\"path\"),\n    };\n    let flat = joined.split_whitespace().collect::<Vec<_>>().join(\" \");\n    flat.chars().take(160).collect()\n}\n\n/// Display label: `read  src/main.rs`. The name stays the first token.\n#[must_use]\npub fn tool_label(name: &str, target: &str) -> String {\n    let target = target.trim();\n    if target.is_empty() {\n        name.to_owned()\n    } else {\n        format!(\"{name}  {target}\")\n    }\n}\n\nfn join_target(left: &str, right: &str) -> String {\n    match (left.is_empty(), right.is_empty()) {\n        (true, true) => String::new(),\n        (false, true) => left.to_owned(),\n        (true, false) => right.to_owned(),\n        // The caller flattens whitespace runs, so a single space is what the\n        // UI sees.\n        (false, false) => format!(\"{left} {right}\"),\n    }\n}\n\n/// The outcome of executing a tool call.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct ToolResultMessage {\n    /// Id of the [`ToolCall`] this answers.\n    pub tool_call_id: String,\n    /// Content visible to the model.\n    pub content: Vec<ContentBlock>,\n    pub is_error: bool,\n    /// Structured details for the UI layer only — never enters LLM context\n    /// (structured diffs, cwd, …). Splitting `details` from `content` keeps\n    /// tokens out of the model loop (pi's ToolResult pattern).\n    pub details: Option<serde_json::Value>,\n}\n\n/// Why the model stopped generating.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub enum StopReason {\n    /// Natural end of turn.\n    Stop,\n    /// The model wants to call tools.\n    ToolUse,\n    /// Output was cut off by a length/token limit.\n    Length,\n    /// Generation ended because of an error.\n    Error,\n}\n\n/// Detail spelling committed when the user stops a turn. Frontends show\n/// their own cancel banner, so display projections strip the line this\n/// detail produces while model-facing history keeps it.\npub const USER_INTERRUPT_DETAIL: &str = \"interrupted by user\";\n\n/// Start of every [`interrupted_response_text`] line. Frontends match the\n/// whole prefix, not a bare `[error]`, so build output the model quotes\n/// (sbt prints `[error] …`) stays answer text.\npub const INTERRUPTED_RESPONSE_PREFIX: &str = \"[error] the response was interrupted:\";\n\n/// Visible line kept with whatever thinking and text already arrived when a\n/// provider stream fails. Adapters and the agent share this spelling.\n#[must_use]\npub fn interrupted_response_text(detail: &str) -> String {\n    const MAX_DETAIL_CHARS: usize = 240;\n    let mut flat = String::new();\n    let mut kept = 0usize;\n    for ch in detail.chars() {\n        if kept >= MAX_DETAIL_CHARS {\n            break;\n        }\n        if ch.is_control() {\n            if !flat.ends_with(' ') {\n                flat.push(' ');\n                kept += 1;\n            }\n            continue;\n        }\n        flat.push(ch);\n        kept += 1;\n    }\n    let flat = flat.trim();\n    let detail = if flat.is_empty() {\n        \"the response ended early\"\n    } else {\n        flat\n    };\n    format!(\"{INTERRUPTED_RESPONSE_PREFIX} {detail}\")\n}\n\n/// Removes a trailing [`interrupted_response_text`] line written with\n/// [`USER_INTERRUPT_DETAIL`]. The note stays in the committed message —\n/// replayed context tells the model its reply was cut — but a transcript\n/// row duplicates the frontends' cancel banner. Other interruption\n/// details stay visible: they are the only record of a real failure.\npub fn strip_user_interruption(text: &mut String) {\n    let note = interrupted_response_text(USER_INTERRUPT_DETAIL);\n    if !text.ends_with(note.as_str()) {\n        return;\n    }\n    text.truncate(text.len() - note.len());\n    text.truncate(text.trim_end().len());\n    // A reply that was only the marker leaves whitespace, not an empty row.\n    if text.trim().is_empty() {\n        text.clear();\n    }\n}\n\n/// Result text for a call the history never answered.\nconst UNANSWERED_CALL_TEXT: &str = \"tool call has no recorded result: the turn ended before \\\n    it finished (an interrupt, a crash, or the app closing). Its effects, if any, are unknown; \\\n    check before relying on them.\";\n\n/// Makes the tool-call pairing of `messages` valid for every wire.\n///\n/// Providers reject an assistant `tool_call` that no result answers, and a\n/// result whose call is not on the assistant message right before it. A\n/// replayed ledger can hold either shape after a crash, a closed window, or\n/// a turn that stopped recording mid-tool; without this every later request\n/// in the session fails. Each run of results after an assistant message\n/// keeps one result per call, in the run's order; missing calls get an\n/// error result appended in call order; stray results are dropped.\n///\n/// The edit is deterministic, so repeated requests send identical bytes and\n/// the provider prefix cache holds. Returns whether anything changed.\npub fn pair_tool_results(messages: &mut Vec<SharedMessage>) -> bool {\n    if tool_pairing_is_valid(messages) {\n        return false;\n    }\n    let mut paired = Vec::with_capacity(messages.len());\n    let mut index = 0;\n    while index < messages.len() {\n        let message = &messages[index];\n        index += 1;\n        let calls: Vec<&str> = match message.as_ref() {\n            Message::Assistant(assistant) => assistant_call_ids(assistant).collect(),\n            // A result that follows no assistant call list is stray.\n            Message::ToolResult(_) => continue,\n            Message::User(_) => Vec::new(),\n        };\n        paired.push(Arc::clone(message));\n        if calls.is_empty() {\n            continue;\n        }\n        let mut answered: Vec<&str> = Vec::with_capacity(calls.len());\n        while let Some(next) = messages.get(index) {\n            let Message::ToolResult(result) = next.as_ref() else {\n                break;\n            };\n            index += 1;\n            let id = result.tool_call_id.as_str();\n            if calls.contains(&id) && !answered.contains(&id) {\n                answered.push(id);\n                paired.push(Arc::clone(next));\n            }\n        }\n        for id in calls {\n            if !answered.contains(&id) {\n                paired.push(Arc::new(Message::ToolResult(ToolResultMessage {\n                    tool_call_id: id.to_owned(),\n                    content: vec![ContentBlock::Text(TextBlock::new(UNANSWERED_CALL_TEXT))],\n                    is_error: true,\n                    details: None,\n                })));\n            }\n        }\n    }\n    *messages = paired;\n    true\n}\n\nfn assistant_call_ids(assistant: &AssistantMessage) -> impl Iterator<Item = &str> {\n    assistant.blocks.iter().filter_map(|block| match block {\n        ContentBlock::ToolCall(call) => Some(call.id.as_str()),\n        _ => None,\n    })\n}\n\n/// The cheap check: every call answered exactly once right after its\n/// assistant message, and no result anywhere else.\nfn tool_pairing_is_valid(messages: &[SharedMessage]) -> bool {\n    let mut index = 0;\n    while index < messages.len() {\n        let message = &messages[index];\n        index += 1;\n        let calls: Vec<&str> = match message.as_ref() {\n            Message::Assistant(assistant) => assistant_call_ids(assistant).collect(),\n            Message::ToolResult(_) => return false,\n            Message::User(_) => continue,\n        };\n        let mut answered = 0usize;\n        while let Some(next) = messages.get(index) {\n            let Message::ToolResult(result) = next.as_ref() else {\n                break;\n            };\n            index += 1;\n            let id = result.tool_call_id.as_str();\n            let duplicate = messages[index - answered - 1..index - 1]\n                .iter()\n                .any(|earlier| matches!(earlier.as_ref(), Message::ToolResult(seen) if seen.tool_call_id == id));\n            if !calls.contains(&id) || duplicate {\n                return false;\n            }\n            answered += 1;\n        }\n        if answered != calls.len() {\n            return false;\n        }\n    }\n    true\n}\n\n/// Token usage reported by a provider.\n#[derive(Debug, Clone, Copy, Default, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct Usage {\n    pub input_tokens: u64,\n    pub output_tokens: u64,\n    /// Prompt tokens served from the provider cache, when reported.\n    #[serde(default)]\n    pub cache_read_tokens: Option<u64>,\n    /// Prompt tokens written into the provider cache, when reported.\n    #[serde(default)]\n    pub cache_write_tokens: Option<u64>,\n    /// Prompt size for the context meter.\n    ///\n    /// OpenAI-style `prompt_tokens` already includes cache reads. Anthropic\n    /// `input_tokens` excludes them, so adapters set this to the sum.\n    #[serde(default)]\n    pub prompt_tokens: u64,\n}\n\n/// Binary content (base64) with its MIME type.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct BinaryData {\n    /// Base64-encoded bytes, as expected by provider image APIs.\n    pub data: String,\n    /// MIME type, e.g. `\"image/png\"`.\n    pub mime_type: String,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{\n        USER_INTERRUPT_DETAIL, interrupted_response_text, strip_user_interruption, tool_target,\n    };\n    use serde_json::json;\n\n    #[test]\n    fn shell_and_agent_targets_ignore_retired_names() {\n        let script = json!({\"mode\": \"script\", \"command\": \"echo hi\"});\n        assert_eq!(tool_target(\"shell\", &script), \"echo hi\");\n        assert_eq!(tool_target(\"powershell\", &script), \"echo hi\");\n        assert_eq!(tool_target(\"bash\", &script), \"echo hi\");\n        let program = json!({\n            \"mode\": \"program\",\n            \"program\": \"/bin/echo\",\n            \"args\": [\"ok\"]\n        });\n        assert_eq!(tool_target(\"shell\", &program), \"/bin/echo ok\");\n        let delegated = json!({\"agent\": \"scout\", \"description\": \"map the crate\"});\n        assert_eq!(tool_target(\"agent\", &delegated), \"scout map the crate\");\n        assert_eq!(tool_target(\"task\", &delegated), \"\");\n        assert_eq!(tool_target(\"exec\", &program), \"\");\n    }\n\n    #[test]\n    fn tool_pairing_answers_missing_calls_and_drops_strays() {\n        use super::{\n            AssistantMessage, ContentBlock, Message, StopReason, ToolCall, ToolResultMessage,\n            UserMessage, pair_tool_results,\n        };\n        use std::sync::Arc;\n\n        let assistant = |ids: &[&str]| {\n            Arc::new(Message::Assistant(AssistantMessage {\n                blocks: ids\n                    .iter()\n                    .map(|id| ContentBlock::ToolCall(ToolCall::new(*id, \"read\", json!({}))))\n                    .collect(),\n                usage: None,\n                stop_reason: StopReason::ToolUse,\n            }))\n        };\n        let result = |id: &str| {\n            Arc::new(Message::ToolResult(ToolResultMessage {\n                tool_call_id: id.to_owned(),\n                content: Vec::new(),\n                is_error: false,\n                details: None,\n            }))\n        };\n        let user = |text: &str| Arc::new(Message::User(UserMessage::text(text)));\n        let shape = |messages: &[Arc<Message>]| -> Vec<String> {\n            messages\n                .iter()\n                .map(|message| match message.as_ref() {\n                    Message::User(_) => \"user\".to_owned(),\n                    Message::Assistant(_) => \"assistant\".to_owned(),\n                    Message::ToolResult(result) => format!(\n                        \"{}{}\",\n                        result.tool_call_id,\n                        if result.is_error { \"!\" } else { \"\" }\n                    ),\n                })\n                .collect()\n        };\n\n        // Valid histories are left alone.\n        let mut valid = vec![user(\"go\"), assistant(&[\"a\", \"b\"]), result(\"b\"), result(\"a\")];\n        assert!(!pair_tool_results(&mut valid));\n        assert_eq!(shape(&valid), [\"user\", \"assistant\", \"b\", \"a\"]);\n\n        // A crash after the assistant step: `b` never got a result, a stray\n        // result trails a user message, and `a` was recorded twice.\n        let mut broken = vec![\n            user(\"go\"),\n            assistant(&[\"a\", \"b\"]),\n            result(\"a\"),\n            result(\"a\"),\n            user(\"next\"),\n            result(\"zz\"),\n            assistant(&[\"c\"]),\n        ];\n        assert!(pair_tool_results(&mut broken));\n        assert_eq!(\n            shape(&broken),\n            [\"user\", \"assistant\", \"a\", \"b!\", \"user\", \"assistant\", \"c!\"]\n        );\n        // The repair is stable: a second pass changes nothing.\n        assert!(!pair_tool_results(&mut broken));\n    }\n\n    #[test]\n    fn retired_run_code_replays_from_its_description() {\n        let args = json!({\"code\": \"print(1)\", \"description\": \"plot the data\"});\n        assert_eq!(tool_target(\"run_code\", &args), \"plot the data\");\n    }\n\n    #[test]\n    fn interruption_note_flattens_controls_and_caps_length() {\n        assert_eq!(\n            interrupted_response_text(\"plain detail\"),\n            \"[error] the response was interrupted: plain detail\"\n        );\n        // Control characters collapse into one space, and an all-control\n        // detail falls back to the generic line.\n        assert_eq!(\n            interrupted_response_text(\"a\\r\\n\\r\\n\\tb\"),\n            \"[error] the response was interrupted: a b\"\n        );\n        assert_eq!(\n            interrupted_response_text(\"\\r\\n\\t\"),\n            \"[error] the response was interrupted: the response ended early\"\n        );\n        // The budget counts characters, not bytes, so multibyte text keeps\n        // its full width.\n        let wide = \"汉\".repeat(300);\n        let note = interrupted_response_text(&wide);\n        let expected = format!(\"[error] the response was interrupted: {}\", \"汉\".repeat(240));\n        assert_eq!(note, expected);\n    }\n\n    #[test]\n    fn strip_user_interruption_drops_only_the_cancel_line() {\n        let note = interrupted_response_text(USER_INTERRUPT_DETAIL);\n        // A bare marker — a cancel before any reply streamed — clears.\n        let mut bare = note.clone();\n        strip_user_interruption(&mut bare);\n        assert!(bare.is_empty());\n        // A partial reply keeps its text; the appended line goes.\n        let mut partial = format!(\"half an answer\\n{note}\");\n        strip_user_interruption(&mut partial);\n        assert_eq!(partial, \"half an answer\");\n        // Real failure details stay: they carry the only error record.\n        let mut failure = interrupted_response_text(\"the response ended early\");\n        strip_user_interruption(&mut failure);\n        assert_eq!(\n            failure,\n            \"[error] the response was interrupted: the response ended early\"\n        );\n        // A marker mid-text (not the tail) is the model's own output.\n        let mut inline = format!(\"{note}\\nmore after\");\n        strip_user_interruption(&mut inline);\n        assert_eq!(inline, format!(\"{note}\\nmore after\"));\n    }\n}\n","crates/mycode-config/src/lib.rs":"//! Strict owned configuration authorities for MYCode.\n//!\n//! [`HomeLayout`] resolves the owned home root lexically; authority files are\n//! lazy, bounded, strict JSON documents under locked owned-file machinery.\n//! Settings and secrets carry a revision CAS; advisory state is\n//! last-writer-wins. Unparseable product documents are copied aside and\n//! republished so startup can continue; session ledgers are not repaired.\n\n#![warn(missing_docs)]\n#![deny(unsafe_op_in_unsafe_fn)]\n\nmod authority;\nmod compaction;\nmod document_repair;\n// Private; shadows the forwarded `error` module path on purpose (root-level\n// error types are re-exported instead).\n#[allow(hidden_glob_reexports)]\nmod error;\nmod home;\nmod mcp_import;\nmod project_mcp;\nmod resources;\nmod secrets;\nmod secure_fs;\nmod settings;\nmod subagents;\nmod ui_state;\n\n// Chain re-export: successors see every lower layer through this crate only.\n#[doc(inline)]\npub use mycode_core::*;\n\n#[doc(inline)]\npub use authority::AuthorityRevision;\n#[doc(inline)]\npub use compaction::{\n    COMPACTION_FORMAT_VERSION, COMPACTION_KIND, CompactionCheckpoint, MAX_SUMMARY_CHARS,\n    read_compaction, write_compaction,\n};\npub use document_repair::{DocumentRepair, quarantine_owned_bytes};\npub use error::{ConfigError, ConfigErrorKind};\npub use home::{\n    HomeEnv, HomeLayout, NO_PROJECT_DIR, SCRATCH_DIR, SESSIONS_DIR, locate_session_dir,\n    new_session_dir, project_dir_key,\n};\npub use mcp_import::{normalize_api_key, parse_mcp_import, parse_mcp_library};\npub use project_mcp::{global_mcp_servers, project_mcp_servers};\n#[doc(inline)]\npub use resources::{\n    MAX_SKILLS, ResourceFile, SkillFile, discover_resources, discover_skills, os_user_home,\n    render_resource_prompt, render_skill_catalog, skill_read_roots,\n};\npub use secrets::{\n    MAX_SECRETS_BYTES, ProviderSecrets, SECRETS_FORMAT_VERSION, SECRETS_PATH,\n    read_provider_secrets, read_provider_secrets_with_repair, replace_provider_secrets,\n    salvage_provider_secrets, update_provider_key,\n};\n#[doc(inline)]\npub use secure_fs::owned_file::{locked_update_owned_file, read_owned_file};\n\n/// Test-only fixture writer: publishes `bytes` through the app's own secure\n/// transaction so the file carries the platform's private permissions (Unix\n/// 0600, Windows protected DACL) instead of the temp directory's inherited\n/// ones. Plain `std::fs::write` fixtures fail the read path's fail-closed\n/// owner/ACL checks on Windows.\n#[cfg(test)]\npub(crate) fn write_owned_test_bytes(\n    home: &HomeLayout,\n    relative: &str,\n    bytes: &[u8],\n) -> Result<(), ConfigError> {\n    locked_update_owned_file(home, relative, bytes.len().max(1), |_| Ok(bytes.to_vec()))\n}\n#[doc(inline)]\npub use settings::{\n    AppSettings, AppearanceSettings, DEFAULT_MAGPIE_BASE_URL, MAGPIE_KEY_PREFIX,\n    MAGPIE_PROVIDER_ID, MAGPIE_PROVIDER_NAME, MAX_AUTHORITY_DOCUMENT_BYTES, MAX_DISABLED_SKILLS,\n    MAX_HIDDEN_MODELS_PER_PROVIDER, MAX_MCP_ENV_VARS, MAX_MCP_SERVERS, MAX_MODELS_PER_PROVIDER,\n    MagpieSettings, McpServerSettings, PROXY_SCHEMES, ProviderSettings, ProxyPreference,\n    SETTINGS_FORMAT_VERSION, SETTINGS_PATH, SUBAGENT_CONCURRENCY, SkillsSettings,\n    SubagentRoleSettings, SubagentSettings, VALID_FONT_SIZES, VALID_LANGUAGES, VALID_THEMES,\n    is_mcp_executable, read_app_settings, read_app_settings_with_repair, replace_app_settings,\n    salvage_app_settings, split_command_line,\n};\n#[doc(inline)]\npub use subagents::{\n    RoleCatalog, RoleIsolation, RoleOrigin, RoleThinking, SubagentRole, builtin_roles,\n    discover_roles,\n};\n#[doc(inline)]\npub use ui_state::{\n    MAX_RECENT_PROJECTS, MAX_SESSION_PROJECTS, MAX_SESSION_WORKSPACES, MAX_WINDOW_EDGE_PX,\n    MAX_WORKSPACE_ROOTS, MAX_WORKSPACES, ModelPin, SessionModelPin, UiState, WindowSize,\n    WorkspaceDef, is_valid_effort_token, read_ui_state, read_ui_state_with_repair, remember_model,\n    replace_ui_state, salvage_ui_state, same_project_path, session_model, update_ui_state,\n    upsert_session_model,\n};\n","crates/mycode-config/src/settings.rs":"//! Strict product-settings authority for the MYCode frontends.\n//!\n//! [`AppSettings`] is the single settings document at `settings.json`: the\n//! desktop settings pages edit it through typed APIs and it is published with\n//! revision compare-and-swap through the hardened owned-file transaction.\n//! Secrets never live here; credentials stay in the secret store.\n//!\n//! A document that cannot be parsed or validated is copied aside and\n//! replaced: whatever still decodes and validates is kept, the rest is\n//! rebuilt from defaults, so startup can continue without re-entering whole\n//! sections. Session ledgers are not part of this document.\n\nmod magpie;\nmod mcp;\nmod providers;\nmod proxy;\nmod skills;\nmod subagent_roles;\n\npub use magpie::{\n    DEFAULT_MAGPIE_BASE_URL, MAGPIE_KEY_PREFIX, MAGPIE_PROVIDER_ID, MAGPIE_PROVIDER_NAME,\n    MagpieSettings,\n};\npub(crate) use mcp::{MAX_MCP_ARGS, MAX_MCP_HEADERS, is_env_var_name, is_header_name};\npub use mcp::{\n    MAX_MCP_ENV_VARS, MAX_MCP_SERVERS, McpServerSettings, is_mcp_executable, split_command_line,\n};\npub use providers::{MAX_HIDDEN_MODELS_PER_PROVIDER, MAX_MODELS_PER_PROVIDER, ProviderSettings};\npub use proxy::{PROXY_SCHEMES, ProxyPreference};\npub use skills::{MAX_DISABLED_SKILLS, SkillsSettings};\npub use subagent_roles::{SUBAGENT_CONCURRENCY, SubagentRoleSettings, SubagentSettings};\n\nuse serde::{Deserialize, Serialize};\n\nuse skills::skills_are_default;\nuse subagent_roles::subagents_are_default;\n\nuse crate::ConfigError;\nuse crate::authority::AuthorityRevision;\nuse crate::error::ConfigErrorKind;\nuse crate::secure_fs::owned_file::locked_update_owned_file;\n\n/// Settings document path below the owned home.\npub const SETTINGS_PATH: &str = \"settings.json\";\n/// Maximum encoded authority document size: 256 KiB.\n///\n/// The cap is domain-neutral on purpose: the compaction authority bounds\n/// its documents with the same limit.\npub const MAX_AUTHORITY_DOCUMENT_BYTES: usize = 256 * 1024;\n/// Settings format version.\npub const SETTINGS_FORMAT_VERSION: u32 = 1;\n/// Settings kind tag.\nconst SETTINGS_KIND: &str = \"mycode-app-settings\";\n/// Maximum string field length in bytes.\npub(crate) const MAX_FIELD_BYTES: usize = 8 * 1024;\n/// Base URL maximum length.\npub(super) const MAX_URL_BYTES: usize = 2 * 1024;\n\n/// Painted appearance: dark or light.\npub const VALID_THEMES: [&str; 2] = [\"dark\", \"light\"];\n\n/// UI language ids: follow the system, English, or Simplified Chinese.\npub const VALID_LANGUAGES: [&str; 3] = [\"auto\", \"en\", \"zh\"];\n\n/// Interface font-size ids, smallest to largest.\n///\n/// `s` / `m` / `l` / `xl` are 12 / 14 / 16 / 18 px of body text.\npub const VALID_FONT_SIZES: [&str; 4] = [\"s\", \"m\", \"l\", \"xl\"];\n\nfn default_language() -> String {\n    \"auto\".to_owned()\n}\n\nfn default_font_size() -> String {\n    \"m\".to_owned()\n}\n\n/// Appearance settings.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields)]\npub struct AppearanceSettings {\n    /// `dark` or `light`. Any other stored value fails validation, and\n    /// startup resets the document (keeping what still decodes).\n    pub theme: String,\n    /// `auto`, `en`, or `zh`.\n    #[serde(default = \"default_language\")]\n    pub language: String,\n    /// `s`, `m`, `l`, or `xl`. Missing values read as medium.\n    #[serde(default = \"default_font_size\")]\n    pub font_size: String,\n}\n\nimpl Default for AppearanceSettings {\n    fn default() -> Self {\n        Self {\n            theme: \"dark\".to_owned(),\n            language: default_language(),\n            font_size: default_font_size(),\n        }\n    }\n}\n\n/// The complete settings document.\n#[derive(Clone, Debug, Default, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields, default)]\npub struct AppSettings {\n    /// Outbound proxy: empty to follow the system proxy, or a proxy URL.\n    /// See [`ProxyPreference`].\n    #[serde(skip_serializing_if = \"String::is_empty\")]\n    pub proxy: String,\n    /// The local magpie gateway, written by magpie's agent plugin.\n    #[serde(default, skip_serializing_if = \"MagpieSettings::is_default\")]\n    pub magpie: MagpieSettings,\n    /// MCP servers.\n    pub mcp_servers: Vec<McpServerSettings>,\n    /// Appearance.\n    pub appearance: AppearanceSettings,\n    /// Requested reasoning effort; absent keeps the provider default.\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub reasoning_effort: Option<String>,\n    /// Subagent delegation settings.\n    #[serde(default, skip_serializing_if = \"subagents_are_default\")]\n    pub subagents: SubagentSettings,\n    /// Skills the user switched off.\n    #[serde(default, skip_serializing_if = \"skills_are_default\")]\n    pub skills: SkillsSettings,\n}\n\nimpl AppSettings {\n    /// Returns the effective appearance. Unknown values read as dark.\n    #[must_use]\n    pub fn effective_theme(&self) -> &'static str {\n        VALID_THEMES\n            .into_iter()\n            .find(|id| *id == self.appearance.theme)\n            .unwrap_or(\"dark\")\n    }\n\n    /// Returns the effective interface font size. Unknown values read as `m`.\n    #[must_use]\n    pub fn effective_font_size(&self) -> &'static str {\n        VALID_FONT_SIZES\n            .into_iter()\n            .find(|id| *id == self.appearance.font_size)\n            .unwrap_or(\"m\")\n    }\n\n    /// Validates the complete document.\n    ///\n    /// Family-specific bounds, grammar, and cross-field rules live in the\n    /// owning submodule and are invoked in a fixed order.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`ConfigErrorKind::AuthorityValidation`] for any bound,\n    /// grammar, or cross-field violation.\n    pub fn validate(&self) -> Result<(), ConfigError> {\n        let invalid =\n            |detail: &str| ConfigError::authority_rejection().with_detail(detail.to_owned());\n        self.validate_proxy().map_err(invalid)?;\n        if let Some(level) = self.reasoning_effort.as_deref()\n            && (level == \"default\" || crate::RoleThinking::parse(level).is_none())\n        {\n            return Err(invalid(\n                \"reasoningEffort: must be a models.dev option (off, none, on, minimal, low, medium, high, xhigh, max)\",\n            ));\n        }\n        self.validate_magpie()?;\n        self.validate_mcp()?;\n        if !VALID_THEMES.contains(&self.appearance.theme.as_str()) {\n            return Err(invalid(\"appearance.theme: must be dark or light\"));\n        }\n        if !VALID_LANGUAGES.contains(&self.appearance.language.as_str()) {\n            return Err(invalid(\"appearance.language: must be auto, en, or zh\"));\n        }\n        if !VALID_FONT_SIZES.contains(&self.appearance.font_size.as_str()) {\n            return Err(invalid(\"appearance.fontSize: must be s, m, l, or xl\"));\n        }\n        self.validate_subagent_roles()?;\n        self.validate_skills()?;\n        Ok(())\n    }\n}\n\n/// Reads and validates `settings.json`.\n///\n/// A missing document yields the defaults. A document that cannot be parsed\n/// or validated is backed up and replaced, keeping whatever still decodes;\n/// see [`read_app_settings_with_repair`].\n///\n/// # Errors\n///\n/// Returns [`ConfigError`] for owned-path security or when a damaged document\n/// can
