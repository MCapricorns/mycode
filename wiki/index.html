::Toast { kind, text });\n    }\n\n    /// Roles for the Agents settings page: built-ins first, then home and\n    /// project `agents` directories. Disk is read only when the cache is\n    /// empty, the open project changed, or the page was opened again.\n    pub fn ensure_agent_roles(&mut self) {\n        let project = self.vm.project_dir.clone();\n        if !self.agent_roles_stale\n            && self.agent_roles.is_some()\n            && self.agent_roles_project == project\n        {\n            return;\n        }\n        let root = project.as_deref().map(Path::new);\n        self.agent_roles = Some(Arc::new(mycode_app::discover_roles(&self.home, root)));\n        self.agent_roles_project = project;\n        self.agent_roles_stale = false;\n    }\n\n    /// Role catalog last resolved for settings. Built-ins only before the\n    /// first resolution. Shared, so a settings paint does not copy every\n    /// role prompt.\n    pub fn agent_roles(&self) -> Arc<mycode_app::RoleCatalog> {\n        self.agent_roles\n            .clone()\n            .unwrap_or_else(|| Arc::new(mycode_app::builtin_roles()))\n    }\n\n    /// Marks the roles cache dirty so the next read re-scans.\n    pub fn invalidate_agent_roles(&mut self) {\n        self.agent_roles_stale = true;\n    }\n\n    /// Reads the MCP servers magpie's Library writes, so the settings page,\n    /// its nav count, and the composer's `/` menu list one catalog.\n    pub(crate) fn reload_mcp_library(&mut self, out: &mut Vec<Effect>) {\n        let (servers, error) = match crate::global_mcp_servers(&self.home) {\n            Ok(servers) => (servers, None),\n            // The page shows the reason; an unreadable file must not look\n            // like an empty Library.\n            Err(message) => (Vec::new(), Some(message)),\n        };\n        self.act(FrontendAction::McpLibraryLoaded { servers, error }, out);\n    }\n\n    /// Loads the provider catalog the first time a surface needs it. The\n    /// document stays unparsed in the core until this request lands.\n    pub fn ensure_catalog(&mut self) {\n        if self.catalog_requested || self.vm.catalog.is_some() || !self.catalog_needed() {\n            return;\n        }\n        self.catalog_requested = true;\n        self.dispatch(BridgeCommand::GetCatalog);\n    }\n\n    /// A manual catalog reload; the reply is marked by\n    /// `pending_catalog_refresh` so it can surface a refreshed toast.\n    pub fn refresh_catalog(&mut self) {\n        self.pending_catalog_refresh = true;\n        self.dispatch(BridgeCommand::RefreshCatalog);\n    }\n\n    /// Whether a mounted surface reads the provider catalog document.\n    ///\n    /// The composer chips and the context meter consult it on every chat\n    /// paint — the model label, the thinking rungs, and the window that\n    /// sizes the ring all resolve through it — so a selected model counts\n    /// as a need with no menu open. With nothing selected there is nothing\n    /// to resolve and the fetch stays lazy.\n    fn catalog_needed(&self) -> bool {\n        let vm = &self.vm;\n        vm.model_menu_open\n            || vm.reasoning_menu_open\n            || vm.subagent_menu.is_some()\n            || vm.command_palette_open\n            || (vm.view == MainView::Settings\n                && matches!(\n                    vm.settings_section,\n                    crate::view_model::SettingsSection::Models\n                        | crate::view_model::SettingsSection::About\n                ))\n            || (vm.view == MainView::Chat\n                && (vm.selected_provider.is_some() || vm.selected_model.is_some()))\n    }\n\n    /// Records documents reset at startup and toasts their names once the\n    /// settings and UI replies have had a chance to arrive.\n    pub fn note_config_repairs(&mut self, repairs: &[mycode_app::DocumentRepair]) {\n        let mut added = false;\n        for repair in repairs {\n            if self\n                .repaired_configs\n                .iter()\n                .any(|existing| existing == repair.path)\n            {\n                continue;\n            }\n            self.repaired_configs.push(repair.path.to_owned());\n            added = true;\n        }\n        if added && !self.repair_toast_armed {\n            self.repair_toast_armed = true;\n            self.schedule(REPAIR_TOAST_DELAY, || DriverMsg::RepairToastTick);\n        }\n    }\n\n    /// Stops the core thread and waits for it to finish.\n    pub fn shutdown(&mut self) {\n        self.bridge.shutdown();\n    }\n}\n\nimpl Drop for FrontendDriver {\n    fn drop(&mut self) {\n        // The command sender must close before join; `shutdown` is explicit\n        // so a panicking unwind cannot leave the core running. It is\n        // idempotent, so an earlier explicit call makes this a no-op.\n        self.shutdown();\n    }\n}\n\npub(crate) fn parse_head(spelling: &str) -> HeadStamp {\n    if spelling == \"empty\" {\n        HeadStamp::Empty\n    } else {\n        SessionEventId::parse(spelling)\n            .map(HeadStamp::Event)\n            .unwrap_or(HeadStamp::Empty)\n    }\n}\n","crates/mycode-frontend/src/driver/pump.rs":"//! The driver thread's wake plumbing: a parked thread and the future\n//! resolver that rides on it.\n\nuse std::future::Future;\nuse std::sync::Arc;\nuse std::task::{Context, Poll, Wake, Waker};\n\n/// A thread that can be unparked by a [`Waker`]. Lets reply futures — a\n/// tokio oneshot each — resolve on plain threads without a runtime.\npub(super) struct Parker(std::thread::Thread);\n\nimpl Wake for Parker {\n    fn wake(self: Arc<Self>) {\n        self.0.unpark();\n    }\n\n    fn wake_by_ref(self: &Arc<Self>) {\n        self.0.unpark();\n    }\n}\n\n/// Resolves one future to completion on the calling thread.\npub(super) fn block_on<F: Future>(future: F) -> F::Output {\n    let waker = Waker::from(Arc::new(Parker(std::thread::current())));\n    let mut context = Context::from_waker(&waker);\n    let mut future = Box::pin(future);\n    loop {\n        match future.as_mut().poll(&mut context) {\n            Poll::Ready(output) => return output,\n            Poll::Pending => std::thread::park(),\n        }\n    }\n}\n","crates/mycode-frontend/src/view_model.rs":"//! Pure frontend view-model: state, actions, and reducer.\n//!\n//! This module tree has no GPUI dependency. The render layer turns\n//! [`WorkspaceState`] into elements and feeds [`FrontendAction`]s back, so the\n//! product behavior stays testable without a GPU or window. This file is the\n//! import facade; the declarations live in topical submodules and the\n//! transitions in [`reduce`].\nmod chat;\nmod command_palette;\nmod models;\npub mod nav;\nmod projects;\nmod settings;\nmod state;\nmod usage;\n\nmod reduce;\n// The transcript vocabulary is the core's protocol, not a rendering concern:\n// it is defined in `mycode-app` and re-exported here so render code keeps one\n// import path.\npub use mycode_app::{\n    ActiveConversation, CHAT_CANCELLED, ConversationEntry, EntryKind, SessionSummary,\n    StreamingReply,\n};\n\npub use self::chat::{\n    LiveJob, MentionGroup, MentionItem, MentionKind, capped_artisan_count, capped_artisan_status,\n    elapsed_label, session_title_matches, subagent_cancellable, subagent_wait_status,\n};\npub use self::command_palette::{\n    PaletteCatalog, PaletteCommand, PaletteGroup, PaletteGroupId, PaletteItem, palette_catalog,\n    palette_item,\n};\npub use self::models::{\n    effective_reasoning_level, model_context_window, model_display_name, provider_display_name,\n    rank_model_ids, selected_reasoning_level,\n};\npub use self::nav::{\n    DismissLayer, SettingsBack, highlight, moved, settings_back_target, top_dismiss_layer,\n};\npub use self::projects::{\n    has_open_folder, newest_session_in_project, open_session_is_empty, project_label,\n    project_of_session, same_project_path, session_rows, sessions_removed_with_root,\n    task_surface_visible,\n};\npub use self::reduce::{\n    ComposerSubmit, PREPARING_ROW_PREFIX, close_floating_menus, composer_submit, is_preparing_row,\n    preferred_slash_index, reasoning_levels_for, reduce, selected_model_supports_reasoning,\n    selected_reasoning_levels,\n};\npub use self::state::{MAX_COMPOSER_CHARS, WorkspaceState};\npub use self::usage::{\n    CacheAlert, ContextMeterParts, TurnStats, cache_alert_text, compact_count, context_meter_parts,\n    context_remaining_percent, turn_cache_hit,\n};\n\n// Kept public API: the `FrontendAction` vocabulary is `pub`, so its payload\n// types must be too (`private_interfaces`).\npub use self::settings::{McpSubview, ModelsSubview, SettingsSection, SettingsState, SkillEntry};\npub use self::state::{FrontendAction, MainView, ProxyTestState, UpdateState};\npub use self::usage::CacheBreak;\n","crates/mycode-frontend/src/view_model/state.rs":"//! Whole-window state and the action vocabulary the render layer feeds back.\n\nuse std::sync::Arc;\n\nuse mycode_app::{\n    ActiveConversation, AskPrompt, ConversationEntry, PreparedUpdate, SessionSummary,\n};\n\nuse super::chat::{ComposerMention, LiveJob};\nuse super::settings::{McpSubview, ModelsSubview, SettingsSection, SettingsState, SkillEntry};\nuse super::usage::{CacheAlert, CacheBreak, CacheWatch, TurnStats};\n\n/// The main area view: chat or full-page settings.\n#[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]\npub enum MainView {\n    /// Conversation with the agent.\n    #[default]\n    Chat,\n    /// Full-page visual settings.\n    Settings,\n}\n\n/// The settings page's proxy connectivity check.\n#[derive(Clone, Debug, Default, PartialEq, Eq)]\npub enum ProxyTestState {\n    /// No test has run for the value on screen.\n    #[default]\n    Idle,\n    /// A test request is in flight.\n    Testing,\n    /// The test ran; the report says which route it took and how it went.\n    Done(mycode_app::ProxyTestReport),\n    /// The value on screen is not a proxy setting.\n    Invalid(String),\n}\n\n/// Self-update progress shown in settings and banners.\n#[derive(Clone, Debug, Default, PartialEq, Eq)]\npub enum UpdateState {\n    /// No check has run yet.\n    #[default]\n    Idle,\n    /// A check is in flight.\n    Checking,\n    /// The running version is the latest.\n    UpToDate,\n    /// A newer release is published.\n    Available {\n        /// New version (no `v` prefix).\n        version: String,\n        /// Release page URL.\n        notes_url: String,\n    },\n    /// The update is downloading and verifying.\n    Downloading {\n        /// New version (no `v` prefix).\n        version: String,\n    },\n    /// The staged update is ready; a restart installs it.\n    Ready {\n        /// New version (no `v` prefix).\n        version: String,\n    },\n    /// The last check or download failed.\n    Failed(String),\n}\n\n/// Whole-window state.\n#[derive(Clone, Debug, Default)]\npub struct WorkspaceState {\n    /// Sidebar sessions, newest-relevant order preserved from the core.\n    pub sessions: Vec<SessionSummary>,\n    /// Open conversation, when any.\n    pub active: Option<ActiveConversation>,\n    /// Case-insensitive filter over the titles already in the session list.\n    pub session_filter: String,\n    /// An older transcript page is in flight for the open conversation.\n    pub history_loading: bool,\n    /// Composer draft text.\n    pub composer_draft: String,\n    /// Text typed on the welcome desk, sent once the new session is open.\n    pub pending_welcome_send: Option<String>,\n    /// Steers sent to the running turn that its ledger has not shown yet.\n    pub pending_steers: Vec<String>,\n    /// Steers a chat kept while another one was on screen, by session id.\n    /// They come back to the composer when that chat opens again.\n    pub parked_steers: Vec<(String, Vec<String>)>,\n    /// Every thinking trace shows as one collapsed row. Persisted in\n    /// `ui.json`; expanded by default.\n    pub thinking_collapsed: bool,\n    /// A send is in flight.\n    pub sending: bool,\n    /// Unix milliseconds when the in-flight turn armed. `0` while idle; a\n    /// reopened session counts from the reopen because the real start is\n    /// not carried over the wire.\n    pub turn_started_ms: u64,\n    /// A manual `/compact` is running. It is not a turn — no streaming\n    /// bubble — but it locks the composer the same way, so a send cannot\n    /// race the compaction's expected-head check.\n    pub compacting: bool,\n    /// The running turn waits on an automatic compaction summary. An\n    /// interrupt holds off until it ends, so the summary is not thrown away.\n    pub auto_compacting: bool,\n    /// Compaction cards held until the in-flight reply is committed.\n    ///\n    /// A mid-turn summary arrives after the tool rows and before `ChatDone`\n    /// appends the final reply. Inserting it immediately paints the card\n    /// above that reply; the ledger has the card after the reply. The cards\n    /// stay here until the turn commits, then they are appended last, in\n    /// order: a turn that compacts twice files two.\n    pub pending_summaries: Vec<ConversationEntry>,\n    /// Per-server tool names from the last listing, keyed by server id.\n    pub mcp_tools: Vec<(String, Vec<String>)>,\n    /// MCP servers magpie's Library writes to `~/.mycode/mcp.json`. They are\n    /// read-only here, and a configured server with the same id wins.\n    pub mcp_library: Vec<mycode_app::McpServerSettings>,\n    /// Why the Library's `mcp.json` could not be read, when it could not.\n    pub mcp_library_error: Option<String>,\n    /// MCP server ids with a tools probe in flight.\n    pub mcp_probing: Vec<String>,\n    /// Prompt resources for the open session: (name, path).\n    pub resources: Vec<(String, String)>,\n    /// Slash-command skills from the project and user `.agents` trees.\n    pub skills: Vec<SkillEntry>,\n    /// Placeholder rows for `agent` calls the model is still writing, in the\n    /// order it opened them. Kept out of the transcript entries: frontends\n    /// draw them after the streaming reply, and each one leaves when its\n    /// call starts (the started row then follows the committed step) or the\n    /// turn ends.\n    pub preparing_calls: Vec<ConversationEntry>,\n    /// Live `agent` runs for the inspector panel.\n    pub live_jobs: Vec<LiveJob>,\n    /// Final runtimes of finished subagent calls, `(call_id, ms)`. A row\n    /// looks its duration up here once the job left `live_jobs`.\n    pub job_elapsed: Vec<(String, u64)>,\n    /// Call id of the subagent detail window, when open.\n    pub subagent_window: Option<String>,\n    /// Whether the full working-tree changes drawer is open.\n    pub changes_panel_open: bool,\n    /// Whether the right inspector is open. It starts closed.\n    pub inspector_open: bool,\n    /// Whether a pinned inspector docks beside the chat instead of covering it.\n    pub inspector_pinned: bool,\n    /// Pending ask rows awaiting user answers.\n    pub pending_ask: Option<Vec<AskPrompt>>,\n    /// Draft answers aligned with [`Self::pending_ask`].\n    pub ask_answers: Vec<String>,\n    /// Most recent committed turn's timing and token metrics, promoted from\n    /// the live meter when the turn finishes.\n    pub last_turn: Option<TurnStats>,\n    /// Token counts for the turn that is still running, when the provider\n    /// has reported any. Cleared when the turn commits or fails.\n    pub live_turn: Option<TurnStats>,\n    /// Latest prompt size for the open session, in tokens. This is the last\n    /// provider-reported input count, not the sum of every tool round, and\n    /// it stays put when a send is interrupted.\n    pub context_used: u64,\n    /// Cache-read tokens on the latest prompt. `0` when the provider reported\n    /// none. Shown on the composer chip row and the inspector context meter.\n    pub context_cache: u64,\n    /// Armed after compaction, a steer, or a model switch until the next\n    /// prompt reports usage. The baseline is the hit percent already on the\n    /// meter.\n    pub cache_watch: Option<CacheWatch>,\n    /// Details warning after that prompt's cache hit collapses. Cleared when\n    /// a later prompt is warm again, or when the open session changes.\n    pub cache_alert: Option<CacheAlert>,\n    /// Active composer mention autocomplete, when a trigger is typed.\n    pub mention: Option<ComposerMention>,\n    /// The editable settings projection.\n    pub settings: Option<SettingsState>,\n    /// Last terminal error surfaced to the user.\n    pub error: Option<String>,\n    /// Red transcript-tail row for a turn that ended without a reply —\n    /// provider failure or a user stop. Cleared when the next turn arms or\n    /// the conversation leaves the screen; not part of the ledger, so a\n    /// reopened transcript does not show it again.\n    pub turn_alert: Option<String>,\n    /// Chat or settings main view.\n    pub view: MainView,\n    /// Settings navigation section.\n    pub settings_section: SettingsSection,\n    /// Whether the sidebar project switcher dropdown is open.\n    pub project_menu_open: bool,\n    /// The resolved provider catalog.\n    pub catalog: Option<Arc<mycode_app::catalog::CatalogDocument>>,\n    /// Unix seconds of the catalog's last successful cloud fetch.\n    pub catalog_fetched_at: u64,\n    /// The active workspace folder: the open chat's working directory when it\n    /// has one, otherwise the folder the desk last opened.\n    pub project_dir: Option<String>,\n    /// Recent project directories, most recent first.\n    pub recents: Vec<String>,\n    /// Session-to-project bindings (session id, project path), most recent\n    /// first. Restores each chat's tool working directory.\n    pub session_projects: Vec<(String, String)>,\n    /// Per-session provider, model, and reasoning. Newest first.\n    pub session_models: Vec<mycode_app::SessionModelPin>,\n    /// Workspace folders, most recently added first. Sessions bind one of\n    /// them as their working directory; the others stay reachable extras.\n    pub workspace_roots: Vec<String>,\n    /// Whether update checks run automatically.\n    pub auto_update: bool,\n    /// Self-update progress.\n    pub update: UpdateState,\n    /// The proxy connectivity check. Reset whenever the proxy value\n    /// changes, so a stale result never vouches for a new setting.\n    pub proxy_test: ProxyTestState,\n    /// Last persisted windowed size; written back on resize.\n    pub window_size: Option<mycode_app::WindowSize>,\n    /// Whether the update dialog (download/install prompt) is open.\n    pub update_dialog_open: bool,\n    /// The staged update waiting for a restart, when any.\n    pub prepared_update: Option<PreparedUpdate>,\n    /// The newest release offer, when one is available.\n    pub last_offer: Option<mycode_app::UpdateOffer>,\n    /// Selected provider id in the model picker.\n    pub selected_provider: Option<String>,\n    /// Selected model id for the selected provider.\n    pub selected_model: Option<String>,\n    /// Reasoning effort a fresh session starts from. The composer's last\n    /// pick; the per-session pin still overrides it once chosen.\n    pub default_reasoning: Option<String>,\n    /// Whether the model picker is open.\n    pub model_menu_open: bool,\n    /// Provider whose models the open picker is showing. `None` is the\n    /// provider step. Does not change the session until a model row is picked.\n    pub model_menu_browse: Option<String>,\n    /// Filter text for the model step of the picker.\n    pub picker_query: String,\n    /// Models picked from the session picker, newest first.\n    pub recent_models: Vec<mycode_app::ModelPin>,\n    /// Filter text for the settings navigation.\n    pub settings_query: String,\n    /// Whether the thinking-effort submenu is open.\n    pub reasoning_menu_open: bool,\n    /// Open Agents-page model picker: (role name, field). The field is\n    /// `model`.\n    pub subagent_menu: Option<(String, String)>,\n    /// Whether the General page's language dropdown is open.\n    pub language_menu_open: bool,\n    /// The Models settings sub-page.\n    pub models_subview: ModelsSubview,\n    /// The MCP settings sub-page.\n    pub mcp_subview: McpSubview,\n    /// Whether the custom MCP form's transport dropdown is open.\n    pub mcp_transport_menu_open: bool,\n    /// Whether the global command palette is open.\n    pub command_palette_open: bool,\n}\n\nimpl WorkspaceState {\n    /// Milliseconds the in-flight turn has been running. `0` when no turn\n    /// is armed or the clock was never stamped.\n    pub fn turn_elapsed_ms(&self) -> u64 {\n        if self.turn_started_ms == 0 || !self.sending {\n            return 0;\n        }\n        crate::unix_now()\n            .as_millis()\n            .saturating_sub(u128::from(self.turn_started_ms)) as u64\n    }\n\n    /// Final runtime of a finished subagent call, in milliseconds. The\n    /// latest entry wins when a call id was reused.\n    pub fn job_elapsed(&self, call_id: &str) -> Option<u64> {\n        self.job_elapsed\n            .iter()\n            .rev()\n            .find(|(id, _)| id == call_id)\n            .map(|(_, ms)| *ms)\n    }\n\n    /// Discovered skills minus the ones switched off on the Skills page.\n    /// The composer `/` menu and the command palette list only these.\n    pub fn enabled_skills(&self) -> Vec<SkillEntry> {\n        let disabled = self.settings.as_ref().map(|settings| &settings.skills);\n        self.skills\n            .iter()\n            .filter(|skill| disabled.is_none_or(|skills| skills.is_enabled(&skill.slug)))\n            .cloned()\n            .collect()\n    }\n}\n\n/// Everything the UI can do to the state.\n#[derive(Clone, Debug, PartialEq)]\npub enum FrontendAction {\n    /// The core returned the session list.\n    SessionsLoaded(Vec<SessionSummary>),\n    /// A session was created and opened.\n    SessionCreated(SessionSummary),\n    /// A generated title replaced one session row's stored title.\n    SessionTitled {\n        /// Session identity spelling.\n        session_id: String,\n        /// The generated title already stored in the index.\n        title: String,\n    },\n    /// A session finished recovery and its conversation is ready.\n    ConversationOpened(ActiveConversation),\n    /// The open session's data was deleted; drop the conversation.\n    SessionDeleted,\n    /// The open conversation belongs to another folder. Hide it without\n    /// deleting the session or stopping its turn.\n    ConversationParked,\n    /// The composer text changed.\n    ComposerChanged(String),\n    /// Hold welcome-desk text until the new session can take it.\n    WelcomeSendHeld(String),\n    /// The held welcome text was sent, or the create failed.\n    WelcomeSendConsumed,\n    /// The composer sent; the entry was durably committed.\n    MessageSent {\n        /// New head spelling.\n        head: String,\n        /// The committed entry.\n        entry: ConversationEntry,\n    },\n    /// A request failed.\n    Failed(String),\n    /// Settings loaded from the core.\n    SettingsLoaded(Box<SettingsState>),\n    /// The user picked a UI language (`auto`, `en`, `zh`); applies live and\n    /// persists with settings.\n    SettingsLanguageSelected(String),\n    /// The user picked dark or light; persists with settings.\n    SettingsThemeSelected(String),\n    /// The user picked an interface font size (`s`, `m`, `l`, `xl`).\n    SettingsFontSizeSelected(String),\n    /// Opens, closes, or pins the right inspector. Layout only.\n    InspectorChanged {\n        /// Whether the inspector is visible.\n        open: bool,\n        /// Whether it stays resident beside the conversation instead of floating.\n        pinned: bool,\n    },\n    /// The settings editor changed the proxy preference. `typed` edits come\n    /// from the URL field and save on the text debounce.\n    SettingsProxyChanged {\n        /// New stored value: empty (follow the system) or a valid proxy URL.\n        value: String,\n        /// Whether the URL field produced it.\n        typed: bool,\n    },\n    /// The settings editor changed subagent role routes.\n    SettingsSubagentsChanged(mycode_app::SubagentSettings),\n    /// The Skills page switched one skill on or off.\n    SettingsSkillToggled(String, bool),\n    /// The Agents-page model dropdown opened or closed.\n    SubagentMenuToggled(Option<(String, String)>),\n    /// The General-page language dropdown opened or closed.\n    LanguageMenuToggled(bool),\n    /// The settings editor added an MCP server.\n    SettingsMcpAdded(mycode_app::McpServerSettings),\n    /// The settings editor removed an MCP server.\n    SettingsMcpRemoved(usize),\n    /// The settings editor toggled an MCP server.\n    SettingsMcpToggled(usize, bool),\n    /// A tools probe started for one MCP server (the row shows a spinner\n    /// state until the listing or a failure arrives).\n    McpProbeStarted(String),\n    /// A server's tools listing arrived.\n    McpToolsListed {\n        server_id: String,\n        tools: Vec<String>,\n    },\n    /// A server's tools probe failed; the row shows the reason inline.\n    McpProbeFailed { server_id: String, message: String },\n    /// The magpie Library's MCP servers were read from `mcp.json`.\n    McpLibraryLoaded {\n        /// Servers in file order.\n        servers: Vec<mycode_app::McpServerSettings>,\n        /// Why the file could not be read, when it could not.\n        error: Option<String>,\n    },\n    /// The model is still writing an `agent` call: show or relabel its\n    /// placeholder row until the call starts.\n    ToolPreparing {\n        provider_call_id: String,\n        name: String,\n        target: String,\n    },\n    /// A tool call started on the open conversation.\n    ToolStarted {\n        call_id: String,\n        provider_call_id: String,\n        name: String,\n        target: String,\n    },\n    /// Incremental tool or subagent progress for the live status line.\n    ToolProgress {\n        call_id: String,\n        provider_call_id: String,\n        name: String,\n        message: String,\n    },\n    /// A committed tool-result entry arrived.\n    ToolResultAppended(ConversationEntry),\n    /// Prompt resources discovered for the open session.\n    ResourcesLoaded(Vec<(String, String)>),\n    /// Discovered slash-command skills for the current project.\n    SkillsLoaded(Vec<SkillEntry>),\n    /// File matches for the active `@` mention arrived from the bridge.\n    MentionFiles(Vec<String>),\n    /// Live token counts for the turn that is still running.\n    UsageSnapshot {\n        model: String,\n        input: u64,\n        context: u64,\n        context_cache: u64,\n        output: u64,\n        cache: Option<u64>,\n        requests: u32,\n        elapsed_ms: u64,\n    },\n    /// The agent asked the user structured questions.\n    AskRequested(Vec<AskPrompt>),\n    /// The user picked one choice on a pending ask question.\n    AskChoicePicked { index: usize, answer: String },\n    /// The user submitted answers locally; clear the pending panel.\n    AskAnswered,\n    /// The sidebar session-title filter changed.\n    SessionFilterChanged(String),\n    /// An older-page read started.\n    HistoryLoadStarted,\n    /// An older-page read finished without changing the transcript.\n    HistoryLoadFinished,\n    /// An older page arrived. Applied only when `requested_before` is still\n    /// the open window's cursor.\n    OlderLoaded {\n        /// Session the page belongs to.\n        session_id: String,\n        /// Entries in ledger order, strictly before the cursor.\n        entries: Vec<ConversationEntry>,\n        /// Next backward cursor, or `None` at the branch start.\n        older_before: Option<String>,\n        /// Cursor the UI asked for.\n        requested_before: String,\n    },\n    /// Settings were persisted under CAS.\n    ///\n    /// `edit_epoch` is the epoch captured when the save was dispatched. The\n    /// reducer clears `dirty` only when the editor has not changed since.\n    SettingsSaved {\n        /// Revision the store assigned.\n        revision: u64,\n        /// Editor epoch at dispatch.\n        edit_epoch: u64,\n    },\n    /// A settings save failed. The document stays dirty and a chat turn's\n    /// `sending` flag is left alone.\n    SettingsSaveFailed(String),\n    /// One MCP server's API key was stored or cleared; refreshes key markers.\n    ProviderKeySaved {\n        /// MCP server ids with a stored key.\n        mcp_keys: Vec<String>,\n    },\n    /// The user steered the running turn: the text goes to the model\n    /// before its next step, without stopping the turn. It shows as\n    /// pending until the ledger commits it.\n    SteerSent(String),\n    /// Steers the turn did not take: a refused `Steer`, or texts the core\n    /// returned after the turn's last request. They leave the pending strip;\n    /// the driver puts them back in the composer.\n    SteersReturned(Vec<String>),\n    /// Steers a chat that is not on screen did not take. They wait parked\n    /// and come back to the composer when that chat opens.\n    SteersParked {\n        /// Session identity spelling.\n        session_id: String,\n        texts: Vec<String>,\n    },\n    /// Opens or closes the subagent detail window.\n    SubagentWindowChanged(Option<String>),\n    /// The user closed one running subagent from its row.\n    SubagentDismissed(String),\n    /// Opens or closes the full changes drawer.\n    ChangesPanelToggled(bool),\n    /// The user sent a prompt; show a working status before the first token.\n    TurnArmed,\n    /// Incremental assistant text from the active model turn.\n    ChatDelta(String),\n    /// Incremental assistant reasoning from the active model turn.\n    ChatThinkingDelta(String),\n    /// An intermediate assistant step (with tool calls) was committed; the\n    /// streamed text so far belongs to it, so the live bubble resets.\n    AssistantStepCommitted(ConversationEntry),\n    /// Manual or automatic compaction wrote a summary the transcript should show.\n    SummaryShown(ConversationEntry),\n    /// A manual `/compact` started: the composer locks until the finish.\n    CompactArmed,\n    /// `/compact` reported its outcome. `head` is the durable branch head\n    /// after the attempt — the summary card advances it — so the next\n    /// compact or send does not trip the moved-head check on its own row.\n    CompactFinished { ok: bool, head: String },\n    /// The model turn finished and its entry was committed.\n    ChatDone {\n        head: String,\n        entry: ConversationEntry,\n    },\n    /// The model turn failed. A non-empty `head` is the ledger head after\n    /// writes this turn already committed; empty leaves the UI head alone.\n    ChatFailed {\n        /// Banner text. [`crate::view_model::CHAT_CANCELLED`] is a quiet cancel.\n        message: String,\n        /// Ledger head spelling, or empty when the head must not move.\n        head: String,\n    },\n    /// Compaction or a steer rewrote the prompt prefix. The next usage\n    /// snapshot is compared with the cache hit already on the meter.\n    CacheBreakArmed(CacheBreak),\n    /// The running turn started (`true`) or finished summarizing its\n    /// history for an automatic compaction.\n    ContextCompacting(bool),\n    /// A steer was committed on the active session while the turn kept running.\n    SteerCommitted {\n        /// Session identity spelling.\n        session_id: String,\n        /// Branch head after the steered user message.\n        head: String,\n        /// Transcript row for that message.\n        entry: ConversationEntry,\n    },\n    /// Switch the main area between chat and settings.\n    ShowMainView(MainView),\n    /// Switch the settings secondary menu.\n    ShowSettingsSection(SettingsSection),\n    /// The sidebar project switcher opened or closed.\n    ProjectMenuToggled(bool),\n    /// The provider catalog resolved (bundled or cloud).\n    CatalogLoaded {\n        /// The catalog document.\n        document: Arc<mycode_app::catalog::CatalogDocument>,\n        /// Unix seconds of the last cloud fetch.\n        fetched_at: u64,\n    },\n    /// The durable UI state loaded.\n    UiStateLoaded {\n        /// Recent project directories.\n        recents: Vec<String>,\n        /// Last opened project directory.\n        last_project: Option<String>,\n        /// Whether update checks run automatically.\n        auto_update: bool,\n        /// Last selected provider id.\n        selected_provider: Option<String>,\n        /// Last selected model id.\n        selected_model: Option<String>,\n        /// Reasoning effort fresh sessions start from.\n        selected_reasoning: Option<String>,\n        /// Session-to-project bindings.\n        session_projects: Vec<(String, String)>,\n        /// Per-session model pins.\n        session_models: Vec<mycode_app::SessionModelPin>,\n        /// Workspace folders, most recently added first.\n        workspace_roots: Vec<String>,\n        /// Recent model pins, newest first.\n        recent_models: Vec<mycode_app::ModelPin>,\n        /// Thinking traces start collapsed.\n        thinking_collapsed: bool,\n        /// The Details panel was open.\n        inspector_open: bool,\n        /// The Details panel was pinned resident.\n        inspector_pinned: bool,\n        /// Persisted windowed size.\n        window_size: Option<mycode_app::WindowSize>,\n    },\n    /// A thinking header was clicked: every trace expands or collapses.\n    ThinkingCollapsedToggled,\n    /// Every remembered binding for one session was dropped (its data was\n    /// deleted).\n    SessionBindingsForgotten(String),\n    /// A folder was added to the workspace list.\n    WorkspaceRootAdded(String),\n    /// A folder was removed from the workspace list; its chats go with it.\n    WorkspaceRootRemoved(String),\n    /// A project directory became the active workspace folder.\n    ProjectOpened(String),\n    /// A session was bound to a project in the durable map.\n    ///\n    /// The first folder sticks. A later bind to a different folder is ignored\n    /// so opening another directory cannot move a chat that already has one.\n    SessionProjectBound {\n        /// Session identity spelling.\n        session_id: String,\n        /// Project directory path.\n        project: String,\n    },\n    /// The open chat's working directory moved to another workspace folder.\n    /// The other folders stay in the list.\n    WorkspaceFolderFocused {\n        /// Session identity spelling.\n        session_id: String,\n        /// Folder that becomes the session working directory.\n        project: String,\n    },\n    /// The active project filter changed (sidebar project switcher).\n    ActiveProjectChanged(Option<String>),\n    /// A remembered project was removed from the recent list.\n    RecentRemoved(String),\n    /// The model picker selected a provider.\n    ProviderSelected(String),\n    /// The model picker selected a model.\n    ModelSelected(String),\n    /// The model picker opened or closed. Opening starts on the provider step.\n    ModelMenuToggled(bool),\n    /// The open picker moved into one provider, or back to the provider step\n    /// when the id is absent. Does not itself open the picker.\n    ModelMenuBrowse(Option<String>),\n    /// The model step's search box changed.\n    PickerQueryChanged(String),\n    /// The settings navigation filter changed.\n    SettingsQueryChanged(String),\n    /// The thinking-effort submenu opened or closed.\n    ReasoningMenuToggled(bool),\n    /// The composer's thinking-effort pick. Stored on the open session's\n    /// model pin and mirrored into the live settings projection so the\n    /// chip matches. This action does not mark the document dirty and does\n    /// not change the reasoning effort that a later settings save writes.\n    SettingsReasoningChanged(String),\n    /// The Models settings sub-page changed.\n    ShowModelsSubview(ModelsSubview),\n    /// The MCP settings sub-page changed.\n    ShowMcpSubview(McpSubview),\n    /// The custom MCP form's transport dropdown opened or closed.\n    McpTransportMenuToggled(bool),\n    /// Self-update progress changed.\n    UpdateStateChanged(UpdateState),\n    /// The proxy connectivity check started, finished, or was invalidated.\n    ProxyTestChanged(ProxyTestState),\n    /// A release offer was resolved. Publishing it also flips the update\n    /// state to `Available`; the download button reads the stored offer.\n    UpdateOfferFound(mycode_app::UpdateOffer),\n    /// The auto-update preference changed.\n    AutoUpdateToggled(bool),\n    /// A verified update is staged and waiting for a restart.\n    UpdateStaged(PreparedUpdate),\n    /// The update dialog opened or closed.\n    UpdateDialogToggled(bool),\n    /// The global command palette opened or closed.\n    ///\n    /// Opening dismisses other floating menus so the palette is the only\n    /// layer asking for the keyboard.\n    CommandPaletteSet(bool),\n}\n\n/// Maximum composer text before the send is rejected locally.\npub const MAX_COMPOSER_CHARS: usize = 64 * 1024;\n","crates/mycode-frontend/src/view_model/reduce.rs":"//! Reducer internals: the pure transition functions behind\n//! [`super::reduce`]. The `FrontendAction` mutations live here; the parent\n//! module declares the state, action, and projection types. The dispatch\n//! match lives here; arm bodies with their own logic live in the topical\n//! submodules.\nmod composer;\nmod jobs;\nmod models;\nmod projects;\nmod settings;\nmod streaming;\nmod usage;\n\nuse mycode_app::CHAT_CANCELLED;\n\nuse super::{\n    ActiveConversation, FrontendAction, MentionKind, ProxyTestState, TurnStats, UpdateState,\n    WorkspaceState,\n};\n\npub use self::models::{\n    reasoning_levels_for, selected_model_supports_reasoning, selected_reasoning_levels,\n    strongest_reasoning_level,\n};\n\npub use self::composer::{ComposerSubmit, composer_submit, preferred_slash_index};\nuse self::composer::{parse_mention, slash_items};\npub use self::jobs::{PREPARING_ROW_PREFIX, is_preparing_row};\nuse self::jobs::{\n    drop_live_job, drop_preparing_rows, refresh_subagent_status, retire_live_jobs, tool_preparing,\n    tool_progress, tool_started,\n};\nuse self::models::{\n    apply_session_model, assign_fresh_session_model, ensure_model_selection, model_selected,\n    provider_selected, remember_active_session_model, remember_session_model,\n    restore_live_reasoning,\n};\nuse self::projects::{\n    bind_session_project, session_bindings_forgotten, session_project_bound, workspace_root_added,\n    workspace_root_removed,\n};\nuse self::settings::edit_settings;\nuse self::streaming::{append_streaming, set_streaming_status};\nuse self::usage::{arm_cache_watch, clear_session_usage, observe_cache_hit};\n\nmod turn_state;\nuse self::turn_state::*;\n\n/// Applies one action to the state.\npub fn reduce(state: &mut WorkspaceState, action: FrontendAction) {\n    // A paged-back window stays readable through ordinary UI actions. Only\n    // new tail activity (or opening a new snapshot) applies the live ceiling.\n    let trim_window = matches!(\n        action,\n        FrontendAction::TurnArmed\n            | FrontendAction::MessageSent { .. }\n            | FrontendAction::SteerCommitted { .. }\n            | FrontendAction::AssistantStepCommitted(_)\n            | FrontendAction::ToolPreparing { .. }\n            | FrontendAction::ToolStarted { .. }\n            | FrontendAction::ToolResultAppended(_)\n            | FrontendAction::ChatDone { .. }\n            | FrontendAction::ChatFailed { .. }\n            | FrontendAction::SummaryShown(_)\n            | FrontendAction::ConversationOpened(_)\n    );\n    let touches_providers = matches!(\n        action,\n        FrontendAction::SettingsLoaded(_)\n            | FrontendAction::SettingsSaved { .. }\n            | FrontendAction::UiStateLoaded { .. }\n    );\n    // Streaming ticks arrive many times a second and change no catalog the\n    // `/` menu lists; rebuilding it for each one is wasted work.\n    let streaming_tick = matches!(\n        action,\n        FrontendAction::ChatDelta(_)\n            | FrontendAction::ChatThinkingDelta(_)\n            | FrontendAction::ToolProgress { .. }\n            | FrontendAction::UsageSnapshot { .. }\n    );\n    match action {\n        FrontendAction::SessionsLoaded(mut sessions) => {\n            let active_id = state.active.as_ref().map(|c| c.session_id.as_str());\n            for session in &mut sessions {\n                session.active = active_id == Some(session.session_id.as_str());\n            }\n            state.sessions = sessions;\n        }\n        FrontendAction::SessionTitled { session_id, title } => {\n            if let Some(row) = state\n                .sessions\n                .iter_mut()\n                .find(|row| row.session_id == session_id)\n            {\n                row.title = title;\n            }\n        }\n        FrontendAction::SessionCreated(mut summary) => {\n            // A new chat keeps the model already on the picker and pins it,\n            // so leaving and coming back does not jump to the first enabled\n            // model. The previous chat's pin is written first.\n            if let Some(previous) = state\n                .active\n                .as_ref()\n                .map(|active| active.session_id.clone())\n            {\n                remember_session_model(state, &previous);\n            }\n            state\n                .sessions\n                .retain(|s| s.session_id != summary.session_id);\n            summary.active = true;\n            state.sessions.insert(0, summary.clone());\n            let session_id = summary.session_id.clone();\n            // A turn still running in the previous chat keeps running, but\n            // its events no longer reach this view; the fresh chat must not\n            // inherit its in-flight flag, steers, or asks.\n            reset_turn_view(state);\n            state.active = Some(ActiveConversation {\n                session_id: summary.session_id,\n                branch_id: summary.root_branch_id,\n                head: \"empty\".to_owned(),\n                entries: Vec::new(),\n                older_before: None,\n                streaming: None,\n                running: false,\n                compacting: false,\n                context_used: 0,\n                context_cache: 0,\n            });\n            remember_session_model(state, &session_id);\n            // The composer meter reads these fields directly; a fresh session\n            // starts with an empty meter.\n            clear_session_usage(state);\n        }\n        FrontendAction::SessionDeleted => {\n            state.active = None;\n            reset_turn_view(state);\n            state.error = None;\n            state.pending_welcome_send = None;\n            clear_session_usage(state);\n            restore_live_reasoning(state);\n        }\n        FrontendAction::ConversationParked => {\n            state.active = None;\n            for session in &mut state.sessions {\n                session.active = false;\n            }\n            reset_turn_view(state);\n            restore_live_reasoning(state);\n            state.composer_draft.clear();\n            state.mention = None;\n            state.pending_welcome_send = None;\n            state.resources.clear();\n            clear_session_usage(state);\n        }\n        FrontendAction::ConversationOpened(conversation) => {\n            let had_other = state\n                .active\n                .as_ref()\n                .is_some_and(|active| active.session_id != conversation.session_id);\n            let switched = state\n                .active\n                .as_ref()\n                .map(|active| active.session_id.as_str())\n                != Some(conversation.session_id.as_str());\n            let previous_session = if switched {\n                state\n                    .active\n                    .as_ref()\n                    .map(|active| active.session_id.clone())\n            } else {\n                None\n            };\n            if switched {\n                // Steers, tasks, and asks belong to the previous session.\n                reset_turn_view(state);\n            }\n            let session_id = conversation.session_id.clone();\n            let restored_used = conversation.context_used;\n            let restored_cache = conversation.context_cache;\n            // A reopen can land while the session's turn is still in flight:\n            // the live flag keeps running affordances honest, and only then\n            // do turn events keep flowing into this view. Reopening the\n            // session already on screen mid-turn, or just after a send armed\n            // the next turn, keeps the streaming buffer the wire copy never\n            // carries.\n            let running = conversation.running;\n            let compacting = conversation.compacting;\n            let mut conversation = conversation;\n            if !switched\n                && (running || state.sending)\n                && conversation.streaming.is_none()\n                && let Some(previous) = state.active.as_mut()\n            {\n                conversation.streaming = previous.streaming.take();\n            }\n            state.active = Some(conversation);\n            // For the conversation already on screen, the flag may lag a\n            // just-armed turn by a few async hops; only the fresh-open case\n            // trusts the wire value outright.\n            state.sending = running || (!switched && state.sending);\n            // A `/compact` in flight ends with `CompactFinished`, never a\n            // chat terminal, so it is restored as compacting, not sending.\n            state.compacting = compacting || (!switched && state.compacting);\n            if state.sending && state.turn_started_ms == 0 {\n                // The wire does not carry the real turn start; count from\n                // the reopen so the elapsed label still ticks.\n                state.turn_started_ms = crate::unix_now().as_millis() as u64;\n            }\n            for session in &mut state.sessions {\n                session.active = session.session_id == session_id;\n            }\n            if switched {\n                if let Some(previous) = previous_session {\n                    remember_session_model(state, &previous);\n                }\n                clear_session_usage(state);\n                // The tail already carries the last prompt's usage. Put it\n                // back on the live meter so the cache ring paints before the\n                // next turn.\n                state.context_used = restored_used;\n                state.context_cache = restored_cache;\n                if !apply_session_model(state, &session_id) {\n                    assign_fresh_session_model(state, &session_id);\n                }\n            }\n            // The composer is one widget. A draft typed in the previous\n            // session must not ride along and send into this one. Opening\n            // the first session keeps a welcome-screen draft.\n            if had_other {\n                state.composer_draft.clear();\n                state.mention = None;\n            }\n        }\n        FrontendAction::ComposerChanged(text) => {\n            let bounded = bounded_draft(text);\n            state.mention = parse_mention(&bounded);\n            state.composer_draft = bounded;\n        }\n        FrontendAction::WelcomeSendHeld(text) => {\n            if state.pending_welcome_send.is_none()\n                && let ComposerSubmit::StartTask(text) = composer_submit(state, &text)\n            {\n                let bounded = bounded_draft(text);\n                if !bounded.trim().is_empty() {\n                    state.pending_welcome_send = Some(bounded);\n                }\n            }\n        }\n        FrontendAction::WelcomeSendConsumed => {\n            state.pending_welcome_send = None;\n        }\n        FrontendAction::MentionFiles(files) => {\n            if let Some(mention) = state.mention.as_mut()\n                && mention.kind == MentionKind::File\n            {\n                mention.items = files\n                    .into_iter()\n                    .map(|path| crate::view_model::MentionItem {\n                        insert: path.clone(),\n                        label: path,\n                        group: crate::view_model::MentionGroup::File,\n                    })\n                    .collect();\n            }\n        }\n        FrontendAction::SteerSent(text) => {\n            state.pending_steers.push(text);\n            state.composer_draft.clear();\n            state.mention = None;\n        }\n        FrontendAction::SteersParked { session_id, texts } => {\n            park_steers(state, session_id, texts);\n        }\n        FrontendAction::SteersReturned(texts) => {\n            // The driver puts them back in the composer; here they only\n            // leave the pending strip.\n            for text in texts {\n                if let Some(position) = state.pending_steers.iter().position(|sent| *sent == text) {\n                    state.pending_steers.remove(position);\n                }\n            }\n        }\n        FrontendAction::SubagentWindowChanged(call_id) => {\n            state.subagent_window = call_id;\n        }\n        FrontendAction::ChangesPanelToggled(open) => {\n            state.changes_panel_open = open;\n        }\n        FrontendAction::SubagentDismissed(call_id) => {\n            if drop_live_job(state, &call_id) && state.sending {\n                refresh_subagent_status(state);\n            }\n        }\n        FrontendAction::MessageSent { head, entry } => {\n            if let Some(conversation) = state.active.as_mut() {\n                conversation.head = head;\n                push_entry_once(conversation, entry);\n            }\n            state.composer_draft.clear();\n            state.mention = None;\n            state.turn_alert = None;\n        }\n        FrontendAction::TurnArmed => {\n            state.sending = true;\n            state.auto_compacting = false;\n            state.turn_started_ms = crate::unix_now().as_millis() as u64;\n            state.error = None;\n            state.turn_alert = None;\n            set_streaming_status(\n                state,\n                crate::i18n::t(\"Waiting for the model\", \"等待模型响应\"),\n            );\n        }\n        FrontendAction::ChatDelta(delta) => {\n            // Events arriving after the turn's Done/Failed are stragglers\n            // from work the view already closed; applying them would\n            // resurrect a streaming bubble over a finished transcript.\n            if state.sending {\n                append_streaming(state, false, delta);\n            }\n        }\n        FrontendAction::ToolPreparing {\n            provider_call_id,\n            name,\n            target,\n        } => {\n            if state.sending {\n                tool_preparing(state, &provider_call_id, &name, &target);\n            }\n        }\n        FrontendAction::ToolStarted {\n            call_id,\n            provider_call_id,\n            name,\n            target,\n        } => {\n            if state.sending {\n                tool_started(state, call_id, provider_call_id, name, target);\n            }\n        }\n        FrontendAction::ToolProgress {\n            call_id,\n            provider_call_id,\n            name,\n            message,\n        } => {\n            // Same guard: a late progress line must not repopulate\n            // `live_jobs` and the status line once the turn has ended.\n            if state.sending {\n                tool_progress(state, call_id, provider_call_id, name, message);\n            }\n        }\n        FrontendAction::ToolResultAppended(entry) => {\n            if let Some(call_id) = entry.call_id.as_deref()\n                && drop_live_job(state, call_id)\n                && state.sending\n            {\n                refresh_subagent_status(state);\n            }\n            if let Some(conversation) = state.active.as_mut() {\n                conversation.entries.push(entry);\n            }\n        }\n        FrontendAction::ResourcesLoaded(files) => state.resources = files,\n        FrontendAction::SkillsLoaded(skills) => state.skills = skills,\n        FrontendAction::UsageSnapshot {\n            model,\n            input,\n            context,\n            context_cache,\n            output,\n            cache,\n            requests,\n            elapsed_ms,\n        } => {\n            if !state.sending {\n                // A snapshot is per-turn; a straggler must not seed\n                // `live_turn` after the turn already closed.\n                return;\n            }\n            state.live_turn = Some(TurnStats {\n                model,\n                input,\n                output,\n                cache,\n                requests,\n                elapsed_ms,\n            });\n            if context > 0 {\n                state.context_used = context;\n                state.context_cache = context_cache;\n            }\n            // The watch compares this prompt, not the summed turn. A size of\n            // zero leaves the watch armed for the next real reading.\n            observe_cache_hit(state, context, context_cache);\n        }\n        FrontendAction::AskRequested(rows) => {\n            // A late ask after the turn closed must not reopen the modal.\n            if !state.sending {\n                return;\n            }\n            state.ask_answers = vec![String::new(); rows.len()];\n            state.pending_ask = Some(rows);\n        }\n        FrontendAction::AskChoicePicked { index, answer } => {\n            if let Some(slot) = state.ask_answers.get_mut(index) {\n                *slot = answer;\n            }\n        }\n        FrontendAction::AskAnswered => {\n            state.pending_ask = None;\n            state.ask_answers.clear();\n        }\n        FrontendAction::SessionFilterChanged(query) => state.session_filter = query,\n        FrontendAction::HistoryLoadStarted => state.history_loading = true,\n        FrontendAction::HistoryLoadFinished => state.history_loading = false,\n        FrontendAction::OlderLoaded {\n            session_id,\n            entries,\n            older_before,\n            requested_before,\n        } => {\n            state.history_loading = false;\n            let applicable = state.active.as_ref().is_some_and(|active| {\n                active.session_id == session_id\n                    && active.older_before.as_deref() == Some(requested_before.as_str())\n            });\n            if applicable {\n                let active = state.active.as_mut().expect(\"applicable conversation\");\n                let mut older = entries;\n                older.append(&mut active.entries);\n                active.entries = older;\n                active.older_before = older_before;\n            }\n        }\n        FrontendAction::ChatThinkingDelta(delta) => {\n            if state.sending {\n                append_streaming(state, true, delta);\n            }\n        }\n        FrontendAction::SummaryShown(entry) => {\n            if summary_waits_for_the_reply(state) {\n                if state\n                    .pending_summaries\n                    .iter()\n                    .all(|pending| pending.event_id != entry.event_id)\n                {\n                    state.pending_summaries.push(entry);\n                }\n            } else if let Some(conversation) = state.active.as_mut() {\n                push_entry_once(conversation, entry);\n            }\n        }\n        FrontendAction::CompactArmed => {\n            state.compacting = true;\n            state.error = None;\n        }\n        FrontendAction::CompactFinished { ok: _, head } => {\n            state.compacting = false;\n            if !head.is_empty()\n                && let Some(conversation) = state.active.as_mut()\n            {\n                conversation.head = head;\n            }\n        }\n        FrontendAction::AssistantStepCommitted(entry) => {\n            if let Some(conversation) = state.active.as_mut() {\n                push_entry_once(conversation, entry);\n            }\n            // Status text and buffer clearing are turn-scoped; a straggler\n            // step after the turn closed only contributes its entry.\n            if !state.sending {\n                return;\n            }\n            set_streaming_status(\n                state,\n                crate::i18n::t(\"Waiting for the next step\", \"等待下一步\"),\n            );\n            if let Some(conversation) = state.active.as_mut()\n                && let Some(streaming) = conversation.streaming.as_mut()\n            {\n                streaming.text.clear();\n                streaming.thinking.clear();\n            }\n        }\n        FrontendAction::ChatDone { head, entry } => {\n            // Steers that did not commit come back as `SteersReturned`.\n            state.pending_steers.clear();\n            let summaries = std::mem::take(&mut state.pending_summaries);\n            if let Some(conversation) = state.active.as_mut() {\n                conversation.head = head;\n                // A turn that ended on a committed tool step reports that\n                // step again as its last message; it is already listed.\n                push_entry_once(conversation, entry);\n                // The summaries follow the reply, matching the ledger order\n                // a reopen projects.\n                for summary in summaries {\n                    push_entry_once(conversation, summary);\n                }\n                conversation.streaming = None;\n            }\n            end_turn(state);\n            // The finished turn keeps its meter: the last live snapshot held\n            // the turn's sums, so it becomes the completed-turn stats.\n            state.last_turn = state.live_turn.take();\n        }\n        FrontendAction::ChatFailed { message, head } => {\n            state.pending_steers.clear();\n            let summaries = std::mem::take(&mut state.pending_summaries);\n            if let Some(conversation) = state.active.as_mut() {\n                if !head.is_empty() {\n                    conversation.head = head;\n                }\n                for summary in summaries {\n                    push_entry_once(conversation, summary);\n                }\n                conversation.streaming = None;\n            }\n            // A user-initiated cancel resets the turn without an error\n            // banner; the sentinel travels as the failure message.\n            // Context meters stay: a cancel is not a new empty session.\n            // The transcript keeps a red row for any turn that closed\n            // without a reply — provider failure or a user stop — so an\n            // interrupted tail is not mistaken for a normal answer.\n            state.turn_alert = Some(if message == CHAT_CANCELLED {\n                crate::i18n::t(\"Stopped by user\", \"已被用户停止\").to_owned()\n            } else {\n                message.clone()\n            });\n            if message != CHAT_CANCELLED {\n                state.error = Some(message);\n            }\n            end_turn(state);\n            state.live_turn = None;\n        }\n        FrontendAction::CacheBreakArmed(cause) => arm_cache_watch(state, cause),\n        FrontendAction::ContextCompacting(active) => {\n            if !state.sending {\n                return;\n            }\n            state.auto_compacting = active;\n            let status = if active {\n                crate::i18n::t(\"Compacting context\", \"正在压缩上下文\")\n            } else {\n                crate::i18n::t(\"Waiting for the model\", \"等待模型响应\")\n            };\n            set_streaming_status(state, status);\n        }\n        FrontendAction::SteerCommitted {\n            session_id,\n            head,\n            entry,\n        } => {\n            if let Some(conversation) = state.active.as_mut()\n                && conversation.session_id == session_id\n            {\n                if !head.is_empty() {\n                    conversation.head = head;\n                }\n                if let Some(position) = state\n                    .pending_steers\n                    .iter()\n                    .position(|sent| *sent == entry.text.as_ref())\n                {\n                    state.pending_steers.remove(position);\n                }\n                push_entry_once(conversation, entry);\n            }\n        }\n        FrontendAction::Failed(message) => {\n            state.error = Some(message);\n        }\n        FrontendAction::SettingsLoaded(settings) => settings::settings_loaded(state, *settings),\n        FrontendAction::SettingsLanguageSelected(language) => {\n            settings::language_selected(state, language);\n        }\n        FrontendAction::SettingsThemeSelected(theme) => settings::theme_selected(state, &theme),\n        FrontendAction::SettingsFontSizeSelected(font_size) => {\n            settings::font_size_selected(state, font_size);\n        }\n        FrontendAction::InspectorChanged { open, pinned } => {\n            state.inspector_open = open;\n            state.inspector_pinned = pinned;\n        }\n        FrontendAction::SettingsProxyChanged { value, .. } => {\n            if state\n                .settings\n                .as_ref()\n                .is_some_and(|settings| settings.proxy != value)\n            {\n                state.proxy_test = ProxyTestState::Idle;\n            }\n            edit_settings(state, |settings| {\n                if settings.proxy == value {\n                    return false;\n                }\n                settings.proxy = value;\n                true\n            });\n        }\n        FrontendAction::SettingsSubagentsChanged(subagents) => {\n            edit_settings(state, |settings| {\n                settings.subagents = subagents;\n                true\n            });\n        }\n        FrontendAction::SettingsSkillToggled(slug, enabled) => {\n            edit_settings(state, |settings| {\n                settings.skills.set_enabled(&slug, enabled)\n            });\n        }\n        FrontendAction::SubagentMenuToggled(menu) => {\n            let opening = menu.is_some();\n            state.subagent_menu = menu;\n            state.model_menu_browse = None;\n            state.picker_query.clear();\n            if opening {\n                state.model_menu_open = false;\n                state.reasoning_menu_open = false;\n            }\n        }\n        FrontendAction::SettingsSaved {\n            revision,\n            edit_epoch,\n        } => settings::settings_saved(state, revision, edit_epoch),\n        FrontendAction::SettingsSaveFailed(message) => {\n            if let Some(settings) = state.settings.as_mut() {\n                settings.saving = false;\n            }\n            state.error = Some(message);\n        }\n        FrontendAction::ProviderKeySaved { mcp_keys } => {\n            if let Some(settings) = state.settings.as_mut() {\n                settings.mcp_with_keys = mcp_keys;\n            }\n        }\n        FrontendAction::SettingsMcpAdded(server) => settings::mcp_added(state, server),\n        FrontendAction::SettingsMcpRemoved(index) => settings::mcp_removed(state, index),\n        FrontendAction::SettingsMcpToggled(index, enabled) => {\n            edit_settings(state, |settings| {\n                settings.mcp_servers.get_mut(index).is_some_and(|server| {\n                    server.enabled = enabled;\n                    true\n                })\n            });\n        }\n        FrontendAction::McpProbeStarted(server_id) => {\n            if !state.mcp_probing.contains(&server_id) {\n                state.mcp_probing.push(server_id);\n            }\n        }\n        FrontendAction::McpToolsListed { server_id, tools } => {\n            settings::mcp_tools_listed(state, server_id, tools);\n        }\n        FrontendAction::McpProbeFailed { server_id, message } => {\n            state.mcp_probing.retain(|id| *id != server_id);\n            state.mcp_tools.retain(|(id, _)| *id != server_id);\n            state.error = Some(message);\n        }\n        FrontendAction::McpLibraryLoaded { servers, error } => {\n            state.mcp_library = servers;\n            state.mcp_library_error = error;\n        }\n        FrontendAction::ShowMainView(view) => {\n            state.view = view;\n            // Crossing views closes every floating menu so no stale layer\n            // renders above the destination view.\n            close_floating_menus(state);\n        }\n        FrontendAction::ShowSettingsSection(section) => {\n            state.model_menu_open = false;\n            state.model_menu_browse = None;\n            state.picker_query.clear();\n            state.subagent_menu = None;\n            state.settings_section = section;\n        }\n        FrontendAction::ProjectMenuToggled(open) => state.project_menu_open = open,\n        FrontendAction::CatalogLoaded {\n            document,\n            fetched_at,\n        } => {\n            state.catalog = Some(document);\n            state.catalog_fetched_at = fetched_at;\n        }\n        FrontendAction::UiStateLoaded {\n            recents,\n            last_project,\n            auto_update,\n            selected_provider,\n            selected_model,\n            selected_reasoning,\n            session_projects,\n            session_models,\n            workspace_roots,\n            recent_models,\n            thinking_collapsed,\n            inspector_open,\n            inspector_pinned,\n            window_size,\n        } => {\n            state.thinking_collapsed = thinking_collapsed;\n            state.inspector_open = inspector_open;\n            state.inspector_pinned = inspector_pinned;\n            state.window_size = state.window_size.or(window_size);\n            state.recents = recents;\n            state.project_dir = last_project.filter(|path| !path.trim().is_empty());\n            state.session_projects = session_projects;\n            state.session_models = session_models;\n            state.workspace_roots = workspace_roots;\n            state.recent_models = recent_models;\n            state.default_reasoning = selected_reasoning;\n            state.auto_update = auto_update;\n            if selected_provider.is_some() {\n                state.selected_provider = selected_provider;\n                state.selected_model = selected_model;\n            }\n            ensure_model_selection(state);\n            // The live effort is an overlay on the document: re-apply the\n            // open session's pin, else the composer's last pick. Without\n            // it a remembered pick stays in ui.json while the chip and the\n            // next session's pin fall back to the provider default.\n            restore_live_reasoning(state);\n            if let Some(session_id) = state\n                .active\n                .as_ref()\n                .map(|active| active.session_id.clone())\n                && !apply_session_model(state, &session_id)\n            {\n                remember_session_model(state, &session_id);\n            }\n        }\n        FrontendAction::ThinkingCollapsedToggled => {\n            state.thinking_collapsed = !state.thinking_collapsed;\n        }\n        FrontendAction::SessionBindingsForgotten(session_id) => {\n            session_bindings_forgotten(state, session_id)\n        }\n        FrontendAction::WorkspaceRootAdded(project) => workspace_root_added(state, project),\n        FrontendAction::WorkspaceRootRemoved(project) => {\n            workspace_root_removed(state, project);\n        }\n        FrontendAction::ProjectOpened(project) => {\n            state.project_dir = Some(project.clone());\n            state.recents.retain(|existing| existing != &project);\n            state.recents.insert(0, project);\n            state.recents.truncate(mycode_app::MAX_RECENT_PROJECTS);\n        }\n        FrontendAction::SessionProjectBound {\n            session_id,\n            project,\n        } => session_project_bound(state, session_id, project),\n        FrontendAction::WorkspaceFolderFocused {\n            session_id,\n            project,\n        } => {\n            if project.trim().is_empty() {\n                return;\n            }\n            state.project_dir = Some(project.clone());\n            bind_session_project(state, session_id, project);\n        }\n        FrontendAction::ActiveProjectChanged(project) => {\n            state.project_dir = project;\n            if !super::task_surface_visible(state) {\n                state.subagent_window = None;\n            }\n        }\n        FrontendAction::RecentRemoved(project) => {\n            state\n                .recents\n                .retain(|existing| !super::same_project_path(existing, &project));\n            if state\n                .project_dir\n                .as_ref()\n                .is_some_and(|current| super::same_project_path(current, &project))\n            {\n                state.project_dir = None;\n            }\n        }\n        FrontendAction::ProviderSelected(provider) => provider_selected(state, provider),\n        FrontendAction::ModelSelected(model) => model_selected(state, model),\n        FrontendAction::ModelMenuToggled(open) => {\n            state.model_menu_open = open;\n            state.model_menu_browse = None;\n            state.picker_query.clear();\n            if open {\n                state.reasoning_menu_open = false;\n                state.subagent_menu = None;\n            }\n        }\n        FrontendAction::ModelMenuBrowse(provider) => {\n            state.reasoning_menu_open = false;\n            state.model_menu_browse = provider;\n            state.picker_query.clear();\n        }\n        FrontendAction::PickerQueryChanged(query) => state.picker_query = query,\n        FrontendAction::SettingsQueryChanged(query) => state.settings_query = query,\n        FrontendAction::ReasoningMenuToggled(open) => {\n            state.reasoning_menu_open = open;\n            if open {\n                state.model_menu_open = false;\n            }\n        }\n        FrontendAction::SettingsReasoningChanged(level) => {\n            state.reasoning_menu_open = false;\n            // Stored on the session pin. The live projection is updated so the\n            // chip matches, and the document is left clean so this action does\n            // not schedule a save.\n            if state.settings.is_none() {\n                return;\n            }\n            let picked: Option<String> = if level == \"default\" || level.is_empty() {\n                None\n            } else if selected_reasoning_levels(state).contains(&level) {\n                Some(level)\n            } else {\n                return;\n            };\n            if let Some(settings) = state.settings.as_mut() {\n                settings.reasoning = picked.clone();\n            }\n            state.default_reasoning = picked;\n            remember_active_session_model(state);\n        }\n        FrontendAction::ShowModelsSubview(view) => {\n            state.models_subview = view;\n        }\n        FrontendAction::ShowMcpSubview(view) => {\n            state.mcp_subview = view;\n            state.mcp_transport_menu_open = false;\n        }\n        FrontendAction::McpTransportMenuToggled(open) => state.mcp_transport_menu_open = open,\n        FrontendAction::LanguageMenuToggled(open) => state.language_menu_open = open,\n        FrontendAction::UpdateStateChanged(update) => state.update = update,\n        FrontendAction::ProxyTestChanged(test) => state.proxy_test = test,\n        FrontendAction::UpdateDialogToggled(open) => state.update_dialog_open = open,\n        FrontendAction::CommandPaletteSet(open) => {\n            state.command_palette_open = open;\n            if open {\n                close_floating_menus(state);\n            }\n        }\n        FrontendAction::UpdateOfferFound(offer) => {\n            // The offer and the Available flip are one transition: the\n            // download button's handler reads `last_offer`, so an\n            // Available state without a published offer is a dead button.\n            state.update = UpdateState::Available {\n                version: offer.version.clone(),\n                notes_url: offer.notes_url.clone(),\n            };\n            state.last_offer = Some(offer);\n        }\n        FrontendAction::AutoUpdateToggled(auto_update) => state.auto_update = auto_update,\n        FrontendAction::UpdateStaged(prepared) => {\n            let version = prepared.version.clone();\n            state.prepared_update = Some(prepared);\n            state.update = UpdateState::Ready { version };\n        }\n    }\n    if trim_window {\n        trim_resident_entries(state);\n    }\n    if touches_providers {\n        ensure_model_selection(state);\n    }\n    if !streaming_tick {\n        fill_open_slash(state);\n    }\n}\n\n/// Ceiling on entries held for one open conversation. The transcript pages\n/// from disk in both directions; past this the oldest rows drop out of the\n/// window and page back in on demand, so a long-running window stays\n/// bounded. Older-page prepends are not trimmed so the newly loaded page is\n/// never discarded on arrival.\nconst MAX_RESIDENT_ENTRIES: usize = 1500;\n\nfn trim_resident_entries(state: &mut WorkspaceState) {\n    if let Some(active) = state.active.as_mut()\n        && active.entries.len() > MAX_RESIDENT_ENTRIES\n    {\n        let excess = active.entries.len() - MAX_RESIDENT_ENTRIES;\n        active.entries.drain(..excess);\n        if let Some(first_ledger_id) = active.entries.iter().find_map(|entry| {\n            mycode_app::SessionEventId::parse(&entry.event_id)\n                .map(|event_id| event_id.as_str().to_owned())\n        }) {\n            active.older_before = Some(first_ledger_id);\n        }\n    }\n}\n\n/// Rebuilds the open `/` menu from the catalogs this action may have changed.\nfn fill_open_slash(state: &mut WorkspaceState) {\n    let Some(mention) = state\n        .mention\n        .as_ref()\n        .filter(|mention| mention.kind == MentionKind::Command)\n    else {\n        return;\n    };\n    // Built from borrows, then stored: this runs on every keystroke while\n    // the menu is open, so the server and tool lists are not copied.\n    let servers = state\n        .settings\n        .as_ref()\n        .map_or(&[][..], |settings| settings.mcp_servers.as_slice());\n    let items = slash_items(\n        &mention.fragment,\n        &state.enabled_skills(),\n        servers,\n        &state.mcp_library,\n        &state.mcp_tools,\n    );\n    if let Some(mention) = state.mention.as_mut() {\n        mention.items = items;\n    }\n}\n\n/// Closes every floating menu layer, whatever view it belongs to. Returns\n/// whether anything was open, so Escape can tell a dismissal from a no-op.\npub fn close_floating_menus(state: &mut WorkspaceState) -> bool {\n    let was_open = state.project_menu_open\n        || state.model_menu_open\n        || state.reasoning_menu_open\n        || state.subagent_menu.is_some()\n        || state.mcp_transport_menu_open\n        || state.language_menu_open\n        || state.mention.is_some();\n    state.project_menu_open = false;\n    state.model_menu_open = false;\n    state.model_menu_browse = None;\n    state.picker_query.clear();\n    state.reasoning_menu_open = false;\n    state.subagent_menu = None;\n    state.mcp_transport_menu_open = false;\n    state.language_menu_open = false;\n    state.mention = None;\n    was_open\n}\n\n#[cfg(test)]\nmod tests;\n","crates/mycode-app/src/lib.rs":"//! `mycode-app` — the application core, with no frontend dependency.\n//!\n//! Sessions, model turns, tool hosts, MCP servers, provider credentials,\n//! self-update, and durable settings. A frontend starts a [`CoreBridge`],\n//! sends [`BridgeCommand`]s, awaits [`BridgeReply`]s, and renders the\n//! [`BridgeEvent`] stream; values are defined in [`protocol`].\n//!\n//! [`CoreBridge`] owns a dedicated thread with a current-thread tokio runtime,\n//! so a frontend never touches tokio types. The command channel is unbounded\n//! on purpose: the worker loop must `await` commands or spawned tasks would\n//! starve.\n\n#[cfg(test)]\nmod bridge_tests;\nmod compaction;\nmod dispatch;\nmod export;\npub mod install;\nmod ledger;\nmod magpie;\nmod mcp_client;\nmod mcp_tools;\nmod projection;\npub mod protocol;\n\n// Chain re-export: successors see every lower layer through this crate only.\npub use mycode_agent::*;\n\npub use compaction::{\n    display_summary_text, is_display_only_summary as is_compaction_summary, summary_body,\n};\npub use export::IMPORT_NEEDS_MCP_CONFIRM;\nmod search;\nmod settings_io;\nmod state;\nmod subagent;\nmod title;\nmod tool_hosts;\nmod turn;\nmod updates;\nmod user_agent;\n\npub use mycode_agent::{ProxyTestReport, ProxyTestRoute};\npub use protocol::{\n    ActiveConversation, AskPrompt, BranchId, CHAT_CANCELLED, ConversationEntry, EntryKind,\n    HeadStamp, INTERRUPTED_RESPONSE_PREFIX, MAX_STREAMING_CHARS, OlderTranscript, SessionEventId,\n    SessionId, SessionSummary, StreamingReply, tool_label,\n};\npub use updates::apply::{parse_apply_update_args, run_apply_update_helper};\npub use updates::{PendingUpdate, PreparedUpdate, UpdateOffer};\npub use updates::{\n    arm_staged_update, brief_error, cleanup_previous_binary, cleanup_stale_stages, current_version,\n    reconcile_pending_update,\n};\npub use user_agent::default_user_agent;\n\nuse std::path::PathBuf;\nuse std::sync::Arc;\nuse std::thread::JoinHandle;\n\nuse mycode_agent::catalog::CatalogDocument;\n\nuse tokio::sync::oneshot;\n\n// The event channel is unbounded on purpose: `send` never blocks, so a\n// slow or stalled UI frame can never freeze the single-threaded core runtime\n// mid-turn. `send` wakes the frontend task parked on `recv`. That task\n// paints streaming text in short frames; it does not apply a whole queued\n// turn before the next frame.\n\n/// A request from the UI to the core thread.\n#[derive(Debug)]\npub enum BridgeCommand {\n    /// Refresh the sidebar session list.\n    ListSessions,\n    /// Create and open a fresh session.\n    CreateSession {\n        /// Project folder the session starts in; its directory is filed\n        /// under `sessions/<project key>/` for good.\n        project: Option<String>,\n    },\n    /// Recover and open one session's root conversation.\n    OpenSession(SessionId),\n    /// Commit one user message on the open branch.\n    SendMessage {\n        /// Target session.\n        session: SessionId,\n        /// Target branch.\n        branch: BranchId,\n        /// Head the UI observed.\n        expected_head: HeadStamp,\n        /// Message text; nonempty and bounded by the view-model.\n        text: String,\n        /// Images and code files sent beside the text.\n        attachments: mycode_agent::Attachments,\n    },\n    /// Load the settings document with its revision and stored key ids.\n    LoadSettings,\n    /// Persist new settings under revision compare-and-swap.\n    SaveSettings {\n        /// The revision the editor
