 finish a swap no exit path ever ran.\npub fn pending_dir(home: &mycode_agent::HomeLayout) -> PathBuf {\n    home.root().join(\"update\")\n}\n\n/// Filenames inside [`pending_dir`] for one binary family: the payload,\n/// its expected digest, the pending version, and the startup-apply counter\n/// that bounds relaunch loops.\nfn pending_paths(dir: &Path, stem: &str) -> (PathBuf, PathBuf, PathBuf, PathBuf) {\n    (\n        dir.join(format!(\"{stem}.pending\")),\n        dir.join(format!(\"{stem}.sha256\")),\n        dir.join(format!(\"{stem}.version\")),\n        dir.join(format!(\"{stem}.attempts\")),\n    )\n}\n\n/// How many startups may arm one payload before it is dropped. A payload\n/// whose swap keeps failing (a lock held by a surviving instance, say)\n/// must not bounce every launch forever.\nconst MAX_PENDING_ATTEMPTS: u32 = 3;\n\n/// Moves a verified stage into `<home>/update/` as this binary family's\n/// pending payload: `{stem}.pending`, `{stem}.sha256`, `{stem}.version`.\n/// The durable copy survives process exit, so a quit by any route — or\n/// the next launch when the armed helper is gone — still lands the swap.\n///\n/// # Errors\n///\n/// Returns a failure message; the running installation is untouched.\npub fn persist_pending_update(\n    home: &mycode_agent::HomeLayout,\n    prepared: &PreparedUpdate,\n) -> Result<PreparedUpdate, String> {\n    let dir = pending_dir(home);\n    std::fs::create_dir_all(&dir).map_err(|error| format!(\"pending dir: {error}\"))?;\n    let (pending, sha_file, version_file, _) = pending_paths(&dir, ASSET_FAMILY);\n    let staging = pending.with_extension(\"moving\");\n    std::fs::copy(&prepared.new_binary, &staging)\n        .map_err(|error| format!(\"pending copy: {error}\"))?;\n    let actual = file_sha256(&staging)?;\n    if !actual.eq_ignore_ascii_case(&prepared.binary_sha256) {\n        let _ = std::fs::remove_file(&staging);\n        return Err(\"pending copy failed its sha256 check\".to_owned());\n    }\n    std::fs::rename(&staging, &pending).map_err(|error| format!(\"pending move: {error}\"))?;\n    std::fs::write(&sha_file, format!(\"{}\\n\", prepared.binary_sha256))\n        .map_err(|error| format!(\"pending digest: {error}\"))?;\n    // The version file is written last: it is the marker reconcile needs,\n    // so a crash mid-persist leaves an incomplete payload to clean up.\n    std::fs::write(&version_file, format!(\"{}\\n\", prepared.version))\n        .map_err(|error| format!(\"pending version: {error}\"))?;\n    // The temp stage is consumed; a reset at startup sweeps leftovers.\n    let _ = std::fs::remove_dir_all(&prepared.stage_dir);\n    Ok(PreparedUpdate {\n        version: prepared.version.clone(),\n        new_binary: pending,\n        stage_dir: dir,\n        binary_sha256: prepared.binary_sha256.clone(),\n    })\n}\n\n/// What [`reconcile_pending_update`] found in the pending-update slot.\n#[derive(Debug, PartialEq, Eq)]\npub enum PendingUpdate {\n    /// No payload, or one dropped as superseded, corrupt, or failing.\n    None,\n    /// The payload's version is the one running now: the swap landed since\n    /// the last launch, and the payload was cleaned up.\n    Applied(String),\n    /// The swap is armed and lands when this process exits.\n    Armed(String),\n}\n\n/// Startup pass over this binary family's pending payload.\n///\n/// A payload left by a session that never finished its swap — a crash, a\n/// rebooted helper, a lost race — is re-armed, so it still lands when\n/// this process leaves (Unix swaps in place at once). A stale payload\n/// (already applied, or superseded) and a corrupt one are deleted, and a\n/// payload that failed too many startups is dropped so the app always\n/// opens. The swap helper leaves the payload in place, so an applied one\n/// is how the first launch of the new version learns the update landed.\npub fn reconcile_pending_update(home: &mycode_agent::HomeLayout, relaunch: bool) -> PendingUpdate {\n    if crate::install::install_skipped() {\n        return PendingUpdate::None;\n    }\n    let dir = pending_dir(home);\n    let (pending, sha_file, version_file, attempts_file) = pending_paths(&dir, ASSET_FAMILY);\n    let cleanup = |include_helpers: bool| {\n        for path in [&pending, &sha_file, &version_file, &attempts_file] {\n            let _ = std::fs::remove_file(path);\n        }\n        if include_helpers {\n            sweep_update_helpers(&dir);\n        }\n    };\n    if !pending.is_file() {\n        // No payload: drop stray sidecars and dead helpers together.\n        if version_file.exists() || sha_file.exists() || attempts_file.exists() {\n            cleanup(true);\n        }\n        return PendingUpdate::None;\n    }\n    let version = std::fs::read_to_string(&version_file)\n        .ok()\n        .map(|value| value.trim().to_owned());\n    let sha = std::fs::read_to_string(&sha_file)\n        .ok()\n        .map(|value| value.trim().to_owned());\n    let (Some(version), Some(sha)) = (version, sha) else {\n        cleanup(true);\n        return PendingUpdate::None;\n    };\n    if !is_newer(&version, current_version()) {\n        cleanup(true);\n        return if version.trim_start_matches('v') == current_version() {\n            PendingUpdate::Applied(version)\n        } else {\n            PendingUpdate::None\n        };\n    }\n    let actual = file_sha256(&pending);\n    if !actual.is_ok_and(|hash| hash.eq_ignore_ascii_case(&sha)) {\n        cleanup(true);\n        return PendingUpdate::None;\n    }\n    let attempts: u32 = std::fs::read_to_string(&attempts_file)\n        .ok()\n        .and_then(|value| value.trim().parse().ok())\n        .unwrap_or(0);\n    if attempts >= MAX_PENDING_ATTEMPTS {\n        cleanup(true);\n        return PendingUpdate::None;\n    }\n    // Count before arming so a spawn that crashes still bounds the loop.\n    let _ = std::fs::write(&attempts_file, (attempts + 1).to_string());\n    let staged = PreparedUpdate {\n        version: version.clone(),\n        new_binary: pending,\n        stage_dir: dir,\n        binary_sha256: sha,\n    };\n    match arm_staged_update(&staged, relaunch) {\n        Ok(()) => PendingUpdate::Armed(version),\n        Err(_) => PendingUpdate::None,\n    }\n}\n\n/// Removes dead update helpers and scripts inside [`pending_dir`]. A\n/// helper whose process still runs is locked (Windows) or mid-flight\n/// (Unix); removal failures are ignored either way.\nfn sweep_update_helpers(dir: &Path) {\n    let Ok(entries) = std::fs::read_dir(dir) else {\n        return;\n    };\n    for entry in entries.flatten() {\n        let name = entry.file_name();\n        let Some(name) = name.to_str() else { continue };\n        let helper = name.starts_with(\"mycode-update-helper-\") && name.ends_with(\".exe\");\n        let script = name.starts_with(\"update-\") && name.ends_with(\".sh\");\n        // A `.moving` rename source is a persist interrupted mid-copy.\n        let moving = name.ends_with(\".moving\");\n        if helper || script || moving {\n            let _ = std::fs::remove_file(entry.path());\n        }\n    }\n}\n\n/// Removes stale staging directories left by interrupted updates.\n///\n/// A stage is named after the process downloading into it, so a stage whose\n/// process still runs is that instance's download in flight and is kept.\npub fn cleanup_stale_stages() {\n    let Ok(entries) = std::fs::read_dir(std::env::temp_dir()) else {\n        return;\n    };\n    for entry in entries.flatten() {\n        let name = entry.file_name();\n        let Some(name) = name.to_str() else {\n            continue;\n        };\n        if name.starts_with(\"mycode-update-\")\n            && !stage_in_use(name, apply::process_is_running)\n            && entry.path().is_dir()\n        {\n            let _ = std::fs::remove_dir_all(entry.path());\n        }\n    }\n}\n\n/// Whether stage `name` (`mycode-update-{pid}-{version}`) belongs to a\n/// running process other than this one. A name without a pid is a leftover.\nfn stage_in_use(name: &str, running: impl Fn(u32) -> bool) -> bool {\n    name.strip_prefix(\"mycode-update-\")\n        .and_then(|rest| rest.split('-').next())\n        .and_then(|pid| pid.parse::<u32>().ok())\n        .is_some_and(|pid| pid != std::process::id() && running(pid))\n}\n\n#[cfg(not(windows))]\nfn unix_script(new_binary: &Path, current: &Path, sha256: &str, relaunch: bool) -> String {\n    let previous = previous_path(current);\n    let previous = previous.to_string_lossy();\n    let current = current.to_string_lossy();\n    let new_binary = new_binary.to_string_lossy();\n    // `shasum -a 256` is the hasher stock macOS ships. `sha256sum` is the\n    // fallback for other Unix hosts. A failed backup stops the script; the\n    // replace is not attempted without `.mycode-previous`. `cp -p` keeps the\n    // mode, so a rollback puts an executable binary back. Once the replaced\n    // binary verifies, the backup is deleted so old versions do not pile up\n    // next to the install. Paths and the expected hash are single-quoted:\n    // `$`, backticks, and `\"` stay literal.\n    let relaunch_line = if relaunch {\n        \"nohup \\\"$current\\\" >/dev/null 2>&1 &\\n\"\n    } else {\n        \"\"\n    };\n    let template = r#\"#!/bin/sh\nset -e\nprev=__PREVIOUS__\ncurrent=__CURRENT__\nnew=__NEW__\nexpected=__HASH__\nhash_file() {\n  _file=$1\n  if command -v shasum >/dev/null 2>&1; then\n    shasum -a 256 \"$_file\" | awk '{print $1}'\n    return 0\n  fi\n  if command -v sha256sum >/dev/null 2>&1; then\n    sha256sum \"$_file\" | awk '{print $1}'\n    return 0\n  fi\n  echo \"updater: neither shasum nor sha256sum is available\" >&2\n  exit 1\n}\ni=0\ncopied=0\nactual=$(hash_file \"$current\")\nif [ -n \"$actual\" ] && [ \"$actual\" = \"$expected\" ]; then\n  # A sibling helper already landed the swap; only relaunch remains.\n  rm -f \"$new\" 2>/dev/null || true\n__RELAUNCH__\n  rm -f \"$0\"\n  exit 0\nfi\nactual=$(hash_file \"$new\")\nif [ -z \"$actual\" ] || [ \"$actual\" != \"$expected\" ]; then\n  echo \"updater: staged binary sha256 does not match\" >&2\n  exit 1\nfi\nwhile [ \"$i\" -lt 30 ]; do\n  if cp -p \"$current\" \"$prev\" 2>/dev/null; then\n    copied=1\n    break\n  fi\n  sleep 1\n  i=$((i+1))\ndone\nif [ \"$copied\" -ne 1 ]; then\n  echo \"updater: could not back up the current binary\" >&2\n  exit 1\nfi\nj=0\nreplaced=0\nwhile [ \"$j\" -lt 30 ]; do\n  if mv -f \"$new\" \"$current\" 2>/dev/null; then\n    replaced=1\n    break\n  fi\n  sleep 1\n  j=$((j+1))\ndone\nif [ \"$replaced\" -ne 1 ]; then\n  actual=$(hash_file \"$current\")\n  if [ -n \"$actual\" ] && [ \"$actual\" = \"$expected\" ]; then\n    # A sibling helper landed the swap mid-flight; only relaunch remains.\n    rm -f \"$prev\" 2>/dev/null || true\n__RELAUNCH__\n    rm -f \"$0\"\n    exit 0\n  fi\n  echo \"updater: could not replace the current binary\" >&2\n  exit 1\nfi\nactual=$(hash_file \"$current\")\nif [ -z \"$actual\" ] || [ \"$actual\" != \"$expected\" ]; then\n  if ! mv -f \"$prev\" \"$current\"; then\n    echo \"updater: replaced binary sha256 does not match; backup restore failed\" >&2\n    exit 1\n  fi\n  echo \"updater: replaced binary sha256 does not match; restored backup\" >&2\n  exit 1\nfi\nchmod +x \"$current\" 2>/dev/null || true\nrm -f \"$prev\"\n__RELAUNCH__\nrm -f \"$0\"\n\"#;\n    template\n        .replace(\"__PREVIOUS__\", &shell_single_quote(&previous))\n        .replace(\"__CURRENT__\", &shell_single_quote(&current))\n        .replace(\"__NEW__\", &shell_single_quote(&new_binary))\n        .replace(\"__HASH__\", &shell_single_quote(sha256))\n        .replace(\"__RELAUNCH__\", relaunch_line)\n}\n\nfn previous_path(current: &Path) -> PathBuf {\n    let file_name = current.file_name().unwrap_or(current.as_os_str());\n    let mut name = file_name.to_os_string();\n    name.push(\".mycode-previous\");\n    current.with_file_name(name)\n}\n\n/// The staged file the Windows swap copies next to `target` before it is\n/// renamed into place.\nfn incoming_path(current: &Path) -> PathBuf {\n    let file_name = current.file_name().unwrap_or(current.as_os_str());\n    current.with_file_name(format!(\".{}.mycode-incoming\", file_name.to_string_lossy()))\n}\n\n/// Removes self-update leftovers next to the running executable.\n///\n/// The swap deletes `*.mycode-previous` after a verified replace and stages\n/// `*.mycode-incoming` before every rename, and only relaunches the target\n/// binary after verification has succeeded (no rollback ever runs after\n/// relaunch). An interrupted helper, an older build, or a transient\n/// remove lock can still leave either file behind, so normal UI startup\n/// sweeps both paths immediately.\npub fn cleanup_previous_binary() {\n    let Ok(exe) = std::env::current_exe() else {\n        return;\n    };\n    for path in [previous_path(&exe), incoming_path(&exe)] {\n        let Ok(meta) = path.metadata() else {\n            continue;\n        };\n        if !meta.is_file() {\n            continue;\n        }\n        let _ = std::fs::remove_file(&path);\n    }\n}\n\n/// Single-quote `text` for `/bin/sh`. `$`, backticks, `\"`, and `\\` stay\n/// literal. An embedded `'` ends and reopens the quote.\n#[cfg(not(windows))]\nfn shell_single_quote(text: &str) -> String {\n    format!(\"'{}'\", text.replace('\\'', \"'\\\\''\"))\n}\n\n/// SHA-256 of one file, streamed so a multi-hundred-megabyte asset never\n/// sits whole in memory. The digest is lowercase hex.\nfn file_sha256(path: &Path) -> Result<String, String> {\n    Ok(hex_encode(&file_sha256_raw(path)?))\n}\n\nfn file_sha256_raw(path: &Path) -> Result<[u8; 32], String> {\n    let mut file = std::fs::File::open(path).map_err(|error| format!(\"hash read: {error}\"))?;\n    let mut hasher = sha2::Sha256::new();\n    // Chunked reads: the digest crate's hasher does not implement\n    // `io::Write` here, and reading the whole file would buffer a\n    // multi-hundred-megabyte asset in memory just to hash it.\n    let mut buffer = vec![0u8; 64 * 1024];\n    loop {\n        let read = file\n            .read(&mut buffer)\n            .map_err(|error| format!(\"hash read: {error}\"))?;\n        if read == 0 {\n            break;\n        }\n        hasher.update(&buffer[..read]);\n    }\n    Ok(hasher.finalize().into())\n}\n\n/// Lowercase hex without a `format!` allocation per byte.\nfn hex_encode(bytes: &[u8]) -> String {\n    const HEX: &[u8; 16] = b\"0123456789abcdef\";\n    let mut out = String::with_capacity(bytes.len() * 2);\n    for byte in bytes {\n        out.push(HEX[usize::from(byte >> 4)] as char);\n        out.push(HEX[usize::from(byte & 0x0f)] as char);\n    }\n    out\n}\n\n/// Lowercase hex of one in-memory byte slice. Test fixtures build expected\n/// digests from it; production hashes files through [`file_sha256`].\n#[cfg(test)]\nfn sha256_hex(bytes: &[u8]) -> String {\n    hex_encode(&sha2::Sha256::digest(bytes))\n}\n\n#[cfg(test)]\nmod tests;\n","crates/mycode-app/src/updates/apply.rs":"//! Windows self-update: a copy of the running executable applies the staged\n//! binary, then optionally relaunches it.\n//!\n//! The UI process spawns that helper with explicit arguments and exits. The\n//! helper waits for the UI pid, copies the staged file onto the install\n//! directory (so a download on another volume still lands), renames the old\n//! binary to `*.mycode-previous` for an in-flight restore, and, when asked,\n//! starts the new binary with no updater arguments. Once the replaced binary\n//! verifies, the backup is deleted: old versions must not pile up next to the\n//! install. A detached `cmd` script is not used: it could copy a backup and\n//! then fail to replace a locked image.\n//!\n//! macOS keeps the shell script in the parent module.\n\nuse std::path::{Path, PathBuf};\nuse std::time::Duration;\n\nuse super::{incoming_path, previous_path};\n\n/// Flag that selects the Windows apply helper.\npub const APPLY_UPDATE_ARG: &str = \"--mycode-apply-update\";\n\n/// Arguments the helper receives. Paths are separate argv entries, so spaces\n/// and `%` stay literal.\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct ApplyUpdateArgs {\n    /// Installed executable to replace.\n    pub target: PathBuf,\n    /// Staged, already verified executable.\n    pub source: PathBuf,\n    /// Expected SHA-256 of `source`, lowercase or mixed-case hex.\n    pub sha256: String,\n    /// Process id of the UI that must exit before the swap.\n    pub wait_pid: u32,\n    /// Start `target` after a successful swap.\n    pub relaunch: bool,\n}\n\n/// Parses a helper invocation.\n///\n/// `Ok(None)` is a normal launch. `Ok(Some(_))` is the apply helper. `Err`\n/// means the apply flag was present but the arguments were incomplete or\n/// invalid.\npub fn parse_apply_update_args<I, S>(args: I) -> Result<Option<ApplyUpdateArgs>, String>\nwhere\n    I: IntoIterator<Item = S>,\n    S: AsRef<str>,\n{\n    let args: Vec<String> = args\n        .into_iter()\n        .map(|value| value.as_ref().to_owned())\n        .collect();\n    if !args.iter().any(|arg| arg == APPLY_UPDATE_ARG) {\n        return Ok(None);\n    }\n    let mut target = None;\n    let mut source = None;\n    let mut sha256 = None;\n    let mut wait_pid = None;\n    let mut relaunch = false;\n    let mut index = 0;\n    while index < args.len() {\n        let arg = args[index].as_str();\n        match arg {\n            \"--mycode-apply-update\" => {}\n            \"--relaunch\" => relaunch = true,\n            \"--target\" | \"--source\" | \"--sha256\" | \"--wait-pid\" => {\n                let value = args\n                    .get(index + 1)\n                    .filter(|value| !value.starts_with(\"--\"))\n                    .ok_or_else(|| format!(\"updater: {arg} needs a value\"))?;\n                match arg {\n                    \"--target\" => target = Some(PathBuf::from(value)),\n                    \"--source\" => source = Some(PathBuf::from(value)),\n                    \"--sha256\" => sha256 = Some(value.clone()),\n                    \"--wait-pid\" => {\n                        wait_pid =\n                            Some(value.parse::<u32>().map_err(|_| {\n                                \"updater: --wait-pid is not a process id\".to_owned()\n                            })?);\n                    }\n                    _ => {}\n                }\n                index += 1;\n            }\n            other => return Err(format!(\"updater: unknown argument {other}\")),\n        }\n        index += 1;\n    }\n    let target = target.ok_or_else(|| \"updater: --target is required\".to_owned())?;\n    let source = source.ok_or_else(|| \"updater: --source is required\".to_owned())?;\n    let sha256 = sha256.ok_or_else(|| \"updater: --sha256 is required\".to_owned())?;\n    if sha256.len() != 64 || !sha256.bytes().all(|byte| byte.is_ascii_hexdigit()) {\n        return Err(\"updater: --sha256 must be 64 hex digits\".to_owned());\n    }\n    let wait_pid = wait_pid.ok_or_else(|| \"updater: --wait-pid is required\".to_owned())?;\n    Ok(Some(ApplyUpdateArgs {\n        target,\n        source,\n        sha256,\n        wait_pid,\n        relaunch,\n    }))\n}\n\n/// Production callers are Windows-only. Unit tests round-trip the flags on\n/// every host.\n#[cfg(any(windows, test))]\npub(crate) fn helper_arguments(\n    target: &Path,\n    source: &Path,\n    sha256: &str,\n    wait_pid: u32,\n    relaunch: bool,\n) -> Vec<String> {\n    let mut args = vec![\n        APPLY_UPDATE_ARG.to_owned(),\n        \"--target\".to_owned(),\n        target.to_string_lossy().into_owned(),\n        \"--source\".to_owned(),\n        source.to_string_lossy().into_owned(),\n        \"--sha256\".to_owned(),\n        sha256.to_owned(),\n        \"--wait-pid\".to_owned(),\n        wait_pid.to_string(),\n    ];\n    if relaunch {\n        args.push(\"--relaunch\".to_owned());\n    }\n    args\n}\n\n/// Waits for the UI process, swaps the binary, and optionally relaunches it.\n///\n/// # Errors\n///\n/// Returns a failure message when the staged hash is wrong or the swap cannot\n/// finish. A busy target is retried. A hash mismatch is not.\npub fn run_apply_update_helper(args: &ApplyUpdateArgs) -> Result<(), String> {\n    wait_for_process_exit(args.wait_pid, Duration::from_secs(60));\n    // Sibling helpers share the staged source and the target's incoming\n    // path, so a loser's replace can fail mid-flight even though the swap\n    // landed. Checking the target digest treats that as applied — the\n    // relaunch flag, not the rename win, decides who restarts the app.\n    let applied = |args: &ApplyUpdateArgs| -> Result<bool, String> {\n        if super::file_sha256(&args.target)\n            .is_ok_and(|hash| hash.eq_ignore_ascii_case(&args.sha256))\n        {\n            if args.relaunch {\n                relaunch_target(&args.target)?;\n            }\n            return Ok(true);\n        }\n        Ok(false)\n    };\n    let mut last = String::new();\n    for _ in 0..30 {\n        if applied(args)? {\n            return Ok(());\n        }\n        match replace_verified_executable(&args.source, &args.target, &args.sha256) {\n            Ok(()) => {\n                if args.relaunch {\n                    relaunch_target(&args.target)?;\n                }\n                return Ok(());\n            }\n            Err(error) if error.retryable => {\n                last = error.message;\n                std::thread::sleep(Duration::from_secs(1));\n            }\n            Err(error) => {\n                if applied(args)? {\n                    return Ok(());\n                }\n                return Err(error.message);\n            }\n        }\n    }\n    if applied(args)? {\n        return Ok(());\n    }\n    Err(if last.is_empty() {\n        \"could not replace the current binary\".to_owned()\n    } else {\n        last\n    })\n}\n\n#[cfg(windows)]\npub(crate) fn spawn_windows_helper(\n    stage_dir: &Path,\n    current: &Path,\n    source: &Path,\n    sha256: &str,\n    relaunch: bool,\n) -> Result<(), String> {\n    // A unique name per arm: a second helper (a stage-time exit swap plus\n    // an install click, say) must not copy over a sibling already running.\n    let helper = stage_dir.join(format!(\n        \"mycode-update-helper-{}-{}.exe\",\n        std::process::id(),\n        crate::unix_now().as_nanos()\n    ));\n    std::fs::copy(current, &helper).map_err(|error| format!(\"updater helper: {error}\"))?;\n    let args = helper_arguments(current, source, sha256, std::process::id(), relaunch);\n    spawn_detached(&helper, &args)\n}\n\n#[cfg(windows)]\nfn spawn_detached(program: &Path, args: &[String]) -> Result<(), String> {\n    use std::os::windows::process::CommandExt as _;\n    use std::process::Command;\n    const DETACHED_PROCESS: u32 = 0x0000_0008;\n    const CREATE_NO_WINDOW: u32 = 0x0800_0000;\n    const CREATE_NEW_PROCESS_GROUP: u32 = 0x0000_0200;\n    const CREATE_BREAKAWAY_FROM_JOB: u32 = 0x0100_0000;\n    let mut command = Command::new(program);\n    command.args(args);\n    command.creation_flags(\n        DETACHED_PROCESS | CREATE_NO_WINDOW | CREATE_NEW_PROCESS_GROUP | CREATE_BREAKAWAY_FROM_JOB,\n    );\n    match command.spawn() {\n        Ok(_) => Ok(()),\n        Err(error) if error.raw_os_error() == Some(5) => {\n            let mut retry = Command::new(program);\n            retry.args(args);\n            retry.creation_flags(DETACHED_PROCESS | CREATE_NO_WINDOW | CREATE_NEW_PROCESS_GROUP);\n            retry\n                .spawn()\n                .map(|_| ())\n                .map_err(|error| format!(\"updater spawn: {error}\"))\n        }\n        Err(error) => Err(format!(\"updater spawn: {error}\")),\n    }\n}\n\n#[derive(Debug)]\nstruct SwapFailure {\n    message: String,\n    retryable: bool,\n}\n\nfn replace_verified_executable(\n    source: &Path,\n    target: &Path,\n    expected: &str,\n) -> Result<(), SwapFailure> {\n    let source_hash = super::file_sha256(source).map_err(fatal)?;\n    if !source_hash.eq_ignore_ascii_case(expected) {\n        return Err(fatal(\"staged binary sha256 does not match\".to_owned()));\n    }\n    if target\n        .parent()\n        .is_none_or(|parent| parent.as_os_str().is_empty())\n    {\n        return Err(fatal(\"target has no directory\".to_owned()));\n    }\n    if target.file_name().is_none() {\n        return Err(fatal(\"target has no file name\".to_owned()));\n    }\n    let incoming = incoming_path(target);\n    let backup = previous_path(target);\n    std::fs::copy(source, &incoming).map_err(|error| {\n        io_failure(\n            &error,\n            \"could not copy the staged binary into the install directory\",\n        )\n    })?;\n    let copied_hash = super::file_sha256(&incoming).map_err(fatal)?;\n    if !copied_hash.eq_ignore_ascii_case(expected) {\n        let _ = std::fs::remove_file(&incoming);\n        return Err(fatal(\"copied binary sha256 does not match\".to_owned()));\n    }\n    if target.exists() {\n        if backup.exists() {\n            let _ = std::fs::remove_file(&backup);\n        }\n        if let Err(error) = std::fs::rename(target, &backup) {\n            let _ = std::fs::remove_file(&incoming);\n            return Err(io_failure(&error, \"could not back up the current binary\"));\n        }\n    }\n    if let Err(error) = std::fs::rename(&incoming, target) {\n        let restored = restore_backup(&backup, target);\n        return Err(SwapFailure {\n            message: if restored {\n                format!(\"could not replace the current binary: {error}\")\n            } else {\n                format!(\"could not replace the current binary and backup restore failed: {error}\")\n            },\n            retryable: restored && is_retryable(&error),\n        });\n    }\n    let installed = super::file_sha256(target).map_err(fatal)?;\n    if !installed.eq_ignore_ascii_case(expected) {\n        let restored = restore_backup(&backup, target);\n        return Err(fatal(if restored {\n            \"replaced binary sha256 does not match; restored backup\".to_owned()\n        } else {\n            \"replaced binary sha256 does not match; backup restore failed\".to_owned()\n        }));\n    }\n    // The verified replace is final: the old-version backup is only for an\n    // in-flight restore, so it must not pile up next to the install. A\n    // transient lock (an antivirus scan of the freshly renamed file, say)\n    // fails a single attempt, so the delete is retried a few times before\n    // being left for the next launch's `cleanup_previous_binary` sweep.\n    for _ in 0..10 {\n        if std::fs::remove_file(&backup).is_ok() || !backup.exists() {\n            break;\n        }\n        std::thread::sleep(Duration::from_millis(200));\n    }\n    Ok(())\n}\n\nfn restore_backup(backup: &Path, target: &Path) -> bool {\n    if !backup.exists() {\n        return false;\n    }\n    if target.exists() {\n        let _ = std::fs::remove_file(target);\n    }\n    std::fs::rename(backup, target).is_ok()\n}\n\nfn fatal(message: String) -> SwapFailure {\n    SwapFailure {\n        message,\n        retryable: false,\n    }\n}\n\nfn io_failure(error: &std::io::Error, action: &str) -> SwapFailure {\n    SwapFailure {\n        message: format!(\"{action}: {error}\"),\n        retryable: is_retryable(error),\n    }\n}\n\nfn is_retryable(error: &std::io::Error) -> bool {\n    matches!(\n        error.kind(),\n        std::io::ErrorKind::PermissionDenied\n            | std::io::ErrorKind::WouldBlock\n            | std::io::ErrorKind::ResourceBusy\n    ) || matches!(error.raw_os_error(), Some(5 | 32 | 33))\n}\n\nfn wait_for_process_exit(pid: u32, timeout: Duration) {\n    if pid == 0 || pid == std::process::id() {\n        return;\n    }\n    let start = std::time::Instant::now();\n    while process_is_running(pid) {\n        if start.elapsed() > timeout {\n            return;\n        }\n        std::thread::sleep(Duration::from_millis(200));\n    }\n}\n\n#[cfg(unix)]\npub(crate) fn process_is_running(pid: u32) -> bool {\n    let Ok(pid) = i32::try_from(pid) else {\n        return false;\n    };\n    if pid <= 0 {\n        return false;\n    }\n    // Safety: `kill(pid, 0)` only probes the process and does not signal it.\n    let rc = unsafe { libc::kill(pid, 0) };\n    if rc == 0 {\n        return true;\n    }\n    std::io::Error::last_os_error().raw_os_error() == Some(libc::EPERM)\n}\n\n#[cfg(windows)]\npub(crate) fn process_is_running(pid: u32) -> bool {\n    use windows_sys::Win32::Foundation::{CloseHandle, STILL_ACTIVE};\n    use windows_sys::Win32::System::Threading::{\n        GetExitCodeProcess, OpenProcess, PROCESS_QUERY_LIMITED_INFORMATION,\n    };\n    if pid == 0 {\n        return false;\n    }\n    unsafe {\n        let handle = OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, 0, pid);\n        if handle.is_null() {\n            return false;\n        }\n        let mut code = 0u32;\n        let ok = GetExitCodeProcess(handle, &mut code);\n        let _ = CloseHandle(handle);\n        // `GetExitCodeProcess` writes a `u32`. windows-sys 0.61 types\n        // `STILL_ACTIVE` as `i32` (NTSTATUS, value 259).\n        ok != 0 && code == STILL_ACTIVE as u32\n    }\n}\n\n#[cfg(not(any(unix, windows)))]\npub(crate) fn process_is_running(_pid: u32) -> bool {\n    false\n}\n\nfn relaunch_target(target: &Path) -> Result<(), String> {\n    #[cfg(windows)]\n    return spawn_detached(target, &[]).map_err(|error| format!(\"updater relaunch: {error}\"));\n\n    #[cfg(not(windows))]\n    {\n        std::process::Command::new(target)\n            .stdin(std::process::Stdio::null())\n            .stdout(std::process::Stdio::null())\n            .stderr(std::process::Stdio::null())\n            .spawn()\n            .map(|_| ())\n            .map_err(|error| format!(\"updater relaunch: {error}\"))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{helper_arguments, parse_apply_update_args, replace_verified_executable};\n    use std::path::Path;\n\n    #[test]\n    fn absent_flag_is_a_normal_launch() {\n        let parsed = parse_apply_update_args([\"--other\"]).unwrap();\n        assert!(parsed.is_none());\n    }\n\n    #[test]\n    fn apply_args_round_trip_paths_with_spaces_and_percent() {\n        let target = Path::new(r\"C:\\Program Files\\%SystemRoot%\\app.exe\");\n        let source = Path::new(\"/tmp/stage/next build.exe\");\n        let sha = \"ab\".repeat(32);\n        let args = helper_arguments(target, source, &sha, 42, true);\n        let parsed = parse_apply_update_args(&args).unwrap().unwrap();\n        assert_eq!(parsed.target, target);\n        assert_eq!(parsed.source, source);\n        assert_eq!(parsed.sha256, sha);\n        assert_eq!(parsed.wait_pid, 42);\n        assert!(parsed.relaunch);\n        assert!(args.iter().any(|arg| arg.contains(\"%SystemRoot%\")));\n        assert!(args.iter().any(|arg| arg.contains(\"Program Files\")));\n        let quiet = helper_arguments(target, source, &sha, 42, false);\n        assert!(!quiet.iter().any(|arg| arg == \"--relaunch\"));\n    }\n\n    #[test]\n    fn incomplete_apply_args_fail() {\n        let error =\n            parse_apply_update_args([\"--mycode-apply-update\", \"--target\", \"app.exe\"]).unwrap_err();\n        assert!(error.contains(\"--source\"), \"{error}\");\n    }\n\n    fn scratch(label: &str) -> std::path::PathBuf {\n        let dir = std::env::temp_dir().join(format!(\n            \"mycode-apply-{label}-{}-{}\",\n            std::process::id(),\n            crate::unix_now().as_nanos()\n        ));\n        std::fs::create_dir_all(&dir).unwrap();\n        dir\n    }\n\n    #[test]\n    fn replace_cleans_the_backup_and_rejects_a_bad_hash() {\n        let dir = scratch(\"swap\");\n        let nested = dir.join(\"Program Files\");\n        std::fs::create_dir_all(&nested).unwrap();\n        let target = nested.join(\"app.exe\");\n        let source = dir.join(\"next.exe\");\n        std::fs::write(&target, b\"old-bytes\").unwrap();\n        std::fs::write(&source, b\"new-bytes\").unwrap();\n        let hash = super::super::sha256_hex(b\"new-bytes\");\n        replace_verified_executable(&source, &target, &hash).unwrap();\n        assert_eq!(std::fs::read(&target).unwrap(), b\"new-bytes\");\n        let backup = super::super::previous_path(&target);\n        assert!(\n            !backup.exists(),\n            \"a verified replace must not leave the old-version backup behind\"\n        );\n        std::fs::write(&source, b\"other\").unwrap();\n        let error = replace_verified_executable(&source, &target, &hash).unwrap_err();\n        assert!(!error.retryable);\n        assert!(error.message.contains(\"sha256\"), \"{}\", error.message);\n        assert_eq!(std::fs::read(&target).unwrap(), b\"new-bytes\");\n        let _ = std::fs::remove_dir_all(&dir);\n    }\n\n    #[cfg(unix)]\n    #[test]\n    fn helper_waits_until_the_pid_exits_then_swaps() {\n        let dir = scratch(\"wait\");\n        let target = dir.join(\"app\");\n        let source = dir.join(\"next\");\n        std::fs::write(&target, b\"old-bytes\").unwrap();\n        std::fs::write(&source, b\"new-bytes\").unwrap();\n        let mut child = std::process::Command::new(\"sh\")\n            .arg(\"-c\")\n            .arg(\"read line\")\n            .stdin(std::process::Stdio::piped())\n            .stdout(std::process::Stdio::null())\n            .stderr(std::process::Stdio::null())\n            .spawn()\n            .expect(\"sh\");\n        let stdin = child.stdin.take();\n        let args = super::ApplyUpdateArgs {\n            target: target.clone(),\n            source,\n            sha256: super::super::sha256_hex(b\"new-bytes\"),\n            wait_pid: child.id(),\n            relaunch: false,\n        };\n        let worker = std::thread::spawn(move || super::run_apply_update_helper(&args));\n        std::thread::sleep(std::time::Duration::from_millis(500));\n        assert_eq!(\n            std::fs::read(&target).unwrap(),\n            b\"old-bytes\",\n            \"swap ran while the waited pid was still alive\"\n        );\n        drop(stdin);\n        let _ = child.wait();\n        worker.join().unwrap().unwrap();\n        assert_eq!(std::fs::read(&target).unwrap(), b\"new-bytes\");\n        assert!(\n            !super::super::previous_path(&target).exists(),\n            \"old-version backup must be removed after the verified swap\"\n        );\n        let _ = std::fs::remove_dir_all(&dir);\n    }\n}\n","crates/mycode-app/src/mcp_client.rs":"//! First-party bounded MCP client.\n//!\n//! Speaks JSON-RPC 2.0 against configured servers over two transports:\n//! newline-delimited stdio for local commands and the MCP Streamable-HTTP\n//! wire for remote endpoints.\n//!\n//! Bounds: one MiB per message, 128 tools per server, and per-request\n//! timeouts. HTTPS for HTTP endpoints is required by settings validation,\n//! not by this client. The [`JsonRpcChannel`] seam abstracts the byte\n//! transport shared by both.\n\nuse std::future::Future;\nuse std::pin::Pin;\nuse std::sync::Arc;\nuse std::time::Duration;\n\nuse serde::Serialize;\nuse serde_json::{Value, json};\n\npub mod http_channel;\npub mod stdio_channel;\n\npub use http_channel::{HttpChannel, HttpChannelOptions, KeyHeader};\npub use stdio_channel::StdioChannel;\n\n/// One JSON-RPC request/response hop over a configured MCP server.\n///\n/// Implementations own the wire envelope: they wrap `id`, `method`, and\n/// `params` into a JSON-RPC request, wait for the response carrying the same\n/// id, map JSON-RPC error objects to [`McpError::Server`], and return the\n/// bare `result` value.\n/// Methods return boxed futures so the trait stays object-safe for\n/// `dyn JsonRpcChannel` dispatch; implementers write\n/// `Box::pin(async move { … })`.\npub trait JsonRpcChannel: Send + Sync + 'static {\n    /// Performs one request and returns the bare `result` value.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`McpError`] for transport, timeout, and protocol failures.\n    fn request<'a>(\n        &'a self,\n        id: u64,\n        method: &'a str,\n        params: Value,\n    ) -> Pin<Box<dyn Future<Output = Result<Value, McpError>> + Send + 'a>>;\n\n    /// Sends one notification that expects no response.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`McpError`] for transport failures.\n    fn notify<'a>(\n        &'a self,\n        method: &'a str,\n    ) -> Pin<Box<dyn Future<Output = Result<(), McpError>> + Send + 'a>>;\n\n    /// Releases the transport gracefully; stdio closes the child's stdin\n    /// and waits before killing it. Stateless transports do nothing.\n    fn shutdown<'a>(&'a self) -> Pin<Box<dyn Future<Output = ()> + Send + 'a>> {\n        Box::pin(async {})\n    }\n}\n\n/// Maximum accepted message bytes in either direction.\npub const MAX_MESSAGE_BYTES: usize = 1024 * 1024;\n/// Maximum tools listed per server.\npub const MAX_TOOLS: usize = 128;\n/// Per-request timeout every MCP channel is constructed with: it bounds each\n/// JSON-RPC hop for the channel's whole lifetime — the handshake, tools/list,\n/// and every tools/call a turn issues. Both the settings-page probe and the\n/// turn session channel pass this constant.\npub const DEFAULT_REQUEST_TIMEOUT: Duration = Duration::from_secs(60);\n/// Protocol revision this client speaks.\npub const PROTOCOL_VERSION: &str = \"2025-06-18\";\n/// Longest error detail kept from a server or a child's stderr.\nconst MAX_DETAIL_CHARS: usize = 512;\n\n/// Users paste either the raw key or `Bearer <key>`; the header always\n/// carries exactly one `Bearer ` prefix. Shared by the MCP HTTP channel and\n/// the web client transport, which both send bearer credentials.\npub(crate) fn strip_bearer_prefix(key: &str) -> &str {\n    let trimmed = key.trim();\n    trimmed\n        .split_once(char::is_whitespace)\n        .and_then(|(scheme, rest)| scheme.eq_ignore_ascii_case(\"bearer\").then_some(rest.trim()))\n        .unwrap_or(trimmed)\n}\n\n/// Errors surfaced by the MCP client.\n///\n/// Every variant that can carry a cause does, bounded to\n/// [`MAX_DETAIL_CHARS`]: a bare \"transport failure\" gives the user nothing\n/// to act on when a stdio server fails to start.\n#[derive(Debug, Clone, PartialEq, Eq, thiserror::Error)]\npub enum McpError {\n    /// The server violated the MCP wire contract.\n    #[error(\"protocol error: {0}\")]\n    Protocol(String),\n    /// A request exceeded its deadline.\n    #[error(\"request timed out\")]\n    Timeout,\n    /// The transport failed before a response arrived.\n    #[error(\"{0}\")]\n    Transport(String),\n    /// The server returned a JSON-RPC error object.\n    #[error(\"server error: {0}\")]\n    Server(String),\n    /// A request, response, or `tools/list` result exceeded its size or count bound.\n    #[error(\"response exceeded the size bound\")]\n    Oversized,\n}\n\nimpl McpError {\n    /// Builds a [`McpError::Protocol`] with a bounded detail.\n    #[must_use]\n    pub fn protocol(detail: impl Into<String>) -> Self {\n        Self::Protocol(bound_detail(detail.into()))\n    }\n\n    /// Builds a [`McpError::Transport`] with a bounded detail.\n    #[must_use]\n    pub fn transport(detail: impl Into<String>) -> Self {\n        Self::Transport(bound_detail(detail.into()))\n    }\n\n    /// Builds a [`McpError::Server`] from a JSON-RPC error object.\n    #[must_use]\n    pub fn server(error: &Value) -> Self {\n        let code = error[\"code\"].as_i64();\n        let message = error[\"message\"].as_str().unwrap_or(\"unspecified error\");\n        Self::Server(bound_detail(match code {\n            Some(code) => format!(\"{message} (code {code})\"),\n            None => message.to_owned(),\n        }))\n    }\n\n    /// True when the underlying connection is unusable and the caller\n    /// should reconnect rather than retry on the same channel.\n    #[must_use]\n    pub fn is_connection_lost(&self) -> bool {\n        matches!(self, Self::Transport(_) | Self::Timeout | Self::Oversized)\n    }\n}\n\n/// Trims one detail string to [`MAX_DETAIL_CHARS`] and a single line.\nfn bound_detail(detail: String) -> String {\n    let mut collapsed = String::new();\n    for (index, word) in detail.split_whitespace().enumerate() {\n        if index > 0 {\n            collapsed.push(' ');\n        }\n        collapsed.push_str(word);\n    }\n    if collapsed.chars().count() <= MAX_DETAIL_CHARS {\n        collapsed\n    } else {\n        let head: String = collapsed.chars().take(MAX_DETAIL_CHARS).collect();\n        format!(\"{head}\\u{2026}\")\n    }\n}\n\n/// One tool exposed by a server.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize)]\n#[serde(rename_all = \"camelCase\")]\npub struct McpTool {\n    pub name: String,\n    pub description: Option<String>,\n    pub input_schema: Value,\n    /// True only when the server set `annotations.readOnlyHint` to true.\n    /// A missing annotation is not read-only.\n    pub read_only: bool,\n}\n\n/// The outcome of one `tools/call`.\n///\n/// `is_error` mirrors the MCP `isError` flag: the tool ran and reported a\n/// failure *as data*, which the model should see verbatim so it can correct\n/// its arguments. Wire and server faults are [`McpError`] instead.\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct McpToolOutput {\n    /// Concatenated text content blocks.\n    pub text: String,\n    /// The server flagged the result as a tool-level error.\n    pub is_error: bool,\n}\n\n/// A connected, initialized MCP client bound to one channel.\npub struct McpClient {\n    channel: Arc<dyn JsonRpcChannel>,\n    next_id: u64,\n}\n\nimpl McpClient {\n    /// Creates one client over a transport channel.\n    #[must_use]\n    pub fn new(channel: Arc<dyn JsonRpcChannel>) -> Self {\n        Self {\n            channel,\n            next_id: 1,\n        }\n    }\n\n    /// Performs the MCP initialize handshake and sends the initialized\n    /// notification.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`McpError`] for transport and contract failures.\n    pub async fn initialize(&mut self) -> Result<Value, McpError> {\n        let result = self\n            .call(\n                \"initialize\",\n                json!({\n                    \"protocolVersion\": PROTOCOL_VERSION,\n                    \"capabilities\": {},\n                    \"clientInfo\": {\n                        \"name\": \"mycode\",\n                        \"version\": env!(\"CARGO_PKG_VERSION\"),\n                    },\n                }),\n            )\n            .await?;\n        self.channel.notify(\"notifications/initialized\").await?;\n        Ok(result)\n    }\n\n    /// Lists the tools the server exposes, bounded by [`MAX_TOOLS`].\n    ///\n    /// # Errors\n    ///\n    /// Returns [`McpError`] for transport and contract failures.\n    pub async fn list_tools(&mut self) -> Result<Vec<McpTool>, McpError> {\n        let result = self.call(\"tools/list\", json!({})).await?;\n        let Some(tools) = result[\"tools\"].as_array() else {\n            return Err(McpError::protocol(\"tools/list result has no tools array\"));\n        };\n        if tools.len() > MAX_TOOLS {\n            return Err(McpError::Oversized);\n        }\n        Ok(tools\n            .iter()\n            .filter_map(|tool| {\n                // A nameless tool cannot be called; skip it instead of\n                // advertising an empty name to the model.\n                let name = tool[\"name\"].as_str()?;\n                if name.is_empty() {\n                    return None;\n                }\n                Some(McpTool {\n                    name: name.to_owned(),\n                    description: tool[\"description\"].as_str().map(str::to_owned),\n                    input_schema: match &tool[\"inputSchema\"] {\n                        Value::Null => json!({\"type\": \"object\"}),\n                        schema => schema.clone(),\n                    },\n                    read_only: tool\n                        .get(\"annotations\")\n                        .and_then(|annotations| annotations.get(\"readOnlyHint\"))\n                        .and_then(Value::as_bool)\n                        == Some(true),\n                })\n            })\n            .collect())\n    }\n\n    /// Calls one tool and returns its concatenated text content together\n    /// with the server's `isError` flag.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`McpError`] for transport and contract failures.\n    pub async fn call_tool(\n        &mut self,\n        name: &str,\n        arguments: Value,\n    ) -> Result<McpToolOutput, McpError> {\n        let result = self\n            .call(\"tools/call\", json!({\"name\": name, \"arguments\": arguments}))\n            .await?;\n        let mut text = String::new();\n        if let Some(blocks) = result[\"content\"].as_array() {\n            for block in blocks {\n                let part = match block[\"type\"].as_str() {\n                    Some(\"text\") => block[\"text\"].as_str().map(str::to_owned),\n                    // Non-text blocks are summarized so the model learns the\n                    // tool produced something it cannot read inline.\n                    Some(\"image\") | Some(\"audio\") => Some(format!(\n                        \"[{} content omitted: {}]\",\n                        block[\"type\"].as_str().unwrap_or(\"binary\"),\n                        block[\"mimeType\"].as_str().unwrap_or(\"unknown type\")\n                    )),\n                    Some(\"resource\") => block[\"resource\"][\"text\"]\n                        .as_str()\n                        .map(str::to_owned)\n                        .or_else(|| {\n                            block[\"resource\"][\"uri\"]\n                                .as_str()\n                                .map(|uri| format!(\"[resource {uri}]\"))\n                        }),\n                    _ => None,\n                };\n                if let Some(part) = part {\n                    if !text.is_empty() {\n                        text.push('\\n');\n                    }\n                    text.push_str(&part);\n                }\n            }\n        }\n        // Servers that return structuredContent only still owe the model a\n        // readable body.\n        if text.is_empty() && !result[\"structuredContent\"].is_null() {\n            text = result[\"structuredContent\"].to_string();\n        }\n        Ok(McpToolOutput {\n            text,\n            is_error: result[\"isError\"].as_bool() == Some(true),\n        })\n    }\n\n    /// Releases the underlying transport (see [`JsonRpcChannel::shutdown`]).\n    pub async fn shutdown(&self) {\n        self.channel.shutdown().await;\n    }\n\n    async fn call(&mut self, method: &str, params: Value) -> Result<Value, McpError> {\n        let id = self.next_id;\n        self.next_id += 1;\n        self.channel.request(id, method, params).await\n    }\n}\n","crates/mycode-app/src/mcp_client/stdio_channel.rs":"//! Stdio transport: newline-delimited JSON-RPC over one child process.\n//!\n//! Windows needs two things a plain `Command::new(command)` does not do:\n//! resolve script launchers such as `npx`/`uvx` (installed as `npx.cmd`,\n//! which `CreateProcess` never finds because it only appends `.exe`) and\n//! spawn without a console window (the desktop binary runs windowed, so a\n//! child console would flash on every connect). Resolution lives in\n//! [`resolve_program`]. The process is created suspended, placed in a\n//! kill-on-close Job, and resumed from `PROCESS_INFORMATION.hThread`.\n\nuse std::collections::VecDeque;\nuse std::path::{Path, PathBuf};\n#[cfg(not(windows))]\nuse std::process::Stdio;\nuse std::sync::{Arc, Mutex as StdMutex};\nuse std::time::Duration;\n\nuse std::future::Future;\nuse std::pin::Pin;\n\nuse serde_json::{Value, json};\nuse tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};\n#[cfg(not(windows))]\nuse tokio::process::Child;\nuse tokio::sync::Mutex;\n\n#[cfg(windows)]\nuse mycode_agent::WindowsStdioProcess;\n\n#[cfg(windows)]\ntype HostChild = WindowsStdioProcess;\n#[cfg(not(windows))]\ntype HostChild = Child;\n\nuse super::{JsonRpcChannel, MAX_MESSAGE_BYTES, McpError};\n\n/// Stderr lines kept for diagnostics when the server fails.\nconst STDERR_TAIL_LINES: usize = 12;\n/// Longest stderr line kept verbatim.\nconst STDERR_LINE_CHARS: usize = 400;\n/// Grace period between closing stdin and killing the child on shutdown.\nconst SHUTDOWN_GRACE: Duration = Duration::from_millis(1500);\n\n/// One live stdio server session.\n///\n/// The child is killed when the channel drops; stdout stays bounded by\n/// [`MAX_MESSAGE_BYTES`] per line and the stderr tail is retained for error\n/// messages.\npub struct StdioChannel {\n    child: Mutex<HostChild>,\n    stdin: Mutex<Option<tokio::process::ChildStdin>>,\n    stdout: Mutex<BufReader<tokio::process::ChildStdout>>,\n    stderr_tail: Arc<StdMutex<VecDeque<String>>>,\n    timeout: Duration,\n    /// Process-group id captured at spawn. Shutdown signals the group.\n    #[cfg(unix)]\n    group_id: Option<i32>,\n}\n\nimpl StdioChannel {\n    /// Spawns one server command with extra environment variables.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`McpError::Transport`] when the command cannot be resolved or\n    /// started, or its pipes are missing.\n    pub async fn spawn(\n        command: &str,\n        args: &[String],\n        env: &[(String, String)],\n        timeout: Duration,\n    ) -> Result<Self, McpError> {\n        if !mycode_agent::is_mcp_executable(command) {\n            return Err(McpError::transport(\n                \"MCP command must be an executable path, not a shell string\".to_owned(),\n            ));\n        }\n        let program = resolve_program(command).ok_or_else(|| {\n            McpError::transport(format!(\n                \"command not found on PATH: {command} (install it or use an absolute path)\"\n            ))\n        })?;\n        let mut child = launch_stdio_process(&program, args, env)?;\n        #[cfg(unix)]\n        let group_id = child.id().map(|pid| pid as i32);\n        let stdin = child\n            .stdin\n            .take()\n            .ok_or_else(|| McpError::transport(\"child stdin pipe missing\"))?;\n        let stdout = child\n            .stdout\n            .take()\n            .ok_or_else(|| McpError::transport(\"child stdout pipe missing\"))?;\n        let stderr_tail = Arc::new(StdMutex::new(VecDeque::with_capacity(STDERR_TAIL_LINES)));\n        if let Some(stderr) = child.stderr.take() {\n            let tail = stderr_tail.clone();\n            tokio::spawn(async move {\n                let mut lines = BufReader::new(stderr).lines();\n                while let Ok(Some(line)) = lines.next_line().await {\n                    let line: String = line.chars().take(STDERR_LINE_CHARS).collect();\n                    if line.trim().is_empty() {\n                        continue;\n                    }\n                    if let Ok(mut tail) = tail.lock() {\n                        if tail.len() == STDERR_TAIL_LINES {\n                            tail.pop_front();\n                        }\n                        tail.push_back(line);\n                    }\n                }\n            });\n        }\n        Ok(Self {\n            child: Mutex::new(child),\n            stdin: Mutex::new(Some(stdin)),\n            stdout: Mutex::new(BufReader::new(stdout)),\n            stderr_tail,\n            timeout,\n            #[cfg(unix)]\n            group_id,\n        })\n    }\n\n    /// Closes stdin, waits briefly for a clean exit, then kills the child.\n    ///\n    /// The MCP stdio contract asks clients to close stdin first so the\n    /// server can exit on its own; `.cmd` launchers on Windows spawn the\n    /// real server as a grandchild that only a stdin EOF reaches.\n    pub async fn shutdown(&self) {\n        self.stdin.lock().await.take();\n        let mut child = self.child.lock().await;\n        let _ = tokio::time::timeout(SHUTDOWN_GRACE, child.wait()).await;\n        #[cfg(unix)]\n        if let Some(group_id) = self.group_id {\n            // SAFETY: `group_id` is the child's pid, and `configure_command`\n            // placed that pid in its own process group. `killpg` signals\n            // every member, including grandchildren the parent spawned.\n            unsafe {\n                libc::killpg(group_id, libc::SIGKILL);\n            }\n        }\n        #[cfg(windows)]\n        {\n            let _ = child.terminate_job();\n        }\n        let _ = child.kill().await;\n    }\n\n    /// Reads one stdout line. The Unix shutdown test uses this to observe a\n    /// grandchild pid. Windows tests do not call it.\n    #[cfg(all(test, unix))]\n    async fn read_stdout_line(&self) -> Result<String, McpError> {\n        let mut raw = String::new();\n        self.stdout\n            .lock()\n            .await\n            .read_line(&mut raw)\n            .await\n            .map_err(|error| McpError::transport(error.to_string()))?;\n        Ok(raw)\n    }\n\n    /// Renders the retained stderr tail for an error message.\n    fn stderr_context(&self) -> String {\n        let Ok(tail) = self.stderr_tail.lock() else {\n            return String::new();\n        };\n        if tail.is_empty() {\n            return String::new();\n        }\n        let mut joined = String::new();\n        for (index, line) in tail.iter().enumerate() {\n            if index > 0 {\n                joined.push_str(\" | \");\n            }\n            joined.push_str(line);\n        }\n        format!(\"; stderr: {joined}\")\n    }\n\n    /// Describes why stdout closed: exit status plus the stderr tail.\n    async fn closed_reason(&self) -> String {\n        let status = match self.child.lock().await.try_wait() {\n            Ok(Some(status)) => format!(\"server exited with {status}\"),\n            Ok(None) => \"server closed its stdout\".to_owned(),\n            Err(_) => \"server state unknown\".to_owned(),\n        };\n        format!(\"{status}{}\", self.stderr_context())\n    }\n\n    async fn write_line(&self, line: &[u8]) -> Result<(), McpError> {\n        let mut guard = self.stdin.lock().await;\n        let stdin = guard\n            .as_mut()\n            .ok_or_else(|| McpError::transport(\"server stdin is closed\"))?;\n        let write = async {\n            stdin.write_all(line).await?;\n            stdin.write_all(b\"\\n\").await?;\n            stdin.flush().await\n        };\n        write\n            .await\n            .map_err(|error| McpError::transport(format!(\"write to server failed: {error}\")))\n    }\n\n    async fn wait_for(&self, id: u64) -> Result<Value, McpError> {\n        let mut raw = Vec::new();\n        loop {\n            let read =\n                read_bounded_line(&mut *self.stdout.lock().await, &mut raw, MAX_MESSAGE_BYTES)\n                    .await\n                    .map_err(|error| {\n                        McpError::transport(format!(\"read from server failed: {error}\"))\n                    })?;\n            match read {\n                LineRead::Eof => return Err(McpError::transport(self.closed_reason().await)),\n                LineRead::Oversized => return Err(McpError::Oversized),\n                LineRead::Line => {}\n            }\n            // Servers occasionally log to stdout; a non-JSON line is noise,\n            // not a protocol failure.\n            let Ok(text) = std::str::from_utf8(&raw) else {\n                continue;\n            };\n            let trimmed = text.trim();\n            if trimmed.is_empty() {\n                continue;\n            }\n            let Ok(value) = serde_json::from_str::<Value>(trimmed) else {\n                continue;\n            };\n            if value[\"method\"].is_string() && !value[\"id\"].is_null() {\n                self.answer_server_request(&value).await?;\n                continue;\n            }\n            if value[\"id\"].as_u64() != Some(id) {\n                // Notifications and stale replies are skipped.\n                continue;\n            }\n            if let Some(error) = value.get(\"error\").filter(|error| error.is_object()) {\n                return Err(McpError::server(error));\n            }\n            return Ok(value[\"result\"].clone());\n        }\n    }\n\n    /// Replies to a server-initiated request so the server never blocks on\n    /// a capability this client does not offer.\n    async fn answer_server_request(&self, request: &Value) -> Result<(), McpError> {\n        let reply = if request[\"method\"].as_str() == Some(\"ping\") {\n            json!({\"jsonrpc\": \"2.0\", \"id\": request[\"id\"], \"result\": {}})\n        } else {\n            json!({\n                \"jsonrpc\": \"2.0\",\n                \"id\": request[\"id\"],\n                \"error\": {\"code\": -32601, \"message\": \"method not supported by this client\"},\n            })\n        };\n        let line =\n            serde_json::to_vec(&reply).map_err(|error| McpError::protocol(error.to_string()))?;\n        self.write_line(&line).await\n    }\n}\n\nimpl JsonRpcChannel for StdioChannel {\n    fn request<'a>(\n        &'a self,\n        id: u64,\n        method: &'a str,\n        params: Value,\n    ) -> Pin<Box<dyn Future<Output = Result<Value, McpError>> + Send + 'a>> {\n        Box::pin(async move {\n            let line = serde_json::to_vec(&json!({\n            \"jsonrpc\": \"2.0\",\n            \"id\": id,\n            \"method\": method,\n            \"params\": params,\n            }))\n            .map_err(|error| McpError::protocol(error.to_string()))?;\n            if line.len() > MAX_MESSAGE_BYTES {\n                return Err(McpError::Oversized);\n            }\n            self.write_line(&line).await?;\n            match tokio::time::timeout(self.timeout, self.wait_for(id)).await {\n                Ok(outcome) => outcome,\n                Err(_) => Err(McpError::Timeout),\n            }\n        })\n    }\n\n    fn notify<'a>(\n        &'a self,\n        method: &'a str,\n    ) -> Pin<Box<dyn Future<Output = Result<(), McpError>> + Send + 'a>> {\n        Box::pin(async move {\n            let line = serde_json::to_vec(&json!({\n            \"jsonrpc\": \"2.0\",\n            \"method\": method,\n            }))\n            .map_err(|error| McpError::protocol(error.to_string()))?;\n            self.write_line(&line).await\n        })\n    }\n\n    fn shutdown<'a>(&'a self) -> Pin<Box<dyn Future<Output = ()> + Send + 'a>> {\n        Box::pin(async move {\n            StdioChannel::shutdown(self).await;\n        })\n    }\n}\n\n/// Outcome of one [`read_bounded_line`].\n#[derive(Debug, PartialEq, Eq)]\nenum LineRead {\n    /// `line` holds one line (its newline included when present).\n    Line,\n    /// The line was longer than the limit. It was consumed through its\n    /// newline but not kept, so the next read starts on a fresh line.\n    Oversized,\n    /// The stream ended before any byte of a new line.\n    Eof,\n}\n\n/// Reads one newline-terminated line of at most `limit` bytes into `line`.\n///\n/// `read_line` buffers a whole line before its length can be checked, so a\n/// server that writes one huge line (or never a newline) could grow memory\n/// for a full request timeout. This keeps at most `limit` bytes.\nasync fn read_bounded_line<R>(\n    reader: &mut R,\n    line: &mut Vec<u8>,\n    limit: usize,\n) -> std::io::Result<LineRead>\nwhere\n    R: tokio::io::AsyncBufRead + Unpin,\n{\n    line.clear();\n    let mut oversized = false;\n    loop {\n        let available = reader.fill_buf().await?;\n        if available.is_empty() {\n            return Ok(if oversized {\n                LineRead::Oversized\n            } else if line.is_empty() {\n                LineRead::Eof\n            } else {\n                LineRead::Line\n            });\n        }\n        let newline = available.iter().position(|byte| *byte == b'\\n');\n        let used = newline.map_or(available.len(), |index| index + 1);\n        if !oversized {\n            if line.len() + used > limit {\n                oversized = true;\n                line.clear();\n            } else {\n                line.extend_from_slice(&available[..used]);\n            }\n        }\n        reader.consume(used);\n        if newline.is_some() {\n            return Ok(if oversized {\n                LineRead::Oversized\n            } else {\n                LineRead::Line\n            });\n        }\n    }\n}\n\n/// Resolves `command` to something the OS can launch.\n///\n/// A command carrying a path separator is used as written. A bare name is\n/// searched on `PATH`; on Windows the launchable `PATHEXT` extensions are\n/// tried per directory in order (`.com`, `.exe`, `.bat`, `.cmd`), so `npx`\n/// resolves to `npx.cmd` and `uvx` to `uvx.exe`. `None` means nothing matched.\nfn resolve_program(command: &str) -> Option<PathBuf> {\n    let command = command.trim();\n    if command.is_empty() {\n        return None;\n    }\n    if command.contains(['/', '\\\\']) {\n        return Some(PathBuf::from(command));\n    }\n    #[cfg(windows)]\n    {\n        resolve_on_path_windows(command)\n    }\n    #[cfg(not(windows))]\n    {\n        // Unix `execvp` searches PATH itself; keep the bare name so a\n        // shell-installed shim behaves exactly as in a terminal.\n        Some(PathBuf::from(command))\n    }\n}\n\n#[cfg(windows)]\nfn resolve_on_path_windows(command: &str) -> Option<PathBuf> {\n    let path_var = std::env::var_os(\"PATH\")?;\n    let pathext = std::env::var(\"PATHEXT\").unwrap_or_default();\n    mycode_agent::first_program_on_path(command, &path_var, &pathext)\n}\n\n/// Environment variables a stdio MCP child may inherit: the MCP SDK's\n/// `getDefaultEnvironment` set (npm and Python servers on Windows look up\n/// `APPDATA` / `LOCALAPPDATA` for their caches) plus locale and temp dirs.\nconst STDIO_ENV_ALLOWLIST: &[&str] = &[\n    \"PATH\",\n    \"HOME\",\n    \"USER\",\n    \"USERNAME\",\n    \"LOGNAME\",\n    \"SHELL\",\n    \"TERM\",\n    \"LANG\",\n    \"LC_ALL\",\n    \"LC_CTYPE\",\n    \"TZ\",\n    \"TMPDIR\",\n    \"TMP\",\n    \"TEMP\",\n    \"SYSTEMROOT\",\n    \"SystemRoot\",\n    \"WINDIR\",\n    \"COMSPEC\",\n    \"PATHEXT\",\n    \"SYSTEMDRIVE\",\n    \"USERPROFILE\",\n    \"HOMEDRIVE\",\n    \"HOMEPATH\",\n    \"APPDATA\",\n    \"LOCALAPPDATA\",\n    \"PROGRAMFILES\",\n    \"PROCESSOR_ARCHITECTURE\",\n];\n\n/// Allowlisted process environment, then the server's own map.\nfn stdio_child_env(extra: &[(String, String)]) -> Vec<(String, String)> {\n    filter_stdio_env(&std::env::vars().collect::<Vec<_>>(), extra)\n}\n\nfn filter_stdio_env(\n    process: &[(String, String)],\n    extra: &[(String, String)],\n) -> Vec<(String, String)> {\n    let mut out = Vec::new();\n    for key in STDIO_ENV_ALLOWLIST {\n        if let Some((name, value)) = process\n            .iter()\n            .find(|(name, _)| name.eq_ignore_ascii_case(key))\n        {\n            out.push((name.clone(), value.clone()));\n        }\n    }\n    for (key, value) in extra {\n        if let Some(slot) = out\n            .iter_mut()\n            .find(|(name, _)| name.eq_ignore_ascii_case(key))\n        {\n            slot.1.clone_from(value);\n        } else {\n            out.push((key.clone(), value.clone()));\n        }\n    }\n    out\n}\n\n/// Platform launch flags.\n///\n/// Unix puts the child in its own process group so shutdown can signal the\n/// whole group.\n///\n/// Windows does not use this function. [`launch_stdio_process`] creates the\n/// process suspended, assigns a kill-on-close Job, and resumes\n/// `PROCESS_INFORMATION.hThread`.\n#[cfg(not(windows))]\nfn configure_command(builder: &mut tokio::process::Command) {\n    #[cfg(unix)]\n    {\n        builder.process_group(0);\n    }\n}\n\nfn launch_stdio_process(\n    program: &Path,\n    args: &[String],\n    env: &[(String, String)],\n) -> Result<HostChild, McpError> {\n    #[cfg(windows)]\n    {\n        use std::ffi::OsString;\n        let child_env: Vec<(OsString, OsString)> = stdio_child_env(env)\n            .into_iter()\n            .map(|(key, value)| (OsString::from(key), OsString::from(value)))\n            .collect();\n        // `.cmd` launchers spawn the real server as a grandchild. The Job is\n        // assigned while the process is still suspended, then the main thread\n        // from CreateProcessW is resumed.\n        WindowsStdioProcess::spawn(program, args, None, &child_env, true, true).map_err(|error| {\n            McpError::transport(format!(\"failed to start {}: {error}\", program.display()))\n        })\n    }\n    #[cfg(not(windows))]\n    {\n        let mut builder = tokio::process::Command::new(program);\n        builder\n            .args(args)\n            .env_clear()\n            .envs(stdio_child_env(env))\n            .stdin(Stdio::piped())\n            .stdout(Stdio::piped())\n            .stderr(Stdio::piped())\n            .kill_on_drop(true);\n        configure_command(&mut builder);\n        builder.spawn().map_err(|error| {\n            McpError::transport(format!(\"failed to start {}: {error}\", program.display()))\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    #[cfg(unix)]\n    use super::StdioChannel;\n    use super::filter_stdio_env;\n    #[cfg(unix)]\n    use std::time::Duration;\n\n    #[tokio::test]\n    async fn stdout_lines_are_bounded_while_they_are_read() {\n        use super::{LineRead, read_bounded_line};\n\n        let input = format!(\"{{\\\"id\\\":1}}\\n{}\\n{{\\\"id\\\":2}}\\ntail\", \"x\".repeat(64)).into_bytes();\n        // A tiny buffer forces the long line across many fill_buf calls.\n        let mut reader = tokio::io::BufReader::with_capacity(8, input.as_slice());\n        let mut line = Vec::new();\n        assert_eq!(\n            read_bounded_line(&mut reader, &mut line, 16).await.unwrap(),\n            LineRead::Line\n        );\n        assert_eq!(line, b\"{\\\"id\\\":1}\\n\");\n        assert_eq!(\n            read_bounded_line(&mut reader, &mut line, 16).await.unwrap(),\n            LineRead::Oversized\n        );\n        assert!(line.len() <= 16, \"an oversized line was buffered\");\n        assert_eq!(\n            read_bounded_line(&mut reader, &mut line, 16).await.unwrap(),\n            LineRead::Line,\n            \"the line after an oversized one must still be readable\"\n        );\n        assert_eq!(line, b\"{\\\"id\\\":2}\\n\");\n        assert_eq!(\n            read_bounded_line(&mut reader, &mut line, 16).await.unwrap(),\n            LineRead::Line\n        );\n        assert_eq!(line, b\"tail\");\n        assert_eq!(\n            read_bounded_line(&mut reader, &mut line, 16).await.unwrap(),\n            LineRead::Eof\n        );\n    }\n\n    #[test]\n    fn stdio_env_keeps_path_and_drops_secrets() {\n        let process = vec![\n            (\"PATH\".to_owned(), \"/usr/bin\".to_owned()),\n            (\"SECRET\".to_owned(), \"leak\".to_owned()),\n            (\"Path\".to_owned(), \"unused\".to_owned()),\n        ];\n        let filtered = filter_stdio_env(&process, &[(\"TOKEN\".to_owned(), \"ok\".to_owned())]);\n        assert!(\n            filtered\n                .iter()\n                .any(|(key, value)| key == \"PATH\" && value == \"/usr/bin\")\n        );\n        assert!(\n            filtered\n                .iter()\n                .all(|(key, _)| !key.eq_ignore_ascii_case(\"SECRET\"))\n        );\n        assert!(\n            filtered\n                .iter()\n                .any(|(key, value)| key == \"TOKEN\" && value == \"ok\")\n        );\n    }\n\n    #[cfg(unix)]\n    #[tokio::test]\n    async fn shutdown_kills_the_process_group() {\n        let channel = StdioChannel::spawn(\n            \"/bin/sh\",\n            &[\n                \"-c\".to_owned(),\n                \"sleep 120 & echo $!; exec sleep 120\".to_owned(),\n            ],\n            &[],\n            Duration::from_secs(2),\n        )\n        .await\n        .unwrap();\n        let line = channel.read_stdout_line().await.unwrap();\n        let grandchild: i32 = line.trim().parse().unwrap();\n        channel.shutdown().await;\n        tokio::time::sleep(Duration::from_millis(200)).await;\n        if let Ok(status) = std::fs::read_to_string(format!(\"/proc/{grandchild}/status\")) {\n            let state = status\n                .lines()\n                .find(|line| line.starts_with(\"State:\"))\n                .unwrap_or(\"\");\n            assert!(\n                state.contains('Z'),\n                \"grandchild {grandchild} still running: {state}\"\n            );\n        }\n    }\n}\n","crates/mycode-app/src/mcp_tools.rs":"//! Bridges enabled MCP servers into the agent's tool registry.\n//!\n//! Servers are connected at turn start. A small server is registered on\n//! the model tool list. Larger servers stay behind `search_tool` and\n//! `use_tool`. A failed server is skipped.\n\nuse std::collections::HashMap;\nuse std::future::Future;\nuse std::hash::{Hash, Hasher};\nuse std::pin::Pin;\nuse std::sync::Arc;\nuse std::sync::atomic::{AtomicBool, Ordering};\n\nuse mycode_agent::AppSettings;\nuse mycode_agent::ToolSpec;\nuse mycode_agent::{ToolCtx, ToolDyn, ToolError, ToolResult, ToolStream};\nuse serde_json::Value;\n\n/// One MCP tool exposed by a connected server, registered as a raw-JSON tool.\n///\n/// Implements `ToolDyn` directly instead of `Tool` because the server's\n/// `inputSchema` must reach the model verbatim through `spec()`; the blanket\n/// `impl<T: Tool> ToolDyn` would advertise the schemars schema of\n/// `Args = serde_json::Value`, which is just `true`.\npub(crate) struct DynamicMcpTool {\n    server_id: String,\n    tool_name: String,\n    /// Built once. `spec()` clones this instead of rebuilding the schema.\n    spec: ToolSpec,\n    /// Compiled once from the server's schema; `None` when it does not\n    /// compile — args then pass through and the server's rejection is the\n    /// backstop.\n    validator: Option<jsonschema::Validator>,\n    client: Arc<tokio::sync::Mutex<crate::mcp_client::McpClient>>,\n    snippet: String,\n    /// Set when the shared connection dies so the next turn reconnects.\n    broken: Arc<AtomicBool>,\n    /// Small servers are registered as ordinary tools. Larger ones stay\n    /// reachable through `search_tool`.\n    direct: bool,\n    /// Directory that stores full text when a tool result is truncated.\n    /// Shared by every tool from one connect, so each tool does not copy the path.\n    result_dir: Arc<std::path::PathBuf>,\n    /// From the server's `readOnlyHint`. Missing means not read-only.\n    read_only: bool,\n}\n\nimpl DynamicMcpTool {\n    fn new(\n        server_id: String,\n        tool: crate::mcp_client::McpTool,\n        client: Arc<tokio::sync::Mutex<crate::mcp_client::McpClient>>,\n        broken: Arc<AtomicBool>,\n        direct: bool,\n        result_dir: Arc<std::path::PathBuf>,\n    ) -> Self {\n        let validator = jsonschema::validator_for(&tool.input_schema).ok();\n        let snippet = mcp_snippet(&server_id, tool.description.as_deref());\n        let spec = ToolSpec {\n            name: tool.name.clone(),\n            description: tool\n                .description\n                .clone()\n                .unwrap_or_else(|| format!(\"MCP tool '{}' on server '{server_id}'.\", tool.name)),\n            params_schema: tool.input_schema,\n        };\n        Self {\n            server_id,\n            tool_name: tool.name,\n            spec,\n            validator,\n            client,\n            snippet,\n            broken,\n            direct,\n            result_dir,\n            read_only: tool.read_only,\n        }\n    }\n\n    pub(crate) fn read_only(&self) -> bool {\n        self.read_only\n    }\n}\n\nmod results;\n\nuse results::{MAX_MCP_TOOL_RESULT_BYTES, bound_mcp_result, mcp_server_is_direct, mcp_snippet};\nimpl ToolDyn for DynamicMcpTool {\n    fn spec(&self) -> ToolSpec {\n        self.spec.clone()\n    }\n\n    fn prompt_snippet_dyn(&self) -> Option<&str> {\n        Some(self.snippet.as_str())\n    }\n\n    /// A server that declares `readOnlyHint` may serve this call beside\n    /// other reads; each connection still takes one request at a time.\n    fn parallel_safe(&self) -> bool {\n        self.read_only\n    }\n\n    fn execute_dyn<'a>(\n        &'a self,\n        args: Value,\n        ctx: &'a ToolCtx,\n        out: &'a mut ToolStream,\n    ) -> Pin<Box<dyn Future<Output = Result<ToolResult, ToolError>> + Send + 'a>> {\n        Box::pin(async move {\n            // Server schemas vary more than ours do, so repair the shapes a\n            // model typically gets wrong (required-field spellings, quoted\n            // scalars, an untagged union variant) before validating. This is\n            // schema-driven only: camelCase keys are left alone because the\n            // server may declare them that way.\n            let mut args = args;\n            mycode_agent::tool::repair_args(&mut args, &self.spec.params_schema);\n            if let Some(validator) = &self.validator {\n                let errors: Vec<String> = validator\n                    .iter_errors(&args)\n                    .map(|error| {\n                        mycode_agent::tool::render_schema_error(&error, &self.spec.params_schema)\n                    })\n                    .collect();\n                if !errors.is_empty() {\n                    return Err(ToolError::InvalidArgs(errors.join(\"; \")));\n                }\n            }\n            out.progress(format!(\n                \"calling {} on MCP server {}\",\n                self.tool_name, self.server_id\n            ));\n            // The dispatcher does not select on the turn token while a tool\n            // runs; bound the call here so Escape actually cancels an MCP call.\n            // The client lock is inside the race too: another session's turn\n            // can hold this shared connection for a full request timeout.\n            let call = async {\n                let mut client = self.client.lock().await;\n                client.call_tool(&self.tool_name, args).await\n            };\n            let result = tokio::select! {\n                biased;\n                () = ctx.cancel.cancelled() => {\n                    return Err(ToolError::Execution(format!(\n                        \"MCP call cancelled{}\",\n                        mycode_agent::tool::INTERRUPTED_NOTE\n                    )));\n                }\n                result = call => result,\n            };\n            let output = result.map_err(|error| {\n                let detail = if error.is_connection_lost() {\n                    self.broken.store(true, Ordering::Relaxed);\n                    format!(\n                        \"MCP server '{}' lost the connection: {error}\",\n                        self.server_id\n                    )\n                } else {\n                    format!(\"MCP server '{}': {error}\", self.server_id)\n                };\n                ToolError::Execution(detail)\n            })?;\n            // A server that flags `isError` ran the tool and reported failure as\n            // data. The model needs to read it to correct its arguments, so it\n            // becomes an error *result* rather than a dispatcher failure.\n            let text = if output.text.len() <= MAX_MCP_TOOL_RESULT_BYTES {\n                output.text\n            } else {\n                let result_dir = Arc::clone(&self.result_dir);\n                let output_text = output.text;\n                tokio::task::spawn_blocking(move || bound_mcp_result(&result_dir, &output_text))\n                    .await\n                    .map_err(|error| {\n                        ToolError::Execution(format!(\"MCP result task failed: {error}\"))\n                    })?\n            };\n            Ok(if output.is_error {\n                ToolResult::error(text)\n            } else {\n                ToolResult::text(text)\n            })\n        })\n    }\n}\n\n/// Live MCP clients reused across turns until settings change or a\n/// connection dies.\npub(crate) struct McpPool {\n    fingerprint: u64,\n    broken: Arc<AtomicBool>,\n    /// One slot per enabled server, in settings order. `None` is a server\n    /// that did not connect; the next turn retries only those.\n    servers: Vec<Option<Vec<Arc<DynamicMcpTool>>>>,\n    warning: Option<String>,\n    /// Earliest retry of the servers that did not connect. Until then a turn\n    /// reuses the live servers instead of waiting on a dead one again.\n    retry_after: Option<std::time::Instant>,\n}\n\n/// Bound on one server's handshake and tool listing. The channel's own\n/// timeout is the per-call budget, so without this a server that accepts\n/// the connection and never answers held every turn start for two of them.\nconst MCP_HANDSHAKE_TIMEOUT: std::time::Duration = std::time::Duration::from_secs(20);\n\n/// How long a server that failed to connect is left alone before a turn\n/// tries it again. A settings change or a lost connection retries at once.\nconst MCP_RETRY_COOLDOWN: std::time::Duration = std::time::Duration::from_secs(120);\n\nimpl McpPool {\n    fn tools(&self) -> Vec<Arc<DynamicMcpTool>> {\n        self.servers.iter().flatten().flatten().cloned().collect()\n    }\n}\n\n/// Connects every enabled MCP server and flattens its tools.\n///\n/// Servers that connected stay live across turns while the settings\n/// fingerprint holds and no connection broke. A server that fails to spawn,\n/// handshake, or list tools is skipped for this turn and retried after a\n/// 120-second cooldown, without restarting the servers that are already up. Runs\n/// inside the spawned turn task on the single-threaded core runtime —\n/// plain `.await` only, never `block_on`.\npub(crate) async fn connect_mcp_tools(\n    home: &mycode_agent::HomeLayout,\n    settings: &AppSettings,\n    pool: &tokio::sync::Mutex<Option<McpPool>>,\n    project: Option<&std::path::Path>,\n) -> (Vec<Arc<DynamicMcpTool>>, Option<String>) {\n    let read_home = home.clone();\n    let read_settings = settings.clone();\n    let read_project = project.map(std::path::Path::to_path_buf);\n    let Ok((Ok(secrets), merged)) = tokio::task::spawn_blocking(move || {\n        (\n            mycode_agent::read_provider_secrets(&read_home),\n            merged_mcp_servers(&read_home, &read_settings, read_project.as_deref()),\n        )\n    })\n    .await\n    else {\n        return (Vec::new(), None);\n    };\n    let MergedServers {\n        servers,\n        project_ids,\n        magpie_ids,\n        warning: project_warning,\n    } = merged;\n    let stored_key = |server: &mycode_agent::McpServerSettings| {\n        stored_mcp_key(&secrets, &project_ids, &magpie_ids, &server.id).map(str::to_owned)\n    };\n    let fingerprint = mcp_fingerprint(&servers, &stored_key);\n    let enabled: Vec<_> = servers.iter().filter(|server| server.enabled).collect();\n    let (broken, mut slots) = {\n        let guard = pool.lock().await;\n        match guard.as_ref() {\n            Some(cached)\n                if cached.fingerprint == fingerprint\n                    && !cached.broken.load(Ordering::Relaxed)\n                    && cached.servers.len() == enabled.len() =>\n            {\n                let cooling = cached\n                    .retry_after\n                    .is_some_and(|retry| std::time::Instant::now() < retry);\n                if cooling || cached.servers.iter().all(Option::is_some) {\n                    return (cache
