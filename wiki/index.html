Badge::default()),\n        (SettingsSection::Shortcuts, NavBadge::default()),\n        (\n            SettingsSection::Models,\n            NavBadge {\n                count: models,\n                lamp: magpie_lamp,\n            },\n        ),\n        (\n            SettingsSection::Agents,\n            NavBadge {\n                count: settings.map(|s| {\n                    workspace\n                        .agent_roles()\n                        .roles\n                        .iter()\n                        .filter(|role| s.subagents.is_enabled(&role.name))\n                        .count()\n                }),\n                lamp: None,\n            },\n        ),\n        (\n            SettingsSection::Skills,\n            NavBadge {\n                count: Some(vm.skills.len()),\n                lamp: None,\n            },\n        ),\n        (\n            SettingsSection::Mcp,\n            NavBadge {\n                count: servers,\n                lamp: None,\n            },\n        ),\n        (SettingsSection::Data, NavBadge::default()),\n        (\n            SettingsSection::About,\n            NavBadge {\n                count: None,\n                lamp: update_lamp,\n            },\n        ),\n    ]\n}\n\n/// Settings navigation: grouped single-line rows, filtered by the top-bar search.\nfn render_settings_nav(\n    workspace: &Workspace,\n    section: SettingsSection,\n    query: &str,\n    cx: &mut Context<Workspace>,\n) -> impl IntoElement {\n    let badges = nav_badges(workspace, cx);\n    // Role names only matter to a search; skip the catalog read otherwise.\n    let role_names = if query.trim().is_empty() {\n        Vec::new()\n    } else {\n        workspace.agent_roles().names()\n    };\n    let dirty = workspace.vm().settings.as_ref().is_some_and(|s| s.dirty);\n    let saving = workspace.vm().settings.as_ref().is_some_and(|s| s.saving);\n    let theme = cx.theme();\n    let desk = crate::ui::desk::Desk::of(theme);\n    let mut groups: Vec<AnyElement> = Vec::new();\n    for (group, members) in SettingsSection::GROUPS {\n        let mut rows: Vec<AnyElement> = Vec::new();\n        for candidate in members.iter().copied() {\n            if !section_matches(candidate, query, &role_names) {\n                continue;\n            }\n            let badge = badges\n                .iter()\n                .find(|(s, _)| *s == candidate)\n                .map(|(_, badge)| *badge)\n                .unwrap_or_default();\n            rows.push(nav_row(candidate, candidate == section, badge, theme, cx));\n        }\n        if rows.is_empty() {\n            continue;\n        }\n        groups.push(\n            div()\n                .id(format!(\"settings-nav-group-{group}\"))\n                .flex()\n                .flex_col()\n                .gap(px(2.))\n                .child(\n                    div()\n                        .px_2()\n                        .pt(px(10.))\n                        .pb(px(2.))\n                        .text_xs()\n                        .text_color(desk.faint)\n                        .child(SettingsSection::group_label(group)),\n                )\n                .children(rows)\n                .into_any_element(),\n        );\n    }\n    div()\n        .id(\"settings-nav\")\n        .w(px(236.))\n        .h_full()\n        .flex()\n        .flex_col()\n        .flex_shrink_0()\n        .border_r_1()\n        .border_color(crate::ui::skin::glass_border(theme))\n        .bg(crate::ui::skin::glass_sidebar(theme))\n        .child(\n            div()\n                .id(\"settings-nav-groups\")\n                .flex_1()\n                .min_h_0()\n                .overflow_y_scroll()\n                .flex()\n                .flex_col()\n                .px_2()\n                .pb_2()\n                .children(groups),\n        )\n        .child(\n            div()\n                .id(\"settings-nav-footer\")\n                .flex()\n                .flex_row()\n                .items_center()\n                .justify_between()\n                .px_3()\n                .py_2()\n                .border_t_1()\n                .border_color(theme.border)\n                .text_xs()\n                .text_color(desk.faint)\n                .child(format!(\"v{}\", mycode_frontend::current_version()))\n                .when_some(\n                    nav_footer_status(saving, dirty),\n                    |this, (label, is_amber)| {\n                        this.child(\n                            div()\n                                .text_color(if is_amber { desk.amber } else { desk.faint })\n                                .child(label),\n                        )\n                    },\n                ),\n        )\n}\n\n/// Footer status text and whether it highlights an unsaved draft.\n///\n/// Only an active write shows \"writing…\"; a dirty draft that is not writing\n/// (debounce pending or a rejected save) shows \"unsaved\" instead of claiming\n/// a write is in progress forever.\nfn nav_footer_status(saving: bool, dirty: bool) -> Option<(&'static str, bool)> {\n    if saving {\n        Some((t(\"writing\\u{2026}\", \"写入中\\u{2026}\"), false))\n    } else if dirty {\n        Some((t(\"unsaved\", \"未保存\"), true))\n    } else {\n        None\n    }\n}\n\nfn section_matches(section: SettingsSection, query: &str, role_names: &[String]) -> bool {\n    let query = query.trim();\n    if query.is_empty() {\n        return true;\n    }\n    let query = query.to_lowercase();\n    section.label().to_lowercase().contains(&query)\n        || section.hint().to_lowercase().contains(&query)\n        || (section == SettingsSection::Agents\n            && role_names\n                .iter()\n                .any(|name| name.to_lowercase().contains(&query)))\n}\n\n/// One nav row: icon, label, and the badge column.\nfn nav_row(\n    candidate: SettingsSection,\n    selected: bool,\n    badge: NavBadge,\n    theme: &Theme,\n    cx: &Context<Workspace>,\n) -> AnyElement {\n    let ink = if selected {\n        theme.sidebar_accent_foreground\n    } else {\n        theme.sidebar_foreground\n    };\n    div()\n        .id(format!(\"settings-nav-{}\", candidate.id()))\n        .h(px(36.))\n        .flex()\n        .flex_row()\n        .items_center()\n        .gap_2()\n        .px_2()\n        .rounded(crate::ui::skin::radius_control())\n        .cursor_pointer()\n        .when(selected, |this| {\n            this.bg(crate::ui::skin::frost_accent(theme))\n        })\n        .hover(|this| this.bg(crate::ui::skin::frost_hover(theme)))\n        .on_click(cx.listener(move |workspace, _, _, cx| {\n            workspace.on_show_settings_section(candidate, cx);\n        }))\n        .child(\n            Icon::new(crate::ui::section_icon(candidate))\n                .with_size(px(14.))\n                .text_color(if selected {\n                    theme.primary\n                } else {\n                    theme.muted_foreground\n                }),\n        )\n        .child(\n            div()\n                .flex_1()\n                .min_w_0()\n                .truncate()\n                .text_sm()\n                .text_color(ink)\n                .child(candidate.label()),\n        )\n        .when_some(badge.lamp, |this, color| this.child(crate::ui::lamp(color)))\n        .when_some(badge.count, |this, count| {\n            this.child(\n                div()\n                    .min_w(px(18.))\n                    .px(px(5.))\n                    .py(px(1.))\n                    .rounded(crate::ui::skin::radius_xs())\n                    .border_1()\n                    .border_color(theme.border)\n                    .text_xs()\n                    .text_color(if count > 0 {\n                        ink\n                    } else {\n                        theme.muted_foreground\n                    })\n                    .child(count.to_string()),\n            )\n        })\n        .into_any_element()\n}\n\n/// A nested-page header. The label names the page this control returns to,\n/// and it is not the control that leaves settings for the desk.\npub(super) fn subview_header(\n    back_label: &str,\n    title: &str,\n    hint: Option<&str>,\n    on_back: impl Fn(&mut Workspace, &mut Context<Workspace>) + 'static,\n    cx: &mut Context<Workspace>,\n) -> AnyElement {\n    let theme = cx.theme();\n    div()\n        .id(\"subview-header\")\n        .flex()\n        .flex_row()\n        .items_center()\n        .gap_3()\n        .pb_1()\n        .child(\n            crate::ui::skin::glass_button(\"subview-back\", false, theme)\n                .flex_shrink_0()\n                .on_click(cx.listener(move |workspace, _, _, cx| {\n                    on_back(workspace, cx);\n                }))\n                .child(Icon::new(IconName::ArrowLeft).with_size(px(14.)))\n                .child(div().text_sm().child(back_label.to_owned())),\n        )\n        .child(\n            div()\n                .text_sm()\n                .font_weight(crate::ui::skin::WEIGHT_STRONG)\n                .child(title.to_owned()),\n        )\n        .when_some(hint, |this, hint| {\n            this.child(\n                div()\n                    .text_xs()\n                    .text_color(theme.muted_foreground)\n                    .child(hint.to_owned()),\n            )\n        })\n        .into_any_element()\n}\n\n#[cfg(test)]\nmod tests {\n    use super::nav_footer_status;\n\n    #[test]\n    fn footer_status_only_reports_writing_when_a_save_is_in_flight() {\n        assert_eq!(nav_footer_status(false, false), None);\n        assert_eq!(\n            nav_footer_status(true, false),\n            Some((crate::i18n::t(\"writing\\u{2026}\", \"写入中\\u{2026}\"), false))\n        );\n        assert_eq!(\n            nav_footer_status(true, true),\n            Some((crate::i18n::t(\"writing\\u{2026}\", \"写入中\\u{2026}\"), false))\n        );\n        assert_eq!(\n            nav_footer_status(false, true),\n            Some((crate::i18n::t(\"unsaved\", \"未保存\"), true))\n        );\n    }\n}\n","crates/mycode-desktop/src/workspace/settings_editor.rs":"//! The settings editor half of the workspace: form entities, MCP forms,\n//! subagent routes, and the save pipeline they all feed.\nuse gpui_kit::component::input::{InputEvent, InputState, TextareaState};\nuse gpui_kit::{AppContext as _, Context, Entity, Window};\n\nuse mycode_frontend::forms::DEFAULT_PROXY_URL;\n\nuse crate::ui::McpForm;\nuse crate::view_model::FrontendAction;\nuse crate::workspace::Workspace;\n\nmod inputs;\n\nimpl Workspace {\n    /// The proxy URL field. Only a value that parses as a proxy reaches the\n    /// settings document, so a half-typed URL never fails a save.\n    pub(crate) fn settings_proxy_input(\n        &mut self,\n        window: &mut Window,\n        cx: &mut Context<Self>,\n    ) -> Entity<InputState> {\n        if self.proxy_input.is_none() {\n            let input = cx.new(|cx| InputState::new(window, cx).placeholder(DEFAULT_PROXY_URL));\n            cx.subscribe_in(\n                &input,\n                window,\n                |workspace, entity, event, _, cx| match event {\n                    InputEvent::Change => {\n                        let text = entity.read(cx).value().to_string();\n                        workspace.driver_do(|d, fx| d.proxy_url_typed(&text, fx), cx);\n                    }\n                    InputEvent::Blur => {\n                        workspace.driver_do(|d, fx| d.proxy_url_committed(fx), cx);\n                    }\n                    InputEvent::Focus | InputEvent::PressEnter { .. } => {}\n                },\n            )\n            .detach();\n            self.proxy_input = Some(input);\n        }\n        let input = self.proxy_input.clone().expect(\"proxy input\");\n        if self.proxy_sync_pending {\n            let target = self\n                .vm()\n                .settings\n                .as_ref()\n                .map(|settings| settings.proxy.clone())\n                .filter(|proxy| {\n                    matches!(\n                        mycode_frontend::ProxyPreference::parse(proxy),\n                        Some(mycode_frontend::ProxyPreference::Url(_))\n                    )\n                })\n                .unwrap_or_default();\n            let current = input.read(cx).value().to_string();\n            if current != target {\n                input.update(cx, |state, cx| state.set_value(target, window, cx));\n            }\n            self.proxy_sync_pending = false;\n        }\n        input\n    }\n\n    /// Picks the proxy mode from the General page: `system` or `manual`.\n    /// Manual keeps a stored URL, or starts from Clash's default port.\n    pub(crate) fn on_select_proxy_mode(&mut self, mode: &str, cx: &mut Context<Self>) {\n        self.driver_do(|d, fx| d.select_proxy_mode(mode, fx), cx);\n    }\n\n    /// The General page's \"Test\" button: fetch a probe URL through the\n    /// proxy value on screen.\n    pub(crate) fn on_test_proxy(&mut self, cx: &mut Context<Self>) {\n        self.driver_do(|d, fx| d.test_proxy(fx), cx);\n    }\n\n    // ---- MCP servers ----\n\n    pub(crate) fn mcp_form(\n        &mut self,\n        window: &mut Window,\n        cx: &mut Context<Self>,\n    ) -> Entity<McpForm> {\n        self.mcp_form\n            .get_or_insert_with(|| McpForm::new(window, cx))\n            .clone()\n    }\n\n    /// Adds the server the custom form currently describes: the frontend's\n    /// `forms::build_mcp_server` validates the fields, this method dispatches.\n    pub(crate) fn on_add_mcp(&mut self, window: &mut Window, cx: &mut Context<Self>) {\n        let Some(form) = self.mcp_form.clone() else {\n            return;\n        };\n        let (id, transport, endpoint, command, env_line, api_key) = {\n            let read = form.read(cx);\n            (\n                read.id.read(cx).value().trim().to_string(),\n                read.transport.clone(),\n                read.endpoint.read(cx).value().trim().to_string(),\n                read.command.read(cx).value().trim().to_string(),\n                read.env.read(cx).value().trim().to_string(),\n                read.api_key.read(cx).value().to_string(),\n            )\n        };\n        let mut added = false;\n        self.driver_do(\n            |d, fx| {\n                added = d.add_custom_mcp(\n                    &id, &transport, &endpoint, &command, &env_line, &api_key, fx,\n                );\n            },\n            cx,\n        );\n        if added {\n            form.update(cx, |form, cx| form.clear(window, cx));\n        }\n    }\n\n    pub(crate) fn mcp_json_input(\n        &mut self,\n        window: &mut Window,\n        cx: &mut Context<Self>,\n    ) -> Entity<TextareaState> {\n        self.mcp_json_input\n            .get_or_insert_with(|| {\n                cx.new(|cx| {\n                    TextareaState::new(window, cx)\n                        .placeholder(crate::i18n::t(\n                            \"Paste mcp.json or a Claude Desktop / Cursor config…\",\n                            \"粘贴 mcp.json，或 Claude Desktop / Cursor 配置…\",\n                        ))\n                        .auto_grow(4, 16)\n                })\n            })\n            .clone()\n    }\n\n    pub(crate) fn on_import_mcp_json(&mut self, window: &mut Window, cx: &mut Context<Self>) {\n        let Some(input) = self.mcp_json_input.clone() else {\n            return;\n        };\n        let raw = input.read(cx).value().to_string();\n        let mut parsed = false;\n        self.driver_do(|d, fx| parsed = d.import_mcp_json(&raw, fx), cx);\n        if parsed {\n            input.update(cx, |state, cx| state.set_value(\"\", window, cx));\n        }\n    }\n\n    // ---- skills ----\n\n    pub(crate) fn on_skill_enabled(&mut self, slug: &str, enabled: bool, cx: &mut Context<Self>) {\n        self.apply_action(\n            FrontendAction::SettingsSkillToggled(slug.to_owned(), enabled),\n            cx,\n        );\n    }\n\n    // ---- subagent routes ----\n\n    pub(crate) fn on_subagent_role_enabled(\n        &mut self,\n        role: &str,\n        enabled: bool,\n        cx: &mut Context<Self>,\n    ) {\n        self.driver_do(|d, fx| d.toggle_subagent_role(role, enabled, fx), cx);\n    }\n\n    pub(crate) fn on_toggle_subagent_menu(\n        &mut self,\n        role: &str,\n        field: &str,\n        open: bool,\n        cx: &mut Context<Self>,\n    ) {\n        let next = open.then(|| (role.to_owned(), field.to_owned()));\n        self.apply_action(FrontendAction::SubagentMenuToggled(next), cx);\n    }\n\n    pub(crate) fn on_set_subagent_thinking(\n        &mut self,\n        role: &str,\n        thinking: Option<String>,\n        cx: &mut Context<Self>,\n    ) {\n        self.driver_do(|d, fx| d.set_subagent_thinking(role, thinking, fx), cx);\n    }\n\n    pub(crate) fn on_set_subagent_route(\n        &mut self,\n        role: &str,\n        provider: Option<String>,\n        model: Option<String>,\n        cx: &mut Context<Self>,\n    ) {\n        self.driver_do(|d, fx| d.set_subagent_route(role, provider, model, fx), cx);\n    }\n}\n","crates/mycode-frontend/src/shortcuts.rs":"//! The keyboard shortcuts the desktop lists on its settings page.\n//!\n//! One table keeps that page in step with the keys the desktop binds.\n\nuse crate::i18n::t;\n\n/// Where a shortcut acts. The desktop lists each group on its own card.\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum Group {\n    /// Keys the message box takes.\n    Compose,\n    /// Keys that move around the interface.\n    Navigate,\n}\n\nimpl Group {\n    /// Every group in reading order.\n    pub const ALL: [Self; 2] = [Self::Compose, Self::Navigate];\n\n    /// Stable identifier for element ids.\n    #[must_use]\n    pub fn id(self) -> &'static str {\n        match self {\n            Self::Compose => \"compose\",\n            Self::Navigate => \"navigate\",\n        }\n    }\n\n    /// Card title.\n    #[must_use]\n    pub fn label(self) -> &'static str {\n        match self {\n            Self::Compose => t(\"Compose and send\", \"撰写与发送\"),\n            Self::Navigate => t(\"Navigation\", \"界面与导航\"),\n        }\n    }\n\n    /// Where the keys in this group work.\n    #[must_use]\n    pub fn hint(self) -> &'static str {\n        match self {\n            Self::Compose => t(\n                \"In the message box at the bottom of a chat.\",\n                \"在对话底部的输入框里。\",\n            ),\n            Self::Navigate => t(\"Anywhere in the window.\", \"在窗口任意位置。\"),\n        }\n    }\n}\n\n/// One shortcut as a settings page lists it.\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct Shortcut {\n    /// Keys as pressed, spelled for this platform (`⌘G` on macOS).\n    pub keys: String,\n    /// What they do, in the interface language.\n    pub action: &'static str,\n    /// When or how, for keys whose effect depends on the moment.\n    pub detail: Option<&'static str>,\n    /// The card it is listed on.\n    pub group: Group,\n}\n\nimpl Shortcut {\n    /// The action and its detail on one line, for a list with one column\n    /// of text.\n    #[must_use]\n    pub fn sentence(&self) -> String {\n        match self.detail {\n            Some(detail) => format!(\"{} — {detail}\", self.action),\n            None => self.action.to_owned(),\n        }\n    }\n}\n\n/// Every shortcut the desktop binds, in reading order.\n#[must_use]\npub fn shortcuts() -> Vec<Shortcut> {\n    // The desktop binds its chords to Command on macOS and Control elsewhere.\n    let chord = if cfg!(target_os = \"macos\") {\n        \"⌘\"\n    } else {\n        \"Ctrl+\"\n    };\n    let entry = |keys: String, action, detail, group| Shortcut {\n        keys,\n        action,\n        detail,\n        group,\n    };\n    let compose = |keys, action, detail| entry(keys, action, detail, Group::Compose);\n    let navigate = |keys, action, detail| entry(keys, action, detail, Group::Navigate);\n    let mut list = vec![\n        compose(\n            \"Enter\".to_owned(),\n            t(\"Send\", \"发送\"),\n            Some(t(\n                \"While a task runs, the message waits in the queue until it ends\",\n                \"任务运行中则排队，等它结束再发\",\n            )),\n        ),\n        compose(\n            format!(\"{chord}Enter\"),\n            t(\"Stop and send now\", \"停止并立即发送\"),\n            Some(t(\n                \"Stops the running task, then sends the message\",\n                \"先停止当前任务，再发送这条消息\",\n            )),\n        ),\n        compose(\n            format!(\"{chord}G\"),\n            t(\"Steer the running task\", \"引导当前任务\"),\n            Some(t(\n                \"It reads the message before its next step, without stopping\",\n                \"不打断，模型在下一步之前读到这条消息\",\n            )),\n        ),\n    ];\n    list.extend([\n        compose(\"Shift+Enter\".to_owned(), t(\"New line\", \"换行\"), None),\n        // The clipboard reader answers \"picture\" or \"no picture\"; a paste\n        // whose text is one image path attaches that file instead.\n        compose(\n            format!(\"{chord}V\"),\n            t(\"Attach the clipboard picture\", \"附加剪贴板里的图片\"),\n            Some(t(\n                \"A paste that is only an image path attaches that file\",\n                \"粘贴内容只有图片路径时附加该文件\",\n            )),\n        ),\n        navigate(\n            format!(\"{chord}K\"),\n            t(\"Command palette\", \"命令面板\"),\n            Some(t(\n                \"Jump to a session, model, command, or settings page\",\n                \"跳到会话、模型、命令或设置页\",\n            )),\n        ),\n        navigate(\n            \"Esc\".to_owned(),\n            t(\"Close the topmost panel\", \"关闭最上层面板\"),\n            Some(t(\n                \"With nothing open, leaves a running task alone; a held queue returns to the input\",\n                \"没有打开的面板时，不打断运行中的任务；暂停的队列退回输入框\",\n            )),\n        ),\n    ]);\n    list\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{Group, shortcuts};\n\n    #[test]\n    fn send_interrupt_and_steer_come_first() {\n        let keys: Vec<String> = shortcuts()\n            .into_iter()\n            .map(|shortcut| shortcut.keys)\n            .collect();\n        assert_eq!(keys[0], \"Enter\");\n        assert!(keys[1].ends_with(\"Enter\") && keys[1] != \"Enter\");\n        assert!(keys[2].ends_with('G'));\n    }\n\n    #[test]\n    fn the_clipboard_picture_key_is_listed() {\n        let list = shortcuts();\n        let paste = list\n            .iter()\n            .find(|shortcut| shortcut.action.contains(\"clipboard picture\"))\n            .expect(\"the picture paste is a documented key\");\n        assert!(paste.keys.ends_with('V'));\n    }\n\n    #[test]\n    fn every_group_has_keys_and_compose_comes_first() {\n        let list = shortcuts();\n        for group in Group::ALL {\n            assert!(list.iter().any(|shortcut| shortcut.group == group));\n        }\n        let first_navigate = list\n            .iter()\n            .position(|shortcut| shortcut.group == Group::Navigate)\n            .expect(\"navigation keys\");\n        assert!(\n            list[first_navigate..]\n                .iter()\n                .all(|shortcut| shortcut.group == Group::Navigate)\n        );\n    }\n\n    #[test]\n    fn a_sentence_joins_the_detail_to_the_action() {\n        let list = shortcuts();\n        let steer = &list[2];\n        assert_eq!(\n            steer.sentence(),\n            format!(\"{} — {}\", steer.action, steer.detail.expect(\"detail\"))\n        );\n        let new_line = &list[3];\n        assert_eq!(new_line.sentence(), new_line.action);\n    }\n}\n","crates/mycode-desktop/src/ui/settings/shortcuts.rs":"//! The Keyboard shortcuts settings page: one card per group of keys, each\n//! row naming what the keys do beside the keys drawn as keycaps.\n//!\n//! The list is `mycode_frontend::shortcuts`.\nuse gpui_kit::component::ActiveTheme as _;\nuse gpui_kit::component::theme::Theme;\nuse gpui_kit::{\n    AnyElement, Context, InteractiveElement, IntoElement, ParentElement, Styled, div, px,\n};\nuse mycode_frontend::shortcuts::{Group, Shortcut, shortcuts};\n\nuse super::widgets::{settings_card, settings_row};\nuse crate::workspace::Workspace;\n\n/// Drawn between the keycaps of one chord. macOS writes chords without\n/// one (`⌘G`).\nconst CHORD_JOINER: Option<&str> = if cfg!(target_os = \"macos\") {\n    None\n} else {\n    Some(\"+\")\n};\n\npub(super) fn render_shortcuts_section(cx: &mut Context<Workspace>) -> AnyElement {\n    let theme = cx.theme();\n    let list = shortcuts();\n    let cards = Group::ALL.map(|group| {\n        let rows = list\n            .iter()\n            .filter(|shortcut| shortcut.group == group)\n            .enumerate()\n            .map(|(index, shortcut)| shortcut_row(group, index, shortcut, theme))\n            .collect();\n        settings_card(group.id(), group.label(), Some(group.hint()), theme, rows).into_any_element()\n    });\n    div()\n        .id(\"shortcuts-section\")\n        .w_full()\n        .h_auto()\n        .flex_none()\n        .flex()\n        .flex_col()\n        .gap(crate::ui::skin::space(4))\n        .children(cards)\n        .into_any_element()\n}\n\n/// What the keys do on the left, the keycaps on the right.\nfn shortcut_row(group: Group, index: usize, shortcut: &Shortcut, theme: &Theme) -> AnyElement {\n    let mut keys = div().flex().flex_row().items_center().gap(px(4.));\n    for (position, label) in keycap_labels(&shortcut.keys).into_iter().enumerate() {\n        if position > 0\n            && let Some(joiner) = CHORD_JOINER\n        {\n            keys = keys.child(\n                div()\n                    .text_xs()\n                    .text_color(theme.muted_foreground)\n                    .child(joiner),\n            );\n        }\n        keys = keys.child(keycap(label, theme));\n    }\n    settings_row(\n        &format!(\"shortcut-{}-{index}\", group.id()),\n        shortcut.action,\n        shortcut.detail,\n        keys.into_any_element(),\n        theme,\n    )\n}\n\n/// One key as a raised cap: a hairline rim with a heavier lower edge.\nfn keycap(label: &str, theme: &Theme) -> impl IntoElement {\n    div()\n        .h(px(24.))\n        .min_w(px(24.))\n        .px(px(7.))\n        .flex()\n        .items_center()\n        .justify_center()\n        .rounded(crate::ui::skin::radius_xs())\n        .border_1()\n        .border_b_2()\n        .border_color(crate::ui::skin::border_strong(theme))\n        .bg(theme.secondary)\n        .text_xs()\n        .text_color(theme.foreground)\n        .child(label.to_owned())\n}\n\n/// Splits a spelled chord into its keys: `Ctrl+Enter` into `Ctrl` and\n/// `Enter`, macOS `⌘G` into `⌘` and `G`.\nfn keycap_labels(keys: &str) -> Vec<&str> {\n    let mut labels = Vec::new();\n    let rest = match keys.strip_prefix('⌘') {\n        Some(rest) => {\n            labels.push(\"⌘\");\n            rest\n        }\n        None => keys,\n    };\n    labels.extend(rest.split('+').filter(|label| !label.is_empty()));\n    labels\n}\n\n#[cfg(test)]\nmod tests {\n    use super::keycap_labels;\n\n    #[test]\n    fn a_chord_splits_into_one_cap_per_key() {\n        assert_eq!(keycap_labels(\"Ctrl+Enter\"), [\"Ctrl\", \"Enter\"]);\n        assert_eq!(keycap_labels(\"Shift+Enter\"), [\"Shift\", \"Enter\"]);\n        assert_eq!(keycap_labels(\"⌘G\"), [\"⌘\", \"G\"]);\n        assert_eq!(keycap_labels(\"⌘Enter\"), [\"⌘\", \"Enter\"]);\n        assert_eq!(keycap_labels(\"Esc\"), [\"Esc\"]);\n    }\n\n    #[test]\n    fn every_desktop_shortcut_draws_clean_caps() {\n        for shortcut in mycode_frontend::shortcuts::shortcuts() {\n            let labels = keycap_labels(&shortcut.keys);\n            assert!(!labels.is_empty(), \"{}\", shortcut.keys);\n            for label in labels {\n                assert!(\n                    !label.contains('+') && !label.contains(char::is_whitespace),\n                    \"{}\",\n                    shortcut.keys\n                );\n            }\n        }\n    }\n}\n","crates/mycode-frontend/src/launch.rs":"//! Arguments and launch steps handled before a window is created.\n//!\n//! `--help` and `--version` print and exit. [`launch`] runs the steps every\n//! `mycode*` binary takes before its UI.\n\nuse mycode_app::{ConfigError, HomeEnv, HomeLayout};\n\n/// What `main` should print before it exits.\n#[derive(Clone, Debug, Eq, PartialEq)]\npub enum EarlyAction {\n    /// `-h` / `--help`.\n    Help,\n    /// `-V` / `--version`.\n    Version,\n    /// A flag this binary does not accept.\n    Unknown(String),\n}\n\n/// `Some` when the argument list asks for help, version, or an unknown flag.\n///\n/// Version wins when both help and version are present. An unknown flag is\n/// reported only when neither of those is present. The updater parser runs\n/// first and owns `--mycode-apply-update`.\n#[must_use]\npub fn early_action<S: AsRef<str>>(args: &[S]) -> Option<EarlyAction> {\n    let mut help = false;\n    let mut version = false;\n    let mut unknown = None;\n    for arg in args {\n        match arg.as_ref() {\n            \"--help\" | \"-h\" => help = true,\n            \"--version\" | \"-V\" => version = true,\n            other if other.starts_with('-') && unknown.is_none() => {\n                unknown = Some(other.to_owned());\n            }\n            _ => {}\n        }\n    }\n    if version {\n        Some(EarlyAction::Version)\n    } else if help {\n        Some(EarlyAction::Help)\n    } else {\n        unknown.map(EarlyAction::Unknown)\n    }\n}\n\n/// The self-update helper entry point shared by every `mycode*` binary.\n///\n/// `Some(code)` means the args requested `--mycode-apply-update` and the\n/// helper already ran: the caller exits with `code` without touching the\n/// rest of the startup path. `None` means a normal launch.\n#[must_use]\npub fn apply_update_from_args(args: &[String]) -> Option<i32> {\n    match mycode_app::parse_apply_update_args(args) {\n        Ok(Some(request)) => Some(match mycode_app::run_apply_update_helper(&request) {\n            Ok(()) => 0,\n            Err(error) => {\n                eprintln!(\"updater: {error}\");\n                1\n            }\n        }),\n        Err(error) => {\n            eprintln!(\"updater: {error}\");\n            Some(1)\n        }\n        Ok(None) => None,\n    }\n}\n\n/// What the shared launch steps leave for the UI.\n#[derive(Debug)]\npub struct Launch {\n    pub home: HomeLayout,\n    /// A staged self-update: re-armed for this run's exit, or applied since\n    /// the last one.\n    pub update: mycode_app::PendingUpdate,\n}\n\n/// Resolves the home every `mycode*` binary runs against.\n///\n/// # Errors\n///\n/// Returns [`ConfigError`] when the home directory cannot be resolved.\npub fn home() -> Result<HomeLayout, ConfigError> {\n    HomeLayout::from_env(HomeEnv::from_process())\n}\n\n/// The launch steps the desktop runs before its UI: opens the home, clears\n/// self-update leftovers, and settles a staged update.\n///\n/// `relaunch` is [`mycode_app::reconcile_pending_update`]'s: a re-armed\n/// update makes this launch exit into the new version.\n///\n/// # Errors\n///\n/// Returns [`ConfigError`] when the home directory cannot be resolved.\npub fn launch(relaunch: bool) -> Result<Launch, ConfigError> {\n    Ok(settle(home()?, relaunch))\n}\n\n/// [`launch`] over a home the binary already resolved. The desktop claims\n/// its home first, so a second desktop never clears update files the\n/// running one is using.\n#[must_use]\npub fn settle(home: HomeLayout, relaunch: bool) -> Launch {\n    // Remove staging directories and install-directory leftovers\n    // (`.mycode-previous`, `.mycode-incoming`) from earlier self-updates.\n    // The apply helper returns before this, so it does not delete the\n    // staged binary it is installing.\n    mycode_app::cleanup_stale_stages();\n    mycode_app::cleanup_previous_binary();\n    let update = mycode_app::reconcile_pending_update(&home, relaunch);\n    Launch { home, update }\n}\n\n/// `<bin> <version>` for `--version` and the help header.\n#[must_use]\npub fn version_line(bin: &str) -> String {\n    format!(\"{bin} {}\", env!(\"CARGO_PKG_VERSION\"))\n}\n\n/// Text for `--help`. `bin` is the invoking binary name shown in the usage\n/// line and the version header.\n#[must_use]\npub fn help_text(bin: &str) -> String {\n    format!(\n        \"{}\\n\\\nCoding agent.\\n\\\n\\n\\\nUsage: {bin} [OPTIONS]\\n\\\n\\n\\\nOptions:\\n\\\n  -h, --help      Show this help and exit\\n\\\n  -V, --version   Show the version and exit\\n\",\n        version_line(bin)\n    )\n}\n\n/// A clear message for a display or surface panic.\n///\n/// `None` when `panic_message` is some other failure and the default panic\n/// hook should run.\n#[must_use]\npub fn surface_failure_message(panic_message: &str) -> Option<String> {\n    let lower = panic_message.to_ascii_lowercase();\n    if lower.contains(\"failed to create surface\")\n        || lower.contains(\"failed to connect to x server\")\n        || lower.contains(\"display is not set\")\n    {\n        Some(format!(\n            \"mycode: cannot open a window ({panic_message}). No usable display is available. Use --version or --help.\"\n        ))\n    } else {\n        None\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{EarlyAction, early_action, help_text, surface_failure_message, version_line};\n\n    #[test]\n    fn version_and_help_are_recognized() {\n        assert_eq!(early_action(&[\"--version\"]), Some(EarlyAction::Version));\n        assert_eq!(early_action(&[\"-V\"]), Some(EarlyAction::Version));\n        assert_eq!(early_action(&[\"--help\"]), Some(EarlyAction::Help));\n        assert_eq!(early_action(&[\"-h\"]), Some(EarlyAction::Help));\n        assert_eq!(\n            early_action(&[\"--help\", \"--version\"]),\n            Some(EarlyAction::Version)\n        );\n        assert_eq!(early_action::<&str>(&[]), None);\n        match early_action(&[\"--other\"]) {\n            Some(EarlyAction::Unknown(flag)) => assert_eq!(flag, \"--other\"),\n            other => panic!(\"unknown flag should be an error, got {other:?}\"),\n        }\n        assert_eq!(early_action(&[\"folder\"]), None);\n        let version = version_line(\"mycode-desktop\");\n        assert_eq!(\n            version,\n            format!(\"mycode-desktop {}\", env!(\"CARGO_PKG_VERSION\"))\n        );\n        assert!(help_text(\"mycode-desktop\").contains(\"--version\"));\n        assert!(help_text(\"mycode-desktop\").contains(\"Usage: mycode-desktop \"));\n    }\n\n    #[test]\n    fn surface_panic_becomes_a_display_message() {\n        let message = surface_failure_message(\"Failed to create surface\").expect(\"message\");\n        assert!(message.contains(\"cannot open a window\"));\n        assert!(message.contains(\"--version\"));\n        assert!(surface_failure_message(\"failed to connect to X server :99\").is_some());\n        assert!(surface_failure_message(\"other panic\").is_none());\n    }\n}\n","crates/mycode-frontend/src/lib.rs":"//! `mycode-frontend` — the UI-agnostic product layer shared by MYCode frontends.\n//!\n//! Everything that is not pixels: the view-model state machine\n//! ([`view_model`]), i18n, read-only git status, shortcuts, and the pre-window\n//! launch steps. A frontend renders the state and feeds actions back; product\n//! behavior changes land here so every frontend picks them up at once.\n\npub mod driver;\npub mod forms;\npub mod git_status;\npub mod highlight;\npub mod i18n;\npub mod launch;\npub mod picker;\npub mod shortcuts;\npub mod stream;\nmod theme;\npub mod view_model;\n\n// Chain re-export: successors see every lower layer through this crate only.\npub use mycode_app::*;\n\npub use theme::{normalize_font_size, normalize_theme};\n","crates/mycode-frontend/src/stream.rs":"//! How many live chat events one paint may apply.\n//!\n//! The core sends `ChatText` and `ChatThinking` as they arrive, then\n//! `ChatDone`. A UI task that drains that whole queue before the next frame\n//! paints only the finished message. A frame takes a short slice of deltas,\n//! leaves the closing event for the next frame, and the pump waits about\n//! one frame so the slice can paint.\n\nuse std::collections::VecDeque;\n\nuse mycode_app::BridgeEvent;\n\n/// Gap between streaming paints. Inside the 50–80ms band: often enough to\n/// read the reply growing, rare enough that a burst of tokens does not\n/// relayout every character.\npub const STREAM_FRAME: std::time::Duration = std::time::Duration::from_millis(64);\n\n/// Already-queued assistant text one frame may reveal. Live tokens are\n/// slower than this, so a real stream shows whatever arrived since the last\n/// paint. A backlog cannot dump the rest of the reply into the same frame.\nconst STREAM_CHARS_PER_FRAME: usize = 80;\n\n/// Cap on delta events per frame, so a burst of empty fragments cannot skip\n/// the character budget and run to `ChatDone`.\nconst STREAM_DELTAS_PER_FRAME: usize = 16;\n\n/// Splits a queued burst into the events to paint now and the ones that wait\n/// for the next frame.\npub fn split_stream_frame(\n    queued: impl IntoIterator<Item = BridgeEvent>,\n) -> (Vec<BridgeEvent>, VecDeque<BridgeEvent>) {\n    let mut queued: VecDeque<BridgeEvent> = queued.into_iter().collect();\n    let mut slice = Vec::new();\n    let mut chars = 0usize;\n    let mut deltas = 0usize;\n    let mut saw_delta = false;\n    let mut saw_tool_start = false;\n    while let Some(event) = queued.pop_front() {\n        let delta_chars = stream_delta_chars(&event);\n        let closes = closes_live_text(&event);\n        let tool_finished = is_tool_finished(&event);\n        if closes && saw_delta {\n            queued.push_front(event);\n            break;\n        }\n        if tool_finished && saw_tool_start {\n            queued.push_front(event);\n            break;\n        }\n        if delta_chars.is_some()\n            && saw_delta\n            && (chars >= STREAM_CHARS_PER_FRAME || deltas >= STREAM_DELTAS_PER_FRAME)\n        {\n            queued.push_front(event);\n            break;\n        }\n        if let Some(count) = delta_chars {\n            chars += count;\n            deltas += 1;\n            saw_delta = true;\n        }\n        if is_tool_started(&event) {\n            saw_tool_start = true;\n        }\n        slice.push(event);\n        if closes {\n            break;\n        }\n    }\n    (slice, queued)\n}\n\npub fn is_stream_delta(event: &BridgeEvent) -> bool {\n    stream_delta_chars(event).is_some()\n}\n\nfn stream_delta_chars(event: &BridgeEvent) -> Option<usize> {\n    match event {\n        BridgeEvent::ChatText { delta, .. } | BridgeEvent::ChatThinking { delta, .. } => {\n            Some(delta.chars().count())\n        }\n        _ => None,\n    }\n}\n\nfn closes_live_text(event: &BridgeEvent) -> bool {\n    matches!(\n        event,\n        BridgeEvent::ChatDone { .. }\n            | BridgeEvent::ChatFailed { .. }\n            | BridgeEvent::AssistantStep { .. }\n    )\n}\n\nfn is_tool_started(event: &BridgeEvent) -> bool {\n    matches!(event, BridgeEvent::ToolStarted { .. })\n}\n\nfn is_tool_finished(event: &BridgeEvent) -> bool {\n    matches!(event, BridgeEvent::ToolCompleted { .. })\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::sync::Arc;\n\n    use mycode_app::{ConversationEntry, EntryKind};\n\n    fn text(delta: &str) -> BridgeEvent {\n        BridgeEvent::ChatText {\n            session_id: \"s\".into(),\n            delta: delta.into(),\n        }\n    }\n\n    fn done() -> BridgeEvent {\n        BridgeEvent::ChatDone {\n            session_id: \"s\".into(),\n            head: \"h\".into(),\n            entry: ConversationEntry {\n                event_id: \"e\".into(),\n                kind: EntryKind::AssistantMessage,\n                text: Arc::from(\"full\"),\n                call_id: None,\n                thinking: String::new(),\n            },\n        }\n    }\n\n    fn tool_start() -> BridgeEvent {\n        BridgeEvent::ToolStarted {\n            session_id: \"s\".into(),\n            call_id: \"c\".into(),\n            provider_call_id: \"p\".into(),\n            name: \"read\".into(),\n            target: \"a.rs\".into(),\n        }\n    }\n\n    fn tool_done() -> BridgeEvent {\n        BridgeEvent::ToolCompleted {\n            session_id: \"s\".into(),\n            entry: ConversationEntry {\n                event_id: \"r\".into(),\n                kind: EntryKind::ToolResult,\n                text: Arc::from(\"ok\"),\n                call_id: Some(\"c\".into()),\n                thinking: String::new(),\n            },\n        }\n    }\n\n    fn delta_text(events: &[BridgeEvent]) -> String {\n        events\n            .iter()\n            .filter_map(|event| match event {\n                BridgeEvent::ChatText { delta, .. } => Some(delta.as_str()),\n                _ => None,\n            })\n            .collect()\n    }\n\n    #[test]\n    fn a_dumped_turn_paints_deltas_before_chat_done() {\n        let mut queued: VecDeque<BridgeEvent> = (0..20).map(|_| text(\"abcdefghij\")).collect();\n        queued.push_back(done());\n        let mut painted = String::new();\n        let mut frames = 0usize;\n        while !queued.is_empty() {\n            let (slice, rest) = split_stream_frame(queued);\n            assert!(!slice.is_empty());\n            let slice_has_delta = slice.iter().any(is_stream_delta);\n            let slice_closes = slice.iter().any(closes_live_text);\n            assert!(\n                !(slice_has_delta && slice_closes),\n                \"a frame must not commit the reply in the same paint as new text\"\n            );\n            painted.push_str(&delta_text(&slice));\n            if slice_closes {\n                assert_eq!(painted, \"abcdefghij\".repeat(20));\n            }\n            queued = rest;\n            frames += 1;\n            assert!(frames < 40, \"the burst did not drain\");\n        }\n        assert!(frames > 2);\n    }\n\n    #[test]\n    fn one_delta_does_not_share_a_frame_with_chat_done() {\n        let (slice, rest) = split_stream_frame([text(\"Hello\"), done()]);\n        assert_eq!(delta_text(&slice), \"Hello\");\n        assert!(rest.iter().any(closes_live_text));\n        assert!(!rest.iter().any(is_stream_delta));\n    }\n\n    #[test]\n    fn tool_start_paints_before_its_result() {\n        let (slice, rest) = split_stream_frame([tool_start(), tool_done()]);\n        assert!(slice.iter().any(is_tool_started));\n        assert!(slice.iter().all(|event| !is_tool_finished(event)));\n        assert!(rest.iter().any(is_tool_finished));\n    }\n}\n","crates/mycode-frontend/src/driver.rs":"//! The headless product driver: one `CoreBridge`, one [`WorkspaceState`], and\n//! every product decision the window renders.\n//!\n//! A frontend owns exactly one driver. It feeds user intent in as method\n//! calls or [`FrontendAction`]s, drains bridge traffic with\n//! [`FrontendDriver::poll`]/[`FrontendDriver::next_event`], and interprets the\n//! returned [`Effect`]s in its own idiom — GPUI turns them into toasts,\n//! scroll corrections, and `cx.notify()`; a TUI turns them into redraws.\n//!\n//! Replies and internal timers arrive on a `std::sync::mpsc` inbox; each\n//! deposit calls the `wake` callback supplied at construction so a UI\n//! executor can schedule a drain. Events keep their own channel so a\n//! frontend can pace streamed deltas (the desktop's typewriter frames)\n//! while control messages are handled immediately.\nuse std::collections::{BTreeMap, HashSet};\nuse std::path::{Path, PathBuf};\nuse std::sync::Arc;\nuse std::sync::mpsc::{Receiver, Sender};\nuse std::thread::JoinHandle;\nuse std::time::Duration;\n\nuse mycode_app::HomeLayout;\nuse mycode_app::{\n    BranchId, BridgeCommand, BridgeEvent, BridgeReply, CoreBridge, HeadStamp, SessionEventId,\n    SessionId,\n};\n\nuse crate::view_model::{FrontendAction, MainView, MentionKind, WorkspaceState, reduce};\n\nmod events;\nmod git;\nmod projects;\nmod replies;\nmod sessions;\nmod settings;\nmod turn;\nmod updates;\n\n#[cfg(test)]\nmod tests;\n\n/// Notice severity. Errors stay visible until explicitly dismissed; the\n/// other kinds expire on a reading-time delay in the frontend.\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum ToastKind {\n    Info,\n    /// A cache collapse or another condition the user should notice.\n    Warning,\n    Error,\n}\n\n/// One thing the driver decided that only the concrete frontend can perform:\n/// a notice to show, a composer field to set, a directory to re-watch.\n#[derive(Clone, Debug, PartialEq)]\npub enum Effect {\n    /// Show a transient notice. Errors stay until dismissed.\n    Toast {\n        /// Severity — expiry and styling are the frontend's.\n        kind: ToastKind,\n        /// Text already localized.\n        text: String,\n    },\n    /// Replace the composer's text. `focus` asks for composer focus.\n    ComposerSet {\n        /// The new draft text.\n        text: String,\n        /// Move focus into the composer when true.\n        focus: bool,\n    },\n    /// Put picked attachments back in the composer after a send did not\n    /// take them: a failed send or a dropped welcome start.\n    AttachmentsRestored(mycode_app::Attachments),\n    /// One ask-card free-text field was cleared (a choice replaced typing).\n    AskTextCleared {\n        /// Question row index.\n        index: usize,\n    },\n    /// Every ask-card field should reset (a new card, the card answered or\n    /// dismissed, or the conversation left the screen).\n    AskReset,\n    /// A settings-loaded theme or an explicit pick should paint now.\n    AppearanceTheme(String),\n    /// The interface scale changed; repaint the window at the new rem.\n    FontSizeChanged,\n    /// The interface language flipped; live strings already read the new\n    /// language, placeholders captured at creation need a rewrite.\n    LanguageChanged,\n    /// An older transcript page was prepended. `pinned` means the viewport\n    /// was at the tail, so the frontend should keep following it instead of\n    /// restoring a scroll offset.\n    OlderPagePrepended {\n        /// Whether the conversation was following its tail.\n        pinned: bool,\n    },\n    /// Conversation content grew while the viewport followed the tail:\n    /// scroll to the newest line. A reader who scrolled up gets nothing.\n    ScrollToTail,\n    /// The conversation was replaced (open, create, delete, park): any\n    /// pending prepend scroll anchor measures the wrong document now.\n    ScrollAnchorInvalidated,\n    /// The proxy text field should re-seed from `vm.settings.proxy`.\n    SyncProxyField,\n    /// Focus should return to the composer (chat) or the window root.\n    RestoreFocus,\n    /// Install staged and armed: quit the process so the swap runs.\n    Quit,\n}\n\n/// Replies without embedded identity still belong to the request's session.\n/// A late cancel, recall, or search must never mutate a newly opened chat.\n#[derive(Debug)]\npub(crate) enum ReplyScope {\n    Global,\n    Open(String),\n    Session {\n        session: String,\n        branch: Option<String>,\n    },\n    Mention {\n        session: String,\n        query: String,\n    },\n    /// A row delete: the reply decides whether the session actually went\n    /// away before the UI forgets its bindings.\n    DeletedSession(String),\n    /// A `LoadOlder` page resolving a rewind target, not a history prepend.\n    Recall(Box<RecallRequest>),\n    /// A steer: a refusal hands `text` back to its chat's queue, on screen\n    /// or parked.\n    Steer {\n        session: String,\n        text: String,\n    },\n}\n\n/// The rewind a `LoadOlder` reply is resolving. The page walk chains until\n/// it finds the event before the message being recalled.\n#[derive(Clone, Debug)]\npub(crate) struct RecallRequest {\n    pub(crate) session: SessionId,\n    pub(crate) branch: BranchId,\n    /// Head at the moment the recall was asked for.\n    pub(crate) head: String,\n    /// Text to put back in the composer.\n    pub(crate) edit: String,\n    /// Invalidation token; a newer recall or view change drops this one.\n    pub(crate) generation: u64,\n}\n\nimpl ReplyScope {\n    pub(crate) fn for_command(command: &BridgeCommand) -> Self {\n        match command {\n            BridgeCommand::OpenSession(session) => Self::Open(session.to_string()),\n            BridgeCommand::ChatTurn {\n                session, branch, ..\n            }\n            | BridgeCommand::SendMessage {\n                session, branch, ..\n            }\n            | BridgeCommand::RecallMessage {\n                session, branch, ..\n            }\n            | BridgeCommand::LoadOlder {\n                session, branch, ..\n            } => Self::Session {\n                session: session.to_string(),\n                branch: Some(branch.to_string()),\n            },\n            BridgeCommand::CancelChat { session_id }\n            | BridgeCommand::CancelSubagent { session_id, .. }\n            | BridgeCommand::ListResources { session_id }\n            | BridgeCommand::AskAnswer { session_id, .. }\n            | BridgeCommand::AskDismiss { session_id } => Self::Session {\n                session: session_id.clone(),\n                branch: None,\n            },\n            BridgeCommand::SearchProjectFiles { session_id, query } => Self::Mention {\n                session: session_id.clone(),\n                query: query.clone(),\n            },\n            BridgeCommand::DeleteSession { session_id } => Self::DeletedSession(session_id.clone()),\n            BridgeCommand::Steer { session_id, text } => Self::Steer {\n                session: session_id.clone(),\n                text: text.clone(),\n            },\n            _ => Self::Global,\n        }\n    }\n\n    fn applies(&self, vm: &WorkspaceState, pending_open: Option<&str>) -> bool {\n        match self {\n            Self::Global => true,\n            Self::Open(session) => pending_open == Some(session.as_str()),\n            Self::Session { session, branch } => vm.active.as_ref().is_some_and(|active| {\n                &active.session_id == session\n                    && branch\n                        .as_ref()\n                        .is_none_or(|branch| branch == &active.branch_id)\n            }),\n            Self::Mention { session, query } => {\n                vm.active\n                    .as_ref()\n                    .is_some_and(|active| &active.session_id == session)\n                    && vm.mention.as_ref().is_some_and(|mention| {\n                        mention.kind == MentionKind::File && &mention.fragment == query\n                    })\n            }\n            // Delete, recall, and steer replies carry their own staleness\n            // checks.\n            Self::DeletedSession(_) | Self::Recall(_) | Self::Steer { .. } => true,\n        }\n    }\n}\n\n/// Everything that lands on the driver's work queue besides bridge events.\nenum DriverMsg {\n    /// A command's reply, tagged with the scope chosen at dispatch.\n    /// `BridgeReply` is wide (a whole conversation rides `Conversation`), so\n    /// the reply is boxed and the small tick variants stay cheap.\n    Reply {\n        scope: ReplyScope,\n        reply: Box<BridgeReply>,\n    },\n    /// The mention-search debounce elapsed; the generation must still match.\n    MentionSearchTick { generation: u64 },\n    /// The settings text-field debounce elapsed; flush the draft document.\n    SettingsTextSaveTick { generation: u64 },\n    /// The settled window size should persist now.\n    UiStateSaveTick { generation: u64 },\n    /// Startup config repairs waited out their toast delay.\n    RepairToastTick,\n    /// A day of runtime passed; re-check for an update when allowed.\n    UpdateRecheckTick,\n    /// The watched tree changed and its burst of events settled.\n    GitTreeChanged { generation: u64 },\n    /// A `git status` read finished.\n    GitStatusRead {\n        generation: u64,\n        root: String,\n        snapshot: Box<crate::git_status::GitSnapshot>,\n    },\n    /// A `git diff` read finished.\n    GitDiffRead {\n        generation: u64,\n        path: String,\n        diff: String,\n    },\n}\n\nmod pump;\nuse self::pump::block_on;\n\n/// Typing `@` walks the project tree. Wait until the fragment settles so\n/// each keystroke does not start another full walk.\nconst MENTION_SEARCH_DEBOUNCE: Duration = Duration::from_millis(180);\n/// Writes a typed settings text field (the proxy URL) about 400ms after\n/// the last keystroke. A newer edit or a blur supersedes the timer.\nconst SETTINGS_TEXT_SAVE_DEBOUNCE: Duration = Duration::from_millis(400);\n/// Persists a resized window's settled size after this quiet period.\nconst UI_STATE_SAVE_DEBOUNCE: Duration = Duration::from_millis(400);\n/// Config-repair names collect for half a second so startup toasts arrive once.\nconst REPAIR_TOAST_DELAY: Duration = Duration::from_millis(500);\n/// Wakes once a day of runtime, then checks for an update when that is enabled.\nconst UPDATE_RECHECK_AFTER: Duration = Duration::from_secs(24 * 60 * 60);\n\n/// A stop the user asked for, and the draft that goes out once the turn is\n/// gone. The draft waits here instead of the composer, so a message sent\n/// beside the cancel cannot become the turn that cancel kills.\npub(crate) struct HeldInterrupt {\n    /// Session whose turn is stopping.\n    session_id: String,\n    /// Draft to send once the turn is done. `None` for a bare stop.\n    send: Option<String>,\n}\n\n/// The shared frontend controller. Owns the core bridge, the view-model\n/// state, and the product bookkeeping; renders nothing itself.\npub struct FrontendDriver {\n    bridge: CoreBridge,\n    /// Streaming events forwarded onto a `std` channel for paced draining.\n    events: Receiver<BridgeEvent>,\n    inbox: Receiver<DriverMsg>,\n    inbox_tx: Sender<DriverMsg>,\n    /// Called after every inbox deposit and forwarded event — a frontend's\n    /// redraw hook.\n    wake: Arc<dyn Fn() + Send + Sync>,\n    /// Forwarder thread: tokio receiver → `std` channel → `wake`.\n    _events_worker: JoinHandle<()>,\n    /// Whole-window state; product transitions go through [`reduce`].\n    vm: WorkspaceState,\n    /// Owned home the process opened with. Role discovery reads `agents/`\n    /// under it; skill discovery scans the open project and the OS user home.\n    home: HomeLayout,\n    /// Session created to carry [`WorkspaceState::pending_welcome_send`].\n    welcome_send_session: Option<String>,\n    /// Attachments that ride the held welcome draft. They are not in the\n    /// view model, so they live beside the session that will carry them.\n    welcome_attachments: mycode_app::Attachments,\n    /// The held welcome text is only the attachment note synthesized so the\n    /// first message has a title; the durable message must not repeat it.\n    welcome_send_is_note: bool,\n    /// Session whose conversation-open is in flight. Conversation replies\n    /// for anything else are dropped, so a parked desk stays parked.\n    pending_open: Option<String>,\n    /// Project the next created session binds to.\n    pending_project: Option<String>,\n    /// Draft restored by edit-and-resend or a slash insert, applied by the\n    /// frontend's next composer paint (the widget needs a window on GPUI).\n    pending_composer_prefill: Option<String>,\n    /// The frontend last reported the conversation viewport at its tail.\n    /// `Older` replies and `grew` actions read it to decide whether the\n    /// viewport follows the stream or keeps the reader's position.\n    conversation_at_tail: bool,\n    /// The frontend is holding a scroll anchor for a page still painting.\n    /// `request_older` refuses to start another read on top of it.\n    scroll_hold_pending: bool,\n    /// Settings edit epoch captured when the in-flight save was dispatched.\n    settings_save_epoch: u64,\n    /// Bumped when a text-field save is scheduled or flushed, so a stale\n    /// debounce tick does not write an older draft.\n    settings_text_save_generation: u64,\n    /// A typed settings text-field debounce is waiting to write `settings.json`.\n    settings_text_save_pending: bool,\n    /// Bumped on each window-size change so only the settled size persists.\n    ui_state_save_generation: u64,\n    /// Last mention fragment already searched, to dedupe repeat lookups.\n    mention_query: Option<(MentionKind, String)>,\n    /// Bumped on each file-fragment change so a stale mention tick does not\n    /// search.\n    mention_generation: u64,\n    /// `GetCatalog` was already sent this session. The catalog is loaded\n    /// lazily: nothing asks for it until a surface that needs the document\n    /// opens.\n    catalog_requested: bool,\n    pending_catalog_refresh: bool,\n    /// MCP server ids whose enable switch waits on a successful tools probe.\n    pending_mcp_enable: HashSet<String>,\n    /// The in-flight check was started by the user, so its result may toast.\n    manual_update_check: bool,\n    /// The staged payload's exit swap is already armed; staging the same\n    /// payload again (a manual install click, say) must not spawn another\n    /// helper copy.\n    update_armed: bool,\n    /// Version a self-update installed since the last launch. Toasted once\n    /// the first settings reply lands, so it renders in the UI language.\n    applied_update: Option<String>,\n    /// Invalidates asynchronous recall lookups when their conversation\n    /// changes.\n    recall_generation: u64,\n    /// Config files reset during this launch; their names toast once.\n    repaired_configs: Vec<String>,\n    /// How many of [`Self::repaired_configs`] a toast already named.\n    repairs_toasted: usize,\n    /// A single toast for the untoasted repairs is already scheduled.\n    repair_toast_armed: bool,\n    /// Bundle of the import in flight, kept so a refusal can be confirmed.\n    import_request: Option<PathBuf>,\n    /// Bundle whose import changes MCP server commands and waits for the\n    /// user's explicit confirmation.\n    import_confirm: Option<PathBuf>,\n    /// Roles resolved from built-ins, the home `agents` directory, and the\n    /// open project's `.mycode/agents`. `None` until a surface asks for them.\n    agent_roles: Option<Arc<mycode_app::RoleCatalog>>,\n    /// Project directory the cached role catalog was built for.\n    agent_roles_project: Option<String>,\n    /// The roles surface was opened again, or the project changed.\n    agent_roles_stale: bool,\n    /// The `LoadUiState` reply landed (either way), so the remembered\n    /// project no longer overwrites one the frontend picks.\n    ui_state_loaded: bool,\n    /// The install-magpie notice has been shown; persisted in `ui.json`.\n    magpie_prompted: bool,\n    /// Session opened while its turn was running. Events committed between\n    /// the core reading that snapshot and the reply landing here were\n    /// dropped as belonging to another chat, so the transcript reloads from\n    /// the ledger once the turn ends.\n    resync_on_turn_end: Option<String>,\n    /// A `SendMessage` waiting for a reopen of the same chat to land. That\n    /// reopen's snapshot predates the message; applied after the send's\n    /// reply, it would wipe the message off the screen.\n    held_send: Option<BridgeCommand>,\n    /// Attachments of sends still waiting for their `Sent` reply, keyed by\n    /// session. A failed send hands them back instead of dropping them.\n    pending_send_attachments: BTreeMap<String, mycode_app::Attachments>,\n    /// The turn being stopped, and the draft that goes out once it is gone;\n    /// see [`FrontendDriver::interrupt_send`].\n    held_interrupt: Option<HeldInterrupt>,\n    /// The open folder's git status and opened diff; see [`git`].\n    git: git::GitWatch,\n    /// Free-text answers to the pending ask card, aligned with its rows.\n    pub ask_texts: Vec<String>,\n    /// The question the ask card is showing; answers step one at a time.\n    pub ask_index: usize,\n}\n\nimpl FrontendDriver {\n    /// Starts the core and the forwarder thread. `wake` runs after each\n    /// inbox deposit and after each forwarded event.\n    ///\n    /// # Panics\n    /// Panics when the core bridge thread cannot start.\n    #[must_use]\n    pub fn start(home: HomeLayout, wake: impl Fn() + Send + Sync + 'static) -> Self {\n        let (bridge, mut bridge_events) = CoreBridge::start(home.clone());\n        let (events_tx, events) = std::sync::mpsc::channel::<BridgeEvent>();\n        let (inbox_tx, inbox) = std::sync::mpsc::channel::<DriverMsg>();\n        let wake = Arc::new(wake) as Arc<dyn Fn() + Send + Sync>;\n        let events_wake = wake.clone();\n        let events_worker = std::thread::Builder::new()\n            .name(\"mycode-driver-events\".into())\n            .spawn(move || {\n                // `blocking_recv` is the sync-context receiver; it parks\n                // until the core sends or every sender is dropped.\n                while let Some(event) = bridge_events.blocking_recv() {\n                    if events_tx.send(event).is_err() {\n                        return;\n                    }\n                    events_wake();\n                }\n            })\n            .expect(\"driver events thread\");\n        let driver = Self {\n            bridge,\n            events,\n            inbox,\n            inbox_tx,\n            wake,\n            _events_worker: events_worker,\n            vm: WorkspaceState::default(),\n            home,\n            welcome_send_session: None,\n            welcome_attachments: mycode_app::Attachments::default(),\n            welcome_send_is_note: false,\n            pending_open: None,\n            pending_project: None,\n            pending_composer_prefill: None,\n            conversation_at_tail: true,\n            scroll_hold_pending: false,\n            settings_save_epoch: 0,\n            settings_text_save_generation: 0,\n            settings_text_save_pending: false,\n            ui_state_save_generation: 0,\n            mention_query: None,\n            mention_generation: 0,\n            catalog_requested: false,\n            pending_catalog_refresh: false,\n            pending_mcp_enable: HashSet::new(),\n            manual_update_check: false,\n            update_armed: false,\n            applied_update: None,\n            recall_generation: 0,\n            repaired_configs: Vec::new(),\n            repairs_toasted: 0,\n            repair_toast_armed: false,\n            import_request: None,\n            import_confirm: None,\n            agent_roles: None,\n            agent_roles_project: None,\n            agent_roles_stale: false,\n            ui_state_loaded: false,\n            magpie_prompted: false,\n            resync_on_turn_end: None,\n            held_send: None,\n            pending_send_attachments: BTreeMap::new(),\n            held_interrupt: None,\n            git: git::GitWatch::default(),\n            ask_texts: Vec::new(),\n            ask_index: 0,\n        };\n        driver.spawn_update_recheck();\n        driver\n    }\n\n    /// The view-model state the frontend renders.\n    pub fn vm(&self) -> &WorkspaceState {\n        &self.vm\n    }\n\n    /// The owned home this process opened with.\n    pub fn home(&self) -> &HomeLayout {\n        &self.home\n    }\n\n    /// Initial loads every frontend issues at startup.\n    pub fn bootstrap(&mut self, effects: &mut Vec<Effect>) {\n        self.dispatch(BridgeCommand::ListSessions);\n        self.dispatch(BridgeCommand::LoadSettings);\n        self.dispatch(BridgeCommand::LoadUiState);\n        let _ = effects;\n    }\n\n    /// Deferred startup work: catalog refresh and the update check start\n    /// once the first frame painted.\n    pub fn ui_ready(&mut self) {\n        self.dispatch(BridgeCommand::UiReady);\n    }\n\n    /// The open conversation's session id.\n    pub fn open_session_id(&self) -> Option<String> {\n        self.vm\n            .active\n            .as_ref()\n            .map(|conversation| conversation.session_id.clone())\n    }\n\n    /// Session, branch, and head of the open conversation, read without\n    /// cloning its transcript. `None` without an open chat or when its ids\n    /// do not parse.\n    pub fn open_turn_target(&self) -> Option<(SessionId, BranchId, HeadStamp)> {\n        let active = self.vm.active.as_ref()?;\n        Some((\n            SessionId::parse(&active.session_id)?,\n            BranchId::parse(&active.branch_id)?,\n            parse_head(&active.head),\n        ))\n    }\n\n    /// Draft restored by edit-and-resend, applied by the frontend's next\n    /// composer paint.\n    pub fn take_composer_prefill(&mut self) -> Option<String> {\n        self.pending_composer_prefill.take()\n    }\n\n    /// The frontend reports whether the conversation viewport sits at its\n    /// tail. A frontend that cannot scroll leaves this `true`.\n    pub fn set_conversation_at_tail(&mut self, at_tail: bool) {\n        self.conversation_at_tail = at_tail;\n    }\n\n    /// The frontend holds a scroll anchor for an older page still painting.\n    /// Cleared when the column consumes it, and on any conversation switch\n    /// via [`Effect::ScrollAnchorInvalidated`].\n    pub fn note_scroll_hold(&mut self, pending: bool) {\n        self.scroll_hold_pending = pending;\n    }\n\n    /// Records the version a self-update installed since the last launch;\n    /// it is announced after the first settings load.\n    pub fn note_update_applied(&mut self, version: String) {\n        self.applied_update = Some(version);\n    }\n\n    /// Persists a resized window's settled size. The frontend reports every\n    /// bounds change; only a size difference arms the debounce and only the\n    /// last generation wins the write.\n    pub fn note_window_resized(&mut self, width: f32, height: f32) {\n        let size = mycode_app::WindowSize {\n            width: width.round().max(0.) as u32,\n            height: height.round().max(0.) as u32,\n        };\n        if size.width == 0\n            || size.height == 0\n            || size.width > mycode_app::MAX_WINDOW_EDGE_PX\n            || size.height > mycode_app::MAX_WINDOW_EDGE_PX\n            || self.vm.window_size == Some(size)\n        {\n            return;\n        }\n        self.vm.window_size = Some(size);\n        self.ui_state_save_generation = self.ui_state_save_generation.wrapping_add(1);\n        let generation = self.ui_state_save_generation;\n        self.schedule(UI_STATE_SAVE_DEBOUNCE, move || DriverMsg::UiStateSaveTick {\n            generation,\n        });\n    }\n\n    /// Whether the startup `LoadUiState` reply has been folded in. A\n    /// frontend that opens its own folder waits for this, or the remembered\n    /// project replaces it.\n    pub fn ui_state_loaded(&self) -> bool {\n        self.ui_state_loaded\n    }\n\n    /// Shows the one-time install notice when MCode has no magpie binding.\n    /// Persisted so a user who dismissed it is not told again on every start.\n    pub(crate) fn prompt_magpie_install(&mut self, out: &mut Vec<Effect>) {\n        if self.magpie_prompted || !self.ui_state_loaded {\n            return;\n        }\n        let active = self\n            .vm\n            .settings\n            .as_ref()\n            .is_some_and(|settings| settings.magpie.is_active());\n        if active {\n            return;\n        }\n        self.magpie_prompted = true;\n        self.toast(\n            crate::i18n::t(\n                \"Can't reach the magpie gateway. Install or start magpie (https://usemagpie.ai), \\\n                 then run: magpie plugin add github:MCapricorns/magpie-mycode\",\n                \"连接不到 magpie 网关。请安装或启动 magpie（https://usemagpie.ai），\\\n                 然后运行：magpie plugin add github:MCapricorns/magpie-mycode\",\n            )\n            .to_owned(),\n            ToastKind::Warning,\n            out,\n        );\n        self.persist_ui_state();\n    }\n\n    /// The bundle waiting for the MCP-command confirmation, if any.\n    pub fn import_confirm(&self) -> Option<&Path> {\n        self.import_confirm.as_deref()\n    }\n\n    /// The question row the ask card is showing.\n    pub fn ask_index(&self) -> usize {\n        self.ask_index\n    }\n\n    /// Escape's first level: close whichever floating menu is open. Returns\n    /// true when something closed so the caller stops dismissing.\n    pub fn dismiss_floating(&mut self) -> bool {\n        crate::view_model::close_floating_menus(&mut self.vm)\n    }\n\n    /// Enqueues one command immediately; its reply lands on the inbox\n    /// tagged with its scope.\n    pub fn dispatch(&self, command: BridgeCommand) {\n        let scope = ReplyScope::for_command(&command);\n        self.dispatch_scoped(command, scope);\n    }\n\n    /// Dispatch with an explicit scope — the recall page walk tags its\n    /// `LoadOlder` replies so they resolve the rewind instead of prepending.\n    pub(crate) fn dispatch_scoped(&self, command: BridgeCommand, scope: ReplyScope) {\n        let request = self.bridge.request(command);\n        let tx = self.inbox_tx.clone();\n        let wake = self.wake.clone();\n        std::thread::spawn(move || {\n            let reply = block_on(request);\n            if tx\n                .send(DriverMsg::Reply {\n                    scope,\n                    reply: Box::new(reply),\n                })\n                .is_ok()\n            {\n                wake();\n            }\n        });\n    }\n\n    /// Runs `work` on a worker thread; its message lands on this inbox.\n    fn in_background(&self, work: impl FnOnce() -> DriverMsg + Send + 'static) {\n        let tx = self.inbox_tx.clone();\n        let wake = self.wake.clone();\n        std::thread::spawn(move || {\n            if tx.send(work()).is_ok() {\n                wake();\n            }\n        });\n    }\n\n    /// One timer step landing later on this same inbox.\n    fn schedule(&self, after: Duration, build: impl FnOnce() -> DriverMsg + Send + 'static) {\n        let tx = self.inbox_tx.clone();\n        let wake = self.wake.clone();\n        std::thread::spawn(move || {\n            std::thread::sleep(after);\n            if tx.send(build()).is_ok() {\n                wake();\n            }\n        });\n    }\n\n    /// The next bridge event, if the forwarder already delivered one.\n    /// Frontends call this inside their wake handler to pace streamed\n    /// deltas; `poll` covers replies and timers.\n    pub fn next_event(&mut self) -> Option<BridgeEvent> {\n        self.events.try_recv().ok()\n    }\n\n    /// Drains replies and expired timers, folding each into the state.\n    /// Effects accumulate in `out` in the order they were decided.\n    pub fn poll(&mut self, out: &mut Vec<Effect>) {\n        while let Ok(message) = self.inbox.try_recv() {\n            match message {\n                DriverMsg::Reply { scope, reply } => {\n                    if scope.applies(&self.vm, self.pending_open.as_deref()) {\n                        self.on_reply(scope, *reply, out);\n                    }\n                    // Any reply can end the reopen a held send waits on,\n                    // including one that superseded it.\n                    self.release_held_send();\n                }\n                DriverMsg::MentionSearchTick { generation } => {\n                    if generation == self.mention_generation {\n                        self.fire_mention_search();\n                    }\n                }\n                DriverMsg::SettingsTextSaveTick { generation } => {\n                    if generation == self.settings_text_save_generation {\n                        self.settings_text_save_pending = false;\n                        self.save_settings(out);\n                    }\n                }\n                DriverMsg::UiStateSaveTick { generation } => {\n                    if generation == self.ui_state_save_generation {\n                        self.persist_ui_state();\n                    }\n                }\n                DriverMsg::RepairToastTick => {\n                    // Re-arm for a repair a later settings load makes; the\n                    // names already shown stay out of the next toast.\n                    self.repair_toast_armed = false;\n                    let names = self.repaired_configs[self.repairs_toasted..].join(\", \");\n                    self.repairs_toasted = self.repaired_configs.len();\n                    self.toast(\n                        format!(\n                            \"{} {names}. {}\",\n                            crate::i18n::t(\"Reset unreadable config:\", \"已重置无法读取的配置：\"),\n                            crate::i18n::t(\n                                \"The previous files were kept beside them.\",\n                                \"原文件已留在旁边。\",\n                            ),\n                        ),\n                        ToastKind::Info,\n                        out,\n                    );\n                }\n                DriverMsg::UpdateRecheckTick => {\n                    if self.vm.auto_update {\n                        self.check_update(false, out);\n                    }\n                    // A one-shot timer fired: re-arm so the daily cadence\n                    // continues for the process's whole uptime.\n                    self.spawn_update_recheck();\n                }\n                DriverMsg::GitTreeChanged { generation } => self.on_git_tree_changed(generation),\n                DriverMsg::GitStatusRead {\n                    generation,\n                    root,\n                    snapshot,\n                } => self.finish_git_status(generation, &root, *snapshot),\n                DriverMsg::GitDiffRead {\n                    generation,\n                    path,\n                    diff,\n                } => self.finish_git_diff(generation, &path, diff),\n            }\n        }\n    }\n\n    /// Applies one action to the view-model state, then runs the product\n    /// consequences that follow from the transition (autosave, toasts,\n    /// project-change side effects, tail-follow scroll, mention search).\n    pub fn act(&mut self, action: FrontendAction, out: &mut Vec<Effect>) {\n        let grew = matches!(\n            action,\n            FrontendAction::MessageSent { .. }\n                | FrontendAction::TurnArmed\n                | FrontendAction::ChatDelta(_)\n                | FrontendAction::ChatThinkingDelta(_)\n                | FrontendAction::ToolPreparing { .. }\n                | FrontendAction::ToolStarted { .. }\n                | FrontendAction::ToolProgress { .. }\n                | FrontendAction::ToolResultAppended(_)\n                | FrontendAction::AssistantStepCommitted(_)\n                | FrontendAction::SteerCommitted { .. }\n                | FrontendAction::SteersReturned(_)\n                | FrontendAction::SummaryShown(_)\n                | FrontendAction::AskRequested(_)\n                | FrontendAction::CompactArmed\n                | FrontendAction::CompactFinished { .. }\n                | FrontendAction::ChatDone { .. }\n                | FrontendAction::ChatFailed { .. }\n                | FrontendAction::ConversationOpened(_)\n                | FrontendAction::SessionCreated(_)\n        );\n        let drop_hold = matches!(\n            action,\n            FrontendAction::ConversationOpened(_)\n                | FrontendAction::SessionCreated(_)\n                | FrontendAction::SessionDeleted\n                | FrontendAction::ConversationParked\n        );\n        if drop_hold {\n            self.recall_generation = self.recall_generation.wrapping_add(1);\n        }\n        if drop_hold\n            || matches!(\n                action,\n                FrontendAction::AskRequested(_)\n                    | FrontendAction::ChatDone { .. }\n                    | FrontendAction::ChatFailed { .. }\n            )\n        {\n            self.ask_texts.clear();\n            self.ask_index = 0;\n            out.push(Effect::AskReset);\n        }\n        let previous_error = self.vm.error.clone();\n        let previous_project = self.vm.project_dir.clone();\n        let composer_changed = matches!(action, FrontendAction::ComposerChanged(_));\n        let text_edit = matches!(\n            action,\n            FrontendAction::SettingsProxyChanged { typed: true, .. }\n        );\n        let epoch_before = self\n            .vm\n            .settings\n            .as_ref()\n            .map(|settings| settings.edit_epoch);\n        if matches!(action, FrontendAction::ShowMainView(view) if view != MainView::Settings)\n            && self.vm.view == MainView::Settings\n        {\n            self.flush_settings_text_save(out);\n        }\n        // magpie rewrites its own `mcp.json`; reading it when its page opens\n        // shows what the Library has now, not what it had at startup.\n        if matches!(\n            action,\n            FrontendAction::ShowSettingsSection(crate::view_model::SettingsSection::Mcp)\n        ) {\n            self.reload_mcp_library(out);\n        }\n        if let FrontendAction::SettingsMcpRemoved(index) = &action\n            && let Some(id) = self\n                .vm\n                .settings\n                .as_ref()\n                .and_then(|settings| settings.mcp_servers.get(*index))\n                .map(|server| server.id.clone())\n        {\n            self.pending_mcp_enable.remove(&id);\n        }\n        reduce(&mut self.vm, action);\n        if self.vm.project_dir != previous_project {\n            self.agent_roles_stale = true;\n            self.rewatch_git();\n        }\n        if self.vm.error.is_some()\n            && self.vm.error != previous_error\n            && let Some(message) = self.vm.error.take()\n        {\n            self.toast(message, ToastKind::Error, out);\n        }\n        if drop_hold {\n            self.scroll_hold_pending = false;\n            out.push(Effect::ScrollAnchorInvalidated);\n        }\n        // Stick to the newest line while the user is already there. A reader\n        // who scrolled up into history keeps that position. Prepending older\n        // history is not in this set: that path compensates the scroll offset.\n        if self.vm.view == MainView::Chat && grew && self.conversation_at_tail {\n            out.push(Effect::ScrollToTail);\n        }\n        let epoch_after = self\n            .vm\n            .settings\n            .as_ref()\n            .map(|settings| settings.edit_epoch);\n        let edited = match (epoch_before, epoch_after) {\n            // A reload replaces the projection with epoch 0. That is not a\n            // local edit. The first real edit moves the epoch off 0.\n            (Some(before), Some(after)) => after != before && after != 0,\n            _ => false,\n        };\n        if edited {\n            if text_edit {\n                self.schedule_settings_text_save();\n            } else {\n                self.save_settings(out);\n            }\n        }\n        if composer_changed {\n            self.refresh_mention_search();\n        }\n    }\n\n    /// Convenience for one-off pushes.\n    pub(crate) fn toast(&self, text: impl Into<String>, kind: ToastKind, out: &mut Vec<Effect>) {\n        let text = text.into();\n        if text.trim().is_empty() {\n            return;\n        }\n        out.push(Effect
