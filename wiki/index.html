    /// stops recording (a lagged bus, a failed ledger write) must not leave\n    /// the model running tools that nothing records and the UI no longer\n    /// shows. After a terminal agent event the cancel is a no-op.\n    async fn fail(&self, message: impl Into<String>) -> BridgeEvent {\n        self.cancel.cancel();\n        BridgeEvent::ChatFailed {\n            session_id: self.session_id.clone(),\n            message: message.into(),\n            head: self.writer.head().await,\n        }\n    }\n\n    async fn publish_deferred(&self) {\n        self.deferred\n            .publish(&self.writer, &self.events, &self.session_id)\n            .await;\n    }\n\n    fn send_usage(&self, usage: &TurnUsage) {\n        self.send(BridgeEvent::UsageSnapshot {\n            session_id: self.session_id.clone(),\n            model: self.usage_model.clone(),\n            input: usage.input,\n            context: usage.latest_input,\n            context_cache: usage.latest_cache,\n            output: usage.output,\n            cache: usage.cache,\n            requests: usage.requests,\n            elapsed_ms: self.started.elapsed().as_millis() as u64,\n        });\n    }\n\n    /// Writes one assistant message and returns its transcript row.\n    async fn commit_assistant(\n        &self,\n        assistant: &AssistantMessage,\n    ) -> Result<ConversationEntry, String> {\n        let payload = serde_json::to_vec(assistant)\n            .map_err(|_| \"assistant message could not be encoded\".to_owned())?;\n        let event_id = self\n            .writer\n            .write(EventKind::Message, &payload)\n            .await\n            .map_err(render_error)?;\n        Ok(project_assistant_message(&event_id, assistant))\n    }\n\n    /// Commits a held text reply as a transcript step, when there is one.\n    async fn commit_held_step(&self, held: Option<Arc<Message>>) -> Result<(), String> {\n        let Some(held) = held else {\n            return Ok(());\n        };\n        let Message::Assistant(assistant) = held.as_ref() else {\n            return Ok(());\n        };\n        let entry = self.commit_assistant(assistant).await?;\n        self.send(BridgeEvent::AssistantStep {\n            session_id: self.session_id.clone(),\n            entry,\n        });\n        Ok(())\n    }\n\n    /// Commits one steer the agent injected into this turn. A held text\n    /// reply lands first: the steer continues that turn, so the reply has to\n    /// precede it or the ledger order flips.\n    async fn commit_steer(&self, text: String, held: Option<Arc<Message>>) -> Result<(), String> {\n        self.commit_held_step(held).await?;\n        let event_id = self\n            .writer\n            .write(EventKind::Message, text.as_bytes())\n            .await\n            .map_err(render_error)?;\n        self.send(BridgeEvent::SteerCommitted {\n            session_id: self.session_id.clone(),\n            head: self.writer.head().await,\n            entry: ConversationEntry {\n                event_id,\n                kind: EntryKind::UserMessage,\n                text: text.into(),\n                call_id: None,\n                thinking: String::new(),\n            },\n        });\n        // The steer is already in the next request. Arm before that\n        // request's usage snapshot.\n        watch_prompt_cache(\n            &self.events,\n            &self.session_id,\n            crate::CacheDisruption::Steer,\n        );\n        Ok(())\n    }\n\n    /// Publishes the deferred summary cards, then ends the turn with\n    /// `entry`. The cards follow the closing reply, so they cannot split a\n    /// tool call from its result; ChatDone then carries the head that\n    /// includes them.\n    async fn finish(&self, entry: ConversationEntry) -> BridgeEvent {\n        self.publish_deferred().await;\n        BridgeEvent::ChatDone {\n            session_id: self.session_id.clone(),\n            head: self.writer.head().await,\n            entry,\n        }\n    }\n}\n\n/// Name of the delegation tool, whose calls get a card while still streaming.\nconst AGENT_TOOL: &str = \"agent\";\n\n/// `agent` calls the model is still writing. Their briefs can run to\n/// thousands of characters, so each gets a card when it opens instead of\n/// all of them appearing at once when the response ends.\n#[derive(Default)]\nstruct PreparingCalls {\n    /// Calls still being written, by provider call id.\n    calls: std::collections::HashMap<String, PreparingCall>,\n}\n\n#[derive(Default)]\nstruct PreparingCall {\n    /// Arguments so far; dropped once the label is final.\n    arguments: String,\n    /// The label last sent.\n    shown: String,\n    /// Role and description were both read: the rest of the brief cannot\n    /// change the label, so later bytes are neither kept nor scanned.\n    settled: bool,\n}\n\nimpl PreparingCalls {\n    /// Tracks a newly opened call; returns its first (empty) label when it\n    /// is an `agent` call.\n    fn open(&mut self, id: &str, name: &str) -> Option<String> {\n        if name != AGENT_TOOL || id.is_empty() {\n            return None;\n        }\n        self.calls.insert(id.to_owned(), PreparingCall::default());\n        Some(String::new())\n    }\n\n    /// Appends argument bytes; returns the label when it just changed.\n    fn extend(&mut self, id: &str, partial_json: &str) -> Option<String> {\n        let call = self.calls.get_mut(id)?;\n        if call.settled {\n            return None;\n        }\n        call.arguments.push_str(partial_json);\n        let role = partial_string_field(&call.arguments, \"agent\");\n        let description = partial_string_field(&call.arguments, \"description\");\n        if role.is_some() && description.is_some() {\n            call.settled = true;\n            call.arguments = String::new();\n        }\n        let known = serde_json::json!({\n            \"agent\": role.unwrap_or_default(),\n            \"description\": description.unwrap_or_default(),\n        });\n        let target = mycode_agent::tool_target(AGENT_TOOL, &known);\n        if target == call.shown {\n            return None;\n        }\n        call.shown.clone_from(&target);\n        Some(target)\n    }\n\n    /// The call started for real; its card takes over.\n    fn close(&mut self, id: &str) {\n        self.calls.remove(id);\n    }\n}\n\n/// A top-level string field of a JSON object that is still streaming, once\n/// its value is complete. A key spelled inside another string is escaped\n/// there (`\\\"agent\\\"`), so the quoted key only matches a real key.\nfn partial_string_field(json: &str, key: &str) -> Option<String> {\n    let quoted = format!(\"\\\"{key}\\\"\");\n    let mut from = 0;\n    while let Some(found) = json[from..].find(&quoted) {\n        let after = from + found + quoted.len();\n        from = after;\n        let rest = json[after..].trim_start();\n        let Some(rest) = rest.strip_prefix(':') else {\n            continue;\n        };\n        let rest = rest.trim_start();\n        if !rest.starts_with('\"') {\n            continue;\n        }\n        let mut escaped = false;\n        for (index, ch) in rest.char_indices().skip(1) {\n            match ch {\n                '\\\\' if !escaped => escaped = true,\n                '\"' if !escaped => {\n                    return serde_json::from_str::<String>(&rest[..=index]).ok();\n                }\n                _ => escaped = false,\n            }\n        }\n        return None;\n    }\n    None\n}\n\n/// Moves the agent bus onto an unbounded queue as fast as it fills.\n///\n/// The pump awaits a ledger fsync for every tool call, result, and step.\n/// Meanwhile a chatty tool or a few subagents can publish hundreds of\n/// progress lines, and a lagged broadcast receiver loses events for good —\n/// an assistant step or a tool result among them. The relay only moves\n/// events, so it keeps up; the queue absorbs the burst.\nfn relay(\n    mut agent_rx: broadcast::Receiver<AgentEvent>,\n) -> mpsc::UnboundedReceiver<Result<AgentEvent, RecvError>> {\n    let (tx, rx) = mpsc::unbounded_channel();\n    tokio::spawn(async move {\n        loop {\n            let item = agent_rx.recv().await;\n            let closed = matches!(item, Err(RecvError::Closed));\n            if tx.send(item).is_err() || closed {\n                return;\n            }\n        }\n    });\n    rx\n}\n\n/// Token usage summed across every response cycle of one turn.\n///\n/// Providers report usage per cycle, so a turn that calls tools reports\n/// several times. The sums feed the live [`BridgeEvent::UsageSnapshot`]\n/// meter; nothing is persisted to the ledger.\n#[derive(Debug, Default)]\nstruct TurnUsage {\n    /// Fresh (non-cache-read) prompt tokens summed over the turn. Derived\n    /// uniformly from `prompt_tokens` minus the cache read, so an\n    /// OpenAI-style `input_tokens` that already includes the cached\n    /// context does not bill every re-sent round as new input.\n    input: u64,\n    /// Most recent request's prompt tokens. The context meter uses this\n    /// instead of `input`, which sums every tool round.\n    latest_input: u64,\n    output: u64,\n    cache: Option<u64>,\n    /// Cache-read tokens on the latest prompt. The context meter shows this\n    /// beside the window, separate from [`Self::cache`], which is the sum.\n    latest_cache: u64,\n    /// Response cycles folded in.\n    requests: u32,\n}\n\nimpl TurnUsage {\n    fn fold(&mut self, usage: &mycode_agent::Usage) {\n        self.requests = self.requests.saturating_add(1);\n        let prompt = if usage.prompt_tokens > 0 {\n            usage.prompt_tokens\n        } else {\n            usage.input_tokens\n        };\n        self.input = self\n            .input\n            .saturating_add(prompt.saturating_sub(usage.cache_read_tokens.unwrap_or(0)));\n        if prompt > 0 {\n            self.latest_input = prompt;\n            self.latest_cache = usage.cache_read_tokens.unwrap_or(0);\n        }\n        self.output = self.output.saturating_add(usage.output_tokens);\n        if let Some(cache) = usage.cache_read_tokens {\n            self.cache = Some(self.cache.unwrap_or_default().saturating_add(cache));\n        }\n    }\n}\n\npub(super) fn plain_user_text(user: &UserMessage) -> String {\n    let mut text = String::new();\n    for block in &user.content {\n        if let ContentBlock::Text(block) = block {\n            text.push_str(&block.text);\n        }\n    }\n    text\n}\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn an_agent_card_names_its_role_and_brief_while_the_call_streams() {\n        let mut preparing = super::PreparingCalls::default();\n        assert_eq!(preparing.open(\"call_1\", \"read\"), None);\n        assert_eq!(preparing.open(\"call_2\", \"agent\").as_deref(), Some(\"\"));\n        assert_eq!(\n            preparing.extend(\"call_1\", \"{}\"),\n            None,\n            \"only agent calls are tracked\"\n        );\n        assert_eq!(\n            preparing.extend(\"call_2\", r#\"{\"prompt\":\"say \\\"agent\\\": \\\"x\\\"\"#),\n            None\n        );\n        assert_eq!(preparing.extend(\"call_2\", r#\"\", \"agent\": \"sco\"#), None);\n        assert_eq!(\n            preparing\n                .extend(\"call_2\", r#\"ut\", \"description\": \"map the \"#)\n                .as_deref(),\n            Some(\"scout\")\n        );\n        assert_eq!(\n            preparing.extend(\"call_2\", r#\"crate\"}\"#).as_deref(),\n            Some(\"scout map the crate\")\n        );\n        assert_eq!(\n            preparing.extend(\"call_2\", \" \"),\n            None,\n            \"an unchanged label is not resent\"\n        );\n        assert!(\n            preparing.calls[\"call_2\"].arguments.is_empty(),\n            \"a settled brief is no longer buffered\"\n        );\n        preparing.close(\"call_2\");\n        assert_eq!(preparing.extend(\"call_2\", \"x\"), None);\n    }\n\n    #[test]\n    fn turn_usage_sums_fresh_input_but_meters_the_latest_prompt() {\n        // OpenAI-style usage counts the cache read inside `input_tokens`,\n        // so every tool round re-reports the whole re-sent prompt. The\n        // sum keeps only the fresh part: prompt minus the cache read.\n        let mut usage = super::TurnUsage::default();\n        for prompt in [40_000, 52_000, 61_000] {\n            usage.fold(&mycode_agent::Usage {\n                input_tokens: prompt,\n                output_tokens: 500,\n                cache_read_tokens: Some(prompt - 1_000),\n                cache_write_tokens: None,\n                prompt_tokens: prompt,\n            });\n        }\n        assert_eq!(usage.requests, 3);\n        assert_eq!(usage.input, 3_000, \"the sum is fresh input, not cache\");\n        assert_eq!(\n            usage.latest_input, 61_000,\n            \"the context meter is one prompt\"\n        );\n        assert_eq!(usage.latest_cache, 60_000);\n        assert_eq!(usage.output, 1_500);\n    }\n\n    #[test]\n    fn turn_usage_fresh_input_matches_a_cache_excluding_provider() {\n        // Anthropic- and DeepSeek-style `input_tokens` already exclude the\n        // cache read; `prompt_tokens` is input plus cache. Prompt minus\n        // cache lands on the same fresh figure the provider billed.\n        let mut usage = super::TurnUsage::default();\n        for (input, cache_read) in [(100, 11_800), (250, 12_050)] {\n            usage.fold(&mycode_agent::Usage {\n                input_tokens: input,\n                output_tokens: 10,\n                cache_read_tokens: Some(cache_read),\n                cache_write_tokens: None,\n                prompt_tokens: input + cache_read,\n            });\n        }\n        assert_eq!(usage.requests, 2);\n        assert_eq!(usage.input, 350);\n        assert_eq!(usage.latest_input, 12_300);\n        assert_eq!(usage.latest_cache, 12_050);\n        assert_eq!(usage.cache, Some(23_850));\n    }\n}\n","crates/mycode-agent/src/turn.rs":"//! Inner-loop mechanics: one LLM response cycle and one tool dispatch.\n//! See `wiki/index.html`.\n//!\n//! Everything here is a free function over `(&TurnEnv, &mut AgentState)`\n//! so the agent loop in [`crate::agent`] can call it with\n//! field-level borrows. Event emission follows the `AgentEvent`\n//! vocabulary of `mycode-core`.\n\nuse std::any::Any;\nuse std::future::Future;\nuse std::panic::AssertUnwindSafe;\nuse std::pin::Pin;\nuse std::sync::Arc;\nuse std::task::{Context, Poll};\n\nuse mycode_tools::events::{AgentEvent, MessageDelta};\nuse mycode_tools::message::{\n    AssistantMessage, ContentBlock, Message, SharedMessage, ToolCall, ToolResultMessage,\n};\nuse mycode_tools::{CallId, MycodeError};\nuse mycode_tools::{Request, StreamEvent};\nuse mycode_tools::{ToolError, ToolResult, ToolStream, ToolStreamItem, prepare_tool_ctx};\nuse tokio_util::sync::CancellationToken;\n\nuse crate::agent::{AgentConfig, AgentState};\nuse crate::env::TurnEnv;\nuse crate::prompt::build_system_prompt;\n\n/// Why an in-flight response cycle ended unsuccessfully.\npub(crate) enum TurnFailure {\n    /// The turn's cancellation token fired (`env.cancel` or a child of it).\n    Aborted,\n    /// A provider-level failure. The [`AgentEvent::Error`] event has\n    /// already been emitted at the failure site.\n    Error(MycodeError),\n    /// Request validation failed before this turn emitted [`AgentEvent::TurnStarted`].\n    /// The prompt must not stay in history and the turn must not end as aborted.\n    NotStarted(MycodeError),\n}\n\n/// Publish an Agent event; receiver errors (nobody listening, lagged)\n/// are ignored — observers are best-effort.\npub(crate) fn emit(env: &TurnEnv<'_>, event: AgentEvent) {\n    let _ = env.events.send(event);\n}\n\n/// Append a message to the history and announce it.\npub(crate) fn push_message(env: &TurnEnv<'_>, state: &mut AgentState, msg: Message) {\n    push_shared(env, state, Arc::new(msg));\n}\n\n/// [`push_message`] for a message that is already shared, such as a tool\n/// result its `ToolCompleted` event carried.\npub(crate) fn push_shared(env: &TurnEnv<'_>, state: &mut AgentState, msg: SharedMessage) {\n    state.messages.push(Arc::clone(&msg));\n    emit(env, AgentEvent::MessageAdded(msg));\n}\n\n/// Stream one assistant response into the history: build the request,\n/// iterate the provider stream, mirror every delta as a\n/// [`AgentEvent::MessageDelta`], and keep the fully assembled\n/// [`AssistantMessage`] from the terminal `Done` event.\n///\n/// Cancellation surfaces as [`TurnFailure::Aborted`] — either via the\n/// stream's own `Error(Cancelled)` termination or a boundary check.\npub(crate) async fn stream_assistant(\n    env: &TurnEnv<'_>,\n    token: &CancellationToken,\n    config: &AgentConfig,\n    state: &mut AgentState,\n    started: &mut bool,\n    pending_user: &mut Option<Arc<Message>>,\n) -> Result<AssistantMessage, TurnFailure> {\n    let system_prompt = if config.system_prompt.is_empty() {\n        Arc::from([build_system_prompt(env.tools)])\n    } else {\n        Arc::clone(&config.system_prompt)\n    };\n    // The request carries Arc-shared history; the compaction hook rewrites\n    // the request's message list and the result is written back below.\n    // Cloning the Arc vector (rather than moving the history out) keeps the\n    // in-memory history intact if the hook panics or this future is dropped\n    // at that await, so a failed rewrite cannot wipe the conversation.\n    // Writing the result back clones `Arc`s, not tool output.\n    let request = Request {\n        system_prompt,\n        messages: state.messages.clone(),\n        tools: env.tools.specs(),\n        reasoning: config.reasoning,\n        max_output_tokens: config.max_output_tokens,\n        reasoning_token: config.reasoning_token.clone(),\n        prompt_cache_key: config.prompt_cache_key.clone(),\n    };\n    let mut request = env.hooks.prepare_request(request).await;\n    state.messages.clone_from(&request.messages);\n    // A replayed ledger can end a turn on calls nothing answered (a crash,\n    // a closed window). Repair the request copy only: the history keeps its\n    // ledger shape, which compaction checkpoints index into.\n    mycode_tools::pair_tool_results(&mut request.messages);\n\n    if token.is_cancelled() {\n        return Err(TurnFailure::Aborted);\n    }\n    if let Err(error) = request.validate() {\n        let error = MycodeError::from(error);\n        emit(env, AgentEvent::Error(error.clone()));\n        return Err(if *started {\n            TurnFailure::Error(error)\n        } else {\n            TurnFailure::NotStarted(error)\n        });\n    }\n    if !*started {\n        emit(env, AgentEvent::TurnStarted);\n        *started = true;\n        if let Some(message) = pending_user.take() {\n            emit(env, AgentEvent::MessageAdded(message));\n        }\n    }\n    if token.is_cancelled() {\n        return Err(TurnFailure::Aborted);\n    }\n\n    // A request the provider refused as over the context window is shrunk\n    // and sent once more, but only before any output arrived: past that, a\n    // resend would repeat what the user already saw.\n    let mut may_shrink = env.hooks.recovers_overflow();\n    'request: loop {\n        // One request gets a child token: dropping its receiver must stop that\n        // producer without cancelling later response cycles in the same turn.\n        let request_cancel = token.child_token();\n        let mut draft_text = String::new();\n        let mut draft_thinking = String::new();\n        let mut streamed = false;\n        let mut stream = match env.provider.stream(&request, request_cancel).await {\n            Ok(stream) => stream,\n            Err(error) if error.is_cancelled() => return Err(TurnFailure::Aborted),\n            Err(error) => {\n                if std::mem::take(&mut may_shrink)\n                    && error.is_context_overflow()\n                    && let Some(smaller) = shrink_overflowed(env, token, state, &request).await?\n                {\n                    request = smaller;\n                    continue 'request;\n                }\n                // Nothing has streamed. Keep a visible assistant line instead of\n                // dropping the turn.\n                return Ok(commit_interrupted(\n                    env,\n                    state,\n                    String::new(),\n                    String::new(),\n                    &error.to_string(),\n                ));\n            }\n        };\n        while let Some(event) = stream.next().await {\n            match event {\n                StreamEvent::TextDelta(delta) => {\n                    streamed = true;\n                    draft_text.push_str(&delta);\n                    emit(\n                        env,\n                        AgentEvent::MessageDelta(MessageDelta::TextDelta(delta)),\n                    );\n                }\n                StreamEvent::ThinkingDelta(delta) => {\n                    streamed = true;\n                    draft_thinking.push_str(&delta);\n                    emit(\n                        env,\n                        AgentEvent::MessageDelta(MessageDelta::ThinkingDelta(delta)),\n                    );\n                }\n                StreamEvent::ToolCallStarted { id, name } => {\n                    streamed = true;\n                    emit(\n                        env,\n                        AgentEvent::MessageDelta(MessageDelta::ToolCallStarted { id, name }),\n                    );\n                }\n                StreamEvent::ToolCallDelta { id, partial_json } => {\n                    streamed = true;\n                    emit(\n                        env,\n                        AgentEvent::MessageDelta(MessageDelta::ToolCallDelta { id, partial_json }),\n                    );\n                }\n                StreamEvent::Done { message } => {\n                    let message = merge_draft(message, &draft_thinking, &draft_text);\n                    let shared = Arc::new(Message::Assistant(message.clone()));\n                    state.messages.push(Arc::clone(&shared));\n                    emit(env, AgentEvent::MessageAdded(shared));\n                    return Ok(message);\n                }\n                StreamEvent::Error(error) => {\n                    if error.is_cancelled() {\n                        return Err(keep_cancelled_partial(\n                            env,\n                            state,\n                            draft_thinking,\n                            draft_text,\n                        ));\n                    }\n                    // Providers refuse most requests in the stream's first\n                    // event, not at the POST.\n                    if !streamed\n                        && std::mem::take(&mut may_shrink)\n                        && error.is_context_overflow()\n                        && let Some(smaller) =\n                            shrink_overflowed(env, token, state, &request).await?\n                    {\n                        request = smaller;\n                        continue 'request;\n                    }\n                    return Ok(commit_interrupted(\n                        env,\n                        state,\n                        draft_thinking,\n                        draft_text,\n                        &error.to_string(),\n                    ));\n                }\n            }\n        }\n        // EventStream itself synthesizes a terminal for cancellation and producer\n        // drop. Keep a fail-closed guard in case its contract is ever violated.\n        if token.is_cancelled() {\n            return Err(keep_cancelled_partial(\n                env,\n                state,\n                draft_thinking,\n                draft_text,\n            ));\n        }\n        return Ok(commit_interrupted(\n            env,\n            state,\n            draft_thinking,\n            draft_text,\n            \"provider stream ended without a terminal event\",\n        ));\n    }\n}\n\n/// Asks the overflow hook for a smaller request than `refused`.\n///\n/// The hook sees the history as the agent holds it, not the request copy\n/// whose unanswered calls were paired, and its messages are written back\n/// the same way the before-request rewrite's are.\nasync fn shrink_overflowed(\n    env: &TurnEnv<'_>,\n    token: &CancellationToken,\n    state: &mut AgentState,\n    refused: &Request,\n) -> Result<Option<Request>, TurnFailure> {\n    let mut retry = refused.clone();\n    retry.messages = state.messages.clone();\n    let smaller = env.hooks.shrink_overflowed(retry).await;\n    if token.is_cancelled() {\n        return Err(TurnFailure::Aborted);\n    }\n    let Some(mut smaller) = smaller else {\n        return Ok(None);\n    };\n    state.messages.clone_from(&smaller.messages);\n    mycode_tools::pair_tool_results(&mut smaller.messages);\n    Ok(smaller.validate().is_ok().then_some(smaller))\n}\n\n/// User cancel: keep what already arrived, mark it interrupted, and abort.\n///\n/// A cancelling stream ends with `Error(Cancelled)`, not `Done`; formed tool\n/// calls only arrive with `Done`, so this path has nothing to pair or fail.\nfn keep_cancelled_partial(\n    env: &TurnEnv<'_>,\n    state: &mut AgentState,\n    thinking: String,\n    text: String,\n) -> TurnFailure {\n    if thinking.is_empty() && text.is_empty() {\n        return TurnFailure::Aborted;\n    }\n    commit_interrupted(\n        env,\n        state,\n        thinking,\n        text,\n        mycode_tools::USER_INTERRUPT_DETAIL,\n    );\n    TurnFailure::Aborted\n}\n\n/// Keeps streamed thinking and text, then adds the shared interruption line.\n///\n/// A call that already completed on an earlier message stays in history on\n/// its own; an in-flight call on this message is still only deltas and is\n/// dropped with them.\nfn commit_interrupted(\n    env: &TurnEnv<'_>,\n    state: &mut AgentState,\n    thinking: String,\n    mut text: String,\n    detail: &str,\n) -> AssistantMessage {\n    let note = mycode_tools::interrupted_response_text(detail);\n    if !text.contains(note.as_str()) {\n        if !text.is_empty() && !text.ends_with('\\n') {\n            text.push('\\n');\n        }\n        text.push_str(&note);\n    }\n    let mut blocks = Vec::new();\n    if !thinking.is_empty() {\n        blocks.push(ContentBlock::Thinking(mycode_tools::ThinkingBlock::new(\n            thinking,\n        )));\n    }\n    blocks.push(ContentBlock::Text(mycode_tools::TextBlock::new(text)));\n    let message = AssistantMessage {\n        blocks,\n        usage: None,\n        stop_reason: mycode_tools::StopReason::Error,\n    };\n    let shared = Arc::new(Message::Assistant(message.clone()));\n    state.messages.push(Arc::clone(&shared));\n    emit(env, AgentEvent::MessageAdded(shared));\n    message\n}\n\n/// Fills thinking or text the reducer omitted when the draft already has it.\nfn merge_draft(mut message: AssistantMessage, thinking: &str, text: &str) -> AssistantMessage {\n    // Never commit an unpairable tool call: filtering only at dispatch would\n    // still resend it from history on the next user turn or after a steer.\n    let before = message.blocks.len();\n    message.blocks.retain(|block| match block {\n        ContentBlock::ToolCall(call) => !call.id.is_empty() && !call.name.is_empty(),\n        _ => true,\n    });\n    let discarded_call = message.blocks.len() != before;\n    let has_thinking = message\n        .blocks\n        .iter()\n        .any(|block| matches!(block, ContentBlock::Thinking(_)));\n    if !has_thinking && !thinking.is_empty() {\n        message.blocks.insert(\n            0,\n            ContentBlock::Thinking(mycode_tools::ThinkingBlock::new(thinking)),\n        );\n    }\n    if message.text().is_empty() && !text.is_empty() {\n        message\n            .blocks\n            .push(ContentBlock::Text(mycode_tools::TextBlock::new(text)));\n    }\n    if discarded_call {\n        message\n            .blocks\n            .push(ContentBlock::Text(mycode_tools::TextBlock::new(\n                \"The provider returned an incomplete tool call; it was not executed.\",\n            )));\n    }\n    message\n}\n\n/// Fail a tool call from a `Length`-truncated message without executing\n/// it: streamed arguments that parse may still be silently incomplete,\n/// so none of them are safe to run (pi parity). The model re-issues the\n/// call with complete arguments.\npub(crate) fn fail_truncated_call(env: &TurnEnv<'_>, call: &ToolCall) -> SharedMessage {\n    unexecuted_call(\n        env,\n        call,\n        \"tool call was not executed: the response hit the output token limit, so its \\\n            arguments may be truncated; re-issue the call with complete arguments\"\n            .into(),\n    )\n}\n\n/// Synthesize an `is_error` tool result for a call that arrived on a\n/// failed provider turn. The call is not executed. The result keeps the\n/// assistant `tool_call` id paired for the next request.\npub(crate) fn fail_interrupted_call(env: &TurnEnv<'_>, call: &ToolCall) -> SharedMessage {\n    unexecuted_call(\n        env,\n        call,\n        \"tool call was not executed: the response was interrupted before the call \\\n            could run\"\n            .into(),\n    )\n}\n\n/// Synthesize an `is_error` tool result for a call that was never\n/// dispatched because the turn aborted mid-dispatch of a multi-call\n/// response. The assistant message carrying every call is already in\n/// history, and the wire format requires every assistant `tool_call` id\n/// to be answered, so the loop writes these results before unwinding.\npub(crate) fn fail_cancelled_call(env: &TurnEnv<'_>, call: &ToolCall) -> SharedMessage {\n    unexecuted_call(\n        env,\n        call,\n        \"tool call was not executed: the turn was aborted before this call \\\n            was dispatched\"\n            .into(),\n    )\n}\n\n/// An `agent` call that started but had not completed when the turn\n/// cancelled.\n///\n/// Dispatch already emitted [`AgentEvent::ToolStarted`]. This emits only\n/// [`AgentEvent::ToolCompleted`] so the nested answer cannot be appended.\npub(crate) fn discard_running_call(env: &TurnEnv<'_>, call: &ToolCall) -> SharedMessage {\n    let call_id = CallId::from(call.id.as_str());\n    completed_error(\n        env,\n        &call_id,\n        call,\n        \"tool call was aborted and its result was discarded\".into(),\n    )\n}\n\nfn unexecuted_call(env: &TurnEnv<'_>, call: &ToolCall, reason: String) -> SharedMessage {\n    let call_id = CallId::from(call.id.as_str());\n    emit(\n        env,\n        AgentEvent::ToolStarted {\n            call_id: call_id.clone(),\n            name: call.name.clone(),\n            target: call.target(),\n        },\n    );\n    completed_error(env, &call_id, call, reason)\n}\n\nfn canonical_tool_name(name: &str) -> &str {\n    match name {\n        \"ask\" => \"ask_user\",\n        other => other,\n    }\n}\n\n/// Run one registered, schema-valid tool call and return the resulting\n/// [`ToolResultMessage`].\n///\n/// Lookup, search/file capability binding, argument validation,\n/// cancellation, and tool errors are lifecycle failures: they\n/// return **as an `is_error` tool result** so the loop continues and the\n/// model can react. See `wiki/index.html`. Nothing here waits for a\n/// Core permission prompt. Turns do not snapshot files before a tool runs.\n///\n/// Tools that declare `search_access` / `file_access` resolve the final\n/// arguments once on a cancellable worker; the retained capability is passed\n/// to execution and never re-resolved. Same-name plugin overrides remain\n/// unbound unless they explicitly declare a search or file access mode.\n/// The result returns in the same poll that emits\n/// [`AgentEvent::ToolCompleted`], so a caller can record it before a cancel\n/// stops polling.\npub(crate) async fn run_tool_call(\n    env: &TurnEnv<'_>,\n    token: &CancellationToken,\n    call: &ToolCall,\n) -> SharedMessage {\n    let call_id = CallId::from(call.id.as_str());\n    emit(\n        env,\n        AgentEvent::ToolStarted {\n            call_id: call_id.clone(),\n            name: call.name.clone(),\n            target: call.target(),\n        },\n    );\n\n    let tool_name = canonical_tool_name(&call.name);\n    let Some(tool) = env.tools.get(tool_name) else {\n        // Naming the real tools lets the model correct a guessed name in\n        // one retry instead of guessing again.\n        const LISTED: usize = 40;\n        let names = env.tools.names();\n        let mut available = names\n            .iter()\n            .take(LISTED)\n            .map(String::as_str)\n            .collect::<Vec<_>>()\n            .join(\", \");\n        if names.len() > LISTED {\n            available.push_str(&format!(\", and {} more\", names.len() - LISTED));\n        }\n        return completed_error(\n            env,\n            &call_id,\n            call,\n            format!(\"unknown tool: {}; available tools: {available}\", call.name),\n        );\n    };\n\n    let args = call.arguments.clone();\n    // Preflight binds the search/file capability the tool declares, if any.\n    let ctx = match prepare_tool_ctx(\n        &env.cwd,\n        &env.extra_roots,\n        &env.read_roots,\n        token.clone(),\n        call.id.clone(),\n        tool.as_ref(),\n        &args,\n    )\n    .await\n    {\n        Ok(ctx) => ctx,\n        Err(message) => return completed_error(env, &call_id, call, message),\n    };\n    let (mut producer, mut consumer) = ToolStream::channel();\n    let mut terminal_pusher = Some(producer.clone());\n    let execute =\n        CatchUnwind::new(async move { tool.execute_dyn(args, &ctx, &mut producer).await });\n    tokio::pin!(execute);\n\n    // Structured select: progress is consumed live, and dropping this\n    // future drops `execute` instead of detaching a spawned task. A ready\n    // execution is polled first so a clone that continuously sends progress\n    // cannot starve the dispatcher's terminal claim. The stream's shared\n    // state then stops new progress while channel FIFO preserves progress\n    // already queued before the terminal. Poll panics and completion-path\n    // Drop panics become owned-string Err values. Poll-panic cleanup\n    // preserves its first error and discards a later destructor error;\n    // cancel/abort Drop likewise discards destructor errors. Unknown panic\n    // payloads are forgotten at the catch boundary so their Drop cannot\n    // unwind the prompt.\n    let mut exec_result = None;\n    let mut streamed_terminal = None;\n    loop {\n        tokio::select! {\n            biased;\n            result = &mut execute, if exec_result.is_none() => {\n                let result = match result {\n                    Ok(Ok(value)) => value,\n                    Ok(Err(err)) => ToolResult::error(err.to_string()),\n                    Err(message) => panic_tool_result(message),\n                };\n                if let Some(pusher) = terminal_pusher.take() {\n                    let _ = pusher.terminal(result.clone());\n                }\n                exec_result = Some(result);\n            }\n            item = consumer.recv() => {\n                match item {\n                    Some(ToolStreamItem::Progress(progress)) => emit(\n                        env,\n                        AgentEvent::ToolProgress {\n                            call_id: call_id.clone(),\n                            message: progress.message,\n                        },\n                    ),\n                    Some(ToolStreamItem::Terminal(result)) => streamed_terminal = Some(result),\n                    None => break,\n                }\n            }\n        }\n    }\n    let result = streamed_terminal\n        .or(exec_result)\n        .unwrap_or_else(|| ToolResult::error(\"tool task ended without a result\".to_owned()));\n\n    let message = Arc::new(Message::ToolResult(ToolResultMessage {\n        tool_call_id: call.id.clone(),\n        content: result.content,\n        is_error: result.is_error,\n        details: result.details,\n    }));\n    emit(\n        env,\n        AgentEvent::ToolCompleted {\n            call_id,\n            result: Arc::clone(&message),\n        },\n    );\n    message\n}\n\n/// Synthesize an `is_error` tool result, emit its `ToolCompleted` event,\n/// and return it for the loop to write back into the context.\nfn completed_error(\n    env: &TurnEnv<'_>,\n    call_id: &CallId,\n    call: &ToolCall,\n    reason: String,\n) -> SharedMessage {\n    let message = Arc::new(Message::ToolResult(ToolResultMessage {\n        tool_call_id: call.id.clone(),\n        content: vec![ContentBlock::Text(reason.into())],\n        is_error: true,\n        details: None,\n    }));\n    emit(\n        env,\n        AgentEvent::ToolCompleted {\n            call_id: call_id.clone(),\n            result: Arc::clone(&message),\n        },\n    );\n    message\n}\n\nfn panic_tool_result(message: String) -> ToolResult {\n    ToolResult::error(ToolError::PluginTrap(message).to_string())\n}\n\n/// Generic message used when the payload is not a `String` or `&str`.\n///\n/// Unknown payloads are forgotten rather than dropped, so this string is\n/// the only text an unknown/non-string `panic_any` payload can force onto\n/// the model.\nconst TOOL_PANIC_MESSAGE: &str = \"tool panicked\";\n\n/// Copies a panic payload into an owned message at the catch boundary.\n///\n/// `String` and `&str` are safe to drop after the copy. Every other\n/// payload is forgotten: a tool can `panic_any` a type whose `Drop`\n/// panics, and dropping that box outside `catch_unwind` would unwind\n/// the prompt task.\nfn owned_panic_message(payload: Box<dyn Any + Send>) -> String {\n    let payload = match payload.downcast::<String>() {\n        Ok(text) => return *text,\n        Err(payload) => payload,\n    };\n    let payload = match payload.downcast::<&str>() {\n        Ok(text) => return (*text).to_owned(),\n        Err(payload) => payload,\n    };\n    std::mem::forget(payload);\n    TOOL_PANIC_MESSAGE.to_owned()\n}\n\n/// Runs `f` under `catch_unwind` and never lets a raw panic payload escape.\nfn catch_unwind_message<R>(f: impl FnOnce() -> R) -> Result<R, String> {\n    match std::panic::catch_unwind(AssertUnwindSafe(f)) {\n        Ok(value) => Ok(value),\n        Err(payload) => Err(owned_panic_message(payload)),\n    }\n}\n\n/// Catches panics from a pinned tool future without detaching it.\n///\n/// The inner future lives in `Pin<Box<F>>` so poll and drop never move a\n/// `!Unpin` future after it is pinned. `poll` and every `inner` destructor\n/// run inside `catch_unwind`. Caught payloads are reduced to an owned\n/// `String` before leaving the catch boundary; unknown payloads are\n/// forgotten so a panicking `Drop` cannot unwind the prompt task. A\n/// destructor panic after `Poll::Ready` is returned as `Err`. After a poll\n/// panic, cleanup preserves that first error and discards a later destructor\n/// panic; the wrapper's `Drop` (cancel/abort) also discards a destructor\n/// panic so it cannot unwind the prompt task.\nstruct CatchUnwind<F> {\n    inner: Option<Pin<Box<F>>>,\n}\n\nimpl<F> CatchUnwind<F> {\n    fn new(inner: F) -> Self {\n        Self {\n            inner: Some(Box::pin(inner)),\n        }\n    }\n\n    /// Drops `F` at its pinned heap address. Moving `Pin<Box<F>>` moves the\n    /// pointer, not `F`. The result is an owned message, never a raw payload.\n    fn drop_inner(inner: Pin<Box<F>>) -> Result<(), String> {\n        catch_unwind_message(move || drop(inner))\n    }\n}\n\nimpl<F> Drop for CatchUnwind<F> {\n    fn drop(&mut self) {\n        if let Some(inner) = self.inner.take() {\n            // The result is already an owned `String`; dropping it is safe.\n            drop(Self::drop_inner(inner));\n        }\n    }\n}\n\nimpl<F: Future> Future for CatchUnwind<F> {\n    type Output = Result<F::Output, String>;\n\n    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n        // `Pin<Box<F>>` is always `Unpin`, so the wrapper is `Unpin`.\n        let this = self.get_mut();\n        let Some(inner) = this.inner.as_mut() else {\n            return Poll::Ready(Err(TOOL_PANIC_MESSAGE.to_owned()));\n        };\n        match catch_unwind_message(|| inner.as_mut().poll(cx)) {\n            Ok(Poll::Pending) => Poll::Pending,\n            Ok(Poll::Ready(output)) => match this.inner.take() {\n                Some(inner) => match Self::drop_inner(inner) {\n                    Ok(()) => Poll::Ready(Ok(output)),\n                    Err(message) => Poll::Ready(Err(message)),\n                },\n                None => Poll::Ready(Ok(output)),\n            },\n            Err(message) => {\n                if let Some(inner) = this.inner.take() {\n                    drop(Self::drop_inner(inner));\n                }\n                Poll::Ready(Err(message))\n            }\n        }\n    }\n}\n"}</script>
<script>
"use strict";
const GRAPH = JSON.parse(document.getElementById("graph-data").textContent);
const FILES = JSON.parse(document.getElementById("file-data").textContent);
const NODES = GRAPH.nodes;
const LANES = GRAPH.lanes;
const NS = "http://www.w3.org/2000/svg";
const REPO = "https://github.com/MCapricorns/mycode";

const byId = new Map(NODES.map((node) => [node.id, node]));
let selectedId = null;
let currentFile = null;
const nodeNames = new Map();
NODES.forEach((node) => {
  (node.files || []).forEach((file) => {
    if (!nodeNames.has(file)) nodeNames.set(file, []);
    nodeNames.get(file).push(node);
  });
});

/* ── 图 ───────────────────────────────────────────────────────── */
const SLOT = 200;
const ROW_H = 74;
const NODE_H = 40;
const LABEL_W = 96;
const MARGIN_X = 24;
const MARGIN_Y = 26;
const ROW_TOP = 24;
const NODE_MIN_W = 120;
const NODE_MAX_W = 188;

const layer = document.getElementById("layer");
const map = document.getElementById("map");
const detail = document.getElementById("detail");

function nodeWidth(label) {
  return Math.max(NODE_MIN_W, Math.min(NODE_MAX_W, Math.round(label.length * 7.2 + 44)));
}
// 每一层是一行：左边层名，右边该层的节点从左到右排开。
const rowCounts = LANES.map((_, lane) => NODES.filter((node) => node.lane === lane).length);
const columns = Math.max(...rowCounts, 1);
const graphW = MARGIN_X * 2 + LABEL_W + SLOT * columns;
const graphH = MARGIN_Y * 2 + ROW_TOP + ROW_H * LANES.length;

const pos = new Map();
NODES.forEach((node) => {
  const peers = NODES.filter((other) => other.lane === node.lane);
  const index = peers.indexOf(node);
  const w = nodeWidth(node.label);
  pos.set(node.id, {
    w,
    x: MARGIN_X + LABEL_W + SLOT * index + SLOT / 2,
    y: MARGIN_Y + ROW_TOP + node.lane * ROW_H,
  });
});

const svg = document.createElementNS(NS, "svg");
svg.setAttribute("width", graphW);
svg.setAttribute("height", graphH);
svg.setAttribute("viewBox", "0 0 " + graphW + " " + graphH);

LANES.forEach((label, lane) => {
  const top = MARGIN_Y + ROW_TOP + lane * ROW_H;
  const band = document.createElementNS(NS, "rect");
  band.setAttribute("class", "lane-band" + (lane % 2 ? " alt" : ""));
  band.setAttribute("x", MARGIN_X - 6);
  band.setAttribute("y", top - 12);
  band.setAttribute("width", graphW - MARGIN_X * 2 + 12);
  band.setAttribute("height", ROW_H - 10);
  band.setAttribute("rx", 12);
  svg.appendChild(band);

  const text = document.createElementNS(NS, "text");
  text.setAttribute("class", "lane-label");
  text.setAttribute("x", MARGIN_X + 4);
  text.setAttribute("y", top + NODE_H / 2 + 4);
  text.textContent = label;
  svg.appendChild(text);
});

const edgeLayer = document.createElementNS(NS, "g");
const nodeLayer = document.createElementNS(NS, "g");
svg.appendChild(edgeLayer);
svg.appendChild(nodeLayer);

const edges = [];
NODES.forEach((node) => {
  (node.links || []).forEach((target) => {
    const to = byId.get(target);
    if (!to) return;
    const from = pos.get(node.id);
    const dest = pos.get(target);
    const down = dest.y > from.y;
    const sx = from.x;
    const ex = dest.x;
    const sy = from.y + (down ? NODE_H : 0);
    const ey = dest.y + (down ? 0 : NODE_H);
    const bend = Math.min(70, Math.max(22, Math.abs(ey - sy) / 3.4));
    const dir = down ? 1 : -1;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("class", "edge" + (down ? "" : " back"));
    path.setAttribute("marker-end", "url(#arrow)");
    path.setAttribute(
      "d",
      "M" + sx + "," + sy +
      " C" + sx + "," + (sy + dir * bend) +
      " " + ex + "," + (ey - dir * bend) +
      " " + ex + "," + ey
    );
    edgeLayer.appendChild(path);
    edges.push({ from: node.id, to: target, path });
  });
});

const nodeEls = new Map();
NODES.forEach((node) => {
  const { x, y, w } = pos.get(node.id);
  const group = document.createElementNS(NS, "g");
  group.setAttribute("class", "node " + node.group);
  group.setAttribute("transform", "translate(" + (x - w / 2) + "," + y + ")");
  group.setAttribute("tabindex", "0");
  group.setAttribute("role", "button");
  group.setAttribute("aria-label", node.label);
  group.dataset.id = node.id;

  const box = document.createElementNS(NS, "rect");
  box.setAttribute("width", w);
  box.setAttribute("height", NODE_H);
  group.appendChild(box);

  const dot = document.createElementNS(NS, "circle");
  dot.setAttribute("class", "dot");
  dot.setAttribute("cx", 17);
  dot.setAttribute("cy", NODE_H / 2);
  dot.setAttribute("r", 3.4);
  group.appendChild(dot);

  const label = document.createElementNS(NS, "text");
  label.setAttribute("x", 30);
  label.setAttribute("y", NODE_H / 2 + 5);
  label.textContent = node.label;
  group.appendChild(label);

  group.addEventListener("click", () => select(node.id));
  group.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      select(node.id);
    }
  });
  nodeLayer.appendChild(group);
  nodeEls.set(node.id, group);
});

/* ── 缩放 ─────────────────────────────────────────────────────── */
let zoom = 1;
let manualZoom = false;
function applyZoom(next) {
  zoom = Math.max(0.55, Math.min(1.6, next));
  layer.style.transform = "scale(" + zoom + ")";
  layer.style.width = graphW * zoom + "px";
  layer.style.height = graphH * zoom + "px";
}
function fitZoom() {
  const wide = (map.clientWidth - 40) / graphW;
  const tall = (map.clientHeight - 40) / graphH;
  manualZoom = false;
  applyZoom(Math.min(1, wide, tall));
}
document.getElementById("zoomIn").addEventListener("click", () => { manualZoom = true; applyZoom(zoom + 0.1); });
document.getElementById("zoomOut").addEventListener("click", () => { manualZoom = true; applyZoom(zoom - 0.1); });
document.getElementById("zoomFit").addEventListener("click", fitZoom);
window.addEventListener("resize", () => { if (!manualZoom) fitZoom(); });

/* ── 详情 ─────────────────────────────────────────────────────── */
const GROUP_LABELS = { crate: "crate", module: "模块", flow: "流程", data: "数据" };

function fileLineCount(path) {
  const text = FILES[path];
  if (!text) return 0;
  return text.replace(/\n$/, "").split("\n").length;
}

function select(id, options) {
  const node = byId.get(id);
  if (!node) return;
  const neighbors = new Set([id, ...(node.links || [])]);
  NODES.forEach((other) => {
    if ((other.links || []).includes(id)) neighbors.add(other.id);
  });
  edges.forEach((edge) => edge.path.classList.toggle("hot", edge.from === id || edge.to === id));
  nodeEls.forEach((element, otherId) => {
    element.classList.toggle("active", otherId === id);
    element.classList.toggle("hot", neighbors.has(otherId) && otherId !== id);
    element.classList.toggle("dim", !neighbors.has(otherId));
  });

  const files = (node.files || []).map((path) => {
    const slash = path.lastIndexOf("/");
    const dir = slash < 0 ? "" : path.slice(0, slash + 1);
    const name = path.slice(slash + 1);
    return '<button type="button" class="file" data-file="' + path + '">' +
      '<span class="name">' + name + '</span>' +
      '<span class="dir">' + dir + '</span>' +
      '<span class="lines">' + fileLineCount(path) + ' 行</span>' +
      '</button>';
  }).join("");
  const related = (node.links || [])
    .filter((target) => byId.has(target))
    .map((target) => '<button type="button" data-jump="' + target + '">' + byId.get(target).label + '</button>')
    .join("");

  detail.innerHTML =
    '<span class="chip ' + node.group + '">' + (GROUP_LABELS[node.group] || node.group) + "</span>" +
    "<h2>" + node.label + "</h2>" +
    '<p class="summary">' + node.summary + "</p>" +
    (files ? '<div class="section"><h3>源码</h3>' + files + "</div>" : "") +
    (related ? '<div class="section"><h3>关联</h3><div class="related">' + related + "</div></div>" : "");
  detail.querySelectorAll("[data-file]").forEach((button) => {
    button.addEventListener("click", () => openCode(button.dataset.file));
  });
  detail.querySelectorAll("[data-jump]").forEach((button) => {
    button.addEventListener("click", () => select(button.dataset.jump));
  });
  if (!options || !options.quiet) detail.scrollTop = 0;
  selectedId = id;
  updateHash();
}

function clearSelection() {
  nodeEls.forEach((element) => element.classList.remove("active", "hot", "dim"));
  edges.forEach((edge) => edge.path.classList.remove("hot"));
  detail.innerHTML = '<p class="empty">选一个节点。</p>';
  selectedId = null;
  updateHash();
}

/* ── 源码 ─────────────────────────────────────────────────────── */
const codeView = document.getElementById("codeView");
const codeBody = document.getElementById("codeBody");
const codeGutter = document.getElementById("codeGutter");
const codePath = document.getElementById("codePath");
const codeMeta = document.getElementById("codeMeta");
const codeGithub = document.getElementById("codeGithub");

const KEYWORDS = /^(as|async|await|break|const|continue|crate|dyn|else|enum|extern|false|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|true|type|unsafe|use|where|while)\b/;

function highlight(text) {
  // 只区分注释、字符串、关键字、类型和数字：够看，不会错位。
  const lines = [];
  let line = [];
  let i = 0;
  const push = (cls, chunk) => {
    const parts = chunk.split("\n");
    parts.forEach((part, index) => {
      if (index > 0) {
        lines.push(line);
        line = [];
      }
      if (part) {
        const span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = part;
        line.push(span);
      }
    });
  };
  while (i < text.length) {
    if (text.startsWith("//", i)) {
      const end = text.indexOf("\n", i);
      const stop = end < 0 ? text.length : end;
      push("c", text.slice(i, stop));
      i = stop;
      continue;
    }
    if (text.startsWith("/*", i)) {
      const end = text.indexOf("*/", i + 2);
      const stop = end < 0 ? text.length : end + 2;
      push("c", text.slice(i, stop));
      i = stop;
      continue;
    }
    const char = text[i];
    if (char === '"') {
      let j = i + 1;
      while (j < text.length && text[j] !== '"') j += text[j] === "\\" ? 2 : 1;
      push("s", text.slice(i, Math.min(j + 1, text.length)));
      i = j + 1;
      continue;
    }
    if (char === "#" && line.length === 0 && (text.startsWith("#[", i) || text.startsWith("#![", i))) {
      const end = text.indexOf("]", i);
      const stop = end < 0 ? i + 1 : end + 1;
      push("a", text.slice(i, stop));
      i = stop;
      continue;
    }
    if (/[0-9]/.test(char) && !/[A-Za-z0-9_]/.test(text[i - 1] || "")) {
      let j = i;
      while (j < text.length && /[0-9_xXa-fA-F.]/.test(text[j])) j += 1;
      push("n", text.slice(i, j));
      i = j;
      continue;
    }
    if (/[A-Za-z_]/.test(char)) {
      let j = i;
      while (j < text.length && /[A-Za-z0-9_]/.test(text[j])) j += 1;
      const word = text.slice(i, j);
      if (KEYWORDS.test(word)) push("k", word);
      else if (/^[A-Z]/.test(word)) push("t", word);
      else push(null, word);
      i = j;
      continue;
    }
    let j = i;
    while (j < text.length && !/[A-Za-z0-9_"#\/]/.test(text[j])) j += 1;
    if (j === i) j += 1;
    push(null, text.slice(i, j));
    i = j;
  }
  lines.push(line);
  if (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
  return lines;
}

function openCode(path, line) {
  const text = FILES[path];
  if (!text) return;
  currentFile = path;
  const slash = path.lastIndexOf("/");
  codePath.innerHTML = '<span class="dir">' + path.slice(0, slash + 1) + "</span>" + path.slice(slash + 1);
  const lines = highlight(text);
  const frag = document.createDocumentFragment();
  const gut = document.createDocumentFragment();
  lines.forEach((spans, index) => {
    const row = document.createElement("div");
    row.className = "ln";
    spans.forEach((span) => row.appendChild(span));
    frag.appendChild(row);
    const number = document.createElement("div");
    number.textContent = index + 1;
    gut.appendChild(number);
  });
  codeBody.replaceChildren(frag);
  codeGutter.replaceChildren(gut);
  codeMeta.textContent = lines.length + " 行";
  codeGithub.href = REPO + "/blob/main/" + path + (line ? "#L" + line : "");
  codeView.hidden = false;
  document.getElementById("codeCopy").textContent = "复制";
  const scroll = codeView.querySelector(".scroll");
  scroll.scrollTop = line ? Math.max(0, (line - 1) * 20 - 120) : 0;
  scroll.scrollLeft = 0;
  document.getElementById("codeClose").focus();
  updateHash();
}

function closeCode() {
  codeView.hidden = true;
  currentFile = null;
  updateHash();
}

document.getElementById("codeClose").addEventListener("click", closeCode);
codeView.addEventListener("click", (event) => { if (event.target === codeView) closeCode(); });
document.getElementById("codeCopy").addEventListener("click", async () => {
  const text = FILES[currentFile];
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  document.getElementById("codeCopy").textContent = "已复制";
});

/* ── 搜索与地址 ───────────────────────────────────────────────── */
const search = document.getElementById("search");

function filter(term) {
  const needle = term.trim().toLowerCase();
  if (!needle) {
    clearSelection();
    return;
  }
  nodeEls.forEach((element, id) => {
    const node = byId.get(id);
    const haystack = (node.label + " " + node.summary + " " + (node.files || []).join(" ")).toLowerCase();
    element.classList.toggle("dim", !haystack.includes(needle));
    element.classList.remove("hot", "active");
  });
}

search.addEventListener("input", (event) => filter(event.target.value));

function updateHash() {
  const parts = [];
  if (selectedId) parts.push("n=" + encodeURIComponent(selectedId));
  if (currentFile) parts.push("f=" + encodeURIComponent(currentFile));
  const next = parts.length ? "#" + parts.join("&") : "#";
  if (location.hash !== next) history.replaceState(null, "", next);
}

function readHash() {
  const raw = location.hash.replace(/^#/, "");
  const params = new URLSearchParams(raw);
  const id = params.get("n");
  const file = params.get("f");
  if (id && byId.has(id)) select(id);
  if (file && FILES[file]) openCode(file);
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (!codeView.hidden) closeCode();
    else clearSelection();
    return;
  }
  if (event.key === "/" && document.activeElement !== search) {
    event.preventDefault();
    search.focus();
    search.select();
  }
});

/* ── 启动 ─────────────────────────────────────────────────────── */
document.getElementById("foot").textContent =
  LANES.length + " 层 · " + NODES.length + " 个节点 · " + Object.keys(FILES).length +
  " 个源文件 · 依赖方向自上而下：界面 → 前端 → 应用核 → 代理 / 模型 / 工具 → 核心与配置";

layer.appendChild(svg);
applyZoom(1);
fitZoom();
readHash();
if (!selectedId) select("app");
</script>
