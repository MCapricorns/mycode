t request wins, worktree is refused for\n/// read-only roles.\n#[must_use]\npub(crate) fn resolve_isolation(role: &SubagentRole, requested: Option<&str>) -> RoleIsolation {\n    let chosen = requested\n        .and_then(RoleIsolation::parse)\n        .unwrap_or(role.isolation);\n    if chosen == RoleIsolation::Worktree && !role.is_write_capable() {\n        RoleIsolation::Shared\n    } else {\n        chosen\n    }\n}\n\nimpl mycode_agent::builtin::AgentHost for BridgeAgentHost {\n    fn run_subagent<'a>(\n        &'a self,\n        request: mycode_agent::builtin::SubagentRequest,\n        progress: &'a mycode_agent::ToolStream,\n        cancel: &'a CancellationToken,\n        call_id: &'a str,\n    ) -> Pin<Box<dyn Future<Output = Result<String, mycode_agent::ToolError>> + Send + 'a>> {\n        Box::pin(async move {\n            let fail = |message: String| mycode_agent::ToolError::Execution(message);\n            let role = {\n                let home = self.home.clone();\n                let cwd = self.cwd.clone();\n                let agent = request.agent.clone();\n                tokio::task::spawn_blocking(move || {\n                    let catalog = discover_roles(&home, Some(&cwd));\n                    catalog.role(&agent).cloned().ok_or_else(|| {\n                        format!(\n                            \"unknown role '{agent}'; available: {}\",\n                            catalog.names().join(\", \")\n                        )\n                    })\n                })\n                .await\n                .map_err(|error| fail(format!(\"role discovery task: {error}\")))?\n                .map_err(fail)?\n            };\n            if !self.settings.subagents.is_enabled(&role.name) {\n                return Err(fail(format!(\n                    \"role '{}' is disabled in settings\",\n                    role.name\n                )));\n            }\n            let isolation = resolve_isolation(&role, request.isolation.as_deref());\n            // A parent interrupt stops the child. Leaving it running held the\n            // turn open, so Stop, send, and the window close never came back.\n            // The token is published before the run queues for a slot, so\n            // the card's stop button also reaches a run that is still waiting.\n            let child_cancel = cancel.child_token();\n            let _registration = ChildCancelRegistration::new(\n                &self.cancels,\n                &self.session_id,\n                call_id,\n                &child_cancel,\n            );\n            let _ = progress.progress(agent_progress(&role.name, \"queued\", &request.description));\n            let _ = progress.progress(agent_progress(&role.name, \"prompt\", &request.prompt));\n            // `try_acquire` is the cap check: a waiter is past the limit.\n            // Only an artisan raises the user-facing warning; scouts still wait.\n            let permit = match self.slots.try_acquire() {\n                Ok(permit) => permit,\n                Err(tokio::sync::TryAcquireError::Closed) => {\n                    return Err(fail(\"agent slots closed\".to_owned()));\n                }\n                Err(tokio::sync::TryAcquireError::NoPermits) => {\n                    if let Some(detail) =\n                        artisan_cap_detail(&role.name, 0, mycode_agent::SUBAGENT_CONCURRENCY)\n                    {\n                        let _ = progress.progress(agent_progress(&role.name, \"capped\", &detail));\n                    }\n                    tokio::select! {\n                        permit = self.slots.acquire() => {\n                            permit.map_err(|_| fail(\"agent slots closed\".to_owned()))?\n                        }\n                        () = child_cancel.cancelled() => {\n                            return Err(fail(format!(\"subagent {} cancelled\", role.name)));\n                        }\n                    }\n                }\n            };\n            let mut lease = LeaseGuard(if isolation == RoleIsolation::Worktree {\n                let home = self.home.clone();\n                let cwd = self.cwd.clone();\n                match tokio::task::spawn_blocking(move || WorktreeLease::acquire(&home, &cwd)).await\n                {\n                    Ok(Ok(lease)) => Some(lease),\n                    Ok(Err(message)) => return Err(fail(message)),\n                    Err(error) => return Err(fail(format!(\"worktree task failed: {error}\"))),\n                }\n            } else {\n                None\n            });\n            let result = self\n                .drive_subagent(\n                    &request,\n                    &role,\n                    progress,\n                    cancel,\n                    &child_cancel,\n                    lease.path(),\n                )\n                .await;\n            let result = if let Some(lease) = lease.0.take() {\n                match tokio::task::spawn_blocking(move || handoff_worktree(lease, result)).await {\n                    Ok(outcome) => outcome,\n                    Err(error) => Err(fail(format!(\"worktree handoff failed: {error}\"))),\n                }\n            } else {\n                result\n            };\n            drop(permit);\n            result\n        })\n    }\n}\n\nimpl BridgeAgentHost {\n    /// Runs the nested agent until it answers or is cancelled.\n    ///\n    /// There is no wall-clock limit. The run ends when the parent turn is\n    /// cancelled, when the user stops this subagent, or when the\n    /// conversation is deleted; each of those fires `cancel` or\n    /// `child_cancel`, which cancels the child token and aborts the task.\n    async fn drive_subagent(\n        &self,\n        request: &mycode_agent::builtin::SubagentRequest,\n        role: &SubagentRole,\n        progress: &mycode_agent::ToolStream,\n        cancel: &CancellationToken,\n        child_cancel: &CancellationToken,\n        worktree: Option<&Path>,\n    ) -> Result<String, mycode_agent::ToolError> {\n        let fail = |message: String| mycode_agent::ToolError::Execution(message);\n        let cancelled = || fail(format!(\"subagent {} cancelled\", role.name));\n        let run_dir = worktree.map_or_else(|| self.cwd.clone(), Path::to_path_buf);\n        let resolved = self.resolve_route(&role.name).await.map_err(fail)?;\n        if child_cancel.is_cancelled() {\n            return Err(cancelled());\n        }\n        let transport = ReqwestTransport::new()\n            .map_err(|error| fail(format!(\"HTTP transport unavailable: {error}\")))?;\n        let wire = WireProvider::new(resolved, Arc::new(transport));\n        let allowed = role.resolve_tools(PARENT_TOOL_NAMES);\n        // Stdio servers are spawned kill-on-drop, so a stop may abandon a\n        // slow handshake.\n        let (mcp_tools, mcp_warning) = tokio::select! {\n            biased;\n            () = child_cancel.cancelled() => return Err(cancelled()),\n            connected = crate::mcp_tools::connect_mcp_tools(\n                &self.home,\n                &self.settings,\n                &self.mcp_pool,\n                Some(&self.cwd),\n            ) => connected,\n        };\n        let mcp_tools = if role.is_write_capable() {\n            mcp_tools\n        } else {\n            mcp_tools\n                .into_iter()\n                .filter(|tool| tool.read_only())\n                .collect()\n        };\n        let shell = mycode_agent::resolved_shell();\n        let registry =\n            child_registry_with(&allowed, mycode_agent::ShellTool::forcing(shell.clone()));\n        let mcp_note = crate::mcp_tools::register_mcp_tools(&registry, mcp_tools, mcp_warning)\n            .map(|catalog| child_mcp_note(&catalog.prompt_note(), role.is_write_capable()));\n        let registry = Arc::new(registry);\n        // The same compaction the parent turn runs, on this child's history\n        // only: no checkpoint slot, so the parent's file is never touched.\n        let (child_model, context_window) = self.child_window(&role.name);\n        let compactor = crate::compaction::RequestCompactor {\n            wire: wire.clone(),\n            model: child_model,\n            checkpoint: None,\n            context_window,\n            calibration: crate::compaction::Calibration::default(),\n            on_summarize: None,\n            cancel: child_cancel.clone(),\n        };\n        let compact_request = {\n            let progress = progress.clone();\n            let role_name = role.name.clone();\n            move |mode: crate::compaction::CompactMode| {\n                let compactor = compactor.clone();\n                let progress = progress.clone();\n                let role_name = role_name.clone();\n                move |mut request: mycode_agent::Request| {\n                    let compactor = compactor.clone();\n                    let progress = progress.clone();\n                    let role_name = role_name.clone();\n                    async move {\n                        let summarized = compactor.compact(&mut request, mode).await.is_some();\n                        if summarized {\n                            let _ = progress.progress(agent_progress(\n                                &role_name,\n                                \"step\",\n                                mycode_agent::builtin::AGENT_COMPACTED_STEP,\n                            ));\n                        }\n                        (request, summarized)\n                    }\n                }\n            }\n        };\n        let before_request = compact_request(crate::compaction::CompactMode::Auto);\n        let on_overflow = compact_request(crate::compaction::CompactMode::Overflow);\n        let hooks = HookRunner::default()\n            .with_before_request(move |request| {\n                let compacted = before_request(request);\n                async move { compacted.await.0 }\n            })\n            .with_context_overflow(move |request| {\n                let compacted = on_overflow(request);\n                async move {\n                    let (request, summarized) = compacted.await;\n                    summarized.then_some(request)\n                }\n            });\n\n        let run_cancel = child_cancel.clone();\n        let (event_tx, mut event_rx) = tokio::sync::broadcast::channel(64);\n        let role_name = role.name.clone();\n        let progress_sink = progress.clone();\n        let forwarder = tokio::spawn(async move {\n            loop {\n                let event = match event_rx.recv().await {\n                    Ok(event) => event,\n                    // A child streams every token on this bus; a burst that\n                    // outruns the buffer skips lines, it must not end the\n                    // progress feed for the rest of the run.\n                    Err(tokio::sync::broadcast::error::RecvError::Lagged(_)) => continue,\n                    Err(tokio::sync::broadcast::error::RecvError::Closed) => break,\n                };\n                match event {\n                    mycode_agent::events::AgentEvent::ToolStarted { name, target, .. } => {\n                        let label = mycode_agent::tool_label(&name, &target);\n                        let _ = progress_sink.progress(agent_progress(&role_name, \"tool\", &label));\n                    }\n                    mycode_agent::events::AgentEvent::ToolProgress { message, .. } => {\n                        let _ =\n                            progress_sink.progress(agent_progress(&role_name, \"step\", &message));\n                    }\n                    _ => {}\n                }\n            }\n        });\n\n        let path = run_dir.display().to_string();\n        let _ = progress.progress(agent_progress(&role.name, \"path\", &path));\n        // The `queued`/`prompt` pair at dispatch is one-shot: a frontend\n        // that was mid-reopen or mid-switch then never saw the goal or the\n        // brief, and nothing else re-sends them. `goal`/`task` re-arm the\n        // same fields without touching the step log.\n        let _ = progress.progress(agent_progress(&role.name, \"goal\", &request.description));\n        let _ = progress.progress(agent_progress(&role.name, \"task\", &request.prompt));\n        let (extra_roots, system) = {\n            let has_worktree = worktree.is_some();\n            let home = self.home.clone();\n            let cwd = self.cwd.clone();\n            let role = role.clone();\n            let registry = Arc::clone(&registry);\n            let run_dir = run_dir.clone();\n            let shell = shell.clone();\n            let skills = self.settings.skills.clone();\n            tokio::task::spawn_blocking(move || {\n                let mut extra_roots = if has_worktree {\n                    Vec::new()\n                } else {\n                    crate::turn::workspace_extra_roots(&home, &cwd)\n                };\n                extra_roots.sort();\n                // The session workspace's instruction files, as the parent\n                // reads them: a worktree lacks the user's uncommitted edits.\n                let workspace = ChildWorkspace {\n                    resources: mycode_agent::render_resource_prompt(\n                        &mycode_agent::discover_resources(&home, &cwd),\n                    ),\n                    mcp_note,\n                    skills,\n                    mycode_home: Some(home.root().to_path_buf()),\n                };\n                let system = subagent_system_prompt(\n                    &role,\n                    &registry,\n                    &run_dir,\n                    &extra_roots,\n                    std::env::consts::OS,\n                    std::env::consts::ARCH,\n                    &shell,\n                    &workspace,\n                );\n                (extra_roots, system)\n            })\n            .await\n            .map_err(|error| fail(format!(\"subagent prompt task: {error}\")))?\n        };\n        let read_roots = mycode_agent::skill_read_roots(\n            crate::turn::os_user_home().as_deref(),\n            Some(self.home.root()),\n        );\n        let mut config = AgentConfig::new()\n            .with_system_prompt(system)\n            .with_prompt_cache_key(Some(self.session_id.clone()));\n        if let Some(token) = thinking_for(role, &self.settings.subagents).effort() {\n            if let Some(level) = mycode_agent::ReasoningLevel::parse(token) {\n                config = config.with_reasoning(level);\n            } else {\n                config = config.with_reasoning_token(Some(token.to_owned()));\n            }\n        }\n        let mut agent = Agent::new(config);\n        let prompt = Message::User(mycode_agent::UserMessage::text(request.prompt.clone()));\n        let role_label = role.name.clone();\n        let mut run = tokio::spawn(async move {\n            let env = mycode_agent::TurnEnv::new(&wire, &registry, &hooks)\n                .with_cancel(run_cancel)\n                .with_events(event_tx)\n                .with_cwd(run_dir)\n                .with_extra_roots(extra_roots)\n                .with_read_roots(read_roots);\n            let outcome = agent.prompt(prompt, &env).await;\n            forwarder.abort();\n            subagent_answer(outcome, agent.state().messages(), &role_label)\n        });\n        // Also covers this future being dropped mid-await by a parent cancel.\n        let _stop_run = AbortOnDrop {\n            cancel: child_cancel.clone(),\n            task: run.abort_handle(),\n        };\n        match finish_subagent_task(&mut run, cancel, child_cancel).await {\n            SubagentFinish::Cancelled => {\n                run.abort();\n                let _ = (&mut run).await;\n                Err(cancelled())\n            }\n            SubagentFinish::Finished(result) => result,\n        }\n    }\n\n    /// Resolves a per-role model override, or inherits the turn.\n    ///\n    /// A routed role runs on the same magpie gateway and key as the parent.\n    async fn resolve_route(&self, role: &str) -> Result<ResolvedProvider, String> {\n        let Some(entry) = self.settings.subagents.role(role) else {\n            return Ok(self.resolved.clone());\n        };\n        let (Some(provider_id), Some(model)) = (entry.provider.as_deref(), entry.model.as_deref())\n        else {\n            return Ok(self.resolved.clone());\n        };\n        if provider_id != mycode_agent::MAGPIE_PROVIDER_ID {\n            return Err(format!(\n                \"role '{role}' provider '{provider_id}' is not the magpie gateway\"\n            ));\n        }\n        let provider = crate::magpie::provider_row(&self.settings.magpie, &self.catalog_document())\n            .ok_or_else(|| \"magpie is not connected: pick a model in magpie first\".to_owned())?;\n        ResolvedProvider::resolve(\n            &provider,\n            model,\n            &self.settings.magpie.api_key,\n            &crate::user_agent::default_user_agent(),\n        )\n        .map_err(|error| format!(\"role '{role}' provider setup failed: {error}\"))\n    }\n\n    /// The gateway list the parent turn is using, when it was threaded in.\n    fn catalog_document(&self) -> Arc<CatalogDocument> {\n        self.context\n            .as_ref()\n            .and_then(|context| context.catalog.read().ok().map(|guard| Arc::clone(&guard)))\n            .unwrap_or_default()\n    }\n}\n\n/// Reads a finished child run's answer: a completed turn answers with its\n/// last assistant text. An interrupted or aborted run is a tool error —\n/// its partial must never pass for a successful result.\nfn subagent_answer(\n    outcome: Result<mycode_agent::TurnOutcome, mycode_agent::MycodeError>,\n    messages: &[Arc<Message>],\n    role: &str,\n) -> Result<String, mycode_agent::ToolError> {\n    let fail = |message: String| mycode_agent::ToolError::Execution(message);\n    match outcome {\n        Err(error) => return Err(fail(format!(\"subagent failed: {error}\"))),\n        Ok(mycode_agent::TurnOutcome::Aborted) => {\n            return Err(fail(format!(\"subagent {role} cancelled\")));\n        }\n        Ok(mycode_agent::TurnOutcome::Completed) => {}\n    }\n    let answer = messages\n        .iter()\n        .rev()\n        .find_map(|message| match message.as_ref() {\n            Message::Assistant(assistant) => {\n                let text = assistant.text();\n                (!text.trim().is_empty()).then_some((text, assistant.stop_reason))\n            }\n            _ => None,\n        });\n    match answer {\n        Some((text, mycode_agent::StopReason::Error)) => Err(fail(text)),\n        Some((text, _)) => Ok(text),\n        None => Err(fail(\"subagent returned no answer\".to_owned())),\n    }\n}\n\n/// Progress detail when an artisan cannot take a concurrency slot.\n///\n/// Scouts share the semaphore and still wait, without this warning.\n/// `permits_available` is `0` after `try_acquire` reports no permits.\nfn artisan_cap_detail(role: &str, permits_available: usize, cap: u32) -> Option<String> {\n    if role == \"artisan\" && permits_available == 0 {\n        Some(cap.to_string())\n    } else {\n        None\n    }\n}\n\n/// How one nested agent task stopped.\n#[derive(Debug)]\nenum SubagentFinish {\n    /// The parent turn, `CancelSubagent`, or a session delete fired.\n    Cancelled,\n    /// The task returned an answer or a tool error.\n    Finished(Result<String, mycode_agent::ToolError>),\n}\n\n/// Waits for the nested task or a cancel token.\n///\n/// A cancel wins over an answer that becomes ready in the same poll. The\n/// parent's cancel also cancels the child token, so the run cannot keep\n/// editing after the tool result has returned.\nasync fn finish_subagent_task(\n    run: &mut tokio::task::JoinHandle<Result<String, mycode_agent::ToolError>>,\n    cancel: &CancellationToken,\n    child_cancel: &CancellationToken,\n) -> SubagentFinish {\n    tokio::select! {\n        biased;\n        _ = cancel.cancelled() => {\n            child_cancel.cancel();\n            SubagentFinish::Cancelled\n        }\n        _ = child_cancel.cancelled() => SubagentFinish::Cancelled,\n        joined = run => SubagentFinish::Finished(joined.unwrap_or_else(|error| {\n            Err(mycode_agent::ToolError::Execution(format!(\n                \"subagent task failed: {error}\"\n            )))\n        })),\n    }\n}\n\nfn forget_subagent_cancel(\n    cancels: &parking_lot::Mutex<std::collections::HashMap<String, Arc<CancellationToken>>>,\n    call_id: &str,\n    cancel_key: &str,\n    token: &Arc<CancellationToken>,\n) {\n    if !call_id.is_empty() {\n        let mut slots = cancels.lock();\n        if slots\n            .get(cancel_key)\n            .is_some_and(|live| Arc::ptr_eq(live, token))\n        {\n            slots.remove(cancel_key);\n        }\n    }\n}\n\nfn thinking_for(role: &SubagentRole, settings: &SubagentSettings) -> RoleThinking {\n    settings\n        .role(&role.name)\n        .and_then(|entry| entry.thinking.as_deref())\n        .and_then(RoleThinking::parse)\n        .unwrap_or(role.thinking)\n}\n\n/// System prompt for one child run. The shell block and the tool list name\n/// the same interpreter the child can actually call.\n#[allow(clippy::too_many_arguments)]\nfn subagent_system_prompt(\n    role: &SubagentRole,\n    registry: &ToolRegistry,\n    run_dir: &Path,\n    extra_roots: &[PathBuf],\n    os: &str,\n    arch: &str,\n    shell: &mycode_agent::DetectedShell,\n    workspace: &ChildWorkspace,\n) -> String {\n    let mut system = String::from(SUBAGENT_SYSTEM_PROMPT);\n    system.push_str(\"\\n\\n# Role: \");\n    system.push_str(&role.name);\n    system.push_str(\"\\n\\n\");\n    system.push_str(&role.prompt);\n    // The tool list depends only on the role's registry. It goes ahead of\n    // the per-run facts (worktree cwd, folders, skills) so runs of one role\n    // share the longest cached prefix.\n    system.push_str(\"\\n\\n\");\n    system.push_str(&mycode_agent::build_system_prompt(registry));\n    let (workspace_roots, scratch) = crate::turn::split_scratch_root(extra_roots);\n    if !workspace_roots.is_empty() {\n        system.push_str(\"\\n\\nOther workspace folders (absolute paths only):\\n\");\n        for root in &workspace_roots {\n            let _ = writeln!(system, \"- {}\", root.display());\n        }\n        if let Some(shell_tool) = mycode_agent::shell_tool_name(registry) {\n            let _ = write!(\n                system,\n                \"Relative paths stay in this run's cwd. For the other folders, pass an \\\nabsolute path to `read`, `write`, `edit`, `find`, and `grep`, or an absolute \\\npath inside a `{shell_tool}` script (`mode` `script`). `{shell_tool}` starts in this run's cwd.\",\n            );\n        }\n    }\n    crate::turn::push_scratch_note(&mut system, scratch);\n    system.push_str(\"\\n\\n\");\n    if mycode_agent::shell_tool_name(registry).is_some() {\n        system.push_str(\n            \"The environment block names this OS and the one shell tool; write that shell's syntax.\\n\\n\",\n        );\n        system.push_str(&mycode_agent::render_environment_block(\n            os, arch, run_dir, shell,\n        ));\n    } else {\n        system.push_str(\n            \"This role has no shell tool. The environment block names the OS and cwd only.\\n\\n\",\n        );\n        system.push_str(&render_os_block(os, arch, run_dir));\n    }\n    for part in &workspace.resources {\n        system.push_str(\"\\n\\n\");\n        system.push_str(part);\n    }\n    crate::turn::push_workspace_skills(\n        &mut system,\n        run_dir,\n        extra_roots,\n        crate::turn::os_user_home().as_deref(),\n        workspace.mycode_home.as_deref(),\n        &workspace.skills,\n    );\n    if let Some(note) = &workspace.mcp_note {\n        system.push_str(\"\\n\\n<mcp>\\n\");\n        system.push_str(note);\n        system.push_str(\"\\n<\/mcp>\");\n    }\n    system\n}\n\n/// Per-run workspace text a child prompt carries after its fixed parts.\n#[derive(Default)]\nstruct ChildWorkspace {\n    /// Rendered AGENTS.md / MYCODE.md parts of the session workspace.\n    resources: Vec<String>,\n    /// The connected MCP catalog's note, from [`child_mcp_note`].\n    mcp_note: Option<String>,\n    /// Which discovered skills are switched on.\n    skills: mycode_agent::SkillsSettings,\n    /// magpie's Library folder, so its skills are catalogued too.\n    mycode_home: Option<PathBuf>,\n}\n\n/// The parent's MCP note, plus the read-only filter a role without write\n/// tools runs under, so both prompts describe `search_tool` the same way.\nfn child_mcp_note(catalog_note: &str, write_capable: bool) -> String {\n    let mut note = catalog_note.to_owned();\n    note.push_str(\n        \"`search_tool` is a read: emit it in the same response as other independent calls.\",\n    );\n    if !write_capable {\n        note.push_str(\" This role receives only MCP tools that declare readOnlyHint.\");\n    }\n    note\n}\n\nfn render_os_block(os: &str, arch: &str, cwd: &Path) -> String {\n    format!(\n        \"<environment>\\nos: {os} ({arch})\\ncwd: {}\\n<\/environment>\",\n        cwd.display()\n    )\n}\n\nfn child_registry_with(allowed: &[String], shell: mycode_agent::ShellTool) -> ToolRegistry {\n    let registry = ToolRegistry::new();\n    let mut shell = Some(shell);\n    for name in allowed {\n        match name.as_str() {\n            \"read\" => registry.register(Arc::new(mycode_agent::builtin::ReadTool)),\n            \"write\" => registry.register(Arc::new(mycode_agent::builtin::WriteTool)),\n            \"edit\" => registry.register(Arc::new(mycode_agent::builtin::EditTool)),\n            name if name == \"shell\" || mycode_agent::ShellKind::is_tool_name(name) => {\n                if let Some(tool) = shell.take() {\n                    registry.register(Arc::new(tool));\n                }\n            }\n            \"grep\" => registry.register(Arc::new(mycode_agent::builtin::GrepTool)),\n            \"find\" => registry.register(Arc::new(mycode_agent::builtin::FindTool)),\n            _ => {}\n        }\n    }\n    registry\n}\n\n#[cfg(test)]\n#[allow(unused_variables)]\nmod tests;\n","crates/mycode-app/src/subagent/worktree.rs":"//! Git worktree leases for write-capable roles: acquire a detached\n//! checkout, hand its diff back with the result, and reclaim leases a\n//! crashed process left behind.\n\nuse std::fmt::Write as _;\nuse std::path::{Path, PathBuf};\n\nuse mycode_agent::HomeLayout;\n\n/// `git` for a worktree lease. On Windows the desktop process has no\n/// console, so a plain spawn of `git.exe` allocates a black window.\npub(super) fn git_command() -> std::process::Command {\n    #[cfg(windows)]\n    {\n        use std::os::windows::process::CommandExt as _;\n        // CREATE_NO_WINDOW: do not allocate a console for this child.\n        const CREATE_NO_WINDOW: u32 = 0x0800_0000;\n        let mut command = std::process::Command::new(\"git\");\n        command.creation_flags(CREATE_NO_WINDOW);\n        command\n    }\n    #[cfg(not(windows))]\n    {\n        std::process::Command::new(\"git\")\n    }\n}\n\n/// One git worktree lease: a disposable checkout plus its manifest, so a\n/// crashed process can recover leases on the next start.\npub(crate) struct WorktreeLease {\n    pub(crate) path: PathBuf,\n    pub(crate) manifest: PathBuf,\n}\n\nimpl WorktreeLease {\n    /// Creates a detached worktree of the current repository HEAD.\n    pub(crate) fn acquire(home: &HomeLayout, repo: &Path) -> Result<Self, String> {\n        let stamp = crate::unix_now().as_millis();\n        let id = format!(\"agent-{}-{stamp}\", std::process::id());\n        let leases = home.root().join(WORKTREE_LEASE_DIR);\n        std::fs::create_dir_all(&leases).map_err(|error| format!(\"lease dir: {error}\"))?;\n        let path = leases.join(&id);\n        let output = git_command()\n            .arg(\"-C\")\n            .arg(repo)\n            .args([\"worktree\", \"add\", \"--detach\"])\n            .arg(&path)\n            .output()\n            .map_err(|error| format!(\"git worktree: {error}\"))?;\n        if !output.status.success() {\n            let _ = std::fs::remove_dir(&path);\n            let reason = String::from_utf8_lossy(&output.stderr);\n            return Err(format!(\"git worktree add failed: {}\", reason.trim()));\n        }\n        let manifest = leases.join(format!(\"{id}.json\"));\n        let record = serde_json::json!({\n            \"repo\": repo.to_string_lossy(),\n            \"path\": path.to_string_lossy(),\n        });\n        std::fs::write(&manifest, record.to_string())\n            .map_err(|error| format!(\"lease manifest: {error}\"))?;\n        Ok(Self { path, manifest })\n    }\n\n    /// Releases the lease; best-effort because the work may be done.\n    pub(crate) fn release(self) {\n        let output = git_command()\n            .arg(\"-C\")\n            .arg(&self.path)\n            .args([\"worktree\", \"remove\", \"--force\"])\n            .arg(&self.path)\n            .output();\n        // Retry by repo path when the lease checkout itself is broken.\n        if matches!(&output, Ok(result) if !result.status.success())\n            && let Ok(record) = std::fs::read(&self.manifest)\n            && let Ok(value) = serde_json::from_slice::<serde_json::Value>(&record)\n            && let Some(repo) = value[\"repo\"].as_str()\n        {\n            let _ = git_command()\n                .arg(\"-C\")\n                .arg(repo)\n                .args([\"worktree\", \"remove\", \"--force\"])\n                .arg(&self.path)\n                .output();\n        }\n        let _ = std::fs::remove_file(&self.manifest);\n        let _ = std::fs::remove_dir_all(&self.path);\n    }\n}\n\n/// Releases a lease the run never handed off.\n///\n/// A parent cancel stops polling a running `agent` call and drops it\n/// mid-await. Without this guard the checkout stayed registered in the\n/// user's repository until the next app start.\npub(super) struct LeaseGuard(pub(super) Option<WorktreeLease>);\n\nimpl LeaseGuard {\n    pub(super) fn path(&self) -> Option<&Path> {\n        self.0.as_ref().map(|lease| lease.path.as_path())\n    }\n}\n\nimpl Drop for LeaseGuard {\n    fn drop(&mut self) {\n        let Some(lease) = self.0.take() else {\n            return;\n        };\n        // `git worktree remove` blocks; keep it off the runtime thread.\n        match tokio::runtime::Handle::try_current() {\n            Ok(runtime) => drop(runtime.spawn_blocking(move || lease.release())),\n            Err(_) => lease.release(),\n        }\n    }\n}\n\n/// Captured diff cap handed back with a subagent result.\nconst MAX_WORKTREE_DIFF_BYTES: usize = 256 * 1024;\n\n/// Reads the worktree diff while the checkout still exists.\npub(crate) fn capture_worktree_diff(path: &Path) -> String {\n    let mut out = String::new();\n    match git_command()\n        .arg(\"-C\")\n        .arg(path)\n        .args([\"diff\", \"--binary\", \"--no-ext-diff\", \"HEAD\"])\n        .output()\n    {\n        Ok(output) if output.status.success() => {\n            out.push_str(&String::from_utf8_lossy(&output.stdout));\n        }\n        Ok(output) => {\n            out.push_str(\"worktree diff failed: \");\n            out.push_str(String::from_utf8_lossy(&output.stderr).trim());\n            out.push('\\n');\n        }\n        Err(error) => {\n            let _ = writeln!(out, \"worktree diff failed: {error}\");\n        }\n    }\n    // `-z` prints raw NUL-terminated paths. The line format quotes names\n    // with spaces or non-ASCII bytes, and the quoted spelling failed the\n    // `path.join` lookup below.\n    match git_command()\n        .arg(\"-C\")\n        .arg(path)\n        .args([\"status\", \"--porcelain\", \"-z\", \"-uall\"])\n        .output()\n    {\n        Ok(output) if output.status.success() => {\n            for record in String::from_utf8_lossy(&output.stdout).split('\\0') {\n                let Some(name) = record.strip_prefix(\"?? \") else {\n                    continue;\n                };\n                if name.is_empty() || name.split('/').any(|part| part == \"..\") {\n                    continue;\n                }\n                let file = path.join(name);\n                let _ = writeln!(out, \"diff --git a/{name} b/{name}\");\n                match std::fs::read_to_string(&file) {\n                    Ok(body) => {\n                        out.push_str(\"new file\\n--- /dev/null\\n+++ b/\");\n                        out.push_str(name);\n                        out.push('\\n');\n                        out.push_str(&body);\n                        if !body.ends_with('\\n') {\n                            out.push('\\n');\n                        }\n                    }\n                    Err(error) => {\n                        let _ = writeln!(out, \"new file unreadable: {error}\");\n                    }\n                }\n            }\n        }\n        Ok(output) => {\n            out.push_str(\"worktree status failed: \");\n            out.push_str(String::from_utf8_lossy(&output.stderr).trim());\n            out.push('\\n');\n        }\n        Err(error) => {\n            let _ = writeln!(out, \"worktree status failed: {error}\");\n        }\n    }\n    cap_diff(out)\n}\n\nfn cap_diff(mut text: String) -> String {\n    if text.len() <= MAX_WORKTREE_DIFF_BYTES {\n        return text;\n    }\n    text.truncate(text.floor_char_boundary(MAX_WORKTREE_DIFF_BYTES));\n    text.push_str(\"\\n... diff truncated\\n\");\n    text\n}\n\n/// Joins a subagent answer with the diff captured from its worktree.\n#[must_use]\npub(crate) fn format_subagent_handoff(result: &str, diff: &str) -> String {\n    if diff.trim().is_empty() {\n        return result.to_owned();\n    }\n    format!(\"{result}\\n\\n<worktree-diff>\\n{diff}<\/worktree-diff>\")\n}\n\n/// Captures the diff, then releases the worktree.\n///\n/// The diff is part of both the success string and the error string. The\n/// checkout is removed only after that string is built.\npub(crate) fn handoff_worktree(\n    lease: WorktreeLease,\n    result: Result<String, mycode_agent::ToolError>,\n) -> Result<String, mycode_agent::ToolError> {\n    let diff = capture_worktree_diff(&lease.path);\n    let outcome = match result {\n        Ok(text) => Ok(format_subagent_handoff(&text, &diff)),\n        Err(error) => Err(mycode_agent::ToolError::Execution(format_subagent_handoff(\n            &error.to_string(),\n            &diff,\n        ))),\n    };\n    lease.release();\n    outcome\n}\n\n/// Directory for worktree leases created by this build.\nconst WORKTREE_LEASE_DIR: &str = \"agent-worktrees\";\n/// Lease directory written when the delegation tool was still named `task`.\nconst LEGACY_WORKTREE_LEASE_DIR: &str = \"task-worktrees\";\n\n/// Removes leases left behind by a crashed process. Best-effort: a lease\n/// whose repo is gone is simply deleted from disk.\n///\n/// A lease is named after the process that took it, so a lease whose process\n/// still runs is that instance's subagent at work and is kept.\n///\n/// Older builds stored leases under [`LEGACY_WORKTREE_LEASE_DIR`]. Both\n/// directories are reclaimed so a rename does not orphan a checkout.\npub(crate) fn recover_agent_worktrees(home: &HomeLayout) {\n    recover_worktree_lease_dir(home, WORKTREE_LEASE_DIR);\n    recover_worktree_lease_dir(home, LEGACY_WORKTREE_LEASE_DIR);\n}\n\nfn recover_worktree_lease_dir(home: &HomeLayout, directory: &str) {\n    let leases = home.root().join(directory);\n    let Ok(entries) = std::fs::read_dir(&leases) else {\n        return;\n    };\n    for entry in entries.flatten() {\n        if lease_in_use(\n            &entry.file_name(),\n            crate::updates::apply::process_is_running,\n        ) {\n            continue;\n        }\n        let path = entry.path();\n        if path\n            .extension()\n            .is_some_and(|extension| extension == \"json\")\n        {\n            if let Ok(bytes) = std::fs::read(&path)\n                && let Ok(value) = serde_json::from_slice::<serde_json::Value>(&bytes)\n                && let (Some(repo), Some(lease)) = (value[\"repo\"].as_str(), value[\"path\"].as_str())\n            {\n                let _ = git_command()\n                    .arg(\"-C\")\n                    .arg(repo)\n                    .args([\"worktree\", \"remove\", \"--force\"])\n                    .arg(lease)\n                    .output();\n            }\n            let _ = std::fs::remove_file(&path);\n        } else {\n            let _ = std::fs::remove_dir_all(&path);\n        }\n    }\n}\n\n/// Whether lease entry `name` (`agent-{pid}-{stamp}` or its `.json`\n/// manifest) belongs to a running process other than this one.\nfn lease_in_use(name: &std::ffi::OsStr, running: impl Fn(u32) -> bool) -> bool {\n    name.to_str()\n        .and_then(|name| name.split('-').nth(1))\n        .and_then(|pid| pid.parse::<u32>().ok())\n        .is_some_and(|pid| pid != std::process::id() && running(pid))\n}\n","crates/mycode-providers/src/lib.rs":"//! First-party provider runtime: resolves the magpie gateway into a\n//! streaming [`Provider`] over one of three wire protocols\n//! (`anthropic-messages`, `openai-completions`, `openai-responses`),\n//! egressing through the injectable [`SseTransport`] seam. [`catalog`] is\n//! magpie's model list; no vendor presets or OAuth flows ship here.\nmod anthropic_messages;\nmod cache;\npub mod catalog;\nmod driver;\nmod family;\nmod http_pin;\nmod openai_completions;\nmod openai_responses;\nmod proxy;\nmod sse;\npub mod transport;\nmod wire_common;\nmod xml_tool_calls;\n\nuse std::future::Future;\nuse std::pin::Pin;\nuse std::sync::Arc;\n\nuse tokio_util::sync::CancellationToken;\n\n// Chain re-export: successors see every lower layer through this crate only.\npub use mycode_config::*;\n\npub use family::keeps_thinking_when_off;\npub use http_pin::{\n    PinMode, PinnedBody, PinnedRequest, connection_addresses, is_public_ip, send_pinned,\n};\npub use proxy::{\n    PROXY_TEST_URL, ProxyTestReport, ProxyTestRoute, set_proxy_preference, test_proxy,\n};\npub use transport::{ReqwestTransport, SseTransport, TransportCall};\n\n/// OpenAI-compatible completions path appended to the base URL.\nconst OPENAI_COMPLETIONS_PATH: &str = \"/chat/completions\";\n/// OpenAI-compatible Responses path appended to the base URL.\nconst OPENAI_RESPONSES_PATH: &str = \"/responses\";\n/// Anthropic protocol version header value.\nconst ANTHROPIC_VERSION: &str = \"2023-06-01\";\n/// magpie's header naming the conversation a request belongs to: its\n/// Sessions page groups gateway conversations by it, and only a request that\n/// names one is listed (and recordable) there.\nconst MAGPIE_SESSION_HEADER: &str = \"x-magpie-session\";\n\n/// One resolved streaming provider endpoint.\n#[derive(Clone)]\npub struct ResolvedProvider {\n    /// Provider id from settings, used on the usage log line.\n    pub id: String,\n    /// Wire protocol kind from settings.\n    pub kind: String,\n    /// Full request endpoint URL.\n    pub endpoint: String,\n    /// Model id sent on every request.\n    pub model: String,\n    /// Request headers (auth, protocol version, User-Agent).\n    pub headers: Vec<(String, String)>,\n}\n\n/// Appends `prefix + suffix` to the base without doubling: a base that\n/// already ends with the full path is used as-is, and a base ending with\n/// `prefix` gets only `suffix`.\nfn endpoint_with(base: &str, prefix: &str, suffix: &str) -> String {\n    let full = format!(\"{prefix}{suffix}\");\n    if base.ends_with(&full) {\n        base.to_owned()\n    } else if base.ends_with(prefix) {\n        format!(\"{base}{suffix}\")\n    } else {\n        format!(\"{base}{full}\")\n    }\n}\n\nimpl ResolvedProvider {\n    /// Resolves settings plus a vault-supplied key into one endpoint.\n    ///\n    /// `user_agent` is the application's fixed agent string\n    /// (`mycode_app::default_user_agent`).\n    ///\n    /// # Errors\n    ///\n    /// Returns a rejected error for an unknown protocol kind or model not\n    /// offered by the provider.\n    pub fn resolve(\n        settings: &ProviderSettings,\n        model: &str,\n        api_key: &str,\n        user_agent: &str,\n    ) -> Result<Self, ProviderError> {\n        let base = settings.base_url.trim_end_matches('/');\n        let (endpoint, extra) = match settings.kind.as_str() {\n            \"anthropic-messages\" => (\n                // A base that already carries the versioned path (common when\n                // pasting a vendor console URL) must not be doubled.\n                endpoint_with(base, \"/v1\", \"/messages\"),\n                vec![\n                    (\"x-api-key\".to_owned(), api_key.to_owned()),\n                    (\"anthropic-version\".to_owned(), ANTHROPIC_VERSION.to_owned()),\n                ],\n            ),\n            \"openai-completions\" => (\n                endpoint_with(base, \"\", OPENAI_COMPLETIONS_PATH),\n                vec![(\"authorization\".to_owned(), format!(\"Bearer {api_key}\"))],\n            ),\n            \"openai-responses\" => (\n                endpoint_with(base, \"\", OPENAI_RESPONSES_PATH),\n                vec![(\"authorization\".to_owned(), format!(\"Bearer {api_key}\"))],\n            ),\n            _ => {\n                return Err(ProviderError::with_message(\n                    ProviderErrorKind::Rejected,\n                    \"unknown provider kind\",\n                ));\n            }\n        };\n        if !settings.models.iter().any(|m| m == model) {\n            return Err(ProviderError::with_message(\n                ProviderErrorKind::Rejected,\n                \"model not offered by this provider\",\n            ));\n        }\n        let mut headers = vec![(\"user-agent\".to_owned(), user_agent.to_owned())];\n        headers.extend(extra);\n        Ok(Self {\n            id: settings.id.clone(),\n            kind: settings.kind.clone(),\n            endpoint,\n            model: model.to_owned(),\n            headers,\n        })\n    }\n}\n\n/// A streaming provider bound to one endpoint and transport.\n#[derive(Clone)]\npub struct WireProvider {\n    resolved: ResolvedProvider,\n    transport: Arc<dyn SseTransport>,\n}\n\nimpl WireProvider {\n    /// Binds one resolved endpoint to a transport.\n    #[must_use]\n    pub fn new(resolved: ResolvedProvider, transport: Arc<dyn SseTransport>) -> Self {\n        Self {\n            resolved,\n            transport,\n        }\n    }\n\n    /// Builds the wire call and whether a retry rule could rewrite it; the\n    /// driver consults that flag before attempting a rewrite. Decided from\n    /// the JSON value before serialization, not by scanning the encoded bytes.\n    ///\n    /// A body that cannot be encoded fails like `Request::validate` does:\n    /// an empty POST would surface as an opaque provider 400 with nothing\n    /// pointing at the encoding failure.\n    fn call_for(&self, request: &Request) -> Result<(TransportCall, bool), ProviderError> {\n        let model = self.resolved.model.as_str();\n        let endpoint = self.resolved.endpoint.as_str();\n        let (body, replays_thinking) = match self.resolved.kind.as_str() {\n            \"anthropic-messages\" => {\n                let body = anthropic_messages::build_body(model, endpoint, request);\n                let replays = anthropic_messages::replays_thinking(&body);\n                (body, replays)\n            }\n            \"openai-responses\" => (\n                openai_responses::build_body(model, endpoint, request),\n                false,\n            ),\n            _ => (\n                openai_completions::build_body(model, endpoint, request),\n                false,\n            ),\n        };\n        let retryable = replays_thinking || cache::has_prompt_cache_key(&body);\n        let headers = request_headers(&self.resolved, request);\n        let encoded = serde_json::to_vec(&body).map_err(|_| {\n            ProviderError::with_message(ProviderErrorKind::Protocol, \"request encoding failed\")\n        })?;\n        let call = TransportCall {\n            endpoint: self.resolved.endpoint.clone(),\n            headers,\n            body: encoded.into(),\n        };\n        Ok((call, retryable))\n    }\n}\n\n/// Headers one request carries: the resolved endpoint's own, the session\n/// magpie groups conversations by, and the prompt-cache session header\n/// openrouter asks for.\nfn request_headers(resolved: &ResolvedProvider, request: &Request) -> Vec<(String, String)> {\n    let mut headers = resolved.headers.clone();\n    if let Some(key) = request\n        .prompt_cache_key\n        .as_deref()\n        .map(str::trim)\n        .filter(|key| !key.is_empty())\n    {\n        headers.push((MAGPIE_SESSION_HEADER.to_owned(), key.to_owned()));\n    }\n    if let Some(header) =\n        cache::openrouter_session_header(&resolved.endpoint, request.prompt_cache_key.as_deref())\n    {\n        headers.push(header);\n    }\n    headers\n}\n\nfn reducer_for(kind: &str) -> Box<dyn driver::FrameReducer + Send> {\n    match kind {\n        \"anthropic-messages\" => Box::new(anthropic_messages::MessagesReducer::new()),\n        \"openai-responses\" => Box::new(openai_responses::ResponsesReducer::new()),\n        _ => Box::new(openai_completions::CompletionsReducer::new()),\n    }\n}\n\nimpl Provider for WireProvider {\n    fn stream<'a>(\n        &'a self,\n        request: &'a Request,\n        cancel: CancellationToken,\n    ) -> Pin<Box<dyn Future<Output = Result<EventStream, ProviderError>> + Send + 'a>> {\n        Box::pin(async move {\n            request.validate()?;\n            let (call, retryable) = self.call_for(request)?;\n            let kind = self.resolved.kind.clone();\n            let (sender, stream) = EventStream::channel(cancel.clone());\n            let transport = Arc::clone(&self.transport);\n            tokio::spawn(async move {\n                driver::drive(\n                    transport,\n                    call,\n                    retryable,\n                    move || reducer_for(&kind),\n                    sender,\n                    cancel,\n                )\n                .await;\n            });\n            Ok(stream)\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{MAGPIE_SESSION_HEADER, ResolvedProvider, request_headers};\n    use mycode_config::ProviderSettings;\n    use mycode_config::Request;\n\n    fn resolved() -> ResolvedProvider {\n        let settings = ProviderSettings::magpie(\n            \"http://127.0.0.1:3425/v1\",\n            vec![\"opendesign/deepseek-v4.1-flash\".to_owned()],\n            Vec::new(),\n        );\n        ResolvedProvider::resolve(\n            &settings,\n            \"opendesign/deepseek-v4.1-flash\",\n            \"gateway-key\",\n            \"MYCode-Agent/0.12.18\",\n        )\n        .expect(\"resolved gateway row\")\n    }\n\n    fn session_header(request: &Request) -> Option<String> {\n        request_headers(&resolved(), request)\n            .into_iter()\n            .find(|(name, _)| name == MAGPIE_SESSION_HEADER)\n            .map(|(_, value)| value)\n    }\n\n    #[test]\n    fn the_session_header_names_the_magpie_conversation() {\n        let mut request = Request::new();\n        request.prompt_cache_key = Some(\"sess-20261021-170501-0123abcd\".to_owned());\n        assert_eq!(\n            session_header(&request).as_deref(),\n            Some(\"sess-20261021-170501-0123abcd\")\n        );\n    }\n\n    #[test]\n    fn a_request_without_a_session_sends_no_session_header() {\n        assert_eq!(session_header(&Request::new()), None);\n        let mut blank = Request::new();\n        blank.prompt_cache_key = Some(\"   \".to_owned());\n        assert_eq!(session_header(&blank), None);\n    }\n}\n","crates/mycode-providers/src/family.rs":"//! One table per concern, keyed by provider or model family.\n//!\n//! OpenCode decides the same things in\n//! `packages/opencode/src/provider/transform.ts` (`variants`, `options`,\n//! `smallOptions`, `applyCaching`, `reasoningVariants`) after\n//! `packages/opencode/src/provider/provider.ts` `fromModelsDevModel` picks\n//! `api.npm` (unknown providers fall back to `@ai-sdk/openai-compatible`).\n//! The first matching row wins. Each thinking table ends with a fallback\n//! row, so a new model on an unknown host needs no code change.\n\nuse serde_json::{Value, json};\n\nuse mycode_config::ReasoningLevel;\n\nuse crate::wire_common::{ReasoningReplay, ThinkingWire};\n\n/// Hosts that reject `prompt_cache_key` or cache by some other mechanism.\n///\n/// A substring match on the lowercased endpoint. Unknown hosts are not\n/// listed: they are probed, and a 400 that names the field drops it for\n/// the rest of the process.\npub(crate) const PROMPT_CACHE_KEY_OMIT_HOSTS: &[&str] = &[\n    \"openrouter.ai\",\n    \"api.z.ai\",\n    \"bigmodel.cn\",\n    \"zhipu\",\n    \"deepseek.com\",\n    \"minimax\",\n    \"dashscope\",\n    \"aliyuncs.com\",\n    \"moonshot.ai\",\n    \"moonshot.cn\",\n    \"kimi.com\",\n    \"kimi.ai\",\n    \"api.groq.com\",\n    \"api.together.ai\",\n    \"api.together.xyz\",\n    \"volces.com\",\n    \"volcengine.com\",\n    \"qianfan\",\n    \"baidubce.com\",\n    \"generativelanguage.googleapis.com\",\n    // Messages hosts reject unknown chat fields. The Messages builder never\n    // writes prompt_cache_key; this keeps a completions-shaped call on the\n    // same host from probing it.\n    \"api.anthropic.com\",\n    \"freemodel.dev\",\n    \"subconscious.dev\",\n    \"thinkingmachines.dev\",\n];\n\n/// Usage JSON keys. One parser accepts the union because the payload does\n/// not name the provider. DeepSeek `prompt_cache_miss_tokens` is absent on\n/// purpose: `prompt_tokens` already includes hit and miss.\npub(crate) const USAGE_INPUT_KEYS: &[&str] = &[\n    \"input_tokens\",\n    \"prompt_tokens\",\n    \"input\",\n    \"promptTokenCount\",\n    \"prompt_token_count\",\n];\n\npub(crate) const USAGE_OUTPUT_KEYS: &[&str] = &[\n    \"output_tokens\",\n    \"completion_tokens\",\n    \"output\",\n    \"candidatesTokenCount\",\n    \"candidates_token_count\",\n];\n\npub(crate) const USAGE_CACHE_READ_KEYS: &[&str] = &[\n    \"cache_read_tokens\",\n    \"cache_read_input_tokens\",\n    \"cached_tokens\",\n    \"prompt_cache_hit_tokens\",\n    \"cachedContentTokenCount\",\n    \"cached_content_token_count\",\n];\n\npub(crate) const USAGE_CACHE_READ_NESTED_KEYS: &[&str] = &[\"cached_tokens\", \"cache_read_tokens\"];\n\npub(crate) const USAGE_CACHE_WRITE_KEYS: &[&str] = &[\n    \"cache_creation_input_tokens\",\n    \"cache_write_input_tokens\",\n    \"cache_write_tokens\",\n];\n\npub(crate) const USAGE_CACHE_WRITE_NESTED_KEYS: &[&str] =\n    &[\"cache_write_tokens\", \"cache_creation_input_tokens\"];\n\npub(crate) const USAGE_CACHE_WRITE_EPHEMERAL_KEYS: &[&str] =\n    &[\"ephemeral_5m_input_tokens\", \"ephemeral_1h_input_tokens\"];\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\nenum ChatFamily {\n    OpenRouter,\n    DashScope,\n    Zai,\n    MiniMax,\n    Kimi,\n    Qwen,\n    DeepSeek,\n    /// `@ai-sdk/openai-compatible` in OpenCode: `reasoning_effort` only.\n    Generic,\n}\n\nstruct ChatRow {\n    family: ChatFamily,\n    /// Stable name for tests and the PR table; only the cfg(test) name\n    /// accessors read it, so the field is dead in a non-test build.\n    #[cfg_attr(not(test), allow(dead_code))]\n    name: &'static str,\n    matches: fn(&str, &str) -> bool,\n}\n\n/// Chat-completions thinking, first match wins.\n///\n/// Host rows come before model rows so OpenRouter and DashScope keep their\n/// own field even when the model id is GLM, Kimi, or DeepSeek.\nconst CHAT_THINKING: &[ChatRow] = &[\n    ChatRow {\n        family: ChatFamily::OpenRouter,\n        name: \"openrouter\",\n        matches: host_openrouter,\n    },\n    ChatRow {\n        family: ChatFamily::DashScope,\n        name: \"dashscope\",\n        matches: host_dashscope,\n    },\n    // The OpenDesign gateway takes plain `reasoning_effort` for every model\n    // it routes (verified per level against the gateway); the vendor\n    // `thinking` objects of the GLM, Kimi, and DeepSeek rows are not its API.\n    ChatRow {\n        family: ChatFamily::Generic,\n        name: \"opendesign\",\n        matches: host_opendesign,\n    },\n    ChatRow {\n        family: ChatFamily::Zai,\n        name: \"zai\",\n        matches: glm_target,\n    },\n    ChatRow {\n        family: ChatFamily::MiniMax,\n        name: \"minimax\",\n        matches: minimax_target,\n    },\n    ChatRow {\n        family: ChatFamily::Kimi,\n        name: \"kimi\",\n        matches: match_kimi,\n    },\n    ChatRow {\n        family: ChatFamily::Qwen,\n        name: \"qwen\",\n        matches: match_qwen,\n    },\n    ChatRow {\n        family: ChatFamily::DeepSeek,\n        name: \"deepseek\",\n        matches: match_deepseek,\n    },\n    ChatRow {\n        family: ChatFamily::Generic,\n        name: \"generic\",\n        matches: always,\n    },\n];\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\nenum AnthropicFamily {\n    MiniMax,\n    Kimi,\n    Zai,\n    ClaudeAdaptive,\n    /// Older Claude, and any other model on the Messages wire.\n    ClaudeBudget,\n}\n\nstruct AnthropicRow {\n    family: AnthropicFamily,\n    /// Stable name for tests and the PR table; only the cfg(test) name\n    /// accessors read it, so the field is dead in a non-test build.\n    #[cfg_attr(not(test), allow(dead_code))]\n    name: &'static str,\n    matches: fn(&str, &str) -> bool,\n}\n\nconst ANTHROPIC_THINKING: &[AnthropicRow] = &[\n    AnthropicRow {\n        family: AnthropicFamily::MiniMax,\n        name: \"minimax\",\n        matches: minimax_target,\n    },\n    AnthropicRow {\n        family: AnthropicFamily::Kimi,\n        name: \"kimi\",\n        matches: match_kimi,\n    },\n    AnthropicRow {\n        family: AnthropicFamily::Zai,\n        name: \"zai\",\n        matches: glm_target,\n    },\n    AnthropicRow {\n        family: AnthropicFamily::ClaudeAdaptive,\n        name: \"claude-adaptive\",\n        matches: match_claude_adaptive,\n    },\n    AnthropicRow {\n        family: AnthropicFamily::ClaudeBudget,\n        name: \"claude-budget\",\n        matches: always,\n    },\n];\n\nstruct ReplayRow {\n    kind: ReasoningReplay,\n    matches: fn(&str, &str) -> bool,\n}\n\nconst REPLAY: &[ReplayRow] = &[\n    ReplayRow {\n        kind: ReasoningReplay::MiniMax,\n        matches: minimax_target,\n    },\n    ReplayRow {\n        kind: ReasoningReplay::Content,\n        matches: match_content_replay,\n    },\n    ReplayRow {\n        kind: ReasoningReplay::Omit,\n        matches: always,\n    },\n];\n\n/// `None` means this row does not claim the host. The first `Some` wins.\n/// OpenRouter claims every `openrouter.ai` host so GLM there does not fall\n/// through to another row.\nstruct CacheRow {\n    claims: fn(&str, &str) -> Option<bool>,\n}\n\nconst CHAT_CACHE: &[CacheRow] = &[\n    CacheRow {\n        claims: claim_openrouter_cache,\n    },\n    CacheRow {\n        claims: claim_zai_cache,\n    },\n    CacheRow {\n        claims: claim_dashscope_cache,\n    },\n];\n\n/// Chat family name for the first matching thinking row.\n#[cfg(test)]\n#[must_use]\npub(crate) fn chat_family_name(model: &str, endpoint: &str) -> &'static str {\n    chat_row(&model.to_ascii_lowercase(), &endpoint.to_ascii_lowercase()).name\n}\n\n/// Messages family name for the first matching thinking row.\n#[cfg(test)]\n#[must_use]\npub(crate) fn anthropic_family_name(model: &str, endpoint: &str) -> &'static str {\n    anthropic_row(&model.to_ascii_lowercase(), &endpoint.to_ascii_lowercase()).name\n}\n\n/// Applies chat or Responses reasoning fields from [`CHAT_THINKING`].\npub(crate) fn apply_chat_thinking(\n    body: &mut Value,\n    model: &str,\n    endpoint: &str,\n    level: ReasoningLevel,\n    wire: ThinkingWire,\n) {\n    let model_id = model.to_ascii_lowercase();\n    let host = endpoint.to_ascii_lowercase();\n    let row = chat_row(&model_id, &host);\n    match row.family {\n        ChatFamily::OpenRouter => apply_openrouter(body, level),\n        ChatFamily::DashScope => apply_dashscope(body, &model_id, level),\n        ChatFamily::Zai => apply_zai(body, level),\n        ChatFamily::MiniMax => apply_minimax(body, level, wire),\n        ChatFamily::Kimi => apply_kimi_chat(body, &model_id, level),\n        ChatFamily::Qwen => {\n            apply_enable_thinking(body, level);\n            if let Some(token) = effort_token(level) {\n                body[\"reasoning_effort\"] = json!(token);\n            }\n        }\n        ChatFamily::DeepSeek => apply_deepseek(body, &model_id, level),\n        ChatFamily::Generic => apply_openai_effort(body, &model_id, level, wire),\n    }\n}\n\n/// Applies Messages thinking fields from [`ANTHROPIC_THINKING`].\npub(crate) fn apply_anthropic_thinking_policy(\n    body: &mut Value,\n    model: &str,\n    endpoint: &str,\n    level: ReasoningLevel,\n) {\n    let model_id = model.to_ascii_lowercase();\n    let host = endpoint.to_ascii_lowercase();\n    let row = anthropic_row(&model_id, &host);\n    match row.family {\n        AnthropicFamily::MiniMax => apply_minimax(body, level, ThinkingWire::Anthropic),\n        AnthropicFamily::Kimi => apply_kimi_anthropic(body, level),\n        AnthropicFamily::Zai => apply_zai_anthropic(body, level),\n        AnthropicFamily::ClaudeAdaptive => apply_claude_adaptive(body, &model_id, level),\n        AnthropicFamily::ClaudeBudget => apply_claude_budget(body, level),\n    }\n}\n\n/// How an assistant turn's reasoning is echoed on the next chat request.\npub(crate) fn reasoning_replay(model: &str, endpoint: &str) -> ReasoningReplay {\n    let model_id = model.to_ascii_lowercase();\n    let host = endpoint.to_ascii_lowercase();\n    REPLAY\n        .iter()\n        .find(|row| (row.matches)(&model_id, &host))\n        .map(|row| row.kind)\n        .unwrap_or(ReasoningReplay::Omit)\n}\n\n/// Whether a chat body should carry `cache_control` breakpoints.\n#[must_use]\npub(crate) fn explicit_chat_cache(model: &str, endpoint: &str) -> bool {\n    let model_id = model.to_ascii_lowercase();\n    let host = endpoint.to_ascii_lowercase();\n    CHAT_CACHE\n        .iter()\n        .find_map(|row| (row.claims)(&model_id, &host))\n        .unwrap_or(false)\n}\n\n/// MiniMax Messages pins the head and the tail. Every other Messages model\n/// uses the last two cacheable blocks, matching OpenCode `applyCaching`.\n#[must_use]\npub(crate) fn anthropic_pins_stable_ends(model: &str) -> bool {\n    model.to_ascii_lowercase().contains(\"minimax\")\n}\n\n/// True when this endpoint must not be probed with `prompt_cache_key`.\n#[must_use]\npub(crate) fn omits_prompt_cache_key(endpoint: &str) -> bool {\n    let endpoint = endpoint.to_ascii_lowercase();\n    PROMPT_CACHE_KEY_OMIT_HOSTS\n        .iter()\n        .any(|host| endpoint.contains(host))\n}\n\n/// MiniMax (including minimaxi.com) rejects `thinking.type = \"enabled\"`.\n#[must_use]\npub(crate) fn minimax_target(model: &str, endpoint: &str) -> bool {\n    match_minimax(&model.to_ascii_lowercase(), &endpoint.to_ascii_lowercase())\n}\n\n/// Zhipu / Z.AI / BigModel, including a model id that contains `glm`.\n#[must_use]\npub(crate) fn glm_target(model: &str, endpoint: &str) -> bool {\n    match_zai(&model.to_ascii_lowercase(), &endpoint.to_ascii_lowercase())\n}\n\n/// First matching chat thinking row. Inputs are already lowercased.\nfn chat_row(model_id: &str, host: &str) -> &'static ChatRow {\n    CHAT_THINKING\n        .iter()\n        .find(|row| (row.matches)(model_id, host))\n        .unwrap_or_else(|| {\n            CHAT_THINKING\n                .last()\n                .expect(\"chat thinking table ends with generic\")\n        })\n}\n\n/// First matching Messages thinking row. Inputs are already lowercased.\nfn anthropic_row(model_id: &str, host: &str) -> &'static AnthropicRow {\n    ANTHROPIC_THINKING\n        .iter()\n        .find(|row| (row.matches)(model_id, host))\n        .unwrap_or_else(|| {\n            ANTHROPIC_THINKING\n                .last()\n                .expect(\"anthropic thinking table ends with budget\")\n        })\n}\n\nfn always(_model: &str, _host: &str) -> bool {\n    true\n}\n\nfn host_openrouter(_model: &str, host: &str) -> bool {\n    host.contains(\"openrouter.ai\")\n}\n\nfn host_dashscope(_model: &str, host: &str) -> bool {\n    host.contains(\"dashscope\") || host.contains(\"aliyuncs\")\n}\n\nfn host_opendesign(_model: &str, host: &str) -> bool {\n    host.contains(\"open-design.ai\")\n}\n\nfn match_zai(model: &str, host: &str) -> bool {\n    model.contains(\"glm\")\n        || host.contains(\"z.ai\")\n        || host.contains(\"bigmodel\")\n        || host.contains(\"zhipu\")\n}\n\nfn match_minimax(model: &str, host: &str) -> bool {\n    model.contains(\"minimax\") || host.contains(\"minimax\")\n}\n\nfn match_kimi(model: &str, host: &str) -> bool {\n    is_k3_model(model)\n        || model.contains(\"kimi\")\n        || model.contains(\"moonshot\")\n        || model.contains(\"k2p\")\n        || host.contains(\"api.kimi.com\")\n        || host.contains(\"moonshot.ai\")\n        || host.contains(\"moonshot.cn\")\n        || host.contains(\"moonshotai.cn\")\n}\n\nfn match_qwen(model: &str, _host: &str) -> bool {\n    model.contains(\"qwen\") || model.contains(\"qwq\")\n}\n\nfn match_deepseek(model: &str, host: &str) -> bool {\n    model.contains(\"deepseek\") || host.contains(\"deepseek\")\n}\n\nfn match_claude_adaptive(model: &str, _host: &str) -> bool {\n    claude_adaptive(model)\n}\n\nfn match_content_replay(model: &str, host: &str) -> bool {\n    match_zai(model, host)\n        || match_deepseek(model, host)\n        || model.contains(\"kimi\")\n        || model.contains(\"moonshot\")\n        || host.contains(\"moonshot\")\n        || host.contains(\"api.kimi.com\")\n        || host.contains(\"kimi.ai\")\n        || is_k3_model(model)\n}\n\nfn claim_openrouter_cache(model: &str, host: &str) -> Option<bool> {\n    if !host.contains(\"openrouter.ai\") {\n        return None;\n    }\n    Some(model.contains(\"anthropic\") || model.contains(\"claude\") || model.contains(\"gemini\"))\n}\n\nfn claim_zai_cache(_model: &str, host: &str) -> Option<bool> {\n    if host.contains(\"api.z.ai\") || host.contains(\"bigmodel.cn\") || host.contains(\"zhipu\") {\n        Some(true)\n    } else {\n        None\n    }\n}\n\nfn claim_dashscope_cache(model: &str, host: &str) -> Option<bool> {\n    if !(host.contains(\"dashscope\") || host.contains(\"aliyuncs.com\")) {\n        return None;\n    }\n    Some(model.contains(\"qwen\") || model.contains(\"qwq\"))\n}\n\nfn apply_openrouter(body: &mut Value, level: ReasoningLevel) {\n    let effort = match level {\n        ReasoningLevel::Off => \"none\",\n        ReasoningLevel::On => \"high\",\n        other => other.effort_token().unwrap_or(\"high\"),\n    };\n    body[\"reasoning\"] = json!({ \"effort\": effort });\n}\n\nfn apply_dashscope(body: &mut Value, model_id: &str, level: ReasoningLevel) {\n    // DashScope defaults `kimi-k2-thinking` on. Every other reasoning model\n    // on this host, including Kimi, GLM, Qwen, and DeepSeek, needs the flag.\n    if level == ReasoningLevel::Off {\n        body[\"enable_thinking\"] = json!(false);\n    } else if !model_id.contains(\"kimi-k2-thinking\") {\n        body[\"enable_thinking\"] = json!(true);\n    }\n    if let Some(token) = effort_token(level) {\n        body[\"reasoning_effort\"] = json!(token);\n    }\n}\n\nfn apply_zai(body: &mut Value, level: ReasoningLevel) {\n    if level == ReasoningLevel::Off {\n        body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n        return;\n    }\n    body[\"thinking\"] = json!({ \"type\": \"enabled\", \"clear_thinking\": false });\n    if let Some(token) = effort_token(level) {\n        body[\"reasoning_effort\"] = json!(token);\n    }\n}\n\nfn apply_zai_anthropic(body: &mut Value, level: ReasoningLevel) {\n    // Claude Code on Z.AI's Anthropic route uses `thinking.type` and\n    // `output_config.effort` (low / high / max). `reasoning_effort` is the\n    // chat-completions name and is not sent here. `clear_thinking: false`\n    // is preserved thinking: replayed reasoning has to stay byte-identical\n    // or the prefix cache misses. `budget_tokens` is Anthropic's field and\n    // this gateway does not take it.\n    if level == ReasoningLevel::Off {\n        body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n        return;\n    }\n    body[\"thinking\"] = json!({ \"type\": \"enabled\", \"clear_thinking\": false });\n    body[\"output_config\"] = json!({ \"effort\": glm_anthropic_effort(level) });\n}\n\nfn apply_minimax(body: &mut Value, level: ReasoningLevel, wire: ThinkingWire) {\n    // MiniMax has no off switch: M3.1 rejects `disabled` outright\n    // (\"requires adaptive thinking\"), and `adaptive` is accepted by every\n    // MiniMax model — `enabled` is the field the API actually refuses. So\n    // `Off` degrades to the same wire shape as any other level; callers\n    // sizing an output cap consult `keeps_thinking_when_off`.\n    let _ = level;\n    body[\"thinking\"] = json!({ \"type\": \"adaptive\" });\n    // Chat Completions inlines `<think>` unless this is set. The Messages\n    // API already returns thinking blocks; an unknown field there can 400.\n    if wire == ThinkingWire::Completions {\n        body[\"reasoning_split\"] = json!(true);\n    }\n}\n\nfn apply_kimi_chat(body: &mut Value, model_id: &str, level: ReasoningLevel) {\n    // K3 always thinks and rejects `thinking`. Effort is `low` / `high` /\n    // `max` (default max). Off has no disable switch, so the field is omitted\n    // rather than sending `{type:\"disabled\"}`, which this model 400s.\n    // https://platform.kimi.com/docs/guide/use-reasoning-effort.md\n    // A published models.dev list still gates the token. An id the active\n    // catalog and the bundled baseline both omit keeps the id-based token so\n    // coding-plan ids such as `k3` and `k3-256k` keep working.\n    if is_k3_model(model_id) {\n        if let Some(token) = kimi_effort_token(level) {\n            body[\"reasoning_effort\"] = json!(token);\n        }\n        return;\n    }\n    // K2.7 Code rejects `{type:\"disabled\"}`. Leaving the field off matches\n    // that API and OpenCode, which has no off variant for it.\n    if level == ReasoningLevel::Off && model_id.contains(\"kimi-k2.7-code\") {\n        return;\n    }\n    if level == ReasoningLevel::Off {\n        body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n        return;\n    }\n    body[\"thinking\"] = json!({ \"type\": \"enabled\" });\n    // The highspeed coding-plan row publishes thinking but no effort list:\n    // it accepts the toggle and rejects `reasoning_effort`.\n    if model_id.contains(\"kimi-for-coding-highspeed\") {\n        return;\n    }\n    // OpenCode `variants()` returns `{}` for an id containing `kimi`\n    // (`packages/opencode/src/provider/transform.ts`) before the npm switch,\n    // so that map never adds effort. When models.dev publishes an effort\n    // list, `reasoningVariants` → `effortVariants` → `reasoningEffort` does.\n    // `@ai-sdk/openai-compatible` returns `{ reasoningEffort }`, the wire\n    // field `reasoning_effort`. The K2 toggle stays; the effort token is\n    // sent beside it.\n    if let Some(token) = kimi_effort_token(level) {\n        body[\"reasoning_effort\"] = json!(token);\n    }\n}\n\n/// Effort token for a Kimi chat model.\n///\n/// The app only sends a level the gateway catalog advertises for the model,\n/// so the id mapping decides the wire token.\nfn kimi_effort_token(level: ReasoningLevel) -> Option<&'static str> {\n    k3_effort(level)\n}\n\nfn apply_kimi_anthropic(body: &mut Value, level: ReasoningLevel) {\n    if level == ReasoningLevel::Off {\n        body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n        return;\n    }\n    body[\"thinking\"] = json!({ \"type\": \"adaptive\", \"display\": \"summarized\" });\n    body[\"output_config\"] = json!({ \"effort\": adaptive_effort(level) });\n}\n\n/// K3 effort tokens. `minimal` and `xhigh` are not on the K3 list.\nfn k3_effort(level: ReasoningLevel) -> Option<&'static str> {\n    match level {\n        ReasoningLevel::Off | ReasoningLevel::On => None,\n        ReasoningLevel::Minimal | ReasoningLevel::Low => Some(\"low\"),\n        ReasoningLevel::Medium | ReasoningLevel::High => Some(\"high\"),\n        ReasoningLevel::Xhigh | ReasoningLevel::Max => Some(\"max\"),\n    }\n}\n\nfn apply_enable_thinking(body: &mut Value, level: ReasoningLevel) {\n    body[\"enable_thinking\"] = json!(level != ReasoningLevel::Off);\n}\n\nfn apply_deepseek(body: &mut Value, model_id: &str, level: ReasoningLevel) {\n    // Current chat models take the thinking toggle and `reasoning_effort`\n    // `low` / `high` / `max` together. Chat does not accept `none`.\n    // `deepseek-flash` and the legacy alias `deepseek-v4-flash` are one model.\n    // https://api-docs.deepseek.com/guides/thinking_mode\n    if deepseek_effort_model(model_id) {\n        if level == ReasoningLevel::Off {\n            body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n            return;\n        }\n        body[\"thinking\"] = json!({ \"type\": \"enabled\" });\n        body[\"reasoning_effort\"] = json!(deepseek_effort(level));\n        return;\n    }\n    // Older ids (chat, reasoner, r1, v3) are the toggle. OpenCode's\n    // `reasoningVariants` returns an empty map for those ids.\n    if level == ReasoningLevel::Off {\n        body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n    } else {\n        body[\"thinking\"] = json!({ \"type\": \"enabled\" });\n    }\n}\n\nfn deepseek_effort_model(model_id: &str) -> bool {\n    model_id.contains(\"deepseek-flash\") || model_id.contains(\"deepseek-v4\")\n}\n\n/// Docs map minimal→low, low→low, medium→high, high→high, xhigh→high, max→max.\nfn deepseek_effort(level: ReasoningLevel) -> &'static str {\n    match level {\n        ReasoningLevel::Minimal | ReasoningLevel::Low => \"low\",\n        ReasoningLevel::Max => \"max\",\n        ReasoningLevel::Off\n        | ReasoningLevel::On\n        | ReasoningLevel::Medium\n        | ReasoningLevel::High\n        | ReasoningLevel::Xhigh => \"high\",\n    }\n}\n\nfn apply_openai_effort(\n    body: &mut Value,\n    model_id: &str,\n    level: ReasoningLevel,\n    wire: ThinkingWire,\n) {\n    let effort = match level {\n        ReasoningLevel::Off => \"none\",\n        ReasoningLevel::On if gpt5_defaults_medium(model_id) => \"medium\",\n        ReasoningLevel::On => return,\n        other => other.effort_token().unwrap_or(\"medium\"),\n    };\n    if wire == ThinkingWire::Responses {\n        body[\"reasoning\"] = json!({ \"effort\": effort });\n    } else {\n        body[\"reasoning_effort\"] = json!(effort);\n    }\n}\n\nfn apply_claude_adaptive(body: &mut Value, model_id: &str, level: ReasoningLevel) {\n    if level == ReasoningLevel::Off {\n        // Claude 5+ may answer `{type: \"disabled\"}` with a 400. Omitting\n        // `thinking` runs them adaptive, and the lowest effort is the\n        // closest they get to off.\n        if claude_thinking_always_on(model_id) {\n            body[\"output_config\"] = json!({ \"effort\": \"low\" });\n        } else {\n            body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n        }\n        return;\n    }\n    let mut thinking = json!({ \"type\": \"adaptive\" });\n    if claude_summarized_display(model_id) {\n        thinking[\"display\"] = json!(\"summarized\");\n    }\n    body[\"thinking\"] = thinking;\n    body[\"output_config\"] = json!({ \"effort\": adaptive_effort(level) });\n}\n\nfn apply_claude_budget(body: &mut Value, level: ReasoningLevel) {\n    if level == ReasoningLevel::Off {\n        body[\"thinking\"] = json!({ \"type\": \"disabled\" });\n        return;\n    }\n    let budget = match level {\n        ReasoningLevel::Minimal | ReasoningLevel::Low => 1_024,\n        ReasoningLevel::On | ReasoningLevel::Medium => 4_096,\n        ReasoningLevel::High => 16_384,\n        ReasoningLevel::Xhigh | ReasoningLevel::Max => 32_768,\n        ReasoningLevel::Off => 0,\n    };\n    let max_tokens = body[\"max_tokens\"].as_u64().unwrap_or(4_096);\n    if max_tokens <= budget {\n        body[\"max_tokens\"] = json!(budget + 4_096);\n    }\n    body[\"thinking\"] = json!({ \"type\": \"enabled\", \"budget_tokens\": budget });\n}\n\n/// Coding-plan effort on the Anthropic route. GLM-5.3 only accepts\n/// `low` / `high` / `max`; enabled thinking with no effort token is `max`.\nfn glm_anthropic_effort(level: ReasoningLevel) -> &'static str {\n    match level {\n        ReasoningLevel::Minimal | ReasoningLevel::Low => \"low\",\n        ReasoningLevel::Medium | ReasoningLevel::High => \"high\",\n        ReasoningLevel::Off => \"low\",\n        ReasoningLevel::On | ReasoningLevel::Xhigh | ReasoningLevel::Max => \"max\",\n    }\n}\n\nfn effort_token(level: ReasoningLevel) -> Option<&'static str> {\n    match level {\n        ReasoningLevel::Off | ReasoningLevel::On => None,\n        other => other.effort_token(),\n    }\n}\n\nfn adaptive_effort(level: ReasoningLevel) -> &'static str {\n    match level {\n        ReasoningLevel::Off => \"low\",\n        ReasoningLevel::On | ReasoningLevel::High => \"high\",\n        ReasoningLevel::Minimal | ReasoningLevel::Low => \"low\",\n        ReasoningLevel::Medium => \"medium\",\n        ReasoningLevel::Xhigh => \"xhigh\",\n        ReasoningLevel::Max => \"max\",\n    }\n}\n\n/// K3 ids: `k3`, `k3-*`, `*/k3`, `*/k3-*`, and `kimi-k3` / `kimi-k3-*`.\n///\n/// `k30`, `k3x`, `mk3`, `task-k3`, and `kimi-k30` are not K3. OpenCode's\n/// `isKimiFamily` only looks for \"kimi\" or \"moonshot\", so bare `k3` is a\n/// row of our own: the coding plan publishes those ids, and a capture proxy\n/// is not `api.kimi.com`.\nfn is_k3_model(model_id: &str) -> bool {\n    model_id.split(['/', '\\\\']).any(|segment| {\n        segment == \"k3\"\n            || segment.starts_with(\"k3-\")\n            || segment\n                .strip_prefix(\"kimi-k3\")\n                .is_some_and(|rest| rest.is_empty() || rest.starts_with('-'))\n    })\n}\n\nfn gpt5_defaults_medium(model_id: &str) -> bool {\n    model_id.contains(\"gpt-5\")\n        && !model_id.contains(\"gpt-5-chat\")\n        && !model_id.contains(\"gpt-5-pro\")\n}\n\nfn claude_adaptive(model_id: &str) -> bool {\n    const MARKERS: &[&str] = &[\n        \"opus-4-6\",\n        \"opus-4.6\",\n        \"4-6-opus\",\n        \"4.6-opus\",\n        \"sonnet-4-6\",\n        \"sonnet-4.6\",\n        \"4-6-sonnet\",\n        \"4.6-sonnet\",\n    ];\n    if MARKERS.iter().any(|marker| model_id.contains(marker)) {\n        return true;\n    }\n    claude_summarized_display(model_id)\n}\n\n/// Claude generations that get no `thinking: disabled` for Off.\n///\n/// Fable, Mythos, Opus 5.5, and Sonnet 5.5 answer `disabled` with a 400,\n/// and Opus 5 and Haiku 5.5 accept it only at some efforts. Which minor\n/// release drops the switch next is not knowable ahead of time, so every\n/// Claude 5 or later model takes the form all of them accept: adaptive\n/// thinking at the lowest effort.\nfn claude_thinking_always_on(model_id: &str) -> bool {\n    if !model_id.contains(\"claude\") {\n        return false;\n    }\n    model_id.contains(\"fable\")\n        || model_id.contains(\"mythos\")\n        || claude_version(model_id).is_some_and(|(major, _)| major >= 5)\n}\n\n/// Whether `model` keeps thinking on when the request asks for\n/// [`ReasoningLevel::Off`]. Thinking spends output tokens, so a caller that\n/// sizes `max_tokens` for a no-thinking reply has to leave room for it.\n#[must_use]\npub fn keeps_thinking_when_off(model: &str) -> bool {\n    let model_id = model.to_ascii_lowercase();\n    claude_thinking_always_on(&model_id)\n        || is_k3_model(&model_id)\n        || model_id.contains(\"kimi-k2.7-code\")\n        // MiniMax only ships `adaptive`; an `Off` request still thinks.\n        || model_id.contains(\"minimax\")\n}\n\nfn claude_summarized_display(model_id: &str) -> bool {\n    let Some((major, minor)) = claude_version(model_id) else {\n        return false;\n    };\n    major > 4 || (major == 4 && minor >= 7)\n}\n\n/// `claude-opus-4.7` and `claude-4.7-opus` both parse. An 8-digit release\n/// date after the major is not a minor version.\nfn claude_version(model_id: &str) -> Option<(u32, u32)> {\n    let rest = model_id.split(\"claude-\").nth(1)?;\n    let rest = if rest.starts_with(|ch: char| ch.is_ascii_digit()) {\n        rest\n    } else {\n        rest.split_once('-').map(|(_, after)| after)?\n    };\n    let major_len = rest\n        .find(|ch: char| !ch.is_ascii_digit())\n        .unwrap_or(rest.len());\n    if major_len == 0 {\n        return None;\n    }\n    let major = rest[..major_len].parse().ok()?;\n    let rest = &rest[major_len..];\n    let minor = if let Some(digits) = rest.strip_prefix(['.', '-']) {\n        let len = digits\n            .find(|ch: char| !ch.is_ascii_digit())\n            .unwrap_or(digits.len());\n        if (1..=2).contains(&len) {\n            digits[..len].parse().unwrap_or(0)\n        } else {\n            0\n        }\n    } else {\n        0\n    };\n    Some((major, minor))\n}\n\n#[cfg(test)]\nmod tests;\n","crates/mycode-app/src/magpie.rs":"//! The local magpie gateway: its model list and the one provider row MCode\n//! runs on.\n//!\n//! magpie runs the gateway at `127.0.0.1` and writes `settings.magpie` through\n//! its agent plugin. MCode ships no vendors of its own: the catalog, the key,\n//! the model, and the MCP servers all come from magpie.\n\nuse std::time::Duration;\n\nuse mycode_agent::catalog::{CatalogDocument, CatalogProvider};\nuse mycode_agent::{MAGPIE_PROVIDER_ID, MagpieSettings, ProviderSettings};\n\n/// Request timeout for the gateway's model list. It answers locally.\nconst MODELS_TIMEOUT: Duration = Duration::from_secs(5);\n/// Largest `/v1/models` body read.\nconst MAX_MODELS_BYTES: usize = 4 * 1024 * 1024;\n\n/// The gateway binding one request runs against.\n#[derive(Clone, Debug)]\npub(crate) struct Gateway {\n    base_url: String,\n    api_key: String,\n}\n\n/// The model list fetched from one gateway, with the time it was read.\npub(crate) struct FetchedModels {\n    pub(crate) provider: CatalogProvider,\n    pub(crate) fetched_at: u64,\n}\n\nimpl Gateway {\n    /// Binds one enabled magpie section.\n    pub(crate) fn from_settings(magpie: &MagpieSettings) -> Result<Self, String> {\n        if !magpie.is_active() {\n            return Err(\"magpie is not connected: pick a model in magpie first\".to_owned());\n        }\n        Ok(Self {\n            base_url: magpie.endpoint_base().to_owned(),\n            api_key: magpie.api_key.clone(),\n        })\n    }\n\n    /// `GET /v1/models` as a provider row.\n    pub(crate) async fn fetch_models(&self) -> Result<FetchedModels, String> {\n        let client = reqwest::Client::builder()\n            .timeout(MODELS_TIMEOUT)\n            .build()\n            .map_err(|error| format!(\"magpie client: {error}\"))?;\n        let url = format!(\"{}/models\", self.base_url);\n        let response = client\n            .get(&url)\n            .header(\"authorization\", format!(\"Bearer {}\", self.api_key))\n            .header(\n                \"user-agent\",\n                format!(\"mycode-magpie/{}\", env!(\"CARGO_PKG_VERSION\")),\n
