w, cx);\n                },\n                cx,\n            ))\n            .children(menu)\n            .into_any_element()\n    };\n    let session_project = workspace\n        .vm()\n        .active\n        .as_ref()\n        .and_then(|conversation| {\n            workspace\n                .vm()\n                .session_projects\n                .iter()\n                .find(|(id, _)| *id == conversation.session_id)\n                .map(|(_, project)| project.clone())\n        })\n        .or_else(|| workspace.vm().project_dir.clone());\n    let project_chip_label: SharedString = session_project\n        .as_deref()\n        .map(project_label)\n        .unwrap_or_else(|| t(\"Set folder\", \"选择目录\").to_owned())\n        .into();\n    // The chip shows the folder's basename; the tooltip carries the full path.\n    let project_tooltip: Option<SharedString> = session_project.as_deref().map(SharedString::from);\n    // The ask card docks right above the input like Devin's: a frosted\n    // panel, one question at a time. It is built here — before `theme`\n    // borrows `cx` — so the builder chain below stays borrow-free.\n    let ask_card = if has_pending_ask {\n        Some(super::ask::render_ask_card(workspace, window, cx))\n    } else {\n        None\n    };\n    let theme = cx.theme();\n    // The manual-compact wait lives where the queue and ask cards do: a\n    // frosted row above the composer, gone when `CompactFinished` lands.\n    let compact_card = compacting.then(|| {\n        skin::popover_panel(\"compact-card\", theme)\n            .w_full()\n            .flex()\n            .flex_row()\n            .items_center()\n            .gap_2()\n            .px_4()\n            .py_2()\n            .child(crate::ui::lamp(crate::ui::desk::Desk::of(theme).violet))\n            .child(\n                div()\n                    .text_sm()\n                    .child(t(\"Compacting context…\", \"正在压缩上下文…\")),\n            )\n            .child(div().flex_1())\n            .child(\n                div()\n                    .text_xs()\n                    .text_color(theme.muted_foreground)\n                    .child(t(\"Ctrl+Enter cancels\", \"Ctrl+Enter 取消\")),\n            )\n            .into_any_element()\n    });\n\n    div()\n        .id(\"composer\")\n        .flex()\n        .flex_row()\n        .justify_center()\n        .w_full()\n        .px_4()\n        .pt(skin::space(1))\n        .pb(skin::space(3))\n        .child(\n            div()\n                .id(\"composer-column\")\n                .w_full()\n                .max_w(px(COMPOSER_MAX_PX))\n                .min_w_0()\n                .flex()\n                .flex_col()\n                .gap_1()\n                .when_some(steer_panel, |this, steers| this.child(steers))\n                .when_some(compact_card, |this, card| this.child(card))\n                .when_some(ask_card, |this, card| this.child(card))\n                .child(\n                    div()\n                        .id(\"composer-card\")\n                        .flex()\n                        .flex_col()\n                        .justify_between()\n                        .gap(skin::space(2))\n                        .px(skin::space(3))\n                        .py(skin::space(2))\n                        .w_full()\n                        .min_h(px(56.))\n                        .rounded(px(20.))\n                        .border_1()\n                        .border_color(skin::glass_border(theme))\n                        .bg(skin::popover(theme))\n                        .shadow(composer_elevation(theme.is_dark()))\n                        // Dropping a picture or a code file attaches it to\n                        // the next prompt; folders still bind the project.\n                        .can_drop(|value, _, _| value.is::<gpui_kit::ExternalPaths>())\n                        .on_drop(cx.listener(\n                            |workspace, paths: &gpui_kit::ExternalPaths, _, cx| {\n                                workspace.on_drop_attachments(paths.paths(), cx);\n                            },\n                        ))\n                        .when(!workspace.attachments.is_empty(), |this| {\n                            this.child(super::render_attachment_chips(workspace, cx))\n                        })\n                        .child(\n                            div()\n                                .id(\"composer-input\")\n                                .flex()\n                                .flex_col()\n                                .w_full()\n                                .min_w_0()\n                                .text_sm()\n                                .child(\n                                    // The state pins the field at three\n                                    // rows (auto_grow 3..3): long drafts\n                                    // scroll inside instead of growing\n                                    // the composer card.\n                                    Textarea::new(&composer)\n                                        .appearance(false)\n                                        .bordered(false)\n                                        .w_full()\n                                        // A clipboard picture becomes an\n                                        // attachment; other pastes fall\n                                        // through to the text insertion.\n                                        .on_paste(move |item, _, cx| {\n                                            paste_target.update(cx, |workspace, cx| {\n                                                workspace.on_composer_paste(item, cx)\n                                            })\n                                        }),\n                                ),\n                        )\n                        .child(\n                            div()\n                                .id(\"composer-chip-row\")\n                                .flex()\n                                .flex_row()\n                                .flex_wrap()\n                                .items_center()\n                                .gap(px(6.))\n                                .w_full()\n                                .min_w_0()\n                                .child(composer_pill_chip(\n                                    ComposerChip {\n                                        id: \"project\",\n                                        icon: Some(IconName::Folder),\n                                        label: project_chip_label,\n                                        tooltip: project_tooltip,\n                                        clip_start: false,\n                                        open: false,\n                                        max_w: px(148.),\n                                    },\n                                    |workspace, _window, cx| {\n                                        workspace.on_open_chat_folder_picker(cx);\n                                    },\n                                    cx,\n                                ))\n                                .child(model_chip)\n                                .when_some(thinking_chip, |this, chip| this.child(chip))\n                                .child(div().flex_1().min_w(px(8.)))\n                                .when_some(context_meter(workspace), |this, meter| {\n                                    this.child(composer_meter_chip(meter, theme))\n                                })\n                                .child(composer_palette_hint(cx))\n                                // While a turn runs the arrow stays: it\n                                // steers the draft in; the stop sits beside\n                                // it.\n                                .when(sending && has_draft, |this| {\n                                    this.child(composer_steer_button(cx))\n                                })\n                                .child(composer_round_button(sending, can_send, cx)),\n                        ),\n                ),\n        )\n}\n\nfn composer_elevation(dark: bool) -> Vec<BoxShadow> {\n    let alpha = if dark { 0.35 } else { 0.08 };\n    vec![BoxShadow::new(px(0.), px(8.), hsla(0., 0., 0., alpha)).blur_radius(px(24.))]\n}\n\n/// Send arrow while idle, stop square while a turn runs.\n///\n/// Stop ends the whole turn and every subagent. It sits where the send\n/// arrow sits.\nfn composer_round_button(\n    sending: bool,\n    can_send: bool,\n    cx: &Context<Workspace>,\n) -> impl IntoElement {\n    let theme = cx.theme();\n    let active = sending || can_send;\n    div()\n        .id(if sending {\n            \"composer-stop\"\n        } else {\n            \"composer-send\"\n        })\n        .size(px(30.))\n        .flex_shrink_0()\n        .ml_auto()\n        .rounded_full()\n        .flex()\n        .items_center()\n        .justify_center()\n        .text_color(if active {\n            theme.foreground\n        } else {\n            theme.muted_foreground\n        })\n        .when(active, |this| {\n            this.cursor_pointer()\n                .hover(|style| style.bg(theme.secondary_hover))\n        })\n        .on_click(cx.listener(move |workspace, _, window, cx| {\n            if sending {\n                workspace.on_cancel_chat(cx);\n            } else if can_send {\n                workspace.on_send(window, cx);\n            }\n        }))\n        // Two round icons sit side by side while a turn runs; the tooltip\n        // tells the queueing arrow from the stop that ends everything.\n        .when(sending, |this| {\n            this.tooltip(|window, cx| {\n                Tooltip::new(t(\n                    \"Stop this turn and every subagent\",\n                    \"停止本轮和所有子代理\",\n                ))\n                .build(window, cx)\n            })\n        })\n        .when(sending, |this| {\n            this.child(div().size(px(9.)).rounded(px(2.)).bg(theme.foreground))\n        })\n        .when(!sending, |this| {\n            this.child(Icon::new(IconName::ArrowUp).small())\n        })\n}\n\n/// The steer arrow shown next to the stop square while a turn runs: click\n/// hands the draft to the running turn, same as Enter and Ctrl+G.\nfn composer_steer_button(cx: &Context<Workspace>) -> impl IntoElement {\n    let theme = cx.theme();\n    div()\n        .id(\"composer-steer-running\")\n        .size(px(30.))\n        .flex_shrink_0()\n        .rounded_full()\n        .flex()\n        .items_center()\n        .justify_center()\n        .text_color(theme.foreground)\n        .cursor_pointer()\n        .hover(|style| style.bg(theme.secondary_hover))\n        .on_click(cx.listener(move |workspace, _, _, cx| {\n            workspace.on_steer_send(cx);\n        }))\n        .tooltip(|window, cx| {\n            Tooltip::new(t(\n                \"Steer this turn without stopping it (Ctrl+G)\",\n                \"引导本轮任务，不打断（Ctrl+G）\",\n            ))\n            .build(window, cx)\n        })\n        .child(Icon::new(IconName::ArrowUp).small())\n}\n\n/// One pill chip in the composer row (folder, model, thinking). The label\n/// truncates at `max_w`; when `tooltip` is set, hovering shows the\n/// untruncated text. `clip_start` drops the label's head instead of its\n/// tail, so a `Provider · Model` keeps the model visible.\nstruct ComposerChip {\n    id: &'static str,\n    icon: Option<IconName>,\n    label: SharedString,\n    tooltip: Option<SharedString>,\n    clip_start: bool,\n    open: bool,\n    max_w: gpui_kit::Pixels,\n}\n\nfn composer_pill_chip(\n    chip: ComposerChip,\n    on_click: impl Fn(&mut Workspace, &mut Window, &mut Context<Workspace>) + 'static,\n    cx: &Context<Workspace>,\n) -> impl IntoElement {\n    let theme = cx.theme();\n    let ink = if chip.open {\n        theme.foreground\n    } else {\n        theme.muted_foreground\n    };\n    let label = if chip.clip_start {\n        div()\n            .min_w_0()\n            .overflow_hidden()\n            .whitespace_nowrap()\n            .text_ellipsis_start()\n            .child(chip.label)\n    } else {\n        div().min_w_0().truncate().child(chip.label)\n    };\n    div()\n        .id(format!(\"composer-{}-chip\", chip.id))\n        .flex()\n        .flex_row()\n        .items_center()\n        .flex_shrink_1()\n        .gap(px(5.))\n        .min_w_0()\n        .max_w(chip.max_w)\n        .px(px(9.))\n        .h(px(26.))\n        .rounded(px(6.))\n        .when(chip.open, |this| this.bg(theme.secondary_hover))\n        .text_xs()\n        .cursor_pointer()\n        .text_color(ink)\n        .hover(|this| this.bg(theme.secondary_hover).text_color(theme.foreground))\n        .on_click(cx.listener(move |workspace, _, window, cx| {\n            on_click(workspace, window, cx);\n        }))\n        .when_some(chip.tooltip, |this, text| {\n            this.tooltip(move |window, cx| Tooltip::new(text.clone()).build(window, cx))\n        })\n        .when_some(chip.icon, |this, icon| {\n            this.child(Icon::new(icon).xsmall().flex_shrink_0())\n        })\n        .child(label)\n        .child(Icon::new(IconName::ChevronDown).xsmall().flex_shrink_0())\n}\n\n/// Quiet shortcut badge that opens the command palette (`⌘K` / `Ctrl+K`).\nfn composer_palette_hint(cx: &Context<Workspace>) -> impl IntoElement {\n    let theme = cx.theme();\n    div()\n        .id(\"composer-palette-hint\")\n        .flex()\n        .flex_shrink_0()\n        .items_center()\n        .justify_center()\n        .px(px(7.))\n        .h(px(24.))\n        .rounded(px(6.))\n        .text_xs()\n        .text_color(theme.muted_foreground)\n        .cursor_pointer()\n        .hover(|this| this.bg(theme.secondary_hover).text_color(theme.foreground))\n        .on_click(cx.listener(|workspace, _, window, cx| {\n            workspace.toggle_command_palette(window, cx);\n        }))\n        .child(shortcut_label())\n}\n\n/// Steers the running turn has not read yet. The agent takes them before\n/// its next step; one the turn ends without reading moves to the queue.\nfn render_pending_steers(items: &[String], cx: &Context<Workspace>) -> impl IntoElement {\n    let theme = cx.theme();\n    let desk = Desk::of(theme);\n    skin::popover_panel(\"composer-steers\", theme)\n        .flex()\n        .flex_col()\n        .gap_1()\n        .w_full()\n        .px_3()\n        .py_2()\n        .child(\n            div()\n                .flex()\n                .flex_row()\n                .items_center()\n                .gap_2()\n                .child(crate::ui::lamp(desk.violet))\n                .child(\n                    div()\n                        .flex_shrink_0()\n                        .text_xs()\n                        .font_weight(crate::ui::skin::WEIGHT_STRONG)\n                        .text_color(desk.faint)\n                        .child(format!(\"{}  {}\", t(\"STEERING\", \"引导中\"), items.len())),\n                )\n                .child(\n                    div()\n                        .flex_1()\n                        .min_w_0()\n                        .truncate()\n                        .text_xs()\n                        .text_color(theme.muted_foreground)\n                        .child(t(\n                            \"The agent reads these before its next step.\",\n                            \"代理在下一步之前读取。\",\n                        )),\n                ),\n        )\n        .children(items.iter().enumerate().map(|(index, text)| {\n            let preview: SharedString = ellipsis(text, 72).into();\n            div()\n                .id(SharedString::from(format!(\"steer-{index}\")))\n                .min_w_0()\n                .h(px(24.))\n                .pl(px(15.))\n                .flex()\n                .items_center()\n                .text_xs()\n                .text_color(theme.muted_foreground)\n                .child(div().min_w_0().flex_1().truncate().child(preview))\n        }))\n}\n\nfn composer_meter_chip(\n    meter: ComposerMeter,\n    theme: &gpui_kit::component::theme::Theme,\n) -> impl IntoElement {\n    div()\n        .id(\"composer-context-meter\")\n        .flex()\n        .flex_shrink_1()\n        .items_center()\n        .gap(skin::space(1))\n        .min_w_0()\n        .max_w(px(220.))\n        .px(skin::space(2))\n        .h(px(26.))\n        .rounded(px(6.))\n        .text_xs()\n        // The resting label is the window ratio alone; the cache figures\n        // and the turn's in/out ride the hover tooltip instead of crowding\n        // the chip row.\n        .when(!meter.detail.is_empty(), |this| {\n            let detail: SharedString = meter.detail.clone().into();\n            this.tooltip(move |window, cx| Tooltip::new(detail.clone()).build(window, cx))\n        })\n        .when_some(meter.parts.remaining_percent, |row, percent| {\n            row.child(cache_ring(percent, theme))\n        })\n        .when(!meter.parts.ratio.is_empty(), |row| {\n            row.child(\n                div()\n                    .min_w_0()\n                    .truncate()\n                    .text_color(theme.muted_foreground)\n                    .child(meter.parts.ratio.clone()),\n            )\n        })\n}\n\n/// The visible arc: the share of the window in use.\nfn used_percent(remaining_percent: u64) -> u64 {\n    100 - remaining_percent.min(100)\n}\n\n/// A 16px ring whose arc is the share of the model's context window in use.\n///\n/// The ring fills as the latest prompt grows, so it matches the `used /\n/// window` ratio beside it; a free-budget ring read backwards and looked\n/// nearly full at 20% used. The cache-hit figure stays on the hover detail.\nfn cache_ring(\n    remaining_percent: u64,\n    theme: &gpui_kit::component::theme::Theme,\n) -> impl IntoElement {\n    div()\n        .id(\"composer-cache-ring\")\n        .flex_shrink_0()\n        .size(skin::space(4))\n        .child(\n            // The kit sizes the ring in rems; fill the fixed slot so the L\n            // and XL interface scales do not push it into the label.\n            ProgressCircle::new(\"composer-cache-ring-progress\")\n                .value(used_percent(remaining_percent) as f32)\n                .color(theme.primary)\n                .size_full(),\n        )\n}\n\n/// The chip keeps the prompt/window ratio on screen; `detail` carries the\n/// cache share, the cache-read count, and the turn's in/out for the hover\n/// tooltip.\nstruct ComposerMeter {\n    parts: crate::view_model::ContextMeterParts,\n    detail: String,\n}\n\n/// Latest prompt size and cache read, shown on the chip row itself.\n///\n/// The inspector has the same figures, but it stays closed until the title\n/// bar opens it. The chip reads `used / window` at rest; hovering fills in\n/// the cache and token detail.\nfn context_meter(workspace: &Workspace) -> Option<ComposerMeter> {\n    let vm = workspace.vm();\n    let used = vm.context_used;\n    let cached = vm.context_cache;\n    let window = crate::view_model::model_context_window(vm);\n    if used == 0 && cached == 0 && window == 0 {\n        return None;\n    }\n    // With no usage yet the chip still shows `0 / window`, so the budget is\n    // visible from the first message instead of appearing after the first\n    // reply.\n    // The hit and cache figures are the latest prompt's; the in/out sums are\n    // the whole turn's, so each carries its own scope label.\n    let parts = crate::view_model::context_meter_parts(\n        used,\n        window,\n        cached,\n        t(\"cached\", \"缓存\"),\n        t(\"last request hit\", \"最近请求命中\"),\n    );\n    let selected_model = vm.selected_model.clone();\n    let model_of = |turn: &crate::view_model::TurnStats| {\n        selected_model\n            .as_deref()\n            .is_none_or(|selected| turn.model == selected)\n    };\n    let turn = vm\n        .live_turn\n        .as_ref()\n        .filter(|turn| model_of(turn))\n        .map(|turn| (t(\"This turn, total\", \"本轮合计\"), turn))\n        .or_else(|| {\n            vm.last_turn\n                .as_ref()\n                .filter(|turn| model_of(turn))\n                .map(|turn| (t(\"Last turn, total\", \"上一轮合计\"), turn))\n        });\n    let mut detail: Vec<String> = Vec::new();\n    if !parts.hit.is_empty() {\n        detail.push(parts.hit.clone());\n    }\n    if !parts.cache.is_empty() {\n        detail.push(parts.cache.clone());\n    }\n    if let Some((label, turn)) = turn {\n        detail.push(format!(\n            \"{label} {} {} · {} {}\",\n            crate::ui::compact_count(turn.input),\n            t(\"in\", \"入\"),\n            crate::ui::compact_count(turn.output),\n            t(\"out\", \"出\")\n        ));\n    }\n    let meter = ComposerMeter {\n        detail: detail.join(\" · \"),\n        parts,\n    };\n    (!meter.parts.ratio.is_empty() || !meter.parts.cache.is_empty()).then_some(meter)\n}\n\nfn model_button_label(vm: &WorkspaceState) -> String {\n    crate::ui::model_picker::selected_model_label(vm)\n}\n\n/// Chip label for the effective thinking level.\n///\n/// Labels stay English and short: the chip is at most 116 px wide, and\n/// longer spellings such as \"Thinking · Default\" were cut to \"Thinking · D…\".\n/// The menu rows keep the longer descriptions.\nfn thinking_button_label(vm: &WorkspaceState) -> String {\n    thinking_chip_label(&selected_reasoning_level(vm)).to_owned()\n}\n\nfn thinking_chip_label(level: &str) -> &str {\n    match level {\n        \"default\" => \"Thinking\",\n        \"off\" => \"Thinking off\",\n        \"on\" => \"Thinking on\",\n        \"minimal\" => \"Minimal\",\n        \"low\" => \"Low\",\n        \"medium\" => \"Medium\",\n        \"high\" => \"High\",\n        \"xhigh\" => \"Extra high\",\n        \"max\" => \"Max\",\n        other => other,\n    }\n}\n\n#[cfg(test)]\nmod tests;\n\n#[cfg(all(test, feature = \"test-support\"))]\nmod wrap_layout;\n","crates/mycode-desktop/src/workspace/composer_send.rs":"//! Composer submit, steer, and stop controls. The product logic —\n//! welcome-desk starts, steer-send, interrupt-send, cancels — lives in the\n//! frontend driver (`submit`, `steer_send`, `interrupt_send`); this file\n//! keeps the gpui key handling and click propagation.\nuse gpui_kit::{Context, Window};\n\nuse super::Workspace;\nuse crate::view_model::FrontendAction;\n\nimpl Workspace {\n    pub(crate) fn on_send(&mut self, _window: &mut Window, cx: &mut Context<Self>) {\n        // A model can be switched after the picture was picked; the send is\n        // the last point where the promise \"images only go to a vision\n        // model\" can be kept.\n        if !self.attachments.images.is_empty() && !self.selected_model_takes_images() {\n            self.push_toast(\n                crate::i18n::t(\n                    \"The selected model cannot see images; remove them or pick a vision model.\",\n                    \"当前模型看不了图片，请去掉图片或选择支持图片的模型。\",\n                ),\n                super::toasts::ToastKind::Warning,\n                cx,\n            );\n            return;\n        }\n        let draft = self.composer.read(cx).value().to_string();\n        // The driver decides whether the message goes out and hands the\n        // attachments back when it does not, so a refused send (no folder,\n        // a held welcome send, a running turn) keeps the chips on screen.\n        let attachments = std::mem::take(&mut self.attachments);\n        let returned = self.driver_take(|d, fx| d.submit_with(&draft, attachments, fx), cx);\n        if let Some(attachments) = returned {\n            self.attachments = attachments;\n        }\n    }\n\n    /// Ctrl+G (Cmd+G on macOS), and the arrow beside Stop: hands the draft to\n    /// the running turn without stopping it. With nothing to steer it keeps\n    /// the draft and says why, so a keypress never sends by surprise.\n    pub(crate) fn on_steer_send(&mut self, cx: &mut Context<Self>) {\n        if !self.attachments.is_empty() {\n            self.push_toast(\n                crate::i18n::t(\n                    \"Attachments can only go with a normal send.\",\n                    \"附件只能随普通发送一起发出。\",\n                ),\n                super::toasts::ToastKind::Info,\n                cx,\n            );\n            return;\n        }\n        let draft = self.composer.read(cx).value().to_string();\n        self.driver_do(|d, fx| d.steer_send(&draft, fx), cx);\n    }\n\n    /// Opens or closes the detail card for one running subagent.\n    pub(crate) fn on_open_subagent(&mut self, call_id: &str, cx: &mut Context<Self>) {\n        let next = if call_id.is_empty() || self.vm().subagent_window.as_deref() == Some(call_id) {\n            None\n        } else {\n            Some(call_id.to_owned())\n        };\n        self.apply_action(FrontendAction::SubagentWindowChanged(next), cx);\n    }\n\n    /// Opens or closes the full working-tree changes drawer.\n    pub(crate) fn on_toggle_changes_panel(&mut self, open: bool, cx: &mut Context<Self>) {\n        self.apply_action(FrontendAction::ChangesPanelToggled(open), cx);\n    }\n\n    /// Stops one running subagent. The parent turn and the other children stay.\n    pub(crate) fn on_cancel_subagent(&mut self, call_id: &str, cx: &mut Context<Self>) {\n        self.driver_do(|d, fx| d.cancel_subagent(call_id, fx), cx);\n    }\n\n    /// Aborts the in-flight turn; its terminal event resets the sending state.\n    /// Steers the turn never read come back to the composer.\n    pub(crate) fn on_cancel_chat(&mut self, cx: &mut Context<Self>) {\n        self.driver_do(|d, fx| d.cancel_chat(fx), cx);\n    }\n}\n","crates/mycode-desktop/src/workspace/clipboard.rs":"//! Clipboard pictures for the composer.\n//!\n//! A paste whose clipboard holds a picture attaches it to the next prompt\n//! instead of typing anything; a paste whose text is one image path attaches\n//! that file. gpui reads the platform clipboard, so PNG, JPEG, WebP, and GIF\n//! bytes are used as they are, and a bitmap (a Windows screenshot) or a TIFF\n//! (a macOS one) is re-encoded as PNG because providers decode neither. A\n//! picture that cannot be used reports why; a clipboard that holds only text\n//! stays text.\n\nuse std::path::{Path, PathBuf};\n\nuse gpui_kit::{ClipboardEntry, ClipboardItem, ImageFormat};\nuse mycode_frontend::MAX_IMAGE_BYTES;\n\nuse crate::i18n::t;\n\n/// One picture read out of the clipboard or a pasted path.\npub(super) struct ClipboardPicture {\n    /// Encoded bytes in the format `mime` names.\n    pub(super) bytes: Vec<u8>,\n    /// One of [`mycode_frontend::IMAGE_MEDIA_TYPES`].\n    pub(super) mime: &'static str,\n}\n\nimpl ClipboardPicture {\n    /// Display name for the attachment chip.\n    pub(super) fn file_name(&self) -> String {\n        let extension = match self.mime {\n            \"image/jpeg\" => \"jpg\",\n            \"image/gif\" => \"gif\",\n            \"image/webp\" => \"webp\",\n            _ => \"png\",\n        };\n        format!(\"image.{extension}\")\n    }\n\n    /// The picture as the composer stores it: base64 in `mime`'s format.\n    pub(super) fn base64(&self) -> String {\n        use base64::Engine as _;\n        base64::engine::general_purpose::STANDARD.encode(&self.bytes)\n    }\n}\n\n/// Reads the picture a paste carries: the clipboard's own picture, or the\n/// image file its text names.\n///\n/// # Errors\n///\n/// Returns a message when a picture is present but cannot be used.\npub(super) fn pasted(item: &ClipboardItem) -> Result<Option<ClipboardPicture>, String> {\n    if let Some(picture) = clipboard_picture(item)? {\n        return Ok(Some(picture));\n    }\n    match item.text() {\n        Some(text) => picture_at(&text),\n        None => Ok(None),\n    }\n}\n\nfn clipboard_picture(item: &ClipboardItem) -> Result<Option<ClipboardPicture>, String> {\n    let mut unusable = false;\n    for entry in item.entries() {\n        let ClipboardEntry::Image(image) = entry else {\n            continue;\n        };\n        if image.bytes.len() > MAX_IMAGE_BYTES {\n            return Err(t(\"image is larger than 3.75 MB\", \"图片超过 3.75 MB\").to_owned());\n        }\n        if let Some(mime) = mycode_frontend::image_media_type(&image.bytes) {\n            return Ok(Some(ClipboardPicture {\n                bytes: image.bytes.clone(),\n                mime,\n            }));\n        }\n        if matches!(image.format, ImageFormat::Bmp | ImageFormat::Tiff)\n            && let Some(bytes) = reencoded_as_png(&image.bytes)\n        {\n            return Ok(Some(ClipboardPicture {\n                bytes,\n                mime: \"image/png\",\n            }));\n        }\n        unusable = true;\n    }\n    if unusable {\n        return Err(t(\"unsupported image type\", \"不支持这种图片格式\").to_owned());\n    }\n    Ok(None)\n}\n\n/// Reads one image file referenced by pasted text, if `text` names one.\n///\n/// Quoted paths (`\"C:\\Shots\\a b.png\"`) and `file://` URLs are accepted; any\n/// other text belongs to the composer. Oversized files are refused so a\n/// paste cannot block the UI on a huge read.\nfn picture_at(text: &str) -> Result<Option<ClipboardPicture>, String> {\n    let trimmed = text.trim();\n    if trimmed.is_empty() || trimmed.contains(['\\n', '\\r']) {\n        return Ok(None);\n    }\n    let path = local_path(trimmed);\n    if !path.is_file() {\n        return Ok(None);\n    }\n    read_file(&path).map(Some)\n}\n\nfn read_file(path: &Path) -> Result<ClipboardPicture, String> {\n    let length = std::fs::metadata(path)\n        .map_err(|error| format!(\"{}: {error}\", path.display()))?\n        .len();\n    if length > MAX_IMAGE_BYTES as u64 {\n        return Err(format!(\n            \"{}: {}\",\n            path.display(),\n            t(\"image is larger than 3.75 MB\", \"图片超过 3.75 MB\")\n        ));\n    }\n    let bytes = std::fs::read(path).map_err(|error| format!(\"{}: {error}\", path.display()))?;\n    let mime = mycode_frontend::image_media_type(&bytes).ok_or_else(|| {\n        format!(\n            \"{}: {}\",\n            path.display(),\n            t(\"unsupported image type\", \"不支持这种图片格式\")\n        )\n    })?;\n    Ok(ClipboardPicture { bytes, mime })\n}\n\n/// Re-encodes a bitmap or a TIFF as PNG. `None` when the bytes are not a\n/// picture the decoder can read.\nfn reencoded_as_png(bytes: &[u8]) -> Option<Vec<u8>> {\n    use std::io::Cursor;\n\n    let picture = image::load_from_memory(bytes).ok()?;\n    let mut png = Vec::new();\n    picture\n        .write_to(&mut Cursor::new(&mut png), image::ImageFormat::Png)\n        .ok()?;\n    Some(png)\n}\n\n/// The local path a pasted path or `file://` URL names.\nfn local_path(text: &str) -> PathBuf {\n    let trimmed = text.trim().trim_matches(['\"', '\\'']);\n    match trimmed.strip_prefix(\"file://\") {\n        Some(rest) => {\n            let rest = rest.strip_prefix(\"localhost\").unwrap_or(rest);\n            PathBuf::from(file_url_path(rest))\n        }\n        None => PathBuf::from(trimmed),\n    }\n}\n\n/// A Windows drive URL spells the path `/C:/x`; the leading slash is not part\n/// of the file name.\nfn file_url_path(rest: &str) -> String {\n    let bytes = rest.as_bytes();\n    if bytes.len() >= 3 && bytes[0] == b'/' && bytes[1].is_ascii_alphabetic() && bytes[2] == b':' {\n        return rest[1..].to_owned();\n    }\n    rest.to_owned()\n}\n\n#[cfg(test)]\nmod tests {\n    use std::path::PathBuf;\n\n    use super::{local_path, picture_at, reencoded_as_png};\n\n    /// The leading bytes are all the path reader checks; the picture itself\n    /// is never decoded.\n    fn write_png(label: &str) -> PathBuf {\n        let path = std::env::temp_dir().join(format!(\n            \"mycode-paste-{label}-{}-{}.png\",\n            std::process::id(),\n            std::time::SystemTime::now()\n                .duration_since(std::time::UNIX_EPOCH)\n                .map(|elapsed| elapsed.subsec_nanos())\n                .unwrap_or_default()\n        ));\n        std::fs::write(\n            &path,\n            [0x89, b'P', b'N', b'G', 0x0D, 0x0A, 0x1A, 0x0A, 0, 0],\n        )\n        .expect(\"png\");\n        path\n    }\n\n    #[test]\n    fn a_pasted_image_path_is_recognized() {\n        let path = write_png(\"paste\");\n        let text = path.display().to_string();\n        let picture = picture_at(&text).expect(\"read\").expect(\"picture\");\n        assert_eq!(picture.mime, \"image/png\");\n        assert_eq!(picture.file_name(), \"image.png\");\n        // A path with spaces is often pasted quoted; the quotes are not the\n        // name.\n        let quoted = format!(\"\\\"{text}\\\"\");\n        assert!(picture_at(&quoted).expect(\"read\").is_some());\n        let _ = std::fs::remove_file(&path);\n    }\n\n    #[test]\n    fn ordinary_text_stays_text() {\n        assert!(picture_at(\"hello world\").expect(\"read\").is_none());\n        assert!(picture_at(\"two\\nlines\").expect(\"read\").is_none());\n        assert!(picture_at(\"\").expect(\"read\").is_none());\n        assert!(\n            picture_at(\"C:/definitely/not/here.png\")\n                .expect(\"read\")\n                .is_none()\n        );\n    }\n\n    #[test]\n    fn a_file_url_names_the_same_picture() {\n        let path = write_png(\"url\");\n        let url = format!(\"file:///{}\", path.display().to_string().replace('\\\\', \"/\"));\n        assert!(picture_at(&url).expect(\"read\").is_some());\n        let _ = std::fs::remove_file(&path);\n    }\n\n    #[test]\n    fn a_windows_drive_url_keeps_its_letter() {\n        assert_eq!(\n            local_path(\"file:///C:/x/a.png\"),\n            PathBuf::from(\"C:/x/a.png\")\n        );\n        assert_eq!(\n            local_path(\"file://localhost/C:/x/a.png\"),\n            PathBuf::from(\"C:/x/a.png\")\n        );\n    }\n\n    /// A 2x2 32-bit BI_RGB bitmap, the shape a screenshot tool publishes.\n    fn tiny_bmp() -> Vec<u8> {\n        let header_size = 40u32;\n        let mut dib = Vec::new();\n        dib.extend_from_slice(&header_size.to_le_bytes());\n        dib.extend_from_slice(&2i32.to_le_bytes());\n        dib.extend_from_slice(&2i32.to_le_bytes());\n        dib.extend_from_slice(&1u16.to_le_bytes());\n        dib.extend_from_slice(&32u16.to_le_bytes());\n        dib.extend_from_slice(&0u32.to_le_bytes());\n        dib.extend_from_slice(&16u32.to_le_bytes());\n        dib.extend_from_slice(&[0u8; 16]);\n        for color in [\n            [0, 0, 255, 0],\n            [0, 255, 0, 0],\n            [255, 0, 0, 0],\n            [255, 255, 255, 0],\n        ] {\n            dib.extend_from_slice(&color);\n        }\n        let mut bmp = Vec::new();\n        bmp.extend_from_slice(b\"BM\");\n        bmp.extend_from_slice(&(14 + dib.len() as u32).to_le_bytes());\n        bmp.extend_from_slice(&[0u8; 4]);\n        bmp.extend_from_slice(&54u32.to_le_bytes());\n        bmp.extend_from_slice(&dib);\n        bmp\n    }\n\n    #[test]\n    fn a_bitmap_is_reencoded_as_png() {\n        let png = reencoded_as_png(&tiny_bmp()).expect(\"png\");\n        assert!(png.starts_with(&[0x89, b'P', b'N', b'G']));\n        assert_eq!(mycode_frontend::image_media_type(&png), Some(\"image/png\"));\n    }\n}\n","crates/mycode-core/src/attachments.rs":"//! User-message attachments: images the model can see and code/text files\n//! carried as fenced text.\n//!\n//! Limits live here so the composer that reads a dropped file and the core\n//! that commits it apply the same caps. The numbers follow what hosted\n//! vision APIs accept: 5 MiB of base64 per image (Anthropic, Claude Code,\n//! OpenCode's default `max_base64_bytes`), so the raw cap is 3.75 MB and the\n//! encoded payload stays under it. Text files are bounded per file and in\n//! total because they travel in the prompt on every turn.\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::message::{BinaryData, ContentBlock, TextBlock, UserMessage};\n\n/// Images one message may carry. Hosted APIs accept more, but a turn that\n/// resends four images every step already costs real tokens.\npub const MAX_ATTACHED_IMAGES: usize = 4;\n/// Raw image bytes. Base64 inflates the payload (3 bytes become 4), so this\n/// stays under 5 MiB encoded.\npub const MAX_IMAGE_BYTES: usize = 3_750_000;\n/// Encoded-image ceiling; a caller that already holds base64 checks this.\npub const MAX_IMAGE_BASE64_BYTES: usize = 5 * 1024 * 1024;\n/// Encoded ceiling for all pictures of one message. The durable user event\n/// that stores them is capped at 8 MiB, and four full-size photos would\n/// encode to 20 MiB, so the pictures share this budget.\npub const MAX_MESSAGE_IMAGE_BASE64_BYTES: usize = 6 * 1024 * 1024;\n/// Text/code files one message may carry.\npub const MAX_ATTACHED_FILES: usize = 8;\n/// One text file: past this the prompt is truncated with a visible marker.\npub const MAX_FILE_BYTES: usize = 256 * 1024;\n/// All text files together.\npub const MAX_FILES_BYTES: usize = 512 * 1024;\n\n/// Image types the composer accepts. SVG is deliberately absent: it is markup,\n/// and providers do not decode it as a picture.\npub const IMAGE_MEDIA_TYPES: [&str; 4] = [\"image/png\", \"image/jpeg\", \"image/webp\", \"image/gif\"];\n\n/// Media type from an image's leading bytes, independent of its file name.\n/// A renamed picture keeps the type the provider decodes.\n#[must_use]\npub fn image_media_type(bytes: &[u8]) -> Option<&'static str> {\n    if bytes.starts_with(&[0x89, b'P', b'N', b'G', 0x0D, 0x0A, 0x1A, 0x0A]) {\n        return Some(\"image/png\");\n    }\n    if bytes.starts_with(&[0xFF, 0xD8, 0xFF]) {\n        return Some(\"image/jpeg\");\n    }\n    if bytes.starts_with(b\"GIF87a\") || bytes.starts_with(b\"GIF89a\") {\n        return Some(\"image/gif\");\n    }\n    if bytes.len() >= 12 && &bytes[0..4] == b\"RIFF\" && &bytes[8..12] == b\"WEBP\" {\n        return Some(\"image/webp\");\n    }\n    None\n}\n\n/// Why an attachment was refused.\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum AttachError {\n    /// The message already holds [`MAX_ATTACHED_IMAGES`] images.\n    TooManyImages,\n    /// The image is larger than [`MAX_IMAGE_BYTES`] raw or\n    /// [`MAX_IMAGE_BASE64_BYTES`] encoded.\n    ImageTooLarge,\n    /// The pictures together exceed [`MAX_MESSAGE_IMAGE_BASE64_BYTES`].\n    ImagesTooLarge,\n    /// The file's media type is not one of [`IMAGE_MEDIA_TYPES`].\n    UnsupportedImage,\n    /// The message already holds [`MAX_ATTACHED_FILES`] files.\n    TooManyFiles,\n    /// The file is binary or not UTF-8 text.\n    NotText,\n    /// The files together are already at [`MAX_FILES_BYTES`].\n    FilesTooLarge,\n}\n\n/// One image held as base64, exactly as the provider APIs take it.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields)]\npub struct ImageAttachment {\n    /// Display name the transcript shows and the gateway logs.\n    pub name: String,\n    /// One of [`IMAGE_MEDIA_TYPES`].\n    pub mime_type: String,\n    /// Base64-encoded bytes.\n    pub data: String,\n}\n\n/// One text/code file carried in the prompt.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields)]\npub struct TextAttachment {\n    /// Display name; also the path the fenced block names.\n    pub name: String,\n    /// UTF-8 content, already cut to [`MAX_FILE_BYTES`] when needed.\n    pub text: String,\n    /// Content was cut at [`MAX_FILE_BYTES`]; the fence says so.\n    #[serde(default)]\n    pub truncated: bool,\n}\n\n/// The attachments of one outgoing message.\n#[derive(Clone, Debug, Default, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields, default)]\npub struct Attachments {\n    /// Pictures the model can see.\n    #[serde(skip_serializing_if = \"Vec::is_empty\")]\n    pub images: Vec<ImageAttachment>,\n    /// Files carried as text.\n    #[serde(skip_serializing_if = \"Vec::is_empty\")]\n    pub files: Vec<TextAttachment>,\n}\n\nimpl Attachments {\n    /// Whether the message carries nothing extra.\n    #[must_use]\n    pub fn is_empty(&self) -> bool {\n        self.images.is_empty() && self.files.is_empty()\n    }\n\n    /// Adds one base64 image, enforcing the image caps.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`AttachError::UnsupportedImage`], [`AttachError::ImageTooLarge`],\n    /// [`AttachError::ImagesTooLarge`], or [`AttachError::TooManyImages`].\n    pub fn push_image(\n        &mut self,\n        name: impl Into<String>,\n        mime_type: &str,\n        data: impl Into<String>,\n    ) -> Result<(), AttachError> {\n        if !IMAGE_MEDIA_TYPES.contains(&mime_type) {\n            return Err(AttachError::UnsupportedImage);\n        }\n        if self.images.len() >= MAX_ATTACHED_IMAGES {\n            return Err(AttachError::TooManyImages);\n        }\n        let data = data.into();\n        if data.len() > MAX_IMAGE_BASE64_BYTES {\n            return Err(AttachError::ImageTooLarge);\n        }\n        let encoded: usize = self.images.iter().map(|image| image.data.len()).sum();\n        if encoded.saturating_add(data.len()) > MAX_MESSAGE_IMAGE_BASE64_BYTES {\n            return Err(AttachError::ImagesTooLarge);\n        }\n        self.images.push(ImageAttachment {\n            name: name.into(),\n            mime_type: mime_type.to_owned(),\n            data,\n        });\n        Ok(())\n    }\n\n    /// Adds one text file, enforcing the file caps. Content longer than\n    /// [`MAX_FILE_BYTES`] is cut at a character boundary and marked truncated.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`AttachError::TooManyFiles`, `AttachError::FilesTooLarge`, or\n    /// `AttachError::NotText`].\n    pub fn push_file(\n        &mut self,\n        name: impl Into<String>,\n        text: impl Into<String>,\n    ) -> Result<(), AttachError> {\n        if self.files.len() >= MAX_ATTACHED_FILES {\n            return Err(AttachError::TooManyFiles);\n        }\n        let used: usize = self.files.iter().map(|file| file.text.len()).sum();\n        let room = MAX_FILES_BYTES.saturating_sub(used);\n        if room == 0 {\n            return Err(AttachError::FilesTooLarge);\n        }\n        let text = text.into();\n        let limit = MAX_FILE_BYTES.min(room);\n        let mut truncated = false;\n        let text = if text.len() > limit {\n            truncated = true;\n            cut_at_boundary(&text, limit)\n        } else {\n            text\n        };\n        self.files.push(TextAttachment {\n            name: name.into(),\n            text,\n            truncated,\n        });\n        Ok(())\n    }\n\n    /// One line per attachment, shown below the prompt in the transcript.\n    #[must_use]\n    pub fn transcript_note(&self) -> String {\n        let mut lines = Vec::with_capacity(self.images.len() + self.files.len());\n        for image in &self.images {\n            lines.push(format!(\"[image] {}\", image.name));\n        }\n        for file in &self.files {\n            lines.push(format!(\"[file] {}\", file.name));\n        }\n        lines.join(\"\\n\")\n    }\n\n    /// The provider message: the prompt, then each file as a fenced block,\n    /// then the images.\n    #[must_use]\n    pub fn user_message(&self, prompt: &str) -> UserMessage {\n        let mut text = prompt.to_owned();\n        for file in &self.files {\n            text.push_str(\"\\n\\n\");\n            text.push_str(&fenced_file(file));\n        }\n        let mut content = vec![ContentBlock::Text(TextBlock::new(text))];\n        content.extend(self.images.iter().map(|image| {\n            ContentBlock::Image(BinaryData {\n                data: image.data.clone(),\n                mime_type: image.mime_type.clone(),\n            })\n        }));\n        UserMessage { content }\n    }\n}\n\n/// Durable form of one user message that carries attachments.\n///\n/// Plain prompts keep their raw UTF-8 bytes, as every older session does.\n/// This envelope is only written when attachments exist, and its\n/// `$mycodeUser` key makes it unambiguous: a prompt that is itself JSON is\n/// never mistaken for one.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields)]\npub struct StoredUserMessage {\n    /// The text the user typed.\n    pub prompt: String,\n    /// Pictures and files sent beside it.\n    #[serde(default, skip_serializing_if = \"Attachments::is_empty\")]\n    pub attachments: Attachments,\n}\n\n/// On-disk wrapper that distinguishes this envelope from any prompt text.\n#[derive(Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct StoredEnvelope {\n    #[serde(rename = \"$mycodeUser\")]\n    message: StoredUserMessage,\n}\n\nimpl StoredUserMessage {\n    /// Reads the envelope; `None` means the payload is a plain-text prompt.\n    /// The `$mycodeUser` key must be present, so JSON a user typed stays text.\n    #[must_use]\n    pub fn from_payload(payload: &[u8]) -> Option<Self> {\n        serde_json::from_slice::<StoredEnvelope>(payload)\n            .ok()\n            .map(|envelope| envelope.message)\n    }\n\n    /// Encodes the durable payload.\n    ///\n    /// # Errors\n    ///\n    /// Returns the serializer error (a stored message is always plain data).\n    pub fn to_payload(&self) -> Result<Vec<u8>, serde_json::Error> {\n        serde_json::to_vec(&StoredEnvelope {\n            message: self.clone(),\n        })\n    }\n\n    /// The provider message this envelope describes.\n    #[must_use]\n    pub fn user_message(&self) -> UserMessage {\n        self.attachments.user_message(&self.prompt)\n    }\n\n    /// The transcript text: the prompt plus the attachment note.\n    #[must_use]\n    pub fn display_text(&self) -> String {\n        let note = self.attachments.transcript_note();\n        if note.is_empty() {\n            self.prompt.clone()\n        } else if self.prompt.is_empty() {\n            // An attachments-only prompt: the note is the whole message, so\n            // it must not lead with a blank line or repeat itself.\n            note\n        } else {\n            format!(\"{}\\n\\n{}\", self.prompt, note)\n        }\n    }\n}\n\n/// Cuts `text` to at most `limit` bytes at a character boundary.\nfn cut_at_boundary(text: &str, limit: usize) -> String {\n    if text.len() <= limit {\n        return text.to_owned();\n    }\n    let mut end = limit;\n    while end > 0 && !text.is_char_boundary(end) {\n        end -= 1;\n    }\n    text[..end].to_owned()\n}\n\n/// One fenced code block naming its file.\nfn fenced_file(file: &TextAttachment) -> String {\n    let fence = fence_for(&file.text);\n    let language = language_hint(&file.name);\n    let mut out = format!(\"File: {}\\n{fence}{language}\\n\", file.name);\n    out.push_str(&file.text);\n    if file.truncated {\n        out.push_str(\"\\n… (truncated)\");\n    }\n    out.push('\\n');\n    out.push_str(&fence);\n    out\n}\n\n/// A backtick fence longer than every run in `text`, so a line of backticks or\n/// tildes inside the file cannot close the block early.\nfn fence_for(text: &str) -> String {\n    let mut longest = 0;\n    let mut run = 0;\n    for character in text.chars() {\n        if character == '`' {\n            run += 1;\n            longest = longest.max(run);\n        } else {\n            run = 0;\n        }\n    }\n    \"`\".repeat((longest + 1).max(3))\n}\n\n/// Common fence languages. An unknown extension leaves the info string empty,\n/// which every renderer accepts.\nfn language_hint(name: &str) -> &'static str {\n    let extension = name\n        .rsplit_once('.')\n        .map(|(_, extension)| extension.to_ascii_lowercase())\n        .unwrap_or_default();\n    match extension.as_str() {\n        \"rs\" => \"rust\",\n        \"ts\" | \"mts\" | \"cts\" => \"typescript\",\n        \"tsx\" => \"tsx\",\n        \"js\" | \"mjs\" | \"cjs\" => \"javascript\",\n        \"jsx\" => \"jsx\",\n        \"py\" => \"python\",\n        \"rb\" => \"ruby\",\n        \"go\" => \"go\",\n        \"java\" => \"java\",\n        \"kt\" | \"kts\" => \"kotlin\",\n        \"swift\" => \"swift\",\n        \"c\" | \"h\" => \"c\",\n        \"cc\" | \"cpp\" | \"cxx\" | \"hpp\" => \"cpp\",\n        \"cs\" => \"csharp\",\n        \"php\" => \"php\",\n        \"sh\" | \"bash\" => \"bash\",\n        \"ps1\" => \"powershell\",\n        \"bat\" | \"cmd\" => \"bat\",\n        \"sql\" => \"sql\",\n        \"html\" | \"htm\" => \"html\",\n        \"css\" => \"css\",\n        \"scss\" | \"sass\" => \"scss\",\n        \"json\" => \"json\",\n        \"jsonc\" => \"jsonc\",\n        \"yaml\" | \"yml\" => \"yaml\",\n        \"toml\" => \"toml\",\n        \"xml\" => \"xml\",\n        \"md\" | \"mdx\" => \"markdown\",\n        \"csv\" => \"csv\",\n        \"lua\" => \"lua\",\n        \"r\" => \"r\",\n        \"dart\" => \"dart\",\n        \"ex\" | \"exs\" => \"elixir\",\n        \"erl\" => \"erlang\",\n        \"hs\" => \"haskell\",\n        \"ml\" => \"ocaml\",\n        \"clj\" => \"clojure\",\n        \"scala\" => \"scala\",\n        \"vim\" => \"vim\",\n        \"cmake\" => \"cmake\",\n        \"svelte\" => \"svelte\",\n        \"vue\" => \"vue\",\n        \"proto\" => \"protobuf\",\n        \"gradle\" => \"groovy\",\n        \"dockerfile\" => \"dockerfile\",\n        \"makefile\" => \"makefile\",\n        _ => \"\",\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{\n        AttachError, Attachments, MAX_ATTACHED_IMAGES, MAX_FILE_BYTES, MAX_FILES_BYTES,\n        MAX_MESSAGE_IMAGE_BASE64_BYTES, StoredUserMessage,\n    };\n    use crate::message::ContentBlock;\n\n    fn image() -> Attachments {\n        let mut attachments = Attachments::default();\n        attachments\n            .push_image(\"shot.png\", \"image/png\", \"aGVsbG8=\")\n            .unwrap();\n        attachments\n    }\n\n    #[test]\n    fn images_and_files_become_text_then_image_blocks() {\n        let mut attachments = image();\n        attachments\n            .push_file(\"src/main.rs\", \"fn main() {}\")\n            .unwrap();\n\n        let message = attachments.user_message(\"what does this do?\");\n        let [ContentBlock::Text(text), ContentBlock::Image(image)] = message.content.as_slice()\n        else {\n            panic!(\"expected text then image: {:?}\", message.content);\n        };\n        assert!(text.text.starts_with(\"what does this do?\"));\n        assert!(text.text.contains(\"File: src/main.rs\"));\n        assert!(text.text.contains(\"```rust\"));\n        assert!(text.text.contains(\"fn main() {}\"));\n        assert_eq!(image.mime_type, \"image/png\");\n        assert_eq!(image.data, \"aGVsbG8=\");\n    }\n\n    #[test]\n    fn a_fence_outgrows_every_run_in_the_file() {\n        let mut attachments = Attachments::default();\n        attachments\n            .push_file(\"notes.md\", \"before\\n```\\n~~~\\n````\\nafter\")\n            .unwrap();\n        let text = attachments.user_message(\"go\");\n        let ContentBlock::Text(text) = &text.content[0] else {\n            panic!(\"text block\");\n        };\n        // Longest run is 4, so the block opens and closes with 5.\n        assert!(text.text.contains(\"`````markdown\"), \"{}\", text.text);\n        assert!(text.text.ends_with(\"`````\"), \"{}\", text.text);\n        assert!(text.text.contains(\"~~~\"), \"{}\", text.text);\n    }\n\n    #[test]\n    fn images_share_a_total_budget() {\n        let mut attachments = Attachments::default();\n        // Each image is under the per-image cap; together they are not.\n        let chunk = \"A\".repeat(MAX_MESSAGE_IMAGE_BASE64_BYTES / 3);\n        for index in 0..3 {\n            attachments\n                .push_image(format!(\"shot{index}.png\"), \"image/png\", chunk.clone())\n                .unwrap();\n        }\n        assert_eq!(\n            attachments.push_image(\"shot3.png\", \"image/png\", chunk),\n            Err(AttachError::ImagesTooLarge)\n        );\n    }\n\n    #[test]\n    fn limits_refuse_extra_images_and_oversized_files() {\n        let mut attachments = Attachments::default();\n        for index in 0..MAX_ATTACHED_IMAGES {\n            attachments\n                .push_image(format!(\"{index}.png\"), \"image/png\", \"aGVsbG8=\")\n                .unwrap();\n        }\n        assert_eq!(\n            attachments.push_image(\"extra.png\", \"image/png\", \"aGVsbG8=\"),\n            Err(AttachError::TooManyImages)\n        );\n        assert_eq!(\n            Attachments::default().push_image(\"a.svg\", \"image/svg+xml\", \"<svg/>\"),\n            Err(AttachError::UnsupportedImage)\n        );\n\n        let mut files = Attachments::default();\n        for index in 0..8 {\n            files\n                .push_file(format!(\"{index}.rs\"), \"fn main() {}\")\n                .unwrap();\n        }\n        assert_eq!(\n            files.push_file(\"extra.rs\", \"fn main() {}\"),\n            Err(AttachError::TooManyFiles)\n        );\n        assert_eq!(\n            Attachments::default().push_file(\"huge.txt\", \"x\".repeat(MAX_FILES_BYTES)),\n            Ok(())\n        );\n    }\n\n    #[test]\n    fn an_oversized_file_is_cut_at_a_character_boundary() {\n        let mut attachments = Attachments::default();\n        let text = format!(\"{}汉\", \"a\".repeat(MAX_FILE_BYTES - 1));\n        attachments.push_file(\"big.txt\", text).unwrap();\n        let file = &attachments.files[0];\n        assert!(file.truncated);\n        assert!(file.text.len() <= MAX_FILE_BYTES);\n        assert!(file.text.is_char_boundary(file.text.len()));\n    }\n\n    #[test]\n    fn files_stop_at_the_shared_total() {\n        let mut attachments = Attachments::default();\n        attachments\n            .push_file(\"a.txt\", \"x\".repeat(MAX_FILE_BYTES))\n            .unwrap();\n        attachments\n            .push_file(\"b.txt\", \"x\".repeat(MAX_FILE_BYTES))\n            .unwrap();\n        let total: usize = attachments.files.iter().map(|file| file.text.len()).sum();\n        assert_eq!(total, MAX_FILES_BYTES);\n        assert_eq!(\n            attachments.push_file(\"c.txt\", \"y\"),\n            Err(AttachError::FilesTooLarge)\n        );\n    }\n\n    #[test]\n    fn an_attachments_only_message_shows_the_note_once() {\n        let stored = StoredUserMessage {\n            prompt: String::new(),\n            attachments: image(),\n        };\n        assert_eq!(stored.display_text(), \"[image] shot.png\");\n        let payload = stored.to_payload().expect(\"payload\");\n        let decoded = StoredUserMessage::from_payload(&payload).expect(\"envelope\");\n        assert_eq!(decoded.display_text(), \"[image] shot.png\");\n    }\n\n    #[test]\n    fn the_durable_envelope_round_trips_and_keeps_names() {\n        let mut attachments = image();\n        attachments.push_file(\"main.rs\", \"fn main() {}\").unwrap();\n        let stored = StoredUserMessage {\n            prompt: \"look\".to_owned(),\n            attachments,\n        };\n        let bytes = stored.to_payload().unwrap();\n        let decoded = StoredUserMessage::from_payload(&bytes).expect(\"envelope\");\n        assert_eq!(decoded, stored);\n        assert!(decoded.display_text().contains(\"[image] shot.png\"));\n        assert!(decoded.display_text().contains(\"[file] main.rs\"));\n        assert_eq!(decoded.user_message().content.len(), 2);\n        assert!(StoredUserMessage::from_payload(b\"plain prompt\").is_none());\n        // A prompt that is itself JSON stays text: only the tagged envelope\n        // is read back as a message.\n        assert!(StoredUserMessage::from_payload(br#\"{\"text\":\"just json\"}\"#).is_none());\n        assert!(StoredUserMessage::from_payload(br#\"{\"prompt\":\"hi\"}\"#).is_none());\n        assert!(StoredUserMessage::from_payload(br#\"{\"prompt\":\"hi\",\"attachments\":{}}\"#).is_none());\n        assert!(!String::from_utf8(bytes).unwrap().is_empty());\n    }\n}\n","crates/mycode-desktop/src/workspace/attachments.rs":"//! Pictures and code files waiting for the next prompt: dropping them,\n//! pasting them, and the limits both paths share.\n//!\n//! A file dropped on the composer attaches to the next prompt instead of\n//! switching the project, and a pasted picture attaches the same way. Limits\n//! mirror what hosted vision APIs accept; see [`mycode_frontend::attachments`]. A\n//! folder dropped on the composer binds as the project.\n\nuse std::path::{Path, PathBuf};\n\nuse base64::Engine as _;\nuse base64::engine::general_purpose::STANDARD as BASE64_STANDARD;\nuse gpui_kit::Context;\n\nuse mycode_frontend::{AttachError, MAX_FILE_BYTES, MAX_IMAGE_BYTES};\n\nuse super::Workspace;\nuse super::clipboard;\nuse super::toasts::ToastKind;\nuse crate::i18n::t;\n\n/// Image extensions the composer reads. SVG stays a document: providers do\n/// not decode it as a picture.\nconst IMAGE_EXTENSIONS: [(&str, &str); 5] = [\n    (\"png\", \"image/png\"),\n    (\"jpg\", \"image/jpeg\"),\n    (\"jpeg\", \"image/jpeg\"),\n    (\"webp\", \"image/webp\"),\n    (\"gif\", \"image/gif\"),\n];\n\nimpl Workspace {\n    /// Reads dropped paths into the next prompt, or binds a dropped folder.\n    pub(crate) fn on_drop_attachments(&mut self, paths: &[PathBuf], cx: &mut Context<Self>) {\n        let mut folders = Vec::new();\n        for path in paths {\n            if path.is_dir() {\n                folders.push(path.clone());\n                continue;\n            }\n            self.attach_one(path, cx);\n        }\n        if !folders.is_empty() {\n            self.on_drop_project(&folders, cx);\n        }\n        cx.notify();\n    }\n\n    /// Detaches one waiting attachment, by image or file index.\n    pub(crate) fn on_remove_attachment(\n        &mut self,\n        image_index: Option<usize>,\n        file_index: Option<usize>,\n        cx: &mut Context<Self>,\n    ) {\n        if let Some(index) = image_index\n            && index < self.attachments.images.len()\n        {\n            self.attachments.images.remove(index);\n        }\n        if let Some(index) = file_index\n            && index < self.attachments.files.len()\n        {\n            self.attachments.files.remove(index);\n        }\n        cx.notify();\n    }\n\n    fn attach_one(&mut self, path: &Path, cx: &mut Context<Self>) {\n        let name = path\n            .file_name()\n            .map(|name| name.to_string_lossy().into_owned())\n            .unwrap_or_else(|| path.display().to_string());\n        let extension = path\n            .extension()\n            .map(|extension| extension.to_string_lossy().to_ascii_lowercase())\n            .unwrap_or_default();\n        if IMAGE_EXTENSIONS\n            .iter()\n            .any(|(known, _)| known == &extension.as_str())\n        {\n            if !self.selected_model_takes_images() {\n                self.push_toast(\n                    format!(\n                        \"{name}: {}\",\n                        t(\n                            \"the selected model cannot see images; pick a vision model first\",\n                            \"当前模型看不了图片，请先选择支持图片的模型\"\n                        )\n                    ),\n                    ToastKind::Warning,\n                    cx,\n                );\n                return;\n            }\n            match read_image(path) {\n                Ok((mime, data)) => self.push_picture(name, mime, data, cx),\n                Err(error) => self.push_toast(error, ToastKind::Warning, cx),\n            }\n            return;\n        }\n        match read_text_file(path) {\n            Ok((text, truncated)) => match self.attachments.push_file(name.clone(), text) {\n                Ok(()) => {\n                    // The reader stops at the cap before `push_file` sees the\n                    // excess, so mark the attachment here too.\n                    if truncated && let Some(file) = self.attachments.files.last_mut() {\n                        file.truncated = true;\n                    }\n                }\n                Err(error) => self.toast_attachment_error(&name, error, cx),\n            },\n            Err(error) => self.push_toast(error, ToastKind::Warning, cx),\n        }\n    }\n\n    /// Attaches the picture a paste carries. `true` means the paste was\n    /// consumed, so the composer inserts no text for it.\n    pub(crate) fn on_composer_paste(\n        &mut self,\n        item: &gpui_kit::ClipboardItem,\n        cx: &mut Context<Self>,\n    ) -> bool {\n        match clipboard::pasted(item) {\n            Ok(Some(picture)) => {\n                self.push_picture(picture.file_name(), picture.mime, picture.base64(), cx);\n                true\n            }\n            Ok(None) => false,\n            Err(error) => {\n                self.push_toast(error, ToastKind::Warning, cx);\n                true\n            }\n        }\n    }\n\n    /// Adds one encoded picture, refusing it when the selected model cannot\n    /// see pictures at all.\n    fn push_picture(\n        &mut self,\n        name: String,\n        mime: &'static str,\n        data: String,\n        cx: &mut Context<Self>,\n    ) {\n        if !self.selected_model_takes_images() {\n            let reason = t(\n                \"the selected model cannot see images; pick a vision model first\",\n                \"当前模型看不了图片，请先选择支持图片的模型\",\n            );\n            self.push_toast(format!(\"{name}: {reason}\"), ToastKind::Warning, cx);\n            return;\n        }\n        if let Err(error) = self.attachments.push_image(name.clone(), mime, data) {\n            self.toast_attachment_error(&name, error, cx);\n        }\n        cx.notify();\n    }\n\n    /// Whether the selected catalog model advertises image input. A catalog\n    /// entry that has not loaded yet is unknown, so the provider decides.\n    pub(super) fn selected_model_takes_images(&self) -> bool {\n        let Some(provider) = self.vm().selected_provider.as_deref() else {\n            return true;\n        };\n        let Some(model) = self.vm().selected_model.as_deref() else {\n            return true;\n        };\n        self.vm()\n            .catalog\n            .as_ref()\n            .and_then(|catalog| catalog.model(provider, model))\n            .is_none_or(|model| model.attachment)\n    }\n\n    /// Puts attachments a failed send handed back into the composer.\n    pub(crate) fn on_attachments_restored(\n        &mut self,\n        attachments: mycode_frontend::Attachments,\n        cx: &mut Context<Self>,\n    ) {\n        for image in attachments.images {\n            let name = image.name.clone();\n            if let Err(error) =\n                self.attachments\n                    .push_image(image.name, &image.mime_type, image.data)\n            {\n                self.toast_attachment_error(&name, error, cx);\n            }\n        }\n        for file in attachments.files {\n            let name = file.name.clone();\n            match self.attachments.push_file(file.name, file.text) {\n                Ok(()) => {\n                    // `push_file` sees the text alone; the reader marked the\n                    // cut before the send, so carry the flag back.\n                    if file.truncated\n                        && let Some(last) = self.attachments.files.last_mut()\n                    {\n                        last.truncated = true;\n                    }\n                }\n                Err(error) => self.toast_attachment_error(&name, error, cx),\n            }\n        }\n        cx.notify();\n    }\n\n    fn toast_attachment_error(&mut self, name: &str, error: AttachError, cx: &mut Context<Self>) {\n        let reason = match error {\n            AttachError::TooManyImages => t(\n                \"too many images: at most 4 per message\",\n                \"图片太多了：每条消息最多 4 张\",\n            ),\n            AttachError::ImageTooLarge => t(\"image is larger than 3.75 MB\", \"图片超过 3.75 MB\"),\n            AttachError::ImagesTooLarge => {\n                t(\"the pictures together exceed 6 MB\", \"图片总计超过 6 MB\")\n            }\n            AttachError::UnsupportedImage => t(\"unsupported image type\", \"不支持这种图片格式\"),\n            AttachError::TooManyFiles => t(\n                \"too many files: at most 8 per message\",\n                \"文件太多了：每条消息最多 8 个\",\n            ),\n            AttachError::NotText => t(\"only text or code files\", \"只能附加文本或代码文件\"),\n            AttachError::FilesTooLarge => t(\n                \"attached files together exceed 512 KB\",\n                \"附件总计超过 512 KB\",\n            ),\n        };\n        self.push_toast(format!(\"{name}: {reason}\"), ToastKind::Warning, cx);\n    }\n}\n\n/// Reads one image as base64, refusing anything over the raw cap. The media\n/// type comes from the bytes, not the extension: a renamed JPEG is still a\n/// JPEG to the provider.\nfn read_image(path: &Path) -> Result<(&'static str, String), String> {\n    let length = std::fs::metadata(path)\n        .map_err(|error| format!(\"{}: {error}\", path.display()))?\n        .len();\n    if length > MAX_IMAGE_BYTES as u64 {\n        return Err(format!(\n            \"{}: {}\",\n            path.display(),\n            t(\"image is larger than 3.75 MB\", \"图片超过 3.75 MB\")\n        ));\n    }\n    let bytes = std::fs::read(path).map_err(|error| format!(\"{}: {error}\", path.display()))?;\n    let mime = mycode_frontend::image_media_type(&bytes).ok_or_else(|| {\n        format!(\n            \"{}: {}\",\n            path.display(),\n            t(\"unsupported image type\", \"不支持这种图片格式\")\n        )\n    })?;\n    Ok((mime, BASE64_STANDARD.encode(bytes)))\n}\n\n/// Reads one text file, stopping at the per-file cap and reporting whether\n/// there was more. A cut that lands inside a multi-byte character drops only\n/// the partial character; a file that is genuinely not UTF-8 is refused.\nfn read_text_file(path: &Path) -> Result<(String, bool), String> {\n    use std::io::Read as _;\n\n    let file = std::fs::File::open(path).map_err(|error| format!(\"{}: {error}\", path.display()))?;\n    let mut bytes = Vec::with_capacity(MAX_FILE_BYTES + 4);\n    file.take((MAX_FILE_BYTES + 4) as u64)\n        .read_to_end(&mut bytes)\n        .map_err(|error| format!(\"{}: {error}\", path.display()))?;\n    if bytes.iter().take(8192).any(|byte| *byte == 0) {\n        return Err(format!(\n            \"{}: {}\",\n            path.display(),\n            t(\n                \"binary file; only text or code\",\n                \"二进制文件；只支持文本或代码\"\n            )\n        ));\n    }\n    let truncated = bytes.len() > MAX_FILE_BYTES;\n    let cut = MAX_FILE_BYTES.min(bytes.len());\n    match std::str::from_utf8(&bytes[..cut]) {\n        Ok(text) => Ok((text.to_owned(), truncated)),\n        // Only the character straddling the cap may be dropped. Any other\n        // invalid sequence means the file is not UTF-8 text.\n        Err(error) if truncated && error.valid_up_to() + 4 > cut => {\n            let valid = error.valid_up_to();\n            let text = std::str::from_utf8(&bytes[..valid])\n                .expect(\"the prefix before an invalid sequence is valid\");\n            Ok((text.to_owned(), true))\n        }\n        Err(_) => Err(format!(\n            \"{}: {}\",\n            path.display(),\n            t(\"not UTF-8 text\", \"不是 UTF-8 文本\")\n        )),\n    }\n}\n","crates/mycode-desktop/src/ui/settings.rs":"//! The full-page settings shell: a top bar back to the desk, a grouped left\n//! nav, and a sectioned content pane.\n//!\n//! Rendering order matters: entities are created and row lists materialized\n//! with `&mut Context` first, and only then is `cx.theme()` borrowed for the\n//! layout pass.\nmod about;\nmod agents;\nmod data;\nmod general;\nmod mcp;\nmod models;\nmod shortcuts;\nmod skills;\nmod widgets;\n\npub(crate) use mcp::McpForm;\n\nuse gpui_kit::assets::IconName;\nuse gpui_kit::component::Icon;\nuse gpui_kit::component::input::Input;\nuse gpui_kit::component::theme::Theme;\nuse gpui_kit::component::{ActiveTheme as _, Sizable as _};\nuse gpui_kit::prelude::FluentBuilder as _;\nuse gpui_kit::{\n    AnyElement, Context, InteractiveElement, IntoElement, ParentElement,\n    StatefulInteractiveElement, Styled, Window, div, px,\n};\n\nuse crate::i18n::t;\nuse crate::view_model::{MainView, SettingsSection, UpdateState};\nuse crate::workspace::Workspace;\n\npub(super) fn render_settings_view(\n    workspace: &mut Workspace,\n    window: &mut Window,\n    cx: &mut Context<Workspace>,\n) -> AnyElement {\n    workspace.ensure_agent_roles();\n    let search = workspace.settings_search_input(window, cx);\n    let section = workspace.vm().settings_section;\n    let query = workspace.vm().settings_query.clone();\n    let settings_ready = workspace.vm().settings.is_some();\n    let nav = render_settings_nav(workspace, section, &query, cx).into_any_element();\n    let theme = cx.theme();\n    div()\n        .id(\"settings-view\")\n        .flex_1()\n        .min_w_0()\n        .h_full()\n        .flex()\n        .flex_col()\n        .child(\n            // The window title already says Settings. This row is only the\n            // back control and the search field.\n            div()\n                .id(\"settings-header\")\n                .h(px(44.))\n                .flex()\n                .flex_row()\n                .items_center()\n                .justify_between()\n                .px_4()\n                .gap_3()\n                .border_b_1()\n                .border_color(crate::ui::skin::glass_border(theme))\n                .bg(crate::ui::skin::glass(theme))\n                .child(\n                    div()\n                        .id(\"settings-back\")\n                        .flex_shrink_0()\n                        .flex()\n                        .flex_row()\n                        .items_center()\n                        .gap_2()\n                        .h(px(28.))\n                        .px(px(6.))\n                        .rounded(px(8.))\n                        .cursor_pointer()\n                        .text_color(theme.foreground)\n                        .hover(|this| this.bg(crate::ui::skin::frost_hover(theme)))\n                        .on_click(cx.listener(|workspace, _, _, cx| {\n                            workspace.on_show_main_view(MainView::Chat, cx);\n                        }))\n                        .child(Icon::new(IconName::ArrowLeft).with_size(px(16.)))\n                        .child(div().text_sm().child(t(\"Back to desk\", \"返回工作台\")))\n                        .child(\n                            div()\n                                .px(px(6.))\n                                .h(px(18.))\n                                .flex()\n                                .items_center()\n                                .rounded(px(4.))\n                                .border_1()\n                                .border_color(theme.border)\n                                .text_xs()\n                                .text_color(theme.muted_foreground)\n                                .child(\"Esc\"),\n                        ),\n                )\n                .child(\n                    div()\n                        .w(px(220.))\n                        .h(px(32.))\n                        .flex_shrink_0()\n                        .text_sm()\n                        .child(Input::new(&search)),\n                ),\n        )\n        .child(\n            div()\n                .id(\"settings-body\")\n                .flex_1()\n                .min_h_0()\n                .flex()\n                .flex_row()\n                .child(nav)\n                .child(\n                    div()\n                        .id(\"settings-content\")\n                        .flex_1()\n                        .min_w_0()\n                        .min_h_0()\n                        .h_full()\n                        .overflow_y_scroll()\n                        .bg(crate::ui::skin::ambient(theme))\n                        // The scrollport fills the pane. Its page is a flex\n                        // item with no grow, so the cards stay as tall as\n                        // their content instead of stretching to this viewport.\n                        .flex()\n                        .flex_col()\n                        .justify_start()\n                        .child(super::motion::fade_in(\n                            format!(\"settings-page-{}\", settings_page_key(workspace)),\n                            cx.reduce_motion(),\n                            div()\n                                .id(\"settings-content-inner\")\n                                .mx_auto()\n                                .max_w(px(960.))\n                                .w_full()\n                                .h_auto()\n                                .flex_none()\n                                .flex()\n                                .flex_col()\n                                .justify_start()\n                                .gap(crate::ui::skin::space(6))\n                                .px_6()\n                                .py_4()\n                                .child(\n                                    div()\n                                        .id(\"settings-page-header\")\n                                        .w_full()\n                                        .h_auto()\n                                        .flex_none()\n                                        .flex()\n                                        .flex_col()\n                                        .gap_1()\n                                        .pb_1()\n                                        .child(\n                                            div()\n                                                .text_lg()\n                                                .font_weight(crate::ui::skin::WEIGHT_STRONG)\n                                                .child(section.label()),\n                                        )\n                                        .child(\n                                            div()\n                                                .text_sm()\n                                                .text_color(theme.muted_foreground)\n                                                .whitespace_normal()\n                                                .child(section.hint()),\n                                        ),\n                                )\n                                .when(!settings_ready, |this| {\n                                    this.child(div().text_sm().opacity(0.6).child(t(\n                                        \"Loading settings\\u{2026}\",\n                                        \"正在加载设置\\u{2026}\",\n                                    )))\n                                })\n                                .when(settings_ready, |this| {\n                                    this.child(match section {\n                                        SettingsSection::General => {\n                                            general::render_general_section(workspace, window, cx)\n                                        }\n                                        SettingsSection::Shortcuts => {\n                                            shortcuts::render_shortcuts_section(cx)\n                                        }\n                                        SettingsSection::Models => {\n                                            models::render_models_section(workspace, window, cx)\n                                        }\n                                        SettingsSection::Agents => {\n                                            agents::render_agents_section(workspace, window, cx)\n                                        }\n                                        SettingsSection::Skills => {\n                                            skills::render_skills_section(workspace, cx)\n                                        }\n                                        SettingsSection::Mcp => {\n                                            mcp::render_mcp_section(workspace, window, cx)\n                                        }\n                                        SettingsSection::Data => {\n                                            data::render_data_section(workspace, cx)\n                                        }\n                                        SettingsSection::About => {\n                                            about::render_about_section(workspace, cx)\n                                        }\n                                    })\n                                }),\n                        )),\n                ),\n        )\n        .into_any_element()\n}\n\n/// Identity of the settings page that should fade in. Menus are left out so\n/// opening a dropdown does not replay the fade.\nfn settings_page_key(workspace: &Workspace) -> String {\n    let vm = workspace.vm();\n    match vm.settings_section {\n        SettingsSection::Models => match vm.models_subview {\n            crate::view_model::ModelsSubview::List => \"magpie-list\".to_owned(),\n            crate::view_model::ModelsSubview::Catalog => \"magpie-models\".to_owned(),\n        },\n        SettingsSection::Mcp => match vm.mcp_subview {\n            crate::view_model::McpSubview::List => \"mcp-list\".to_owned(),\n            crate::view_model::McpSubview::Json => \"mcp-json\".to_owned(),\n            crate::view_model::McpSubview::Custom => \"mcp-custom\".to_owned(),\n        },\n        other => other.id().to_owned(),\n    }\n}\n\n/// What the nav shows beside each section: a count and/or a status lamp.\n#[derive(Clone, Copy, Default)]\nstruct NavBadge {\n    /// Right-aligned count figure (configured providers, enabled servers).\n    count: Option<usize>,\n    /// Attention lamp (an update is waiting, a provider has no key).\n    lamp: Option<gpui_kit::Hsla>,\n}\n\n/// Per-section badges derived from live state.\nfn nav_badges(workspace: &Workspace, cx: &Context<Workspace>) -> Vec<(SettingsSection, NavBadge)> {\n    let theme = cx.theme();\n    let desk = crate::ui::desk::Desk::of(theme);\n    let vm = workspace.vm();\n    let settings = vm.settings.as_ref();\n    // Configured servers plus magpie's, minus the ones a configured row\n    // already shadows: the count is the catalog the agent actually loads.\n    let servers = settings.map(|configured| {\n        configured.mcp_servers.iter().filter(|m| m.enabled).count()\n            + vm\n                .mcp_library\n                .iter()\n                .filter(|server| {\n                    server.enabled\n                        && !configured\n                            .mcp_servers\n                            .iter()\n                            .any(|row| row.id == server.id)\n                })\n                .count()\n    });\n    let magpie = settings.map(|s| s.magpie.clone()).unwrap_or_default();\n    let models = vm\n        .catalog\n        .as_ref()\n        .and_then(|catalog| catalog.provider(mycode_frontend::MAGPIE_PROVIDER_ID))\n        .map(|provider| provider.models.len());\n    let magpie_lamp = if !magpie.is_active() || models == Some(0) {\n        Some(desk.amber)\n    } else {\n        None\n    };\n    let update_lamp = match vm.update {\n        UpdateState::Available { .. } | UpdateState::Ready { .. } => Some(desk.amber),\n        // A failed check is the top-right toast. The About row stays\n        // quiet instead of painting a red lamp or the transport error.\n        _ => None,\n    };\n    vec![\n        (SettingsSection::General, Nav
